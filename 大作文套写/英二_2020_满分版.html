al strategies for {{S07_A}}: as this principle takes root, {{S07_B}}.","filled":"This is in line with national strategies for building a learning society: as this principle takes root, more people participate in lifelong learning.","slots":[{"id":"S07_A","label":"相关战略","value":"building a learning society","translation":"建设学习型社会"},{"id":"S07_B","label":"社会变化","value":"more people participate in lifelong learning","translation":"更多人参与终身学习"}]},{"id":"S08","number":8,"paragraph":3,"template":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when {{S08_A}} guides action.","filled":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when lifelong learning guides action.","slots":[{"id":"S08_A","label":"主题词","value":"lifelong learning","translation":"终身学习"}]},{"id":"S09","number":9,"paragraph":3,"template":"Promoting this principle is therefore not merely advisable but essential for holistic development.","filled":"Promoting this principle is therefore not merely advisable but essential for holistic development.","slots":[]}],"teaching":{"analysis":[{"lines":["题注说明统计对象是某高校学生，统计内容是手机阅读的目的。四个比例是同一次调查中的不同类别。","学习知识占59.5%，超过一半；消磨时间、获取信息和其他目的分别占21.3%、17.0%和2.2%。学习知识最突出。"],"emphasis":[["某高校学生","手机阅读的目的"],["学习知识占59.5%","超过一半"]]},{"lines":["比例最高的一项表明，手机阅读可以围绕求知展开。手机是工具，阅读是途径，获取知识才是这里要抓住的目的。","评论可以顺着这种用途讨论：把阅读放进日常生活，反复接触、理解新内容，逐渐形成持续求知的习惯。"],"emphasis":[["手机是工具","阅读是途径","获取知识"],["放进日常生活","持续求知的习惯"]]},{"lines":["这种学习习惯可以继续延伸到不同生活阶段：遇到新问题时仍愿意寻找知识、更新理解，学习就不只是一项在校任务。","因此本文采用“终身学习”，倡导把眼前的手机阅读求知延续为长期的学习行动。后文再讨论这种行动的个人和社会作用。"],"emphasis":[["不同生活阶段","寻找知识、更新理解"],["终身学习","长期的学习行动"]]}],"sentences":[{"id":"S01","decisionLines":["圆形图被分成不同扇区，用面积呈现各类目的占比，所以图表名称选择“饼图”。","这里比较学习知识、消磨时间等不同类别的比例，描述的是类别之间的差异，选择“差异”。","评论方向已经由阅读求知延伸为持续学习，这一句填写已确定的“终身学习”。"],"emphasis":[["饼图"],["不同类别的比例","差异"],["持续学习","终身学习"]]},{"id":"S02","decisionLines":["先读题注：调查的是某高校学生用手机阅读的目的，因此句首先交代阅读工具、目的和受访学生范围。","59.5%是最大的比例，对应学习知识；先写这一项，突出本题的主要用途。","另外三项按消磨时间、获取信息、其他目的排列，对应21.3%、17.0%、2.2%。后面的数字保持同一顺序，才能逐项对应。"],"emphasis":[["某高校学生用手机阅读的目的"],["59.5%","学习知识"],["消磨时间、获取信息、其他目的","21.3%、17.0%、2.2%","同一顺序"]]},{"id":"S03","decisionLines":["第一段已经把阅读求知作为主要用途，并由此提出持续学习的方向。中间段接着讨论这种做法有什么意义。","总起句继续填写“终身学习”，下面再分别写个人怎样学、教育怎样支持，以及知识怎样进入共同生活。"],"emphasis":[["阅读求知","持续学习"],["终身学习","个人怎样学"]]},{"id":"S04","decisionLines":["题注给出手机阅读，最大类别给出学习知识。把工具、途径和目的连起来，个人行为就写“利用手机通过阅读获取知识”，按题意组织。","理解阅读中的概念、把新知识与已有经验联系起来，可以练习理解能力；接触不同领域的内容，也能看到更多生活经验和思考角度。因此成果写认知能力提升与视野拓宽。","成果分别取文明语料中的认知能力和广阔视野两部分，合成一句；行为仍使用由题目组织的具体做法。"],"emphasis":[["工具、途径和目的","利用手机通过阅读获取知识"],["练习理解能力","更多生活经验和思考角度","认知能力提升与视野拓宽"],["认知能力和广阔视野","由题目组织"]]},{"id":"S05","decisionLines":["前句重在阅读带来的理解能力。教育如果帮助人们选择、理解阅读内容，并保持主动求知的习惯，就在培养人的综合能力，因此相关领域可以写“素质教育”。","这种支持可指向长期保持学习；当阅读涉及文化作品和不同生活经验时，也能帮助人理解其中的观念与表达方式，因此能力处写持续学习与文化素养。","两个空分别对应文明类的素质教育，以及持续学习并培养文化素养的表达。"],"emphasis":[["理解阅读内容","综合能力","素质教育"],["长期保持学习","理解其中的观念与表达方式","持续学习与文化素养"],["素质教育","持续学习并培养文化素养"]]},{"id":"S06","decisionLines":["阅读所得可以成为交流的话题：人们分享知识、讨论不同经验，个人积累就进入共同的文化活动，因此可以写“丰富文化生活”。","把读到的知识与自己的经验联系起来，还可能形成新的想法，并通过讲述或写作表达出来；这一步对应“促进创意表达”。","两层意思分别取文明类社会效果中有关文化生活和创意表达的部分，用同一句连接。"],"emphasis":[["分享知识、讨论不同经验","丰富文化生活"],["形成新的想法","讲述或写作","促进创意表达"],["文化生活和创意表达"]]},{"id":"S07","decisionLines":["前面写个人利用日常工具求知，也写知识进入交流与表达。把这种学习机会和参与推广到更多人，就可以联系“建设学习型社会”。","当更多人愿意在日常生活中继续阅读、交流和更新知识，社会层面的变化便是更多人参与持续学习。两个空分别写支持方向和希望形成的参与。"],"emphasis":[["推广到更多人","建设学习型社会"],["阅读、交流和更新知识","更多人参与持续学习"]]},{"id":"S08","decisionLines":["前文从手机阅读写到个人理解能力，再讨论教育支持和共同文化生活，两个层面都围绕持续求知展开。","结尾因此继续填写“终身学习”，把个人收益和共同生活的意义归到同一个主题。"],"emphasis":[["手机阅读","持续求知"],["终身学习","个人收益和共同生活"]]},{"id":"S09","decisionLines":["上一句已经概括终身学习对个人和共同生活的意义，最后一句接着提出应当倡导这一方向。","“这一原则”仍指终身学习，整句按固定模板写出，以“全面发展”收束全文。"],"emphasis":[["倡导这一方向"],["终身学习","全面发展"]]}]},"corpus":{"entries":[{"id":"C_HX_BEHAVIOR_01","value":"和谐","group":"个人行为","text":"balance competing demands and maintain healthy relationships","zh":"平衡各种相互冲突的需求，并维持良好的关系"},{"id":"C_HX_BEHAVI <script>'use strict';
function createLessonPlan(data){
 const steps=[{kind:'type'}];
 data.teaching.analysis.forEach((_,i)=>steps.push({kind:'analysis',count:i+1}));
 data.sentences.forEach((sentence,i)=>{
  if(!sentence.slots.length){steps.push({kind:'complete',sentence:i});return;}
  const callsCorpus=sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  for(const kind of ['template','decision',...(callsCorpus?['corpus']:[]),'complete'])steps.push({kind,sentence:i});
 });
 steps.push({kind:'essay'});
 const entries=[0,1,...[1,2,3].map(p=>steps.findIndex(s=>s.sentence!==undefined&&data.sentences[s.sentence].paragraph===p)),steps.findIndex(s=>s.kind==='essay')];
 function view(index){
  const state=steps[index],sentence=state.sentence===undefined?null:data.sentences[state.sentence];
  const completed=state.kind==='essay'?data.sentences.length:sentence?state.sentence+(state.kind==='complete'?1:0):0;
  const callsCorpus=!!sentence&&sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  return {state,sentence,completed,callsCorpus,hasDraft:!!sentence&&state.kind!=='complete',showDecision:['decision','corpus'].includes(state.kind),sourceTab:callsCorpus&&['corpus','complete'].includes(state.kind)?'corpus':'template',themeVisible:index>=data.teaching.analysis.length,chapter:state.kind==='type'?0:state.kind==='analysis'?1:state.kind==='essay'?5:sentence.paragraph+1};
 }
 return {steps,entries,view};
}
globalThis.createLessonPlan=createLessonPlan;
</script>
