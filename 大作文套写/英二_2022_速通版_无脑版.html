<script id="lesson-data" type="application/json">{"title":"2022 英语（二） · 速通版 · 无脑版","questionType":"图表题","typeDetail":"条形图比较2018—2020年全国与农村快递业务量。","theme":{"en":"improving rural life","zh":"改善乡村生活"},"questionEvidence":[[[190,568,520,55],[580,414,81,55]],[[303,392,29,174],[496,303,29,263],[328,505,28,61],[521,451,29,115]],[[328,505,28,61],[423,499,29,67],[521,451,29,115]]],"sentences":[{"id":"S01","number":1,"paragraph":1,"template":"Though deceptively simple, this {{S01_A}} conveys a meaningful message: {{S01_B}}.","filled":"Though deceptively simple, this bar chart conveys a meaningful message: between 2018 and 2020, the number of parcels delivered nationwide rose from about 51 billion to around 83 billion, while that in rural areas increased sharply from roughly 12 billion to approximately 30 billion.","slots":[{"id":"S01_A","label":"图表名称","value":"bar chart","translation":"条形图"},{"id":"S01_B","label":"题面描述","value":"between 2018 and 2020, the number of parcels delivered nationwide rose from about 51 billion to around 83 billion, while that in rural areas increased sharply from roughly 12 billion to approximately 30 billion","translation":"2018—2020年全国快递业务量从约510亿件增至约830亿件，农村从约120亿件增至约300亿件。"}]},{"id":"S02","number":2,"paragraph":1,"template":"It serves as a compelling testament to the significance of {{S02_A}}.","filled":"It serves as a compelling testament to the significance of improving rural life.","slots":[{"id":"S02_A","label":"主题词","value":"improving rural life","translation":"改善乡村生活"}]},{"id":"S03","number":3,"paragraph":2,"template":"To begin with, experience suggests that this {{S03_A}} can be explained in part by people's desire to {{S03_B}}.","filled":"To begin with, experience suggests that this trend can be explained in part by people's desire to buy and send goods through delivery services.","slots":[{"id":"S03_A","label":"比较关系","value":"trend","translation":"趋势"},{"id":"S03_B","label":"具体行为","value":"buy and send goods through delivery services","translation":"通过快递购买和寄送商品"}]},{"id":"S04","number":4,"paragraph":2,"template":"This is hardly surprising, as people tend to favour behaviour they believe will have desirable consequences.","filled":"This is hardly surprising, as people tend to favour behaviour they believe will have desirable consequences.","slots":[]},{"id":"S05","number":5,"paragraph":2,"template":"However, we should recognise that social conditions fundamentally shape the choices available to individuals.","filled":"However, we should recognise that social conditions fundamentally shape the choices available to individuals.","slots":[]},{"id":"S06","number":6,"paragraph":2,"template":"From this perspective, it is the promotion of national strategies for {{S06_A}} that provides impetus for these developments.","filled":"From this perspective, it is the promotion of national strategies for rural revitalization that provides impetus for these developments.","slots":[{"id":"S06_A","label":"相关战略","value":"rural revitalization","translation":"乡村振兴"}]},{"id":"S07","number":7,"paragraph":2,"template":"An article published by {{S07_A}} lends support to the view that {{S07_B}} plays an important role in fostering community prosperity.","filled":"An article published by Nankai University lends support to the view that improving rural life plays an important role in fostering community prosperity.","slots":[{"id":"S07_A","label":"文章发布机构","value":"Nankai University","translation":"南开大学"},{"id":"S07_B","label":"主题词","value":"improving rural life","translation":"改善乡村生活"}]},{"id":"S08","number":8,"paragraph":3,"template":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when {{S08_A}} guides action.","filled":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when improving rural life guides action.","slots":[{"id":"S08_A","label":"主题词","value":"improving rural life","translation":"改善乡村生活"}]},{"id":"S09","number":9,"paragraph":3,"template":"Promoting this principle is therefore not merely advisable but essential for holistic development.","filled":"Promoting this principle is therefore not merely advisable but essential for holistic development.","slots":[]}],"teaching":{"analysis":[{"lines":["题注给出2018—2020年与快递业务量，图例区分全国总体和农村。单位是十亿件，每组柱比较同一年的两个范围。","全国数值依次为51、64、83，农村为12、15、30。全国业务扩大时，农村业务也在增长，后文可以把农村这一部分作为评论重点。"],"emphasis":[["2018—2020年","十亿件"],[]]},{"lines":["首尾相比，全国从51增至83，农村从12增至30；农村到2020年达到2018年的2.5倍，表现出明显扩大的寄递规模。","快递可以把购买的商品送入乡村，也可以把本地产品送往外部市场。由业务规模，可以转向讨论生活便利和商品流通。"],"emphasis":[["2.5倍"],["生活便利和商品流通"]]},{"lines":["农村收寄业务与居民买东西、寄送物品有关，服务越方便，处理这些生活事务就越省事。评论可以紧扣这些日常用途。","因此主题写改善乡村生活，后文先说明个人怎样使用快递，再讨论乡村服务条件怎样支持这种便利。"],"emphasis":[[],["改善乡村生活"]]}],"sentences":[{"id":"S01","decisionLines":["图中用柱高显示不同年份的数量，图表名称选条形图。描述先限定2018至2020年，再比较全国和农村的同一指标。","题注单位是十亿件：全国首尾数值为51和83，农村为12和30，分别对应510亿至830亿件、120亿至300亿件。描述按这两组起止值组织。","两组都增加，农村达到原来的2.5倍，可以突出其明显增长；把年份、指标及两个范围的变化合成一个完整题面描述。"],"emphasis":[["条形图"],["十亿件"],["2.5倍"]]},{"id":"S02","decisionLines":["农村寄递可以帮助居民购买所需商品、寄送物品，服务的日常用途是让这些事情办理起来更方便。","顺着这一用途，主题填写改善乡村生活，将快递业务联系到居民每天的实际需要。"],"emphasis":[["更方便"],["改善乡村生活"]]},{"id":"S03","decisionLines":["图中全国与农村的快递数量连续三年变化，描述的是随时间变化的趋势，因此选择趋势这一模板选项。","快递能送来购买的物品，也能将要寄出的商品送走。居民希望办妥这些日常事务，就会产生使用寄递服务的需要。","因此行为处写通过快递购买和寄送商品，用个人的这种愿望解释业务变化的一部分，具体做法按题面寄递场景组织。"],"emphasis":[["随时间变化的趋势"],[],["通过快递购买和寄送商品"]]},{"id":"S04","decisionLines":["前句写购买和寄送商品。通过寄递完成这些事务，能方便取得所需物品、把东西送到目的地，形成使用服务的积极期待。","因此保留固定句，用对便利的期待解释居民为什么愿意采用前面所说的做法。"],"emphasis":[[],["对便利的期待"]]},{"id":"S05","decisionLines":["希望收寄方便，还需要服务站点、运输线路与配送网络。这些条件决定寄件能否接收、商品能否送达。","固定转折句因此把讨论从个人需要推进到乡村寄递的支持条件，下一句再说明相应的发展方向。"],"emphasis":[["服务站点、运输线路与配送网络"],["乡村寄递的支持条件"]]},{"id":"S06","decisionLines":["前句说明收寄需要乡村站点与运输网络。完善这些服务条件，能帮助居民取得商品、寄出物品，把生活需要变成可实现的行动。","将服务建设放进乡村整体发展，战略处可以填写乡村振兴，用这一方向联系基础条件和居民生活便利。","表达这一含义时，调用和谐类相关战略中的乡村振兴条目，使用原有表达。"],"emphasis":[[],["乡村振兴"],["乡村振兴条目"]]},{"id":"S07","decisionLines":["这一处填写文章的发布机构，本句使用南开大学的名称；后面的主题空继续回扣乡村居民的生活需要。","收寄方便能帮助家庭处理日常事务；较可靠的服务网络也能供更多居民共同使用，支持村里商品交流与生活往来。","因此继续填写改善乡村生活，把单个家庭的便利与乡村共同受益联系起来。"],"emphasis":[["文章的发布机构","南开大学"],[],["改善乡村生活"]]},{"id":"S08","decisionLines":["前文把居民的购买与寄送需要、乡村服务网络及共同使用的好处连在一起，都围绕日常生活怎样更方便展开。","因此结尾继续填写改善乡村生活，汇合个人便利与共同受益两个层面。"],"emphasis":[["日常生活怎样更方便"],["改善乡村生活"]]},{"id":"S09","decisionLines":["上一句已经总结改善乡村生活对个人和共同体的作用，最后一句接着提出应当倡导这一方向。","“这一原则”回指前面的乡村主题，整句保留固定表达，以全面发展结束全文。"],"emphasis":[["应当倡导这一方向"],["全面发展"]]}]},"corpus":{"entries":[{"id":"C_HX_BEHAVIOR_01","value":"和谐","group":"个人行为","text":"balance competing demands and maintain healthy relationships","zh":"平衡各种相互冲突的需求，并维持良好的关系"},{"id":"C_HX_BEHAVIOR_02","value":"和谐","group":"个人行为","text":"resolve conflicts peacefully and prioritize what truly matters","zh":"和平解决争端，并优先考虑真正重要的事情"},{"id":"C_HX_BEHAVIOR_03","value":"和谐","group":"个人行为","text":"connect genuinely with others and nurture community bonds","zh":"真诚地与他人建立联系，并加强社区间的纽带关系"},{"id":"C_HX_BEHAVIOR_04","value":"和谐","group":"个人行为","text":"make use of public services and facilities","zh":"利用公共服务和设施"},{"id":"C_HX_BEHAVIOR_05","value":"和谐","group":"个人行为","text":"conserve resources and protect the environment","zh":"节约资源并保护环境"},{"id":"C_HX_RESULT_01","value":"和谐","group":"个人成果","text":"inner peace and overall well-being","zh":"内心平静与整体福祉"},{"id":"C_HX_RESULT_02","value":"和谐","group":"个人成果","text":"stable relationships and reduced stress","zh":"稳定的关系和减轻的压力"},{"id":"C_HX_RESULT_03","value":"和谐","group":"个人成果","text":"a fulfilling life and personal satisfaction","zh":"充实的生活与个人满足感"},{"id":"C_HX_FIELD_01","value":"和谐","group":"政策领域","text":"livable city development","zh":"宜居城市建设"},{"id":"C_HX_FIELD_02","value":"和谐","group":"政策领域","text":"public health and well-being","zh":"公共健康与福祉"},{"id":"C_HX_FIELD_03","value":"和谐","group":"政策领域","text":"sustainable urban development","zh":"城市可持续发展"},{"id":"C_HX_ABILITY_01","value":"和谐","group":"政策能力","text":"balance work and life while maintaining harmonious relationships","zh":"在保持良好人际关系的同时平衡 <script>'use strict';
function createLessonPlan(data){
 const steps=[{kind:'type'}];
 data.teaching.analysis.forEach((_,i)=>steps.push({kind:'analysis',count:i+1}));
 data.sentences.forEach((sentence,i)=>{
  if(!sentence.slots.length){steps.push({kind:'complete',sentence:i});return;}
  const callsCorpus=sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  for(const kind of ['template','decision',...(callsCorpus?['corpus']:[]),'complete'])steps.push({kind,sentence:i});
 });
 steps.push({kind:'essay'});
 const entries=[0,1,...[1,2,3].map(p=>steps.findIndex(s=>s.sentence!==undefined&&data.sentences[s.sentence].paragraph===p)),steps.findIndex(s=>s.kind==='essay')];
 function view(index){
  const state=steps[index],sentence=state.sentence===undefined?null:data.sentences[state.sentence];
  const completed=state.kind==='essay'?data.sentences.length:sentence?state.sentence+(state.kind==='complete'?1:0):0;
  const callsCorpus=!!sentence&&sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  return {state,sentence,completed,callsCorpus,hasDraft:!!sentence&&state.kind!=='complete',showDecision:['decision','corpus'].includes(state.kind),sourceTab:callsCorpus&&['corpus','complete'].includes(state.kind)?'corpus':'template',themeVisible:index>=data.teaching.analysis.length,chapter:state.kind==='type'?0:state.kind==='analysis'?1:state.kind==='essay'?5:sentence.paragraph+1};
 }
 return {steps,entries,view};
}
globalThis.createLessonPlan=createLessonPlan;
</script>

 let drag=null;
 divider.onpointerdown=function(e){if(!media.matches)return originalDrag.onpointerdown(e);if(e.button!==0||e.isPrimary===false)return;e.preventDefault();drag={id:e.pointerId,y:e.clientY,height:ref.getBoundingClientRect().height};mobileCollapsed=false;divider.setPointerCapture(e.pointerId);document.body.classList.add('resizing');};
 divider.onpointermove=function(e){if(!media.matches)return originalDrag.onpointermove(e);if(!drag||drag.id!==e.pointerId)return;mobileRatio=clamp((drag.height+e.clientY-drag.y)/Math.max(1,layout.clientHeight),.25,.60);syncMobile(false);};
 function stopDrag(e){if(!media.matches&&originalDrag.onpointerup)originalDrag.onpointerup(e);drag=null;document.body.classList.remove('resizing');}
 divider.onpointerup=stopDrag;divider.onpointercancel=stopDrag;divider.onlostpointercapture=stopDrag;
 divider.ondblclick=function(e){if(!media.matches)return originalDrag.ondblclick(e);mobileRatio=.38;mobileCollapsed=false;syncMobile(false);};
 divider.onkeydown=function(e){if(!media.matches)return originalDrag.onkeydown(e);if(!['ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();mobileCollapsed=false;mobileRatio=e.key==='Home'?.38:clamp(mobileRatio+(e.key==='ArrowUp'?-.04:.04),.25,.60);syncMobile(false);};
 const nativeDialog=typeof dialog.showModal==='function'&&typeof dialog.close==='function';
 const shade=document.createElement('div');shade.className='fallbackBackdrop';shade.hidden=true;shade.setAttribute('aria-hidden','true');
 if(!nativeDialog)document.body.appendChild(shade);
 let returnFocus=null;
 function closeQuestion(){
   if(nativeDialog)dialog.close();else{dialog.removeAttribute('open');dialog.open=false;finishClose();}
 }
 function finishClose(){shade.hidden=true;if(!nativeDialog){layout.inert=false;document.querySelector('.topbar').inert=false;}if(returnFocus&&returnFocus.focus)returnFocus.focus();}
 openQuestion=function(){
   if(dialog.open)return;returnFocus=document.activeElement;
      if(nativeDialog)dialog.showModal();else{shade.hidden=false;layout.inert=true;document.querySelector('.topbar').inert=true;dialog.classList.add('fallbackDialog');dialog.setAttribute('open','');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.open=true;}
   document.getElementById('closeQuestion').focus();
 };
 document.getElementById('openQuestion').onclick=openQuestion;
 document.getElementById('questionViewport').onclick=openQuestion;
 document.getElementById('closeQuestion').onclick=closeQuestion;
 dialog.addEventListener('close',finishClose);
 dialog.addEventListener('keydown',function(e){
   if(e.key==='Escape'&&!nativeDialog){e.preventDefault();closeQuestion();}
   if(e.key==='Tab'&&!nativeDialog){e.preventDefault();document.getElementById('closeQuestion').focus();}
 });
 // Scrolling or pinching the question must not open its full-size dialog.
 let press=null,moved=false;
 const questionViewport=document.getElementById('questionViewport');
 questionViewport.addEventListener('pointerdown',e=>{if(e.isPrimary===false){moved=true;return;}press={x:e.clientX,y:e.clientY};moved=false;});
 questionViewport.addEventListener('pointermove',e=>{if(press&&(Math.abs(e.clientX-press.x)>8||Math.abs(e.clientY-press.y)>8))moved=true;});
 questionViewport.addEventListener('pointercancel',()=>{moved=true;press=null;});
 questionViewport.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();moved=false;}},true);
 document.getElementById('questionImage').setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',DATA.questionImage);
 window.addEventListener('resize',resized);window.addEventListener('orientationchange',resized);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',resized);
 if(media.addEventListener)media.addEventListener('change',resized);else media.addListener(resized);
 if(typeof ResizeObserver==='function'){const observer=new ResizeObserver(resized);observer.observe(document.querySelector('.topbar'));observer.observe(writingHead);}
 screenMode=media.matches;syncMobile(true);
})();
</script>
<script id="fill-preview-scroll">
/* Keep the written sentence visible after the temporary decision is removed. */
(function(){
 const previousRender=render;
 render=function(options){
  previousRender(options);
  const ticket=renderTicket,current=PLAN.view(index);
  const justCompleted=current.state.kind==='complete'&&['decision','corpus'].includes(options?.before?.state.kind);
  if(allMode||!justCompleted||options?.position===false||options?.restore)return;
  requestAnimationFrame(()=>{
   if(ticket===renderTicket)ensureReading(sentenceNodes.get(current.sentence.id));
  });
 };
})();
</script>
