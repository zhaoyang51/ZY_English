<script id="lesson-data" type="application/json">{"title":"2023 英语（二） · 满分版","questionType":"折线图题","typeDetail":"折线图展示2012—2021年我国居民健康素养水平的变化，题下注释说明统计口径及健康素养的含义。","theme":{"en":"building a healthy China","zh":"建设健康中国"},"questionEvidence":[[[263,594,382,30],[75,676,791,70]],[[150,368,610,225]],[[75,636,791,72]]],"sentences":[{"id":"S01","number":1,"paragraph":1,"template":"The figures in the {{S01_A}} reveal notable {{S01_B}} concerning {{S01_C}}.","filled":"The figures in the line chart reveal notable changes concerning building a healthy China.","slots":[{"id":"S01_A","label":"图表类型","value":"line chart","translation":"折线图"},{"id":"S01_B","label":"变化或差异","value":"changes","translation":"变化"},{"id":"S01_C","label":"主题词","value":"building a healthy China","translation":"建设健康中国"}]},{"id":"S02","number":2,"paragraph":1,"template":"Between {{S02_A}} and {{S02_B}}, the {{S02_C}} of {{S02_D}} {{S02_E}} from about {{S02_F}} to around {{S02_G}}, {{S02_H}}.","filled":"Between 2012 and 2021, the proportion of Chinese residents aged 15 to 69 with basic health literacy rose from about 8.8% to around 25.4%, nearly tripling during this period.","slots":[{"id":"S02_A","label":"起始年份","value":"2012","translation":"2012年"},{"id":"S02_B","label":"终止年份","value":"2021","translation":"2021年"},{"id":"S02_C","label":"数量或比例","value":"proportion","translation":"比例"},{"id":"S02_D","label":"统计对象","value":"Chinese residents aged 15 to 69 with basic health literacy","translation":"具备基本健康素养的我国15至69岁居民"},{"id":"S02_E","label":"变化方向","value":"rose","translation":"上升"},{"id":"S02_F","label":"起始比例","value":"8.8%","translation":"8.8%"},{"id":"S02_G","label":"终止比例","value":"25.4%","translation":"25.4%"},{"id":"S02_H","label":"总体增幅","value":"nearly tripling during this period","translation":"在这一时期内接近原来的三倍"}]},{"id":"S03","number":3,"paragraph":2,"template":"{{S03_A}} has attracted attention, not least because of its far-reaching implications.","filled":"Building a healthy China has attracted attention, not least because of its far-reaching implications.","slots":[{"id":"S03_A","label":"主题词","value":"Building a healthy China","translation":"建设健康中国"}]},{"id":"S04","number":4,"paragraph":2,"template":"At the individual level, it is reflected in the way people {{S04_A}}, ultimately contributing to {{S04_B}}.","filled":"At the individual level, it is reflected in the way people learn about health and share useful knowledge with others, ultimately contributing to improved health and overall well-being.","slots":[{"id":"S04_A","label":"具体行为","value":"learn about health and share useful knowledge with others","translation":"学习健康知识并与他人分享有用知识"},{"id":"S04_B","label":"可见成果","value":"improved health and overall well-being","translation":"改善健康状况、增进整体安康"}]},{"id":"S05","number":5,"paragraph":2,"template":"National policies on {{S05_A}} likewise focus on empowering individuals to {{S05_B}}.","filled":"National policies on public health and well-being likewise focus on empowering individuals to make informed decisions about their health.","slots":[{"id":"S05_A","label":"相关领域","value":"public health and well-being","translation":"公共健康与福祉"},{"id":"S05_B","label":"个人能力","value":"make informed decisions about their health","translation":"依据充分信息作出健康决策"}]},{"id":"S06","number":6,"paragraph":2,"template":"Beyond personal advancement, this principle can strengthen communities by {{S06_A}}, laying the groundwork for sustainable progress.","filled":"Beyond personal advancement, this principle can strengthen communities by improving quality of life and encouraging mutual assistance, laying the groundwork for sustainable progress.","slots":[{"id":"S06_A","label":"社会效果","value":"improving quality of life and encouraging mutual assistance","translation":"提升生活质量、鼓励相互帮助"}]},{"id":"S07","number":7,"paragraph":2,"template":"This is in line with national strategies for {{S07_A}}: as this principle takes root, {{S07_B}}.","filled":"This is in line with national strategies for access to healthcare and improving people's well-being: as this principle takes root, service quality rises and community support strengthens.","slots":[{"id":"S07_A","label":"相关战略","value":"access to healthcare and improving people's well-being","translation":"保障病有所医和改善人民福祉"},{"id":"S07_B","label":"社会变化","value":"service quality rises and community support strengthens","translation":"服务质量得到提升，社区支持更加有力"}]},{"id":"S08","number":8,"paragraph":3,"template":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when {{S08_A}} guides action.","filled":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when building a healthy China guides action.","slots":[{"id":"S08_A","label":"主题词","value":"building a healthy China","translation":"建设健康中国"}]},{"id":"S09","number":9,"paragraph":3,"template":"Promoting this principle is therefore not merely advisable but essential for holistic development.","filled":"Promoting this principle is therefore not merely advisable but essential for holistic development.","slots":[]}],"teaching":{"analysis":[{"lines":["图题写的是2012—2021年全国居民健康素养水平。题注说明，这个水平统计的是15—69岁城乡居民中，具备基本健康素养的人所占的比例。","统计口径是人群中的占比，所以描述变化时，要同时交代居民年龄范围、健康素养和比例。"],"emphasis":[["15—69岁城乡居民","具备基本健康素养的人所占的比例"],["人群中的占比"]]},{"lines":["折线从2012年的8.8%升到2021年的25.4%，中间各年的数值也逐步上升，说明具备基本健康素养的居民比例持续提高。","25.4约为8.8的2.89倍，接近3倍。描述时先写清起止年份与比例，再用接近原来的三倍概括总体变化。"],"emphasis":[["8.8%","25.4%","比例持续提高"],["接近原来的三倍"]]},{"lines":["题注把健康素养解释为获取、理解健康信息与服务，并运用它们作出正确决策、维护和促进自身健康的能力。","这种能力在居民中更普及，意味着更多人有条件把健康知识用于日常选择。由个人维护健康，进一步联系居民整体的健康建设，主题可以确定为建设健康中国。"],"emphasis":[["作出正确决策","维护和促进自身健康"],["把健康知识用于日常选择","建设健康中国"]]}],"sentences":[{"id":"S01","decisionLines":["题中用折线连接不同年份的数值，展示同一项指标随时间的变化，因此图表类型选折线图，后面选变化。","前面已经从健康知识的运用、健康决策和居民能力的普及，确定了建设健康中国的主题。总起句继续使用这个主题，说明接下来要围绕什么解释数据。"],"emphasis":[["折线连接不同年份的数值","同一项指标随时间的变化"],["建设健康中国"]]},{"id":"S02","decisionLines":["横轴最左端是2012年，最右端是2021年。先填这两个年份，界定整条折线的观察时期。","题注把健康素养水平定义为特定人群中的占比，所以选择比例；统计对象要写全具备基本健康素养的我国15至69岁居民。","起点标注8.8%，终点标注25.4%，数值由低到高，因此变化方向选上升，再依次填入起点和终点比例。","终点约为起点的2.89倍，接近3倍。末尾据此补上在这一时期内接近原来的三倍，概括总体增幅。"],"emphasis":[["2012年","2021年"],["比例","具备基本健康素养的我国15至69岁居民"],["8.8%","25.4%","上升"],["2.89倍","接近原来的三倍"]]},{"id":"S03","decisionLines":["第一段已经写出具备基本健康素养的居民比例上升。接下来要讨论这种能力怎样帮助个人，以及哪些社会支持能让它发挥作用。","这些讨论都围绕居民健康建设展开，因此第二段总起仍填建设健康中国，统领后面的个人行为与社会作用。"],"emphasis":[["帮助个人","社会支持"],["建设健康中国"]]},{"id":"S04","decisionLines":["题注先说获取和理解健康信息，因此个人行动可以从学习健康知识写起。把有用知识讲给家人和身边的人听，也能帮助他们理解相关信息，所以再加入分享知识。","理解信息之后，才能据此调整日常选择，并利用合适的健康服务。把知识用于维护健康，有助于改善健康状况；身体得到照顾，日常生活也更安稳，因此结果还可以概括为整体安康。","行为部分按学习与分享这两个意思组织；成果部分分别取出语料中表示健康改善和整体安康的部分，再连接起来。"],"emphasis":[["学习健康知识","分享知识"],["把知识用于维护健康","改善健康状况","整体安康"],["健康改善","整体安康"]]},{"id":"S05","decisionLines":["题注不仅说获取信息，还提到利用健康服务。要把知识变成合适的选择，居民需要清楚的健康说明和能够求助的服务，因此政策讨论放在公共健康与福祉这一领域。","信息容易理解，遇到问题又能得到解释，居民就更容易弄清健康选择的依据。因此能力处填依据充分信息作出健康决策，回应题注中运用信息与服务作出正确决策的含义。"],"emphasis":[["健康说明","能够求助的服务","公共健康与福祉"],["弄清健康选择的依据","依据充分信息作出健康决策"]]},{"id":"S06","decisionLines":["前面已经写了用健康知识作出选择。家庭和社区里的更多人把这些选择落实到日常生活，就有助于更好地照顾身体、安排生活，因此社会效果的第一部分写提升生活质量。","分享有用的健康信息，可以帮助身边的人理解健康提示、找到求助方向。支持由自己扩展到他人，就形成了相互帮助，因此另一部分写鼓励相互帮助。","这两部分既说明居民生活怎样改善，也说明社区成员怎样彼此支持。分别取出提升生活质量和鼓励相互帮助的语料片段，再合成这一空。"],"emphasis":[["落实到日常生活","提升生活质量"],["理解健康提示","找到求助方向","鼓励相互帮助"],["居民生活怎样改善","社区成员怎样彼此支持"]]},{"id":"S07","decisionLines":["题注中的健康服务，需要在居民有需要时能够获得，学习到的知识才有机会与专业帮助结合。因此，相关战略先写保障病有所医，把支持落到医疗健康服务上。","获得所需服务，有助于照顾身体和安排日常生活。将这种支持面向更多居民，目标就是改善人民福祉，所以把这项方向与病有所医连在一起。","再写这些支持持续完善时可以期待的变化。服务提供者围绕居民的实际疑问改进健康说明和帮助方式，服务就更能回应需要，这一部分写服务质量提升。","前文的知识分享和相互帮助，使居民遇到健康问题时能从身边获得提醒与协助。这样的联系越稳定，社区支持就越有力，因此另一部分写社区支持增强。"],"emphasis":[["保障病有所医","医疗健康服务"],["改善人民福祉"],["改进健康说明和帮助方式","服务质量提升"],["提醒与协助","社区支持增强"]]},{"id":"S08","decisionLines":["前文从个人学知识、作选择，写到公共健康服务和相互帮助，已经把健康建设落到了个人与社区两个层面。","结尾把这些作用合并，说明个人行动与公共支持可以朝同一个方向推进。因此主题处继续填写建设健康中国。"],"emphasis":[["个人与社区两个层面"],["建设健康中国"]]},{"id":"S09","decisionLines":["个人能够更好地照顾健康，社区成员又能获得服务与互助支持，这些作用需要在日常生活中持续推进。","最后一句用固定结尾，提出继续倡导这一方向的必要性，收束全文。"],"emphasis":[["服务与互助支持","持续推进"],["继续倡导这一方向"]]}]},"corpus":{"entries":[{"id":"C_HX_BEHAVIOR_01","value":"和谐","group":"个人行为","text":"balance competing demands and maintain healthy relationships","zh":"平衡各种相互冲突的需求，并维持良好的关系"},{"id":"C_HX_BEHAVIOR_02","value":"和谐","group":"个人行为","text":"resolve conflicts peacefully and prioritize what truly matters","zh":"和平解决争端，并优先考虑真正重要的事情"},{"id":"C_HX_BEHAVIOR_03","value":"和谐","group":"个人行为","text":"connect genuinely with others and nurture community bonds","zh":"真诚地与他人建立联系，并加强社区间的纽带关系"},{"id":"C_HX_BEHAVIOR_04","value":"和谐","group":"个人行为","text":"make use of public services and facilities","zh":"利用公共服务和设施"},{"id":"C_HX_BEHAVIOR_05","value":"和谐","group":"个人行为","text":"conserve resources and protect the environment","zh":"节约资源并保护环境"},{"id":"C_HX_RESULT_01","value":"和谐","group":"个人成果","text":"inner peace and overall well-being","zh":"内心平静与整体福祉"},{"id":"C_HX_RESULT_02","value":"和谐","group":"个人成果","text":"stable relationships and reduced stress","zh":"稳定的关系和减轻的压力"},{"id":"C_HX_RESULT_03","value":"和谐","group":"个人成果","text":"a fulfilling life and personal satisfaction","zh":"充实的生活与个人满足感"},{"id":"C_HX_FIELD_01","value":"和谐","group":"政策领域","text":"livable city development","zh":"宜居城市建设"},{"id":"C_HX_FIELD_02","value":"和谐","group":"政策领域","text":"public health and well-being","zh":"公共健康与福祉"},{"id":"C_HX_FIELD_03","value":"和谐","group":"政策领域","text":"sustainable urban development","zh":"城市可持续发展"},{"id":"C_HX_ABILITY_01","value":"和谐","group":"政策能力","text":"balance work and life while maintaining harmonious relationships","zh":"在保持良好人际关系的同时平衡工作与生活"},{"id":"C_HX_ABILITY_02","value":"和谐","group":"政策能力","text":"access improved public services and recreational facilities","zh":"获得更完善的公共服务和娱乐设施"},{"id":"C_HX_ABILITY_03","value":"和谐","group":"政策能力","text":"pursue healthy lifestyles in well-designed environments","zh":"在精心设计的环境中追求健康的生活方式"},{"id":"C_HX_ABILITY_04","value":"和谐","group":"政策能力","text":"make informed decisions about their health","zh":"依据充分 <script>'use strict';
function createLessonPlan(data){
 const steps=[{kind:'type'}];
 data.teaching.analysis.forEach((_,i)=>steps.push({kind:'analysis',count:i+1}));
 data.sentences.forEach((sentence,i)=>{
  if(!sentence.slots.length){steps.push({kind:'complete',sentence:i});return;}
  const callsCorpus=sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  for(const kind of ['template','decision',...(callsCorpus?['corpus']:[]),'complete'])steps.push({kind,sentence:i});
 });
 steps.push({kind:'essay'});
 const entries=[0,1,...[1,2,3].map(p=>steps.findIndex(s=>s.sentence!==undefined&&data.sentences[s.sentence].paragraph===p)),steps.findIndex(s=>s.kind==='essay')];
 function view(index){
  const state=steps[index],sentence=state.sentence===undefined?null:data.sentences[state.sentence];
  const completed=state.kind==='essay'?data.sentences.length:sentence?state.sentence+(state.kind==='complete'?1:0):0;
  const callsCorpus=!!sentence&&sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  return {state,sentence,completed,callsCorpus,hasDraft:!!sentence&&state.kind!=='complete',showDecision:['decision','corpus'].includes(state.kind),sourceTab:callsCorpus&&['corpus','complete'].includes(state.kind)?'corpus':'template',themeVisible:index>=data.teaching.analysis.length,chapter:state.kind==='type'?0:state.kind==='analysis'?1:state.kind==='essay'?5:sentence.paragraph+1};
 }
 return {steps,entries,view};
}
globalThis.createLessonPlan=createLessonPlan;
</script>

 };
 document.getElementById('openQuestion').onclick=openQuestion;
 document.getElementById('questionViewport').onclick=openQuestion;
 document.getElementById('closeQuestion').onclick=closeQuestion;
 dialog.addEventListener('close',finishClose);
 dialog.addEventListener('keydown',function(e){
   if(e.key==='Escape'&&!nativeDialog){e.preventDefault();closeQuestion();}
   if(e.key==='Tab'&&!nativeDialog){e.preventDefault();document.getElementById('closeQuestion').focus();}
 });
 // Scrolling or pinching the question must not open its full-size dialog.
 let press=null,moved=false;
 const questionViewport=document.getElementById('questionViewport');
 questionViewport.addEventListener('pointerdown',e=>{if(e.isPrimary===false){moved=true;return;}press={x:e.clientX,y:e.clientY};moved=false;});
 questionViewport.addEventListener('pointermove',e=>{if(press&&(Math.abs(e.clientX-press.x)>8||Math.abs(e.clientY-press.y)>8))moved=true;});
 questionViewport.addEventListener('pointercancel',()=>{moved=true;press=null;});
 questionViewport.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();moved=false;}},true);
 document.getElementById('questionImage').setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',DATA.questionImage);
 window.addEventListener('resize',resized);window.addEventListener('orientationchange',resized);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',resized);
 if(media.addEventListener)media.addEventListener('change',resized);else media.addListener(resized);
 if(typeof ResizeObserver==='function'){const observer=new ResizeObserver(resized);observer.observe(document.querySelector('.topbar'));observer.observe(writingHead);}
 screenMode=media.matches;syncMobile(true);
})();
</script>
<script id="fill-preview-scroll">
/* Keep the written sentence visible after the temporary decision is removed. */
(function(){
 const previousRender=render;
 render=function(options){
  previousRender(options);
  const ticket=renderTicket,current=PLAN.view(index);
  const justCompleted=current.state.kind==='complete'&&['decision','corpus'].includes(options?.before?.state.kind);
  if(allMode||!justCompleted||options?.position===false||options?.restore)return;
  requestAnimationFrame(()=>{
   if(ticket===renderTicket)ensureReading(sentenceNodes.get(current.sentence.id));
  });
 };
})();
</script>
