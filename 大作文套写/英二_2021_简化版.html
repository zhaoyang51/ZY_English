tention, not least because of its far-reaching implications.","filled":"Greater health awareness has attracted attention, not least because of its far-reaching implications.","slots":[{"id":"S03_A","label":"主题词","value":"Greater health awareness","translation":"更强的健康意识"}]},{"id":"S04","number":4,"paragraph":2,"template":"At the individual level, it is reflected in the way people {{S04_A}}, ultimately contributing to personal development and well-being.","filled":"At the individual level, it is reflected in the way people exercise alone or with others to maintain their health, ultimately contributing to personal development and well-being.","slots":[{"id":"S04_A","label":"具体行为","value":"exercise alone or with others to maintain their health","translation":"独自或与他人一起锻炼以维护健康"}]},{"id":"S05","number":5,"paragraph":2,"template":"National policies on {{S05_A}} likewise focus on empowering individuals to achieve their full potential.","filled":"National policies on public health and well-being likewise focus on empowering individuals to achieve their full potential.","slots":[{"id":"S05_A","label":"相关领域","value":"public health and well-being","translation":"公共健康与福祉"}]},{"id":"S06","number":6,"paragraph":2,"template":"Beyond personal advancement, this principle can strengthen communities by {{S06_A}}, laying the groundwork for sustainable progress.","filled":"Beyond personal advancement, this principle can strengthen communities by fostering neighborhood ties and mutual support, laying the groundwork for sustainable progress.","slots":[{"id":"S06_A","label":"社会效果","value":"fostering neighborhood ties and mutual support","translation":"加强邻里联系与相互支持"}]},{"id":"S07","number":7,"paragraph":2,"template":"As this principle takes root across society, it creates a ripple effect that benefits social harmony and long-term prosperity.","filled":"As this principle takes root across society, it creates a ripple effect that benefits social harmony and long-term prosperity.","slots":[]},{"id":"S08","number":8,"paragraph":3,"template":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when {{S08_A}} guides action.","filled":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when greater health awareness guides action.","slots":[{"id":"S08_A","label":"主题词","value":"greater health awareness","translation":"更强的健康意识"}]},{"id":"S09","number":9,"paragraph":3,"template":"Promoting this principle is therefore not merely advisable but essential for holistic development.","filled":"Promoting this principle is therefore not merely advisable but essential for holistic development.","slots":[]}],"teaching":{"analysis":[{"lines":["题注说明这是某市居民体育锻炼方式的调查，各栏分别给出一种方式的比例。","独自锻炼为54.3%，与朋友一起为47.7%，与家人一起为23.9%，团体活动为15.8%。独自锻炼的比例最高。"],"emphasis":[["某市居民体育锻炼方式","各栏分别"],["54.3%","47.7%","23.9%","15.8%"]]},{"lines":["这些项目都是体育锻炼，可以从选择什么方式进一步讨论怎样把维护健康放进日常安排。独自和结伴提供了不同的参与方式。","与朋友、家人或团体共同活动，还提供交流、陪伴和相互鼓励的机会，因此评论也可以讨论锻炼中的社会联系。"],"emphasis":[["维护健康","不同的参与方式"],["交流、陪伴和相互鼓励","社会联系"]]},{"lines":["本文据此提出评论方向：让人们更重视健康，并选择适合自身的锻炼方式，把关注健康落实为日常行动。","主题采用“更强的健康意识”，其中“更强”表达文章倡导的方向。后文围绕锻炼的个人作用，以及共同参与和公共支持展开。"],"emphasis":[["更重视健康","落实为日常行动"],["更强的健康意识","文章倡导的方向"]]}],"sentences":[{"id":"S01","decisionLines":["图中用柱子的高低表现不同锻炼方式的比例，因此图表类型选“条形图”。","比较的是独自、与朋友、与家人和团体活动四种方式，所写关系是类别之间的“差异”。","评论已经确定要倡导更关注健康，这里填写“更强的健康意识”，作为解释这些日常行动的讨论方向。"],"emphasis":[["柱子的高低","条形图"],["四种方式","差异"],["倡导更关注健康","更强的健康意识"]]},{"id":"S02","decisionLines":["先读题注：受访者是某市居民，句首先交代这一范围。随后分别报告各锻炼方式的比例。","独自锻炼的54.3%最高，因此先写独自锻炼及其比例；与朋友一起为47.7%，接在后面。","另外两项是与家人一起23.9%、团体活动15.8%。后半句先列朋友、家人、团体三种方式，再按同一顺序放入三个数字。"],"emphasis":[["某市居民","分别报告"],["独自锻炼的54.3%","与朋友一起为47.7%"],["与家人一起23.9%","团体活动15.8%","同一顺序"]]},{"id":"S03","decisionLines":["第一段已经呈现几种锻炼方式，中间段要进一步说明为什么值得把健康放进日常安排。","本句继续使用“更强的健康意识”，承接文章倡导的方向，再展开个人行动与共同生活中的作用。"],"emphasis":[["几种锻炼方式","把健康放进日常安排"],["更强的健康意识","文章倡导的方向"]]},{"id":"S04","decisionLines":["题中既有独自锻炼，也有与朋友、家人及团体一起活动。把这些方式合并，个人行为可写“独自或与他人一起锻炼”，再用维护健康说明评论中的行动目的。","按适合自己的方式活动，有助于照顾身体状态、安排积极的日常生活；简化模板用固定的“个人发展与福祉”概括个人收益。"],"emphasis":[["独自或与他人一起锻炼","维护健康"],["照顾身体状态","积极的日常生活","个人发展与福祉"]]},{"id":"S05","decisionLines":["居民怎样锻炼关系日常健康。要让更多人得到健康信息和活动支持，可以把视角扩展到“公共健康与福祉”，作为相关政策领域。","健康状态为学习、工作和参与活动提供基础，公共支持帮助人维持这些生活条件；后半句用简化模板固定的“充分发挥潜能”概括对个人的支持。"],"emphasis":[["健康信息和活动支持","公共健康与福祉"],["提供基础","维持这些生活条件","充分发挥潜能"]]},{"id":"S06","decisionLines":["题中有结伴和团体活动，共同锻炼能够提供见面、交流的机会。把这种参与放到社区活动中，邻居经常相遇，就有机会建立更熟悉的联系。","伙伴还可以相约参加、互相提醒和鼓励，让彼此更容易坚持。这样的实际合作，就是“相互支持”的具体内容。","因此社会效果同时写“加强邻里联系”和“相互支持”，使用和谐类中包含这两层意思的完整表达。"],"emphasis":[["结伴和团体活动","社区活动","更熟悉的联系"],["相约参加、互相提醒和鼓励","相互支持"],["加强邻里联系","相互支持"]]},{"id":"S07","decisionLines":["前一句从共同锻炼写到邻里联系和相互支持。人们有更多交流，也更愿意一起参与活动，个人关注健康就能带动共同生活中的合作。","这里使用简化模板固定句，概括这些健康与社会联系对共同生活、长期发展的意义。"],"emphasis":[["邻里联系和相互支持","共同生活中的合作"],["固定句","健康与社会联系"]]},{"id":"S08","decisionLines":["前文以锻炼讨论个人身心状态，也以共同参与讨论交往和支持，这两层都回应了重视健康的方向。","结尾继续填写“更强的健康意识”，把个人与共同生活的意义归回同一主张。"],"emphasis":[["个人身心状态","交往和支持"],["更强的健康意识","同一主张"]]},{"id":"S09","decisionLines":["前一句已归纳个人与共同生活的收益，最后一句接着提出应当倡导重视健康这一方向。","“这一原则”承接健康意识，整句按固定模板写出，用“全面发展”收束。"],"emphasis":[["倡导重视健康"],["健康意识","全面发展"]]}]},"corpus":{"entries":[{"id":"C_HX_BEHAVIOR_01","value":"和谐","group":"个人行为","text":"balance competing demands and maintain healthy relationships","zh":"平衡各种相互冲突的需求，并维持良好的关系"},{"id":"C_HX_BEHAVIOR_02","value":"和谐","group":"个人行为","text":"resolve conflicts peacefully and prioritize what truly matters","zh":"和平解决争端，并优先考虑真正重要的事情"},{"id":"C_HX_BEHAVIOR_03","value":"和谐","group":"个人行为","text":"connect genuinely with others and nurture community bonds","zh":"真诚地与他人建立联系，并加强社区间的纽带关系"},{"id":"C_HX_BEHAVIOR_04","value":"和谐","group":"个人行为","text":"make use of public services and facilities","zh":"利用公共服务和设施"},{"id":"C_HX_BEHAVIOR_05","value":"和谐","group":"个人行为","text":"conserve resources and protect the environment","zh":"节约资源并保护环境"},{"id":"C_HX_RESULT_01","value":"和谐","group":"个人成果","text":"inner peace and overall well-b <script>'use strict';
function createLessonPlan(data){
 const steps=[{kind:'type'}];
 data.teaching.analysis.forEach((_,i)=>steps.push({kind:'analysis',count:i+1}));
 data.sentences.forEach((sentence,i)=>{
  if(!sentence.slots.length){steps.push({kind:'complete',sentence:i});return;}
  const callsCorpus=sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  for(const kind of ['template','decision',...(callsCorpus?['corpus']:[]),'complete'])steps.push({kind,sentence:i});
 });
 steps.push({kind:'essay'});
 const entries=[0,1,...[1,2,3].map(p=>steps.findIndex(s=>s.sentence!==undefined&&data.sentences[s.sentence].paragraph===p)),steps.findIndex(s=>s.kind==='essay')];
 function view(index){
  const state=steps[index],sentence=state.sentence===undefined?null:data.sentences[state.sentence];
  const completed=state.kind==='essay'?data.sentences.length:sentence?state.sentence+(state.kind==='complete'?1:0):0;
  const callsCorpus=!!sentence&&sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  return {state,sentence,completed,callsCorpus,hasDraft:!!sentence&&state.kind!=='complete',showDecision:['decision','corpus'].includes(state.kind),sourceTab:callsCorpus&&['corpus','complete'].includes(state.kind)?'corpus':'template',themeVisible:index>=data.teaching.analysis.length,chapter:state.kind==='type'?0:state.kind==='analysis'?1:state.kind==='essay'?5:sentence.paragraph+1};
 }
 return {steps,entries,view};
}
globalThis.createLessonPlan=createLessonPlan;
</script>

 dialog.addEventListener('close',finishClose);
 dialog.addEventListener('keydown',function(e){
   if(e.key==='Escape'&&!nativeDialog){e.preventDefault();closeQuestion();}
   if(e.key==='Tab'&&!nativeDialog){e.preventDefault();document.getElementById('closeQuestion').focus();}
 });
 // Scrolling or pinching the question must not open its full-size dialog.
 let press=null,moved=false;
 const questionViewport=document.getElementById('questionViewport');
 questionViewport.addEventListener('pointerdown',e=>{if(e.isPrimary===false){moved=true;return;}press={x:e.clientX,y:e.clientY};moved=false;});
 questionViewport.addEventListener('pointermove',e=>{if(press&&(Math.abs(e.clientX-press.x)>8||Math.abs(e.clientY-press.y)>8))moved=true;});
 questionViewport.addEventListener('pointercancel',()=>{moved=true;press=null;});
 questionViewport.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();moved=false;}},true);
 document.getElementById('questionImage').setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',DATA.questionImage);
 window.addEventListener('resize',resized);window.addEventListener('orientationchange',resized);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',resized);
 if(media.addEventListener)media.addEventListener('change',resized);else media.addListener(resized);
 if(typeof ResizeObserver==='function'){const observer=new ResizeObserver(resized);observer.observe(document.querySelector('.topbar'));observer.observe(writingHead);}
 screenMode=media.matches;syncMobile(true);
})();
</script>
<script id="fill-preview-scroll">
/* Keep the written sentence visible after the temporary decision is removed. */
(function(){
 const previousRender=render;
 render=function(options){
  previousRender(options);
  const ticket=renderTicket,current=PLAN.view(index);
  const justCompleted=current.state.kind==='complete'&&['decision','corpus'].includes(options?.before?.state.kind);
  if(allMode||!justCompleted||options?.position===false||options?.restore)return;
  requestAnimationFrame(()=>{
   if(ticket===renderTicket)ensureReading(sentenceNodes.get(current.sentence.id));
  });
 };
})();
</script>
