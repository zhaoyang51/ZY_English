<script id="lesson-data" type="application/json">{"title":"2024 英语（二） · 速通版 · 无脑版","questionType":"图表题","typeDetail":"条形图比较劳动实践课学生报告的四类主要收获。","theme":{"en":"learning through practice","zh":"在实践中学习"},"questionEvidence":[[[206,340,483,34],[206,397,492,34],[341,591,331,32]],[[206,455,323,32],[206,512,386,32]],[[206,338,492,207],[341,591,331,32]]],"sentences":[{"id":"S01","number":1,"paragraph":1,"template":"Though deceptively simple, this {{S01_A}} conveys a meaningful message: {{S01_B}}.","filled":"Though deceptively simple, this bar chart conveys a meaningful message: among gains reported from labour practice courses at one university, acquiring knowledge accounts for the largest share, at 91.3%, followed by improving practical skills, feeling happier and enhancing cooperation at 84.8%, 54.4% and 32.6% respectively.","slots":[{"id":"S01_A","label":"图表名称","value":"bar chart","translation":"条形图"},{"id":"S01_B","label":"图表描述","value":"among gains reported from labour practice courses at one university, acquiring knowledge accounts for the largest share, at 91.3%, followed by improving practical skills, feeling happier and enhancing cooperation at 84.8%, 54.4% and 32.6% respectively","translation":"某高校劳动实践课的主要收获中，学习知识占91.3%，动手能力、心情舒畅和合作能力分别占84.8%、54.4%和32.6%"}]},{"id":"S02","number":2,"paragraph":1,"template":"It serves as a compelling testament to the significance of {{S02_A}}.","filled":"It serves as a compelling testament to the significance of learning through practice.","slots":[{"id":"S02_A","label":"主题词","value":"learning through practice","translation":"在实践中学习"}]},{"id":"S03","number":3,"paragraph":2,"template":"To begin with, experience suggests that {{S03_A}} finds direct expression in phenomena exemplified by the way people {{S03_B}}.","filled":"To begin with, experience suggests that learning through practice finds direct expression in phenomena exemplified by the way people gain knowledge and work with others in labour courses.","slots":[{"id":"S03_A","label":"主题词","value":"learning through practice","translation":"在实践中学习"},{"id":"S03_B","label":"具体行为","value":"gain knowledge and work with others in labour courses","translation":"在劳动课程中学习知识并与他人合作"}]},{"id":"S04","number":4,"paragraph":2,"template":"This is hardly surprising, as people tend to favour behaviour they believe will have desirable consequences.","filled":"This is hardly surprising, as people tend to favour behaviour they believe will have desirable consequences.","slots":[]},{"id":"S05","number":5,"paragraph":2,"template":"However, we should recognise that social conditions fundamentally shape the choices available to individuals.","filled":"However, we should recognise that social conditions fundamentally shape the choices available to individuals.","slots":[]},{"id":"S06","number":6,"paragraph":2,"template":"From this perspective, a shared commitment to {{S06_A}} can create the conditions for communities and nations to flourish in harmony, laying the groundwork for sustainable progress.","filled":"From this perspective, a shared commitment to fostering well-rounded development can create the conditions for communities and nations to flourish in harmony, laying the groundwork for sustainable progress.","slots":[{"id":"S06_A","label":"相关战略","value":"fostering well-rounded development","translation":"促进全面发展"}]},{"id":"S07","number":7,"paragraph":2,"template":"An article published by {{S07_A}} lends support to the view that {{S07_B}} plays an important role in fostering community prosperity.","filled":"An article published by Beijing Normal University lends support to the view that learning through practice plays an important role in fostering community prosperity.","slots":[{"id":"S07_A","label":"机构名称","value":"Beijing Normal University","translation":"北京师范大学"},{"id":"S07_B","label":"主题词","value":"learning through practice","translation":"在实践中学习"}]},{"id":"S08","number":8,"paragraph":3,"template":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when {{S08_A}} guides action.","filled":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when learning through practice guides action.","slots":[{"id":"S08_A","label":"主题词","value":"learning through practice","translation":"在实践中学习"}]},{"id":"S09","number":9,"paragraph":3,"template":"Promoting this principle is therefore not merely advisable but essential for holistic development.","filled":"Promoting this principle is therefore not merely advisable but essential for holistic development.","slots":[]}],"teaching":{"analysis":[{"lines":["题注说明，这是某高校劳动实践课学生主要收获的调查。横向条形对应不同收获，条形末端的百分比表示报告该项收获的比例。","学习相关知识为91.3%，提升动手能力为84.8%，是比例最高的两项。课程的收获同时涉及理解知识和亲手完成事情。"],"emphasis":[["劳动实践课学生主要收获","不同收获"],["91.3%","84.8%","理解知识和亲手完成事情"]]},{"lines":["另两项是感觉心情舒畅54.4%、增强合作能力32.6%。一项关乎参与活动时的心理体验，另一项关乎与别人一起做事的能力。","把这两项与知识、动手能力放在一起，讨论便可以覆盖学习、实践、心理体验和合作关系，呈现学生在课程中获得的多方面收获。"],"emphasis":[["心情舒畅54.4%","合作能力32.6%"],["学习、实践、心理体验和合作关系"]]},{"lines":["这些收获都出自劳动实践课程。学生在活动中理解做法、练习操作，又在参与和合作中获得体验，实践因而可以成为学习与成长的途径。","由共同的课程情境概括主题，可以写“在实践中学习”：从实际活动获得知识和能力，并在与他人共同完成事情时学习合作。"],"emphasis":[["都出自劳动实践课程","学习与成长的途径"],["在实践中学习","学习合作"]]}],"sentences":[{"id":"S01","decisionLines":["材料用四条横向条形比较不同收获，所以图表名称填写“条形图”。题注给出某高校劳动实践课的学生，描述先交代调查的是这类课程带来的收获。","比较各条形末端的数字，学习相关知识的91.3%最高，先写这一最大项。剩余三项依比例从高到低排列，依次为动手能力、心情舒畅和合作能力。","再依次填入84.8%、54.4%和32.6%，让每个数字与前面的收获一一对应。整段描述由题注、类别名称和比例组织而成。"],"emphasis":[["四条横向条形","课程带来的收获"],["91.3%最高","动手能力、心情舒畅和合作能力"],["84.8%、54.4%和32.6%","一一对应"]]},{"id":"S02","decisionLines":["这些知识、动手能力与合作方面的收获，都来自劳动实践课。因而可以从学生参与课程活动、在活动中获得成长这一共同关系来概括。","主题填写“在实践中学习”，强调做事情也是获得知识和能力的途径，后文再用个人的学习与合作展开。"],"emphasis":[["都来自劳动实践课","在活动中获得成长"],["在实践中学习","获得知识和能力的途径"]]},{"id":"S03","decisionLines":["图中学习相关知识占91.3%，可以先写学生在劳动课程中获得知识，把主题中的“学习”落到明确的课程收获上。","增强合作能力这一项涉及与别人一起做事。合作需要分工、沟通和共同完成任务，因此再接上“与他人合作”，把个人学习与共同参与连起来。","两部分合起来填写“在劳动课程中学习知识并与他人合作”，直接按题中的知识、合作和课程情境组织行为。"],"emphasis":[["学习相关知识占91.3%","在劳动课程中获得知识"],["分工、沟通和共同完成任务","与他人合作"],["在劳动课程中学习知识并与他人合作"]]},{"id":"S04","decisionLines":["前一句写参与劳动课程中的学习活动。题中知识、动手能力和心情舒畅几项收获，分别指向学会内容、做好事情和获得愉悦体验。","当人期待活动能带来这些好处，就更愿意参与并投入精力。这一句直接保留固定模板，用对积极结果的期待解释行为偏好。"],"emphasis":[["学会内容、做好事情和获得愉悦体验"],["更愿意参与并投入精力","对积极结果的期待"]]},{"id":"S05","decisionLines":["学生愿意动手和合作，还需要能参加的活动。题目中的劳动实践课本身就是一种组织条件，课程要安排任务、操作机会和共同参与的方式。","这些安排影响学生能够练习什么、怎样与别人共同完成事情。因此，用固定句把讨论转向教育环境怎样支持个人行动。"],"emphasis":[["安排任务、操作机会和共同参与的方式"],["教育环境怎样支持个人行动"]]},{"id":"S06","decisionLines":["课程带来的知识、操作能力、愉悦感和合作能力分别涉及认知、实践、心理和人际交往。社会层面可以支持课程同时培养这些方面，因而选择“促进全面发展”。","学生既有完成事情的能力，又能与别人共同做事，便更有条件参与共同事务。持续提供这种学习机会，能够为社区合作和长期发展积累能力。","文明类相关战略中的“促进全面发展”表达了这一培养方向，放入共同坚持的内容，连接课程收获与社会支持。"],"emphasis":[["认知、实践、心理和人际交往","促进全面发展"],["完成事情的能力","与别人共同做事","为社区合作和长期发展积累能力"],["促进全面发展","课程收获与社会支持"]]},{"id":"S07","decisionLines":["这一处填写文章的发布机构，本句使用北京师范大学的名称。随后继续讨论课程怎样培养学生，以及这些个人能力怎样用于共同生活。","个人在课程中获得知识和操作能力，也练习与别人合作，这些能力可以用在共同完成事务中。教育所培养的个人能力，因而能够成为社区参与和共同发展的条件。","主题位置继续填写“在实践中学习”，把前面讨论的课程、个人行动和社会培养方向归到同一论点。"],"emphasis":[["北京师范大学","个人能力怎样用于共同生活"],["共同完成事务","社区参与和共同发展的条件"],["在实践中学习"]]},{"id":"S08","decisionLines":["前文一方面写学生通过劳动课程获得知识和行动能力，另一方面写教育安排怎样提供实践与合作机会，个人成长和社会支持已经相互连接。","结尾继续填写“在实践中学习”，统一个人的学习行动与群体提供的成长条件，概括两方面的共同意义。"],"emphasis":[["个人成长和社会支持"],["在实践中学习"]]},{"id":"S09","decisionLines":["上一句已经归纳个人和共同生活能够得到的益处，最后一句接着提出应当倡导这一教育方向。","知识、动手能力、心理体验和合作素养共同涉及人的成长，末句以固定的“全面发展”概括这些相互联系的成长。"],"emphasis":[["倡导这一教育方向"],["知识、动手能力、心理体验和合作素养","全面发展"]]}]},"corpus":{"entries":[{"id":"C_HX_BEHAVIOR_01","value":"和谐","group":"个人行为","text":"balance competing demands and maintain healthy relationships","zh":"平衡各种相互冲突的需求，并维持良好的关系"},{"id":"C_HX_BEHAVIOR_02","value":"和谐","group":"个人行为","text":"resolve conflicts peacefully and prioritize what truly matters","zh":"和平解决争端，并优先考虑真正重要的事情"},{"id":"C_HX_BEHAVIOR_03","value":"和谐","group":"个人行为","text":"connect genuinely with others and nurture community bonds","zh":"真诚地与他人建立联系，并加强社区间的纽带关系"},{"id":"C_HX_BEHAVIOR_04","value":"和谐","group":"个人行为","text":"make use of public servic <script>'use strict';
function createLessonPlan(data){
 const steps=[{kind:'type'}];
 data.teaching.analysis.forEach((_,i)=>steps.push({kind:'analysis',count:i+1}));
 data.sentences.forEach((sentence,i)=>{
  if(!sentence.slots.length){steps.push({kind:'complete',sentence:i});return;}
  const callsCorpus=sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  for(const kind of ['template','decision',...(callsCorpus?['corpus']:[]),'complete'])steps.push({kind,sentence:i});
 });
 steps.push({kind:'essay'});
 const entries=[0,1,...[1,2,3].map(p=>steps.findIndex(s=>s.sentence!==undefined&&data.sentences[s.sentence].paragraph===p)),steps.findIndex(s=>s.kind==='essay')];
 function view(index){
  const state=steps[index],sentence=state.sentence===undefined?null:data.sentences[state.sentence];
  const completed=state.kind==='essay'?data.sentences.length:sentence?state.sentence+(state.kind==='complete'?1:0):0;
  const callsCorpus=!!sentence&&sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  return {state,sentence,completed,callsCorpus,hasDraft:!!sentence&&state.kind!=='complete',showDecision:['decision','corpus'].includes(state.kind),sourceTab:callsCorpus&&['corpus','complete'].includes(state.kind)?'corpus':'template',themeVisible:index>=data.teaching.analysis.length,chapter:state.kind==='type'?0:state.kind==='analysis'?1:state.kind==='essay'?5:sentence.paragraph+1};
 }
 return {steps,entries,view};
}
globalThis.createLessonPlan=createLessonPlan;
</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lesson-data').textContent),PLAN=createLessonPlan(DATA);
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
const area=$('writingScroll'),paper=$('writingPaper'),referenceScroll=$('referenceScroll');
const paragraphSections=[],paragraphs=[],sentenceNodes=new Map(),sentenceSpaces=new Map(),templateNodes=new Map(),corpusNodes=new Map(),corpusGroups=[];
const decisionNode=node('div','decisionLines');decisionNode.hidden=true;
const fillPreviewNode=node('section','fillPreview');fillPreviewNode.setAttribute('id','fillPreview');fillPreviewNode.setAttribute('aria-label','本句填入内容');fillPreviewNode.hidden=true;let fillPreviewSentence=null;
function emphasized(text,fragments=[]){let out=esc(text);for(const part of [...fragments].sort((a,b)=>b.length-a.length))out=out.replace(esc(part),'<strong>'+esc(part)+'</strong>');return out;}
function teachingLine(text,fragments){const p=node('p');p.innerHTML=emphasized(text,fragments);return p;}
const analysisNodes=DATA.teaching.analysis.map((a,i)=>{const n=node('section','analysisBlock');n.dataset.analysis=String(i+1);a.lines.forEach((line,j)=>n.appendChild(teachingLine(line,a.emphasis[j])));return n;});
const analysisAnswer=node('div','themeAnswer');analysisAnswer.innerHTML='<div class="themeEn" lang="en">'+esc(DATA.theme.en)+'</div><div class="themeZh">'+esc(DATA.theme.zh)+'</div>';
let index=0,referenceTab='template',corpusCategory='富强',allMode=false,saved=null,renderTicket=0,decisionSentence=null,preludeKey='',collapsed=false,questionHeight=224,referenceWidth=42,zoom=1;
const tabScroll={template:0,corpus:0};
function templateHTML(s){return esc(s.template).replace(/\{\{([A-Z0-9_]+)\}\}/g,(_,id)=>'<span class="blank">【'+esc(s.slots.find(v=>v.id===id).label)+'】</span>');}
function filledHTML(s){return esc(s.template).replace(/\{\{([A-Z0-9_]+)\}\}/g,(_,id)=>'<strong class="fillWord">'+esc(s.slots.find(v=>v.id===id).value)+'</strong>');}
function initializeContent(){
 for(let p=1;p<=3;p++){
  const section=node('section','paragraphSection'),paragraph=node('p','essayParagraph');paragraph.lang='en';section.appendChild(paragraph);section.hidden=true;$('essayFlow').appendChild(section);paragraphSections.push(section);paragraphs.push(paragraph);
  const group=node('section','templateGroup');group.appendChild(node('h2','',['第一段','第二段','第三段'][p-1]));const text=node('p','templateText');text.lang='en';
  DATA.sentences.filter(s=>s.paragraph===p).forEach((s,i)=>{if(i)text.appendChild(document.createTextNode(' '));const line=node('span','templateSentence');line.dataset.source=s.id;line.innerHTML=templateHTML(s);text.appendChild(line);templateNodes.set(s.id,line);});group.appendChild(text);$('templateView').appendChild(group);
 }
 DATA.sentences.forEach(s=>{const n=node('span','sentence');n.dataset.sentence=s.id;sentenceNodes.set(s.id,n);sentenceSpaces.set(s.id,document.createTextNode(' '));});

 const currentOption=node('option','','本句调用');currentOption.value='__current__';currentOption.setAttribute('id','currentCallsOption');currentOption.hidden=true;$('corpusCategory').appendChild(currentOption);
 for(const value of [...new Set(DATA.corpus.entries.map(e=>e.value))]){
  const option=node('option','',value);option.value=value;$('corpusCategory').appendChild(option);
  for(const name of [...new Set(DATA.corpus.entries.filter(e=>e.value===value).map(e=>e.group))]){
   const group=node('section','corpusGroup');group.dataset.value=value;group.appendChild(node('h2','',name));const entries=node('div','corpusEntries');const ids=[];
   DATA.corpus.entries.filter(e=>e.value===value&&e.group===name).forEach(e=>{const wrap=node('div','corpusEntry'),en=node('div','corpusEnglish',e.text),zh=node('div','corpusChinese',e.zh);en.lang='en';wrap.dataset.corpus=e.id;wrap.append(en,zh);entries.appendChild(wrap);corpusNodes.set(e.id,{wrap,en,entry:e});ids.push(e.id);});group.appendChild(entries);$('corpusView').appendChild(group);corpusGroups.push({group,ids,value,name});
  }
 }
 $('themeEnglish').textContent=DATA.theme.en;$('themeChinese').textContent=DATA.theme.zh;$('questionImage').setAttribute('href',DATA.questionImage);$('fullQuestionImage').src=DATA.fullQuestionImage;
 ['读题','确定主题词','第一段','第二段','第三段','完整范文'].forEach((label,i)=>{const option=node('option','',label);option.value=String(i);$('chapter').appendChild(option);});
}
function ensureSentence(s,mode){
 const n=sentenceNodes.get(s.id),p=paragraphs[s.paragraph-1];
 if(n.dataset.mode!==mode){n.innerHTML=mode==='written'?filledHTML(s):templateHTML(s);n.dataset.mode=mode;n.className='sentence'+(mode==='draft'?' draft':'');}
 if(n.parentNode!==p){if(p.childNodes.length)p.appendChild(sentenceSpaces.get(s.id));p.appendChild(n);}
 return n;
}
function renderPrelude(v){
 const key=v.state.kind==='analysis'?'analysis':'type';
 if(preludeKey!==key){$('prelude').replaceChildren();preludeKey=key;if(key==='type'){$('prelude').append(node('h2','introTitle',DATA.questionType),node('p','introCopy',DATA.typeDetail));}}
 if(key==='analysis'){
  analysisNodes.forEach((n,i)=>{if(i<v.state.count){if(n.parentNode!==$('prelude'))$('prelude').appendChild(n);n.className='analysisBlock'+(i===v.state.count-1?' current':'');}else n.remove();});
  if(v.state.count===analysisNodes.length){if(analysisAnswer.parentNode!==$('prelude'))$('prelude').appendChild(analysisAnswer);}else analysisAnswer.remove();
 }
}
function renderFillPreview(v){
 const visible=!allMode&&v.showDecision&&!!v.sentence?.slots.length;
 fillPreviewNode.hidden=!visible;
 if(!visible)return;
 if(fillPreviewSentence!==v.sentence.id){
  const list=node('div','fillRows');
  const slotById=new Map(v.sentence.slots.map(slot=>[slot.id,slot]));
  const order=[...v.sentence.template.matchAll(/\{\{([A-Z0-9_]+)\}\}/g)].map(match=>match[1]);
  order.forEach(id=>{
   const slot=slotById.get(id),row=node('p','fillRow');row.dataset.slot=id;row.setAttribute('aria-label',slot.label);
   const chinese=node('span','fillChinese',slot.translation),english=node('span','fillEnglish',slot.value);english.lang='en';
   row.append(chinese,node('span','fillSeparator',' — '),english);list.appendChild(row);
  });
  fillPreviewNode.replaceChildren(list);fillPreviewSentence=v.sentence.id;
 }
 const section=paragraphSections[v.sentence.paragraph-1];
 const children=Array.from(section.childNodes);
 if(fillPreviewNode.parentNode!==section||children.indexOf(fillPreviewNode)!==children.indexOf(decisionNode)+1)section.appendChild(fillPreviewNode);
}

function renderWriting(v){
 const introductory=!allMode&&['type','analysis'].includes(v.state.kind);
 $('prelude').hidden=!introductory;$('essayFlow').hidden=introductory;
 if(introductory)renderPrelude(v);
 const completeCount=allMode||v.state.kind==='essay'?DATA.sentences.length:v.completed;
 DATA.sentences.forEach((s,i)=>{const isActive=!allMode&&v.hasDraft&&v.sentence.id===s.id,include=!introductory&&(i<completeCount||isActive);if(include)ensureSentence(s,isActive?'draft':'written');else{sentenceNodes.get(s.id).remove();sentenceSpaces.get(s.id).remove();}});
 paragraphSections.forEach((section,p)=>{section.hidden=!paragraphs[p].childNodes.length;});
 sentenceNodes.forEach((n,id)=>n.classList.toggle('current',!allMode&&v.state.kind==='complete'&&v.sentence?.id===id));
 if(!allMode&&v.hasDraft&&v.showDecision){if(decisionSentence!==v.sentence.id){decisionNode.replaceChildren(...DATA.teaching.sentences[v.state.sentence].decisionLines.map((line,i)=>teachingLine(line,DATA.teaching.sentences[v.state.sentence].emphasis[i])));decisionSentence=v.sentence.id;}const section=paragraphSections[v.sentence.paragraph-1];if(decisionNode.parentNode!==section)section.appendChild(decisionNode);decisionNode.hidden=false;}else decisionNode.hidden=true;
 $('writingTitle').textContent=allMode?'全文':v.sentence?'第 '+v.sentence.number+' 句':v.state.kind==='type'?'读题':v.state.kind==='analysis'?'确定主题词':'完整范文';
 $('writingPaper').dataset.kind=allMode?'all':v.state.kind;$('writingPaper').dataset.sentence=v.sentence?.id||'';
 renderFillPreview(v);
}
function refsFor(sentence){const map=new Map();if(sentence)sentence.slots.forEach(s=>(DATA.corpus.slotRefs[s.id]||[]).forEach(ref=>{if(!map.has(ref.id))map.set(ref.id,[]);if(!map.get(ref.id).includes(ref.fragment))map.get(ref.id).push(ref.fragment);}));return map;}
function highlighted(text,fragments){let output=esc(text);for(const f of [...fragments].sort((a,b)=>b.length-a.length))output=output.replace(esc(f),'<mark>'+esc(f)+'</mark>');return output;}
function renderResources(v){
 const refs=!allMode&&referenceTab==='corpus'&&['corpus','complete'].includes(v.state.kind)?refsFor(v.sentence):new Map();
 const cross=new Set([...refs.keys()].map(id=>corpusNodes.get(id).entry.value)).size>1;
 $('currentCallsOption').hidden=!cross;
 if(corpusCategory==='__current__'&&!cross)corpusCategory='富强';
 const currentOnly=corpusCategory==='__current__';
 $('corpusBrowse').hidden=referenceTab!=='corpus';$('corpusCategory').value=corpusCategory;
 $('templateView').hidden=referenceTab!=='template';$('corpusView').hidden=referenceTab!=='corpus';$('templateTab').setAttribute('aria-selected',String(referenceTab==='template'));$('corpusTab').setAttribute('aria-selected',String(referenceTab==='corpus'));
 templateNodes.forEach((n,id)=>n.classList.toggle('selected',!allMode&&referenceTab==='template'&&v.sentence?.id===id));
 corpusNodes.forEach(({wrap,en,entry},id)=>{wrap.hidden=currentOnly&&!refs.has(id);const fragments=refs.get(id)||[];const html=highlighted(entry.text,fragments);if(en.innerHTML!==html)en.innerHTML=html;wrap.classList.toggle('selected',fragments.length>0);});
 corpusGroups.forEach(({group,ids,value,name})=>{group.hidden=currentOnly?!ids.some(id=>refs.has(id)):value!==corpusCategory;const label=currentOnly?value+' · '+name:name;if(group.children[0].textContent!==label)group.children[0].textContent=label;});
}
function setWritingScroll(target){const n=Math.max(0,target),tail=$('sentenceTail'),vp=area.getBoundingClientRect(),origin=area.scrollTop+tail.getBoundingClientRect().top-vp.top,padding=parseFloat(getComputedStyle(area).paddingBottom)||0;tail.style.height=(n?Math.max(0,n+area.clientHeight-origin-padding):0)+'px';area.scrollTop=n;}

<script id="mobile-watermark-runtime">

 function measure(){

   root.style.setProperty('--app-height',Math.round(height)+'px');

 const baseRender=render;
 render=function(options){

   const v=PLAN.view(index);
   if(media.matches&&!allMode&&(!options||options.position!==false)&&!options?.restore){
     if(v.state.kind==='decision')requestAnimationFrame(()=>ensureReading(decisionNode));

 const baseSwitch=switchReference;

 document.getElementById('allButton').onclick=function(){
   if(dialog.open)return;
   if(!allMode){savedMobile={view:mobileView,collapsed:mobileCollapsed,ratio:mobileRatio};baseAll();mobileCollapsed=true;syncMobile(false);}

 const baseReset=document.getElementById('resetButton').onclick;

 const baseHeight=setQuestionHeight;

   if(media.matches){baseHeight(value);return;}
   const tools=question.querySelector('.questionTools').getBoundingClientRect().height;
   const themeHeight=theme.hidden?0:theme.getBoundingClientRect().height;

 };
 setReferenceWidth=function(value){

 const nativeDialog=typeof dialog.showModal==='function'&&typeof dialog.close==='function';

 if(!nativeDialog)document.body.appendChild(shade);
 let returnFocus=null;
 function closeQuestion(){
   if(nativeDialog)dialog.close();else{dialog.removeAttribute('open');dialog.open=false;finishClose();}
 }

   if(dialog.open)return;returnFocus=document.activeElement;
      if(nativeDialog)dialog.showModal();else{shade.hidden=false;layout.inert=true;document.querySelector('.topbar').inert=true;dialog.classList.add('fallbackDialog');dialog.setAttribute('open','');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.open=true;}
   document.getElementById('closeQuestion').focus();
 };

 document.getElementById('questionViewport').onclick=openQuestion;
 document.getElementById('closeQuestion').onclick=closeQuestion;
 dialog.addEventListener('close',finishClose);
 dialog.addEventListener('keydown',function(e){
   if(e.key==='Escape'&&!nativeDialog){e.preventDefault();closeQuestion();}
   if(e.key==='Tab'&&!nativeDialog){e.preventDefault();document.getElementById('closeQuestion').focus();}

 // Scrolling or pinching the question must not open its full-size dialog.
 let press=null,moved=false;

<script id="fill-preview-scroll">

(function(){
