ified by the way people pursue healthy lifestyles.","slots":[{"id":"S03_A","label":"核心主题","value":"promoting older adults' physical and mental well-being and all-round development","translation":"促进老年人身心健康与全面发展"},{"id":"S03_B","label":"具体行为","value":"pursue healthy lifestyles","translation":"追求健康的生活方式"}]},{"id":"S04","number":4,"paragraph":2,"template":"This is hardly surprising, as people tend to favour behaviour they believe will have desirable consequences.","filled":"This is hardly surprising, as people tend to favour behaviour they believe will have desirable consequences.","slots":[]},{"id":"S05","number":5,"paragraph":2,"template":"However, we should recognise that social conditions fundamentally shape the choices available to individuals.","filled":"However, we should recognise that social conditions fundamentally shape the choices available to individuals.","slots":[]},{"id":"S06","number":6,"paragraph":2,"template":"From this perspective, it is the promotion of national strategies for {{S06_A}} that provides impetus for these developments.","filled":"From this perspective, it is the promotion of national strategies for building a healthy China that provides impetus for these developments.","slots":[{"id":"S06_A","label":"相关战略","value":"building a healthy China","translation":"建设健康中国"}]},{"id":"S07","number":7,"paragraph":2,"template":"An article published by {{S07_A}} lends support to the view that {{S07_B}} plays an important role in fostering community prosperity.","filled":"An article published by the National Health Commission lends support to the view that promoting older adults' physical and mental well-being and all-round development plays an important role in fostering community prosperity.","slots":[{"id":"S07_A","label":"机构名称","value":"the National Health Commission","translation":"国家卫生健康委员会"},{"id":"S07_B","label":"核心主题","value":"promoting older adults' physical and mental well-being and all-round development","translation":"促进老年人身心健康与全面发展"}]},{"id":"S08","number":8,"paragraph":3,"template":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when {{S08_A}} guides action.","filled":"In conclusion, a rational consensus has emerged that both individuals and communities benefit immeasurably when promoting older adults' physical and mental well-being and all-round development guides action.","slots":[{"id":"S08_A","label":"核心主题","value":"promoting older adults' physical and mental well-being and all-round development","translation":"促进老年人身心健康与全面发展"}]},{"id":"S09","number":9,"paragraph":3,"template":"Promoting this principle is therefore not merely advisable but essential for holistic development.","filled":"Promoting this principle is therefore not merely advisable but essential for holistic development.","slots":[]}],"teaching":{"analysis":[{"lines":["题注把调查对象限定为某社区老年人，比较的是他们的主要日常休闲活动。看电视占90.8%，散步占68.3%，是图中比例最高的两项。","养花占34.7%，阅读占31.8%，下棋占18.4%。五项活动中既有身体活动，也有兴趣和精神休闲。"],"emphasis":[["某社区老年人","90.8%","68.3%"],["34.7%","31.8%","18.4%","身体活动","兴趣和精神休闲"]]},{"lines":["散步让身体活动起来；看电视提供娱乐，养花让人投入日常兴趣。这些活动可以从身体活动、情绪放松和生活乐趣来理解。","阅读可以接触新的知识，下棋需要思考走法和作出判断。因此，休闲安排也可以为老年人继续学习、运用思考能力提供机会。"],"emphasis":[["散步让身体活动起来","看电视提供娱乐","养花让人投入日常兴趣"],["接触新的知识","思考走法和作出判断","继续学习、运用思考能力"]]},{"lines":["把这些作用联系起来，老年人既需要照顾身体和情绪状态，也需要继续学习、保持兴趣、充实日常生活。围绕这些方面安排活动，就把健康生活与晚年持续发展联系起来。","因此，本文倡导促进老年人身心健康与全面发展。这里的全面发展落在身体活动、精神生活、学习与兴趣几个方面，后文再讨论个人怎样安排生活、社区怎样提供参与条件。"],"emphasis":[["身体和情绪状态","继续学习、保持兴趣、充实日常生活","晚年持续发展"],["促进老年人身心健康与全面发展","身体活动、精神生活、学习与兴趣","参与条件"]]}],"sentences":[{"id":"S01","decisionLines":["题图用五根柱子的高度表示不同活动的比例，所以材料名称选择条形图。描述先按题注交代对象是某社区老年人。","看电视的柱子最高，标注90.8%，先写它是占比最大的活动。其余四项按比例从高到低排列，依次是散步、养花、阅读和下棋。","后面依次写68.3%、34.7%、31.8%和18.4%，与这四项活动一一对应。整个描述都来自题中的名称和数字。"],"emphasis":[["五根柱子的高度","条形图","某社区老年人"],["90.8%","占比最大的活动","散步、养花、阅读和下棋"],["68.3%、34.7%、31.8%和18.4%","一一对应"]]},{"id":"S02","decisionLines":["上句列出了老年人的休闲活动，这句要概括值得倡导的方向。散步联系身体活动，阅读和下棋联系学习与思考，养花等兴趣活动让日常生活有所寄托。","这些活动兼顾身心状态，也为持续学习和发展兴趣提供机会，因此填写前面确定的“促进老年人身心健康与全面发展”。"],"emphasis":[["身体活动","学习与思考","日常生活有所寄托"],["持续学习和发展兴趣","促进老年人身心健康与全面发展"]]},{"id":"S03","decisionLines":["这一句要把主题落实到人们能做的事。散步安排了身体活动，阅读、下棋和养花安排了学习与兴趣实践；把这些内容纳入日常生活，就可以概括为追求健康的生活方式。","阅读可以接触知识，下棋需要思考和判断，持续参与爱好又让生活更充实。这些具体安排说明，健康生活也能支持晚年的学习与兴趣发展。","前一个空继续填写“促进老年人身心健康与全面发展”，后一个空调用“追求健康生活方式”的表达，让主题落实为个人选择。"],"emphasis":[["身体活动","学习与兴趣实践","追求健康的生活方式"],["接触知识","思考和判断","学习与兴趣发展"],["促进老年人身心健康与全面发展","追求健康生活方式"]]},{"id":"S04","decisionLines":["前一句写个人怎样安排生活，这句接着解释选择这些活动的动机。散步给身体活动的机会，阅读、下棋带来学习和思考的内容，投入爱好又能带来乐趣和充实感。","身体舒适、精神愉悦以及继续学习的收获，都是人们可能期待的结果。固定句据此概括，人们愿意选择自己认为会带来理想结果的行为。"],"emphasis":[["身体活动的机会","学习和思考的内容","乐趣和充实感"],["身体舒适、精神愉悦","继续学习的收获","理想结果"]]},{"id":"S05","decisionLines":["愿意参加活动，还需要有参加活动的条件。散步需要适合行走的地方，阅读和下棋也需要可使用的空间与活动机会。","因此这句从个人愿望转到周围环境与服务，说明老年人能否继续参加学习和兴趣活动，也与社区提供什么条件有关，为下一句的社会支持作准备。"],"emphasis":[["参加活动的条件","适合行走的地方","空间与活动机会"],["周围环境与服务","学习和兴趣活动","社区提供什么条件"]]},{"id":"S06","decisionLines":["前一句说明参加活动需要环境与服务。老年人要持续散步、阅读和参与兴趣活动，健康状态与便于活动的条件都是支持。","因此战略处选择建设健康中国，再调用库中的对应表达。它从健康和活动条件这一方面，支持老年人安排充实生活、继续参与学习与兴趣活动。"],"emphasis":[["环境与服务","健康状态与便于活动的条件"],["建设健康中国","学习与兴趣活动"]]},{"id":"S07","decisionLines":["这一处填写文章的发布机构，本句使用材料给定的国家卫生健康委员会名称。","把老年人的身体活动、学习兴趣和参与需要纳入社区服务目标，可以为散步、阅读、下棋等活动提供条件；共同活动中的接触和交流，又能丰富社区生活。","所以主题处继续填写“促进老年人身心健康与全面发展”，汇合个人的生活安排与社区提供的支持，收束这一段的社会意义。"],"emphasis":[["文章的发布机构","国家卫生健康委员会"],["身体活动、学习兴趣和参与需要","接触和交流","丰富社区生活"],["促进老年人身心健康与全面发展","社区提供的支持"]]},{"id":"S08","decisionLines":["个人层面讨论身体活动、学习思考和兴趣发展，社区层面讨论怎样提供便于参与的条件，两部分共同支持老年人健康而充实的生活。","结尾用“促进老年人身心健康与全面发展”把这些内容合在一起，让个人的生活安排与社区的服务支持围绕同一个目标收束。"],"emphasis":[["身体活动、学习思考和兴趣发展","便于参与的条件"],["促进老年人身心健康与全面发展","同一个目标"]]},{"id":"S09","decisionLines":["前句归纳了个人与社区的共同收益，本句接着提出倡导这一方向的必要性。","身体得到活动，精神有所寄托，还能继续学习、发展兴趣并参与共同生活，这些方面共同说明模板中的全面发展目标。"],"emphasis":[["个人与社区的共同收益","倡导这一方向"],["继续学习、发展兴趣","参与共同生活","全面发展目标"]]}]},"corpus":{"entries":[{"id":"C_HX_BEHAVIOR_01","value":"和谐","group":"个人行为","text":"balance competing demands and maintain healthy relationships","zh":"平衡各种相互冲突的需求，并维持良好的关系"},{"id":"C_HX_BEHAVIOR_02","value":"和谐","group":"个人行为","text":"resolve conflicts peacefully and prioritize what truly matters","zh":"和平解决争端，并优先考虑真正重要的事情"},{"id":"C_HX_BEHAVIOR_03","value":"和谐","group":"个人行为","text":"connect genuinely with others and nurture community bonds","zh":"真诚地与他人建立联系，并加强社区间的纽带关系"},{"id":"C_HX_BEHAVIOR_04","value":"和谐","group":"个人行为","text":"make use of public services and facilities","zh":"利用公共服务和设施"},{"id":"C_HX_BEHAVIOR_05","value":"和谐","group":"个人行为","text":"conserve resources and protect the environment","zh":"节约资源并保护环境"},{"id":"C_HX_RESULT_01","value":"和谐","group":"个人成果","text":"inner peace and overall well-being","zh":"内心平静与整体福祉"},{"id":"C_HX_RESULT_02","value":"和谐","group":"个人成果","text":"stable relationships and reduced stress","zh":"稳定的关系和减轻的压力"},{"id":"C_HX_RESULT_03","value":"和谐","group":"个人成果","text":"a fulfilling life and personal satisfaction","zh":"充实的生活与个人满足感"},{"id":"C_HX_FIELD_01","value":"和谐","group":"政策领域","text":"livable city development","zh":"宜居城市建设"},{"id":"C_HX_FIELD_02","value":"和谐","group":"政策领域","text":"public health and well-being","zh":"公共健康与福祉"},{"id":"C_HX_FIELD_03","value":"和谐","group":"政策领域","text":"sustainable urban development","zh":"城市可持续发展"},{"id":"C_HX_ABILITY_01","value":"和谐","group":"政策能力","text":"balance work and life while maintaining harmonious relationships","zh":"在保持良好人际关系的同时平衡工作与生活"},{"id":"C_HX_ABILITY_02","value":"和谐","group":"政策能力","text":"access improved public services and recreational facilities","zh":"获得更完善的公共服务和娱乐设施"},{"id":"C_HX_ABILITY_03","value":"和谐","group":"政策能力","text":"pursue healthy lifestyles in well-designed environments","zh":"在精心设计的环境中追求健康的生活方式"},{"id":"C_HX_ABILITY_04","value":"和谐","group":"政策能力","text":"make informed decisions about their health","zh":"依据充分信息作出健康决策"},{"id":"C_HX_EFFECT_01","value":"和谐","group":"社会效果","text":"reducing conflicts and fostering cooperation","zh":"减少冲突并促进合作"},{"id":"C_HX_EFFECT_02","value":"和谐","group":"社会效果","text":"creating livable <script>'use strict';
function createLessonPlan(data){
 const steps=[{kind:'type'}];
 data.teaching.analysis.forEach((_,i)=>steps.push({kind:'analysis',count:i+1}));
 data.sentences.forEach((sentence,i)=>{
  if(!sentence.slots.length){steps.push({kind:'complete',sentence:i});return;}
  const callsCorpus=sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  for(const kind of ['template','decision',...(callsCorpus?['corpus']:[]),'complete'])steps.push({kind,sentence:i});
 });
 steps.push({kind:'essay'});
 const entries=[0,1,...[1,2,3].map(p=>steps.findIndex(s=>s.sentence!==undefined&&data.sentences[s.sentence].paragraph===p)),steps.findIndex(s=>s.kind==='essay')];
 function view(index){
  const state=steps[index],sentence=state.sentence===undefined?null:data.sentences[state.sentence];
  const completed=state.kind==='essay'?data.sentences.length:sentence?state.sentence+(state.kind==='complete'?1:0):0;
  const callsCorpus=!!sentence&&sentence.slots.some(slot=>data.corpus.slotRefs[slot.id]?.length);
  return {state,sentence,completed,callsCorpus,hasDraft:!!sentence&&state.kind!=='complete',showDecision:['decision','corpus'].includes(state.kind),sourceTab:callsCorpus&&['corpus','complete'].includes(state.kind)?'corpus':'template',themeVisible:index>=data.teaching.analysis.length,chapter:state.kind==='type'?0:state.kind==='analysis'?1:state.kind==='essay'?5:sentence.paragraph+1};
 }
 return {steps,entries,view};
}
globalThis.createLessonPlan=createLessonPlan;
</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lesson-data').textContent),PLAN=createLessonPlan(DATA);
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
const area=$('writingScroll'),paper=$('writingPaper'),referenceScroll=$('referenceScroll');
const paragraphSections=[],paragraphs=[],sentenceNodes=new Map(),sentenceSpaces=new Map(),templateNodes=new Map(),corpusNodes=new Map(),corpusGroups=[];
const decisionNode=node('div','decisionLines');decisionNode.hidden=true;
const fillPreviewNode=node('section','fillPreview');fillPreviewNode.setAttribute('id','fillPreview');fillPreviewNode.setAttribute('aria-label','本句填入内容');fillPreviewNode.hidden=true;let fillPreviewSentence=null;
function emphasized(text,fragments=[]){let out=esc(text);for(const part of [...fragments].sort((a,b)=>b.length-a.length))out=out.replace(esc(part),'<strong>'+esc(part)+'</strong>');return out;}
function teachingLine(text,fragments){const p=node('p');p.innerHTML=emphasized(text,fragments);return p;}
const analysisNodes=DATA.teaching.analysis.map((a,i)=>{const n=node('section','analysisBlock');n.dataset.analysis=String(i+1);a.lines.forEach((line,j)=>n.appendChild(teachingLine(line,a.emphasis[j])));return n;});
const analysisAnswer=node('div','themeAnswer');analysisAnswer.innerHTML='<div class="themeEn" lang="en">'+esc(DATA.theme.en)+'</div><div class="themeZh">'+esc(DATA.theme.zh)+'</div>';
let index=0,referenceTab='template',corpusCategory='富强',allMode=false,saved=null,renderTicket=0,decisionSentence=null,preludeKey='',collapsed=false,questionHeight=224,referenceWidth=42,zoom=1;
const tabScroll={template:0,corpus:0};
function templateHTML(s){return esc(s.template).replace(/\{\{([A-Z0-9_]+)\}\}/g,(_,id)=>'<span class="blank">【'+esc(s.slots.find(v=>v.id===id).label)+'】</span>');}
function filledHTML(s){return esc(s.template).replace(/\{\{([A-Z0-9_]+)\}\}/g,(_,id)=>'<strong class="fillWord">'+esc(s.slots.find(v=>v.id===id).value)+'</strong>');}
function initializeContent(){
 for(let p=1;p<=3;p++){
  const section=node('section','paragraphSection'),paragraph=node('p','essayParagraph');paragraph.lang='en';section.appendChild(paragraph);section.hidden=true;$('essayFlow').appendChild(section);paragraphSections.push(section);paragraphs.push(paragraph);
  const group=node('section','templateGroup');group.appendChild(node('h2','',['第一段','第二段','第三段'][p-1]));const text=node('p','templateText');text.lang='en';
  DATA.sentences.filter(s=>s.paragraph===p).forEach((s,i)=>{if(i)text.appendChild(document.createTextNode(' '));const line=node('span','templateSentence');line.dataset.source=s.id;line.innerHTML=templateHTML(s);text.appendChild(line);templateNodes.set(s.id,line);});group.appendChild(text);$('templateView').appendChild(group);
 }
 DATA.sentences.forEach(s=>{const n=node('span','sentence');n.dataset.sentence=s.id;sentenceNodes.set(s.id,n);sentenceSpaces.set(s.id,document.createTextNode(' '));});

 const currentOption=node('option','','本句调用');currentOption.value='__current__';currentOption.setAttribute('id','currentCallsOption');currentOption.hidden=true;$('corpusCategory').appendChild(currentOption);
 for(const value of [...new Set(DATA.corpus.entries.map(e=>e.value))]){

  for(const name of [...new Set(DATA.corpus.entries.filter(e=>e.value===value).map(e=>e.group))]){
   const group=node('section','corpusGroup');group.dataset.value=value;group.appendChild(node('h2','',name));const entries=node('div','corpusEntries');const ids=[];
   DATA.corpus.entries.filter(e=>e.value===value&&e.group===name).forEach(e=>{const wrap=node('div','corpusEntry'),en=node('div','corpusEnglish',e.text),zh=node('div','corpusChinese',e.zh);en.lang='en';wrap.dataset.corpus=e.id;wrap.append(en,zh);entries.appendChild(wrap);corpusNodes.set(e.id,{wrap,en,entry:e});ids.push(e.id);});group.appendChild(entries);$('corpusView').appendChild(group);corpusGroups.push({group,ids,value,name});
  }
 }
 $('themeEnglish').textContent=DATA.theme.en;$('themeChinese').textContent=DATA.theme.zh;$('questionImage').setAttribute('href',DATA.questionImage);$('fullQuestionImage').src=DATA.fullQuestionImage;
 ['读题','确定主题词','第一段','第二段','第三段','完整范文'].forEach((label,i)=>{const option=node('option','',label);option.value=String(i);$('chapter').appendChild(option);});
}
function ensureSentence(s,mode){
 const n=sentenceNodes.get(s.id),p=paragraphs[s.paragraph-1];
 if(n.dataset.mode!==mode){n.innerHTML=mode==='written'?filledHTML(s):templateHTML(s);n.dataset.mode=mode;n.className='sentence'+(mode==='draft'?' draft':'');}
 if(n.parentNode!==p){if(p.childNodes.length)p.appendChild(sentenceSpaces.get(s.id));p.appendChild(n);}

}
function renderPrelude(v){
 const key=v.state.kind==='analysis'?'analysis':'type';
 if(preludeKey!==key){$('prelude').replaceChildren();preludeKey=key;if(key==='type'){$('prelude').append(node('h2','introTitle',DATA.questionType),node('p','introCopy',DATA.typeDetail));}}
 if(key==='analysis'){
  analysisNodes.forEach((n,i)=>{if(i<v.state.count){if(n.parentNode!==$('prelude'))$('prelude').appendChild(n);n.className='analysisBlock'+(i===v.state.count-1?' current':'');}else n.remove();});
