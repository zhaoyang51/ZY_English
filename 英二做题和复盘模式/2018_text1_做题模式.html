<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"questionTop","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**A broken bike chain is mentioned to show students’ lack of ______.**\n\n提到坏掉的自行车链条，是为了说明学生缺少什么？\n\n题型：例子作用题","html":"<h2>21题题干</h2>\n<p><strong>A broken bike chain is mentioned to show students’ lack of ______.</strong></p>\n<p>提到坏掉的自行车链条，是为了说明学生缺少什么？</p>\n<p>题型：例子作用题</p>\n","articleRects":[],"questionRects":[[187,121,615,36]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**There exists the prejudice that vocational education is for kids who ______.**\n\n有一种偏见认为，职业教育是给什么样的孩子的？\n\n题型：细节题","html":"<h2>22题题干</h2>\n<p><strong>There exists the prejudice that vocational education is for kids who ______.</strong></p>\n<p>有一种偏见认为，职业教育是给什么样的孩子的？</p>\n<p>题型：细节题</p>\n","articleRects":[],"questionRects":[[187,377,743,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**We can infer from Paragraph 5 that high school graduates ______.**\n\n从第5段可以推断，高中毕业生的情况是怎样的？\n\n题型：局部推断题","html":"<h2>23题题干</h2>\n<p><strong>We can infer from Paragraph 5 that high school graduates ______.</strong></p>\n<p>从第5段可以推断，高中毕业生的情况是怎样的？</p>\n<p>题型：局部推断题</p>\n","articleRects":[],"questionRects":[[187,630,652,29],[187,672,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**The headlong push into bachelor’s degrees for all ______.**\n\n急着推动所有人取得学士学位，反映了什么？\n\n题型：局部推断题","html":"<h2>24题题干</h2>\n<p><strong>The headlong push into bachelor’s degrees for all ______.</strong></p>\n<p>急着推动所有人取得学士学位，反映了什么？</p>\n<p>题型：局部推断题</p>\n","articleRects":[],"questionRects":[[187,883,484,29],[187,925,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**\n\n作者对Koziatek学校的态度可以怎样描述？\n\n题型：全文作者观点 / 全文主旨题","html":"<h2>25题题干</h2>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<p>作者对Koziatek学校的态度可以怎样描述？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but；On one hand；In other words |\n| 态度词 / 评价词 | 先抓个大概好坏 | curious；better；important |\n| 动作词 | 先看谁做了什么 | give；learn；fill |\n| 结果词 | 看最后出了什么事 | gap；trained |\n| 重复主题词 | 大概知道老在说什么 | school；education；jobs |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but；On one hand；In other words</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>curious；better；important</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>give；learn；fill</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>gap；trained</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>school；education；jobs</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrol 国经济、打开更多的门、中等技能工作、工人。\n\n7、工人阶层、那个机会、一个明显的解决办法、有一个缺口、正试图。"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与学校、教育有关；开头似乎看到更好的未来；中间又出现高中、书本和考试、自行车链条、制造业、工人；结尾还看到一种尺寸适合所有人、天赋。\n\n到这里还不能自然地说清楚：学校、教育、工作和天赋具体怎样联系。粗读时只要能判断“这些内容大概都绕着教育和工作”，并知道这些信息大约出现在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里先留下学校、工作和天赋这些印象。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与学校、教育有关；开头似乎看到更好的未来；中间又出现高中、书本和考试、自行车链条、制造业、工人；结尾还看到一种尺寸适合所有人、天赋。</p>\n<p>到这里还不能自然地说清楚：学校、教育、工作和天赋具体怎样联系。粗读时只要能判断“这些内容大概都绕着教育和工作”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里先留下学校、工作和天赋这些印象。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> A broken bike chain is mentioned to show students’ lack of ______.\n> 提到坏掉的自行车链条，是为了说明学生缺少什么？\n\n题干直接点出a broken bike chain。它在第2段的末句，先把这一段从头读到尾。\n\n> 原文参考：\n>\n> Mr. Koziatek is part of something [xxx]. He is a teacher at a New Hampshire high school where learning is not something of books and tests and mechanical memorization, but practical. When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?\n>\n> 开始精读：\n>\n> Mr. Koziatek is part of something [xxx]. / He is a teacher / at a New Hampshire high school / where learning is not something of books and tests and mechanical memorization, / but practical. / When did it become accepted wisdom / that students should be able to name / the 13th president of the United States / but be utterly [xxx] / by a broken bike chain?\n>\n> Koziatek先生是某种[xxx]事情的一部分。 / 他是一名教师 / 在新罕布什尔州的一所高中 / 那里学习不是书本、考试和机械记忆这类东西， / 而是实际的。 / 什么时候它成了被接受的常识 / 学生应当能够说出名字 / 美国第13任总统的 / 却完全地[xxx] / 因为一条坏掉的自行车链条？\n\n这里把两种表现放在一起：学生能说出总统的名字，面对坏掉的自行车链条却是utterly [xxx]。题干问的是后一种表现暴露出的欠缺，不是前面已经会做的事情。\n\n接下来按A—D逐项看。","html":"<h2>21题</h2>\n<blockquote>\n<p>A broken bike chain is mentioned to show students’ lack of ______.\n提到坏掉的自行车链条，是为了说明学生缺少什么？</p>\n</blockquote>\n<p>题干直接点出a broken bike chain。它在第2段的末句，先把这一段从头读到尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Mr. Koziatek is part of something [xxx]. He is a teacher at a New Hampshire high school where learning is not something of books and tests and mechanical memorization, but practical. When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n<p>开始精读：</p>\n<p>Mr. Koziatek is part of something [xxx]. / He is a teacher / at a New Hampshire high school / where learning is not something of books and tests and mechanical memorization, / but practical. / When did it become accepted wisdom / that students should be able to name / the 13th president of the United States / but be utterly [xxx] / by a broken bike chain?</p>\n<p>Koziatek先生是某种[xxx]事情的一部分。 / 他是一名教师 / 在新罕布什尔州的一所高中 / 那里学习不是书本、考试和机械记忆这类东西， / 而是实际的。 / 什么时候它成了被接受的常识 / 学生应当能够说出名字 / 美国第13任总统的 / 却完全地[xxx] / 因为一条坏掉的自行车链条？</p>\n</blockquote>\n<p>这里把两种表现放在一起：学生能说出总统的名字，面对坏掉的自行车链条却是utterly [xxx]。题干问的是后一种表现暴露出的欠缺，不是前面已经会做的事情。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[183,263,747,30],[135,297,796,29],[135,331,795,29],[135,364,795,30],[135,398,443,29]],"questionRects":[[187,121,615,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. practical ability\n\n> 实际动手能力\n\n把A接回题干，它说的是：学生缺少实际动手的能力。\n\nA的practical ability与第2段的but practical意思接近，回看这句；这里刚把学校的学习方式与书本、考试作对照，末尾又给出自行车链条这个实际情形。\n\n> where learning is not something of books and tests and mechanical memorization, but practical.\n\n> When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?\n\nbut practical说的是在实际事情中学习，practical ability问的也正是这种能力。学生能回答总统姓名，不表示能处理自行车故障。末句用but把两种表现反着放在一起，前半句的会记知识没有解决后半句的实际问题。A把这一区别落到了学生欠缺的能力上。\n\n**能说出总统名字，就等于会处理坏掉的自行车链条吗？**\n\n不能。前者是记住知识，后者需要实际处理问题；A说的正是后者。\n\n**第一轮判断：A保留。**","html":"<h3>A. practical ability</h3>\n<blockquote>\n<p>实际动手能力</p>\n</blockquote>\n<p>把A接回题干，它说的是：学生缺少实际动手的能力。</p>\n<p>A的practical ability与第2段的but practical意思接近，回看这句；这里刚把学校的学习方式与书本、考试作对照，末尾又给出自行车链条这个实际情形。</p>\n<blockquote>\n<p>where learning is not something of books and tests and mechanical memorization, but practical.</p>\n</blockquote>\n<blockquote>\n<p>When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n</blockquote>\n<p>but practical说的是在实际事情中学习，practical ability问的也正是这种能力。学生能回答总统姓名，不表示能处理自行车故障。末句用but把两种表现反着放在一起，前半句的会记知识没有解决后半句的实际问题。A把这一区别落到了学生欠缺的能力上。</p>\n<p><strong>能说出总统名字，就等于会处理坏掉的自行车链条吗？</strong></p>\n<p>不能。前者是记住知识，后者需要实际处理问题；A说的正是后者。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[135,297,796,29],[135,331,795,29],[135,364,795,30],[135,398,443,29]],"questionRects":[[187,121,615,36],[216,167,152,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的practical ability与第2段的but practical意思接近，回看这句；这里刚把学校的学习方式与书本、考试作对照，末尾又给出自行车链条这个实际情形。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"but practical","visibleOptionAnchor":"practical ability"}}}},{"section":"21题","raw":"### B. academic training\n\n> 学业训练\n\n把B接回题干，它说的是：学生缺少学业训练。\n\nB的academic training对应书本学习和考试，回到第2段books and tests所在的前半句，再看总统姓名的例子。\n\n> where learning is not something of books and tests and mechanical memorization, but practical.\n\n> students should be able to name the 13th president of the United States\n\nbooks and tests属于academic training这一边。原文没有把学生写成连课堂知识都没接触过；反而特意说他们能报出总统姓名。自行车链条放在but后面，是说这类学习与处理实际问题之间存在差别。B把已经展示出的书本学习，写成了这个例子要强调的欠缺。\n\n**这个例子批评的是书本知识没有学，还是学了却处理不了实际问题？**\n\n后者。能报出总统姓名与缺少书本训练不是这里的对照重点；被摆出来的短处在动手这一边。\n\n**第一轮判断：B排除。**","html":"<h3>B. academic training</h3>\n<blockquote>\n<p>学业训练</p>\n</blockquote>\n<p>把B接回题干，它说的是：学生缺少学业训练。</p>\n<p>B的academic training对应书本学习和考试，回到第2段books and tests所在的前半句，再看总统姓名的例子。</p>\n<blockquote>\n<p>where learning is not something of books and tests and mechanical memorization, but practical.</p>\n</blockquote>\n<blockquote>\n<p>students should be able to name the 13th president of the United States</p>\n</blockquote>\n<p>books and tests属于academic training这一边。原文没有把学生写成连课堂知识都没接触过；反而特意说他们能报出总统姓名。自行车链条放在but后面，是说这类学习与处理实际问题之间存在差别。B把已经展示出的书本学习，写成了这个例子要强调的欠缺。</p>\n<p><strong>这个例子批评的是书本知识没有学，还是学了却处理不了实际问题？</strong></p>\n<p>后者。能报出总统姓名与缺少书本训练不是这里的对照重点；被摆出来的短处在动手这一边。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[135,297,796,29],[135,331,795,29],[135,364,795,30]],"questionRects":[[187,121,615,36],[215,209,173,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的academic training对应书本学习和考试，回到第2段books and tests所在的前半句，再看总统姓名的例子。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"books and tests","visibleOptionAnchor":"academic training"}}}},{"section":"21题","raw":"### C. [xxx] spirit\n\n> [xxx]精神\n\n把C接回题干，它说的是：学生缺少某种[xxx]精神。\n\nC的spirit说的是一种精神状态，所以回到第2段的a broken bike chain，看末句到底展示学生的精神还是处理故障的表现。\n\n> students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?\n\na broken bike chain是具体故障，前面对应的是学生能报总统名字。两边比的是会做什么，而spirit把欠缺改成了某种精神。即使[xxx]暂时读不懂，后面的spirit仍没有说出从记知识到处理实物这一能力差别。句子也没写学生不愿探索或没有某种志气。\n\n**学生面对具体故障的表现，能直接改写成某种精神的欠缺吗？**\n\n不能。这里比较的是记住知识与实际处理问题，C把被比较的对象换成了精神。\n\n**第一轮判断：C排除。**","html":"<h3>C. [xxx] spirit</h3>\n<blockquote>\n<p>[xxx]精神</p>\n</blockquote>\n<p>把C接回题干，它说的是：学生缺少某种[xxx]精神。</p>\n<p>C的spirit说的是一种精神状态，所以回到第2段的a broken bike chain，看末句到底展示学生的精神还是处理故障的表现。</p>\n<blockquote>\n<p>students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n</blockquote>\n<p>a broken bike chain是具体故障，前面对应的是学生能报总统名字。两边比的是会做什么，而spirit把欠缺改成了某种精神。即使[xxx]暂时读不懂，后面的spirit仍没有说出从记知识到处理实物这一能力差别。句子也没写学生不愿探索或没有某种志气。</p>\n<p><strong>学生面对具体故障的表现，能直接改写成某种精神的欠缺吗？</strong></p>\n<p>不能。这里比较的是记住知识与实际处理问题，C把被比较的对象换成了精神。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[135,364,795,30],[135,398,443,29]],"questionRects":[[187,121,615,36],[215,251,160,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的spirit说的是一种精神状态，所以回到第2段的a broken bike chain，看末句到底展示学生的精神还是处理故障的表现。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"a broken bike chain","visibleOptionAnchor":"spirit"}}}},{"section":"21题","raw":"### D. mechanical memorization\n\n> 机械记忆\n\n把D接回题干，它说的是：学生缺少机械记忆。\n\nD的mechanical memorization说靠记忆掌握知识，因此可以回到第2段name the 13th president这半句来比，再连着读but后的自行车链条。\n\n> students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?\n\nname the 13th president说的是记住一个固定知识点，这更接近mechanical memorization。原文正是把能答知识题的学生与不会应付实际故障的学生写成同一群人。D却把他们前面能表现出来的记忆能力，放进lack of之后，方向反了。\n\n**原文写学生能记住总统姓名，D却说他们缺少机械记忆，这两者对得上吗？**\n\n不能。原文拿已有的知识记忆衬出实际能力的不足，D把已有的一头当成了欠缺。\n\n**第一轮判断：D排除。**","html":"<h3>D. mechanical memorization</h3>\n<blockquote>\n<p>机械记忆</p>\n</blockquote>\n<p>把D接回题干，它说的是：学生缺少机械记忆。</p>\n<p>D的mechanical memorization说靠记忆掌握知识，因此可以回到第2段name the 13th president这半句来比，再连着读but后的自行车链条。</p>\n<blockquote>\n<p>students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n</blockquote>\n<p>name the 13th president说的是记住一个固定知识点，这更接近mechanical memorization。原文正是把能答知识题的学生与不会应付实际故障的学生写成同一群人。D却把他们前面能表现出来的记忆能力，放进lack of之后，方向反了。</p>\n<p><strong>原文写学生能记住总统姓名，D却说他们缺少机械记忆，这两者对得上吗？</strong></p>\n<p>不能。原文拿已有的知识记忆衬出实际能力的不足，D把已有的一头当成了欠缺。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,364,795,30],[135,398,443,29]],"questionRects":[[187,121,615,36],[216,293,249,24]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的mechanical memorization说靠记忆掌握知识，因此可以回到第2段name the 13th president这半句来比，再连着读but后的自行车链条。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"name the 13th president","visibleOptionAnchor":"mechanical memorization"}}}},{"section":"21题","raw":"### 21题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除。\n\nA保留。B、D都落在书本知识或记忆这一边，C则改问精神；自行车链条指向的是学生处理实际问题的能力。","html":"<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A保留。B、D都落在书本知识或记忆这一边，C则改问精神；自行车链条指向的是学生处理实际问题的能力。</p>\n","articleRects":[],"questionRects":[[187,121,615,36],[216,167,152,29],[215,209,173,29],[215,251,160,29],[216,293,249,24]],"scrollTarget":"auto","meta":{"kind":"result","qid":"21"}},{"section":"22题","raw":"## 22题\n\n> There exists the prejudice that vocational education is for kids who ______.\n> 有一种偏见认为，职业教育是给什么样的孩子的？\n\n题干写出了vocational education，第4段直接出现这组词和prejudice。回到这一段，从开头读到引语结束。\n\n> 原文参考：\n>\n> But he’s also found a kind of [xxx] prejudice. Working with your hands is seen as almost a mark of [xxx]. Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.\n>\n> 开始精读：\n>\n> But he’s also found / a kind of [xxx] prejudice. / Working with your hands / is seen as almost a mark of [xxx]. / Schools in the family of vocational education / “have that stereotype...that it’s for kids / who can’t make it academically,” / he says.\n>\n> 但他也发现了 / 一种[xxx]的偏见。 / 用双手干活 / 几乎被看成一种[xxx]的标记。 / 职业教育这一类的学校 / “有那种刻板印象……它是给孩子的 / 那些在学业上做不成的，” / 他说。\n\n引语中的for kids后面接who can’t make it academically。我们要找的是偏见给学生贴的标签；不是作者赞成这个标签，也不是问谁持有偏见。\n\n接下来按A—D逐项看。","html":"<h2>22题</h2>\n<blockquote>\n<p>There exists the prejudice that vocational education is for kids who ______.\n有一种偏见认为，职业教育是给什么样的孩子的？</p>\n</blockquote>\n<p>题干写出了vocational education，第4段直接出现这组词和prejudice。回到这一段，从开头读到引语结束。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But he’s also found a kind of [xxx] prejudice. Working with your hands is seen as almost a mark of [xxx]. Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.</p>\n<p>开始精读：</p>\n<p>But he’s also found / a kind of [xxx] prejudice. / Working with your hands / is seen as almost a mark of [xxx]. / Schools in the family of vocational education / “have that stereotype...that it’s for kids / who can’t make it academically,” / he says.</p>\n<p>但他也发现了 / 一种[xxx]的偏见。 / 用双手干活 / 几乎被看成一种[xxx]的标记。 / 职业教育这一类的学校 / “有那种刻板印象……它是给孩子的 / 那些在学业上做不成的，” / 他说。</p>\n</blockquote>\n<p>引语中的for kids后面接who can’t make it academically。我们要找的是偏见给学生贴的标签；不是作者赞成这个标签，也不是问谁持有偏见。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[182,567,748,29],[135,600,795,30],[135,634,796,29],[135,667,237,30]],"questionRects":[[187,377,743,30]],"scrollTarget":"auto","meta":{"kind":"question","qid":"22"}},{"section":"22题","raw":"### A. have a stereotyped mind\n\n> 有刻板的头脑\n\n把A接回题干，它说的是：这种偏见认为，接受职业教育的孩子思维刻板。\n\nA的stereotyped mind和第4段have that stereotype意思相近，先回到引语，看看刻板印象由谁持有、又在说谁。\n\n> Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.\n\nhave that stereotype指的是职业学校带着一种外界加给它的刻板印象，后面的that说明这种印象的内容：这类学校是给学业上不成功的孩子的。stereotyped mind则把刻板变成孩子自己的思维特点。词相近，归到的人和描述的事情却都换了。\n\n**外界对职业学校有刻板印象，是否等于学生自己思维刻板？**\n\n不等于。原文在讲学校和学生被怎样看待，A却在说学生怎样思考。\n\n**第一轮判断：A排除。**","html":"<h3>A. have a stereotyped mind</h3>\n<blockquote>\n<p>有刻板的头脑</p>\n</blockquote>\n<p>把A接回题干，它说的是：这种偏见认为，接受职业教育的孩子思维刻板。</p>\n<p>A的stereotyped mind和第4段have that stereotype意思相近，先回到引语，看看刻板印象由谁持有、又在说谁。</p>\n<blockquote>\n<p>Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.</p>\n</blockquote>\n<p>have that stereotype指的是职业学校带着一种外界加给它的刻板印象，后面的that说明这种印象的内容：这类学校是给学业上不成功的孩子的。stereotyped mind则把刻板变成孩子自己的思维特点。词相近，归到的人和描述的事情却都换了。</p>\n<p><strong>外界对职业学校有刻板印象，是否等于学生自己思维刻板？</strong></p>\n<p>不等于。原文在讲学校和学生被怎样看待，A却在说学生怎样思考。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,600,795,30],[135,634,796,29],[135,667,237,30]],"questionRects":[[187,377,743,30],[216,419,239,30]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"A","opt an’t make it academically说的是同一件事，所以可以保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[135,634,796,29],[135,667,237,30]],"questionRects":[[187,377,743,30],[215,504,306,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的not academically successful回到第4段can’t make it academically；两处都在说孩子在学业上没能成功。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"can’t make it academically","visibleOptionAnchor":"not academically successful"}}}},{"section":"22题","raw":"### D. are financially [xxx]\n\n> 经济上[xxx]\n\n把D接回题干，它说的是：这种偏见认为，这些孩子在经济上[xxx]。\n\nD的financially问经济状况，所以回到第4段直接限定孩子的academically，比较原句到底在哪个方面下判断。\n\n> it’s for kids who can’t make it academically\n\nacademically说的是学业，financially说的是经济。D后面的[xxx]不管表达经济方面的哪一种状况，都改变了原句的评价范围。引语没有把孩子的学业成绩解释为家庭收入，也没有说职业学校按经济条件接收学生。\n\n**把学业方面的评价改成经济方面的评价，还是同一个偏见吗？**\n\n不是。原句明确限定academically，D明确限定financially，两者评价的方面不同。\n\n**第一轮判断：D排除。**","html":"<h3>D. are financially [xxx]</h3>\n<blockquote>\n<p>经济上[xxx]</p>\n</blockquote>\n<p>把D接回题干，它说的是：这种偏见认为，这些孩子在经济上[xxx]。</p>\n<p>D的financially问经济状况，所以回到第4段直接限定孩子的academically，比较原句到底在哪个方面下判断。</p>\n<blockquote>\n<p>it’s for kids who can’t make it academically</p>\n</blockquote>\n<p>academically说的是学业，financially说的是经济。D后面的[xxx]不管表达经济方面的哪一种状况，都改变了原句的评价范围。引语没有把孩子的学业成绩解释为家庭收入，也没有说职业学校按经济条件接收学生。</p>\n<p><strong>把学业方面的评价改成经济方面的评价，还是同一个偏见吗？</strong></p>\n<p>不是。原句明确限定academically，D明确限定financially，两者评价的方面不同。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,634,796,29],[135,667,237,30]],"questionRects":[[187,377,743,30],[216,546,283,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的financially问经济状况，所以回到第4段直接限定孩子的academically，比较原句到底在哪个方面下判断。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope"],"visibleSourceAnchor":"academically","visibleOptionAnchor":"financially"}}}},{"section":"22题","raw":"### 22题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除。\n\nC保留。引语说的是学业表现；A换了刻板印象的归属，B换成职业动力，D换成经济条件。","html":"<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。引语说的是学业表现；A换了刻板印象的归属，B换成职业动力，D换成经济条件。</p>\n","articleRects":[],"questionRects":[[187,377,743,30],[216,419,239,30],[215,461,255,25],[215,504,306,29],[216,546,283,29]],"scrollTarget":"auto","meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> We can infer from Paragraph 5 that high school graduates ______.\n> 从第5段可以推断，高中毕业生的情况是怎样的？\n\n题干已经限定Paragraph 5。这里直接回到第5段，从On one hand读到rightfully so。\n\n> 原文参考：\n>\n> On one hand, that viewpoint is a logical product of America’s [xxx]. Manufacturing is not the economic engine that it once was. The job security that the US economy once offered to hig 135,836,126,30]],"questionRects":[[187,630,652,29],[187,672,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. used to have big financial concerns\n\n> 过去有很大的经济忧虑\n\n把A接回题干，它说的是：高中毕业生过去常为经济问题严重担忧。\n\nA的big financial concerns是在说过去的不安，所以回到第5段描述过去的job security，看原句把过去写成有保障还是充满担忧。\n\n> Manufacturing is not the economic engine that it once was.\n\n> The job security that the US economy once offered to high school graduates has largely [xxx].\n\njob security是工作上的保障，once offered说明美国经济曾经把这种保障给高中毕业生。big financial concerns却把过去定性成严重的经济忧虑。前面还说制造业过去起到更强的经济推动作用，原文回看的有利就业条件并不是A说的过去更困难。\n\n**过去曾有就业保障，能直接变成过去经济忧虑很大吗？**\n\n不能。A把原文回看的就业保障改成了负面的经济处境，时间相同，评价方向却相反。\n\n**第一轮判断：A排除。**","html":"<h3>A. used to have big financial concerns</h3>\n<blockquote>\n<p>过去有很大的经济忧虑</p>\n</blockquote>\n<p>把A接回题干，它说的是：高中毕业生过去常为经济问题严重担忧。</p>\n<p>A的big financial concerns是在说过去的不安，所以回到第5段描述过去的job security，看原句把过去写成有保障还是充满担忧。</p>\n<blockquote>\n<p>Manufacturing is not the economic engine that it once was.</p>\n</blockquote>\n<blockquote>\n<p>The job security that the US economy once offered to high school graduates has largely [xxx].</p>\n</blockquote>\n<p>job security是工作上的保障，once offered说明美国经济曾经把这种保障给高中毕业生。big financial concerns却把过去定性成严重的经济忧虑。前面还说制造业过去起到更强的经济推动作用，原文回看的有利就业条件并不是A说的过去更困难。</p>\n<p><strong>过去曾有就业保障，能直接变成过去经济忧虑很大吗？</strong></p>\n<p>不能。A把原文回看的就业保障改成了负面的经济处境，时间相同，评价方向却相反。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,735,796,30],[135,769,789,29]],"questionRects":[[187,630,652,29],[187,672,25,24],[216,672,346,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的big financial concerns是在说过去的不安，所以回到第5段描述过去的job security，看原句把过去写成有保障还是充满担忧。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"job security","visibleOptionAnchor":"big financial concerns"}}}},{"section":"23题","raw":"### B. used to have more job opportunities\n\n> 过去有更多就业机会\n\n把B接回题干，它说的是：高中毕业生过去有更多就业机会。\n\nB的more job opportunities是在比较今昔，所以回到第5段once offered所在的就业保障句，再连着看制造业不再像以前的那一句。\n\n> Manufacturing is not the economic engine that it once was.\n\n> The job security that the US economy once offered to high school graduates has largely [xxx].\n\nonce offered把高中毕业生享有就业保障放在过去；制造业如今又不再是从前那个经济发动机。more job opportunities没有说人人都能找到工作，而是概括过去对高中毕业生更有利的就业环境。紧接着转向更多教育，也能与仅靠高中学历不再像以前那么有保障接起来。\n\n**B是在说过去人人有工作，还是过去的就业条件比现在更有利？**\n\n后者。more是相对比较，原文也用once把曾有的就业保障与现在的变化相接。\n\n**第一轮判断：B保留。**","html":"<h3>B. used to have more job opportunities</h3>\n<blockquote>\n<p>过去有更多就业机会</p>\n</blockquote>\n<p>把B接回题干，它说的是：高中毕业生过去有更多就业机会。</p>\n<p>B的more job opportunities是在比较今昔，所以回到第5段once offered所在的就业保障句，再连着看制造业不再像以前的那一句。</p>\n<blockquote>\n<p>Manufacturing is not the economic engine that it once was.</p>\n</blockquote>\n<blockquote>\n<p>The job security that the US economy once offered to high school graduates has largely [xxx].</p>\n</blockquote>\n<p>once offered把高中毕业生享有就业保障放在过去；制造业如今又不再是从前那个经济发动机。more job opportunities没有说人人都能找到工作，而是概括过去对高中毕业生更有利的就业环境。紧接着转向更多教育，也能与仅靠高中学历不再像以前那么有保障接起来。</p>\n<p><strong>B是在说过去人人有工作，还是过去的就业条件比现在更有利？</strong></p>\n<p>后者。more是相对比较，原文也用once把曾有的就业保障与现在的变化相接。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[135,735,796,30],[135,769,789,29]],"questionRects":[[187,630,652,29],[187,672,25,24],[215,714,352,29]],"scrollTarget":"auto","meta":{"kin 原句的主体先是Manufacturing，再是job security，变化都落在经济和岗位保障上，不是毕业生对某个行业的喜恶。</p>\n<p><strong>制造业的经济作用发生变化，就是毕业生不愿去那里工作吗？</strong></p>\n<p>不等于。一个是外部就业条件，一个是求职者的选择意愿，C换了变化的主体。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[135,735,796,30],[135,769,789,29]],"questionRects":[[187,630,652,29],[187,672,25,24],[215,756,377,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的reluctant to work说求职者的意愿，所以回到第5段Manufacturing is not开头的句子，看看制造业为什么被提到。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject"],"visibleSourceAnchor":"Manufacturing is not","visibleOptionAnchor":"reluctant to work"}}}},{"section":"23题","raw":"### D. are [xxx] to more educational privileges\n\n> 对更多教育特权是[xxx]的\n\n把D接回题干，它说的是：高中毕业生对更多教育特权具有某种[xxx]关系。\n\nD的educational privileges谈教育待遇，对应的是第5段We want more这一愿望，先回看原句，看段末的愿望是在授予特权，还是父母希望孩子得到更多教育。\n\n> More education is the new principle. We want more for our kids, and rightfully so.\n\nWe want more的主体是想为孩子争取更好前途的“我们”，educational privileges则说一种教育特权。父母希望孩子接受更多教育，并不等于高中毕业生获得某种特殊资格。D即使保留[xxx]，privileges仍把一般愿望变成了特殊待遇，原句没有这一层分配。\n\n**希望孩子接受更多教育，能变成高中毕业生享有教育特权吗？**\n\n不能。这里表达的是父母的愿望，没有给高中毕业生规定特殊教育待遇。\n\n**第一轮判断：D排除。**","html":"<h3>D. are [xxx] to more educational privileges</h3>\n<blockquote>\n<p>对更多教育特权是[xxx]的</p>\n</blockquote>\n<p>把D接回题干，它说的是：高中毕业生对更多教育特权具有某种[xxx]关系。</p>\n<p>D的educational privileges谈教育待遇，对应的是第5段We want more这一愿望，先回看原句，看段末的愿望是在授予特权，还是父母希望孩子得到更多教育。</p>\n<blockquote>\n<p>More education is the new principle. We want more for our kids, and rightfully so.</p>\n</blockquote>\n<p>We want more的主体是想为孩子争取更好前途的“我们”，educational privileges则说一种教育特权。父母希望孩子接受更多教育，并不等于高中毕业生获得某种特殊资格。D即使保留[xxx]，privileges仍把一般愿望变成了特殊待遇，原句没有这一层分配。</p>\n<p><strong>希望孩子接受更多教育，能变成高中毕业生享有教育特权吗？</strong></p>\n<p>不能。这里表达的是父母的愿望，没有给高中毕业生规定特殊教育待遇。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,803,796,29],[135,836,126,30]],"questionRects":[[187,630,652,29],[187,672,25,24],[216,798,412,30]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的educational privileges谈教育待遇，对应的是第5段We want more这一愿望，先回看原句，看段末的愿望是在授予特权，还是父母希望孩子得到更多教育。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"We want more","visibleOptionAnchor":"educational privileges"}}}},{"section":"23题","raw":"### 23题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除。\n\nB保留。once offered把就业保障放在过去，制造业的今昔对照又给出背景；其余选项分别改成了经济忧虑、求职意愿和教育特权。","html":"<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。once offered把就业保障放在过去，制造业的今昔对照又给出背景；其余选项分别改成了经济忧虑、求职意愿和教育特权。</p>\n","articleRects":[],"questionRects":[[187,630,652,29],[187,672,25,24],[216,672,346,29],[215,714,352,29],[215,756,377,29],[216,798,412,30]],"scrollTarget":"auto","meta":{"kind":"result","qid":"23"}},{"section":"24题","raw":"## 24题\n\n> The headlong push into bachelor’s degrees for all ______.\n> 急着推动所有人取得学士学位，反映了什么？\n\n题干里的headlong push和bachelor’s degrees for all都出现在第6段首句。直接从这一段开头读到最后的trained。\n\n> 原文参考：\n>\n> But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs. Yes, a bachelor’s degree opens more doors. But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing. But only 44 percent of workers are [xxx] trained.\n>\n> 开始精读：\n>\n> But the headlong push into bachelor’s degrees for all— / and the subtle [xxx] of anything less— / misses an important point: / That’s not the only thing the American economy needs. / Yes, a bachelor’s degree opens more doors. / But even now, / 54 percent of the jobs in the country / are middle-skill jobs, / such as construction and high-skill manufacturing. / But only 44 percent of workers / are [xxx] trained.\n>\n> 但急着推动人人取得学士学位—— / 以及对比这低的任何东西的微妙[xxx]—— / 漏掉了重要的一点： / 那不是美国经济唯一需要的东西。 / 是的，学士学位打开更多的门。 / 但即使现在， / 国内54%的工作 / 是中等技能工作， / 例如建筑和高技能制造。 / 但只有44%的工人 / 受到[xxx]的训练。\n\n这里先说全民学士学位漏掉了重要的一点，再拿54%的中等技能岗位和44%的受训工人作比较。我们要判断这种推动与实际需要的关系，不能只看degree opens more doors这一个让步。\n\n接下来按A—D逐项看。","html":"<h2>24题</h2>\n<blockquote>\n<p>The headlong push into bachelor’s degrees for all ______.\n急着推动所有人取得学士学位，反映了什么？</p>\n</blockquote>\n<p>题干里的headlong push和bachelor’s degrees for all都出现在第6段首句。直接从这一段开头读到最后的trained。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs. Yes, a bachelor’s degree opens more doors. But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing. But only 44 percent of workers are [xxx] trained.</p>\n<p>开始精读：</p>\n<p>But the headlong push into bachelor’s degrees for all— / and the subtle [xxx] of anything less— / misses an important point: / That’s not the only thing the American economy needs. / Yes, a bachelor’s degree opens more doors. / But even now, / 54 percent of the jobs in the country / are middle-skill jobs, / such as construction and high-skill manufacturing. / But only 44 percent of workers / are [xxx] trained.</p>\n<p>但急着推动人人取得学士学位—— / 以及对比这低的任何东西的微妙[xxx]—— / 漏掉了重要的一点： / 那不是美国经济唯一需要的东西。 / 是的，学士学位打开更多的门。 / 但即使现在， / 国内54%的工作 / 是中等技能工作， / 例如建筑和高技能制造。 / 但只有44%的工人 / 受到[xxx]的训练。</p>\n</blockquote>\n<p>这里先说全民学士学位漏掉了重要的一点，再拿54%的中等技能岗位和44%的受训工人作比较。我们要判断这种推动与实际需要的关系，不能只看degree opens more doors这一个让步。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,870,746,29],[135,904,796,29],[135,938,796,29],[135,971,795,30],[135,1005,795,29],[135,1039,184,29]],"questionRects":[[187,883,484,29],[187,925,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"24"}},{"section":"24题","raw":"### A. helps create a lot of middle-skill jobs\n\n> 有助于创造大量中等技能工作\n\n把A接回题干，它说的是：推动人人取得学士学位，会创造很多中等技能岗位。\n\nA的create说新增岗位，所以回到第6段54 percent of the jobs所在的句子，看这个比例说已经有哪些工作，还是说学位推动产生了哪些工作。\n\n> But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing.\n\n54 percent of the jobs是在描述当前已经存在的岗位结构，create却增加了“学位推动创造岗位”的因果。原句用even now强调现在仍有这么多中等技能岗位，需要有人接受相应训练；它没有把这些岗位当成人人读本科之后产生的结果。\n\n**现有岗位中有54%是中等技能岗位，等于学位推动创造了这些岗位吗？**\n\n不等于。岗位比例是已有需求，A把需求改成了学位推动带来的结果。\n\n**第一轮判断：A排除。**","html":"<h3>A. helps create a lot of middle-skill jobs</h3>\n<blockquote>\n<p>有助于创造大量中等技能工作</p>\n</blockquote>\n<p>把A接回题干，它说的是：推动人人取得学士学位，会创造很多中等技能岗位。</p>\n<p>A的create说新增岗位，所以回到第6段54 percent of the jobs所在的句子，看这个比例说已经有哪些工作，还是说学位推动产生了哪些工作。</p>\n<blockquote>\n<p>But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing.</p>\n</blockquote>\n<p>54 percent of the jobs是在描述当前已经存在的岗位结构，create却增加了“学位推动创造岗位”的因果。原句用even now强调现在仍有这么多中等技能岗位，需要有人接受相应训练；它没有把这些岗位当成人人读本科之后产生的结果。</p>\n<p><strong>现有岗位中有54%是中等技能岗位，等于学位推动创造了这些岗位吗？</strong></p>\n<p>不等于。岗位比例是已有需求，A把需求改成了学位推动带来的结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,938,796,29],[135,971,795,30],[135,1005,795,29]],"questionRects":[[187,883,484,29],[187,925,25,24],[216,925,367,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的create说新增岗位，所以回到第6段54 percent of the jobs所在的句子，看这个比例说已经有哪些工作，还是说学位推动产生了哪些工作。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality"],"visibleSourceAnchor":"54 percent of the jobs","visibleOptionAnchor":"create"}}}},{"section":"24题","raw":"### B. may narrow the gap in working-class jobs\n\n> 可能缩小工人阶层的岗位缺口\n\n把B接回题干，它说的是：推动人人取得学士学位，可能缩小工人阶层的岗位缺口。\n\nB的narrow the gap指向岗位缺口；下一段的that gap与这个缺口对应，接着把第7段完整读完，看看真正试图填补缺口的是谁。\n\n> 原文参考：\n>\n> In other words, at a time when the working class has turned the country on its political head, [xxx] that the opportunity that once defined America is [xxx], one obvious solution is staring us in the face. There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.\n>\n> 开始精读：\n>\n> In other words, / at a time when the working class has turned the country on its political head, / [xxx] that the opportunity / that once defined America / is [xxx], / one obvious solution is staring us in the face. / There is a gap in working-class jobs, / but the workers who need those jobs most / aren’t [xxx] to do them. / Koziatek’s Manchester School of Technology High School / is trying to fill that gap.\n>\n> 换句话说， / 在工人阶层已经把国家在政治上翻转过来的时候， / [xxx]那个机会 / 曾经界定美国的那个 / 正在[xxx]， / 一个明显的解决办法正摆在我们面前。 / 工人阶层的岗位存在缺口， / 但最需要那些岗位的工人 / 没有[xxx]去做这些工作。 / 科齐亚特克的曼彻斯特技术高中 / 正试图填上那个缺口。\n\n读完这一段，再把narrow the gap和that gap放在一起：\n\n> There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.\n\nfill that gap的主体是Koziatek’s Manchester School of Technology High School。前面解释的是有岗位，却缺能做这些工作的工人。narrow the gap在意思上接近填补缺口，但B把题干中的“人人读本科”接成了实施者；原文恰好说那不是经济唯一需要的东西，随后另举这所学校来回应缺口。\n\n**原文写职业学校在填缺口，能把这个作用转给推动人人读本科吗？**\n\n不能。B换了填补缺口的做法；原文区分的正是单一路径与针对岗位的训练。\n\n**第一轮判断：B排除。**","html":"<h3>B. may narrow the gap in working-class jobs</h3>\n<blockquote>\n<p>可能缩小工人阶层的岗位缺口</p>\n</blockquote>\n<p>把B接回题干，它说的是：推动人人取得学士学位，可能缩小工人阶层的岗位缺口。</p>\n<p>B的narrow the gap指向岗位缺口；下一段的that gap与这个缺口对应，接着把第7段完整读完，看看真正试图填补缺口的是谁。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In other words, at a time when the working class has turned the country on its political head, [xxx] that the opportunity that once defined America is [xxx], one obvious solution is staring us in the face. There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.</p>\n<p>开始精读：</p>\n<p>In other words, / at a time when the working class has turned the country on its political head, / [xxx] that the opportunity / that once defined America / is [xxx], / one obvious solution is staring us in the face. / There is a gap in working-class jobs, / but the workers who need those jobs most / aren’t [xxx] to do them. / Koziatek’s Manchester School of Technology High School / is trying to fill that gap.</p>\n<p>换句话说， / 在工人阶层已经把国家在政治上翻转过来的时候， / [xxx]那个机会 / 曾经界定美国的那个 / 正在[xxx]， / 一个明显的解决办法正摆在我们面前。 / 工人阶层的岗位存在缺口， / 但最需要那些岗位的工人 / 没有[xxx]去做这些工作。 / 科齐亚特克的曼彻斯特技术高中 / 正试图填上那个缺口。</p>\n</blockquote>\n<p>读完这一段，再把narrow the gap和that gap放在一起：</p>\n<blockquote>\n<p>There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.</p>\n</blockquote>\n<p>fill that gap的主体是Koziatek’s Manchester School of Technology High School。前面解释的是有岗位，却缺能做这些工作的工人。narrow the gap在意思上接近填补缺口，但B把题干中的“人人读本科”接成了实施者；原文恰好说那不是经济唯一需要的东西，随后另举这所学校来回应缺口。</p>\n<p><strong>原文写职业学校在填缺口，能把这个作用转给推动人人读本科吗？</strong></p>\n<p>不能。B换了填补缺口的做法；原文区分的正是单一路径与针对岗位的训练。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,870,746,29],[135,904,796,29],[135,938,796,29],[135,971,795,30],[135,1005,795,29],[135,1039,184,29],[183,1073,747,29],[135,1106,795,29],[135,1140,796,29],[135,1174,796,29],[135,1207,796,30],[135,1241,122,29]],"questionRects":[[187,883,484,29],[187,925,25,24],[215,967,411,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的narrow the gap指向岗位缺口；下一段的that gap与这个缺口对应，接着把第7段完整读完，看看真正试图填补缺口的是谁。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[6],"sourceMode":"new_precision_reading","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"un
