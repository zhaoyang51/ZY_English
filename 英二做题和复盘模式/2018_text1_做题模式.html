workforce说受教育之后的劳动队伍，所以回到第6段opens more doors这个让步，再看末尾工人受训比例的比较。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"opens more doors","visibleOptionAnchor":"better-trained workforce"}}}},{"section":"24题","raw":"### D. indicates the overvaluing of higher education\n\n> 显示高等教育被过分看重\n\n把D接回题干，它说的是：推动人人取得学士学位，显示人们过分看重高等教育。\n\nD的overvaluing要与第6段not the only thing对应着看；原文一边承认学位有好处，一边指出经济还有别的需要。\n\n> But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs.\n\nnot the only thing说的是本科并非唯一需要，不是否定大学教育，而是反对把它当成人人唯一的路。overvaluing也不是说高等教育没有价值，而是说给它的分量过大。后面54%的中等技能岗位，正说明把人都推向学士学位，会漏掉很大一部分实际需求。\n\n**D是在否定本科的价值，还是指出把本科当成唯一方向太过头了？**\n\n后者。它与not the only thing的限制相接，既容纳学位的好处，也承认还有别的岗位需要。\n\n**第一轮判断：D保留。**","html":"<h3>D. indicates the overvaluing of higher education</h3>\n<blockquote>\n<p>显示高等教育被过分看重</p>\n</blockquote>\n<p>把D接回题干，它说的是：推动人人取得学士学位，显示人们过分看重高等教育。</p>\n<p>D的overvaluing要与第6段not the only thing对应着看；原文一边承认学位有好处，一边指出经济还有别的需要。</p>\n<blockquote>\n<p>But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs.</p>\n</blockquote>\n<p>not the only thing说的是本科并非唯一需要，不是否定大学教育，而是反对把它当成人人唯一的路。overvaluing也不是说高等教育没有价值，而是说给它的分量过大。后面54%的中等技能岗位，正说明把人都推向学士学位，会漏掉很大一部分实际需求。</p>\n<p><strong>D是在否定本科的价值，还是指出把本科当成唯一方向太过头了？</strong></p>\n<p>后者。它与not the only thing的限制相接，既容纳学位的好处，也承认还有别的岗位需要。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[184,870,746,29],[135,904,796,29],[135,938,796,29]],"questionRects":[[187,883,484,29],[187,925,25,24],[216,1051,440,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的overvaluing要与第6段not the only thing对应着看；原文一边承认学位有好处，一边指出经济还有别的需要。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"not the only thing","visibleOptionAnchor":"overvaluing"}}}},{"section":"24题","raw":"### 24题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D保留。\n\nC、D保留。D能接住“本科不是唯一需要”的批评；C仍牵涉教育与劳动者的训练，关键动作暂时没读清。","html":"<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D保留。</li>\n</ul>\n<p>C、D保留。D能接住“本科不是唯一需要”的批评；C仍牵涉教育与劳动者的训练，关键动作暂时没读清。</p>\n","articleRects":[],"questionRects":[[187,883,484,29],[187,925,25,24],[216,925,367,29],[215,967,411,29],[215,1009,451,29],[216,1051,440,29]],"scrollTarget":"auto","meta":{"kind":"result","qid":"24"}},{"section":"25题","raw":"## 25题\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**\n\n作者对Koziatek学校的态度可以怎样描述？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **supportive**\n\n支持的\n\nB. **tolerant**\n\n容忍的\n\nC. **disappointed**\n\n失望的\n\nD. **cautious**\n\n谨慎的","html":"<h2>25题</h2>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<p>作者对Koziatek学校的态度可以怎样描述？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>supportive</strong></p>\n<p>支持的</p>\n<p>B. <strong>tolerant</strong></p>\n<p>容忍的</p>\n<p>C. <strong>disappointed</strong></p>\n<p>失望的</p>\n<p>D. <strong>cautious</strong></p>\n<p>谨慎的</p>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27],[499,1393,43,25],[564,1394,31,22],[611,1393,60,26],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。\n\n> 原文参考：\n>\n> It is curious that Stephen Koziatek feels almost as though he has to [xxx] his efforts to give his students a better future.\n>\n> 开始精读：\n>\n> It is curious / that Stephen Koziatek feels almost as though / he has to [xxx] his efforts / to give his students a better future.\n>\n> 这很奇怪 / Stephen Koziatek感觉几乎好像 / 他不得不[xxx]他的努力 / 去给他的学生一个更好的未来。\n\n> 原文参考：\n>\n> As Koziatek knows, there is learning in just about everything. Nothing is necessarily gained by forcing students to learn geometry at a [xxx] desk stuck with generations of [xxx] chewing gum. They can also learn geometry by [xxx] a bicycle.\n>\n> 开始精读：\n>\n> As Koziatek knows, / there is learning in just about everything. / Nothing is necessarily gained / by forcing students to learn geometry / at a [xxx] desk / stuck with generations of [xxx] chewing gum. / They can also learn geometry / by [xxx] a bicycle.\n>\n> 正如Koziatek知道的， / 几乎一切事物里都有学习。 / 未必获得什么 / 靠强迫学生学习几何 / 在一张[xxx]的课桌前 / 粘着一代代留下的[xxx]口香糖。 / 他们也能学习几何 / 通过[xxx]一辆自行车。\n\n> 原文参考：\n>\n> Koziatek’s school is a wake-up call. When education becomes one-size-fits-all, it risks overlooking a nation’s diversity of gifts.\n>\n> 开始精读：\n>\n> Koziatek’s school is a wake-up call. / When education becomes one-size-fits-all, / it risks overlooking / a nation’s diversity of gifts.\n>\n> 科齐亚特克的学校是一次提醒。 / 当教育变成一种尺寸适合所有人时， / 它就有忽略的风险 / 一个国家中天赋的多样性。\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用better future与curious开场，对学校帮助学生却要解释自己表示奇怪 | 先说这件事让人觉得奇怪 |\n| 第2段 | 介绍把学习落到实际事情上的高中，用总统姓名与自行车链条作对照 | 再把两种做法摆在一起 |\n| 第3段 | 拿学几何说明课堂并不是唯一能学知识的地方 | 举一个例子说明还有别的路 |\n| 第4段 | 指出职业教育被看成学业不成功者的去处，交代学校面对的偏见 | 接着说它却被人看低 |\n| 第5段 | 承认追求更多教育有制造业与就业变化的背景 | 先让一步说这种想法有来由 |\n| 第6段 | 转回来说明本科并非唯一需要，中等技能岗位需要相应工人 | 但话说回来还有一块没顾上 |\n| 第7段 | 指出岗位与工人训练之间的缺口，并写这所学校试图填补它 | 再说它正好在补这一块 |\n| 第8段 | 用wake-up call肯定提醒作用，警惕教育一刀切忽略不同天赋 | 最后说不能让大家只走一条路 |\n\n---\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<p>前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It is curious that Stephen Koziatek feels almost as though he has to [xxx] his efforts to give his students a better future.</p>\n<p>开始精读：</p>\n<p>It is curious / that Stephen Koziatek feels almost as though / he has to [xxx] his efforts / to give his students a better future.</p>\n<p>这很奇怪 / Stephen Koziatek感觉几乎好像 / 他不得不[xxx]他的努力 / 去给他的学生一个更好的未来。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>As Koziatek knows, there is learning in just about everything. Nothing is necessarily gained by forcing students to learn geometry at a [xxx] desk stuck with generations of [xxx] chewing gum. They can also learn geometry by [xxx] a bicycle.</p>\n<p>开始精读：</p>\n<p>As Koziatek knows, / there is learning in just about everything. / Nothing is necessarily gained / by forcing students to learn geometry / at a [xxx] desk / stuck with generations of [xxx] chewing gum. / They can also learn geometry / by [xxx] a bicycle.</p>\n<p>正如Koziatek知道的， / 几乎一切事物里都有学习。 / 未必获得什么 / 靠强迫学生学习几何 / 在一张[xxx]的课桌前 / 粘着一代代留下的[xxx]口香糖。 / 他们也能学习几何 / 通过[xxx]一辆自行车。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Koziatek’s school is a wake-up call. When education becomes one-size-fits-all, it risks overlooking a nation’s diversity of gifts.</p>\n<p>开始精读：</p>\n<p>Koziatek’s school is a wake-up call. / When education becomes one-size-fits-all, / it risks overlooking / a nation’s diversity of gifts.</p>\n<p>科齐亚特克的学校是一次提醒。 / 当教育变成一种尺寸适合所有人时， / 它就有忽略的风险 / 一个国家中天赋的多样性。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用better future与curious开场，对学校帮助学生却要解释自己表示奇怪</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍把学习落到实际事情上的高中，用总统姓名与自行车链条作对照</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿学几何说明课堂并不是唯一能学知识的地方</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出职业教育被看成学业不成功者的去处，交代学校面对的偏见</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>承认追求更多教育有制造业与就业变化的背景</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>转回来说明本科并非唯一需要，中等技能岗位需要相应工人</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>指出岗位与工人训练之间的缺口，并写这所学校试图填补它</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>用wake-up call肯定提醒作用，警惕教育一刀切忽略不同天赋</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n","articleRects":[[183,196,747,29],[135,230,411,29],[183,432,747,29],[135,466,796,29],[135,499,795,30],[135,533,209,29],[183,1275,614,29],[180,1308,466,30]],"questionRects":[[187,1135,739,29],[442,1393,44,27],[499,1393,43,25],[564,1394,31,22],[611,1393,60,26],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"### A. supportive\n\n支持的\n\n#### 如果 A 是主旨，文章8段应该怎么写？\n\n如果A是主旨，文章中心就应该是“作者支持Koziatek学校的做法”。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以反问或意外感肯定学校帮助学生 | 先说这件事让人觉得奇怪 |\n| 第2段 | 介绍实际学习的价值并与只记书本知识相比 | 再把两种做法摆在一起 |\n| 第3段 | 用几何学习例子继续说明学校的做法能成立 | 举一个例子说明还有别的路 |\n| 第4段 | 指出对职业学校的低评价不公允 | 接着说它却被人看低 |\n| 第5段 | 承认人们追求更多教育有现实背景 | 先让一步说这种想法有来由 |\n| 第6段 | 说明认可大学不妨碍承认中等技能训练的需要 | 但话说回来还有一块没顾上 |\n| 第7段 | 把学校做法与填补岗位缺口接起来 | 再说它正好在补这一块 |\n| 第8段 | 明确肯定学校的提醒，主张照顾不同天赋 | 最后说不能让大家只走一条路 |\n\n开头的better future给学校努力一个正面方向，curious反而在问为什么这样做还需要解释。中间不是只称赞一次：实际学习、几何例子、中等技能岗位以及学校填缺口互相接着写。结尾把学校称作wake-up call，又批评one-size-fits-all，肯定的是这所学校给单一路径提供的提醒。\n\n**支持这一态度能不能同时接住学校的实际教学、岗位作用和结尾的提醒？**\n\n能。文章承认大学教育有价值，却继续说明职业学校也回应真实需要；这种让步没有改变对该校的肯定。\n\n**判断：A保留。**\n\n---\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**","html":"<h3>A. supportive</h3>\n<p>支持的</p>\n<h4>如果 A 是主旨，文章8段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“作者支持Koziatek学校的做法”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>以反问或意外感肯定学校帮助学生</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍实际学习的价值并与只记书本知识相比</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用几何学习例子继续说明学校的做法能成立</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出对职业学校的低评价不公允</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>承认人们追求更多教育有现实背景</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明认可大学不妨碍承认中等技能训练的需要</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>把学校做法与填补岗位缺口接起来</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>明确肯定学校的提醒，主张照顾不同天赋</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>开头的better future给学校努力一个正面方向，curious反而在问为什么这样做还需要解释。中间不是只称赞一次：实际学习、几何例子、中等技能岗位以及学校填缺口互相接着写。结尾把学校称作wake-up call，又批评one-size-fits-all，肯定的是这所学校给单一路径提供的提醒。</p>\n<p><strong>支持这一态度能不能同时接住学校的实际教学、岗位作用和结尾的提醒？</strong></p>\n<p>能。文章承认大学教育有价值，却继续说明职业学校也回应真实需要；这种让步没有改变对该校的肯定。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27],[499,1393,43,25]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"A"}},{"section":"25题","raw":"### B. tolerant\n\n容忍的\n\n#### 如果 B 是主旨，文章8段应该怎么写？\n\n如果B是主旨，文章中心就应该是“作者仅仅容忍这所学校”。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先表示学校的存在虽不理想却可以容忍 | 先说这件事让人觉得奇怪 |\n| 第2段 | 把实际学习写成可以勉强接受的另一做法 | 再把两种做法摆在一起 |\n| 第3段 | 说明这种学习即使有缺点也不必禁止 | 举一个例子说明还有别的路 |\n| 第4段 | 承认批评虽有道理，仍应让学校存在 | 接着说它却被人看低 |\n| 第5段 | 以社会变化说明容忍学校的必要 | 先让一步说这种想法有来由 |\n| 第6段 | 把岗位需求写成勉强容忍这种教育的理由 | 但话说回来还有一块没顾上 |\n| 第7段 | 说明填缺口足以让人退一步接受它 | 再说它正好在补这一块 |\n| 第8段 | 最终表示谈不上赞许但仍可以容忍 | 最后说不能让大家只走一条路 |\n\ntolerant只是允许某种自己未必赞成的做法存在。可是原文主动替学校说明价值，最后还把它写成值得全国教育听见的提醒。第5段的让步是给追求更多教育的人，不是给学校勉强发一个通行证。\n\n**只是容忍，能够解释作者为什么连着替学校说明教学价值和填缺口作用吗？**\n\n不能。学校在文章里承担积极作用，并没有被写成虽不好但可以忍受的例外。\n\n**判断：B排除。**\n\n---\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**","html":"<h3>B. tolerant</h3>\n<p>容忍的</p>\n<h4>如果 B 是主旨，文章8段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“作者仅仅容忍这所学校”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先表示学校的存在虽不理想却可以容忍</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>把实际学习写成可以勉强接受的另一做法</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明这种学习即使有缺点也不必禁止</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>承认批评虽有道理，仍应让学校存在</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>以社会变化说明容忍学校的必要</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>把岗位需求写成勉强容忍这种教育的理由</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>说明填缺口足以让人退一步接受它</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最终表示谈不上赞许但仍可以容忍</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>tolerant只是允许某种自己未必赞成的做法存在。可是原文主动替学校说明价值，最后还把它写成值得全国教育听见的提醒。第5段的让步是给追求更多教育的人，不是给学校勉强发一个通行证。</p>\n<p><strong>只是容忍，能够解释作者为什么连着替学校说明教学价值和填缺口作用吗？</strong></p>\n<p>不能。学校在文章里承担积极作用，并没有被写成虽不好但可以忍受的例外。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27],[564,1394,31,22]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"B"}},{"section":"25题","raw":"### C. disappointed\n\n失望的\n\n#### 如果 C 是主旨，文章8段应该怎么写？\n\n如果C是主旨，文章中心就应该是“作者对这所学校感到失望”。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 开头表达学校未达到期待 | 先说这件事让人觉得奇怪 |\n| 第2段 | 用学习方式对照显示学校令人失望 | 再把两种做法摆在一起 |\n| 第3段 | 拿几何学习说明实际教学没有成效 | 举一个例子说明还有别的路 |\n| 第4段 | 赞同外界对职业学校的负面评价 | 接着说它却被人看低 |\n| 第5段 | 用就业变化解释这所学校的落后 | 先让一步说这种想法有来由 |\n| 第6段 | 说明学校无法回应劳动市场 | 但话说回来还有一块没顾上 |\n| 第7段 | 强调学校填补缺口的努力失败 | 再说它正好在补这一块 |\n| 第8段 | 最后表达失望并不建议这种做法 | 最后说不能让大家只走一条路 |\n\ndisappointed要求学校让作者的期待落空，文章却从更好的未来写到trying to fill that gap。被批评的是职业教育受到的偏见和教育一刀切，不是这所学校的失败。把批评对象放回句子，负面态度就不能转给学校。\n\n**文中的批评指向学校本身，还是压低职业教育、只推一种道路的观念？**\n\n后者。学校被用来回应问题，而不是制造问题；失望的态度会把被批评对象倒过来。\n\n**判断：C排除。**\n\n---\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**","html":"<h3>C. disappointed</h3>\n<p>失望的</p>\n<h4>如果 C 是主旨，文章8段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“作者对这所学校感到失望”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>开头表达学校未达到期待</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>用学习方式对照显示学校令人失望</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿几何学习说明实际教学没有成效</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>赞同外界对职业学校的负面评价</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用就业变化解释这所学校的落后</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明学校无法回应劳动市场</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>强调学校填补缺口的努力失败</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后表达失望并不建议这种做法</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>disappointed要求学校让作者的期待落空，文章却从更好的未来写到trying to fill that gap。被批评的是职业教育受到的偏见和教育一刀切，不是这所学校的失败。把批评对象放回句子，负面态度就不能转给学校。</p>\n<p><strong>文中的批评指向学校本身，还是压低职业教育、只推一种道路的观念？</strong></p>\n<p>后者。学校被用来回应问题，而不是制造问题；失望的态度会把被批评对象倒过来。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27],[611,1393,60,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"C"}},{"section":"25题","raw":"### D. cautious\n\n谨慎的\n\n#### 如果 D 是主旨，文章8段应该怎么写？\n\n如果D是主旨，文章中心就应该是“作者对学校采取谨慎观望的态度”。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 开头提醒学校做法需要谨慎看待 | 先说这件事让人觉得奇怪 |\n| 第2段 | 介绍实际学习同时强调其不确定风险 | 再把两种做法摆在一起 |\n| 第3段 | 拿几何学习说明仍要小心试验 | 举一个例子说明还有别的路 |\n| 第4段 | 把偏见变成合理担忧 | 接着说它却被人看低 |\n| 第5段 | 用就业变化提醒职业教育前景不稳 | 先让一步说这种想法有来由 |\n| 第6段 | 强调是否需要这种学校还应观望 | 但话说回来还有一块没顾上 |\n| 第7段 | 写学校能否填缺口仍有重大疑问 | 再说它正好在补这一块 |\n| 第8段 | 最终对该校保留审慎的结论 | 最后说不能让大家只走一条路 |\n\ncautious要求作者保留明显顾虑，结尾却直接用wake-up call肯定它的提醒作用。文章确实承认更多教育有背景，但那是在解释另一种想法的来由，并未罗列这所学校的风险。它的多条积极作用也没有被最后收回。\n\n**谨慎观望能解释结尾明确把学校作为提醒吗？**\n\n不能。全文没有以风险和不确定性收尾，而是在学校做法的基础上反对教育一刀切。\n\n**判断：D排除。**\n\n---\n\n**The author’s attitude toward Koziatek’s school can be described as ______.**","html":"<h3>D. cautious</h3>\n<p>谨慎的</p>\n<h4>如果 D 是主旨，文章8段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“作者对学校采取谨慎观望的态度”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>开头提醒学校做法需要谨慎看待</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍实际学习同时强调其不确定风险</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿几何学习说明仍要小心试验</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把偏见变成合理担忧</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用就业变化提醒职业教育前景不稳</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>强调是否需要这种学校还应观望</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>写学校能否填缺口仍有重大疑问</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最终对该校保留审慎的结论</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>cautious要求作者保留明显顾虑，结尾却直接用wake-up call肯定它的提醒作用。文章确实承认更多教育有背景，但那是在解释另一种想法的来由，并未罗列这所学校的风险。它的多条积极作用也没有被最后收回。</p>\n<p><strong>谨慎观望能解释结尾明确把学校作为提醒吗？</strong></p>\n<p>不能。全文没有以风险和不确定性收尾，而是在学校做法的基础上反对教育一刀切。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"D"}},{"section":"25题","raw":"### 25题结论\n\n**25. A. supportive**\n\n这句话就是本文后续做题的主旨底牌：\n\n**supportive / 支持的**\n\n---","html":"<h3>25题结论</h3>\n<p><strong>25. A. supportive</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>supportive / 支持的</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[187,1135,739,29],[442,1393,44,27],[499,1393,43,25],[564,1394,31,22],[611,1393,60,26],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"25"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查24题：C还是D？\n\n第一遍留下：\n\n- C. is expected to [xxx] a better-trained workforce\n- D. indicates the overvaluing of higher education\n\n主旨底牌是：\n\n> **supportive**\n\n也就是：\n\n> 作者支持这所职业学校，因为它回应了单一路径没有顾到的实际需要。\n\n我们先把题干和两个选项接起来。\n\nC接上题干，是说推动人人读本科被期待去[xxx]更好的劳动队伍；D接上题干，是说这种推动反映对高等教育的过分看重。第一遍C里有一个动作没有读清，原文又承认学士学位会打开更多机会，所以教育改善劳动者这层期待看起来有联系。D则能直接回应not the only thing。\n\n现在拿主旨来检查。\n\n先看D。现在确认作者是在支持一所提供实际训练的职业学校；这种支持的理由，就是教育不能把人人都推向同一种学位。D的overvaluing说的不是大学无用，而是把大学教育的价值扩大为唯一标准，这与学校为何值得支持接得上。\n\n再看C。C停留在大家对学位和劳动队伍的期待，不能说明作者为什么紧接着强调中等技能岗位，也不能说明为什么要另举Koziatek学校去fill that gap。若把这种期待当成作者对headlong push的评价，就把文章正在纠正的单一路径继续当成解决办法。\n\n回到第6段，misses an important point和not the only thing已经指出全民学位推动漏掉需求；第7段又把填缺口的努力交给职业学校。D既能解释这两个局部动作，也能解释全文为什么肯定学校。C即使某个期待听来合理，也没有回答作者指出的那种过度看重，因此最后选D。\n\n> **24题选D。**\n\n---","html":"<h2>回查24题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. is expected to [xxx] a better-trained workforce</li>\n<li>D. indicates the overvaluing of higher education</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>supportive</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>作者支持这所职业学校，因为它回应了单一路径没有顾到的实际需要。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>C接上题干，是说推动人人读本科被期待去[xxx]更好的劳动队伍；D接上题干，是说这种推动反映对高等教育的过分看重。第一遍C里有一个动作没有读清，原文又承认学士学位会打开更多机会，所以教育改善劳动者这层期待看起来有联系。D则能直接回应not the only thing。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看D。现在确认作者是在支持一所提供实际训练的职业学校；这种支持的理由，就是教育不能把人人都推向同一种学位。D的overvaluing说的不是大学无用，而是把大学教育的价值扩大为唯一标准，这与学校为何值得支持接得上。</p>\n<p>再看C。C停留在大家对学位和劳动队伍的期待，不能说明作者为什么紧接着强调中等技能岗位，也不能说明为什么要另举Koziatek学校去fill that gap。若把这种期待当成作者对headlong push的评价，就把文章正在纠正的单一路径继续当成解决办法。</p>\n<p>回到第6段，misses an important point和not the only thing已经指出全民学位推动漏掉需求；第7段又把填缺口的努力交给职业学校。D既能解释这两个局部动作，也能解释全文为什么肯定学校。C即使某个期待听来合理，也没有回答作者指出的那种过度看重，因此最后选D。</p>\n<blockquote>\n<p><strong>24题选D。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[[184,870,746,29],[135,904,796,29],[135,938,796,29],[135,971,795,30],[135,1005,795,29],[135,1039,184,29],[183,1073,747,29],[135,1106,795,29],[135,1140,796,29],[135,1174,796,29],[135,1207,796,30],[135,1241,122,29],[183,1275,614,29],[180,1308,466,30]],"questionRects":[[187,883,484,29],[187,925,25,24],[215,1009,451,29],[187,883,484,29],[187,925,25,24],[216,1051,440,29]],"scrollTarget":"auto","meta":{"kind":"review","qid":"24"}},{"section":"最终答案","raw":"## 最终答案：\n\n**21. A**\n\n**22. C**\n\n**23. B**\n\n**24. D**\n\n**25. A**","html":"<h2>最终答案：</h2>\n<p><strong>21. A</strong></p>\n<p><strong>22. C</strong></p>\n<p><strong>23. B</strong></p>\n<p><strong>24. D</strong></p>\n<p><strong>25. A</strong></p>\n","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"final"}}],"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>21题题干</h2>\n<p><strong>A broken bike chain is mentioned to show students’ lack of ______.</strong></p>\n<p>提到坏掉的自行车链条，是为了说明学生缺少什么？</p>\n<p>题型：例子作用题</p>\n<h2>22题题干</h2>\n<p><strong>There exists the prejudice that vocational education is for kids who ______.</strong></p>\n<p>有一种偏见认为，职业教育是给什么样的孩子的？</p>\n<p>题型：细节题</p>\n<h2>23题题干</h2>\n<p><strong>We can infer from Paragraph 5 that high school graduates ______.</strong></p>\n<p>从第5段可以推断，高中毕业生的情况是怎样的？</p>\n<p>题型：局部推断题</p>\n<h2>24题题干</h2>\n<p><strong>The headlong push into bachelor’s degrees for all ______.</strong></p>\n<p>急着推动所有人取得学士学位，反映了什么？</p>\n<p>题型：局部推断题</p>\n<h2>25题题干</h2>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<p>作者对Koziatek学校的态度可以怎样描述？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but；On one hand；In other words</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>curious；better；important</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>give；learn；fill</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>gap；trained</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>school；education；jobs</td>\n</tr>\n</tbody></table>\n<p>It is curious that Stephen Koziatek feels almost as though he has to [xxx] his efforts to give his students a better future.</p>\n<p>Mr. Koziatek is part of something [xxx]. He is a teacher at a New Hampshire high school where learning is not something of books and tests and mechanical memorization, but practical. When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n<p>As Koziatek knows, there is learning in just about everything. Nothing is necessarily gained by forcing students to learn geometry at a [xxx] desk stuck with generations of [xxx] chewing gum. They can also learn geometry by [xxx] a bicycle.</p>\n<p>But he’s also found a kind of [xxx] prejudice. Working with your hands is seen as almost a mark of [xxx]. Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.</p>\n<p>On one hand, that viewpoint is a logical product of America’s [xxx]. Manufacturing is not the economic engine that it once was. The job security that the US economy once offered to high school graduates has largely [xxx]. More education is the new principle. We want more for our kids, and rightfully so.</p>\n<p>But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs. Yes, a bachelor’s degree opens more doors. But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing. But only 44 percent of workers are [xxx] trained.</p>\n<p>In other words, at a time when the working class has turned the country on its political head, [xxx] that the opportunity that once defined America is [xxx], one obvious solution is staring us in the face. There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.</p>\n<p>Koziatek’s school is a wake-up call. When education becomes one-size-fits-all, it risks overlooking a nation’s diversity of gifts.</p>\n<p>It is curious / that Stephen Koziatek feels almost as though / he has to [xxx] his efforts / to give his students a better future.</p>\n<p>Mr. Koziatek is part of something [xxx]. / He is a teacher / at a New Hampshire high school / where learning is not something of books and tests and mechanical memorization, / but practical. / When did it become accepted wisdom / that students should be able to name / the 13th president of the United States / but be utterly [xxx] / by a broken bike chain?</p>\n<p>As Koziatek knows, / there is learning in just about everything. / Nothing is necessarily gained / by forcing students to learn geometry / at a [xxx] desk / stuck with generations of [xxx] chewing gum. / They can also learn geometry / by [xxx] a bicycle.</p>\n<p>But he’s also found / a kind of [xxx] prejudice. / Working with your hands / is seen as almost a mark of [xxx]. / Schools in the family of vocational education / “have that stereotype...that it’s for kids / who can’t make it academically,” / he says.</p>\n<p>On one hand, / that viewpoint is a logical product / of America’s [xxx]. / Manufacturing is not the economic engine / that it once was. / The job security / that the US economy once offered to high school graduates / has largely [xxx]. / More education is the new principle. / We want more for our kids, / and rightfully so.</p>\n<p>But the headlong push into bachelor’s degrees for all— / and the subtle [xxx] of anything less— / misses an important point: / That’s not the only thing the American economy needs. / Yes, a bachelor’s degree opens more doors. / But even now, / 54 percent of the jobs in the country / are middle-skill jobs, / such as construction and high-skill manufacturing. / But only 44 percent of workers / are [xxx] trained.</p>\n<p>In other words, / at a time when the working class has turned the country on its political head, / [xxx] that the opportunity / that once defined America / is [xxx], / one obvious solution is staring us in the face. / There is a gap in working-class jobs, / but the workers who need those jobs most / aren’t [xxx] to do them. / Koziatek’s Manchester School of Technology High School / is trying to fill that gap.</p>\n<p>Koziatek’s school is a wake-up call. / When education becomes one-size-fits-all, / it risks overlooking / a nation’s diversity of gifts.</p>\n<p>这很奇怪 / that Stephen Koziatek 感觉几乎 as though / he has to [xxx] 他的努力 / to give his students 更好的未来.</p>\n<p>Mr. Koziatek is part of something [xxx]. / He is 一名教师 / at a New Hampshire 高中 / where learning is not something of 书本和考试 and mechanical memorization, / 而是实际的. / When did it become accepted wisdom / that students should be able to name / the 13th president of the United States / but be utterly [xxx] / by 一条坏掉的自行车链条?</p>\n<p>As Koziatek knows, / 有学习 in just about everything. / Nothing is necessarily gained / by forcing 学生 to learn geometry / at a [xxx] desk / stuck with generations of [xxx] chewing gum. / 他们也能学习几何 / by [xxx] 一辆自行车.</p>\n<p>But he’s also found / a kind of [xxx] 偏见. / 用双手干活 / is seen as almost a mark of [xxx]. / Schools in the family of 职业教育 / “have that stereotype...that it’s 给孩子 / who can’t make it academically,” / he says.</p>\n<p>On one hand, / that viewpoint is a logical product / of America’s [xxx]. / 制造业 is not the economic engine / that it once was. / 就业保障 / that the US economy once offered to 高中毕业生 / has largely [xxx]. / 更多教育 is the new principle. / We want more for 我们的孩子, / and rightfully so.</p>\n<p>But the headlong push into bachelor’s degrees for all— / and the subtle [xxx] of anything less— / misses 重要的一点: / That’s not the only thing 美国经济 needs. / Yes, a bachelor’s degree 打开更多的门. / But even now, / 54 percent of the jobs in the country / are 中等技能工作, / such as construction and high-skill manufacturing. / But only 44 percent of 工人 / are [xxx] trained.</p>\n<p>In other words, / at a time when 工人阶层 has turned the country on its political head, / [xxx] that 那个机会 / that once defined America / is [xxx], / 一个明显的解决办法 is staring us in the face. / 有一个缺口 in working-class jobs, / but the workers who need those jobs most / aren’t [xxx] to do them. / Koziatek’s Manchester School of Technology High School / 正试图 to fill that gap.</p>\n<p>Koziatek’s 学校 is a wake-up call. / 当教育变成 一种尺寸适合所有人, / it risks overlooking / 一个国家的 diversity of 天赋.</p>\n<p>1、很奇怪、他的努力、更好的未来。</p>\n<p>2、一名教师、高中、书本和考试、实际的、一条坏掉的自行车链条。</p>\n<p>3、有学习、学生、学习几何、一辆自行车。</p>\n<p>4、偏见、用双手干活、职业教育、给孩子。</p>\n<p>5、制造业、就业保障、高中毕业生、更多教育、我们的孩子。</p>\n<p>6、重要的一点、美国经济、打开更多的门、中等技能工作、工人。</p>\n<p>7、工人阶层、那个机会、一个明显的解决办法、有一个缺口、正试图。</p>\n<p>8、学校、教育、一种尺寸适合所有人、一个国家的、天赋。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与学校、教育有关；开头似乎看到更好的未来；中间又出现高中、书本和考试、自行车链条、制造业、工人；结尾还看到一种尺寸适合所有人、天赋。</p>\n<p>到这里还不能自然地说清楚：学校、教育、工作和天赋具体怎样联系。粗读时只要能判断“这些内容大概都绕着教育和工作”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里先留下学校、工作和天赋这些印象。</p>\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<h2>21题</h2>\n<blockquote>\n<p>A broken bike chain is mentioned to show students’ lack of ______.\n提到坏掉的自行车链条，是为了说明学生缺少什么？</p>\n</blockquote>\n<p>题干直接点出a broken bike chain。它在第2段的末句，先把这一段从头读到尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Mr. Koziatek is part of something [xxx]. He is a teacher at a New Hampshire high school where learning is not something of books and tests and mechanical memorization, but practical. When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n<p>开始精读：</p>\n<p>Mr. Koziatek is part of something [xxx]. / He is a teacher / at a New Hampshire high school / where learning is not something of books and tests and mechanical memorization, / but practical. / When did it become accepted wisdom / that students should be able to name / the 13th president of the United States / but be utterly [xxx] / by a broken bike chain?</p>\n<p>Koziatek先生是某种[xxx]事情的一部分。 / 他是一名教师 / 在新罕布什尔州的一所高中 / 那里学习不是书本、考试和机械记忆这类东西， / 而是实际的。 / 什么时候它成了被接受的常识 / 学生应当能够说出名字 / 美国第13任总统的 / 却完全地[xxx] / 因为一条坏掉的自行车链条？</p>\n</blockquote>\n<p>这里把两种表现放在一起：学生能说出总统的名字，面对坏掉的自行车链条却是utterly [xxx]。题干问的是后一种表现暴露出的欠缺，不是前面已经会做的事情。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. practical ability</h3>\n<blockquote>\n<p>实际动手能力</p>\n</blockquote>\n<p>把A接回题干，它说的是：学生缺少实际动手的能力。</p>\n<p>A的practical ability与第2段的but practical意思接近，回看这句；这里刚把学校的学习方式与书本、考试作对照，末尾又给出自行车链条这个实际情形。</p>\n<blockquote>\n<p>where learning is not something of books and tests and mechanical memorization, but practical.</p>\n</blockquote>\n<blockquote>\n<p>When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n</blockquote>\n<p>but practical说的是在实际事情中学习，practical ability问的也正是这种能力。学生能回答总统姓名，不表示能处理自行车故障。末句用but把两种表现反着放在一起，前半句的会记知识没有解决后半句的实际问题。A把这一区别落到了学生欠缺的能力上。</p>\n<p><strong>能说出总统名字，就等于会处理坏掉的自行车链条吗？</strong></p>\n<p>不能。前者是记住知识，后者需要实际处理问题；A说的正是后者。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. academic training</h3>\n<blockquote>\n<p>学业训练</p>\n</blockquote>\n<p>把B接回题干，它说的是：学生缺少学业训练。</p>\n<p>B的academic training对应书本学习和考试，回到第2段books and tests所在的前半句，再看总统姓名的例子。</p>\n<blockquote>\n<p>where learning is not something of books and tests and mechanical memorization, but practical.</p>\n</blockquote>\n<blockquote>\n<p>students should be able to name the 13th president of the United States</p>\n</blockquote>\n<p>books and tests属于academic training这一边。原文没有把学生写成连课堂知识都没接触过；反而特意说他们能报出总统姓名。自行车链条放在but后面，是说这类学习与处理实际问题之间存在差别。B把已经展示出的书本学习，写成了这个例子要强调的欠缺。</p>\n<p><strong>这个例子批评的是书本知识没有学，还是学了却处理不了实际问题？</strong></p>\n<p>后者。能报出总统姓名与缺少书本训练不是这里的对照重点；被摆出来的短处在动手这一边。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. [xxx] spirit</h3>\n<blockquote>\n<p>[xxx]精神</p>\n</blockquote>\n<p>把C接回题干，它说的是：学生缺少某种[xxx]精神。</p>\n<p>C的spirit说的是一种精神状态，所以回到第2段的a broken bike chain，看末句到底展示学生的精神还是处理故障的表现。</p>\n<blockquote>\n<p>students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n</blockquote>\n<p>a broken bike chain是具体故障，前面对应的是学生能报总统名字。两边比的是会做什么，而spirit把欠缺改成了某种精神。即使[xxx]暂时读不懂，后面的spirit仍没有说出从记知识到处理实物这一能力差别。句子也没写学生不愿探索或没有某种志气。</p>\n<p><strong>学生面对具体故障的表现，能直接改写成某种精神的欠缺吗？</strong></p>\n<p>不能。这里比较的是记住知识与实际处理问题，C把被比较的对象换成了精神。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. mechanical memorization</h3>\n<blockquote>\n<p>机械记忆</p>\n</blockquote>\n<p>把D接回题干，它说的是：学生缺少机械记忆。</p>\n<p>D的mechanical memorization说靠记忆掌握知识，因此可以回到第2段name the 13th president这半句来比，再连着读but后的自行车链条。</p>\n<blockquote>\n<p>students should be able to name the 13th president of the United States but be utterly [xxx] by a broken bike chain?</p>\n</blockquote>\n<p>name the 13th president说的是记住一个固定知识点，这更接近mechanical memorization。原文正是把能答知识题的学生与不会应付实际故障的学生写成同一群人。D却把他们前面能表现出来的记忆能力，放进lack of之后，方向反了。</p>\n<p><strong>原文写学生能记住总统姓名，D却说他们缺少机械记忆，这两者对得上吗？</strong></p>\n<p>不能。原文拿已有的知识记忆衬出实际能力的不足，D把已有的一头当成了欠缺。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A保留。B、D都落在书本知识或记忆这一边，C则改问精神；自行车链条指向的是学生处理实际问题的能力。</p>\n<h2>22题</h2>\n<blockquote>\n<p>There exists the prejudice that vocational education is for kids who ______.\n有一种偏见认为，职业教育是给什么样的孩子的？</p>\n</blockquote>\n<p>题干写出了vocational education，第4段直接出现这组词和prejudice。回到这一段，从开头读到引语结束。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But he’s also found a kind of [xxx] prejudice. Working with your hands is seen as almost a mark of [xxx]. Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.</p>\n<p>开始精读：</p>\n<p>But he’s also found / a kind of [xxx] prejudice. / Working with your hands / is seen as almost a mark of [xxx]. / Schools in the family of vocational education / “have that stereotype...that it’s for kids / who can’t make it academically,” / he says.</p>\n<p>但他也发现了 / 一种[xxx]的偏见。 / 用双手干活 / 几乎被看成一种[xxx]的标记。 / 职业教育这一类的学校 / “有那种刻板印象……它是给孩子的 / 那些在学业上做不成的，” / 他说。</p>\n</blockquote>\n<p>引语中的for kids后面接who can’t make it academically。我们要找的是偏见给学生贴的标签；不是作者赞成这个标签，也不是问谁持有偏见。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. have a stereotyped mind</h3>\n<blockquote>\n<p>有刻板的头脑</p>\n</blockquote>\n<p>把A接回题干，它说的是：这种偏见认为，接受职业教育的孩子思维刻板。</p>\n<p>A的stereotyped mind和第4段have that stereotype意思相近，先回到引语，看看刻板印象由谁持有、又在说谁。</p>\n<blockquote>\n<p>Schools in the family of vocational education “have that stereotype...that it’s for kids who can’t make it academically,” he says.</p>\n</blockquote>\n<p>have that stereotype指的是职业学校带着一种外界加给它的刻板印象，后面的that说明这种印象的内容：这类学校是给学业上不成功的孩子的。stereotyped mind则把刻板变成孩子自己的思维特点。词相近，归到的人和描述的事情却都换了。</p>\n<p><strong>外界对职业学校有刻板印象，是否等于学生自己思维刻板？</strong></p>\n<p>不等于。原文在讲学校和学生被怎样看待，A却在说学生怎样思考。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. have no career motivation</h3>\n<blockquote>\n<p>没有职业动力</p>\n</blockquote>\n<p>把B接回题干，它说的是：这种偏见认为，这些孩子没有发展职业的动力。</p>\n<p>B的career motivation问职业动力，所以回到第4段实际形容kids的can’t make it academically，比较孩子在哪一方面被评价。</p>\n<blockquote>\n<p>it’s for kids who can’t make it academically</p>\n</blockquote>\n<p>can’t make it academically把“不行”限定在学业表现上，career motivation却改成想不想努力发展职业。一个人在课堂上不成功，也完全可能很想从事一份工作。原文的限定词academically没有把评价延伸到职业意愿。</p>\n<p><strong>学业上做不好，能不能直接读成没有职业动力？</strong></p>\n<p>不能。一个说学业表现，一个说职业意愿，B改了被评价的方面。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. are not academically successful</h3>\n<blockquote>\n<p>学业上不成功</p>\n</blockquote>\n<p>把C接回题干，它说的是：这种偏见认为，职业教育面向学业上不成功的孩子。</p>\n<p>C的not academically successful回到第4段can’t make it academically；两处都在说孩子在学业上没能成功。</p>\n<blockquote>\n<p>it’s for kids who can’t make it academically</p>\n</blockquote>\n<p>can’t make it academically中的make it是取得成功，academically限定学业。not academically successful保留了否定和同一限定，没有把评价改成能力低下的所有方面。题干前面的prejudice也提醒我们，这里复述的是别人给职业教育贴的标签。</p>\n<p><strong>C说的是学业以外的其他方面吗？</strong></p>\n<p>不是。not academically successful与引语中的can’t make it academically说的是同一件事，所以可以保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. are financially [xxx]</h3>\n<blockquote>\n<p>经济上[xxx]</p>\n</blockquote>\n<p>把D接回题干，它说的是：这种偏见认为，这些孩子在经济上[xxx]。</p>\n<p>D的financially问经济状况，所以回到第4段直接限定孩子的academically，比较原句到底在哪个方面下判断。</p>\n<blockquote>\n<p>it’s for kids who can’t make it academically</p>\n</blockquote>\n<p>academically说的是学业，financially说的是经济。D后面的[xxx]不管表达经济方面的哪一种状况，都改变了原句的评价范围。引语没有把孩子的学业成绩解释为家庭收入，也没有说职业学校按经济条件接收学生。</p>\n<p><strong>把学业方面的评价改成经济方面的评价，还是同一个偏见吗？</strong></p>\n<p>不是。原句明确限定academically，D明确限定financially，两者评价的方面不同。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。引语说的是学业表现；A换了刻板印象的归属，B换成职业动力，D换成经济条件。</p>\n<h2>23题</h2>\n<blockquote>\n<p>We can infer from Paragraph 5 that high school graduates ______.\n从第5段可以推断，高中毕业生的情况是怎样的？</p>\n</blockquote>\n<p>题干已经限定Paragraph 5。这里直接回到第5段，从On one hand读到rightfully so。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>On one hand, that viewpoint is a logical product of America’s [xxx]. Manufacturing is not the economic engine that it once was. The job security that the US economy once offered to high school graduates has largely [xxx]. More education is the new principle. We want more for our kids, and rightfully so.</p>\n<p>开始精读：</p>\n<p>On one hand, / that viewpoint is a logical product / of America’s [xxx]. / Manufacturing is not the economic engine / that it once was. / The job security / that the US economy once offered to high school graduates / has largely [xxx]. / More education is the new principle. / We want more for our kids, / and rightfully so.</p>\n<p>一方面， / 那个看法是一个合乎逻辑的产物 / 美国的[xxx]带来的。 / 制造业不再是那个经济发动机 / 它曾经是的那个。 / 就业保障 / 美国经济曾提供给高中毕业生的 / 已经很大程度上[xxx]。 / 更多教育成了新的原则。 / 我们想给孩子更多， / 而且理应如此。</p>\n</blockquote>\n<p>这一段从制造业的过去说到就业保障的变化，再接更多教育。题干问高中毕业生，要盯住once offered与后面的has largely [xxx]，同时看前面的制造业已不再像以前那样推动经济。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. used to have big financial concerns</h3>\n<blockquote>\n<p>过去有很大的经济忧虑</p>\n</blockquote>\n<p>把A接回题干，它说的是：高中毕业生过去常为经济问题严重担忧。</p>\n<p>A的big financial concerns是在说过去的不安，所以回到第5段描述过去的job security，看原句把过去写成有保障还是充满担忧。</p>\n<blockquote>\n<p>Manufacturing is not the economic engine that it once was.</p>\n</blockquote>\n<blockquote>\n<p>The job security that the US economy once offered to high school graduates has largely [xxx].</p>\n</blockquote>\n<p>job security是工作上的保障，once offered说明美国经济曾经把这种保障给高中毕业生。big financial concerns却把过去定性成严重的经济忧虑。前面还说制造业过去起到更强的经济推动作用，原文回看的有利就业条件并不是A说的过去更困难。</p>\n<p><strong>过去曾有就业保障，能直接变成过去经济忧虑很大吗？</strong></p>\n<p>不能。A把原文回看的就业保障改成了负面的经济处境，时间相同，评价方向却相反。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. used to have more job opportunities</h3>\n<blockquote>\n<p>过去有更多就业机会</p>\n</blockquote>\n<p>把B接回题干，它说的是：高中毕业生过去有更多就业机会。</p>\n<p>B的more job opportunities是在比较今昔，所以回到第5段once offered所在的就业保障句，再连着看制造业不再像以前的那一句。</p>\n<blockquote>\n<p>Manufacturing is not the economic engine that it once was.</p>\n</blockquote>\n<blockquote>\n<p>The job security that the US economy once offered to high school graduates has largely [xxx].</p>\n</blockquote>\n<p>once offered把高中毕业生享有就业保障放在过去；制造业如今又不再是从前那个经济发动机。more job opportunities没有说人人都能找到工作，而是概括过去对高中毕业生更有利的就业环境。紧接着转向更多教育，也能与仅靠高中学历不再像以前那么有保障接起来。</p>\n<p><strong>B是在说过去人人有工作，还是过去的就业条件比现在更有利？</strong></p>\n<p>后者。more是相对比较，原文也用once把曾有的就业保障与现在的变化相接。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. are reluctant to work in manufacturing</h3>\n<blockquote>\n<p>不愿去制造业工作</p>\n</blockquote>\n<p>把C接回题干，它说的是：高中毕业生不愿从事制造业工作。</p>\n<p>C的reluctant to work说求职者的意愿，所以回到第5段Manufacturing is not开头的句子，看看制造业为什么被提到。</p>\n<blockquote>\n<p>Manufacturing is not the economic engine that it once was.</p>\n</blockquote>\n<blockquote>\n<p>The job security that the US economy once offered to high school graduates has largely [xxx].</p>\n</blockquote>\n<p>Manufacturing is not比较的是一个行业在经济中的作用，reluctant to work却把变化归成毕业生主观上不愿去做。原句的主体先是Manufacturing，再是job security，变化都落在经济和岗位保障上，不是毕业生对某个行业的喜恶。</p>\n<p><strong>制造业的经济作用发生变化，就是毕业生不愿去那里工作吗？</strong></p>\n<p>不等于。一个是外部就业条件，一个是求职者的选择意愿，C换了变化的主体。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. are [xxx] to more educational privileges</h3>\n<blockquote>\n<p>对更多教育特权是[xxx]的</p>\n</blockquote>\n<p>把D接回题干，它说的是：高中毕业生对更多教育特权具有某种[xxx]关系。</p>\n<p>D的educational privileges谈教育待遇，对应的是第5段We want more这一愿望，先回看原句，看段末的愿望是在授予特权，还是父母希望孩子得到更多教育。</p>\n<blockquote>\n<p>More education is the new principle. We want more for our kids, and rightfully so.</p>\n</blockquote>\n<p>We want more的主体是想为孩子争取更好前途的“我们”，educational privileges则说一种教育特权。父母希望孩子接受更多教育，并不等于高中毕业生获得某种特殊资格。D即使保留[xxx]，privileges仍把一般愿望变成了特殊待遇，原句没有这一层分配。</p>\n<p><strong>希望孩子接受更多教育，能变成高中毕业生享有教育特权吗？</strong></p>\n<p>不能。这里表达的是父母的愿望，没有给高中毕业生规定特殊教育待遇。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。once offered把就业保障放在过去，制造业的今昔对照又给出背景；其余选项分别改成了经济忧虑、求职意愿和教育特权。</p>\n<h2>24题</h2>\n<blockquote>\n<p>The headlong push into bachelor’s degrees for all ______.\n急着推动所有人取得学士学位，反映了什么？</p>\n</blockquote>\n<p>题干里的headlong push和bachelor’s degrees for all都出现在第6段首句。直接从这一段开头读到最后的trained。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs. Yes, a bachelor’s degree opens more doors. But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing. But only 44 percent of workers are [xxx] trained.</p>\n<p>开始精读：</p>\n<p>But the headlong push into bachelor’s degrees for all— / and the subtle [xxx] of anything less— / misses an important point: / That’s not the only thing the American economy needs. / Yes, a bachelor’s degree opens more doors. / But even now, / 54 percent of the jobs in the country / are middle-skill jobs, / such as construction and high-skill manufacturing. / But only 44 percent of workers / are [xxx] trained.</p>\n<p>但急着推动人人取得学士学位—— / 以及对比这低的任何东西的微妙[xxx]—— / 漏掉了重要的一点： / 那不是美国经济唯一需要的东西。 / 是的，学士学位打开更多的门。 / 但即使现在， / 国内54%的工作 / 是中等技能工作， / 例如建筑和高技能制造。 / 但只有44%的工人 / 受到[xxx]的训练。</p>\n</blockquote>\n<p>这里先说全民学士学位漏掉了重要的一点，再拿54%的中等技能岗位和44%的受训工人作比较。我们要判断这种推动与实际需要的关系，不能只看degree opens more doors这一个让步。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. helps create a lot of middle-skill jobs</h3>\n<blockquote>\n<p>有助于创造大量中等技能工作</p>\n</blockquote>\n<p>把A接回题干，它说的是：推动人人取得学士学位，会创造很多中等技能岗位。</p>\n<p>A的create说新增岗位，所以回到第6段54 percent of the jobs所在的句子，看这个比例说已经有哪些工作，还是说学位推动产生了哪些工作。</p>\n<blockquote>\n<p>But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing.</p>\n</blockquote>\n<p>54 percent of the jobs是在描述当前已经存在的岗位结构，create却增加了“学位推动创造岗位”的因果。原句用even now强调现在仍有这么多中等技能岗位，需要有人接受相应训练；它没有把这些岗位当成人人读本科之后产生的结果。</p>\n<p><strong>现有岗位中有54%是中等技能岗位，等于学位推动创造了这些岗位吗？</strong></p>\n<p>不等于。岗位比例是已有需求，A把需求改成了学位推动带来的结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. may narrow the gap in working-class jobs</h3>\n<blockquote>\n<p>可能缩小工人阶层的岗位缺口</p>\n</blockquote>\n<p>把B接回题干，它说的是：推动人人取得学士学位，可能缩小工人阶层的岗位缺口。</p>\n<p>B的narrow the gap指向岗位缺口；下一段的that gap与这个缺口对应，接着把第7段完整读完，看看真正试图填补缺口的是谁。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In other words, at a time when the working class has turned the country on its political head, [xxx] that the opportunity that once defined America is [xxx], one obvious solution is staring us in the face. There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.</p>\n<p>开始精读：</p>\n<p>In other words, / at a time when the working class has turned the country on its political head, / [xxx] that the opportunity / that once defined America / is [xxx], / one obvious solution is staring us in the face. / There is a gap in working-class jobs, / but the workers who need those jobs most / aren’t [xxx] to do them. / Koziatek’s Manchester School of Technology High School / is trying to fill that gap.</p>\n<p>换句话说， / 在工人阶层已经把国家在政治上翻转过来的时候， / [xxx]那个机会 / 曾经界定美国的那个 / 正在[xxx]， / 一个明显的解决办法正摆在我们面前。 / 工人阶层的岗位存在缺口， / 但最需要那些岗位的工人 / 没有[xxx]去做这些工作。 / 科齐亚特克的曼彻斯特技术高中 / 正试图填上那个缺口。</p>\n</blockquote>\n<p>读完这一段，再把narrow the gap和that gap放在一起：</p>\n<blockquote>\n<p>There is a gap in working-class jobs, but the workers who need those jobs most aren’t [xxx] to do them. Koziatek’s Manchester School of Technology High School is trying to fill that gap.</p>\n</blockquote>\n<p>fill that gap的主体是Koziatek’s Manchester School of Technology High School。前面解释的是有岗位，却缺能做这些工作的工人。narrow the gap在意思上接近填补缺口，但B把题干中的“人人读本科”接成了实施者；原文恰好说那不是经济唯一需要的东西，随后另举这所学校来回应缺口。</p>\n<p><strong>原文写职业学校在填缺口，能把这个作用转给推动人人读本科吗？</strong></p>\n<p>不能。B换了填补缺口的做法；原文区分的正是单一路径与针对岗位的训练。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. is expected to [xxx] a better-trained workforce</h3>\n<blockquote>\n<p>被期待去[xxx]一支训练更好的劳动队伍</p>\n</blockquote>\n<p>把C接回题干，它说的是：推动人人取得学士学位，被期待去[xxx]一支训练更好的劳动队伍。</p>\n<p>C的better-trained workforce说受教育之后的劳动队伍，所以回到第6段opens more doors这个让步，再看末尾工人受训比例的比较。</p>\n<blockquote>\n<p>Yes, a bachelor’s degree opens more doors.</p>\n</blockquote>\n<blockquote>\n<p>But only 44 percent of workers are [xxx] trained.</p>\n</blockquote>\n<p>opens more doors承认学士学位能带来更多机会，better-trained workforce也围绕教育与劳动者展开。可是C中is expected to后面的[xxx]决定这种期待怎样落到劳动队伍上，原文最后的训练程度也有一处[xxx]。现在能看出本科并非全部需要，但还不能仅凭这个让步把C所说的期待完全否定。</p>\n<p><strong>只凭本科能打开更多机会和工人训练不足，能把C的期待完整判错吗？</strong></p>\n<p>还不能。两句都涉及教育与就业，C中期待发生的具体动作还没读清，先保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. indicates the overvaluing of higher education</h3>\n<blockquote>\n<p>显示高等教育被过分看重</p>\n</blockquote>\n<p>把D接回题干，它说的是：推动人人取得学士学位，显示人们过分看重高等教育。</p>\n<p>D的overvaluing要与第6段not the only thing对应着看；原文一边承认学位有好处，一边指出经济还有别的需要。</p>\n<blockquote>\n<p>But the headlong push into bachelor’s degrees for all—and the subtle [xxx] of anything less—misses an important point: That’s not the only thing the American economy needs.</p>\n</blockquote>\n<p>not the only thing说的是本科并非唯一需要，不是否定大学教育，而是反对把它当成人人唯一的路。overvaluing也不是说高等教育没有价值，而是说给它的分量过大。后面54%的中等技能岗位，正说明把人都推向学士学位，会漏掉很大一部分实际需求。</p>\n<p><strong>D是在否定本科的价值，还是指出把本科当成唯一方向太过头了？</strong></p>\n<p>后者。它与not the only thing的限制相接，既容纳学位的好处，也承认还有别的岗位需要。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D保留。</li>\n</ul>\n<p>C、D保留。D能接住“本科不是唯一需要”的批评；C仍牵涉教育与劳动者的训练，关键动作暂时没读清。</p>\n<h2>25题</h2>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<p>作者对Koziatek学校的态度可以怎样描述？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>supportive</strong></p>\n<p>支持的</p>\n<p>B. <strong>tolerant</strong></p>\n<p>容忍的</p>\n<p>C. <strong>disappointed</strong></p>\n<p>失望的</p>\n<p>D. <strong>cautious</strong></p>\n<p>谨慎的</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<p>前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It is curious that Stephen Koziatek feels almost as though he has to [xxx] his efforts to give his students a better future.</p>\n<p>开始精读：</p>\n<p>It is curious / that Stephen Koziatek feels almost as though / he has to [xxx] his efforts / to give his students a better future.</p>\n<p>这很奇怪 / Stephen Koziatek感觉几乎好像 / 他不得不[xxx]他的努力 / 去给他的学生一个更好的未来。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>As Koziatek knows, there is learning in just about everything. Nothing is necessarily gained by forcing students to learn geometry at a [xxx] desk stuck with generations of [xxx] chewing gum. They can also learn geometry by [xxx] a bicycle.</p>\n<p>开始精读：</p>\n<p>As Koziatek knows, / there is learning in just about everything. / Nothing is necessarily gained / by forcing students to learn geometry / at a [xxx] desk / stuck with generations of [xxx] chewing gum. / They can also learn geometry / by [xxx] a bicycle.</p>\n<p>正如Koziatek知道的， / 几乎一切事物里都有学习。 / 未必获得什么 / 靠强迫学生学习几何 / 在一张[xxx]的课桌前 / 粘着一代代留下的[xxx]口香糖。 / 他们也能学习几何 / 通过[xxx]一辆自行车。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Koziatek’s school is a wake-up call. When education becomes one-size-fits-all, it risks overlooking a nation’s diversity of gifts.</p>\n<p>开始精读：</p>\n<p>Koziatek’s school is a wake-up call. / When education becomes one-size-fits-all, / it risks overlooking / a nation’s diversity of gifts.</p>\n<p>科齐亚特克的学校是一次提醒。 / 当教育变成一种尺寸适合所有人时， / 它就有忽略的风险 / 一个国家中天赋的多样性。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用better future与curious开场，对学校帮助学生却要解释自己表示奇怪</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍把学习落到实际事情上的高中，用总统姓名与自行车链条作对照</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿学几何说明课堂并不是唯一能学知识的地方</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出职业教育被看成学业不成功者的去处，交代学校面对的偏见</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>承认追求更多教育有制造业与就业变化的背景</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>转回来说明本科并非唯一需要，中等技能岗位需要相应工人</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>指出岗位与工人训练之间的缺口，并写这所学校试图填补它</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>用wake-up call肯定提醒作用，警惕教育一刀切忽略不同天赋</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<h3>A. supportive</h3>\n<p>支持的</p>\n<h4>如果 A 是主旨，文章8段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“作者支持Koziatek学校的做法”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>以反问或意外感肯定学校帮助学生</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍实际学习的价值并与只记书本知识相比</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用几何学习例子继续说明学校的做法能成立</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出对职业学校的低评价不公允</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>承认人们追求更多教育有现实背景</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明认可大学不妨碍承认中等技能训练的需要</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>把学校做法与填补岗位缺口接起来</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>明确肯定学校的提醒，主张照顾不同天赋</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>开头的better future给学校努力一个正面方向，curious反而在问为什么这样做还需要解释。中间不是只称赞一次：实际学习、几何例子、中等技能岗位以及学校填缺口互相接着写。结尾把学校称作wake-up call，又批评one-size-fits-all，肯定的是这所学校给单一路径提供的提醒。</p>\n<p><strong>支持这一态度能不能同时接住学校的实际教学、岗位作用和结尾的提醒？</strong></p>\n<p>能。文章承认大学教育有价值，却继续说明职业学校也回应真实需要；这种让步没有改变对该校的肯定。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<h3>B. tolerant</h3>\n<p>容忍的</p>\n<h4>如果 B 是主旨，文章8段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“作者仅仅容忍这所学校”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先表示学校的存在虽不理想却可以容忍</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>把实际学习写成可以勉强接受的另一做法</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明这种学习即使有缺点也不必禁止</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>承认批评虽有道理，仍应让学校存在</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>以社会变化说明容忍学校的必要</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>把岗位需求写成勉强容忍这种教育的理由</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>说明填缺口足以让人退一步接受它</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最终表示谈不上赞许但仍可以容忍</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>tolerant只是允许某种自己未必赞成的做法存在。可是原文主动替学校说明价值，最后还把它写成值得全国教育听见的提醒。第5段的让步是给追求更多教育的人，不是给学校勉强发一个通行证。</p>\n<p><strong>只是容忍，能够解释作者为什么连着替学校说明教学价值和填缺口作用吗？</strong></p>\n<p>不能。学校在文章里承担积极作用，并没有被写成虽不好但可以忍受的例外。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<h3>C. disappointed</h3>\n<p>失望的</p>\n<h4>如果 C 是主旨，文章8段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“作者对这所学校感到失望”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>开头表达学校未达到期待</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>用学习方式对照显示学校令人失望</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿几何学习说明实际教学没有成效</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>赞同外界对职业学校的负面评价</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用就业变化解释这所学校的落后</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明学校无法回应劳动市场</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>强调学校填补缺口的努力失败</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后表达失望并不建议这种做法</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>disappointed要求学校让作者的期待落空，文章却从更好的未来写到trying to fill that gap。被批评的是职业教育受到的偏见和教育一刀切，不是这所学校的失败。把批评对象放回句子，负面态度就不能转给学校。</p>\n<p><strong>文中的批评指向学校本身，还是压低职业教育、只推一种道路的观念？</strong></p>\n<p>后者。学校被用来回应问题，而不是制造问题；失望的态度会把被批评对象倒过来。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<h3>D. cautious</h3>\n<p>谨慎的</p>\n<h4>如果 D 是主旨，文章8段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“作者对学校采取谨慎观望的态度”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>开头提醒学校做法需要谨慎看待</td>\n<td>先说这件事让人觉得奇怪</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍实际学习同时强调其不确定风险</td>\n<td>再把两种做法摆在一起</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿几何学习说明仍要小心试验</td>\n<td>举一个例子说明还有别的路</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把偏见变成合理担忧</td>\n<td>接着说它却被人看低</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用就业变化提醒职业教育前景不稳</td>\n<td>先让一步说这种想法有来由</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>强调是否需要这种学校还应观望</td>\n<td>但话说回来还有一块没顾上</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>写学校能否填缺口仍有重大疑问</td>\n<td>再说它正好在补这一块</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最终对该校保留审慎的结论</td>\n<td>最后说不能让大家只走一条路</td>\n</tr>\n</tbody></table>\n<p>cautious要求作者保留明显顾虑，结尾却直接用wake-up call肯定它的提醒作用。文章确实承认更多教育有背景，但那是在解释另一种想法的来由，并未罗列这所学校的风险。它的多条积极作用也没有被最后收回。</p>\n<p><strong>谨慎观望能解释结尾明确把学校作为提醒吗？</strong></p>\n<p>不能。全文没有以风险和不确定性收尾，而是在学校做法的基础上反对教育一刀切。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude toward Koziatek’s school can be described as ______.</strong></p>\n<h3>25题结论</h3>\n<p><strong>25. A. supportive</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>supportive / 支持的</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查24题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. is expected to [xxx] a better-trained workforce</li>\n<li>D. indicates the overvaluing of higher education</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>supportive</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>作者支持这所职业学校，因为它回应了单一路径没有顾到的实际需要。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>C接上题干，是说推动人人读本科被期待去[xxx]更好的劳动队伍；D接上题干，是说这种推动反映对高等教育的过分看重。第一遍C里有一个动作没有读清，原文又承认学士学位会打开更多机会，所以教育改善劳动者这层期待看起来有联系。D则能直接回应not the only thing。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看D。现在确认作者是在支持一所提供实际训练的职业学校；这种支持的理由，就是教育不能把人人都推向同一种学位。D的overvaluing说的不是大学无用，而是把大学教育的价值扩大为唯一标准，这与学校为何值得支持接得上。</p>\n<p>再看C。C停留在大家对学位和劳动队伍的期待，不能说明作者为什么紧接着强调中等技能岗位，也不能说明为什么要另举Koziatek学校去fill that gap。若把这种期待当成作者对headlong push的评价，就把文章正在纠正的单一路径继续当成解决办法。</p>\n<p>回到第6段，misses an important point和not the only thing已经指出全民学位推动漏掉需求；第7段又把填缺口的努力交给职业学校。D既能解释这两个局部动作，也能解释全文为什么肯定学校。C即使某个期待听来合理，也没有回答作者指出的那种过度看重，因此最后选D。</p>\n<blockquote>\n<p><strong>24题选D。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>21. A</strong></p>\n<p><strong>22. C</strong></p>\n<p><strong>23. B</strong></p>\n<p><strong>24. D</strong></p>\n<p><strong>25. A</strong></p>\n","analysisStartIndex":42,"articleImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDsAAAXkCAIAAABLzpc7AAEAAElEQVR4nOzddVwV2f8/8DO3uJcORRBRsRUDFTuxu1HBXjvXjjV2jbVduwtdO1AxV9S1MUBQDCQFAaX79p35/XE+O7/7vSAi4np39/X8gwcTd+ZMz3tOMRzHEQAAAAAAAKMk+N4JAAAAAAAA+CRELAAAAAAAYLwQsQAAAAAAgPFCxAIAAAAAAMYLEQsAAAAAABgvRCwAAAAAAGC8ELEAAAAAAIDxQsQCAAAAAADGCxELAAAAAAAYL0QsAAAAAABgvBCxAAAAAACA8ULEAgAAAAAAxgsRCwAAAAAAGC9ELAAAAAAAYLwQsQAAAAAAgPFCxAIAAAAAAMYLEQsAAAAAABgvRCwAAAAAAGC8ELEAAAAAAIDxQsQCAAAAAADGCxELAAAAAAAYL0QsAAAAAABgvBCxAAAAAACA8ULEAgAAAAAAxgsRCwAAAAAAGC9ELAAAAAAAYLwQsQAAAAAAgPFCxAIAAAAAAMYLEQsAAAAAABgvRCwAAAAAAGC8ELEAAAAAAIDxQsQCAAAAAADGCxELAAAAAAAYL0QsAAAAAABgvBCxAAAAAACA function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;window.addEventListener('keydown',e=>{const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}});
let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+15);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-15);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
setTimeout(()=>applyZoom(zoomLevel),60);
const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
</script></body></html>
