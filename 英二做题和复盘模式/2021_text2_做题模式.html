<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"questionTop","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**Some people argue that food self-sufficiency in the UK would ______.**\n\n一些人认为，英国实现食品自给自足会带来什么？\n\n题型：观点细节题","html":"<h2>26题题干</h2>\n<p><strong>Some people argue that food self-sufficiency in the UK would ______.</strong></p>\n<p>一些人认为，英国实现食品自给自足会带来什么？</p>\n<p>题型：观点细节题</p>\n","articleRects":[],"questionRects":[[187,125,610,29],[187,167,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**The report by the University of Leeds shows that in the UK ______.**\n\n利兹大学的报告显示英国存在什么情况？\n\n题型：报告细节题","html":"<h2>27题题干</h2>\n<p><strong>The report by the University of Leeds shows that in the UK ______.</strong></p>\n<p>利兹大学的报告显示英国存在什么情况？</p>\n<p>题型：报告细节题</p>\n","articleRects":[],"questionRects":[[187,378,664,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**Crop-growing in the UK is restricted due to ______.**\n\n英国种植作物受到哪一方面的限制？\n\n题型：原因题","html":"<h2>28题题干</h2>\n<p><strong>Crop-growing in the UK is restricted due to ______.</strong></p>\n<p>英国种植作物受到哪一方面的限制？</p>\n<p>题型：原因题</p>\n","articleRects":[],"questionRects":[[187,632,431,29],[187,675,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**It can be learned from the last paragraph that British people ______.**\n\n从最后一段可以知道英国人在哪一方面存在什么情况？\n\n题型：段落推断题","html":"<h2>29题题干</h2>\n<p><strong>It can be learned from the last paragraph that British people ______.</strong></p>\n<p>从最后一段可以知道英国人在哪一方面存在什么情况？</p>\n<p>题型：段落推断题</p>\n","articleRects":[],"questionRects":[[187,886,588,29],[187,928,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**\n\n作者对英国食品自给自足持什么态度？\n\n题型：全文作者观点 / 全文主旨题","html":"<h2>30题题干</h2>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n<p>作者对英国食品自给自足持什么态度？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but；so；Even if；only；before |\n| 态度词 / 评价词 | 先抓个大概好坏 | feasible；grave；suitable |\n| 动作词 | 先看谁做了什么 | produce；reduce；grow；meet |\n| 结果词 | 看最后出了什么事 | 80 per cent；30 per cent boost；only 30 per cent |\n| 重复主题词 | 大概知道老在说什么 | UK；food；land；production |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but；so；Even if；only；before</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>feasible；grave；suitable</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>produce；reduce；grow；meet</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>80 per cent；30 per cent boost；only 30 per cent</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>UK；food；land；production</td>\n</tr>\n</tbody></table>\n","ar 大概在谈英国食品自给的问题”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先记住自给、土地和需求这些对象与数字所在的位置。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> Some people argue that food self-sufficiency in the UK would ______.\n> 一些人认为，英国实现食品自给自足会带来什么？\n\n题干把讨论限定在UK，并问Some people的看法。第2段同样谈UK，用seen by some及the argument goes引出这类人的主张。先完整读这一段，分清他们的判断与作者随后提出的问题。\n\n> 原文参考：\n>\n> Brexit is seen by some as an opportunity to [xxx] a recent trend towards the UK importing food. The country produces only about 60 per cent of the food it eats, down from almost three-quarters in the late 1980s. A move back to self-sufficiency, the argument goes, would boost the farming industry, political [xxx] and even the nation’s health. Sounds great—but how feasible is this vision?\n>\n> 开始精读：\n>\n> Brexit is seen by some as an opportunity / to [xxx] a recent trend towards the UK importing food. / The country produces only about 60 per cent of the food it eats, / down from almost three-quarters in the late 1980s. / A move back to self-sufficiency, the argument goes, / would boost the farming industry, political [xxx] and even the nation’s health. / Sounds great—but how feasible is this vision?\n>\n> 一些人把英国脱欧看作一个机会， / 可以[xxx]近期英国转向进口食品的趋势。 / 这个国家只生产自己所食用食品的约百分之六十， / 低于二十世纪八十年代末接近四分之三的比例。 / 这种论点说，重新转向自给自足 / 会促进农业、政治上的[xxx]，甚至国民健康。 / 听起来很好——但这一设想有多可行呢？\n\nthe argument goes夹在主语后面，提醒我们后面的would boost仍是这些人的论点。最后的but how feasible转成作者对可行性的追问。题干问前一层，不能把作者的问题替这些人当作立场。\n\n接下来按A—D逐项看。","html":"<h2>26题</h2>\n<blockquote>\n<p>Some people argue that food self-sufficiency in the UK would ______.\n一些人认为，英国实现食品自给自足会带来什么？</p>\n</blockquote>\n<p>题干把讨论限定在UK，并问Some people的看法。第2段同样谈UK，用seen by some及the argument goes引出这类人的主张。先完整读这一段，分清他们的判断与作者随后提出的问题。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Brexit is seen by some as an opportunity to [xxx] a recent trend towards the UK importing food. The country produces only about 60 per cent of the food it eats, down from almost three-quarters in the late 1980s. A move back to self-sufficiency, the argument goes, would boost the farming industry, political [xxx] and even the nation’s health. Sounds great—but how feasible is this vision?</p>\n<p>开始精读：</p>\n<p>Brexit is seen by some as an opportunity / to [xxx] a recent trend towards the UK importing food. / The country produces only about 60 per cent of the food it eats, / down from almost three-quarters in the late 1980s. / A move back to self-sufficiency, the argument goes, / would boost the farming industry, political [xxx] and even the nation’s health. / Sounds great—but how feasible is this vision?</p>\n<p>一些人把英国脱欧看作一个机会， / 可以[xxx]近期英国转向进口食品的趋势。 / 这个国家只生产自己所食用食品的约百分之六十， / 低于二十世纪八十年代末接近四分之三的比例。 / 这种论点说，重新转向自给自足 / 会促进农业、政治上的[xxx]，甚至国民健康。 / 听起来很好——但这一设想有多可行呢？</p>\n</blockquote>\n<p>the argument goes夹在主语后面，提醒我们后面的would boost仍是这些人的论点。最后的but how feasible转成作者对可行性的追问。题干问前一层，不能把作者的问题替这些人当作立场。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[183,340,747,29],[135,375,796,30],[135,411,743,29],[264,447,665,29],[135,483,795,29],[135,519,71,27]],"questionRects":[[187,125,610,29],[187,167,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. be [xxx] by its population growth\n\n> 受到人口增长的[xxx]\n\n把A接回题干，它说的是：这些人认为，英国食品自给会被人口增长[xxx]。\n\nA的population growth让人想到第1段的population，所以回到第1段完整读一次，看看这个人口变化属于什么范围，又是否就是第2段那些人的论点。\n\n> 原文参考：\n>\n> With the global population predicted to hit close to 10 billion by 2050, and [xxx] that agricultural production in some regions will need to nearly double to keep pace, food security is increasingly making headlines. In the UK, it has become a big talking point recently too, for a rather [xxx] reason: Brexit.\n>\n> 开始精读：\n>\n> With the global population predicted to hit close to 10 billion by 2050, / and [xxx] that agricultural production in some regions will need to nearly double / to keep pace, / food security is increasingly making headlines. / In the UK, it has become a big talking point recently too, / for a rather [xxx] reason: Brexit.\n>\n> 随着全球人口预计到二〇五〇年将接近一百亿， / 以及[xxx]某些地区的农业生产将需要几乎翻倍 / 才能跟上， / 粮食安全越来越常成为头条。 / 在英国，它近来也成了一个重要话题， / 原因相当[xxx]：英国脱欧。\n\n读完这一段，再把population growth和population放在一起：\n\n> With the global population predicted to hit close to 10 billion by 2050,\n\n> In the UK, it has become a big talking point recently too, for a rather [xxx] reason: Brexit.\n\npopulation前面明确有global，population growth在A中却用its指英国自己的增长。第1段先交代全球粮食安全为什么受关注，再用In the UK另起一个英国层面的缘由，最后点出Brexit。A把全球背景中的人口因素直接换成这些英国自给支持者的论点。\n\n回到第2段，他们说自给会boost农业及健康等方面，没有用人口增长解释这一主张。即使全球人口变化可能影响英国，这种现实上的联系也不能替代题目所问的“这些人具体说了什么”。\n\n**全球粮食话题与人口预测有关，就能把人口增长当成英国这些支持者提出的理由吗？**\n\n不能。A既把global换成英国自身，又把文章背景换成特定人群的主张，题干的观点归属变了。\n\n**第一轮判断：A排除。**","html":"<h3>A. be [xxx] by its population growth</h3>\n<blockquote>\n<p>受到人口增长的[xxx]</p>\n</blockquote>\n<p>把A接回题干，它说的是：这些人认为，英国食品自给会被人口增长[xxx]。</p solvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"boost the farming industry","visibleOptionAnchor":"pose a challenge"}}}},{"section":"26题","raw":"### 26题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除。\n\nB保留。题目问一些人的积极期待；A换了范围与观点归属，C补出政府优先事项，D反转了农业受到的作用。","html":"<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。题目问一些人的积极期待；A换了范围与观点归属，C补出政府优先事项，D反转了农业受到的作用。</p>\n","articleRects":[],"questionRects":[[187,125,610,29],[187,167,25,24],[216,167,361,29],[215,209,355,29],[215,248,359,37],[216,294,388,29]],"scrollTarget":"auto","meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> The report by the University of Leeds shows that in the UK ______.\n> 利兹大学的报告显示英国存在什么情况？\n\n题干点名University of Leeds，第3段开头就标明这份报告的来源。完整读这一段，分别记清两个百分比所占的是什么。\n\n> 原文参考：\n>\n> According to a report on UK food production from the University of Leeds, UK, 85 per cent of the country’s total land area is associated with meat and dairy production. That supplies 80 per cent of what is consumed, so even covering the whole country in [xxx] farms wouldn’t allow us to cover all our meat and dairy needs.\n>\n> 开始精读：\n>\n> According to a report on UK food production / from the University of Leeds, UK, / 85 per cent of the country’s total land area / is associated with meat and dairy production. / That supplies 80 per cent of what is consumed, / so even covering the whole country in [xxx] farms / wouldn’t allow us to cover all our meat and dairy needs.\n>\n> 根据一份关于英国食品生产的报告， / 来自英国利兹大学， / 这个国家土地总面积的百分之八十五 / 与肉类和乳制品生产相关。 / 这些生产供应了消费量的百分之八十， / 因此，即使把整个国家都覆盖上[xxx]农场， / 也不能让我们满足全部肉类和乳制品需求。\n\n85 per cent接the country’s total land area，是土地总面积的比例；80 per cent接what is consumed，是肉类与乳制品消费需求被满足的比例。两个分母不同，不能直接把两个数字的大小比较成生产效率。\n\n接下来按A—D逐项看。","html":"<h2>27题</h2>\n<blockquote>\n<p>The report by the University of Leeds shows that in the UK ______.\n利兹大学的报告显示英国存在什么情况？</p>\n</blockquote>\n<p>题干点名University of Leeds，第3段开头就标明这份报告的来源。完整读这一段，分别记清两个百分比所占的是什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>According to a report on UK food production from the University of Leeds, UK, 85 per cent of the country’s total land area is associated with meat and dairy production. That supplies 80 per cent of what is consumed, so even covering the whole country in [xxx] farms wouldn’t allow us to cover all our meat and dairy needs.</p>\n<p>开始精读：</p>\n<p>According to a report on UK food production / from the University of Leeds, UK, / 85 per cent of the country’s total land area / is associated with meat and dairy production. / That supplies 80 per cent of what is consumed, / so even covering the whole country in [xxx] farms / wouldn’t allow us to cover all our meat and dairy needs.</p>\n<p>根据一份关于英国食品生产的报告， / 来自英国利兹大学， / 这个国家土地总面积的百分之八十五 / 与肉类和乳制品生产相关。 / 这些生产供应了消费量的百分之八十， / 因此，即使把整个国家都覆盖上[xxx]农场， / 也不能让我们满足全部肉类和乳制品需求。</p>\n</blockquote>\n<p>85 per cent接the country’s total land area，是土地总面积的比例；80 per cent接what is consumed，是肉类与乳制品消费需求被满足的比例。两个分母不同，不能直接把两个数字的大小比较成生产效率。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[183,555,745,29],[135,591,795,29],[135,626,795,30],[135,662,796,30],[135,698,118,29]],"questionRects":[[187,378,664,30]],"scrollTarget":"auto","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. farmland has been inefficiently utilised\n\n> 农地一直没有得到高效利用\n\n把A接回题干，它说的是：报告认为英国农地使用效率低。\n\nA的inefficiently utilised在评价土地使用效果，所以回到第3段85 per cent of the country’s total land area，再看后面的80 per cent测量什么。\n\n> 85 per cent of the country’s total land area is associated with meat and dairy production.\n\n> That supplies 80 per cent of what is consumed,\n\n85 per cent of the country’s total land area说明多少土地与肉奶生产相关，inefficiently utilised则需要评价同等土地、资源投入产生了多少产出，或是否低于可达到的水平。原句的80 per cent不是土地利用率，更不是每块地的产出效率，而是本国需求有多少得到供应。\n\n因此，不能因为“用了85%的土地、只满足80%的消费”便拿两个分母不同的比例作高低比较，进而判定低效。报告在这里展示的是土地规模与自给能力之间的限制，A却把供给不能覆盖全部需求读成土地使用方式低效。\n\n**85%的土地与80%的消费满足率，可以直接相减或比较，得出土地利用效率低吗？**\n\n不能。两个比例衡量的对象不同，A把需求满足程度换成土地使用效率，数字本身并不支持这种换算。\n\n**第一轮判断：A排除。**","html":"<h3>A. farmland has been inefficiently utilised</h3>\n<blockquote>\n<p>农地一直没有得到高效利用</p>\n</blockquote>\n<p>把A接回题干，它说的是：报告认为英国农地使用效率低。</p>\n<p>A的inefficiently utilised在评价土地使用效果，所以回到第3段85 per cent of the country’s total land area，再看后面的80 per cent测量什么。</p>\n<blockquote>\n<p>85 per cent of the country’s total land area is associated with meat and dairy production.</p>\n</blockquote>\n<blockquote>\n<p>That supplies 80 per cent of what is consumed,</p>\n</blockquote>\n<p>85 per cent of the country’s total land area说明多少土地与肉奶生产相关，inefficiently utilised则需要评价同等土地、资源投入产生了多少产出，或是否低于可达到的水平。原句的80 per cent不是土地利用率，更不是每块地的产出效率，而是本国需求有多少得到供应。</p>\n<p>因此，不能因为“用了85%的土地、只满足80%的消费”便拿两个分母不同的比例作高低比较，进而判定低效。报告在这里展示的是土地规模与自给能力之间的限制，A却把供给不能覆盖全部需求读成土地使用方式低效。</p>\n<p><strong>85%的土地与80%的消费满足率，可以直接相减或比较，得出土地利用效率低吗？</strong></p>\n<p>不能。两个比例衡量的对象不同，A把需求满足程度换成土地使用效率，数字本身并不支持这种换算。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,591,795,29],[135,626,795,30]],"questionRects":[[187,378,664,30],[216,421,381,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的inefficiently utilised在评价土地使用效果，所以回到第3段85 per cent of the country’s total land area，再看后面的80 per cent测量什么。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"85 per cent of the country’s total land area","visibleOptionAnchor":"inefficiently utilised"}}}},{"section":"27题","raw":"### B. factory-style production needs reforming\n\n> 工厂式生产需要改革\n\n把B接回题干，它说的是：报告要求对英国现有工厂式生产进行改革。\n\nB的needs reforming指向factory-style production，这个短语在下一段出现，所以把第4段完整读完，看看它是怎样被提到的。\n\n> 原文参考：\n>\n> There are many [xxx] to those figures, but they are still grave. To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.\n>\n> 开始精读：\n>\n> There are many [xxx] to those figures, / but they are still grave. / To become much more self-sufficient, / the UK would need to [xxx] reduce its consumption of animal foods, / and probably also farm more intensively— / meaning fewer green fields, and more factory-style production.\n>\n> 这些数字有许多[xxx]， / 但它们仍然是严重的。 / 要变得更加自给自足， / 英国将需要[xxx]地减少动物性食品消费， / 也很可能需要采用更集约的耕作—— / 这意味着更少的绿色田地，以及更多工厂式生产。\n\n读完这一段，再把needs reforming和factory-style production放在一起：\n\n> To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.\n\nfactory-style production跟在more后面，表示若要更加自给，可能需要增加这种生产方式；needs reforming却把它写成现在已有的一个待改革对象。原文从目标出发列出所需变化，并没有先诊断现有工厂式生产出了什么问题，再要求修正这种生产本身。\n\n两种说法都可能包含“改变农业”，但被改变的对象不同：原文谈减少动物性食品消费、提高集约程度，以及绿色田地与工厂式生产的比例；B谈对工厂式生产自身作改革。不能因为都带有变化，就把后者安进这份报告。\n\n**增加一种生产方式以满足某个目标，就是要求改革这种生产方式本身吗？**\n\n不等于。more factory-style production说的是在假设方案中增加其使用，B把它改成需要修正的对象。\n\n**第一轮判断：B排除。**","html":"<h3>B. factory-style production needs reforming</h3>\n<blockquote>\n<p>工厂式生产需要改革</p>\n</blockquote>\n<p>把B接回题干，它说的是：报告要求对英国现有工厂式生产进行改革。</p>\n<p>B的needs reforming指向factory-style production，这个短语在下一段出现，所以把第4段完整读完，看看它是怎样被提到的。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>There are many [xxx] to those figures, but they are still grave. To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.</p>\n<p>开始精读：</p>\n<p>There are many [xxx] to those figures, / but they are still grave. / To become much more self-sufficient, / the UK would need to [xxx] reduce its consumption of animal foods, / and probably also farm more intensively— / meaning fewer green fields, and more factory-style production.</p>\n<p>这些数字有许多[xxx]， / 但它们仍然是严重的。 / 要变得更加自给自足， / 英国将需要[xxx]地减少动物性食品消费， / 也很可能需要采用更集约的耕作—— / 这意味着更少的绿色田地，以及更多工厂式生产。</p>\n</blockquote>\n<p>读完这一段，再把needs reforming和factory-style production放在一起：</p>\n<blockquote>\n<p>To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.</p>\n</blockquote>\n<p>factory-style production跟在more后面，表示若要更加自给，可能需要增加这种生产方式；needs reforming却把它写成现在已有的一个待改革对象。原文从目标出发列出所需变化，并没有先诊断现有工厂式生产出了什么问题，再要求修正这种生产本身。</p>\n<p>两种说法都可能包含“改变农业”，但被改变的对象不同：原文谈减少动物性食品消费、提高集约程度，以及绿色田地与工厂式生产的比例；B谈对工厂式生产自身作改革。不能因为都带有变化，就把后者安进这份报告。</p>\n<p><strong>增加一种生产方式以满足某个目标，就是要求改革这种生产方式本身吗？</strong></p>\n<p>不等于。more factory-style production说的是在假设方案中增加其使用，B把它改成需要修正的对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[183,555,745,29],[135,591,795,29],[135,626,795,30],[135,662,796,30],[135,698,118,29],[182,734,748,29],[135,770,795,29],[135,806,796,29],[135,842,531,29]],"questionRects":[[187,378,664,30],[215,463,395,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的needs reforming指向factory-style production，这个短语在下一段出现，所以把第4段完整读完，看看它是怎样被提到的。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[3],"sourceMode":"new_precision_reading","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"factory-style production","visibleOptionAnchor":"needs reforming"}}}},{"section":"27题","raw":"### C. most land is used for meat and [xxx] production\n\n> 多数土地用于肉类和[xxx]生产\n\n把C接回题干，它说的是：报告显示，大部分英国土地与肉类及[xxx]的生产有关。\n\nC的most land对应第3段85 per cent，所以回到这个数字后面的total land area，核对它修饰的范围与用途。\n\n> 85 per cent of the country’s total land area is associated with meat and dairy production.\n\n85 per cent显然属于大部分，most land正是把这个具体土地比例换成数量概括。原句从the country’s total land area谈全国土地，C也没有把它缩成只有已经划为耕地的一小类土地；meat与production又能接到原句说明的用途。\n\n这里的关键不是拿80 per cent来证明most，因为80说的是消费满足率。C保留的关系是“大部分土地—与这些食品生产相关”，是报告直接陈述的一项土地使用情况。\n\n**most land应该由85%的土地比例支持，还是由80%的需求满足比例支持？**\n\n前者。85 per cent与total land area相接，正好支持most land；这与另一项需求比例要分开。\n\n**第一轮判断：C保留。**","html":"<h3>C. most land is used for meat and [xxx] production</h3>\n<blockquote>\n<p>多数土地用于肉类和[xxx]生产</p>\n</blockquote>\n<p>把C接回题干，它说的是：报告显示，大部分英国土地与肉类及[xxx]的生产有关。</p>\n<p>C的most land对应第3段85 per cent，所以回到这个数字后面的total land area，核对它修饰的范围与用途。</p>\n<blockquote>\n<p>85 per cent of the country’s total land area is associated with meat and dairy production.</p>\n</blockquote>\n<p>85 per cent显然属于大部分，most land正是把这个具体土地比例换成数量概括。原句从the country’s total land area谈全国土地，C也没有把它缩成只有已经划为耕地的一小类土地；meat与production又能接到原句说明的用途。</p>\n<p>这里的关键不是拿80 per cent来证明most，因为80说的是消费满足率。C保留的关系是“大部分土地—与这些食品生产相关”，是报告直接陈述的一项土地使用情况。</p>\n<p><strong>most land应该由85%的土地比例支持，还是由80%的需求满足比例支持？</strong></p>\n<p>前者。85 per cent与total land area相接，正好支持most land；这与另一项需求比例要分开。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[135,591,795,29],[135,626,795,30]],"questionRects":[[187,378,664,30],[215,505,471,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的most land对应第3段85 per cent，所以回到这个数字后面的total land area，核对它修饰的范围与用途。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"85 per cent","visibleOptionAnchor":"most land"}}}},{"section":"27题","raw":"### D. more green fields will be converted for farming\n\n> 更多绿色田地将被转为农业用途\n\n把D接回题干，它说的是：报告说明未来会有更多绿色田地被转去用于农业。\n\nD的will be converted说土地将发生变化，因此回到刚读完的第4段fewer green fields，看看它与more factory-style production怎样放在一起。\n\n> To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.\n\nfewer green fields与更多工厂式生产并列，确实让人想到土地与生产方式会被重新安排；will be converted也在说农业用途的变化，因此D并非与这一段毫无联系。不过前面写的是To become和would need：要达到自给目标，需要付出这些改变，不是已经宣布绿色田地必然按某种方案转换。\n\n第一遍可以看出D把条件说得更确定了，却还不能只凭这段断言未来不会发生这类转换。报告与随后对条件的说明也接得很近，D是否抓住了这份报告在全文里真正要说明的事情，还需往后看。\n\n**原文写出一种方案需要的变化，就已经证明D的无条件预测；或者反过来证明这种变化永远不会发生了吗？**\n\n还不能。条件要求不等于确定预测，也不等于否定未来的可能性。先留下C、D，再看全文怎样使用这份报告。\n\n**第一轮判断：D保留。**","html":"<h3>D. more green fields will be converted for farming</h3>\n<blockquote>\n<p>更多绿色田地将被转为农业用途</p>\n</blockquote>\n<p>把D接回题干，它说的是：报告说明未来会有更多绿色田地被转去用于农业。</p>\n<p>D的will be converted说土地将发生变化，因此回到刚读完的第4段fewer green fields，看看它与more factory-style production怎样放在一起。</p>\n<blockquote>\n<p>To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.</p>\n</blockquote>\n<p>fewer green fields与更多工厂式生产并列，确实让人想到土地与生产方式会被重新安排；will be converted也在说农业用途的变化，因此D并非与这一段毫无联系。不过前面写的是To become和would need：要达到自给目标，需要付出这些改变，不是已经宣布绿色田地必然按某种方案转换。</p>\n<p>第一遍可以看出D把条件说得更确定了，却还不能只凭这段断言未来不会发生这类转换。报告与随后对条件的说明也接得很近，D是否抓住了这份报告在全文里真正要说明的事情，还需往后看。</p>\n<p><strong>原文写出一种方案需要的变化，就已经证明D的无条件预测；或者反过来证明这种变化永远不会发生了吗？</strong></p>\n<p>还不能。条件要求不等于确定预测，也不等于否定未来的可能性。先留下C、D，再看全文怎样使用这份报告。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[182,734,748,29],[135,770,795,29],[135,806,796,29],[135,842,531,29]],"questionRects":[[187,378,664,30],[216,547,467,30]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的will be converted说土地将发生变化，因此回到刚读完的第4段fewer green fields，看看它与more factory-style production怎样放在一起。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"visibleSourceAnchor":"fewer green fields","visibleOptionAnchor":"will be converted"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D保留。\n\nC、D保留。C直接概括报告中的土地占比；D联系到后段的田地变化，但把条件说成未来事实，这一层还要结合全文再判断。","html":"<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D保留。</li>\n</ul>\n<p>C、D保留。C直接概括报告中的土地占比；D联系到后段的田地变化，但把条件说成未来事实，这一层还要结合全文再判断。</p>\n","articleRects":[],"questionRects":[[187,378,664,30],[216,421,381,29],[215,463,395,29],[215,505,471,29],[216,547,467,30]],"scrollTarget":"auto","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> Crop-growing in the UK is restricted due to ______.\n> 英国种植作物受到哪一方面的限制？\n\n题干直接问Crop-growing，第5段同样出现crop-growing，并用reason和why解释英国的生产方式。把这一段从饮食转换一直读到增产结果。\n\n> 原文参考：\n>\n> But switching to a mainly plant-based diet wouldn’t help. There is a good reason why the UK is dominated by animal [xxx]: most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis. Just 25 per cent of the country’s land is suitable for crop-growing, most of which is already occupied by [xxx] fields. Even if we [xxx] all the suitable land to fields of fruit and veg—which would involve taking out all the nature [xxx] and removing thousands of people from their homes—we would achieve only a 30 per cent boost in crop production.\n>\n> 开始精读：\n>\n> But switching to a mainly plant-based diet wouldn’t help. / There is a good reason / why the UK is dominated by animal [xxx]: / most of its [xxx] doesn’t have the right soil or climate / to grow crops on [xxx] basis. / Just 25 per cent of the country’s land is suitable for crop-growing, / most of which is already occupied by [xxx] fields. / Even if we [xxx] all the suitable land to fields of fruit and veg— / which would involve taking out all the nature [xxx] / and removing thousands of people from their homes— / we would achieve only a 30 per cent boost in crop production.\n>\n> 但转向以植物为主的饮食也无济于事。 / 有一个充分的理由 / 解释为什么英国以动物[xxx]为主： / 它的大部分[xxx]没有合适的土壤或气候 / 来以[xxx]的方式种植作物。 / 这个国家只有百分之二十五的土地适宜种植作物， / 其中大部分已经被[xxx]田地占用。 / 即使我们把所有合适的土地都[xxx]成水果和蔬菜的田地—— / 这将涉及去掉所有自然[xxx] / 并让数千人离开自己的家—— / 我们也只会实现作物产量增加百分之三十。\n\nwhy后先交代缺少合适土壤或气候，接着用仅四分之一土地适合种植来落实限制。开头还说，改吃以植物为主的饮食也解决不了，这让饮食选择与土地条件成为两个需要分开的因素。\n\n接下来按A—D逐项看。","html":"<h2>28题</h2>\n<blockquote>\n<p>Crop-growing in the UK is restricted due to ______.\n英国种植作物受到哪一方面的限制？</p>\n</blockquote>\n<p>题干直接问Crop-growing，第5段同样出现crop-growing，并用reason和why解释英国的生产方式。把这一段从饮食转换一直读到增产结果。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But switching to a mainly plant-based diet wouldn’t help. There is a good reason why the UK is dominated by animal [xxx]: most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis. Just 25 per cent of the country’s land is suitable for crop-growing, most of which is already occupied by [xxx] fields. Even if we [xxx] all the suitable land to fields of fruit and veg—which would involve taking out all the nature [xxx] and removing thousands of people from their homes—we would achieve only a 30 per cent boost in crop production.</p>\n<p>开始精读：</p>\n<p>But switching to a mainly plant-based diet wouldn’t help. / There is a good reason / why the UK is dominated by animal [xxx]: / most of its [xxx] doesn’t have the right soil or climate / to grow crops on [xxx] basis. / Just 25 per cent of the country’s land is suitable for crop-growing, / most of which is already occupied by [xxx] fields. / Even if we [xxx] all the suitable land to fields of fruit and veg— / which would involve taking out all the nature [xxx] / and removing thousands of people from their homes— / we would achieve only a 30 per cent boost in crop production.</p>\n<p>但转向以植物为主的饮食也无济于事。 / 有一个充分的理由 / 解释为什么英国以动物[xxx]为主： / 它的大部分[xxx]没有合适的土壤或气候 / 来以[xxx]的方式种植作物。 / 这个国家只有百分之二十五的土地适宜种植作物， / 其中大部分已经被[xxx]田地占用。 / 即使我们把所有合适的土地都[xxx]成水果和蔬菜的田地—— / 这将涉及去掉所有自然[xxx] / 并让数千人离开自己的家—— / 我们也只会实现作物产量增加百分之三十。</p>\n</blockquote>\n<p>why后先交代缺少合适土壤或气候，接着用仅四分之一土地适合种植来落实限制。开头还说，改吃以植物为主的饮食也解决不了，这让饮食选择与土地条件成为两个需要分开的因素。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[183,878,748,29],[135,913,796,30],[135,949,796,30],[135,985,795,30],[135,1021,797,29],[135,1057,795,29],[135,1093,796,29],[135,1129,293,29]],"questionRects":[[187,632,431,29],[187,675,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. its farming technology\n\n> 农业技术\n\n把A接回题干，它说的是：英国作物种植受限，是因为农业技术有问题。\n\nA的farming technology让人想到上一段farm more intensively，所以回看这处，再与第5段right soil or climate对应，区分生产方法与土地本身的条件。\n\n> probably also farm more intensively—meaning fewer green fields, and more factory-style production.\n\n> most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis.\n\nright soil or climate明确给出限制来自土壤与气候，farming technology却把原因换成种植方法或技术水平。前一段确实提到更集约和工厂式生产，但那是若追求更高自给率可能要采取的做法，不是作者对英国技术落后的诊断。\n\n第5段随后统计适合种植的土地比例，也是在按土地是否具备条件来划分，并未按农场掌握了哪一种技术来划分。把改进生产方式的可能措施移作现有限制的原因，会把“要怎么做”与“为什么受限”混到一起。\n\n**提出可能采用更集约的方式，就说明作物受限的原因一定是农业技术吗？**\n\n不能。原文明确把原因接到土壤和气候；A把上一段的可能做法换成这一段的限制来源。\n\n**第一轮判断：A排除。**","html":"<h3>A. its farming technology</h3>\n<blockquote>\n<p>农业技术</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国作物种植受限，是因为农业技术有问题。</p>\n<p>A的farming technology让人想到上一段farm more intensively，所以回看这处，再与第5段right soil or climate对应，区分生产方法与土地本身的条件。</p>\n<blockquote>\n<p>probably also farm more intensively—meaning fewer green fields, and more factory-style production.</p>\n</blockquote>\n<blockquote>\n<p>most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis.</p>\n</blockquote>\n<p>right soil or climate明确给出限制来自土壤与气候，farming technology却把原因换成种植方法或技术水平。前一段确实提到更集约和工厂式生产，但那是若追求更高自给率可能要采取的做法，不是作者对英国技术落后的诊断。</p>\n<p>第5段随后统计适合种植的土地比例，也是在按土地是否具备条件来划分，并未按农场掌握了哪一种技术来划分。把改进生产方式的可能措施移作现有限制的原因，会把“要怎么做”与“为什么受限”混到一起。</p>\n<p><strong>提出可能采用更集约的方式，就说明作物受限的原因一定是农业技术吗？</strong></p>\n<p>不能。原文明确把原因接到土壤和气候；A把上一段的可能做法换成这一段的限制来源。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,806,796,29],[135,842,531,29],[135,913,796,30],[135,949,796,30]],"questionRects":[[187,632,431,29],[187,675,25,24],[216,674,220,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的farming technology让人想到上一段farm more intensively，所以回看这处，再与第5段right soil or climate对应，区分生产方法与土地本身的条件。"],"evidenceParagraphPids":[3,4],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality"],"visibleSourceAnchor":"right soil or climate","visibleOptionAnchor":"farming technology"}}}},{"section":"28题","raw":"### B. its dietary tradition\n\n> 饮食传统\n\n把B接回题干，它说的是：英国的饮食传统限制了作物种植。\n\nB的dietary tradition与第5段plant-based diet wouldn’t help都涉及饮食，所以回到段首，看看换一种吃法能不能解除后面的限制。\n\n> But switching to a mainly plant-based diet wouldn’t help.\n\n> most of its [xxx] doesn’t have the right soil or climate\n\nplant-based diet wouldn’t help已经把“改变饮食就能解决问题”这条路挡住，dietary tradition却把种植限制归给原有吃法。作者接下来说明，即使人们愿意改吃更多植物，土壤和气候也不会随饮食选择一起改变，可适合种植的土地仍然有限。\n\n英国以动物类食品生产为主，在这里也不是饮食习惯凭空决定的结果；why之后给出的解释恰恰是土地条件。B把这种生产结构背后的自然限制，改成了人们先有某种饮食传统而造成的限制。\n\n**如果改变饮食仍不能解决土地条件问题，把饮食传统当作这里的原因还接得上吗？**\n\n不能。原文特地通过饮食转换后仍无济于事，把限制保留在土壤与气候这一层。\n\n**第一轮判断：B排除。**","html":"<h3>B. its dietary tradition</h3>\n<blockquote>\n<p>饮食传统</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国的饮食传统限制了作物种植。</p>\n<p>B的dietary tradition与第5段plant-based diet wouldn’t help都涉及饮食，所以回到段首，看看换一种吃法能不能解除后面的限制。</p>\n<blockquote>\n<p>But switching to a mainly plant-based diet wouldn’t help.</p>\n</blockquote>\n<blockquote>\n<p>most of its [xxx] doesn’t have the right soil or climate</p>\n</blockquote>\n<p>plant-based diet wouldn’t help已经把“改变饮食就能解决问题”这条路挡住，dietary tradition却把种植限制归给原有吃法。作者接下来说明，即使人们愿意改吃更多植物，土壤和气候也不会随饮食选择一起改变，可适合种植的土地仍然有限。</p>\n<p>英国以动物类食品生产为主，在这里也不是饮食习惯凭空决定的结果；why之后给出的解释恰恰是土地条件。B把这种生产结构背后的自然限制，改成了人们先有某种饮食传统而造成的限制。</p>\n<p><strong>如果改变饮食仍不能解决土地条件问题，把饮食传统当作这里的原因还接得上吗？</strong></p>\n<p>不能。原文特地通过饮食转换后仍无济于事，把限制保留在土壤与气候这一层。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[183,878,748,29],[135,913,796,30],[135,949,796,30]],"questionRects":[[187,632,431,29],[187,675,25,24],[215,717,186,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的dietary tradition与第5段plant-based diet wouldn’t help都涉及饮食，所以回到段首，看看换一种吃法能不能解除后面的限制。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality"],"visibleSourceAnchor":"plant-based diet wouldn’t help","visibleOptionAnchor":"dietary tradition"}}}},{"section":"28题","raw":"### C. its natural conditions\n\n> 自然条件\n\n把C接回题干，它说的是：英国作物种植受限，原因在土地的自然条件。\n\nC的natural conditions可以概括第5段right soil or climate，所以回到why后面的解释，再接土地适合种植的比例。\n\n> most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis.\n\n> Just 25 per cent of the country’s land is suitable for crop-growing,\n\nright soil or climate说的是作物生长所需要的土壤和气候，natural conditions把这两项放在同一个类别里。下一句只四分之一土地适合种植，进一步说明这种限制并非个别农场暂时没选对方法，而是大量土地缺少相应条件。\n\nC并未把“只有25%适合”读成“只有25%已经在种”。后面most of which is already occupied才说适合土地中有多少已被占用。适合与已用是两层，前一层先决定能够扩展到哪里。\n\n**natural conditions是否同时接住了土壤气候的具体原因，以及适宜土地只有四分之一这一结果？**\n\n能。前者点明条件，后者展示限制的范围，C把这两句的原因与结果接在一起。\n\n**第一轮判断：C保留。**","html":"<h3>C. its natural conditions</h3>\n<blockquote>\n<p>自然条件</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国作物种植受限，原因在土地的自然条件。</p>\n<p>C的natural conditions可以概括第5段right soil or climate，所以回到why后面的解释，再接土地适合种植的比例。</p>\n<blockquote>\n<p>most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis.</p>\n</blockquote>\n<blockquote>\n<p>Just 25 per cent of the country’s land is suitable for crop-growing,</p>\n</blockquote>\n<p>right soil or climate说的是作物生长所需要的土壤和气候，natural conditions把这两项放在同一个类别里。下一句只四分之一土地适合种植，进一步说明这种限制并非个别农场暂时没选对方法，而是大量土地缺少相应条件。</p>\n<p>C并未把“只有25%适合”读成“只有25%已经在种”。后面most of which is already occupied才说适合土地中有多少已被占用。适合与已用是两层，前一层先决定能够扩展到哪里。</p>\n<p><strong>natural conditions是否同时接住了土壤气候的具体原因，以及适宜土地只有四分之一这一结果？</strong></p>\n<p>能。前者点明条件，后者展示限制的范围，C把这两句的原因与结果接在一起。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[135,913,796,30],[135,949,796,30],[135,985,795,30]],"questionRects":[[187,632,431,29],[187,675,25,24],[215,759,204,24]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的natural conditions可以概括第5段right soil or climate，所以回到why后面的解释，再接土地适合种植的比例。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"right soil or climate","visibleOptionAnchor":"natural conditions"}}}},{"section":"28题","raw":"### D. its [xxx] interests\n\n> [xxx]方面的利益\n\n把D接回题干，它说的是：某种利益因素限制了英国作物种植。\n\nD的interests在说利益因素，因此回到第5段soil or climate，看看grow crops前面接的是自然条件，还是某些主体为了利益作出的选择。\n\n> most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis.\n\nsoil or climate位于doesn’t have之后，是缺少的适宜条件；interests却把因果改成某种利益限制。句末on [xxx] basis说明种植活动所处的一种方式或基础，即使那一处与经济有关，也不能把前面明说的土壤气候原因挪走。\n\n原句没有先给出某个获利群体，再写它怎样限制土地种植。D把“哪些土地具备条件”换成“哪些利益不允许这么做”，多出人的动机与干预这一层。\n\n**句子谈到一种种植基础，就能把土壤气候不足改写成利益因素在阻碍吗？**\n\n不能。[xxx]所在的修饰位置并不改写doesn’t have后面的自然条件，D换了因果来源。\n\n**第一轮判断：D排除。**","html":"<h3>D. its [xxx] interests</h3>\n<blockquote>\n<p>[xxx]方面的利益</p>\n</blockquote>\n<p>把D接回题干，它说的是：某种利益因素限制了英国作物种植。</p>\n<p>D的interests在说利益因素，因此回到第5段soil or climate，看看grow crops前面接的是自然条件，还是某些主体为了利益作出的选择。</p>\n<blockquote>\n<p>most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis.</p>\n</blockquote>\n<p>soil or climate位于doesn’t have之后，是缺少的适宜条件；interests却把因果改成某种利益限制。句末on [xxx] basis说明种植活动所处的一种方式或基础，即使那一处与经济有关，也不能把前面明说的土壤气候原因挪走。</p>\n<p>原句没有先给出某个获利群体，再写它怎样限制土地种植。D把“哪些土地具备条件”换成“哪些利益不允许这么做”，多出人的动机与干预这一层。</p>\n<p><strong>句子谈到一种种植基础，就能把土壤气候不足改写成利益因素在阻碍吗？</strong></p>\n<p>不能。[xxx]所在的修饰位置并不改写doesn’t have后面的自然条件，D换了因果来源。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,913,796,30],[135,949,796,30]],"questionRects":[[187,632,431,29],[187,675,25,24],[216,801,231,25]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的interests在说利益因素，因此回到第5段soil or climate，看看grow crops前面接的是自然条件，还是某些主体为了利益作出的选择。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality"],"visibleSourceAnchor":"soil or climate","visibleOptionAnchor":"interests"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除。\n\nC保留。适合的土壤、气候与25%的适宜土地直接相接；A、B、D分别把限制改成技术、饮食与利益。","html":"<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。适合的土壤、气候与25%的适宜土地直接相接；A、B、D分别把限制改成技术、饮食与利益。</p>\n","articleRects":[],"questionRects":[[187,632,431,29],[187,675,25,24],[216,674,220,29],[215,717,186,29],[215,759,204,24],[216,801,231,25]],"scrollTarget":"auto","meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> It can be learned from the last paragraph that British people ______.\n> 从最后一段可以知道英国人在哪一方面存在什么情况？\n\n题干已经指定last paragraph，直接完整读最后一段。先分清目前本国种植的份额与假设采取更多措施之后能满足的份额。\n\n> 原文参考：\n>\n> Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown, so even with the most [xxx] measures we could meet only 30 per cent of our fresh produce needs. That is before we look for the space to grow the [xxx], sugars, seeds and oils that provide us with the vast [xxx] of our current calorie intake.\n>\n> 开始精读：\n>\n> Just 23 per cent of the fruit and vegetables consumed in the UK / are currently home-grown, / so even with the most [xxx] measures / we could meet only 30 per cent of our fresh produce needs. / That is before we look for the space to grow the [xxx], sugars, seeds and oils / that provide us with the vast [xxx] of our current calorie intake.\n>\n> 英国所消费的水果和蔬菜中，只有百分之二十三 / 目前是本国种植的， / 因此，即使用最[xxx]的措施， / 我们也只能满足新鲜农产品需求的百分之三十。 / 而这还没有算上我们寻找空间来种植[xxx]、糖、种子和油， / 它们为我们提供当前热量摄入的巨大[xxx]。\n\n23 per cent后面接currently home-grown，是现在的本国供给；30 per cent后面接fresh produce needs，是假设采取措施之后仍只能满足的需求比例。段末还说，这尚未给其他热量来源的食物安排种植空间。\n\n接下来按A—D逐项看。","html":"<h2>29题</h2>\n<blockquote>\n<p>It can be learned from the last paragraph that British people ______.\n从最后一段可以知道英国人在哪一方面存在什么情况？</p>\n</blockquote>\n<p>题干已经指定last paragraph，直接完整读最后一段。先分清目前本国种植的份额与假设采取更多措施之后能满足的份额。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown, so even with the most [xxx] measures we could meet only 30 per cent of our fresh produce needs. That is before we look for the space to grow the [xxx], sugars, seeds and oils that provide us with the vast [xxx] of our current calorie intake.</p>\n<p>开始精读：</p>\n<p>Just 23 per cent of the fruit and vegetables consumed in the UK / are currently home-grown, / so even with the most [xxx] measures / we could meet only 30 per cent of our fresh produce needs. / That is before we look for the space to grow the [xxx], sugars, seeds and oils / that provide us with the vast [xxx] of our current calorie intake.</p>\n<p>英国所消费的水果和蔬菜中，只有百分之二十三 / 目前是本国种植的， / 因此，即使用最[xxx]的措施， / 我们也只能满足新鲜农产品需求的百分之三十。 / 而这还没有算上我们寻找空间来种植[xxx]、糖、种子和油， / 它们为我们提供当前热量摄入的巨大[xxx]。</p>\n</blockquote>\n<p>23 per cent后面接currently home-grown，是现在的本国供给；30 per cent后面接fresh produce needs，是假设采取措施之后仍只能满足的需求比例。段末还说，这尚未给其他热量来源的食物安排种植空间。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[182,1165,748,29],[135,1201,796,29],[135,1236,795,30],[135,1272,796,29],[135,1308,138,24]],"questionRects":[[187,886,588,29],[187,928,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. rely largely on imports for fresh produce\n\n> 新鲜农产品很大程度依赖进口\n\n把A接回题干，它说的是：英国人消费的新鲜农产品大多需要依靠外部供给。\n\nA的rely largely on imports与最后一段currently home-grown处在供给来源的两边，所以回到23 per cent，再接后面只能满足30%的说法。\n\n> Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown,\n\n> we could meet only 30 per cent of our fresh produce needs.\n\ncurrently home-grown只占23%，rely largely on imports说的是这一供给比例所对应的外部依赖：目前本国种植仅提供不足四分之一，其余约77%要靠本国生产之外的来源。A的largely说大部分，而非全部，正好保留了英国仍有一部分自产这一事实。\n\n即使转到后面的假设，能满足的也只是30%的新鲜农产品需求，仍有约70%不能靠这套本国生产方案解决。两个层次都显示外部依赖，而不是说一经采取措施就能摆脱进口。\n\n**A的largely是否夸张成了完全依赖进口，还是与不足四分之一自产的比例相符？**\n\n后者。它说很大程度依赖，保留了当前23%的自产部分，也符合扩大供给后仍远不足全部需求的说明。\n\n**第一轮判断：A保留。**","html":"<h3>A. rely largely on imports for fresh produce</h3>\n<blockquote>\n<p>新鲜农产品很大程度依赖进口</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国人消费的新鲜农产品大多需要依靠外部供给。</p>\n<p>A的rely largely on imports与最后一段currently home-grown处在供给来源的两边，所以回到23 per cent，再接后面只能满足30%的说法。</p>\n<blockquote>\n<p>Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown,</p>\n</blockquote>\n<blockquote>\n<p>we could meet only 30 per cent of our fresh produce needs.</p>\n</blockquote>\n<p>currently home-grown只占23%，rely largely on imports说的是这一供给比例所对应的外部依赖：目前本国种植仅提供不足四分之一，其余约77%要靠本国生产之外的来源。A的largely说大部分，而非全部，正好保留了英国仍有一部分自产这一事实。</p>\n<p>即使转到后面的假设，能满足的也只是30%的新鲜农产品需求，仍有约70%不能靠这套本国生产方案解决。两个层次都显示外部依赖，而不是说一经采取措施就能摆脱进口。</p>\n<p><strong>A的largely是否夸张成了完全依赖进口，还是与不足四分之一自产的比例相符？</strong></p>\n<p>后者。它说很大程度依赖，保留了当前23%的自产部分，也符合扩大供给后仍远不足全部需求的说明。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[182,1165,748,29],[135,1201,796,29],[135,1236,795,30]],"questionRects":[[187,886,588,29],[187,928,25,24],[216,928,399,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的rely largely on imports与最后一段currently home-grown处在供给来源的两边，所以回到23 per cent，再接后面只能满足30%的说法。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"currently home-grown","visibleOptionAnchor":"rely largely on imports"}}}},{"section":"29题","raw":"### B. enjoy a steady rise in fruit consumption\n\n> 水果消费量持续稳步上升\n\n把B接回题干，它说的是：英国人的水果消费总量一直在稳定增加。\n\nB的steady rise in fruit consumption让人想到上一段的boost in crop production，所以把这两处增长与最后一段的比例放在一起看。\n\n> we would achieve only a 30 per cent boost in crop production.\n\n> Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown,\n\nboost in crop production说的是极端用地假设下作物产量可能增加，steady rise in fruit consumption说的却是过去至今水果消费量持续增长。一个是生产端的条件结果，一个是消费端的时间趋势，动作对象和时间性质都变了。\n\n最后一段23%与30%也不能补出这种消费趋势：23%是当前本国产出的供给份额，30%是设想措施后可满足的需求份额，并不是某两个年份的水果消费总量。B把不同条件下的供应比例排成了一个并不存在的消费增长序列。\n\n**原文的30%增产和23%、30%的供给份额，可以读成水果消费量稳步上涨吗？**\n\n不能。生产增量、供给份额、消费总量是三种指标，B还把假设情境改成了连续时间变化。\n\n**第一轮判断：B排除。**","html":"<h3>B. enjoy a steady rise in fruit consumption</h3>\n<blockquote>\n<p>水果消费量持续稳步上升</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国人的水果消费总量一直在稳定增加。</p>\n<p>B的steady rise in fruit consumption让人想到上一段的boost in crop production，所以把这两处增长与最后一段的比例放在一起看。</p>\n<blockquote>\n<p>we would achieve only a 30 per cent boost in crop production.</p>\n</blockquote>\n<blockquote>\n<p>Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown,</p>\n</blockquote>\n<p>boost in crop production说的是极端用地假设下作物产量可能增加，steady rise in fruit consumption说的却是过去至今水果消费量持续增长。一个是生产端的条件结果，一个是消费端的时间趋势，动作对象和时间性质都变了。</p>\n<p>最后一段23%与30%也不能补出这种消费趋势：23%是当前本国产出的供给份额，30%是设想措施后可满足的需求份额，并不是某两个年份的水果消费总量。B把不同条件下的供应比例排成了一个并不存在的消费增长序列。</p>\n<p><strong>原文的30%增产和23%、30%的供给份额，可以读成水果消费量稳步上涨吗？</strong></p>\n<p>不能。生产增量、供给份额、消费总量是三种指标，B还把假设情境改成了连续时间变化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[135,1093,796,29],[135,1129,293,29],[182,1165,748,29],[135,1201,796,29]],"questionRects":[[187,886,588,29],[187,928,25,24],[215,966,389,38]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的steady rise in fruit consumption让人想到上一段的boost in crop production，所以把这两处增长与最后一段的比例放在一起看。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time"],"visibleSourceAnchor":"boost in crop production","visibleOptionAnchor":"steady rise in fruit consumption"}}}},{"section":"29题","raw":"### C. are seeking [xxx] ways to cut calorie intake\n\n> 正在寻找[xxx]办法减少热量摄入\n\n把C接回题干，它说的是：英国人正试图减少自己吃进去的热量。\n\nC的cut calorie intake对应最后一段的calorie intake，所以回到the space to grow及后面的provide，看作者是在找空间供应食物，还是要减少食物所提供的热量。\n\n> That is before we look for the space to grow the [xxx], sugars, seeds and oils that provide us with the vast [xxx] of our current calorie intake.\n\nthe space to grow把尚未完成的任务放在找到种植空间，cut calorie intake却把目标改成减少摄入。后面的that provide us with解释这些食物供应什么，current calorie intake提供当前需求的背景，不是一个准备削减的指标。\n\n在这一句的顺序里，连新鲜农产品都只能满足一部分，还未顾及其他食物的种植空间，因此困难进一步增加。C反而把这种供给困难写成消费者主动节食的行动，既换了行动主体，也换了目标方向。\n\n**为提供食物继续寻找种植空间，是在说英国人主动寻求减少热量摄入吗？**\n\n不是。原文的任务是供应现有饮食所需的食物，C把供给问题改成了个人减少摄入的行为。\n\n**第一轮判断：C排除。**","html":"<h3>C. are seeking [xxx] ways to cut calorie intake</h3>\n<blockquote>\n<p>正在寻找[xxx]办法减少热量摄入</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国人正试图减少自己吃进去的热量。</p>\n<p>C的cut calorie intake对应最后一段的calorie intake，所以回到the space to grow及后面的provide，看作者是在找空间供应食物，还是要减少食物所提供的热量。</p>\n<blockquote>\n<p>That is before we look for the space to grow the [xxx], sugars, seeds and oils that provide us with the vast [xxx] of our current calorie intake.</p>\n</blockquote>\n<p>the space to grow把尚未完成的任务放在找到种植空间，cut calorie intake却把目标改成减少摄入。后面的that provide us with解释这些食物供应什么，current calorie intake提供当前需求的背景，不是一个准备削减的指标。</p>\n<p>在这一句的顺序里，连新鲜农产品都只能满足一部分，还未顾及其他食物的种植空间，因此困难进一步增加。C反而把这种供给困难写成消费者主动节食的行动，既换了行动主体，也换了目标方向。</p>\n<p><strong>为提供食物继续寻找种植空间，是在说英国人主动寻求减少热量摄入吗？</strong></p>\n<p>不是。原文的任务是供应现有饮食所需的食物，C把供给问题改成了个人减少摄入的行为。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[135,1236,795,30],[135,1272,796,29],[135,1308,138,24]],"questionRects":[[187,886,588,29],[187,928,25,24],[215,1012,461,30]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的cut calorie intake对应最后一段的calorie intake，所以回到the space to grow及后面的provide，看作者是在找空间供应食物，还是要减少食物所提供的热量。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"the space to grow","visibleOptionAnchor":"cut calorie intake"}}}},{"section":"29题","raw":"### D. are trying to grow new varieties of grains\n\n> 正在尝试种植新的谷物品种\n\n把D接回题干，它说的是：英国人正在试种新的谷物品种。\n\nD的new varieties涉及种植对象，因此回到最后一段the space to grow，比较原文缺的是地方，还是在讨论新的品种。\n\n> before we look for the space to grow the [xxx], sugars, seeds and oils\n\nthe space to grow说明还需要给这些食品寻找种植空间，new varieties却要求出现新的品种以及尝试种植它们的行动。[xxx]、糖、种子和油在原句中是要安排空间的对象清单，列举几种食物并不等于同一种作物出现了新品种。\n\nbefore we look for还说明这项空间问题尚未被算进去；D的are trying则把它写成现在已在尝试新种植。即使读者知道谷物也需要种植空间，也不能把这种常识补成原文报告了英国人的试种行动。\n\n**“尚未安排种这些食物的空间”，能改成“正在尝试新的作物品种”吗？**\n\n不能。D把空间条件换成品种更新，又把尚待考虑的问题写成正在发生的行动。\n\n**第一轮判断：D排除。**","html":"<h3>D. are trying to grow new varieties of grains</h3>\n<blockquote>\n<p>正在尝试种植新的谷物品种</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国人正在试种新的谷物品种。</p>\n<p>D的new varieties涉及种植对象，因此回到最后一段the space to grow，比较原文缺的是地方，还是在讨论新的品种。</p>\n<blockquote>\n<p>before we look for the space to grow the [xxx], sugars, seeds and oils</p>\n</blockquote>\n<p>the space to grow说明还需要给这些食品寻找种植空间，new varieties却要求出现新的品种以及尝试种植它们的行动。[xxx]、糖、种子和油在原句中是要安排空间的对象清单，列举几种食物并不等于同一种作物出现了新品种。</p>\n<p>before we look for还说明这项空间问题尚未被算进去；D的are trying则把它写成现在已在尝试新种植。即使读者知道谷物也需要种植空间，也不能把这种常识补成原文报告了英国人的试种行动。</p>\n<p><strong>“尚未安排种这些食物的空间”，能改成“正在尝试新的作物品种”吗？</strong></p>\n<p>不能。D把空间条件换成品种更新，又把尚待考虑的问题写成正在发生的行动。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,1236,795,30],[135,1272,796,29]],"questionRects":[[187,886,588,29],[187,928,25,24],[216,1055,408,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的new varieties涉及种植对象，因此回到最后一段the space to grow，比较原文缺的是地方，还是在讨论新的品种。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"the space to grow","visibleOptionAnchor":"new varieties"}}}},{"section":"29题","raw":"### 29题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除。\n\nA保留。自产只占少部分，极端措施后仍不能满足多数需求；B混淆了指标与时间，C、D把供给空间问题换成了另外的行动。","html":"<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A保留。自产只占少部分，极端措施后仍不能满足多数需求；B混淆了指标与时间，C、D把供给空间问题换成了另外的行动。</p>\n","articleRects":[],"questionRects":[[187,886,588,29],[187,928,25,24],[216,928,399,29],[215,966,389,38],[215,1012,461,30],[216,1055,408,29]],"scrollTarget":"auto","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**\n\n作者对英国食品自给自足持什么态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **defensive**\n\n维护、辩护的\n\nB. **doubtful**\n\n怀疑的\n\nC. **tolerant**\n\n宽容的\n\nD. **optimistic**\n\n乐观的","html":"<h2>30题</h2>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n<p>作者对英国食品自给自足持什么态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>defensive</strong></p>\n<p>维护、辩护的</p>\n<p>B. <strong>doubtful</strong></p>\n<p>怀疑的</p>\n<p>C. <strong>tolerant</strong></p>\n<p>宽容的</p>\n<p>D. <strong>optimistic</strong></p>\n<p>乐观的</p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[501,1393,43,25],[564,1394,30,22],[610,1393,58,27],[675,1393,30,26]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以全球粮食压力作背景，再把英国的讨论缘由落到脱欧 | 先说这件事为什么受到关注 |\n| 第2段 | 介绍一些人期待自给带来好处，随后追问这一设想是否可行 | 再说一种主张并追问能否做到 |\n| 第3段 | 用肉奶生产已占大量土地、仍不足全部需求的报告展示限制 | 接着说这条路还不能完全走通 |\n| 第4段 | 说明更高自给率可能要求少吃动物性食品、增加集约及工厂式生产 | 再说要继续走会付出什么代价 |\n| 第5段 | 再检验改吃植物性食物的办法，指出土壤气候、适宜土地与增产空间仍有限 | 接着再看换条路能不能解决 |\n| 第6段 | 指出极端措施也只能满足部分新鲜农产品需求，其他热量来源还未安排种植空间 | 最后说算到这里仍然远远不够 |\n\n---\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>以全球粮食压力作背景，再把英国的讨论缘由落到脱欧</td>\n<td>先说这件事为什么受到关注</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍一些人期待自给带来好处，随后追问这一设想是否可行</td>\n<td>再说一种主张并追问能否做到</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用肉奶生产已占大量土地、仍不足全部需求的报告展示限制</td>\n<td>接着说这条路还不能完全走通</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明更高自给率可能要求少吃动物性食品、增加集约及工厂式生产</td>\n<td>再说要继续走会付出什么代价</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>再检验改吃植物性食物的办法，指出土壤气候、适宜土地与增产空间仍有限</td>\n<td>接着再看换条路能不能解决</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>指出极端措施也只能满足部分新鲜农产品需求，其他热量来源还未安排种植空间</td>\n<td>最后说算到这里仍然远远不够</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[501,1393,43,25],[564,1394,30,22],[610,1393,58,27],[675,1393,30,26]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. defensive\n\n维护、辩护的\n\n#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果A是主旨，文章中心就应该是“作者在为英国食品自给作辩护”。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍粮食背景并表明英国自给主张需要得到维护 | 先说这件事为什么受到关注 |\n| 第2段 | 提出一些人的主张并准备为其合理性辩护 | 再说一种主张并追问能否做到 |\n| 第3段 | 承认土地限制，但着力说明质疑者过于担忧 | 接着说这条路还不能完全走通 |\n| 第4段 | 把饮食和生产变化解释为值得承受的代价 | 再说要继续走会付出什么代价 |\n| 第5段 | 为植物性生产找到能克服土地限制的办法 | 接着再看换条路能不能解决 |\n| 第6段 | 最终回应不足并继续为自给方案辩护 | 最后说算到这里仍然远远不够 |\n\nA的defensive要求作者替这一主张抵挡质疑，文章却把Sounds great马上接到but how feasible，随后连续测试能否做到。肉奶一条路不够，改吃植物也wouldn’t help，结尾极端措施仍只能满足30%的新鲜农产品需求，疑问是在加深。\n\n第一段介绍粮食安全的重要性，也不等于替自给方案辩护；认可问题重要，与认可这个解决方案有效，需要不同的论据。A把讨论议题的必要性误当成了作者对特定方案的支持。\n\n**作者是在替自给方案逐条化解质疑，还是用数据让可行性疑问越来越具体？**\n\n后者。本文不断加上供给与土地限制，A所需的维护立场没有形成。\n\n**判断：A排除。**\n\n---\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**","html":"<h3>A. defensive</h3>\n<p>维护、辩护的</p>\n<h4>如果 A 是主旨，文章6段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“作者在为英国食品自给作辩护”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>介绍粮食背景并表明英国自给主张需要得到维护</td>\n<td>先说这件事为什么受到关注</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>提出一些人的主张并准备为其合理性辩护</td>\n<td>再说一种主张并追问能否做到</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>承认土地限制，但着力说明质疑者过于担忧</td>\n<td>接着说这条路还不能完全走通</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把饮食和生产变化解释为值得承受的代价</td>\n<td>再说要继续走会付出什么代价</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>为植物性生产找到能克服土地限制的办法</td>\n<td>接着再看换条路能不能解决</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最终回应不足并继续为自给方案辩护</td>\n<td>最后说算到这里仍然远远不够</td>\n</tr>\n</tbody></table>\n<p>A的defensive要求作者替这一主张抵挡质疑，文章却把Sounds great马上接到but how feasible，随后连续测试能否做到。肉奶一条路不够，改吃植物也wouldn’t help，结尾极端措施仍只能满足30%的新鲜农产品需求，疑问是在加深。</p>\n<p>第一段介绍粮食安全的重要性，也不等于替自给方案辩护；认可问题重要，与认可这个解决方案有效，需要不同的论据。A把讨论议题的必要性误当成了作者对特定方案的支持。</p>\n<p><strong>作者是在替自给方案逐条化解质疑，还是用数据让可行性疑问越来越具体？</strong></p>\n<p>后者。本文不断加上供给与土地限制，A所需的维护立场没有形成。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[501,1393,43,25]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"### B. doubtful\n\n怀疑的\n\n#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果B是主旨，文章中心就应该是“作者怀疑英国食品自给的可行性”。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 交代讨论自给的背景与英国的特殊缘由 | 先说这件事为什么受到关注 |\n| 第2段 | 先呈现吸引人的主张，再追问到底能否实现 | 再说一种主张并追问能否做到 |\n| 第3段 | 用已有生产规模仍不足的情况提出第一重疑问 | 接着说这条路还不能完全走通 |\n| 第4段 | 指出进一步自给所要求的消费与生产代价 | 再说要继续走会付出什么代价 |\n| 第5段 | 继续检查另一种办法，发现土地条件仍难以突破 | 接着再看换条路能不能解决 |\n| 第6段 | 累积需求与空间缺口，使对可行性的怀疑落到结尾 | 最后说算到这里仍然远远不够 |\n\nB的doubtful对应的是能否实现这一层，不是否认农业或国民健康本身重要。第2段先问how feasible，后面才用85%的土地、有限的适宜种植面积、仅30%的需求满足率等材料回答这个问题。\n\n作者还特地检验了替代办法：少吃动物性食物之后，种植条件仍受土壤气候限制；即使扩大水果蔬菜生产，也还没给其他食物找到空间。这种逐条检验后仍不足的走向，能够解释B的怀疑从何而来。\n\n**doubtful是否只是抓住一个消极词，还是由整篇对不同自给路径的检查共同支持？**\n\n后者。吸引人的好处没有被直接当成可实现的结果，几条路径都碰到具体限制，B概括的是这条持续加深的可行性疑问。\n\n**判断：B保留。**\n\n---\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**","html":"<h3>B. doubtful</h3>\n<p>怀疑的</p>\n<h4>如果 B 是主旨，文章6段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“作者怀疑英国食品自给的可行性”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>交代讨论自给的背景与英国的特殊缘由</td>\n<td>先说这件事为什么受到关注</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>先呈现吸引人的主张，再追问到底能否实现</td>\n<td>再说一种主张并追问能否做到</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用已有生产规模仍不足的情况提出第一重疑问</td>\n<td>接着说这条路还不能完全走通</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出进一步自给所要求的消费与生产代价</td>\n<td>再说要继续走会付出什么代价</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>继续检查另一种办法，发现土地条件仍难以突破</td>\n<td>接着再看换条路能不能解决</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>累积需求与空间缺口，使对可行性的怀疑落到结尾</td>\n<td>最后说算到这里仍然远远不够</td>\n</tr>\n</tbody></table>\n<p>B的doubtful对应的是能否实现这一层，不是否认农业或国民健康本身重要。第2段先问how feasible，后面才用85%的土地、有限的适宜种植面积、仅30%的需求满足率等材料回答这个问题。</p>\n<p>作者还特地检验了替代办法：少吃动物性食物之后，种植条件仍受土壤气候限制；即使扩大水果蔬菜生产，也还没给其他食物找到空间。这种逐条检验后仍不足的走向，能够解释B的怀疑从何而来。</p>\n<p><strong>doubtful是否只是抓住一个消极词，还是由整篇对不同自给路径的检查共同支持？</strong></p>\n<p>后者。吸引人的好处没有被直接当成可实现的结果，几条路径都碰到具体限制，B概括的是这条持续加深的可行性疑问。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[564,1394,30,22]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. tolerant\n\n宽容的\n\n#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果C是主旨，文章中心就应该是“作者对英国食品自给持宽容态度”。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍不同人选择自给的背景 | 先说这件事为什么受到关注 |\n| 第2段 | 呈现主张并询问是否应允许这种选择 | 再说一种主张并追问能否做到 |\n| 第3段 | 谈限制但重点是对选择者保持宽容 | 接着说这条路还不能完全走通 |\n| 第4段 | 说明各方可以自行接受或拒绝某些代价 | 再说要继续走会付出什么代价 |\n| 第5段 | 允许不同路径同时存在，不着重判定能否满足需求 | 接着再看换条路能不能解决 |\n| 第6段 | 以尊重和容纳这种选择收尾 | 最后说算到这里仍然远远不够 |\n\nC的tolerant通常要回答是否愿意容纳、接受某种选择，即使自己并不赞同。文章现在检查的是土地能提供多少食品、还有多少需求未满足，并不是争论是否应允许别人选择自给。\n\n因此，作者语气没有直接攻击支持者，也不能据此认定为tolerant。态度对象在题干里是food self-sufficiency的方案，判断所依据的是一连串能力与需求的比较，不是对持不同意见者的礼貌程度。\n\n**没有用尖锐语言批评支持者，就能把对可行性的怀疑改成宽容吗？**\n\n不能。语气平静与态度宽容不同；本文的判断集中在方案能否做到，C换了被评价的层面。\n\n**判断：C排除。**\n\n---\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**","html":"<h3>C. tolerant</h3>\n<p>宽容的</p>\n<h4>如果 C 是主旨，文章6段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“作者对英国食品自给持宽容态度”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>介绍不同人选择自给的背景</td>\n<td>先说这件事为什么受到关注</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>呈现主张并询问是否应允许这种选择</td>\n<td>再说一种主张并追问能否做到</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>谈限制但重点是对选择者保持宽容</td>\n<td>接着说这条路还不能完全走通</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明各方可以自行接受或拒绝某些代价</td>\n<td>再说要继续走会付出什么代价</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>允许不同路径同时存在，不着重判定能否满足需求</td>\n<td>接着再看换条路能不能解决</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>以尊重和容纳这种选择收尾</td>\n<td>最后说算到这里仍然远远不够</td>\n</tr>\n</tbody></table>\n<p>C的tolerant通常要回答是否愿意容纳、接受某种选择，即使自己并不赞同。文章现在检查的是土地能提供多少食品、还有多少需求未满足，并不是争论是否应允许别人选择自给。</p>\n<p>因此，作者语气没有直接攻击支持者，也不能据此认定为tolerant。态度对象在题干里是food self-sufficiency的方案，判断所依据的是一连串能力与需求的比较，不是对持不同意见者的礼貌程度。</p>\n<p><strong>没有用尖锐语言批评支持者，就能把对可行性的怀疑改成宽容吗？</strong></p>\n<p>不能。语气平静与态度宽容不同；本文的判断集中在方案能否做到，C换了被评价的层面。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[610,1393,58,27]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. optimistic\n\n乐观的\n\n#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果D是主旨，文章中心就应该是“作者看好英国实现食品自给的前景”。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 把全球压力与英国脱欧写成自给的积极机会 | 先说这件事为什么受到关注 |\n| 第2段 | 肯定自给带来的好处并期待目标可实现 | 再说一种主张并追问能否做到 |\n| 第3段 | 把现有土地投入当作继续扩大生产的有利基础 | 接着说这条路还不能完全走通 |\n| 第4段 | 认为所需饮食和生产变化能够顺利推进 | 再说要继续走会付出什么代价 |\n| 第5段 | 将植物性生产视为克服限制的有效新路 | 接着再看换条路能不能解决 |\n| 第6段 | 以供给继续扩大、终能满足需求的前景作结 | 最后说算到这里仍然远远不够 |\n\nD的optimistic容易被开头的opportunity、would boost和Sounds great吸引，但前两处被seen by some、the argument goes明确放在他人的观点里；Sounds great之后紧跟but，作者由此开始检验可行性。\n\n结尾的30%也不是作者在庆祝的充分进展。它与only相接，说明即使采取很强的措施仍有大部分需求无法满足，而且其他食物的空间还没算进去。D既把他人的期待移给作者，也把不足的数字读成了乐观前景。\n\n**局部出现机会和好处，是否足以盖过后面不断强调的条件不足？**\n\n不能。这些好处先以他人观点引入，全文最终落在仍不足以实现的限制上，D反转了整体走向。\n\n**判断：D排除。**\n\n---\n\n**The author’s attitude to food self-sufficiency in the UK is ______.**","html":"<h3>D. optimistic</h3>\n<p>乐观的</p>\n<h4>如果 D 是主旨，文章6段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“作者看好英国实现食品自给的前景”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>把全球压力与英国脱欧写成自给的积极机会</td>\n<td>先说这件事为什么受到关注</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>肯定自给带来的好处并期待目标可实现</td>\n<td>再说一种主张并追问能否做到</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把现有土地投入当作继续扩大生产的有利基础</td>\n<td>接着说这条路还不能完全走通</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>认为所需饮食和生产变化能够顺利推进</td>\n<td>再说要继续走会付出什么代价</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>将植物性生产视为克服限制的有效新路</td>\n<td>接着再看换条路能不能解决</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>以供给继续扩大、终能满足需求的前景作结</td>\n<td>最后说算到这里仍然远远不够</td>\n</tr>\n</tbody></table>\n<p>D的optimistic容易被开头的opportunity、would boost和Sounds great吸引，但前两处被seen by some、the argument goes明确放在他人的观点里；Sounds great之后紧跟but，作者由此开始检验可行性。</p>\n<p>结尾的30%也不是作者在庆祝的充分进展。它与only相接，说明即使采取很强的措施仍有大部分需求无法满足，而且其他食物的空间还没算进去。D既把他人的期待移给作者，也把不足的数字读成了乐观前景。</p>\n<p><strong>局部出现机会和好处，是否足以盖过后面不断强调的条件不足？</strong></p>\n<p>不能。这些好处先以他人观点引入，全文最终落在仍不足以实现的限制上，D反转了整体走向。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[675,1393,30,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题结论\n\n**30. B. doubtful**\n\n这句话就是本文后续做题的主旨底牌：\n\n**doubtful / 怀疑的**\n\n---","html":"<h3>30题结论</h3>\n<p><strong>30. B. doubtful</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>doubtful / 怀疑的</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[187,1139,566,29],[445,1393,43,27],[501,1393,43,25],[564,1394,30,22],[610,1393,58,27],[675,1393,30,26]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查27题：C还是D？\n\n第一遍留下：\n\n- C. most land is used for meat and [xxx] production\n- D. more green fields will be converted for farming\n\n主旨底牌是：\n\n> **doubtful**\n\n也就是：\n\n> 作者怀疑英国食品自给自足的可行性，后面的土地与供给数字用来检查这种设想是否做得到。\n\n我们先把题干和两个选项接起来。\n\nC接回题干，说利兹大学的报告显示多数土地用于肉类和[xxx]生产；D说报告显示更多绿色田地将转作农业用途。第一遍C有85%的土地比例直接对应，D则与后段fewer green fields及更多工厂式生产相联。当时已经注意到D把条件说得更确定，但还没有凭这一点否定未来发生变化的可能。\n\n现在拿主旨来检查。\n\n先看C。全文现在把问题落在自给到底能否实现。报告说大量土地已经与肉奶生产相关，却仍不能满足全部需求，正好给这种怀疑提供第一层限制。C的most land抓住的是报告已经陈述的现有土地用途，能够解释作者为什么接下来还要问改变饮食、扩大种植能否解决问题。\n\n再看D。后面即使把所有适宜土地都用于果蔬，也只能有限增产，最终仍只能满足30%的新鲜农产品需求。作者用这些极端假设说明“即使这样也不够”，并不是在宣布政府或农民已经决定把绿色田地转作农业用途。回看第4段的To become与would need，这些变化是追求目标所需付出的条件与代价，不是报告给出的无条件未来预测。\n\n这并不要求我们证明英国以后永远不会转换田地。D作为答案的问题，是把检查可行性时提出的假设变化，写成报告已经确定会发生的结果。回到题干所问的报告内容，C既保留85%的现状事实，也能放回全文用现有土地限制质疑自给的作用，所以最终选C。\n\n> **27题选C。**\n\n---","html":"<h2>回查27题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. most land is used for meat and [xxx] production</li>\n<li>D. more green fields will be converted for farming</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>doubtful</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>作者怀疑英国食品自给自足的可行性，后面的土地与供给数字用来检查这种设想是否做得到。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>C接回题干，说利兹大学的报告显示多数土地用于肉类和[xxx]生产；D说报告显示更多绿色田地将转作农业用途。第一遍C有85%的土地比例直接对应，D则与后段fewer green fields及更多工厂式生产相联。当时已经注意到D把条件说得更确定，但还没有凭这一点否定未来发生变化的可能。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看C。全文现在把问题落在自给到底能否实现。报告说大量土地已经与肉奶生产相关，却仍不能满足全部需求，正好给这种怀疑提供第一层限制。C的most land抓住的是报告已经陈述的现有土地用途，能够解释作者为什么接下来还要问改变饮食、扩大种植能否解决问题。</p>\n<p>再看D。后面即使把所有适宜土地都用于果蔬，也只能有限增产，最终仍只能满足30%的新鲜农产品需求。作者用这些极端假设说明“即使这样也不够”，并不是在宣布政府或农民已经决定把绿色田地转作农业用途。回看第4段的To become与would need，这些变化是追求目标所需付出的条件与代价，不是报告给出的无条件未来预测。</p>\n<p>这并不要求我们证明英国以后永远不会转换田地。D作为答案的问题，是把检查可行性时提出的假设变化，写成报告已经确定会发生的结果。回到题干所问的报告内容，C既保留85%的现状事实，也能放回全文用现有土地限制质疑自给的作用，所以最终选C。</p>\n<blockquote>\n<p><strong>27题选C。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[[183,555,745,29],[135,591,795,29],[135,626,795,30],[135,662,796,30],[135,698,118,29],[182,734,748,29],[135,770,795,29],[135,806,796,29],[135,842,531,29],[183,878,748,29],[135,913,796,30],[135,949,796,30],[135,985,795,30],[135,1021,797,29],[135,1057,795,29],[135,1093,796,29],[135,1129,293,29],[182,1165,748,29],[135,1201,796,29],[135,1236,795,30],[135,1272,796,29],[135,1308,138,24]],"questionRects":[[187,378,664,30],[215,505,471,29],[216,547,467,30]],"scrollTarget":"auto","meta":{"kind":"review","qid":"27"}},{"section":"最终答案","raw":"## 最终答案：\n\n**26. B**\n\n**27. C**\n\n**28. C**\n\n**29. A**\n\n**30. B**","html":"<h2>最终答案：</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. C</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. A</strong></p>\n<p><strong>30. B</strong></p>\n","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"final"}}],"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>Some people argue that food self-sufficiency in the UK would ______.</strong></p>\n<p>一些人认为，英国实现食品自给自足会带来什么？</p>\n<p>题型：观点细节题</p>\n<h2>27题题干</h2>\n<p><strong>The report by the University of Leeds shows that in the UK ______.</strong></p>\n<p>利兹大学的报告显示英国存在什么情况？</p>\n<p>题型：报告细节题</p>\n<h2>28题题干</h2>\n<p><strong>Crop-growing in the UK is restricted due to ______.</strong></p>\n<p>英国种植作物受到哪一方面的限制？</p>\n<p>题型：原因题</p>\n<h2>29题题干</h2>\n<p><strong>It can be learned from the last paragraph that British people ______.</strong></p>\n<p>从最后一段可以知道英国人在哪一方面存在什么情况？</p>\n<p>题型：段落推断题</p>\n<h2>30题题干</h2>\n<p><strong>The author’s attitude to food self-sufficiency in the UK is ______.</strong></p>\n<p>作者对英国食品自给自足持什么态度？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but；so；Even if；only；before</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>feasible；grave；suitable</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>produce；reduce；grow；meet</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>80 per cent；30 per cent boost；only 30 per cent</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>UK；food；land；production</td>\n</tr>\n</tbody></table>\n<p>With the global population predicted to hit close to 10 billion by 2050, and [xxx] that agricultural production in some regions will need to nearly double to keep pace, food security is increasingly making headlines. In the UK, it has become a big talking point recently too, for a rather [xxx] reason: Brexit.</p>\n<p>Brexit is seen by some as an opportunity to [xxx] a recent trend towards the UK importing food. The country produces only about 60 per cent of the food it eats, down from almost three-quarters in the late 1980s. A move back to self-sufficiency, the argument goes, would boost the farming industry, political [xxx] and even the nation’s health. Sounds great—but how feasible is this vision?</p>\n<p>According to a report on UK food production from the University of Leeds, UK, 85 per cent of the country’s total land area is associated with meat and dairy production. That supplies 80 per cent of what is consumed, so even covering the whole country in [xxx] farms wouldn’t allow us to cover all our meat and dairy needs.</p>\n<p>There are many [xxx] to those figures, but they are still grave. To become much more self-sufficient, the UK would need to [xxx] reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields, and more factory-style production.</p>\n<p>But switching to a mainly plant-based diet wouldn’t help. There is a good reason why the UK is dominated by animal [xxx]: most of its [xxx] doesn’t have the right soil or climate to grow crops on [xxx] basis. Just 25 per cent of the country’s land is suitable for crop-growing, most of which is already occupied by [xxx] fields. Even if we [xxx] all the suitable land to fields of fruit and veg—which would involve taking out all the nature [xxx] and removing thousands of people from their homes—we would achieve only a 30 per cent boost in crop production.</p>\n<p>Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown, so even with the most [xxx] measures we could meet only 30 per cent of our fresh produce needs. That is before we look for the space to grow the [xxx], sugars, seeds and oils that provide us with the vast [xxx] of our current calorie intake.</p>\n<p>With the global population predicted to hit close to 10 billion by 2050, / and [xxx] that agricultural production in some regions will need to nearly double / to keep pace, / food security is increasingly making headlines. / In the UK, it has become a big talking point recently too, / for a rather [xxx] reason: Brexit.</p>\n<p>Brexit is seen by some as an opportunity / to [xxx] a recent trend towards the UK importing food. / The country produces only about 60 per cent of the food it eats, / down from almost three-quarters in the late 1980s. / A move back to self-sufficiency, the argument goes,
