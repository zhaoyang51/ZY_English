现Congress与年度金额，这一预算层次属于全文对资源配置的讨论。调查的避免削减还可以指维持原有项目，并不自动等于受访者提出净扩大预算的主张。主旨帮助我们看清两种材料的分工：作者论证系统需要更多资金，调查证明公众愿多付钱。题干只问调查中多数人的意愿，因此选C。\n\n> **28题选C。**\n\n---","html":"<h2>回查28题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. advocate a bigger budget for the national parks</li>\n<li>C. agree to pay extra for the national parks</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>is in need of a funding increase</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>国家公园系统需要增加资金；全文分别说明资金缺口、投入价值及公众愿意承担额外费用的支持基础。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B接回题干，说多数受访者主张扩大公园预算；C说多数受访者愿意为公园多付钱。第一遍两项都朝资金支持方向走：公园缺钱，纳税人又愿多缴税。不过当时尚未分清“自己愿意付多少”与“要求预算制定者怎样拨款”这两层。</p>\n<p>现在拿主旨来检查。</p>\n<p>全文现在证明公园确实需要增加资金，但这一结论是由维护积压、公共价值和末段金额与客流的比较共同形成的。不能因为作者最终认为需要增加资金，就把这个完整结论提前塞给每一位调查受访者。</p>\n<p>回到第5段原文，调查明确给出的是81%愿在接下来十年pay additional taxes，目的为avoid any cuts。C的agree to pay extra保留这项个人承担费用的意愿，也正好作为全文“增加支持有公众基础”的证据。</p>\n<p>B则把这种意愿换成advocate a bigger budget。末段才出现Congress与年度金额，这一预算层次属于全文对资源配置的讨论。调查的避免削减还可以指维持原有项目，并不自动等于受访者提出净扩大预算的主张。主旨帮助我们看清两种材料的分工：作者论证系统需要更多资金，调查证明公众愿多付钱。题干只问调查中多数人的意愿，因此选C。</p>\n<blockquote>\n<p><strong>28题选C。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[[183,346,741,29],[135,382,793,30],[135,420,698,29],[182,716,742,29],[135,753,795,29],[135,786,795,37],[135,827,795,29],[135,864,766,29],[182,901,749,29],[135,938,796,29],[135,975,795,29],[135,1012,797,29],[135,1049,796,29],[135,1086,795,29],[135,1123,452,29],[182,1159,749,30],[135,1197,794,29],[135,1234,789,29],[135,1271,795,29],[137,1308,531,29]],"questionRects":[[195,632,719,30],[195,674,25,24],[231,716,462,30],[231,759,394,29]],"scrollTarget":"auto","meta":{"kind":"review","qid":"28"}},{"section":"最终答案","raw":"## 最终答案：\n\n**26. D**\n\n**27. A**\n\n**28. C**\n\n**29. B**\n\n**30. D**","html":"<h2>最终答案：</h2>\n<p><strong>26. D</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. B</strong></p>\n<p><strong>30. D</strong></p>\n","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"final"}}],"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>What problem are U.S. national parks faced with?</strong></p>\n<p>美国国家公园面临什么问题？</p>\n<p>题型：现状细节题</p>\n<h2>27题题干</h2>\n<p><strong>Increased privatization of the campgrounds may ______.</strong></p>\n<p>进一步私有化露营地可能造成什么？</p>\n<p>题型：影响题</p>\n<h2>28题题干</h2>\n<p><strong>According to Paragraph 5, most respondents in the survey would ______.</strong></p>\n<p>第5段调查中的大多数受访者愿意怎样做？</p>\n<p>题型：调查细节题</p>\n<h2>29题题干</h2>\n<p><strong>The national parks are valuable in that they ______.</strong></p>\n<p>国家公园为什么具有价值？</p>\n<p>题型：价值细节题</p>\n<h2>30题题干</h2>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<p>从全文可以得出，国家公园系统处于怎样的状况？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>But；Moreover；to avoid；On top of this；Meanwhile</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>right；in crisis；tiny；great value</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>hand over；undercut；pay；protect；increased</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>maintenance backlog；5%；81%；flat；more than 50%</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>parks；funding；visitors；value</td>\n</tr>\n</tbody></table>\n<p>It’s easy to dismiss as [xxx] the federal government’s ideas for [xxx] the [xxx] funding gap of our national parks. Can anyone really think it’s a good idea to allow Amazon deliveries to your tent in Yosemite or food trucks to line up under the redwood trees at Sequoia National Park?</p>\n<p>But the government is right about one thing: U.S. national parks are in crisis. [xxx], they have a maintenance backlog of more than $12 billion. Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.</p>\n<p>But privatizing and commercializing the campgrounds would not be a cure-all. Campgrounds are a tiny [xxx] of the overall infrastructure backlog, and businesses in the parks hand over, on average, only about 5% of their [xxx] to the National Park Service.</p>\n<p>Moreover, increased privatization would certainly undercut one of the major reasons why 300 million visitors come to the parks each year: to enjoy nature and get a break from the commercial [xxx] that [xxx] daily life.</p>\n<p>The real problem is that the parks have been [xxx] starved of funding. An economic survey of 700 U.S. taxpayers found that people would be willing to pay a significant amount of money to make sure the parks and their programs are kept [xxx]. Some 81% of respondents said they would be willing to pay additional taxes for the next 10 years to avoid any cuts to the national parks.</p>\n<p>The national parks provide great value to U.S. residents both as places to escape and as symbols of nature. On top of this, they produce value from their [xxx] educational programs, their positive impact on the climate through carbon [xxx], their contribution to our [xxx] and artistic life, and of course through tourism. The parks also help keep America’s past alive, working with thousands of local [xxx] around the country to protect historical sites and to bring the stories of these places to life.</p>\n<p>The parks do all this on a [xxx]. Congress [xxx] only $3 billion a year to the national park system—an amount that has been flat since 2001 (in [xxx] dollars) with the exception of a [xxx] boost in 2009. Meanwhile, the number of annual visitors has increased by more than 50% since 1980, and now stands at 330 million visitors per year.</p>\n<p>It’s easy to dismiss as [xxx] the federal government’s ideas / for [xxx] the [xxx] funding gap of our national parks. / Can anyone really think it’s a good idea / to allow Amazon deliveries to your tent in Yosemite / or food trucks to line up under the redwood trees at Sequoia National Park?</p>\n<p>But the government is right about one thing: / U.S. national parks are in crisis. / [xxx], they have a maintenance backlog of more than $12 billion. / Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.</p>\n<p>But privatizing and commercializing the campgrounds would not be a cure-all. / Campgrounds are a tiny [xxx] of the overall infrastructure backlog, / and businesses in the parks hand over, on average, / only about 5% of their [xxx] to the National Park Service.</p>\n<p>Moreover, increased privatization would certainly undercut one of the major reasons / why 300 million visitors come to the parks each year: / to enjoy nature and get a break from the commercial [xxx] / that [xxx] daily life.</p>\n<p>The real problem is that the parks have been [xxx] starved of funding. / An economic survey of 700 U.S. taxpayers found / that people would be willing to pay a significant amount of money / to make sure the parks and their programs are kept [xxx]. / Some 81% of respondents said / they would be willing to pay additional taxes for the next 10 years / to avoid any cuts to the national parks.</p>\n<p>The national parks provide great value to U.S. residents / both as places to escape and as symbols of nature. / On top of this, they produce value from their [xxx] educational programs, / their positive impact on the climate through carbon [xxx], / their contribution to our [xxx] and artistic life, / and of course through tourism. / The parks also help keep America’s past alive, / working with thousands of local [xxx] around the country / to protect historical sites and to bring the stories of these places to life.</p>\n<p>The parks do all this on a [xxx]. / Congress [xxx] only $3 billion a year to the national park system— / an amount that has been flat since 2001 (in [xxx] dollars) / with the exception of a [xxx] boost in 2009. / Meanwhile, the number of annual visitors has increased by more than 50% since 1980, / and now stands at 330 million visitors per year.</p>\n<p>It’s 容易不予考虑 as [xxx] 联邦政府的想法 / for [xxx] the [xxx] 经费缺口 of our 国家公园. / Can anyone really think it’s 好主意 / to allow 亚马逊送货 to 你的帐篷 in Yosemite / or 餐车 to line up under the 红杉树 at Sequoia National Park?</p>\n<p>But the government is right about one thing: / U.S. national parks are 处于危机. / [xxx], they have a 积压维护工作 of more than $12 billion. / 道路, trails, restrooms, visitor centers and 其他基础设施 正在破败.</p>\n<p>But 私有化与商业化 the campgrounds would 并非万能办法. / Campgrounds are 很小的 [xxx] of the overall infrastructure backlog, / and businesses in the parks 上交, on average, / only about 5% of their [xxx] to the National Park Service.</p>\n<p>Moreover, 进一步私有化 would certainly undercut one of the major reasons / why 300 million visitors come to the parks each year: / to 享受自然 and 暂时摆脱 from the commercial [xxx] / that [xxx] 日常生活.</p>\n<p>The real problem is that the parks have been [xxx] 缺乏资金. / An economic survey of 七百名美国纳税人 found / that people would be willing to pay a significant amount of money / to make sure the parks and their programs are kept [xxx]. / Some 百分之八十一的受访者 said / they would be willing to 缴纳额外税款 for 接下来十年 / to 避免任何削减 to the national parks.</p>\n<p>The national parks provide 重要价值 to U.S. residents / both as places to escape and as 自然的象征. / On top of this, they produce value from their [xxx] 教育项目, / their 积极影响 on the climate through carbon [xxx], / their contribution to our [xxx] and 艺术生活, / and of course 通过旅游. / The parks also help keep 美国历史 alive, / working with thousands of local [xxx] around the country / to 保护历史遗址 and to bring 故事 of these places to life.</p>\n<p>公园完成这一切 on a [xxx]. / Congress [xxx] only 三十亿美元 每年 to the national park system— / an amount that 一直持平 since 2001 (in [xxx] dollars) / 除外 of a [xxx] boost in 2009. / Meanwhile, 年度游客数 已经增加 by 超过百分之五十 since 1980, / and now stands at 三亿三千万游客 per year.</p>\n<p>1、容易不予考虑、联邦政府的想法、经费缺口、国家公园、好主意、亚马逊送货、你的帐篷、餐车、红杉树。</p>\n<p>2、处于危机、积压维护工作、道路、其他基础设施、正在破败。</p>\n<p>3、私有化与商业化、并非万能办法、很小的、上交。</p>\n<p>4、进一步私有化、享受自然、暂时摆脱、日常生活。</p>\n<p>5、缺乏资金、七百名美国纳税人、百分之八十一的受访者、缴纳额外税款、接下来十年、避免任何削减。</p>\n<p>6、重要价值、自然的象征、教育项目、积极影响、艺术生活、通过旅游、美国历史、保护历史遗址、故事。</p>\n<p>7、公园完成这一切、三十亿美元、每年、一直持平、除外、年度游客数、已经增加、超过百分之五十、三亿三千万游客。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与国家公园的经费有关；开头似乎看到联邦政府的想法、经费缺口、国家公园、亚马逊送货、餐车；中间又出现处于危机、积压维护工作、并非万能办法、享受自然、缴纳额外税款、保护历史遗址；结尾还看到三十亿美元、一直持平、年度游客数、已经增加。</p>\n<p>到这里还不能自然地说清楚：商业化能补多少资金，游客体验和纳税人意愿怎样接。粗读时只要能判断“这篇大概在讲公园需要的钱及有关办法”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先记住维护、商业化、缴税和年度金额分别出现在哪里。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<h2>26题</h2>\n<blockquote>\n<p>What problem are U.S. national parks faced with?\n美国国家公园面临什么问题？</p>\n</blockquote>\n<p>题干点出U.S. national parks，第2段同样写U.S. national parks are in crisis。先完整读这一段，看crisis具体指什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But the government is right about one thing: U.S. national parks are in crisis. [xxx], they have a maintenance backlog of more than $12 billion. Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.</p>\n<p>开始精读：</p>\n<p>But the government is right about one thing: / U.S. national parks are in crisis. / [xxx], they have a maintenance backlog of more than $12 billion. / Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.</p>\n<p>但政府在一件事上是对的： / 美国国家公园正处于危机。 / [xxx]，它们有超过一百二十亿美元的积压维护工作。 / 道路、小径、洗手间、游客中心及其他基础设施正在破败。</p>\n</blockquote>\n<p>冒号后的crisis是总说，后两句用积压维护和设施破败解释它。判断选项必须落实到这些具体对象，不能只挑任何听起来像公园困难的说法。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. Decline of business [xxx].</h3>\n<blockquote>\n<p>企业[xxx]下降</p>\n</blockquote>\n<p>把A接回题干，它说的是：国家公园面临的问题是企业某项[xxx]下降。</p>\n<p>A的Decline of business让人想到下一段businesses，所以回到第3段完整精读，看看企业的数字是在描述下降，还是说明上交比例。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But privatizing and commercializing the campgrounds would not be a cure-all. Campgrounds are a tiny [xxx] of the overall infrastructure backlog, and businesses in the parks hand over, on average, only about 5% of their [xxx] to the National Park Service.</p>\n<p>开始精读：</p>\n<p>But privatizing and commercializing the campgrounds would not be a cure-all. / Campgrounds are a tiny [xxx] of the overall infrastructure backlog, / and businesses in the parks hand over, on average, / only about 5% of their [xxx] to the National Park Service.</p>\n<p>但将露营地私有化和商业化并非万能办法。 / 露营地只占整个基础设施积压问题的很小[xxx]， / 而公园里的企业平均上交的， / 只有其[xxx]的大约百分之五，交给国家公园管理局。</p>\n</blockquote>\n<p>读完这一段，再把Decline of business和businesses放在一起：</p>\n<blockquote>\n<p>businesses in the parks hand over, on average, only about 5% of their [xxx] to the National Park Service.</p>\n</blockquote>\n<p>businesses后面接hand over，Decline of business却把企业的某项指标写成下降。only about 5%给的是上交管理局的份额，没有提供以前是多少、现在又是多少，因此不能用比例小来证明随时间下降。</p>\n<p>第2段明确谈公园设施的维护，第3段的企业数字则用于检查一种解决办法能贡献多少资金。A把讨论中的资金来源换成了问题主体，又将份额换成变化趋势；[xxx]不展开也不能补出这两个关系。</p>\n<p><strong>企业只上交约5%，能证明企业某项指标在下降吗？</strong></p>\n<p>不能。上交比例与时间变化不同，企业也不是第2段设施破败的主体。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. Inadequate commercialization.</h3>\n<blockquote>\n<p>商业化不足</p>\n</blockquote>\n<p>把B接回题干，它说的是：国家公园的问题是商业化程度不够。</p>\n<p>B的Inadequate commercialization与刚读到的commercializing相关，所以回到第3段段首，比较它是问题诊断还是拟议办法。</p>\n<blockquote>\n<p>But privatizing and commercializing the campgrounds would not be a cure-all.</p>\n</blockquote>\n<p>commercializing是政府方案所涉及的动作，Inadequate commercialization却把它改成公园问题的根源。原句说将露营地商业化并非万能办法，不是在说公园之所以出现危机，是因为商业活动还太少。</p>\n<p>前面的维护积压是已经发生的现状，而商业化是拿来检验的解决路径。把某种被讨论的办法反推成当前缺少它，就是把“怎么办”与“出了什么问题”交换。</p>\n<p><strong>文章讨论商业化办法，就等于已经把商业化不足诊断为问题吗？</strong></p>\n<p>不等于。原文检验一种方案的作用，B把它改成了问题本身。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. Lack of transportation services.</h3>\n<blockquote>\n<p>缺少交通运输服务</p>\n</blockquote>\n<p>把C接回题干，它说的是：国家公园缺乏运送游客等交通服务。</p>\n<p>C的Lack of transportation services让人想到第2段Roads，所以回看它与哪些设施并列，以及共同的谓语是什么。</p>\n<blockquote>\n<p>Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.</p>\n</blockquote>\n<p>Roads与洗手间、游客中心等并列，共同接are crumbling；Lack of transportation services却把道路的维护状态改成运输服务是否存在。道路属于设施，即使服务照常运行，道路也可能破败，二者不能直接等同。</p>\n<p>原句并没有报告车辆、班次或运送服务不足。C抓住道路这一项便缩成交通，同时又从“已有设施坏了”跳到“缺少服务”，对象和问题性质都变了。</p>\n<p><strong>道路正在破败，可以直接改成交通服务缺乏吗？</strong></p>\n<p>不能。设施状态与服务供给是两层，C没有保留crumbling的具体问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. Poorly maintained infrastructure.</h3>\n<blockquote>\n<p>基础设施维护不善</p>\n</blockquote>\n<p>把D接回题干，它说的是：国家公园的基础设施没有得到足够维护。</p>\n<p>D的Poorly maintained infrastructure对应maintenance backlog，所以将积压维护与后句设施破败放在一起看。</p>\n<blockquote>\n<p>they have a maintenance backlog of more than $12 billion.</p>\n</blockquote>\n<blockquote>\n<p>Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.</p>\n</blockquote>\n<p>maintenance backlog说明维护工作积压，Poorly maintained infrastructure把这种欠缺落实为基础设施维护不善；are crumbling又给出积压造成的可见状态。D同时接住维护动作与设施对象，范围包括道路及其他列举设施。</p>\n<p>一百二十亿美元在这里是维护积压的规模，不是企业亏损或游客交通费。D不必证明每一座公园每一项设施都坏了，只概括国家公园系统被指出的维护问题。</p>\n<p><strong>D是否把积压维护的原因线索与设施破败的状态接在同一对象上？</strong></p>\n<p>能。两句都围绕基础设施维护不足，D保留了这一关系。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>D保留。A把份额当下降，B把办法当问题，C把设施状态改成交通服务缺乏。</p>\n<h2>27题</h2>\n<blockquote>\n<p>Increased privatization of the campgrounds may ______.\n进一步私有化露营地可能造成什么？</p>\n</blockquote>\n<p>题干中的privatization在第4段直接重复，完整读这一段。undercut后面不是一个收入指标，而是游客到访的重要原因。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Moreover, increased privatization would certainly undercut one of the major reasons why 300 million visitors come to the parks each year: to enjoy nature and get a break from the commercial [xxx] that [xxx] daily life.</p>\n<p>开始精读：</p>\n<p>Moreover, increased privatization would certainly undercut one of the major reasons / why 300 million visitors come to the parks each year: / to enjoy nature and get a break from the commercial [xxx] / that [xxx] daily life.</p>\n<p>而且，进一步私有化肯定会削弱一个主要原因， / 也就是每年三亿游客到公园来的原因： / 享受自然并暂时摆脱商业[xxx]， / 它[xxx]日常生活。</p>\n</blockquote>\n<p>冒号后解释游客为什么来：享受自然，并暂时摆脱日常商业环境。比较选项时先守住受到影响的是谁、想得到什么。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. spoil visitor experience</h3>\n<blockquote>\n<p>损害游客体验</p>\n</blockquote>\n<p>把A接回题干，它说的是：进一步私有化可能让游客无法充分得到期待的游园体验。</p>\n<p>A的spoil visitor experience对应enjoy nature，所以回到undercut后面的到访原因，看私有化会怎样作用于这种期待。</p>\n<blockquote>\n<p>increased privatization would certainly undercut one of the major reasons</p>\n</blockquote>\n<blockquote>\n<p>to enjoy nature and get a break from the commercial [xxx]</p>\n</blockquote>\n<p>enjoy nature和暂时摆脱商业环境说明游客希望获得的体验，spoil visitor experience把undercut对这种目的的破坏概括出来。既然游客来这里是为了离开日常商业干扰，增加私有商业活动就可能削弱到访理由。</p>\n<p>A没有夸大成公园彻底失去自然或所有游客都会离开。它保留“对体验造成不利影响”这一程度，正好对应undercut，而不是把访客数当成已发生下降。</p>\n<p><strong>A是否需要证明游客已经减少，才能概括体验受到损害？</strong></p>\n<p>不是。A无需证明游客减少，原文直接说明到访目的被削弱，体验受损与实际客流下降是不同结论。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. help preserve nature</h3>\n<blockquote>\n<p>有助于保护自然</p>\n</blockquote>\n<p>把B接回题干，它说的是：进一步私有化会帮助保护自然。</p>\n<p>B的help preserve nature与enjoy nature都含nature，所以回看自然在这句里是被保护的对象，还是游客想享受的东西。</p>\n<blockquote>\n<p>increased privatization would certainly undercut one of the major reasons</p>\n</blockquote>\n<blockquote>\n<p>to enjoy nature</p>\n</blockquote>\n<p>enjoy nature写游客的目的，help preserve nature却改成私有化产生的保护效果。原文把私有化与undercut相接，方向是削弱到访理由，并没有说它带来生态保护改善。</p>\n<p>希望享受自然的人到公园，不等于任何增加营地商业活动的办法都能保护自然。B把游客想获得的东西，移作措施会带来的正面结果，既改了作用关系，也改了评价方向。</p>\n<p><strong>游客为了自然而来，就能推出私有化有助于保护自然吗？</strong></p>\n<p>不能。游客目的不是方案成效，原句给出的作用方向反而是undercut。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. bring [xxx] pressure</h3>\n<blockquote>\n<p>带来[xxx]压力</p>\n</blockquote>\n<p>把C接回题干，它说的是：进一步私有化会引发某种压力。</p>\n<p>C的bring在说措施带来什么，所以回到undercut one of the major reasons，确认被直接影响的对象是什么。</p>\n<blockquote>\n<p>undercut one of the major reasons why 300 million visitors come to the parks each year:</p>\n</blockquote>\n<p>undercut one of the major reasons的对象是游客到访理由，bring后面pressure则把影响写成某种压力。[xxx]没有展开，不能替它想出经营或其他压力；即使只看可见部分，原句也没有给出谁承受压力、压力怎样产生。</p>\n<p>三亿游客是解释这项理由涉及的人群规模，不是说游客拥挤压垮运营，更不是私有化造成压力的量化结果。C用笼统负面词替换了游客目的受损的具体关系。</p>\n<p><strong>原句有负面影响，就能任选一种“压力”作为它的改写吗？</strong></p>\n<p>不能。负面方向相同还不够，受影响对象与机制必须对应，C没有接住游客到访理由。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. boost visits to parks</h3>\n<blockquote>\n<p>增加公园到访量</p>\n</blockquote>\n<p>把D接回题干，它说的是：进一步私有化将吸引更多人到访公园。</p>\n<p>D的boost visits对应第4段undercut及visitors，所以把作用动词与后面的三亿游客放在一起看。</p>\n<blockquote>\n<p>increased privatization would certainly undercut one of the major reasons why 300 million visitors come to the parks each year:</p>\n</blockquote>\n<p>undercut是削弱游客到访理由，boost visits却把这种作用改成增加客流。三亿说明每年已有多少游客因这些理由而来，不是私有化后新增的游客，也没有前后数据证明它吸引了更多人。</p>\n<p>不能因为文中紧挨着私有化写了一个很大的到访数字，就把二者接成增长因果。原句的动词已经把关系规定为削弱，而不是促进。</p>\n<p><strong>三亿游客紧跟私有化出现，就说明私有化增加了到访吗？</strong></p>\n<p>不能。数字给出到访规模，undercut才规定措施的作用方向；D反转了它。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A保留。B把游客目的变成保护成效，C泛化为压力，D反转了作用方向。</p>\n<h2>28题</h2>\n<blockquote>\n<p>According to Paragraph 5, most respondents in the survey would ______.\n第5段调查中的大多数受访者愿意怎样做？</p>\n</blockquote>\n<p>题干指定Paragraph 5，完整读第5段。注意受访者是taxpayers，再看81%后面的they愿意承担什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The real problem is that the parks have been [xxx] starved of funding. An economic survey of 700 U.S. taxpayers found that people would be willing to pay a significant amount of money to make sure the parks and their programs are kept [xxx]. Some 81% of respondents said they would be willing to pay additional taxes for the next 10 years to avoid any cuts to the national parks.</p>\n<p>开始精读：</p>\n<p>The real problem is that the parks have been [xxx] starved of funding. / An economic survey of 700 U.S. taxpayers found / that people would be willing to pay a significant amount of money / to make sure the parks and their programs are kept [xxx]. / Some 81% of respondents said / they would be willing to pay additional taxes for the next 10 years / to avoid any cuts to the national parks.</p>\n<p>真正的问题是公园一直[xxx]地缺乏资金。 / 一项对七百名美国纳税人的经济调查发现， / 人们愿意支付相当一笔钱， / 以确保公园及其项目保持[xxx]。 / 大约百分之八十一的受访者说， / 他们愿意在接下来十年缴纳额外税款， / 以避免国家公园遭到任何削减。</p>\n</blockquote>\n<p>调查先给总说willing to pay，后用81%及additional taxes落实多数人的具体意愿。to avoid说明多付钱的目的，不能把目的与受访者表达的动作混在一起。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. go to the national parks on a regular basis</h3>\n<blockquote>\n<p>定期去国家公园</p>\n</blockquote>\n<p>把A接回题干，它说的是：多数受访者愿意经常到公园游览。</p>\n<p>A的on a regular basis涉及频率，所以回到for the next 10 years，看时间接的是到访还是缴税。</p>\n<blockquote>\n<p>they would be willing to pay additional taxes for the next 10 years</p>\n</blockquote>\n<p>for the next 10 years限定愿意多缴税的持续期间，on a regular basis却把这种持续性改成定期到访。原句动作是pay taxes，不是go to parks；受访者被标为纳税人，也不能自动当成规律到访的游客。</p>\n<p>他们愿意支持公园，并不要求他们必须经常去。A把对公共项目的支持方式换成个人出游习惯，又把十年时段换成出游频率，具体行为没有对应。</p>\n<p><strong>愿意十年多缴税，能读成愿意定期游园吗？</strong></p>\n<p>不能。时间修饰的动作是pay additional taxes，A换成了go to parks。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. advocate a bigger budget for the national parks</h3>\n<blockquote>\n<p>主张给国家公园更大预算</p>\n</blockquote>\n<p>把B接回题干，它说的是：多数受访者会倡议扩大公园预算。</p>\n<p>B的a bigger budget与starved of funding有关，所以把段首缺钱判断和调查的缴税意愿一起看，辨明二者怎样连接。</p>\n<blockquote>\n<p>The real problem is that the parks have been [xxx] starved of funding.</p>\n</blockquote>\n<blockquote>\n<p>they would be willing to pay additional taxes for the next 10 years to avoid any cuts to the national parks.</p>\n</blockquote>\n<p>starved of funding指出公园缺钱，a bigger budget朝增加资金的方向走；受访者愿意多缴税，也会让人想到让公园得到更多支持。因此B与本段的问题和资金方向确实相接。</p>\n<p>但原文先是作者诊断，随后才是纳税人的回答。愿意自己多付钱，与向预算制定者提出扩大拨款主张，行动主体与决策层次尚有距离。第一遍先留下B、C，等看完全文怎么谈公园价值和实际拨款，再确认能否把两层压成同一个调查结论。</p>\n<p><strong>缺钱背景下愿意多缴税，就已明确等于受访者要求扩大政府预算吗？</strong></p>\n<p>还不能。资金方向相近，但个人付钱与预算主张的关系还没完全拉开，B先与C保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. agree to pay extra for the national parks</h3>\n<blockquote>\n<p>同意为国家公园多付钱</p>\n</blockquote>\n<p>把C接回题干，它说的是：多数受访者愿意额外付钱支持公园。</p>\n<p>C的agree to pay extra对应pay additional taxes，所以回到81%及would be willing，核对人数范围与意愿强度。</p>\n<blockquote>\n<p>Some 81% of respondents said they would be willing to pay additional taxes for the next 10 years to avoid any cuts to the national parks.</p>\n</blockquote>\n<p>pay additional taxes是额外缴税，agree to pay extra用更概括的“多付钱”保留同一动作。81%显然超过一半，能支持题干的most；would be willing又与agree在意愿层面相接，并不是已经完成付款。</p>\n<p>C没有把付钱方式改成提高门票，也没有要求受访者亲自控制政府拨款。它只概括调查直接问到的承担额外费用这一层，税款的具体形式仍包含在pay extra之内。</p>\n<p><strong>C是否保留了多数人的意愿，而没有夸大成已经缴纳或决定预算？</strong></p>\n<p>能。81%支持most，willing to pay对应agree to pay extra，主体与动作都相同。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. support the national parks’ [xxx] reforms</h3>\n<blockquote>\n<p>支持国家公园的[xxx]改革</p>\n</blockquote>\n<p>把D接回题干，它说的是：多数受访者支持公园某些改革。</p>\n<p>D的support涉及态度，所以回到avoid any cuts，比较他们愿意支持的目标是避免削减，还是某项改革方案。</p>\n<blockquote>\n<p>to make sure the parks and their programs are kept [xxx].</p>\n</blockquote>\n<blockquote>\n<p>to avoid any cuts to the national parks.</p>\n</blockquote>\n<p>avoid any cuts说明付钱目的在避免公园被削减，support后面reforms却把态度对象改成某些改革。维持公园与项目，并不等于赞成任何改造其管理或营地商业化的方案。</p>\n<p>原文没有把这些纳税人对一项改革的回答列出来。[xxx]修饰reforms的具体性质虽未知，reforms本身仍不能被“避免削减”替代。D把支持公园这个机构与支持改变它的方案混为一谈。</p>\n<p><strong>支持公园继续得到保障，就等于支持某项公园改革吗？</strong></p>\n<p>不等于。态度对象不同，避免削减的目标没有指定改革方案。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>B、C保留。两项都接到资金支持，但B将个人缴税意愿推进成预算主张，需放回全文再查。</p>\n<h2>29题</h2>\n<blockquote>\n<p>The national parks are valuable in that they ______.\n国家公园为什么具有价值？</p>\n</blockquote>\n<p>看到题干的valuable，我记得粗读时好像在后面读到过“保护历史遗址”。先回到这一片段所在的第6段，从头读清公园具体提供哪些价值。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The national parks provide great value to U.S. residents both as places to escape and as symbols of nature. On top of this, they produce value from their [xxx] educational programs, their positive impact on the climate through carbon [xxx], their contribution to our [xxx] and artistic life, and of course through tourism. The parks also help keep America’s past alive, working with thousands of local [xxx] around the country to protect historical sites and to bring the stories of these places to life.</p>\n<p>开始精读：</p>\n<p>The national parks provide great value to U.S. residents / both as places to escape and as symbols of nature. / On top of this, they produce value from their [xxx] educational programs, / their positive impact on the climate through carbon [xxx], / their contribution to our [xxx] and artistic life, / and of course through tourism. / The parks also help keep America’s past alive, / working with thousands of local [xxx] around the country / to protect historical sites and to bring the stories of these places to life.</p>\n<p>国家公园为美国居民提供重要价值， / 既是暂时远离日常生活的地方，也是自然的象征。 / 此外，它们通过[xxx]教育项目产生价值， / 通过碳[xxx]对气候产生积极影响， / 对我们的[xxx]及艺术生活作出贡献， / 当然也通过旅游产生价值。 / 公园还帮助保持美国历史的鲜活， / 与全国数千个地方[xxx]合作， / 保护历史遗址，并使这些地方的故事鲜活起来。</p>\n</blockquote>\n<p>本段列举自然、教育、气候、艺术与旅游价值，最后再谈历史保护。选项即使命中某一名词，也要把公园对它做的动作接对。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. lead the way in [xxx]</h3>\n<blockquote>\n<p>在[xxx]方面发挥引领作用</p>\n</blockquote>\n<p>把A接回题干，它说的是：公园在某个领域处于引领地位。</p>\n<p>A的lead the way是在说引领，所以回到through tourism及前面的produce value，核对原文是否作了领先比较。</p>\n<blockquote>\n<p>they produce value from their [xxx] educational programs,</p>\n</blockquote>\n<blockquote>\n<p>and of course through tourism.</p>\n</blockquote>\n<p>through tourism说公园通过旅游产生价值，lead the way却要求它在某领域带头或领先。贡献价值是有没有作用，领先是与其他参与者相比位置如何；原句没有拿公园和别的机构作这种排序。</p>\n<p>即使[xxx]指的领域就是列举中的某一个，也不能把“有价值”自动升级成“居于引领地位”。A的问题在可见谓语lead the way所增加的比较程度，而不是缺词是否能猜对。</p>\n<p><strong>一个机构通过某领域产生价值，就一定在该领域领先吗？</strong></p>\n<p>不能。贡献与领先不是同一程度，A加了原句没有作出的地位比较。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. have historical significance</h3>\n<blockquote>\n<p>具有历史意义</p>\n</blockquote>\n<p>把B接回题干，它说的是：公园在保存与呈现历史方面有重要作用。</p>\n<p>B的historical significance对应protect historical sites，所以将保护遗址与后面的讲活故事一起看。</p>\n<blockquote>\n<p>The parks also help keep America’s past alive,</p>\n</blockquote>\n<blockquote>\n<p>to protect historical sites and to bring the stories of these places to life.</p>\n</blockquote>\n<p>protect historical sites写保存历史地点，historical significance概括公园由此具备的历史价值。keep America’s past alive与bring the stories to life进一步说明不只是保留物理地点，还让过去与故事继续被认识。</p>\n<p>B没有偷换成“所有公园本身都是古迹”，也没有给公园成立时间下判断。它把原句中的保护与呈现作用概括为历史意义，保留的是机构的价值而非每个地点的年代。</p>\n<p><strong>B需要证明每座公园本身都很古老，才能成立吗？</strong></p>\n<p>不是。B无需证明每座公园古老，保护遗址并呈现美国历史已经构成历史价值，B概括的是这种作用。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. sponsor research on climate</h3>\n<blockquote>\n<p>资助气候研究</p>\n</blockquote>\n<p>把C接回题干，它说的是：公园通过给气候研究提供资金体现价值。</p>\n<p>C的sponsor research on climate与positive impact on the climate都含climate，所以看气候前后的动作是否相同。</p>\n<blockquote>\n<p>their positive impact on the climate through carbon [xxx],</p>\n</blockquote>\n<p>positive impact on the climate讲对气候产生积极影响，sponsor research on climate却改成出资支持研究。through carbon [xxx]给的是产生影响的一种途径，不是资助行为；[xxx]不懂也不能凭climate补出研究机构和经费。</p>\n<p>教育项目在前一项，气候影响在后一项，二者由并列结构分开。C把可能相近的教育、科学话题拼成“资助气候研究”，行动和对象均超出原句。</p>\n<p><strong>对气候有积极影响，能直接换成资助关于气候的研究吗？</strong></p>\n<p>不能。产生环境作用与出资支持研究是不同动作，原文没有这笔资助关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. provide an income for the locals</h3>\n<blockquote>\n<p>为当地人提供收入</p>\n</blockquote>\n<p>把D接回题干，它说的是：公园的价值在于给当地居民带来收入。</p>\n<p>D的income for the locals与段末local相关，所以回看working with及其后to protect，确认地方对象在这里做什么。</p>\n<blockquote>\n<p>working with thousands of local [xxx] around the country to protect historical sites</p>\n</blockquote>\n<p>local修饰公园合作的某些[xxx]，income for the locals却把它变成领取收入的当地居民。working with接的是合作关系，to protect说明合作目的是保护历史遗址，并没有给出收入支付或获利分配。</p>\n<p>旅游在现实中可能带来地方收入，但文章这里只说公园通过旅游产生价值，未把这项价值进一步指定给当地人的收入。D把现实上可能的效应当成该段已经陈述的具体关系，又借local重复掩盖了角色变化。</p>\n<p><strong>与地方对象合作保护遗址，是否已经等于给当地居民提供收入？</strong></p>\n<p>不等于。合作方与收入获得者是不同角色，原句明确的目的在历史保护。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。A加了领先程度，C把气候作用换成研究资助，D把地方合作改成收入分配。</p>\n<h2>30题</h2>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<p>从全文可以得出，国家公园系统处于怎样的状况？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>is able to cope with staff shortages</strong></p>\n<p>能应对人员短缺</p>\n<p>B. <strong>is able to meet visitors’ demands</strong></p>\n<p>能满足游客需求</p>\n<p>C. <strong>is in need of a new pricing policy</strong></p>\n<p>需要新的定价政策</p>\n<p>D. <strong>is in need of a funding increase</strong></p>\n<p>需要增加资金</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<p>前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It’s easy to dismiss as [xxx] the federal government’s ideas for [xxx] the [xxx] funding gap of our national parks. Can anyone really think it’s a good idea to allow Amazon deliveries to your tent in Yosemite or food trucks to line up under the redwood trees at Sequoia National Park?</p>\n<p>开始精读：</p>\n<p>It’s easy to dismiss as [xxx] the federal government’s ideas / for [xxx] the [xxx] funding gap of our national parks. / Can anyone really think it’s a good idea / to allow Amazon deliveries to your tent in Yosemite / or food trucks to line up under the redwood trees at Sequoia National Park?</p>\n<p>人们很容易把联邦政府的想法视为[xxx]， / 这些想法是为了[xxx]我们国家公园的[xxx]经费缺口。 / 有人真会认为这是好主意吗： / 让亚马逊将货送到约塞米蒂的帐篷， / 或让餐车在红杉国家公园的红杉树下排队？</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The parks do all this on a [xxx]. Congress [xxx] only $3 billion a year to the national park system—an amount that has been flat since 2001 (in [xxx] dollars) with the exception of a [xxx] boost in 2009. Meanwhile, the number of annual visitors has increased by more than 50% since 1980, and now stands at 330 million visitors per year.</p>\n<p>开始精读：</p>\n<p>The parks do all this on a [xxx]. / Congress [xxx] only $3 billion a year to the national park system— / an amount that has been flat since 2001 (in [xxx] dollars) / with the exception of a [xxx] boost in 2009. / Meanwhile, the number of annual visitors has increased by more than 50% since 1980, / and now stands at 330 million visitors per year.</p>\n<p>公园以[xxx]完成所有这些事情。 / 国会每年仅向国家公园系统[xxx]三十亿美元—— / 这个数额自二〇〇一年以来持平，以[xxx]美元计， / 二〇〇九年的一次[xxx]增加除外。 / 与此同时，自一九八〇年以来，年度游客数增加了超过百分之五十， / 现在达到每年三亿三千万人次。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>以送货和餐车的例子质疑政府给国家公园补经费的办法</td>\n<td>先说一种办法为什么让人起疑</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>承认公园确有危机，用积压维护和破败设施说明现状</td>\n<td>再承认要解决的问题确实存在</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>检验营地商业化的资金作用，指出范围小且上交份额有限</td>\n<td>接着说这个办法能起的作用有限</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再指出私有化会损害游客亲近自然、暂离商业生活的目的</td>\n<td>再说这样做还会损害原有好处</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>把问题落到资金不足，并用纳税人愿意多付税展示支持基础</td>\n<td>接着说真正缺什么以及谁愿支持</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>列举公园在自然、教育、气候、艺术、旅游与历史保护上的价值</td>\n<td>再说这件事本身值得得到支持</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>将长期持平的年度金额与持续增长的游客数量并列，呈现资源与负担的距离</td>\n<td>最后说现有投入与实际需要不相称</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<h3>A. is able to cope with staff shortages</h3>\n<p>能应对人员短缺</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“国家公园能应对人员短缺”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出补经费办法并转向人员问题</td>\n<td>先说一种办法为什么让人起疑</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>列举缺人但仍能应对的现状</td>\n<td>再承认要解决的问题确实存在</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明营地经营怎样补足工作人员</td>\n<td>接着说这个办法能起的作用有限</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明公园如何在缺人时维持游客体验</td>\n<td>再说这样做还会损害原有好处</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用公众支持证明能够解决缺人</td>\n<td>接着说真正缺什么以及谁愿支持</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>列举少量员工仍完成的工作</td>\n<td>再说这件事本身值得得到支持</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>以人员短缺已被妥善应对收尾</td>\n<td>最后说现有投入与实际需要不相称</td>\n</tr>\n</tbody></table>\n<p>A的staff shortages要求全文讨论员工不足及应对能力。第2段设施维护积压不等于已经诊断缺人；最后的金额和游客数也没有给员工数量，更没有证明公园已克服人员短缺。</p>\n<p>公园能够产生多种价值，并不意味着它有能力处理所有运营问题。文章恰在价值之外强调资金与维护困难，A用一个具体但未建立的人员问题替代了经费问题，并把困难改成已能应对。</p>\n<p><strong>公园提供很多服务，就能证明它已经有能力应对员工不足吗？</strong></p>\n<p>不能。服务价值、员工数量和应对能力是不同判断，A缺少人员层面的依据。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<h3>B. is able to meet visitors’ demands</h3>\n<p>能满足游客需求</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“国家公园能满足游客需求”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>介绍改善公园服务的办法</td>\n<td>先说一种办法为什么让人起疑</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>承认设施困难但证明需求仍被满足</td>\n<td>再承认要解决的问题确实存在</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明营地商业化满足游客便利需求</td>\n<td>接着说这个办法能起的作用有限</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>强调私有化怎样改善游园体验</td>\n<td>再说这样做还会损害原有好处</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用调查证明游客需求已得到满足</td>\n<td>接着说真正缺什么以及谁愿支持</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>列举公园充分服务游客的成果</td>\n<td>再说这件事本身值得得到支持</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>说明既有资金足够应对增长的客流</td>\n<td>最后说现有投入与实际需要不相称</td>\n</tr>\n</tbody></table>\n<p>B的meet visitors’ demands把全文结论写成已有能力足够。第2段道路、洗手间等破败已经显示服务条件存在欠缺；第4段担心私有化进一步削弱游客享受自然的目的，也不是证明需求已被满足。</p>\n<p>末段游客数增长与金额持平并列，强调要做的事情增加、资源没有相应增加。游客多可以说明公园受欢迎，却不能直接证明每种需求得到满足。B把到访规模当成服务充足的证据，反转了结尾压力。</p>\n<p><strong>游客越来越多，是否自然等于公园现有资源已经足够满足需求？</strong></p>\n<p>不能。客流增加恰可能加重负担，本文用它与持平金额对照来显示不足。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<h3>C. is in need of a new pricing policy</h3>\n<p>需要新的定价政策</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“国家公园需要新的定价政策”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出公园应调整收费体系</td>\n<td>先说一种办法为什么让人起疑</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>把维护问题归因于现有定价不合理</td>\n<td>再承认要解决的问题确实存在</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>分析商业收入与门票定价结构</td>\n<td>接着说这个办法能起的作用有限</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>比较不同收费方式对体验的影响</td>\n<td>再说这样做还会损害原有好处</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用调查提出具体收费新标准</td>\n<td>接着说真正缺什么以及谁愿支持</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>为新的价格结构说明价值依据</td>\n<td>再说这件事本身值得得到支持</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>以调整价格能够补足缺口结束</td>\n<td>最后说现有投入与实际需要不相称</td>\n</tr>\n</tbody></table>\n<p>C的new pricing policy把解决方案限定在价格体系。全文讲政府想补资金、营地企业上交比例、纳税人愿意多付税及国会年度金额，资金可以来自不同渠道，不能统统等同门票或服务定价。</p>\n<p>调查说pay additional taxes，也没有询问提高门票或制定新价格。作者明确检验某些办法后仍强调经费缺口，C却越过“需要资金”进一步指定一种未论证的价格改革。</p>\n<p><strong>愿意多缴税和公园缺钱，是否足以推出作者要求制定新价格？</strong></p>\n<p>不能。税款、预算和定价不是同一制度动作，C把较宽的资金需要缩成了具体价格方案。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<h3>D. is in need of a funding increase</h3>\n<p>需要增加资金</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“国家公园需要增加资金”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出政府试图补资金的办法并检验它</td>\n<td>先说一种办法为什么让人起疑</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>承认长期积压的维护需要资金</td>\n<td>再承认要解决的问题确实存在</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>指出营地商业化补缺口的能力有限</td>\n<td>接着说这个办法能起的作用有限</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>补充这种方案还会破坏到访体验</td>\n<td>再说这样做还会损害原有好处</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>说明根本缺钱且公众愿意承担更多</td>\n<td>接着说真正缺什么以及谁愿支持</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明公园提供多种值得资助的公共价值</td>\n<td>再说这件事本身值得得到支持</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>用金额持平与客流增长对照，落实增加资金的需要</td>\n<td>最后说现有投入与实际需要不相称</td>\n</tr>\n</tbody></table>\n<p>D的funding increase接住第1段funding gap、第5段starved of funding，也能解释后面的价值列举与末段数字。公园承担保护、教育等多种任务，维护却长期积压；每年金额基本持平，而到访人数显著上升，既有资源显得不足。</p>\n<p>对商业化的批评不是否认缺钱，而是认为那条路作用有限且会损害公园体验。调查的额外缴税意愿给出公众支持的一面，价值段说明为何值得支持，末段再将增加资金的必要性落实到资源与需求。</p>\n<p><strong>D能否同时解释为何批评商业化、列公园价值，又比较金额与游客数？</strong></p>\n<p>能。三部分分别检查办法、说明值得投入及展示投入不足，共同指向增加资金。</p>\n<p><strong>判断：D保留。</strong></p>\n<hr>\n<p><strong>It can be concluded from the text that the national park system ______.</strong></p>\n<h3>30题结论</h3>\n<p><strong>30. D. is in need of a funding increase</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>is in need of a funding increase / 需要增加资金</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查28题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. advocate a bigger budget for the national parks</li>\n<li>C. agree to pay extra for the national parks</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>is in need of a funding increase</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>国家公园系统需要增加资金；全文分别说明资金缺口、投入价值及公众愿意承担额外费用的支持基础。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B接回题干，说多数受访者主张扩大公园预算；C说多数受访者愿意为公园多付钱。第一遍两项都朝资金支持方向走：公园缺钱，纳税人又愿多缴税。不过当时尚未分清“自己愿意付多少”与“要求预算制定者怎样拨款”这两层。</p>\n<p>现在拿主旨来检查。</p>\n<p>全文现在证明公园确实需要增加资金，但这一结论是由维护积压、公共价值和末段金额与客流的比较共同形成的。不能因为作者最终认为需要增加资金，就把这个完整结论提前塞给每一位调查受访者。</p>\n<p>回到第5段原文，调查明确给出的是81%愿在接下来十年pay additional taxes，目的为avoid any cuts。C的agree to pay extra保留这项个人承担费用的意愿，也正好作为全文“增加支持有公众基础”的证据。</p>\n<p>B则把这种意愿换成advocate a bigger budget。末段才出现Congress与年度金额，这一预算层次属于全文对资源配置的讨论。调查的避免削减还可以指维持原有项目，并不自动等于受访者提出净扩大预算的主张。主旨帮助我们看清两种材料的分工：作者论证系统需要更多资金，调查证明公众愿多付钱。题干只问调查中多数人的意愿，因此选C。</p>\n<blockquote>\n<p><strong>28题选C。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>26. D</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. B</strong></p>\n<p><strong>30. D</strong></p>\n","analysisStartIndex":38,"articleImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDsAAAXkCAIAAABLzpc7AAEAAElEQVR4nOzddVwUW98A8DMzm+zSISoGoQJ2YidiK3Z3Xzswrnkt1Ct2dyHYgYXdoliIYiFIS8d2zMz7x3meefdZdMVkr/f3/YMPOzt75kzPb04RLMsiAAAAAAAAADBLZHFnAAAAAAAAAAA+CyIWAAAAAAAAgPmCiAUAAAAAAABgviBiAQAAAAAAAJgviFgAAAAAAAAA5gsiFgAAAAAAAID5gogFAAAAAAAAYL4gYgEAAAAAAACYL4hYAAAAAAAAAOYLIhYAAAAAAACA+YKIBQAAAAAAAGC+IGIBAAAAAAAAmC+IWAAAAAAAAADmCyIWAAAAAAAAgPmCiAUAAAAAAABgviBiAQAAAAAAAJgviFgAAAAAAAAA5gsiFgAAAAAAAID5gogFAAAAAAAAYL4gYgEAAAAAAACYL4hYAAAAAAAAAOYLIhYAAAAAAACA+YKIBQAAAAAAAGC+IGIBAAAAAAAAmC+IWAAAAAAAAADmCyIWAAAAAAAAgPmCiAUAAAAAAABgviBiAQAAAAAAAJgviFgAAAAAAAAA5gsiFgAAAAAAAID5gogFAAAAAAAAYL4gYgEAAAAAAACYL4hYAAAAAAAAAOYLIhYAAAAAAACA+YKIBQAAAAAAAGC+IGIBAAAAAAAAmC+IWAAAAAAAAADmCyIWAAAAAAAAgPmCiAUAAAAAAABgviBiAQAAAAAAAJgviFgAAAAAAAAA5gsiFgAAAAAAAID5gogFAAAAAAAAYL4gYgEAAAAAAACYL4hYAAAAAAAAAOYLIhYAAAAAAACA+YKIBQAAAAAAAGC+IGIBAAAAAAAAmC+IWAAAAAAAAADmCyIWAAAAAAAAgPmCiAUAAAAAAABgviBiAQAAAAAAAJgviFgAAAAAAAAA5gsiFgA function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}
function centerRight(){const el=document.getElementById('onlyCurrent');if(!el)return;combined.style.paddingTop='30px';combined.style.paddingBottom='60px';requestAnimationFrame(()=>{const h=el.getBoundingClientRect().height,ph=rightPane.clientHeight;if(h<ph-70){const pad=Math.max(30,Math.floor((ph-h)/2));combined.style.paddingTop=pad+'px';combined.style.paddingBottom=pad+'px'}rightPane.scrollTo({top:0,behavior:'smooth'})})}
function setControls(){document.getElementById('prev').disabled=fullMode||idx<0;document.getElementById('next').disabled=fullMode||idx>=DATA.steps.length-1||!ready;document.getElementById('reset').disabled=fullMode;document.getElementById('jump').disabled=fullMode;const t=document.getElementById('toggleAll');t.textContent=fullMode?'返回交互':'显示全部';t.classList.toggle('active',fullMode)}
function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;
let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+15);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-15);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
setTimeout(()=>applyZoom(zoomLevel),60);
const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
</script></body></html>
