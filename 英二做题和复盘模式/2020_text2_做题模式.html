四段再次提七十年代，也不是为了补齐年代线，而是对照治理更严与高薪上涨，检验“主要靠占便宜”这一解释。B抓住时间材料，却漏掉作者为什么使用这些材料。</p>\n<p><strong>两处出现七十年代，就足以把全文理解为薪酬历史介绍吗？</strong></p>\n<p>不能。时间是检验解释的一部分，后半篇的反驳和辩护不会由“过去与现在”这一中立主题自然带出。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,439,25],[187,1182,26,24],[216,1224,272,29]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. CEO Traits: Not Easy to Define\n\nCEO特征难以定义\n\n#### 如果 C 是主旨，文章5段应该怎么写？\n\n如果C是主旨，文章中心就应该是“CEO特征难以定义”。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 提出CEO有哪些特征难以界定 | 先承认一种容易引起争议的现象 |\n| 第2段 | 解释不同人的CEO特征概念为什么冲突 | 再说这种现象为什么会出现 |\n| 第3段 | 列出技能以显示无法提出清楚定义 | 接着说现在要做的事比以前更多 |\n| 第4段 | 讨论治理者为何也难确定CEO应有特征 | 再反驳一种看起来常见的解释 |\n| 第5段 | 以不同候选人再次说明特征定义困难 | 最后补两点来说明为什么说得通 |\n\nC把Not Easy to Define作为主要判断，文章实际却把新增要求列得相当具体：金融市场、公关、跨国供应链、技术业务及原有日常工作。要求复杂、多样，并不等于这些要求无法描述或定义。\n\n而且前后几段都在反复解释薪酬，既没有比较不同的CEO概念，也没有展示定义上的争议。若按C来写，中间的技能清单需要证明“说不清”，现在它反而用来把为什么薪酬高说得更清楚。\n\n**技能要求很多、工作复杂，是否就是“CEO特征难以定义”？**\n\n不是。C把工作难度改成定义困难，又没有接住全文反复讨论的薪酬依据。\n\n**判断：C排除。**\n\n---\n\n**The most suitable title for this text would be ______.**","html":"<h3>C. CEO Traits: Not Easy to Define</h3>\n<p>CEO特征难以定义</p>\n<h4>如果 C 是主旨，文章5段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“CEO特征难以定义”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出CEO有哪些特征难以界定</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>解释不同人的CEO特征概念为什么冲突</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>列出技能以显示无法提出清楚定义</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>讨论治理者为何也难确定CEO应有特征</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>以不同候选人再次说明特征定义困难</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<p>C把Not Easy to Define作为主要判断，文章实际却把新增要求列得相当具体：金融市场、公关、跨国供应链、技术业务及原有日常工作。要求复杂、多样，并不等于这些要求无法描述或定义。</p>\n<p>而且前后几段都在反复解释薪酬，既没有比较不同的CEO概念，也没有展示定义上的争议。若按C来写，中间的技能清单需要证明“说不清”，现在它反而用来把为什么薪酬高说得更清楚。</p>\n<p><strong>技能要求很多、工作复杂，是否就是“CEO特征难以定义”？</strong></p>\n<p>不是。C把工作难度改成定义困难，又没有接住全文反复讨论的薪酬依据。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,439,25],[187,1182,26,24],[216,1266,321,29]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. CEOs’ Challenges of Today\n\n今天CEO面临的挑战\n\n#### 如果 D 是主旨，文章5段应该怎么写？\n\n如果D是主旨，文章中心就应该是“今天CEO所面临的挑战”。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从高薪引出现任CEO面临哪些挑战 | 先承认一种容易引起争议的现象 |\n| 第2段 | 介绍当下人才与业务环境的压力 | 再说这种现象为什么会出现 |\n| 第3段 | 集中列举经营中的各项新困难 | 接着说现在要做的事比以前更多 |\n| 第4段 | 讨论更严格治理给现任CEO带来的挑战 | 再反驳一种看起来常见的解释 |\n| 第5段 | 说明如何应对招聘与股价要求，收束当下挑战 | 最后补两点来说明为什么说得通 |\n\nD确实概括了第三段的大量内容，全球化和技术业务都是今天的挑战。但题目问整篇标题，不能只看最长的一个段落。前面为何强调limited CEO talent与薪酬增幅，后面为何讨论外部候选人、股价和公司价值，D都没有给出共同的解释目的。\n\n这些挑战在文中是说明高薪有依据的原因之一。把原因提升成全文中心，就会把治理反证与企业收益这些后续论据挤到标题之外，也漏掉作者对高薪争议的明确回应。\n\n**第三段写得长，是否意味着其中的工作挑战就是整篇要回答的问题？**\n\n不是。挑战解释了为什么岗位值得高薪，整篇进一步回答的是高薪能否成立，D把一项理由扩大成了全文主题。\n\n**判断：D排除。**\n\n---\n\n**The most suitable title for this text would be ______.**","html":"<h3>D. CEOs’ Challenges of Today</h3>\n<p>今天CEO面临的挑战</p>\n<h4>如果 D 是主旨，文章5段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“今天CEO所面临的挑战”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>从高薪引出现任CEO面临哪些挑战</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍当下人才与业务环境的压力</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>集中列举经营中的各项新困难</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>讨论更严格治理给现任CEO带来的挑战</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>说明如何应对招聘与股价要求，收束当下挑战</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<p>D确实概括了第三段的大量内容，全球化和技术业务都是今天的挑战。但题目问整篇标题，不能只看最长的一个段落。前面为何强调limited CEO talent与薪酬增幅，后面为何讨论外部候选人、股价和公司价值，D都没有给出共同的解释目的。</p>\n<p>这些挑战在文中是说明高薪有依据的原因之一。把原因提升成全文中心，就会把治理反证与企业收益这些后续论据挤到标题之外，也漏掉作者对高薪争议的明确回应。</p>\n<p><strong>第三段写得长，是否意味着其中的工作挑战就是整篇要回答的问题？</strong></p>\n<p>不是。挑战解释了为什么岗位值得高薪，整篇进一步回答的是高薪能否成立，D把一项理由扩大成了全文主题。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,439,25],[187,1182,26,24],[217,1308,275,30]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题结论\n\n**30. A. CEOs Are Not Overpaid**\n\n这句话就是本文后续做题的主旨底牌：\n\n**CEOs Are Not Overpaid / CEO并未被支付过高薪酬**\n\n---","html":"<h3>30题结论</h3>\n<p><strong>30. A. CEOs Are Not Overpaid</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>CEOs Are Not Overpaid / CEO并未被支付过高薪酬</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[187,1139,439,25],[187,1182,26,24],[217,1182,241,29],[216,1224,272,29],[216,1266,321,29],[217,1308,275,30]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查29题：A还是C？\n\n第一遍留下：\n\n- A. increase corporate value\n- C. boost the efficiency of CEOs\n\n主旨底牌是：\n\n> **CEOs Are Not Overpaid**\n\n也就是：\n\n> CEO的高薪有可以说明的依据：人才与岗位要求发生变化，相关做法还会增加公司价值，不能只凭薪酬高就认定支付过头。\n\n我们先把题干和两个选项接起来。\n\nA接上题干，说高薪通过增加公司价值得到解释；C说高薪通过提高CEO效率得到解释。第一遍，段尾明确给出公司价值增加，但CEO效率也可能是影响这个结果的中间因素，所以两项同时留下。问题不是它们能否在现实中同时发生，而是文章实际拿哪一个结果完成了辩护。\n\n现在拿主旨来检查。\n\n先看A。全文现在形成的论证是：机会增多、人才有限，岗位还要求更多金融、公关、全球经营与技术知识，因此高薪不能只理解为占便宜；最后再用公司价值增加，说明企业这一方也获得收益。A正好落在这条论证的收益端，直接回答公司为什么有理由支付高薪。\n\n再看C。提高效率需要说明同一位CEO在拿到更高薪酬之后，如何用更少时间或投入完成更多工作。文中“需要更多技能”“面对更难工作”说的是岗位要求更高，不是高薪已经使某个人变得更快、更省力。即使薪酬激励可能有这种作用，也还要补一条原文没有展开的作用路径，才能把efficiency同公司价值连接。\n\n回到第5段，作者最终写出的不是效率考核结果，而是build up corporate value，并用not just for the CEO把受益范围扩到公司。A既保留这个局部结果，也完成全文对高薪的辩护。C可能是现实中的一个作用机制，却没有成为本文已经建立的理由，因此这题最终选A。\n\n> **29题选A。**\n\n---","html":"<h2>回查29题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. increase corporate value</li>\n<li>C. boost the efficiency of CEOs</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>CEOs Are Not Overpaid</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>CEO的高薪有可以说明的依据：人才与岗位要求发生变化，相关做法还会增加公司价值，不能只凭薪酬高就认定支付过头。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A接上题干，说高薪通过增加公司价值得到解释；C说高薪通过提高CEO效率得到解释。第一遍，段尾明确给出公司价值增加，但CEO效率也可能是影响这个结果的中间因素，所以两项同时留下。问题不是它们能否在现实中同时发生，而是文章实际拿哪一个结果完成了辩护。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。全文现在形成的论证是：机会增多、人才有限，岗位还要求更多金融、公关、全球经营与技术知识，因此高薪不能只理解为占便宜；最后再用公司价值增加，说明企业这一方也获得收益。A正好落在这条论证的收益端，直接回答公司为什么有理由支付高薪。</p>\n<p>再看C。提高效率需要说明同一位CEO在拿到更高薪酬之后，如何用更少时间或投入完成更多工作。文中“需要更多技能”“面对更难工作”说的是岗位要求更高，不是高薪已经使某个人变得更快、更省力。即使薪酬激励可能有这种作用，也还要补一条原文没有展开的作用路径，才能把efficiency同公司价值连接。</p>\n<p>回到第5段，作者最终写出的不是效率考核结果，而是build up corporate value，并用not just for the CEO把受益范围扩到公司。A既保留这个局部结果，也完成全文对高薪的辩护。C可能是现实中的一个作用机制，却没有成为本文已经建立的理由，因此这题最终选A。</p>\n<blockquote>\n<p><strong>29题选A。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[[182,368,749,30],[135,403,795,30],[135,438,795,29],[135,473,795,29],[135,508,795,29],[135,543,448,29],[182,577,748,30],[135,611,796,31],[135,647,795,29],[135,682,795,29],[135,717,795,29],[135,751,795,30],[135,786,795,30],[135,821,795,29],[135,856,796,29],[135,891,795,29],[135,926,285,29],[182,960,750,29],[135,995,795,29],[135,1030,795,29],[135,1065,789,29],[134,1099,797,30],[135,1134,232,30],[182,1169,749,29],[135,1204,797,29],[135,1239,796,29],[135,1274,796,29],[135,1308,603,30]],"questionRects":[[187,886,619,30],[187,928,26,24],[217,928,236,29],[216,1012,285,30]],"scrollTarget":"auto","meta":{"kind":"review","qid":"29"}},{"section":"最终答案","raw":"## 最终答案：\n\n**26. B**\n\n**27. C**\n\n**28. C**\n\n**29. A**\n\n**30. A**","html":"<h2>最终答案：</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. C</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. A</strong></p>\n<p><strong>30. A</strong></p>\n","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"final"}}],"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>Which of the following has contributed to CEO pay rise?</strong></p>\n<p>下列哪一项促成了CEO薪酬上涨？</p>\n<p>题型：原因题</p>\n<h2>27题题干</h2>\n<p><strong>Compared with their predecessors, today’s CEOs are required to ______.</strong></p>\n<p>与前任相比，今天的CEO被要求做什么？</p>\n<p>题型：比较细节题</p>\n<h2>28题题干</h2>\n<p><strong>CEO pay has been rising since the 1970s despite ______.</strong></p>\n<p>尽管存在什么情况，CEO薪酬仍自二十世纪七十年代以来不断上涨？</p>\n<p>题型：转折关系题</p>\n<h2>29题题干</h2>\n<p><strong>High CEO pay can be justified by the fact that it helps ______.</strong></p>\n<p>高CEO薪酬可以由它带来的哪种帮助得到解释？</p>\n<p>题型：作用推断题</p>\n<h2>30题题干</h2>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<p>本文最合适的标题是什么？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>It is true；but；Yet；Furthermore</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>limited；significant；tough</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>grow；require；tie；build up</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>gone up；high and rising；corporate value</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>CEO；pay；companies</td>\n</tr>\n</tbody></table>\n<p>It is true that CEO pay has gone up—top ones may make 300 times the pay of typical workers on average, and since the mid-1970s, CEO pay for large publicly traded American [xxx] has, by varying [xxx], gone up by about 500%. The typical CEO of a top American corporation now makes about $18.9 million a year.</p>\n<p>The best model for understanding the growth of CEO pay is that of limited CEO talent in a world where business opportunities for the top firms are growing rapidly. The efforts of America’s highest-earning 1% have been one of the more [xxx] elements of the global economy. It’s not popular to say, but one reason their pay has gone up so much is that CEOs really have [xxx] their game relative to many other workers in the U.S. economy.</p>\n<p>Today’s CEO, at least for major American firms, must have many more skills than simply being able to “run the company.” CEOs must have a good sense of financial markets and maybe even how the company should trade in them. They also need better public relations skills than their [xxx], as the costs of even a minor [xxx] can be significant. Then there’s the fact that large American companies are much more globalized than ever before, with supply chains spread across a larger number of countries. To lead in that system requires knowledge that is fairly [xxx]. Plus, [xxx] all major American companies are becoming tech companies, often with their own research and development. And beyond this, major CEOs still have to do all the day-to-day work they have always done.</p>\n<p>The common idea that high CEO pay is mainly about ripping people off doesn’t explain history very well. By most measures, corporate [xxx] has become a lot tighter and more [xxx] since the 1970s. Yet it is [xxx] during this period of stronger governance that CEO pay has been high and rising. That suggests it is in the broader corporate interest to [xxx] top candidates for increasingly tough jobs.</p>\n<p>Furthermore, the highest CEO salaries are paid to outside candidates, not to the [xxx] insider picks, another sign that high CEO pay is not some kind of [xxx] at the [xxx] of the rest of the company. And the stock market reacts [xxx] when companies tie CEO pay to, say, stock prices, a sign that those [xxx] build up corporate value not just for the CEO.</p>\n<p>It is true that CEO pay has gone up— / top ones may make 300 times the pay of typical workers on average, / and since the mid-1970s, / CEO pay for large publicly traded American [xxx] has, / by varying [xxx], / gone up by about 500%. / The typical CEO of a top American corporation / now makes about $18.9 million a year.</p>\n<p>The best model for understanding the growth of CEO pay / is that of limited CEO talent / in a world where business opportunities for the top firms are growing rapidly. / The efforts of America’s highest-earning 1% / have been one of the more [xxx] elements of the global economy. / It’s not popular to say, / but one reason their pay has gone up so much / is that CEOs really have [xxx] their game / relative to many other workers in the U.S. economy.</p>\n<p>Today’s CEO, at least for major American firms, / must have many more skills / than simply being able to “run the company.” / CEOs must have a good sense of financial markets / and maybe even how the company should trade in them. / They also need better public relations skills than their [xxx], / as the costs of even a minor [xxx] can be significant. / Then there’s the fact / that large American companies are much more globalized than ever before, / with supply chains spread across a larger number of countries. / To lead in that system requires knowledge / that is fairly [xxx]. / Plus, [xxx] all major American companies are becoming tech companies, / often with their own research and development. / And beyond this, major CEOs still have to do / all the day-to-day work they have always done.</p>\n<p>The common idea / that high CEO pay is mainly about ripping people off / doesn’t explain history very well. / By most measures, / corporate [xxx] has become a lot tighter and more [xxx] since the 1970s. / Yet it is [xxx] during this period of stronger governance / that CEO pay has been high and rising. / That suggests / it is in the broader corporate interest / to [xxx] top candidates for increasingly tough jobs.</p>\n<p>Furthermore, the highest CEO salaries are paid to outside candidates, / not to the [xxx] insider picks, / another sign / that high CEO pay is not some kind of [xxx] / at the [xxx] of the rest of the company. / And the stock market reacts [xxx] / when companies tie CEO pay to, say, stock prices, / a sign that those [xxx] build up corporate value / not just for the CEO.</p>\n<p>It is true that 首席执行官薪酬上涨了— / top ones may make 三百倍 the pay of 普通员工 平均, / and 自二十世纪七十年代中期以来, / CEO pay for large publicly traded American [xxx] has, / by varying [xxx], / gone up by about 500%. / The typical CEO of 一家顶尖美国公司 / 现在获得 about $18.9 million 每年.</p>\n<p>The best model for understanding the growth of CEO pay / is that of 有限的首席执行官人才 / in a world where 商业机会 for the 顶尖公司 are 快速增长. / The efforts of America’s 收入最高的 1% / have been one of the more [xxx] elements of the 全球经济. / It’s not popular to say, / but one reason 他们的薪酬 has gone up so much / is that CEOs really have [xxx] their game / relative to 许多其他员工 in the U.S. economy.</p>\n<p>Today’s CEO, at least for major American firms, / must have 多得多的技能 / than simply being able to “run the company.” / CEOs must have a good sense of 金融市场 / and maybe even how the company should trade in them. / They also need better 公关技能 than their [xxx], / as 成本 of even a minor [xxx] can be significant. / Then there’s the fact / that large American companies are much more 比以往更加全球化, / with 供应链 spread across 更多国家. / To lead in that system requires 知识 / that is fairly [xxx]. / Plus, [xxx] all major American companies are becoming 科技公司, / often with 自身的研究与开发. / And beyond this, major CEOs still have to do / all the 日常工作 they have always done.</p>\n<p>The common idea / that 首席执行官高薪 is mainly about 敲别人竹杠 / 不能解释历史 very well. / By most measures, / corporate [xxx] has become 严格得多 and more [xxx] since the 1970s. / Yet it is [xxx] during this period of 更严格的治理 / that CEO pay has been high and rising. / That suggests / it is in the broader 公司利益 / to [xxx] top candidates for increasingly 艰难工作.</p>\n<p>Furthermore, the 最高的首席执行官薪酬 are paid to 外部人选, / 而非给予 the [xxx] 内部选定的人, / another sign / that high CEO pay is not some kind of [xxx] / at the [xxx] of the 公司的其余部分. / And the stock market reacts [xxx] / when companies 将首席执行官薪酬挂钩于, say, 股价, / a sign that those [xxx] 增加公司价值 / 不只为了首席执行官.</p>\n<p>1、首席执行官薪酬上涨了、三百倍、普通员工、平均、自二十世纪七十年代中期以来、顶尖美国公司、现在获得、每年。</p>\n<p>2、有限的首席执行官人才、商业机会、顶尖公司、快速增长、收入最高的、全球经济、他们的薪酬、许多其他员工。</p>\n<p>3、多得多的技能、金融市场、公关技能、成本、比以往更加全球化、供应链、更多国家、知识、科技公司、自身的研究与开发、日常工作。</p>\n<p>4、首席执行官高薪、敲别人竹杠、不能解释历史、严格得多、更严格的治理、公司利益、艰难工作。</p>\n<p>5、最高的首席执行官薪酬、外部人选、而非给予、内部选定的人、公司的其余部分、将首席执行官薪酬挂钩于、股价、增加公司价值、不只为了首席执行官。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与首席执行官薪酬有关；开头似乎看到首席执行官薪酬上涨了、三百倍、普通员工、每年；中间又出现有限的首席执行官人才、商业机会、金融市场、全球化、公司利益；结尾还看到外部人选、股价、增加公司价值、不只为了首席执行官。</p>\n<p>到这里还不能自然地说清楚：人才、工作要求、治理和公司价值怎样与薪酬相接。粗读时只要能判断“这篇大概在讨论首席执行官为什么拿到这些薪酬”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先记住薪酬、人才和公司价值分别出现的位置。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<h2>26题</h2>\n<blockquote>\n<p>Which of the following has contributed to CEO pay rise?\n下列哪一项促成了CEO薪酬上涨？</p>\n</blockquote>\n<p>题干问CEO pay上涨的原因，第2段用the growth of CEO pay谈同一个变化，并以解释模型开头。先把这一段完整读完，看看模型里的几个因素怎样联系。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The best model for understanding the growth of CEO pay is that of limited CEO talent in a world where business opportunities for the top firms are growing rapidly. The efforts of America’s highest-earning 1% have been one of the more [xxx] elements of the global economy. It’s not popular to say, but one reason their pay has gone up so much is that CEOs really have [xxx] their game relative to many other workers in the U.S. economy.</p>\n<p>开始精读：</p>\n<p>The best model for understanding the growth of CEO pay / is that of limited CEO talent / in a world where business opportunities for the top firms are growing rapidly. / The efforts of America’s highest-earning 1% / have been one of the more [xxx] elements of the global economy. / It’s not popular to say, / but one reason their pay has gone up so much / is that CEOs really have [xxx] their game / relative to many other workers in the U.S. economy.</p>\n<p>理解CEO薪酬增长的最佳模型 / 是CEO人才有限这个模型 / 在顶尖公司商业机会快速增长的世界里。 / 美国收入最高的百分之一人群的努力 / 一直是全球经济中较[xxx]的因素之一。 / 这样说并不受欢迎， / 但他们的薪酬上涨如此之多的一个原因 / 是CEO确实已经[xxx]了自己的表现 / 相对于美国经济中的许多其他员工而言。</p>\n</blockquote>\n<p>这一段用The best model直接回答怎样理解薪酬增长：一边是limited CEO talent，另一边是顶尖公司的机会快速增加。题目问促成涨薪的因素，要找这种解释中的具体一边。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. Close [xxx] among leading economies.</h3>\n<blockquote>\n<p>主要经济体之间密切的[xxx]</p>\n</blockquote>\n<p>把A接回题干，它说的是：CEO涨薪是主要经济体之间关系更密切带来的。</p>\n<p>A的leading economies让人想到第2段global economy，所以回到the efforts那一句，看它在说哪些主体之间发生了什么。</p>\n<blockquote>\n<p>The efforts of America’s highest-earning 1% have been one of the more [xxx] elements of the global economy.</p>\n</blockquote>\n<p>global economy是最高收入人群的努力所处的经济范围，leading economies却把主体换成多个主要经济体。原句并没有描写这些经济体互相怎样行动；它把最高收入人群放到全球经济中评价，随后再解释CEO相对于其他员工的情况。</p>\n<p>A的among还要求有“几个经济体之间”的关系。即使暂时没读清[xxx]，这个多方关系仍然需要另外建立，不能由global一个形容词直接推出。公司能在全球获得更多机会，与国家或经济体彼此密切交往，也不是同一个原因。</p>\n<p><strong>原句出现global economy，就建立了主要经济体之间的密切关系吗？</strong></p>\n<p>不能。A把一个经济范围改成了多个经济体之间的关系，原句谈的仍是最高收入人群与CEO的情况。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. Increased business opportunities for top firms.</h3>\n<blockquote>\n<p>顶尖公司的商业机会增多</p>\n</blockquote>\n<p>把B接回题干，它说的是：顶尖公司获得更多商业机会，促成了CEO薪酬上涨。</p>\n<p>B的Increased business opportunities直接对应第2段business opportunities for the top firms are growing rapidly，所以回到解释模型的整句话，看这个增长为什么与CEO有关。</p>\n<blockquote>\n<p>The best model for understanding the growth of CEO pay is that of limited CEO talent in a world where business opportunities for the top firms are growing rapidly.</p>\n</blockquote>\n<p>business opportunities for the top firms are growing rapidly给出机会的增长，Increased business opportunities说的是同一个机会增长。与此同时，句子还限定limited CEO talent：能抓住这些机会的人才并不是无限供应。两边合起来，才说明顶尖公司为什么会更看重合适的CEO、愿意付出更高薪酬。</p>\n<p>B没有声称机会增加是唯一原因，也没有把所有员工都纳入同一种涨薪机制。题目只问哪一项contributed to，选出模型中确实起作用的一个因素即可。</p>\n<p><strong>B只写机会增加，没有把人才有限一并写进选项，还能回答“促成因素”吗？</strong></p>\n<p>能。机会增加正是原文解释中的一项因素；人才有限说明它如何发生作用，题目并未要求选项复述整个模型。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. The general pay rise with a better economy.</h3>\n<blockquote>\n<p>经济改善带来的普遍涨薪</p>\n</blockquote>\n<p>把C接回题干，它说的是：CEO只是随经济好转、所有人普遍涨薪而一起涨薪。</p>\n<p>C的general pay rise把涨薪放到所有员工的共同趋势里，因此回到第2段relative to many other workers，比较作者解释的是共同变化还是CEO的特殊变化。</p>\n<blockquote>\n<p>one reason their pay has gone up so much is that CEOs really have [xxx] their game relative to many other workers in the U.S. economy.</p>\n</blockquote>\n<p>relative to many other workers明确把CEO与许多其他员工分开比较，general pay rise却把解释放在大家一起随经济好转而涨薪上。前面的limited CEO talent与top firms也都限定了一个特殊的人才与岗位范围，讨论的不是所有劳动者共有的涨薪条件。</p>\n<p>这并不等于其他员工一定没有涨薪。即使两种涨薪同时存在，C所说的普遍变化也没有解释原文为何要强调CEO人才有限、顶尖公司的机会增多，以及与其他员工相比的差别。题目要找的是文中实际提出的促成因素。</p>\n<p><strong>其他员工可能也涨薪，就能把作者给CEO的这套特殊解释改成普遍涨薪吗？</strong></p>\n<p>不能。两种现象可以同时发生，但C抹掉了原文用来解释CEO薪酬变化的特定人才与岗位条件。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. The growth in the number of corporations.</h3>\n<blockquote>\n<p>公司数量增长</p>\n</blockquote>\n<p>把D接回题干，它说的是：CEO涨薪是因为公司总数变多。</p>\n<p>D的number of corporations也在谈增长，所以回到第2段business opportunities，确认增加的究竟是哪一种数量。</p>\n<blockquote>\n<p>business opportunities for the top firms are growing rapidly.</p>\n</blockquote>\n<p>business opportunities是现有顶尖公司可以利用的商业机会，number of corporations却是公司家数。即使公司家数完全不变，同一家公司也可能进入更多市场、开展更多业务，因而面对更多机会；反过来，公司家数增加，也不必然说明顶尖公司的机会增加。</p>\n<p>因此，D不是把growing rapidly换成growth这么简单，而是把增长的对象从机会换成公司。原句特地写for the top firms，把公司放在机会的受益者位置上，并没有把它们放到被统计增长的数量位置上。</p>\n<p><strong>“给顶尖公司的机会增加”，可以直接改成“公司家数增加”吗？</strong></p>\n<p>不能。公司是机会所归属的主体，机会才是发生增长的对象，D把这两个位置混在一起。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。机会增长与有限人才共同构成涨薪解释；A换成经济体关系，C改成普遍涨薪，D换了增长对象。</p>\n<h2>27题</h2>\n<blockquote>\n<p>Compared with their predecessors, today’s CEOs are required to ______.\n与前任相比，今天的CEO被要求做什么？</p>\n</blockquote>\n<p>题干以today’s CEOs与predecessors作比较，第3段开头就是Today’s CEO，并逐项列出现在需要的技能。先把整段从第一项要求读到日常工作。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Today’s CEO, at least for major American firms, must have many more skills than simply being able to “run the company.” CEOs must have a good sense of financial markets and maybe even how the company should trade in them. They also need better public relations skills than their [xxx], as the costs of even a minor [xxx] can be significant. Then there’s the fact that large American companies are much more globalized than ever before, with supply chains spread across a larger number of countries. To lead in that system requires knowledge that is fairly [xxx]. Plus, [xxx] all major American companies are becoming tech companies, often with their own research and development. And beyond this, major CEOs still have to do all the day-to-day work they have always done.</p>\n<p>开始精读：</p>\n<p>Today’s CEO, at least for major American firms, / must have many more skills / than simply being able to “run the company.” / CEOs must have a good sense of financial markets / and maybe even how the company should trade in them. / They also need better public relations skills than their [xxx], / as the costs of even a minor [xxx] can be significant. / Then there’s the fact / that large American companies are much more globalized than ever before, / with supply chains spread across a larger number of countries. / To lead in that system requires knowledge / that is fairly [xxx]. / Plus, [xxx] all major American companies are becoming tech companies, / often with their own research and development. / And beyond this, major CEOs still have to do / all the day-to-day work they have always done.</p>\n<p>今天的CEO，至少对美国大公司而言， / 必须具备多得多的技能 / 而非只是能够“经营公司”。 / CEO必须对金融市场有良好的认识 / 甚至可能还要懂公司应如何在其中交易。 / 他们还需要比自己的[xxx]更好的公关技能， / 因为即使一个小小的[xxx]，成本也可能很大。 / 此外还有一个事实 / 美国的大公司比以往更加全球化， / 供应链分布在更多国家。 / 在这种体系中领导公司需要知识 / 而这些知识相当[xxx]。 / 此外，[xxx]所有美国大公司都正在变成科技公司， / 往往拥有自身的研究与开发。 / 除此之外，大公司的CEO仍然必须做 / 他们一直做的所有日常工作。</p>\n</blockquote>\n<p>段中依次说金融市场、公关、全球经营与科技转型，最后补上原有日常工作仍要做。选项中的某个名词即使出现过，也要继续看原文给CEO的是哪一种动作要求。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. establish closer ties with tech companies</h3>\n<blockquote>\n<p>与科技公司建立更密切的联系</p>\n</blockquote>\n<p>把A接回题干，它说的是：今天的CEO应当加强自己公司与外部科技公司的联系。</p>\n<p>A的closer ties with tech companies与第3段are becoming tech companies共用tech companies，所以回到Plus后面，比较公司是在与谁建立关系，还是自身正在改变。</p>\n<blockquote>\n<p>all major American companies are becoming tech companies, often with their own research and development.</p>\n</blockquote>\n<p>are becoming tech companies说美国大公司自身正在变成科技公司，closer ties with tech companies却把科技公司放在外部合作对象的位置。原文随后加their own research and development，进一步把研发放在这些公司自己内部，说明经营者需要面对自身业务越来越技术化的任务。</p>\n<p>企业转型时当然可能同时与外部科技公司合作，但合作不能由“自己正在成为科技公司”直接推出。A替原文增加了一条公司与公司之间的关系，也把CEO理解自身技术业务的任务改成对外交往。</p>\n<p><strong>公司自身科技化，与加强同外部科技公司的联系，是同一个变化吗？</strong></p>\n<p>不是。一个改变公司的业务性质，一个改变两家公司的关系，A没有保留原句的变化对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. finance more research and development</h3>\n<blockquote>\n<p>为更多研究开发提供资金</p>\n</blockquote>\n<p>把B接回题干，它说的是：今天的CEO需要增加研究与开发的资助。</p>\n<p>B的finance more research and development对应第3段their own research and development，所以回看这处研发与前面的financial markets各在说明什么。</p>\n<blockquote>\n<p>CEOs must have a good sense of financial markets and maybe even how the company should trade in them.</p>\n</blockquote>\n<blockquote>\n<p>often with their own research and development.</p>\n</blockquote>\n<p>their own research and development说明很多公司有自身研发，finance more research and development却进一步要求CEO增加研发资助。own回答“是谁的研发”，more回答“资助量是否比以前更多”，两者不是一个限定。原文说公司越来越技术化，需要CEO具备相应知识，并没有报告研发预算的增减。</p>\n<p>前面的financial markets也不能补上这个缺口：那句话要求懂市场及公司如何交易，并非专门说筹资给研发。B把“金融市场知识”和“公司自有研发”拼成一个增加研发投入的动作，原文的两个要求并未这样相接。</p>\n<p><strong>出现financial markets和research and development，就能推出增加研发资助吗？</strong></p>\n<p>不能。市场交易知识与拥有自有研发分别是两项背景，B额外增加了资助动作以及more这一数量比较。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. operate more globalized companies</h3>\n<blockquote>\n<p>经营更加全球化的公司</p>\n</blockquote>\n<p>把C接回题干，它说的是：今天的CEO需要领导经营范围比过去更全球化的公司。</p>\n<p>C的operate more globalized companies与第3段much more globalized than ever before对应，所以回到供应链那一句，再接To lead in that system。</p>\n<blockquote>\n<p>large American companies are much more globalized than ever before, with supply chains spread across a larger number of countries.</p>\n</blockquote>\n<blockquote>\n<p>To lead in that system requires knowledge that is fairly [xxx].</p>\n</blockquote>\n<p>much more globalized than ever before明确提供“比过去更全球化”的比较，operate more globalized companies保留了这个新条件。with后面的供应链跨越更多国家，把globalized落实到实际经营范围，而不是空泛的国际视野。</p>\n<p>紧接着To lead in that system把公司状态转成CEO的任务：经营者必须有领导这一体系所需的知识。因此C不是从“公司变全球化”擅自跳到“CEO要做什么”，后一句已经把公司条件与领导要求接好了。</p>\n<p><strong>原文有没有把公司的全球化变化进一步接成CEO的经营要求？</strong></p>\n<p>能找到。To lead in that system明确承接前面的全球供应链体系，C把这两句合成了一个完整要求。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. [xxx] a stronger sense of teamwork</h3>\n<blockquote>\n<p>[xxx]更强的团队意识</p>\n</blockquote>\n<p>把D接回题干，它说的是：今天的CEO需要让团队意识变得更强。</p>\n<p>D的sense of teamwork与第3段a good sense of financial markets都有sense of，所以回到这一结构后面的名词，确认需要增强的是哪一种认识。</p>\n<blockquote>\n<p>CEOs must have a good sense of financial markets</p>\n</blockquote>\n<p>a good sense of financial markets要求对金融市场有良好认识，sense of teamwork却把对象改成团队合作。后面的公关、全球供应链、技术业务虽然都可能涉及与人合作，但文章是在列出新增的经营知识与能力范围，并没有把这些不同要求统一改写为团队意识。</p>\n<p>[xxx]位于sense of teamwork前面，无论这个动作暂时怎样理解，后面具体的对象仍然是teamwork。相同的sense of句型只说明两项都在谈某种意识或认识，不能把对市场的判断能力替换为团队合作意识。</p>\n<p><strong>两个短语都有sense of，是否意味着它们要求的是同一种能力？</strong></p>\n<p>不是。of后面的对象不同，一个关于金融市场，一个关于团队合作，D替换了要求的具体内容。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。全球化的经营条件与To lead直接连起来；A改了公司间关系，B补了研发资助，D换了能力对象。</p>\n<h2>28题</h2>\n<blockquote>\n<p>CEO pay has been rising since the 1970s despite ______.\n尽管存在什么情况，CEO薪酬仍自二十世纪七十年代以来不断上涨？</p>\n</blockquote>\n<p>题干给出1970s并用despite询问相反预期，第4段同样提到1970s，随后用Yet转到薪酬继续上涨。把转折两边所在的整段读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The common idea that high CEO pay is mainly about ripping people off doesn’t explain history very well. By most measures, corporate [xxx] has become a lot tighter and more [xxx] since the 1970s. Yet it is [xxx] during this period of stronger governance that CEO pay has been high and rising. That suggests it is in the broader corporate interest to [xxx] top candidates for increasingly tough jobs.</p>\n<p>开始精读：</p>\n<p>The common idea / that high CEO pay is mainly about ripping people off / doesn’t explain history very well. / By most measures, / corporate [xxx] has become a lot tighter and more [xxx] since the 1970s. / Yet it is [xxx] during this period of stronger governance / that CEO pay has been high and rising. / That suggests / it is in the broader corporate interest / to [xxx] top candidates for increasingly tough jobs.</p>\n<p>常见的想法 / 认为CEO高薪主要是在敲别人竹杠 / 并不能很好地解释历史。 / 按大多数衡量方式， / 公司的[xxx]自二十世纪七十年代以来已变得严格得多，也更加[xxx]。 / 然而，[xxx]是在这个治理更严格的时期， / CEO薪酬一直很高，并不断上涨。 / 这表明 / 符合更广泛的公司利益的是 / 为越来越艰难的工作[xxx]顶尖人选。</p>\n</blockquote>\n<p>despite要补的是“本来似乎会限制高薪，却与高薪持续并存”的条件。第4段先说公司层面的约束变得更严格，Yet再指出正是在这种更严格的治理下，薪酬一直上涨。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. [xxx] internal opposition</h3>\n<blockquote>\n<p>[xxx]的内部反对</p>\n</blockquote>\n<p>把A接回题干，它说的是：CEO薪酬是在公司内部反对的情况下持续上涨的。</p>\n<p>A的internal opposition说一种反对意见，因此回到第4段The common idea，看看作者说的是谁的意见，以及Yet前真正承接的条件。</p>\n<blockquote>\n<p>The common idea that high CEO pay is mainly about ripping people off doesn’t explain history very well.</p>\n</blockquote>\n<blockquote>\n<p>during this period of stronger governance</p>\n</blockquote>\n<p>The common idea是社会上常见的一种高薪解释，internal opposition却把它限定成公司内部的反对行动。原句没有指明这些看法来自公司内部，也没有说公司内部正在用某种方式反对CEO涨薪。更关键的是，Yet所在句明确重复了stronger governance，承接的是治理变严这一状态。</p>\n<p>A把“作者要反驳的一种看法”误放进“薪酬上涨所面对的制度条件”。一段里同时出现看法与转折，并不意味着那种看法就是despite后应填的事实。</p>\n<p><strong>作者反驳一种常见高薪解释，就等于公司内部一直在反对涨薪吗？</strong></p>\n<p>不能。A改了意见的主体与性质，也没有接住Yet所重复的更严格治理这一条件。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. conservative business strategies</h3>\n<blockquote>\n<p>保守的经营策略</p>\n</blockquote>\n<p>把B接回题干，它说的是：CEO薪酬是在公司采取保守经营策略的情况下上涨的。</p>\n<p>B的conservative business strategies让人联想到严格或收紧，因此回到第4段a lot tighter，比较被收紧的究竟是哪一类事情。</p>\n<blockquote>\n<p>corporate [xxx] has become a lot tighter and more [xxx] since the 1970s.</p>\n</blockquote>\n<blockquote>\n<p>this period of stronger governance</p>\n</blockquote>\n<p>a lot tighter由后文stronger governance再次说明，谈的是公司的管理约束和治理力度；conservative business strategies却变成经营策略保守。约束管理者更严格，并不等于公司减少业务扩张、避免投资或采用保守市场策略。</p>\n<p>B借用了“紧”的感觉，却把严格程度所属的对象换了。题干中的despite要求沿着原段的转折来补条件，而不是另想一个也可能妨碍高薪的经营环境。</p>\n<p><strong>治理约束更严格，就说明公司的经营策略一定更保守吗？</strong></p>\n<p>不等于。治理怎样约束管理者，与业务策略如何选择是两层问题，B换了转折前的事实对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. strict corporate governance</h3>\n<blockquote>\n<p>严格的公司治理</p>\n</blockquote>\n<p>把C接回题干，它说的是：CEO薪酬在公司治理更严格的情况下仍然上涨。</p>\n<p>C的strict corporate governance与第4段stronger governance意思一致，所以回到Yet整句，确认这段治理更严的时期发生了什么。</p>\n<blockquote>\n<p>Yet it is [xxx] during this period of stronger governance that CEO pay has been high and rising.</p>\n</blockquote>\n<p>stronger governance是前面a lot tighter的进一步指认，strict corporate governance说的是相同的治理条件。Yet随后保留了CEO pay has been high and rising，说明治理变严并没有使这里描述的高薪趋势消失。</p>\n<p>C不需要说“严格治理造成高薪”，因为despite表达的是两个事实与通常预期之间的反差。作者用这一反差来质疑高薪主要来自占便宜的解释：如果那是全部原因，治理加强之后的持续上涨就需要另作说明。</p>\n<p><strong>C是在把严格治理说成涨薪的原因，还是在保留“尽管更严，仍然上涨”的反差？</strong></p>\n<p>后者。strict corporate governance补在despite后，正好接住Yet两边的两个事实。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. repeated government warnings</h3>\n<blockquote>\n<p>政府反复发出的警告</p>\n</blockquote>\n<p>把D接回题干，它说的是：CEO薪酬是在政府一再警告的情况下上涨的。</p>\n<p>D的government warnings与第4段governance字形相近，所以回到corporate及stronger这两个修饰，核对它是在说政府还是公司内部的治理。</p>\n<blockquote>\n<p>this period of stronger governance</p>\n</blockquote>\n<p>governance指治理，government warnings则要求有政府这个行为主体以及发出警告的动作。前面的corporate把讨论范围限定在公司治理，stronger评价治理力度，并未把它变成某个政府部门的发言。</p>\n<p>D还加入repeated，需要证明警告反复发生。原文给的是一个持续时期里的治理强度与薪酬趋势，没有警告的次数、内容或发出者。词形接近不能把制度状态改成政府不断发声的事件。</p>\n<p><strong>governance前面有corporate，能否把整项读成政府反复警告？</strong></p>\n<p>不能。D先把治理误作政府，再添加警告动作与反复发生的次数关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。题干的despite对应Yet所连的治理变严与薪酬继续上涨；其他三项都改了这个条件。</p>\n<h2>29题</h2>\n<blockquote>\n<p>High CEO pay can be justified by the fact that it helps ______.\n高CEO薪酬可以由它带来的哪种帮助得到解释？</p>\n</blockquote>\n<p>题干问CEO pay带来的帮助，第5段继续谈high CEO pay及相关做法的结果。回到这一段，从外部人选一直读到股票市场的反应。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Furthermore, the highest CEO salaries are paid to outside candidates, not to the [xxx] insider picks, another sign that high CEO pay is not some kind of [xxx] at the [xxx] of the rest of the company. And the stock market reacts [xxx] when companies tie CEO pay to, say, stock prices, a sign that those [xxx] build up corporate value not just for the CEO.</p>\n<p>开始精读：</p>\n<p>Furthermore, the highest CEO salaries are paid to outside candidates, / not to the [xxx] insider picks, / another sign / that high CEO pay is not some kind of [xxx] / at the [xxx] of the rest of the company. / And the stock market reacts [xxx] / when companies tie CEO pay to, say, stock prices, / a sign that those [xxx] build up corporate value / not just for the CEO.</p>\n<p>此外，最高的CEO薪酬付给外部人选， / 而非那些[xxx]的内部选定者， / 这是另一个迹象， / 说明CEO高薪不是某种[xxx] / 在公司其余部分的[xxx]上。 / 而股票市场作出[xxx]的反应 / 当公司把CEO薪酬与比如股价挂钩时， / 这表明那些[xxx]增加了公司价值， / 不只是为了CEO。</p>\n</blockquote>\n<p>段尾用a sign that解释薪酬挂钩股价意味着什么，紧接build up corporate value。前半段又把最高薪给谁分成outside candidates与insider picks，不能把个人位置、工作效率和公司价值混成同一个结果。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. increase corporate value</h3>\n<blockquote>\n<p>增加公司价值</p>\n</blockquote>\n<p>把A接回题干，它说的是：高薪有助于提升公司整体价值，因此能够得到解释。</p>\n<p>A的increase corporate value与第5段build up corporate value意思接近，所以回到a sign that后面，再看not just for the CEO限定了谁从中受益。</p>\n<blockquote>\n<p>those [xxx] build up corporate value not just for the CEO.</p>\n</blockquote>\n<p>build up corporate value直接给出公司价值的增加，increase corporate value保留这一结果。前面的做法是将CEO薪酬与股价联系起来，作者由股票市场的反应解释这种做法的意义，落点并没有停在CEO拿到多少钱。</p>\n<p>not just for the CEO尤其有用：高薪若只让领取者自己受益，还不能解释公司为什么愿意付；这里强调结果延伸到公司这一层，才与题干的can be justified接得上。A没有要求每一笔高薪都必然产生相同回报，只是概括本文给出的这项理由。</p>\n<p><strong>A是否接住了“为何公司愿意付高薪”所需要的公司层面收益？</strong></p>\n<p>能。它把结果放在公司价值增加上，同时保留了not just for the CEO所强调的受益范围。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. confirm the status of CEOs</h3>\n<blockquote>\n<p>确认CEO的地位</p>\n</blockquote>\n<p>把B接回题干，它说的是：高薪的合理之处是证明CEO身份地位高。</p>\n<p>B的status of CEOs把好处放到个人地位，因此回到第5段not just for the CEO，比较作者实际拿哪一层结果说明高薪的意义。</p>\n<blockquote>\n<p>those [xxx] build up corporate value not just for the CEO.</p>\n</blockquote>\n<p>not just for the CEO把论证从个人所得推向公司价值，status of CEOs却只回答CEO在公司里显得多重要。薪酬高可能使人看起来地位高，但“付了很多钱，所以地位很高”并没有解释公司为什么值得付这笔钱。</p>\n<p>原句build up的对象是corporate value，不是status。B把一项公司获得的收益换成薪酬领取者的身份确认，还把支付高薪的结果拿回来当作高薪合理的理由，漏掉了企业这一方得到什么。</p>\n<p><strong>仅仅说高薪确认了CEO地位，是否回答了原文强调的公司价值收益？</strong></p>\n<p>不能。B仍停在领取薪酬的个人身上，并把价值增加的对象从公司换成了CEO的身份。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. boost the efficiency of CEOs</h3>\n<blockquote>\n<p>提高CEO的效率</p>\n</blockquote>\n<p>把C接回题干，它说的是：高薪通过提高CEO做事的效率而有道理。</p>\n<p>C的efficiency of CEOs可以让人联想到第5段build up corporate value背后的工作表现，所以回到这一结果句，分清已经写出的结果与可能的中间作用。</p>\n<blockquote>\n<p>those [xxx] build up corporate value not just for the CEO.</p>\n</blockquote>\n<p>build up corporate value是公司价值增加，efficiency of CEOs是管理者投入时间、精力后完成工作的效率，两者衡量的对象不同。高薪或与股价挂钩的安排可能影响管理者的工作方式，再影响公司结果，但这一句没有把中间每一步展开，也没有直接给出效率变化的数据。</p>\n<p>因此，现在不能把“公司价值增加”直接翻译成“CEO效率提高”；同样，也不能只因效率没被单独测量，就断言这种中间影响一定不存在。C需要的关系比A多一步，暂时还没有足够理由把它彻底否定。</p>\n<p><strong>价值增加是否等于效率提高；如果不等于，能否据此断言后者绝不可能参与其中？</strong></p>\n<p>不等于，但还不能断言后者完全不可能。公司结果与个人效率之间可能有联系，先保留A、C，再看全文究竟用哪一种关系论证高薪。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. [xxx] inside candidates</h3>\n<blockquote>\n<p>[xxx]公司内部的人选</p>\n</blockquote>\n<p>把D接回题干，它说的是：高薪有助于[xxx]内部候选人，所以是合理的。</p>\n<p>D的inside candidates与第5段outside candidates正好相对，所以回到最高薪付给谁的句子，核对作者选择的是哪一边。</p>\n<blockquote>\n<p>the highest CEO salaries are paid to outside candidates, not to the [xxx] insider picks,</p>\n</blockquote>\n<p>outside candidates是获得最高薪的对象，inside candidates却把对象改为内部候选人。not to又明说不是付给后一类内部选定者，作者正是用这种对照来说明高薪的产生不能简单归到内部人照顾自己人。</p>\n<p>D前面的[xxx]不改变inside这个限定。即使高薪存在示范作用，也不能把本段用来辩护的“最高薪给外部人选”转写为“以帮助内部人选为理由”，两者在当前论证中承担的角色是相反的。</p>\n<p><strong>D的动作没读清，会改变inside与outside所指定的两类人选吗？</strong></p>\n<p>不能。人选范围已经确定，原文把最高薪交给外部候选人，D却把论证对象换到内部。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A、C保留。A直接说公司价值增加；C试图把这种结果连到CEO效率，但这条中间关系还未说透，留到全文论证形成后再判断。</p>\n<h2>30题</h2>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<p>本文最合适的标题是什么？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>CEOs Are Not Overpaid</strong></p>\n<p>CEO并未被支付过高薪酬</p>\n<p>B. <strong>CEO Pay: Past and Present</strong></p>\n<p>CEO薪酬的过去与现在</p>\n<p>C. <strong>CEO Traits: Not Easy to Define</strong></p>\n<p>CEO特征难以定义</p>\n<p>D. <strong>CEOs’ Challenges of Today</strong></p>\n<p>今天CEO面临的挑战</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<p>前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It is true that CEO pay has gone up—top ones may make 300 times the pay of typical workers on average, and since the mid-1970s, CEO pay for large publicly traded American [xxx] has, by varying [xxx], gone up by about 500%. The typical CEO of a top American corporation now makes about $18.9 million a year.</p>\n<p>开始精读：</p>\n<p>It is true that CEO pay has gone up— / top ones may make 300 times the pay of typical workers on average, / and since the mid-1970s, / CEO pay for large publicly traded American [xxx] has, / by varying [xxx], / gone up by about 500%. / The typical CEO of a top American corporation / now makes about $18.9 million a year.</p>\n<p>CEO薪酬上涨了，这是真的—— / 最顶尖者的薪酬平均可能是普通员工的三百倍， / 而自二十世纪七十年代中期以来， / 美国大型上市[xxx]的CEO薪酬， / 按不同的[xxx]， / 上涨了约百分之五百。 / 一家顶尖美国公司的典型CEO / 现在每年获得约一千八百九十万美元。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先承认CEO薪酬大幅增加，用倍数与年薪展示争议背景</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>用人才有限、顶尖公司机会增长解释高薪形成</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>逐项列出金融、公关、全球化、技术业务与日常工作等岗位要求</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出治理更严时高薪仍上涨，反驳主要靠占便宜的解释</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用最高薪给外部人选及薪酬挂钩股价增加公司价值，进一步说明高薪有依据</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<h3>A. CEOs Are Not Overpaid</h3>\n<p>CEO并未被支付过高薪酬</p>\n<h4>如果 A 是主旨，文章5段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“CEO并没有拿到毫无依据的过高薪酬”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>承认CEO薪酬高且涨幅大，但先不把高等同于过高</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>提出高薪可由人才有限和业务机会增加解释</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用更复杂的岗位要求说明为什么合格人选值得更高薪酬</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>反驳把高薪主要归为占便宜的流行说法</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>补充外部招聘与企业价值收益，支持高薪并非没有根据</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<p>A的Not Overpaid回答的是“拿得多是否就等于拿得过多”。第一段承认涨薪，第二、三段给出稀缺人才与更复杂工作的理由，第四、五段再回应占便宜的质疑并说明公司价值收益。这几部分都围绕高薪能否得到解释，而不只是围绕CEO工作很辛苦。</p>\n<p>这里也不需要把A扩大成任何公司的任何一位CEO都绝对薪酬合理。文章反复限定top firms、major American firms，标题概括的是本文对这类高薪现象提出的辩护。</p>\n<p><strong>A能否同时容纳开头承认工资高、中间解释岗位要求，以及结尾反驳质疑？</strong></p>\n<p>能。承认高不等于承认过高，后面的原因与反驳正是在为这一区别提供内容。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<h3>B. CEO Pay: Past and Present</h3>\n<p>CEO薪酬的过去与现在</p>\n<h4>如果 B 是主旨，文章5段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“CEO薪酬的过去与现在”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>介绍过去与现在薪酬水平的差别</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>继续按时期交代薪酬制度怎样变化</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>比较各时期薪酬构成和支付方式</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把治理变化放进薪酬历史的时间顺序中</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>最后总结CEO薪酬从过去到现在的演变</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<p>B能接住第一段自二十世纪七十年代以来的涨幅，却把全文写成中立的薪酬沿革。文章没有继续按年代排列工资数据；第三段转入当前岗位需要哪些知识，最后又明确说某种流行解释不能解释历史，并补上公司价值的收益。</p>\n<p>第四段再次提七十年代，也不是为了补齐年代线，而是对照治理更严与高薪上涨，检验“主要靠占便宜”这一解释。B抓住时间材料，却漏掉作者为什么使用这些材料。</p>\n<p><strong>两处出现七十年代，就足以把全文理解为薪酬历史介绍吗？</strong></p>\n<p>不能。时间是检验解释的一部分，后半篇的反驳和辩护不会由“过去与现在”这一中立主题自然带出。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<h3>C. CEO Traits: Not Easy to Define</h3>\n<p>CEO特征难以定义</p>\n<h4>如果 C 是主旨，文章5段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“CEO特征难以定义”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出CEO有哪些特征难以界定</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>解释不同人的CEO特征概念为什么冲突</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>列出技能以显示无法提出清楚定义</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>讨论治理者为何也难确定CEO应有特征</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>以不同候选人再次说明特征定义困难</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<p>C把Not Easy to Define作为主要判断，文章实际却把新增要求列得相当具体：金融市场、公关、跨国供应链、技术业务及原有日常工作。要求复杂、多样，并不等于这些要求无法描述或定义。</p>\n<p>而且前后几段都在反复解释薪酬，既没有比较不同的CEO概念，也没有展示定义上的争议。若按C来写，中间的技能清单需要证明“说不清”，现在它反而用来把为什么薪酬高说得更清楚。</p>\n<p><strong>技能要求很多、工作复杂，是否就是“CEO特征难以定义”？</strong></p>\n<p>不是。C把工作难度改成定义困难，又没有接住全文反复讨论的薪酬依据。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<h3>D. CEOs’ Challenges of Today</h3>\n<p>今天CEO面临的挑战</p>\n<h4>如果 D 是主旨，文章5段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“今天CEO所面临的挑战”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>从高薪引出现任CEO面临哪些挑战</td>\n<td>先承认一种容易引起争议的现象</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍当下人才与业务环境的压力</td>\n<td>再说这种现象为什么会出现</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>集中列举经营中的各项新困难</td>\n<td>接着说现在要做的事比以前更多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>讨论更严格治理给现任CEO带来的挑战</td>\n<td>再反驳一种看起来常见的解释</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>说明如何应对招聘与股价要求，收束当下挑战</td>\n<td>最后补两点来说明为什么说得通</td>\n</tr>\n</tbody></table>\n<p>D确实概括了第三段的大量内容，全球化和技术业务都是今天的挑战。但题目问整篇标题，不能只看最长的一个段落。前面为何强调limited CEO talent与薪酬增幅，后面为何讨论外部候选人、股价和公司价值，D都没有给出共同的解释目的。</p>\n<p>这些挑战在文中是说明高薪有依据的原因之一。把原因提升成全文中心，就会把治理反证与企业收益这些后续论据挤到标题之外，也漏掉作者对高薪争议的明确回应。</p>\n<p><strong>第三段写得长，是否意味着其中的工作挑战就是整篇要回答的问题？</strong></p>\n<p>不是。挑战解释了为什么岗位值得高薪，整篇进一步回答的是高薪能否成立，D把一项理由扩大成了全文主题。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The most suitable title for this text would be ______.</strong></p>\n<h3>30题结论</h3>\n<p><strong>30. A. CEOs Are Not Overpaid</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>CEOs Are Not Overpaid / CEO并未被支付过高薪酬</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查29题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. increase corporate value</li>\n<li>C. boost the efficiency of CEOs</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>CEOs Are Not Overpaid</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>CEO的高薪有可以说明的依据：人才与岗位要求发生变化，相关做法还会增加公司价值，不能只凭薪酬高就认定支付过头。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A接上题干，说高薪通过增加公司价值得到解释；C说高薪通过提高CEO效率得到解释。第一遍，段尾明确给出公司价值增加，但CEO效率也可能是影响这个结果的中间因素，所以两项同时留下。问题不是它们能否在现实中同时发生，而是文章实际拿哪一个结果完成了辩护。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。全文现在形成的论证是：机会增多、人才有限，岗位还要求更多金融、公关、全球经营与技术知识，因此高薪不能只理解为占便宜；最后再用公司价值增加，说明企业这一方也获得收益。A正好落在这条论证的收益端，直接回答公司为什么有理由支付高薪。</p>\n<p>再看C。提高效率需要说明同一位CEO在拿到更高薪酬之后，如何用更少时间或投入完成更多工作。文中“需要更多技能”“面对更难工作”说的是岗位要求更高，不是高薪已经使某个人变得更快、更省力。即使薪酬激励可能有这种作用，也还要补一条原文没有展开的作用路径，才能把efficiency同公司价值连接。</p>\n<p>回到第5段，作者最终写出的不是效率考核结果，而是build up corporate value，并用not just for the CEO把受益范围扩到公司。A既保留这个局部结果，也完成全文对高薪的辩护。C可能是现实中的一个作用机制，却没有成为本文已经建立的理由，因此这题最终选A。</p>\n<blockquote>\n<p><strong>29题选A。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. C</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. A</strong></p>\n<p><strong>30. A</strong></p>\n","analysisStartIndex":30,"articleImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDsAAAXkCAIAAABLzpc7AAEAAElEQVR4nOzdeVxM7f84/mtmmmnfI2ukkkIRUpGlJIpCiy1L9n277W5u++4m2deELNlCIZF9y5KSRLRIad9r9vP74/W9z+98pmRKbnN7v55/9OicOXPOdc6c5Xpd22FRFEUQQgghhBBCSCGxf3UCEEIIIYQQQuibMGJBCCGEEEIIKS6MWBBCCCGEEEKKCyMWhBBCCCGEkOLCiAUhhBBCCCGkuDBiQQghhBBCCCkujFgQQgghhBBCigsjFoQQQgghhJDiwogFIYQQQgghpLgwYkEIIYQQQggpLoxYEEIIIYQQQooLIxaEEEIIIYSQ4sKIBSGEEEIIIaS4MGJBCCGEEEIIKS6MWBBCCCGEEEKKCyMWhBBCCCGEkOLCiAUhhBBCCCGkuDBiQQghhBBCCCkujFgQQgghhBBCigsjFoQQQgghhJDiwogFIYQQQgghpLgwYkEIIYQQQggpLoxYEEIIIYQQQooLIxaEEEIIIYSQ4sKIBSGEEEIIIaS4MGJBCCGEEEIIKS6MWBBCCCGEEEKKCyMWhBBCCCGEkOLCiAUhhBBCCCGkuDBiQQghhBBCCCkujFgQQgghhBBCigsjFoQQQgghhJDiwogFIYQQQgghpLgwYkEIIYQQQggpLoxYEEIIIYQQQooLIxaEEEIIIYSQ4sKIBSGEEEIIIaS4MGJBCCGEEEIIKS6MWBBCCCGEEEKKCyMWhBBCCCGEkOLCiAUhhBBCCCGkuDBiQQghhBBCCCkujFgQQgghhBBCigsjFoQQQgghhJDiwogFIYQQQgghpLgwYkEIIYQQQggpLoxYEEIIIYQQQooLIxaEEEIIIYSQ4sKIBSGEEEIIIaS4MGJBCCGEEEIIKS6MWBBCCCGEEEKKCyMWhBBCCCGEkOLCiAUhhBBCCCGkuDBiQQghhBBCCCkujFgQQgghhBBCigsjFoQQQgghhJDiwogFIYQQQgghpLgwYkEIIYQQQggpLoxYEEIIIYQQQooLIxaEEEIIIYSQ4sKIBSGEEEIIIaS4MGJBCCGEEEIIKS6MWBBCCCGEEEKKCyMWhBBCCCGEkOLCiAUhhBBCCCGkuDBiQQghhBBCCCkujFgQQgghhBBCigs let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function centerHorizontal(){
  requestAnimationFrame(()=>{
    if(!leftPane)return;
    if(zoomLevel>100&&leftPane.scrollWidth>leftPane.clientWidth){
      leftPane.scrollLeft=Math.max(0,Math.round((leftPane.scrollWidth-leftPane.clientWidth)/2));
    }else{
      leftPane.scrollLeft=0;
    }
    updateDragCursor();
  });
}
function updateDragCursor(){
  if(!leftPane)return;
  if(zoomLevel>100&&(leftPane.scrollWidth>leftPane.clientWidth||leftPane.scrollHeight>leftPane.clientHeight)){
    leftPane.style.cursor='grab';
  }else{
    leftPane.style.cursor='';
  }
}
function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
  centerHorizontal();
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+5);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-5);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
const pLeft=document.getElementById('panLeft');
if(pLeft)pLeft.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.max(0,leftPane.scrollLeft-120);};
const pRight=document.getElementById('panRight');
if(pRight)pRight.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.min(leftPane.scrollWidth-leftPane.clientWidth,leftPane.scrollLeft+120);};
const pCenter=document.getElementById('panCenter');
if(pCenter)pCenter.onclick=()=>centerHorizontal();
setupDragToPan(document.getElementById('leftPane'));
setTimeout(()=>applyZoom(zoomLevel),60);
const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
</script></body></html>
