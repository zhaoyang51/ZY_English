<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**According to Paragraph 1, keeping unsafe aging drivers off the road ______.**\n\n> 根据首段，让不安全的高龄司机不再上路，这件事怎么样？\n\n题型：**段落判断题**。","html":"<h2>31题题干</h2>\n<p><strong>According to Paragraph 1, keeping unsafe aging drivers off the road ______.</strong></p>\n<blockquote><p>根据首段，让不安全的高龄司机不再上路，这件事怎么样？</p>\n</blockquote>\n<p>题型：<strong>段落判断题</strong>。</p>\n","articleRects":[],"questionRects":[[153,128,28,17],[196,128,664,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**The American Medical Association’s advice ______.**\n\n> 美国医学会的建议得到了怎样的回应？\n\n题型：**回应概括题**。","html":"<h2>32题题干</h2>\n<p><strong>The American Medical Association’s advice ______.</strong></p>\n<blockquote><p>美国医学会的建议得到了怎样的回应？</p>\n</blockquote>\n<p>题型：<strong>回应概括题</strong>。</p>\n","articleRects":[],"questionRects":[[153,382,28,17],[242,382,383,17]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**According to Dugan, efforts to keep older drivers safe ______.**\n\n> 根据Dugan的看法，保障老年驾驶者安全的工作需要怎样推进？\n\n题型：**人物判断题**。","html":"<h2>33题题干</h2>\n<p><strong>According to Dugan, efforts to keep older drivers safe ______.</strong></p>\n<blockquote><p>根据Dugan的看法，保障老年驾驶者安全的工作需要怎样推进？</p>\n</blockquote>\n<p>题型：<strong>人物判断题</strong>。</p>\n","articleRects":[],"questionRects":[[153,636,28,17],[197,636,532,21]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**Some older drivers have trouble 路管理、Elizabeth Dugan、更好证据、驾驶者不安全；似乎确有作用、亲自到场、驾照更新、减少百分之三十一、八十五岁及以上、视力测试、没有益处；老年驾驶者、眼科医生、负担不起、忙得不可开交、驾驶困难、转头、记住、座椅设置；其他车辆、自动驾驶汽车、不会解决、车祸问题、人类驾驶者、但是、改善安全、百岁寿命、我们需要汽车、九十岁的人、舒适驾驶。</p>\n<p>到这里还不能自然地说清楚：让老年司机安全驾驶有哪些障碍，各州怎样规定医生报告，哪些措施已有研究支持，Dugan最终建议什么。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> According to Paragraph 1, keeping unsafe aging drivers off the road ______.\n>\n> 根据第1段，让不安全的高龄司机不再上路，这件事怎么样？\n\n题干已经给出`Paragraph 1`，我们直接回第一段。`keeping unsafe aging drivers off the road`说的是让那些开车已经不安全的高龄司机不再上路，空格要补的是这件事怎么样。\n\n> 原文参考：\n>\n> One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys. “It’s a complete life-changer” when someone stops—or is forced to stop—driving, said **[xxx]** risk manager Anne M. Menke.\n>\n> 开始精读：\n>\n> One of the biggest challenges / in keeping unsafe aging drivers off the road / is convincing them / that it’s time to turn over the keys. / “It’s a complete life-changer” / when someone stops—or is forced to stop—driving, / said **[xxx]** risk manager Anne M. Menke.\n>\n> 最大的挑战之一 / 在让不安全的高龄司机不再上路这件事中 / 是说服他们 / 该交出车钥匙了。 / “这会完全改变生活” / 当一个人停止——或者被迫停止——开车时，/ **[xxx]**风险经理Anne M. Menke说。\n\n首句里就有题干的`keeping unsafe aging drivers off the road`。前面接着`One of the biggest challenges`，后面又用`is convincing them`说出难在什么地方：要让这些司机接受自己该交出钥匙了。\n\n这里的`turn over the keys`和下一句的`stops ... driving`连着看，就是交出钥匙、不再开车。Menke又说，这会完全改变一个人的生活。这样我们就能接上两句话：让司机停止驾驶，难的一点是说服本人；而本人面对的，是整个生活都会发生改变。\n\n接下来逐项看。","html":"<h2>31题</h2>\n<blockquote><p>According to Paragraph 1, keeping unsafe aging drivers off the road ______.</p>\n<p>根据第1段，让不安全的高龄司机不再上路，这件事怎么样？</p>\n</blockquote>\n<p>题干已经给出<code>Paragraph 1</code>，我们直接回第一段。<code>keeping unsafe aging drivers off the road</code>说的是让那些开车已经不安全的高龄司机不再上路，空格要补的是这件事怎么样。</p>\n<blockquote><p>原文参考：</p>\n<p>One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys. “It’s a complete life-changer” when someone stops—or is forced to stop—driving, said <strong>[xxx]</strong> risk manager Anne M. Menke.</p>\n<p>开始精读：</p>\n<p>One of the biggest challenges / in keeping unsafe aging drivers off the road / is convincing them / that it’s time to turn over the keys. / “It’s a complete life-changer” / when someone stops—or is forced to stop—driving, / said <strong>[xxx]</strong> risk manager Anne M. Menke.</p>\n<p>最大的挑战之一 / 在让不安全的高龄司机不再上路这件事中 / 是说服他们 / 该交出车钥匙了。 / “这会完全改变生活” / 当一个人停止——或者被迫停止——开车时，/ <strong>[xxx]</strong>风险经理Anne M. Menke说。</p>\n</blockquote>\n<p>首句里就有题干的<code>keeping unsafe aging drivers off the road</code>。前面接着<code>One of the biggest challenges</code>，后面又用<code>is convincing them</code>说出难在什么地方：要让这些司机接受自己该交出钥匙了。</p>\n<p>这里的<code>turn over the keys</code>和下一句的<code>stops ... driving</code>连着看，就是交出钥匙、不再开车。Menke又说，这会完全改变一个人的生活。这样我们就能接上两句话：让司机停止驾驶，难的一点是说服本人；而本人面对的，是整个生活都会发生改变。</p>\n<p>接下来逐项看。</p>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22]],"questionRects":[[153,128,28,17],[196,128,664,22],[212,170,254,22],[196,213,310,22],[196,255,347,22],[196,297,350,17]],"scrollTarget":"article","meta":{"kind":"question","qid":"31","paragraphPids":[0]}},{"section":"31题","raw":"### A. is a new safety measure\n\n> 是一项新的安全措施\n\n把A接回题干，它说的是：让不安全的高龄司机不再上路，是一项新的安全措施。\n\n`safety measure`说的是保障安全的做法，和题干中让`unsafe`司机不再上路这件事能接上。A还多说了一个`new`，也就是这项做法是新的。我们回到刚读完的首段，看介绍交出钥匙和停止驾驶的两句话里，有没有说它是最近才开始采用的：\n\n> One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.\n>\n> “It’s a complete life-changer” when someone stops—or is forced to stop—driving, said **[xxx]** risk manager Anne M. Menke.\n\n第一句说的是劝这些司机交出钥匙很难。第二句说的是，人一旦停止开车，生活就会大变。这里的`when someone stops ... driving`是在说停止开车时会发生什么，没有告诉我们“让不安全的司机停止驾驶”这项做法从什么时候开始。\n\n所以，A里的安全目的能理解，但`new`还需要“最近才提出或开始采用”这件事，首段没有写。\n\n**劝司机交出钥匙很难、停驾又会改变生活，这两点能说明这项做法是新出现的吗？**\n\n不能。这两句说了停驾的困难和影响，没有交代这是一项新措施。\n\n**第一轮判断：A排除。**","html":"<h3>A. is a new safety measure</h3>\n<blockquote><p>是一项新的安全措施</p>\n</blockquote>\n<p>把A接回题干，它说的是：让不安全的高龄司机不再上路，是一项新的安全措施。</p>\n<p><code>safety measure</code>说的是保障安全的做法，和题干中让<code>unsafe</code>司机不再上路这件事能接上。A还多说了一个<code>new</code>，也就是这项做法是新的。我们回到刚读完的首段，看介绍交出钥匙和停止驾驶的两句话里，有没有说它是最近才开始采用的：</p>\n<blockquote><p>One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.</p>\n<p>“It’s a complete life-changer” when someone stops—or is forced to stop—driving, said <strong>[xxx]</strong> risk manager Anne M. Menke.</p>\n</blockquote>\n<p>第一句说的是劝这些司机交出钥匙很难。第二句说的是，人一旦停止开车，生活就会大变。这里的<code>when someone stops ... driving</code>是在说停止开车时会发生什么，没有告诉我们“让不安全的司机停止驾驶”这项做法从什么时候开始。</p>\n<p>所以，A里的安全目的能理解，但<code>new</code>还需要“最近才提出或开始采用”这件事，首段没有写。</p>\n<p><strong>劝司机交出钥匙很难、停驾又会改变生活，这两点能说明这项做法是新出现的吗？</strong></p>\n<p>不能。这两句说了停驾的困难和影响，没有交代这是一项新措施。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22]],"questionRects":[[212,170,254,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"A","paragraphPids":[0]}},{"section":"31题","raw":"### B. has become a **[xxx]** issue\n\n> 已经成为一个**[xxx]**问题\n\n把B接回题干，它说的是：让不安全的高龄司机不再上路，已经成为一个**[xxx]**问题。\n\nB中能读懂的是`has become`和`issue`。刚才第一句用了`challenges`，也把让司机停止驾驶说成一件不好处理的事。我们回看这句，看看它究竟说这个问题难在哪里：\n\n> One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.\n\n这里能读出的具体内容是：要让这些司机不再上路，就得说服他们交出钥匙，而说服他们是最大的挑战之一。\n\n再看B。`issue`只告诉我们它在说一个问题，前面的**[xxx]**才告诉我们这是怎样的问题。这个词现在不认识，我们还不知道B是不是在说“很难让司机接受停驾”。\n\n所以，B和首句都谈到了让这些司机停止驾驶，但首句已经说出“难在说服本人”，B中对应的那部分还读不出来。\n\n**只读懂`issue`是“问题”，就能确定B也在说“说服司机停驾很难”吗？**\n\n还不能。**[xxx]**的意思没有读清，B先留下。\n\n**第一轮判断：B保留。**","html":"<h3>B. has become a <strong>[xxx]</strong> issue</h3>\n<blockquote><p>已经成为一个<strong>[xxx]</strong>问题</p>\n</blockquote>\n<p>把B接回题干，它说的是：让不安全的高龄司机不再上路，已经成为一个<strong>[xxx]</strong>问题。</p>\n<p>B中能读懂的是<code>has become</code>和<code>issue</code>。刚才第一句用了<code>challenges</code>，也把让司机停止驾驶说成一件不好处理的事。我们回看这句，看看它究竟说这个问题难在哪里：</p>\n<blockquote><p>One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.</p>\n</blockquote>\n<p>这里能读出的具体内容是：要让这些司机不再上路，就得说服他们交出钥匙，而说服他们是最大的挑战之一。</p>\n<p>再看B。<code>issue</code>只告诉我们它在说一个问题，前面的<strong>[xxx]</strong>才告诉我们这是怎样的问题。这个词现在不认识，我们还不知道B是不是在说“很难让司机接受停驾”。</p>\n<p>所以，B和首句都谈到了让这些司机停止驾驶，但首句已经说出“难在说服本人”，B中对应的那部分还读不出来。</p>\n<p><strong>只读懂<code>issue</code>是“问题”，就能确定B也在说“说服司机停驾很难”吗？</strong></p>\n<p>还不能。<strong>[xxx]</strong>的意思没有读清，B先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22]],"questionRects":[[196,213,310,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"31","option":"B","paragraphPids":[0]}},{"section":"31题","raw":"### C. can be a tough task to complete\n\n> 可能是一项很难完成的任务\n\n把C接回题干，它说的是：让不安全的高龄司机不再上路，可能很难做到。\n\nC里的`tough task`说任务难，刚才首句也有`biggest challenges`。它们说的又都是让这些司机不再开车，所以先把首句拿回来。后面Menke的`complete life-changer`紧接着说停驾会怎样，也一起看：\n\n> One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.\n>\n> “It’s a complete life-changer” when someone stops—or is forced to stop—driving, said **[xxx]** risk manager Anne M. Menke.\n\n第一句用了`convincing them`，要说服的是这些司机本人，要他们接受的是`it’s time to turn over the keys`——自己该交出钥匙、不再开车了。这件事被放在`One of the biggest challenges`后面，说明让本人接受就很难。\n\n下一句继续说，停止驾驶会完全改变一个人的生活。前面要劝他接受的，正是这样一个生活会大变的决定。\n\n`task to complete`指的仍是题干中的让这些司机不再上路；`tough`对应劝他们交钥匙时遇到的困难。C只说可能很难做到，没有把“难”说成“做不到”。\n\n**说服本人交出钥匙就是一大挑战，这能不能说明让这些司机停止驾驶是一项难完成的任务？**\n\n能。让他们不再开车，需要他们接受停驾，而原文已经明确说这一步很难。\n\n**第一轮判断：C保留。**","html":"<h3>C. can be a tough task to complete</h3>\n<blockquote><p>可能是一项很难完成的任务</p>\n</blockquote>\n<p>把C接回题干，它说的是：让不安全的高龄司机不再上路，可能很难做到。</p>\n<p>C里的<code>tough task</code>说任务难，刚才首句也有<code>biggest challenges</code>。它们说的又都是让这些司机不再开车，所以先把首句拿回来。后面Menke的<code>complete life-changer</code>紧接着说停驾会怎样，也一起看：</p>\n<blockquote><p>One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.</p>\n<p>“It’s a complete life-changer” when someone stops—or is forced to stop—driving, said <strong>[xxx]</strong> risk manager Anne M. Menke.</p>\n</blockquote>\n<p>第一句用了<code>convincing them</code>，要说服的是这些司机本人，要他们接受的是<code>it’s time to turn over the keys</code>——自己该交出钥匙、不再开车了。这件事被放在<code>One of the biggest challenges</code>后面，说明让本人接受就很难。</p>\n<p>下一句继续说，停止驾驶会完全改变一个人的生活。前面要劝他接受的，正是这样一个生活会大变的决定。</p>\n<p><code>task to complete</code>指的仍是题干中的让这些司机不再上路；<code>tough</code>对应劝他们交钥匙时遇到的困难。C只说可能很难做到，没有把“难”说成“做不到”。</p>\n<p><strong>说服本人交出钥匙就是一大挑战，这能不能说明让这些司机停止驾驶是一项难完成的任务？</strong></p>\n<p>能。让他们不再开车，需要他们接受停驾，而原文已经明确说这一步很难。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22]],"questionRects":[[196,255,347,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"31","option":"C","paragraphPids":[0]}},{"section":"31题","raw":"### D. will be beneficial to their health\n\n> 将有益于他们的健康\n\n把D接回题干，它说的是：让不安全的高龄司机不再上路，会有益于这些司机的健康。\n\n`beneficial to their health`说停驾以后身体会得到好处。刚才首段中谈到停驾以后会怎样的，是Menke这句话：\n\n> “It’s a complete life-changer” when someone stops—or is forced to stop—driving, said **[xxx]** risk manager Anne M. Menke.\n\n原文的`life-changer`说的是生活会改变，`complete`又把这种改变说得很大。这句话没有接着说身体会变好，甚至没有说这种生活改变对本人是好是坏。\n\nD却用了`beneficial`，明确说有好处，而且把好处限定在`health`，也就是身体健康上。“生活大变”和“身体得到好处”还差着一层：前一句没告诉我们停驾以后身体究竟会怎样。\n\n题干中的`unsafe`也只是在说这些司机开车不安全。让他们不再开车，并不能单凭这句话就得到“他们的身体会因此变好”。\n\n**Menke说停驾会完全改变生活，这就等于说停驾有益于身体健康吗？**\n\n不等于。她说了生活改变，没有说健康改善。\n\n**第一轮判断：D排除。**","html":"<h3>D. will be beneficial to their health</h3>\n<blockquote><p>将有益于他们的健康</p>\n</blockquote>\n<p>把D接回题干，它说的是：让不安全的高龄司机不再上路，会有益于这些司机的健康。</p>\n<p><code>beneficial to their health</code>说停驾以后身体会得到好处。刚才首段中谈到停驾以后会怎样的，是Menke这句话：</p>\n<blockquote><p>“It’s a complete life-changer” when someone stops—or is forced to stop—driving, said <strong>[xxx]</strong> risk manager Anne M. Menke.</p>\n</blockquote>\n<p>原文的<code>life-changer</code>说的是生活会改变，<code>complete</code>又把这种改变说得很大。这句话没有接着说身体会变好，甚至没有说这种生活改变对本人是好是坏。</p>\n<p>D却用了<code>beneficial</code>，明确说有好处，而且把好处限定在<code>health</code>，也就是身体健康上。“生活大变”和“身体得到好处”还差着一层：前一句没告诉我们停驾以后身体究竟会怎样。</p>\n<p>题干中的<code>unsafe</code>也只是在说这些司机开车不安全。让他们不再开车，并不能单凭这句话就得到“他们的身体会因此变好”。</p>\n<p><strong>Menke说停驾会完全改变生活，这就等于说停驾有益于身体健康吗？</strong></p>\n<p>不等于。她说了生活改变，没有说健康改善。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22]],"questionRects":[[196,297,350,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"D","paragraphPids":[0]}},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n现在留下B和C。C里的“难完成”能接上首句的“说服他们是最大的挑战之一”；B只读出了“成为一个**[xxx]**问题”，怎样的问题还不清楚。先把这两项留着，后面再回来比较。","html":"<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>现在留下B和C。C里的“难完成”能接上首句的“说服他们是最大的挑战之一”；B只读出了“成为一个<strong>[xxx]</strong>问题”，怎样的问题还不清楚。先把这两项留着，后面再回来比较。</p>\n","articleRects":[],"questionRects":[[153,128,28,17],[196,128,664,22],[212,170,254,22],[196,213,310,22],[196,255,347,22],[196,297,350,17]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> The American Medical Association’s advice ______.  \n> 美国医学会的建议得到了怎样的回应？\n\n医学会名称定位第2段。完整读建议在什么条件下报告，再按Some、others、a few分清各州对医生报告的不同规定。\n\n> 原文参考：\n> \n> “The American Medical Association advises physicians that ‘in situations where clear evidence of **[xxx]** driving impairment implies a strong threat to patient and public safety, and where the physician’s advice to discontinue driving **[xxx]** is ignored, it is desirable and **[xxx]** to notify the Department of Motor Vehicles,’” Menke wrote. “Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a **[xxx]** of **[xxx]**. There could be **[xxx]** and penalties if a physician does not act in accordance with state laws on reporting and **[xxx]**,” she **[xxx]**.\n> \n> 开始精读：\n> \n> “The American Medical Association advises physicians that / ‘in situations where clear evidence of **[xxx]** driving impairment implies a strong threat to patient and public safety, / and where the physician’s advice to discontinue driving **[xxx]** is ignored, / it is desirable and **[xxx]** to notify the Department of Motor Vehicles,’” Menke wrote. / “Some states require physicians to report, / others allow but do not mandate reports, / while a few consider a report a **[xxx]** of **[xxx]**. / There could be **[xxx]** and penalties / if a physician does not act in accordance with state laws on reporting and **[xxx]**,” she **[xxx]**.\n> \n> “美国医学会建议医生 / ‘当明确证据表明**[xxx]**驾驶能力受损意味着对患者及公众安全构成严重威胁 / 且医生停止驾驶**[xxx]**的建议遭忽视时 / 通知机动车辆管理部门是可取且**[xxx]**的’”Menke写道。 / “一些州要求医生报告 / 另一些州允许但不强制报告 / 少数州认为报告是对**[xxx]**的**[xxx]**。 / 可能会有**[xxx]**和惩罚 / 如果医生行为不符合州关于报告和**[xxx]**的法律”她**[xxx]**。\n\n接下来按A—D逐项看。","html":"<h2>32题</h2>\n<blockquote><p>The American Medical Association’s advice ______.<br />\n美国医学会的建议得到了怎样的回应？</p>\n</blockquote>\n<p>医学会名称定位第2段。完整读建议在什么条件下报告，再按Some、others、a few分清各州对医生报告的不同规定。</p>\n<blockquote><p>原文参考：</p>\n<p>“The American Medical Association advises physicians that ‘in situations where clear evidence of <strong>[xxx]</strong> driving impairment implies a strong threat to patient and public safety, and where the physician’s advice to discontinue driving <strong>[xxx]</strong> is ignored, it is desirable and <strong>[xxx]</strong> to notify the Department of Motor Vehicles,’” Menke wrote. “Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a <strong>[xxx]</strong> of <strong>[xxx]</strong>. There could be <strong>[xxx]</strong> and penalties if a physician does not act in accordance with state laws on reporting and <strong>[xxx]</strong>,” she <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>“The American Medical Association advises physicians that / ‘in situations where clear evidence of <strong>[xxx]</strong> driving impairment implies a strong threat to patient and public safety, / and where the physician’s advice to discontinue driving <strong>[xxx]</strong> is ignored, / it is desirable and <strong>[xxx]</strong> to notify the Department of Motor Vehicles,’” Menke wrote. / “Some states require physicians to report, / others allow but do not mandate reports, / while a few consider a report a <strong>[xxx]</strong> of <strong>[xxx]</strong>. / There could be <strong>[xxx]</strong> and penalties / if a physician does not act in accordance with state laws on reporting and <strong>[xxx]</strong>,” she <strong>[xxx]</strong>.</p>\n<p>“美国医学会建议医生 / ‘当明确证据表明<strong>[xxx]</strong>驾驶能力受损意味着对患者及公众安全构成严重威胁 / 且医生停止驾驶<strong>[xxx]</strong>的建议遭忽视时 / 通知机动车辆管理部门是可取且<strong>[xxx]</strong>的’”Menke写道。 / “一些州要求医生报告 / 另一些州允许但不强制报告 / 少数州认为报告是对<strong>[xxx]</strong>的<strong>[xxx]</strong>。 / 可能会有<strong>[xxx]</strong>和惩罚 / 如果医生行为不符合州关于报告和<strong>[xxx]</strong>的法律”她<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23]],"questionRects":[[153,382,28,17],[242,382,383,17],[234,424,284,22],[233,467,326,21],[233,509,338,22],[234,551,312,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"32","paragraphPids":[1]}},{"section":"32题","raw":"### A. has won support from drivers\n\n> 赢得了司机支持\n\n把A接回题干，它说的是：医学会建议已得到司机的支持。\n\nA说司机支持，回第2段看医学会建议怎样处置不肯停驾的人。\n\n> Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a **[xxx]** of **[xxx]**.\n\n建议针对的是已构成安全威胁、却不听医生劝告停止驾驶的人，之后才考虑向管理部门报告。段落没有收集司机赞成建议的反馈。\n\n后面的回应差异来自各州法规，也不是司机态度。A把建议所针对的人改成了公开支持它的人。\n\n**本段有没有说司机支持医生报告这种做法？**\n\n没有。A缺少司机的支持表态。\n\n**第一轮判断：A排除。**","html":"<h3>A. has won support from drivers</h3>\n<blockquote><p>赢得了司机支持</p>\n</blockquote>\n<p>把A接回题干，它说的是：医学会建议已得到司机的支持。</p>\n<p>A说司机支持，回第2段看医学会建议怎样处置不肯停驾的人。</p>\n<blockquote><p>Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a <strong>[xxx]</strong> of <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>建议针对的是已构成安全威胁、却不听医生劝告停止驾驶的人，之后才考虑向管理部门报告。段落没有收集司机赞成建议的反馈。</p>\n<p>后面的回应差异来自各州法规，也不是司机态度。A把建议所针对的人改成了公开支持它的人。</p>\n<p><strong>本段有没有说司机支持医生报告这种做法？</strong></p>\n<p>没有。A缺少司机的支持表态。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23]],"questionRects":[[234,424,284,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"A","paragraphPids":[1]}},{"section":"32题","raw":"### B. is generally considered **[xxx]**\n\n> 普遍被认为是**[xxx]**的\n\n把B接回题干，它说的是：医学会建议被普遍作出某种**[xxx]**评价。\n\nB说普遍有一种评价，回第2段看Some、others、a few怎样分别介绍。\n\n> Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a **[xxx]** of **[xxx]**.\n\n有些州要求报告，有些允许但不强制，还有少数州对报告采取另一种看法。作者明确列出不同处理方式。\n\nB核心评价词未知，但generally把它写成较一致的整体评价，不能从这份差异清单直接得到。\n\n**原文分别列出不同规定，能否只凭此确认一个普遍相同的评价？**\n\n不能。D直接保留差异，B没有完整可核对的评价。\n\n**第一轮判断：B排除。**","html":"<h3>B. is generally considered <strong>[xxx]</strong></h3>\n<blockquote><p>普遍被认为是<strong>[xxx]</strong>的</p>\n</blockquote>\n<p>把B接回题干，它说的是：医学会建议被普遍作出某种<strong>[xxx]</strong>评价。</p>\n<p>B说普遍有一种评价，回第2段看Some、others、a few怎样分别介绍。</p>\n<blockquote><p>Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a <strong>[xxx]</strong> of <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>有些州要求报告，有些允许但不强制，还有少数州对报告采取另一种看法。作者明确列出不同处理方式。</p>\n<p>B核心评价词未知，但generally把它写成较一致的整体评价，不能从这份差异清单直接得到。</p>\n<p><strong>原文分别列出不同规定，能否只凭此确认一个普遍相同的评价？</strong></p>\n<p>不能。D直接保留差异，B没有完整可核对的评价。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23]],"questionRects":[[233,467,326,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"B","paragraphPids":[1]}},{"section":"32题","raw":"### C. is widely dismissed as unnecessary\n\n> 被广泛认为没有必要而否定\n\n把C接回题干，它说的是：医学会建议被广泛视为无必要。\n\nC说广泛否定为没必要，回第2段看require physicians to report。\n\n> Some states require physicians to report, others allow but do not mandate reports\n\n一些州明确要求医生报告，另一些至少允许报告。并不是都把报告当成无必要。\n\n少数州有不同处理，也不能代替各州整体。C的widely dismissed把这份混合回应夸成普遍否定。\n\n**既有要求报告的州，也有允许的州，能概括成广泛认为没必要吗？**\n\n不能。C没有保留各州的差异。\n\n**第一轮判断：C排除。**","html":"<h3>C. is widely dismissed as unnecessary</h3>\n<blockquote><p>被广泛认为没有必要而否定</p>\n</blockquote>\n<p>把C接回题干，它说的是：医学会建议被广泛视为无必要。</p>\n<p>C说广泛否定为没必要，回第2段看require physicians to report。</p>\n<blockquote><p>Some states require physicians to report, others allow but do not mandate reports</p>\n</blockquote>\n<p>一些州明确要求医生报告，另一些至少允许报告。并不是都把报告当成无必要。</p>\n<p>少数州有不同处理，也不能代替各州整体。C的widely dismissed把这份混合回应夸成普遍否定。</p>\n<p><strong>既有要求报告的州，也有允许的州，能概括成广泛认为没必要吗？</strong></p>\n<p>不能。C没有保留各州的差异。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23]],"questionRects":[[233,509,338,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"C","paragraphPids":[1]}},{"section":"32题","raw":"### D. has met with different responses\n\n> 得到了不同回应\n\n把D接回题干，它说的是：医学会的报告建议，在各州得到不同处理。\n\nD说不同回应，回第2段按三类州的做法逐项看。\n\n> Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a **[xxx]** of **[xxx]**.\n\n一类要求医生报告，一类允许但不强制，另一小类又有不同判断。医生若不按所在州规则行动，还可能受罚。\n\nD不必知道每个法律生词，也能由三组不同要求得出回应不一致。\n\n**要求、允许但不强制、另有处理这三类，是否说明回应不同？**\n\n是。D能够概括整段列举。\n\n**第一轮判断：D保留。**","html":"<h3>D. has met with different responses</h3>\n<blockquote><p>得到了不同回应</p>\n</blockquote>\n<p>把D接回题干，它说的是：医学会的报告建议，在各州得到不同处理。</p>\n<p>D说不同回应，回第2段按三类州的做法逐项看。</p>\n<blockquote><p>Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a <strong>[xxx]</strong> of <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>一类要求医生报告，一类允许但不强制，另一小类又有不同判断。医生若不按所在州规则行动，还可能受罚。</p>\n<p>D不必知道每个法律生词，也能由三组不同要求得出回应不一致。</p>\n<p><strong>要求、允许但不强制、另有处理这三类，是否说明回应不同？</strong></p>\n<p>是。D能够概括整段列举。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23]],"questionRects":[[234,551,312,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"32","option":"D","paragraphPids":[1]}},{"section":"32题","raw":"### 32题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","html":"<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n","articleRects":[],"questionRects":[[153,382,28,17],[242,382,383,17],[234,424,284,22],[233,467,326,21],[233,509,338,22],[234,551,312,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> According to Dugan, efforts to keep older drivers safe ______.  \n> 根据Dugan的看法，保障老年驾驶者安全的工作需要怎样推进？\n\nDugan定位第3段。先看不同专业怎样处理困难，再读缺少统一研究机构及需要更好证据，找当前工作的问题而非别段已有成效。\n\n> 原文参考：\n> \n> Part of the problem in keeping older drivers safe is that the difficulties are addressed piecemeal by different professions with different focuses, including **[xxx]**, highway administration officials, **[xxx]** engineers and others, said **[xxx]** Elizabeth Dugan. “There’s not a National Institute of Older Driver Studies,” she said. “We need better evidence on what makes drivers unsafe” and what can help, said Dugan.\n> \n> 开始精读：\n> \n> Part of the problem in keeping older drivers safe / is that the difficulties are addressed piecemeal by different professions with different focuses, / including **[xxx]**, highway administration officials, **[xxx]** engineers and others, / said **[xxx]** Elizabeth Dugan. / “There’s not a National Institute of Older Driver Studies,” she said. / “We need better evidence on what makes drivers unsafe” and what can help, said Dugan.\n> \n> 保障老年驾驶者安全所存在的问题之一 / 是不同专业带着不同侧重点零散处理这些困难 / 包括**[xxx]**、公路管理官员、**[xxx]**工程师等 / **[xxx]**Elizabeth Dugan说。 / “并没有一个全国老年驾驶者研究所”她说。 / “我们需要更好的证据了解是什么让驾驶者不安全”以及什么有帮助Dugan说。\n\n接下来按A—D逐项看。","html":"<h2>33题</h2>\n<blockquote><p>According to Dugan, efforts to keep older drivers safe ______.<br />\n根据Dugan的看法，保障老年驾驶者安全的工作需要怎样推进？</p>\n</blockquote>\n<p>Dugan定位第3段。先看不同专业怎样处理困难，再读缺少统一研究机构及需要更好证据，找当前工作的问题而非别段已有成效。</p>\n<blockquote><p>原文参考：</p>\n<p>Part of the problem in keeping older drivers safe is that the difficulties are addressed piecemeal by different professions with different focuses, including <strong>[xxx]</strong>, highway administration officials, <strong>[xxx]</strong> engineers and others, said <strong>[xxx]</strong> Elizabeth Dugan. “There’s not a National Institute of Older Driver Studies,” she said. “We need better evidence on what makes drivers unsafe” and what can help, said Dugan.</p>\n<p>开始精读：</p>\n<p>Part of the problem in keeping older drivers safe / is that the difficulties are addressed piecemeal by different professions with different focuses, / including <strong>[xxx]</strong>, highway administration officials, <strong>[xxx]</strong> engineers and others, / said <strong>[xxx]</strong> Elizabeth Dugan. / “There’s not a National Institute of Older Driver Studies,” she said. / “We need better evidence on what makes drivers unsafe” and what can help, said Dugan.</p>\n<p>保障老年驾驶者安全所存在的问题之一 / 是不同专业带着不同侧重点零散处理这些困难 / 包括<strong>[xxx]</strong>、公路管理官员、<strong>[xxx]</strong>工程师等 / <strong>[xxx]</strong>Elizabeth Dugan说。 / “并没有一个全国老年驾驶者研究所”她说。 / “我们需要更好的证据了解是什么让驾驶者不安全”以及什么有帮助Dugan说。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22]],"questionRects":[[153,636,28,17],[197,636,532,21],[197,678,344,22],[197,720,305,17],[197,762,333,22],[197,805,324,21]],"scrollTarget":"article","meta":{"kind":"question","qid":"33","paragraphPids":[2]}},{"section":"33题","raw":"### A. have brought about big changes\n\n> 已带来很大变化\n\n把A接回题干，它说的是：Dugan认为这些安全工作已经产生重大改变。\n\nA说已带来大变化，回第3段看Dugan先指出什么问题。\n\n> the difficulties are addressed piecemeal by different professions with different focuses\n\n> We need better evidence on what makes drivers unsafe\n\n她说不同专业各有重点、零碎处理问题，又说需要更好的证据。这里是在指出现有工作的不足。\n\n原文没有用前后数据证明这些工作已经造成重大改变。A把需要改善的现状改成了成果评价。\n\n**指出工作分散并要求更好证据，就等于已经取得重大改变吗？**\n\n不等于。A没有本段的结果依据。\n\n**第一轮判断：A排除。**","html":"<h3>A. have brought about big changes</h3>\n<blockquote><p>已带来很大变化</p>\n</blockquote>\n<p>把A接回题干，它说的是：Dugan认为这些安全工作已经产生重大改变。</p>\n<p>A说已带来大变化，回第3段看Dugan先指出什么问题。</p>\n<blockquote><p>the difficulties are addressed piecemeal by different professions with different focuses</p>\n</blockquote>\n<blockquote><p>We need better evidence on what makes drivers unsafe</p>\n</blockquote>\n<p>她说不同专业各有重点、零碎处理问题，又说需要更好的证据。这里是在指出现有工作的不足。</p>\n<p>原文没有用前后数据证明这些工作已经造成重大改变。A把需要改善的现状改成了成果评价。</p>\n<p><strong>指出工作分散并要求更好证据，就等于已经取得重大改变吗？</strong></p>\n<p>不等于。A没有本段的结果依据。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22]],"questionRects":[[197,678,344,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"33","option":"A","paragraphPids":[2]}},{"section":"33题","raw":"### B. need to be well coordinated\n\n> 需要得到良好协调\n\n把B接回题干，它说的是：Dugan认为相关专业的安全工作需要更好地协调。\n\nB说需要协调，回第3段看piecemeal与different professions with different focuses。\n\n> the difficulties are addressed piecemeal by different professions with different focuses\n\n> There’s not a National Institute of Older Driver Studies\n\n不同专业都参与老年驾驶安全，却各自按不同重点处理。Dugan还以没有专门统筹的研究机构来说明这一状况。\n\n要把有关驾驶风险和帮助办法的证据整合起来，就需要这些工作更好衔接。B回应的是分散处理的问题。\n\n**既然不同专业各做一部分，改善方向是否包括让这些工作协调起来？**\n\n包括。B有具体问题作依据。\n\n**第一轮判断：B保留。**","html":"<h3>B. need to be well coordinated</h3>\n<blockquote><p>需要得到良好协调</p>\n</blockquote>\n<p>把B接回题干，它说的是：Dugan认为相关专业的安全工作需要更好地协调。</p>\n<p>B说需要协调，回第3段看piecemeal与different professions with different focuses。</p>\n<blockquote><p>the difficulties are addressed piecemeal by different professions with different focuses</p>\n</blockquote>\n<blockquote><p>There’s not a National Institute of Older Driver Studies</p>\n</blockquote>\n<p>不同专业都参与老年驾驶安全，却各自按不同重点处理。Dugan还以没有专门统筹的研究机构来说明这一状况。</p>\n<p>要把有关驾驶风险和帮助办法的证据整合起来，就需要这些工作更好衔接。B回应的是分散处理的问题。</p>\n<p><strong>既然不同专业各做一部分，改善方向是否包括让这些工作协调起来？</strong></p>\n<p>包括。B有具体问题作依据。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22]],"questionRects":[[197,720,305,17]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"33","option":"B","paragraphPids":[2]}},{"section":"33题","raw":"### C. have gained public **[xxx]**\n\n> 已获得公众的**[xxx]**\n\n把C接回题干，它说的是：Dugan认为相关工作已经得到公众的某种**[xxx]**。\n\nC说获得公众某种回应，回第3段看列举的参与者。\n\n> different professions with different focuses\n\n> We need better evidence on what makes drivers unsafe\n\n这里列各类专业人员与机构，说明他们怎样处理问题。没有公众调查、反馈或表达支持的内容。\n\nC的名词未知，public这一回应来源仍找不到。参与专业多，不等于已得到公众某种态度。\n\n**专业人员多方参与，能证明C所说的公众回应已经出现吗？**\n\n不能。C换了被讨论的群体。\n\n**第一轮判断：C排除。**","html":"<h3>C. have gained public <strong>[xxx]</strong></h3>\n<blockquote><p>已获得公众的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：Dugan认为相关工作已经得到公众的某种<strong>[xxx]</strong>。</p>\n<p>C说获得公众某种回应，回第3段看列举的参与者。</p>\n<blockquote><p>different professions with different focuses</p>\n</blockquote>\n<blockquote><p>We need better evidence on what makes drivers unsafe</p>\n</blockquote>\n<p>这里列各类专业人员与机构，说明他们怎样处理问题。没有公众调查、反馈或表达支持的内容。</p>\n<p>C的名词未知，public这一回应来源仍找不到。参与专业多，不等于已得到公众某种态度。</p>\n<p><strong>专业人员多方参与，能证明C所说的公众回应已经出现吗？</strong></p>\n<p>不能。C换了被讨论的群体。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22]],"questionRects":[[197,762,333,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"33","option":"C","paragraphPids":[2]}},{"section":"33题","raw":"### D. call for relevant legal support\n\n> 需要相关法律支持\n\n把D接回题干，它说的是：Dugan认为安全工作需要得到法律方面支持。\n\nD说需要法律支持，回第3段看Dugan提出的缺口。\n\n> the difficulties are addressed piecemeal by different professions with different focuses\n\n> There’s not a National Institute of Older Driver Studies\n\n她指出专业之间零碎处理、研究证据不足，没有在此要求立法或修改报告规定。州法律差异出现在前一段Menke的话里。\n\n题干限定Dugan，要把人物分清，不能将相邻段落的法律话题直接当作她的主张。\n\n**Dugan这段要求的是法律支持，还是更协调的工作和更好证据？**\n\n是后者。D没有她在本段的直接依据。\n\n**第一轮判断：D排除。**","html":"<h3>D. call for relevant legal support</h3>\n<blockquote><p>需要相关法律支持</p>\n</blockquote>\n<p>把D接回题干，它说的是：Dugan认为安全工作需要得到法律方面支持。</p>\n<p>D说需要法律支持，回第3段看Dugan提出的缺口。</p>\n<blockquote><p>the difficulties are addressed piecemeal by different professions with different focuses</p>\n</blockquote>\n<blockquote><p>There’s not a National Institute of Older Driver Studies</p>\n</blockquote>\n<p>她指出专业之间零碎处理、研究证据不足，没有在此要求立法或修改报告规定。州法律差异出现在前一段Menke的话里。</p>\n<p>题干限定Dugan，要把人物分清，不能将相邻段落的法律话题直接当作她的主张。</p>\n<p><strong>Dugan这段要求的是法律支持，还是更协调的工作和更好证据？</strong></p>\n<p>是后者。D没有她在本段的直接依据。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22]],"questionRects":[[197,805,324,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"33","option":"D","paragraphPids":[2]}},{"section":"33题","raw":"### 33题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。","html":"<h3>33题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n","articleRects":[],"questionRects":[[153,636,28,17],[197,636,532,21],[197,678,344,22],[197,720,305,17],[197,762,333,22],[197,805,324,21]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> Some older drivers have trouble driving because they tend to ______.  \n> 一些老年司机驾驶困难，是因为他们往往出现什么问题？\n\n先完整读第4段可能有效的检查措施，再进入第5段驾驶困难的原因清单。将身体能力、记忆和座椅适配，与习惯、疼痛、保养分别比较。\n\n> 原文参考：\n> \n> One thing that does seem to work is requiring drivers to report in person for license renewal. Mandatory in-person renewal was associated with a 31 percent reduction in **[xxx]** crashes involving drivers 85 or older, according to one study. Passing vision tests also produced a similar decline in **[xxx]** crashes for those drivers, although there appeared to be no benefit from combining the two.\n> \n> 开始精读：\n> \n> One thing that does seem to work is requiring drivers to report in person for license renewal. / Mandatory in-person renewal was associated with a 31 percent reduction in **[xxx]** crashes / involving drivers 85 or older, according to one study. / Passing vision tests also produced a similar decline in **[xxx]** crashes for those drivers, / although there appeared to be no benefit from combining the two.\n> \n> 一种似乎确有作用的措施是要求驾驶者亲自到场换领驾照。 / 强制本人到场换照与**[xxx]**车祸减少百分之三十一相关 / 在涉及八十五岁及以上驾驶者的事故中根据一项研究。 / 通过视力测试也使这类驾驶者的**[xxx]**车祸类似减少 / 但将两项结合似乎没有额外益处。\n\n> 原文参考：\n> \n> Many older drivers don’t see eye doctors or can’t afford to. Primary care providers have their hands full and may not be able to follow through with patients who have trouble driving because they can’t turn their heads or remember where they are going —or have gotten shorter and haven’t changed their seat settings **[xxx]** to reach car **[xxx]** easily.\n> \n> 开始精读：\n> \n> Many older drivers don’t see eye doctors or can’t afford to. / Primary care providers have their hands full / and may not be able to follow through with patients who have trouble driving / because they can’t turn their heads or remember where they are going / —or have gotten shorter and haven’t changed their seat settings **[xxx]** / to reach car **[xxx]** easily.\n> \n> 许多老年司机不看眼科或负担不起。 / 初级保健提供者已忙得不可开交 / 可能无法持续跟进有驾驶困难的患者 / 因为他们无法转头或记不住要去哪里 / 或身高变矮却没有**[xxx]**调整座椅设置 / 以便轻松够到汽车**[xxx]**。\n\n接下来按A—D逐项看。","html":"<h2>34题</h2>\n<blockquote><p>Some older drivers have trouble driving because they tend to ______ ory\n\n> 记忆力减弱\n\n把B接回题干，它说的是：一些老年司机因记忆能力下降而驾驶困难。\n\nB说记忆减弱，回第5段找can’t…remember where they are going。\n\n> patients who have trouble driving because they can’t turn their heads or remember where they are going\n\n有的司机记不住自己要去哪里，这直接涉及目的地记忆。作者把它列为驾驶有困难的原因之一。\n\nB只说一些老年司机有这种问题，题干也说some，没有把它推广到所有高龄司机。\n\n**记不住目的地，是否支持部分司机因记忆减弱而驾驶困难？**\n\n支持。B与具体例子直接相合。\n\n**第一轮判断：B保留。**","html":"<h3>B. have a weakened memory</h3>\n<blockquote><p>记忆力减弱</p>\n</blockquote>\n<p>把B接回题干，它说的是：一些老年司机因记忆能力下降而驾驶困难。</p>\n<p>B说记忆减弱，回第5段找can’t…remember where they are going。</p>\n<blockquote><p>patients who have trouble driving because they can’t turn their heads or remember where they are going</p>\n</blockquote>\n<p>有的司机记不住自己要去哪里，这直接涉及目的地记忆。作者把它列为驾驶有困难的原因之一。</p>\n<p>B只说一些老年司机有这种问题，题干也说some，没有把它推广到所有高龄司机。</p>\n<p><strong>记不住目的地，是否支持部分司机因记忆减弱而驾驶困难？</strong></p>\n<p>支持。B与具体例子直接相合。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,999,745,22],[136,1033,794,22],[136,1068,794,22],[137,1103,793,22],[137,1138,446,22]],"questionRects":[[197,974,287,21]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"34","option":"B","paragraphPids":[4]}},{"section":"34题","raw":"### C. suffer from **[xxx]** pains\n\n> 遭受**[xxx]**疼痛\n\n把C接回题干，它说的是：这些老年司机因某种**[xxx]**疼痛而难以驾驶。\n\nC说疼痛，回第5段看can’t turn their heads有没有给出疼痛原因。\n\n> they can’t turn their heads or remember where they are going\n\n不能转头是一个明确的活动困难，但原文没有说它由疼痛引起，也没有说明疼在什么部位。C前面的疼痛类别还未知。\n\n活动受限可能有不同原因，不能只凭不能转头就指定疼痛。\n\n**不能转头，就已证明原因是C中某种疼痛吗？**\n\n没有。C比原文多加了一层原因。\n\n**第一轮判断：C排除。**","html":"<h3>C. suffer from <strong>[xxx]</strong> pains</h3>\n<blockquote><p>遭受<strong>[xxx]</strong>疼痛</p>\n</blockquote>\n<p>把C接回题干，它说的是：这些老年司机因某种<strong>[xxx]</strong>疼痛而难以驾驶。</p>\n<p>C说疼痛，回第5段看can’t turn their heads有没有给出疼痛原因。</p>\n<blockquote><p>they can’t turn their heads or remember where they are going</p>\n</blockquote>\n<p>不能转头是一个明确的活动困难，但原文没有说它由疼痛引起，也没有说明疼在什么部位。C前面的疼痛类别还未知。</p>\n<p>活动受限可能有不同原因，不能只凭不能转头就指定疼痛。</p>\n<p><strong>不能转头，就已证明原因是C中某种疼痛吗？</strong></p>\n<p>没有。C比原文多加了一层原因。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,999,745,22],[136,1033,794,22],[136,1068,794,22],[137,1103,793,22],[137,1138,446,22]],"questionRects":[[197,1016,280,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"C","paragraphPids":[4]}},{"section":"34题","raw":"### D. neglect car maintenance\n\n> 忽视汽车保养\n\n把D接回题干，它说的是：这些老年司机由于疏于汽车保养而驾驶困难。\n\nD说疏于保养，回第5段看haven’t changed their seat settings。\n\n> have gotten shorter and haven’t changed their seat settings **[xxx]** to reach car **[xxx]** easily\n\n司机身高变矮，却没有调整座椅，所以不易够到操控部件。要改的是座椅与身体之间的位置。\n\n汽车保养通常是维护车辆本身状态，这里没有机械故障或缺少维修。D把设置调整换成车辆保养。\n\n**身体变矮后未调座椅，是否就是没有维护汽车机械状态？**\n\n不是。D没有对应问题的具体性质。\n\n**第一轮判断：D排除。**","html":"<h3>D. neglect car maintenance</h3>\n<blockquote><p>忽视汽车保养</p>\n</blockquote>\n<p>把D接回题干，它说的是：这些老年司机由于疏于汽车保养而驾驶困难。</p>\n<p>D说疏于保养，回第5段看haven’t changed their seat settings。</p>\n<blockquote><p>have gotten shorter and haven’t changed their seat settings <strong>[xxx]</strong> to reach car <strong>[xxx]</strong> easily</p>\n</blockquote>\n<p>司机身高变矮，却没有调整座椅，所以不易够到操控部件。要改的是座椅与身体之间的位置。</p>\n<p>汽车保养通常是维护车辆本身状态，这里没有机械故障或缺少维修。D把设置调整换成车辆保养。</p>\n<p><strong>身体变矮后未调座椅，是否就是没有维护汽车机械状态？</strong></p>\n<p>不是。D没有对应问题的具体性质。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,999,745,22],[136,1033,794,22],[136,1068,794,22],[137,1103,793,22],[137,1138,446,22]],"questionRects":[[197,1058,269,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"D","paragraphPids":[4]}},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。","html":"<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n","articleRects":[],"questionRects":[[153,889,28,17],[197,889,594,22],[197,932,313,21],[197,974,287,21],[197,1016,280,22],[197,1058,269,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n> Dugan th  to improve safety, said Dugan. / “If we’re going to have 100-year lives, / we need cars that a 90-year-old can drive comfortably.”</p>\n<p>只要路上还有其他车辆 / 自动驾驶汽车就不能解决车祸问题Dugan说。 / 避免所有人类驾驶者<strong>[xxx]</strong>的危险需要太多<strong>[xxx]</strong>她说。 / 但我们需要做更多以改善安全Dugan说。 / “如果我们将拥有百岁寿命 / 就需要九十岁的人也能舒适驾驶的汽车。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[[153,1143,28,17],[197,1143,662,22],[197,1185,335,22],[197,1227,334,22],[197,1270,317,21],[197,1312,363,22],[394,1397,309,19]],"scrollTarget":"article","meta":{"kind":"question","qid":"35","paragraphPids":[5]}},{"section":"35题","raw":"### A. upgrading self-driving vehicles\n\n> 升级自动驾驶车辆\n\n把A接回题干，它说的是：Dugan认为解决车祸的方向可能是升级自动驾驶汽车。\n\nA说升级自动驾驶，回末段看Dugan先对它作了什么判断。\n\n> self-driving cars won’t solve the problems of crashes\n\n> Avoiding dangers **[xxx]** by all those human drivers would require too many **[xxx]**\n\n她说只要路上还有别的人类司机，自动驾驶就不能解决所有碰撞风险，因为要避开他们造成的危险太复杂。\n\nBut后提出更适合高龄者驾驶的车辆，不是宣布只须升级自动驾驶就能处理问题。A把被指出局限的技术当成她的后续方案。\n\n**她指出自动驾驶难以包办安全之后，明确提出的是升级它吗？**\n\n不是。她接着要求九十岁的人也能舒服驾驶的汽车。\n\n**第一轮判断：A排除。**","html":"<h3>A. upgrading self-driving vehicles</h3>\n<blockquote><p>升级自动驾驶车辆</p>\n</blockquote>\n<p>把A接回题干，它说的是：Dugan认为解决车祸的方向可能是升级自动驾驶汽车。</p>\n<p>A说升级自动驾驶，回末段看Dugan先对它作了什么判断。</p>\n<blockquote><p>self-driving cars won’t solve the problems of crashes</p>\n</blockquote>\n<blockquote><p>Avoiding dangers <strong>[xxx]</strong> by all those human drivers would require too many <strong>[xxx]</strong></p>\n</blockquote>\n<p>她说只要路上还有别的人类司机，自动驾驶就不能解决所有碰撞风险，因为要避开他们造成的危险太复杂。</p>\n<p>But后提出更适合高龄者驾驶的车辆，不是宣布只须升级自动驾驶就能处理问题。A把被指出局限的技术当成她的后续方案。</p>\n<p><strong>她指出自动驾驶难以包办安全之后，明确提出的是升级它吗？</strong></p>\n<p>不是。她接着要求九十岁的人也能舒服驾驶的汽车。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[[197,1185,335,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"A","paragraphPids":[5]}},{"section":"35题","raw":"### B. developing senior-friendly cars\n\n> 开发适合老年人的汽车\n\n把B接回题干，它说的是：Dugan认为应发展更适合高龄者使用的汽车。\n\nB说开发适老汽车，回末段找cars that a 90-year-old can drive comfortably。\n\n> we need cars that a 90-year-old can drive comfortably\n\nDugan设想人可能活到一百岁，因此汽车也应让九十岁的人能够舒服地驾驶。她要求车辆适应高龄使用者的身体和操作需要。\n\nB的senior-friendly正把这种设计目标概括出来，与改善安全的呼吁相接。\n\n**让九十岁的人也能舒适操作，是不是在要求汽车更适合老人？**\n\n是。B直接对应她提出的具体方向。\n\n**第一轮判断：B保留。**","html":"<h3>B. developing senior-friendly cars</h3>\n<blockquote><p>开发适合老年人的汽车</p>\n</blockquote>\n<p>把B接回题干，它说的是：Dugan认为应发展更适合高龄者使用的汽车。</p>\n<p>B说开发适老汽车，回末段找cars that a 90-year-old can drive comfortably。</p>\n<blockquote><p>we need cars that a 90-year-old can drive comfortably</p>\n</blockquote>\n<p>Dugan设想人可能活到一百岁，因此汽车也应让九十岁的人能够舒服地驾驶。她要求车辆适应高龄使用者的身体和操作需要。</p>\n<p>B的senior-friendly正把这种设计目标概括出来，与改善安全的呼吁相接。</p>\n<p><strong>让九十岁的人也能舒适操作，是不是在要求汽车更适合老人？</strong></p>\n<p>是。B直接对应她提出的具体方向。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[[197,1227,334,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"35","option":"B","paragraphPids":[5]}},{"section":"35题","raw":"### C. **[xxx]** transport facilities\n\n> 对交通设施进行**[xxx]**\n\n把C接回题干，它说的是：Dugan认为解决方向可能是对交通设施实施某种**[xxx]**措施。\n\nC谈交通设施，回末段看we need后面的对象。\n\n> we need cars that a 90-year-old can drive comfortably\n\nDugan明确要的是更适合高龄者驾驶的cars，没有提出改建道路、车站或其他交通设施。前文虽有公路管理等专业，并非末段的新建议。\n\nC的动作词未知，但transport facilities已把设计对象扩大并换到公共设施上。\n\n**末段明确要改进的是车辆，能直接替换成交通设施吗？**\n\n不能。C没有这项具体建议的对应。\n\n**第一轮判断：C排除。**","html":"<h3>C. <strong>[xxx]</strong> transport facilities</h3>\n<blockquote><p>对交通设施进行<strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：Dugan认为解决方向可能是对交通设施实施某种<strong>[xxx]</strong>措施。</p>\n<p>C谈交通设施，回末段看we need后面的对象。</p>\n<blockquote><p>we need cars that a 90-year-old can drive comfortably</p>\n</blockquote>\n<p>Dugan明确要的是更适合高龄者驾驶的cars，没有提出改建道路、车站或其他交通设施。前文虽有公路管理等专业，并非末段的新建议。</p>\n<p>C的动作词未知，但transport facilities已把设计对象扩大并换到公共设施上。</p>\n<p><strong>末段明确要改进的是车辆，能直接替换成交通设施吗？</strong></p>\n<p>不能。C没有这项具体建议的对应。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[[197,1270,317,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"C","paragraphPids":[5]}},{"section":"35题","raw":"### D. adjusting the age limit for drivers\n\n> 调整驾驶者年龄限制\n\n把D接回题干，它说的是：Dugan认为应改变驾驶年龄的限制。\n\nD说调整年龄限制，回末段看九十岁、一百岁被用来说明什么。\n\n> If we’re going to have 100-year lives, we need cars that a 90-year-old can drive comfortably\n\n长寿说明高龄人群仍可能需要驾车，所以她要求适合他们的汽车。她没有提出驾照最低或最高年龄应该改成多少。\n\n年龄数字是设计需求的背景，不是法律门槛。D把用车者年龄换成了驾驶资格规定。\n\n**提到九十岁能舒适驾驶，就等于要求修改驾驶年龄限制吗？**\n\n不等于。D换了她要改变的对象。\n\n**第一轮判断：D排除。**","html":"<h3>D. adjusting the age limit for drivers</h3>\n<blockquote><p>调整驾驶者年龄限制</p>\n</blockquote>\n<p>把D接回题干，它说的是：Dugan认为应改变驾驶年龄的限制。</p>\n<p>D说调整年龄限制，回末段看九十岁、一百岁被用来说明什么。</p>\n<blockquote><p>If we’re going to have 100-year lives, we need cars that a 90-year-old can drive comfortably</p>\n</blockquote>\n<p>长寿说明高龄人群仍可能需要驾车，所以她要求适合他们的汽车。她没有提出驾照最低或最高年龄应该改成多少。</p>\n<p>年龄数字是设计需求的背景，不是法律门槛。D把用车者年龄换成了驾驶资格规定。</p>\n<p><strong>提到九十岁能舒适驾驶，就等于要求修改驾驶年龄限制吗？</strong></p>\n<p>不等于。D换了她要改变的对象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[[197,1312,363,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"D","paragraphPids":[5]}},{"section":"35题","raw":"### 35题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。","html":"<h3>35题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n","articleRects":[],"questionRects":[[153,1143,28,17],[197,1143,662,22],[197,1185,335,22],[197,1227,334,22],[197,1270,317,21],[197,1312,363,22],[394,1397,309,19]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"35"}},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | biggest challenges；life-changer | 让不安全的老年司机停止驾驶，难在说服其接受生活中的重大变化。 | 提出老年驾驶安全工作的现实困难。 |\n| 第2段 | Association advice；Some / others / a few | 医学会建议一定条件下报告不安全驾驶，但各州规定不同，医生还需遵守当地要求。 | 说明医疗报告这一环节的制度复杂性。 |\n| 第3段 | piecemeal；different professions；better evidence | 不同专业分散处理，Dugan指出协调与研究证据仍有不足。 | 从个别报告困难推进到工作组织与证据问题。 |\n| 第4段 | in-person renewal；vision tests；no benefit combining | 本人换照及视力测试分别与较少事故有关，二者结合未见额外好处。 | 介绍已有研究中可能有效的措施及其限制。 |\n| 第5段 | eye doctors；hands full；physical / memory difficulties | 就医负担、跟进不足及身体记忆变化，使一些老年人的驾驶困难难以及时处理。 | 补充实施照护与车辆适配方面的障碍。 |\n| 第6段 | self-driving limitation；But；90-year-old | 自动驾驶不能简单解决其他车辆带来的风险，仍需发展适合高龄者操作的汽车。 | 承认技术限制，并提出更有针对性的车辆方向。 |\n\n**全文的主要意思：老年驾驶安全涉及停驶劝说、医疗报告、专业协调、检查照护及车辆适配等多重问题，需要更充分的证据和适合高龄者的措施，不能仅寄望自动驾驶。**","html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>biggest challenges；life-changer</td><td>让不安全的老年司机停止驾驶，难在说服其接受生活中的重大变化。</td><td>提出老年驾驶安全工作的现实困难。</td></tr><tr><td>第2段</td><td>Association advice；Some / others / a few</td><td>医学会建议一定条件下报告不安全驾驶，但各州规定不同，医生还需遵守当地要求。</td><td>说明医疗报告这一环节的制度复杂性。</td></tr><tr><td>第3段</td><td>piecemeal；different professions；better evidence</td><td>不同专业分散处理，Dugan指出协调与研究证据仍有不足。</td><td>从个别报告困难推进到工作组织与证据问题。</td></tr><tr><td>第4段</td><td>in-person renewal；vision tests；no benefit combining</td><td>本人换照及视力测试分别与较少事故有关，二者结合未见额外好处。</td><td>介绍已有研究中可能有效的措施及其限制。</td></tr><tr><td>第5段</td><td>eye doctors；hands full；physical / memory difficulties</td><td>就医负担、跟进不足及身体记忆变化，使一些老年人的驾驶困难难以及时处理。</td><td>补充实施照护与车辆适配方面的障碍。</td></tr><tr><td>第6段</td><td>self-driving limitation；But；90-year-old</td><td>自动驾驶不能简单解决其他车辆带来的风险，仍需发展适合高龄者操作的汽车。</td><td>承认技术限制，并提出更有针对性的车辆方向。</td></tr></tbody></table>\n<p><strong>全文的主要意思：老年驾驶安全涉及停驶劝说、医疗报告、专业协调、检查照护及车辆适配等多重问题，需要更充分的证据和适合高龄者的措施，不能仅寄望自动驾驶。</strong></p>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22],[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23],[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22],[185,825,745,21],[137,859,793,22],[136,894,787,22],[137,929,792,22],[137,964,727,22],[184,999,745,22],[136,1033,794,22],[136,1068,794,22],[137,1103,793,22],[137,1138,446,22],[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]}},{"section":"进阶回查","raw":"## 回查31题：B还是C？\n\n前面留下的是：\n\n> B. has become a **[xxx]** issue\n>\n> C. can be a tough task to complete\n\n先把它们接回题干。\n\nB说：让不安全的高龄司机不再上路，已经成为一个**[xxx]**问题。\n\nC说：让不安全的高龄司机不再上路，可能是一项很难完成的任务。\n\n题干问的是`According to Paragraph 1`，我们再看首段这两句：\n\n> One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.\n>\n> “It’s a complete life-changer” when someone stops—or is forced to stop—driving, said **[xxx]** risk manager Anne M. Menke.\n\n先看C。题干说让司机不再上路，原文说要劝他们交出钥匙；C说这项任务难，原文就把说服本人叫作`One of the biggest challenges`。接着，Menke又解释停驾会完全改变生活，这也让我们明白了司机要接受的究竟是什么。\n\n所以，C中的任务是什么、为什么说难，都能在这两句话里找到。\n\n再看B。第一遍留下它，是因为`issue`和首段讨论的这件事有关，但**[xxx]**一直没有读清。现在再回到首段，仍然只能读出“难以说服他们交出钥匙”。我们还是说不出B中的**[xxx]**究竟是不是这个意思。\n\n**C说的“难完成”，还需要像B一样，等一个不认识的词才能和首段对上吗？**\n\n不需要。`biggest challenges`已经说出了难，`convincing them`又说出了难在哪儿。这里选C；B中的**[xxx]**仍然没有读出来。\n\n> **31题选C。**","html":"<h2>回查31题：B还是C？</h2>\n<p>前面留下的是：</p>\n<blockquote><p>B. has become a <strong>[xxx]</strong> issue</p>\n<p>C. can be a tough task to complete</p>\n</blockquote>\n<p>先把它们接回题干。</p>\n<p>B说：让不安全的高龄司机不再上路，已经成为一个<strong>[xxx]</strong>问题。</p>\n<p>C说：让不安全的高龄司机不再上路，可能是一项很难完成的任务。</p>\n<p>题干问的是<code>According to Paragraph 1</code>，我们再看首段这两句：</p>\n<blockquote><p>One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that it’s time to turn over the keys.</p>\n<p>“It’s a complete life-changer” when someone stops—or is forced to stop—driving, said <strong>[xxx]</strong> risk manager Anne M. Menke.</p>\n</blockquote>\n<p>先看C。题干说让司机不再上路，原文说要劝他们交出钥匙；C说这项任务难，原文就把说服本人叫作<code>One of the biggest challenges</code>。接着，Menke又解释停驾会完全改变生活，这也让我们明白了司机要接受的究竟是什么。</p>\n<p>所以，C中的任务是什么、为什么说难，都能在这两句话里找到。</p>\n<p>再看B。第一遍留下它，是因为<code>issue</code>和首段讨论的这件事有关，但<strong>[xxx]</strong>一直没有读清。现在再回到首段，仍然只能读出“难以说服他们交出钥匙”。我们还是说不出B中的<strong>[xxx]</strong>究竟是不是这个意思。</p>\n<p><strong>C说的“难完成”，还需要像B一样，等一个不认识的词才能和首段对上吗？</strong></p>\n<p>不需要。<code>biggest challenges</code>已经说出了难，<code>convincing them</code>又说出了难在哪儿。这里选C；B中的<strong>[xxx]</strong>仍然没有读出来。</p>\n<blockquote><p><strong>31题选C。</strong></p>\n</blockquote>\n","articleRects":[[185,197,744,22],[137,233,548,21],[723,233,206,21],[137,266,793,23],[137,302,251,22],[186,336,743,23],[137,372,792,21],[136,407,793,21],[136,441,794,22],[137,476,90,21],[274,476,136,17],[447,476,482,22],[137,511,794,22],[137,546,793,22],[137,580,772,23],[184,616,745,21],[137,650,792,22],[137,685,793,22],[137,719,794,23],[384,754,545,18],[137,789,468,22],[185,825,745,21],[137,859,793,22],[136,894,787,22],[137,929,792,22],[137,964,727,22],[184,999,745,22],[136,1033,794,22],[136,1068,794,22],[137,1103,793,22],[137,1138,446,22],[185,1173,744,22],[136,1208,794,21],[137,1242,792,22],[137,1276,793,23],[137,1312,445,22]],"questionRects":[[153,128,28,17],[196,128,664,22],[212,170,254,22],[196,213,310,22],[196,255,347,22],[196,297,350,17]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","C"],"finalChoice":"C","qid":"31","paragraphPids":[0,1,2,3,4,5]}},{"section":"最终答案","raw":"## 最终答案\n\n**31. C*
