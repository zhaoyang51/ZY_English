<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**What is true about Wunderlist and Sunrise after their acquisitions?**\n\n> Wunderlist和Sunrise被收购后，什么情况属实？\n\n题型：**收购后细节题**。","html":"<h2>31题题干</h2>\n<p><strong>What is true about Wunderlist and Sunrise after their acquisitions?</strong></p>\n<blockquote><p>Wunderlist和Sunrise被收购后，什么情况属实？</p>\n</blockquote>\n<p>题型：<strong>收购后细节题</strong>。</p>\n","articleRects":[],"questionRects":[[153,128,684,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**Microsoft’s critics believe that the big tech companies tend to ______.**\n\n> 微软的批评者认为大型科技公司倾向于怎样做？\n\n题型：**特定人物观点题**。","html":"<h2>32题题干</h2>\n<p><strong>Microsoft’s critics believe that the big tech companies tend to ______.</strong></p>\n<blockquote><p>微软的批评者认为大型科技公司倾向于怎样做？</p>\n</blockquote>\n<p>题型：<strong>特定人物观点题</strong>。</p>\n","articleRects":[],"questionRects":[[153,382,638,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**Paul Arnold is concerned that small acquisitions might ______.**\n\n> Paul Arnold担心小型收购可能产生什么影响？\n\n题型：**人物担忧题**。","html":"<h2>33题题干</h2>\n<p><strong>Paul Arnold is concerned that small acquisitions might ______.</strong></p>\n<blockquote><p>Paul Arnold担心小型收购可能产生什么影响？</p>\n</blockquote>\n<p>题型：<strong>人物担忧题</strong>。</p>\n","articleRects":[],"questionRects":[[153,636,567,21]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**The U.S. Federal Trade Commission intends to ______.**\n\n> 美国联邦贸易委员会打算怎样做？\n\n题型：**机构意图题**。","html":"<h2>34题题干</h2>\n<p><strong>The U.S. Federal Trade Commission intends to ______.</strong></p>\n<blockquote><p>美国联邦贸易委员会打算怎样做？</p>\n</blockquote>\n<p>题型：<strong>机构意图题</strong>。</p>\n","articleRects":[],"questionRects":[[153,889,506,17]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**For the five biggest tech companies, their small acquisitions have ______.**\n\n> 对于五家最大的科技公司而言，小型收购带来了什么？\n\n题型：**数字比较推断题**。","html":"<h2>35题题干</h2>\n<p><strong>For the five biggest tech companies, their small acquisitions have ______.</strong></p>\n<blockquote><p>对于五家最大的科技公司而言，小型收购带来了什么？</p>\n</blockquote>\n<p>题型：<strong>数字比较推断题</strong>。</p>\n","articleRects":[],"questionRects":[[153,1143,678,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, however, though |\n| 态度词 / 评价词 | 先抓个大概好坏 | best, good, threatening |\n| 动作词 | 先看谁做了什么 | bought, used, stayed |\n| 结果词 | 看最后出了什么事 | apps, acquisitions, market |\n| 重复主题词 | 大概知道老在说什么 | Microsoft, critics, investors |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, however, though</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>best, good, threatening</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>bought, used, stayed</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>apps, acquisitions, market</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Microsoft, critics, investors</td></tr></tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked up two newcomers that were attracting **[xxx]** buzz in Silicon Valley. Microsoft’s own Office **[xxx]** the market for “productivity” software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked up two newcomers that were attracting <strong>[xxx]</strong> buzz in Silicon Valley. Microsoft’s own Office <strong>[xxx]</strong> the market for “productivity” software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world.</p>\n</div></div>","articleRects":[[184,200,745,22],[137,231,792,22],[137,263,793,21],[136,293,795,23],[137,326,651,21]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":""},{"section":"读文章","raw":"When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, / it picked up two newcomers / that were attracting **[xxx]** buzz in Silicon Valley. / Microsoft’s own Office **[xxx]** the market for “productivity” software, / but the start-ups represented a new wave of technology / designed from the ground up for the smartphone world.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, / it picked up two newcomers / that were attracting <strong>[xxx]</strong> buzz in Silicon Valley. / Microsoft’s own Office <strong>[xxx]</stro 公司、这类交易、潜在竞争对手、它们的业务、在某些情况下、买下并杀死、关闭它们。\n\n到这里还不能自然地说清楚：小型收购怎样影响被买企业，谁能获利，调查想回答什么，以及金额小是否意味着影响也小。先记住这些信息大概在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：科技巨头、初创企业、收购、竞争对手和经济影响。刚才还看到：微软买下、任务管理应用、移动日历、在2015年、两个新进入者、硅谷、初创企业、智能手机世界、新浪潮；两个应用、然而、微软、最好功能、自身产品、工程师；批评者、创新公司、关闭它们、企业、竞争对手、拒绝置评；初创企业投资者、自己的生意、更大的科技公司、复杂感受、美国经济；联邦贸易委员会、五家、科技公司、小型收购、过去十年、研究项目、这一阶段；市值、小交易、五家最大科技公司、花费、仅、每年、过去五年、资金储备、去年；大公司、这类交易、潜在竞争对手、它们的业务、在某些情况下、买下并杀死、关闭它们。</p>\n<p>到这里还不能自然地说清楚：小型收购怎样影响被买企业，谁能获利，调查想回答什么，以及金额小是否意味着影响也小。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> What is true about Wunderlist and Sunrise after their acquisitions?  \n> Wunderlist和Sunrise被收购后，什么情况属实？\n\n名称定位开头两段。先读收购背景，再用however后的实际后续回答after：产品功能被使用与工程师留下是两个不同信息。\n\n> 原文参考：\n> \n> When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked up two newcomers that were attracting **[xxx]** buzz in Silicon Valley. Microsoft’s own Office **[xxx]** the market for “productivity” software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world.\n> \n> 开始精读：\n> \n> When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, / it picked up two newcomers / that were attracting **[xxx]** buzz in Silicon Valley. / Microsoft’s own Office **[xxx]** the market for “productivity” software, / but the start-ups represented a new wave of technology / designed from the ground up for the smartphone world.\n> \n> 当微软在2015年买下任务管理应用Wunderlist和移动日历Sunrise时 / 它收下了两个新进入者 / 它们正在硅谷引起**[xxx]**的热议。 / 微软自己的Office**[xxx]**生产力软件市场 / 但这些初创企业代表一波新技术 / 为智能手机世界从头设计的技术。\n\n> 原文参考：\n> \n> Both apps, however, were later **[xxx]** after Microsoft said it had used their best features in its own products. Their teams of engineers stayed on, making them two of the many “acqui-hires” that the biggest companies have used to feed their great **[xxx]** for tech talent.\n> \n> 开始精读：\n> \n> Both apps, however, were later **[xxx]** / after Microsoft said it had used their best features in its own products. / Their teams of engineers stayed on, / making them two of the many “acqui-hires” / that the biggest companies have used to feed their great **[xxx]** for tech talent.\n> \n> 然而这两个应用后来被**[xxx]** / 在微软表示已将它们最好的功能用于自身产品之后。 / 它们的工程师团队留了下来 / 使它们成为众多“收购式招聘”中的两例 / 这些大公司用这种方式来满足对技术人才的巨大**[xxx]**。\n\n接下来按A—D逐项看。","html":"<h2>31题</h2>\n<blockquote><p>What is true about Wunderlist and Sunrise after their acquisitions?<br />\nWunderlist和Sunrise被收购后，什么情况属实？</p>\n</blockquote>\n<p>名称定位开头两段。先读收购背景，再用however后的实际后续回答after：产品功能被使用与工程师留下是两个不同信息。</p>\n<blockquote><p>原文参考：</p>\n<p>When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked up two newcomers that were attracting <strong>[xxx]</strong> buzz in Silicon Valley. Microsoft’s own Office <strong>[xxx]</strong> the market for “productivity” software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world.</p>\n<p>开始精读：</p>\n<p>When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, / it picked up two newcomers / that were attracting <strong>[xxx]</strong> buzz in Silicon Valley. / Microsoft’s own Office <strong>[xxx]</strong> the market for “productivity” software, / but the start-ups represented a new wave of technology / designed from the ground up for the smartphone world.</p>\n<p>当微软在2015年买下任务管理应用Wunderlist和移动日历Sunrise时 / 它收下了两个新进入者 / 它们正在硅谷引起<strong>[xxx]</strong>的热议。 / 微软自己的Office<strong>[xxx]</strong>生产力软件市场 / 但这些初创企业代表一波新技术 / 为智能手机世界从头设计的技术。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Both apps, however, were later <strong>[xxx]</strong> after Microsoft said it had used their best features in its own products. Their teams of engineers stayed on, making them two of the many “acqui-hires” that the biggest companies have used to feed their great <strong>[xxx]</strong> for tech talent.</p>\n<p>开始精读：</p>\n<p>Both apps, however, were later <strong>[xxx]</strong> / after Microsoft said it had used their best features in its own products. / Their teams of engineers stayed on, / making them two of the many “acqui-hires” / that the biggest companies have used to feed their great <strong>[xxx]</strong> for tech talent.</p>\n<p>然而这两个应用后来被<strong>[xxx]</strong> / 在微软表示已将它们最好的功能用于自身产品之后。 / 它们的工程师团队留了下来 / 使它们成为众多“收购式招聘”中的两例 / 这些大公司用这种方式来满足对技术人才的巨大<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,200,745,22],[137,231,792,22],[137,263,793,21],[136,293,795,23],[137,326,651,21],[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22]],"questionRects":[[153,128,684,22],[189,171,321,21],[189,213,314,17],[189,255,312,22],[188,298,322,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"31","paragraphPids":[0,1]}},{"section":"31题","raw":"### A. Their products were re-priced.\n\n> 它们的产品被重新定价。\n\n把A接回题干，它说的是：两家企业被收购后，产品价格被重新设定。\n\nA说重新定价，回第2段看收购后作者报告了哪些变化。\n\n> Microsoft said it had used their best features in its own products\n\n微软取用两款应用的优秀功能，工程师团队也留下继续工作。这段没有旧价格与新价格的比较。\n\n收购本身有交易价格，但题干问应用被收购后的情况，不能把买公司与给产品重新定价混为一谈。\n\n**这段有没有说应用的售价被调整？**\n\n没有。A增加了价格变化。\n\n**第一轮判断：A排除。**","html":"<h3>A. Their products were re-priced.</h3>\n<blockquote><p>它们的产品被重新定价。</p>\n</blockquote>\n<p>把A接回题干，它说的是：两家企业被收购后，产品价格被重新设定。</p>\n<p>A说重新定价，回第2段看收购后作者报告了哪些变化。</p>\n<blockquote><p>Microsoft said it had used their best features in its own products</p>\n</blockquote>\n<p>微软取用两款应用的优秀功能，工程师团队也留下继续工作。这段没有旧价格与新价格的比较。</p>\n<p>收购本身有交易价格，但题干问应用被收购后的情况，不能把买公司与给产品重新定价混为一谈。</p>\n<p><strong>这段有没有说应用的售价被调整？</strong></p>\n<p>没有。A增加了价格变化。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22]],"questionRects":[[189,171,321,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"A","paragraphPids":[1]}},{"section":"31题","raw":"### B. Their market values **[xxx]**.\n\n> 它们的市场价值**[xxx]**。\n\n把B接回题干，它说的是：被收购后，两家企业的市场价值发生某种**[xxx]**。\n\nB说市值发生变化，回第2段看有没有收购后市值数据。\n\n> Their teams of engineers stayed on\n\n这段说的是功能被采用、工程师留用，不是两家公司的估值变化。首段所说它们受到关注，也不能作为收购后市值变化的证据。\n\nB动词未知，但market values已经换成另一项没有被报告的信息。\n\n**功能被采用、人员留下，能确定市值发生了B所说的变化吗？**\n\n不能。B没有本段依据。\n\n**第一轮判断：B排除。**","html":"<h3>B. Their market values <strong>[xxx]</strong>.</h3>\n<blockquote><p>它们的市场价值<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把B接回题干，它说的是：被收购后，两家企业的市场价值发生某种<strong>[xxx]</strong>。</p>\n<p>B说市值发生变化，回第2段看有没有收购后市值数据。</p>\n<blockquote><p>Their teams of engineers stayed on</p>\n</blockquote>\n<p>这段说的是功能被采用、工程师留用，不是两家公司的估值变化。首段所说它们受到关注，也不能作为收购后市值变化的证据。</p>\n<p>B动词未知，但market values已经换成另一项没有被报告的信息。</p>\n<p><strong>功能被采用、人员留下，能确定市值发生了B所说的变化吗？</strong></p>\n<p>不能。B没有本段依据。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22]],"questionRects":[[189,213,314,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"B","paragraphPids":[1]}},{"section":"31题","raw":"### C. Their tech features improved.\n\n> 它们的技术功能改进了。\n\n把C接回题干，它说的是：两家企业被收购后，原有技术功能有所改进。\n\nC说功能改进，回第2段看used their best features in its own products。\n\n> it had used their best features in its own products\n\n微软把它们已有的优秀功能用到自己的产品中。used表示采用，best评价原来哪些功能值得采用。\n\n这没有说被收购应用的功能后来变得更好。功能从一处被吸收到另一处，与功能质量提升不同。\n\n**采用已有的优秀功能，等于这些功能本身得到改进吗？**\n\n不等于。C把转用写成了改进。\n\n**第一轮判断：C排除。**","html":"<h3>C. Their tech features improved.</h3>\n<blockquote><p>它们的技术功能改进了。</p>\n</blockquote>\n<p>把C接回题干，它说的是：两家企业被收购后，原有技术功能有所改进。</p>\n<p>C说功能改进，回第2段看used their best features in its own products。</p>\n<blockquote><p>it had used their best features in its own products</p>\n</blockquote>\n<p>微软把它们已有的优秀功能用到自己的产品中。used表示采用，best评价原来哪些功能值得采用。</p>\n<p>这没有说被收购应用的功能后来变得更好。功能从一处被吸收到另一处，与功能质量提升不同。</p>\n<p><strong>采用已有的优秀功能，等于这些功能本身得到改进吗？</strong></p>\n<p>不等于。C把转用写成了改进。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22]],"questionRects":[[189,255,312,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"C","paragraphPids":[1]}},{"section":"31题","raw":"### D. Their engineers were retained.\n\n> 它们的工程师被留用了。\n\n把D接回题干，它说的是：被收购之后，这两家企业的工程师继续留下工作。\n\nD说工程师留用，回第2段找Their teams of engineers stayed on。\n\n> Their teams of engineers stayed on\n\nstayed on表示继续留下，主语正是两款应用的工程师团队。随后介绍这些收购帮助大公司获得技术人才，进一步解释人员为何重要。\n\nD的engineers were retained把主动留下改为被留用，人员与收购后状态都没有变。\n\n**工程师团队继续工作，是否就是D说的留用？**\n\n是。D与原句直接对应。\n\n**第一轮判断：D保留。**","html":"<h3>D. Their engineers were retained.</h3>\n<blockquote><p>它们的工程师被留用了。</p>\n</blockquote>\n<p>把D接回题干，它说的是：被收购之后，这两家企业的工程师继续留下工作。</p>\n<p>D说工程师留用，回第2段找Their teams of engineers stayed on。</p>\n<blockquote><p>Their teams of engineers stayed on</p>\n</blockquote>\n<p>stayed on表示继续留下，主语正是两款应用的工程师团队。随后介绍这些收购帮助大公司获得技术人才，进一步解释人员为何重要。</p>\n<p>D的engineers were retained把主动留下改为被留用，人员与收购后状态都没有变。</p>\n<p><strong>工程师团队继续工作，是否就是D说的留用？</strong></p>\n<p>是。D与原句直接对应。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22]],"questionRects":[[188,298,322,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"31","option":"D","paragraphPids":[1]}},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","html":"<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n","articleRects":[],"questionRects":[[153,128,684,22],[189,171,321,21],[189,213,314,17],[189,255,312,22],[188,298,322,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> Microsoft’s critics believe that the big tech companies tend to ______.  \n> 微软的批评者认为大型科技公司倾向于怎样做？\n\n本题问critics的具体指控，不是作者全篇态度。完整读第3段，将chew up、closed them down与未来competitors连起来。\n\n> 原文参考：\n> \n> To Microsoft’s critics, the fates of Wunderlist and Sunrise are examples of a **[xxx]** drive by Big Tech to chew up any innovative companies that lie in their path. “They bought the **[xxx]** and closed them down,” complained Paul Arnold, a partner at San Francisco-based Switch Ventures, putting an end to businesses that might one day turn into competitors. Microsoft declined to comment.\n> \n> 开始精读：\n> \n> To Microsoft’s critics, / the fates of Wunderlist and Sunrise are examples / of a **[xxx]** drive by Big Tech / to chew up any innovative companies that lie in their path. / “They bought the **[xxx]** and closed them down,” / complained Paul Arnold, a partner at San Francisco-based Switch Ventures, / putting an end to businesses / that might one day turn into competitors. / Microsoft declined to comment.\n> \n> 对微软的批评者而言 / Wunderlist和Sunrise的命运就是例子 / 科技巨头一股**[xxx]**动力的例子 / 要吞掉所有挡在它们路上的创新公司。 / “它们买下这些**[xxx]**并将其关闭” / 位于旧金山的Switch Ventures合伙人Paul Arnold如此抱怨 / 使企业走向终结 / 那些有一天可能成为竞争对手的企业。 / 微软拒绝置评。\n\n接下来按A—D逐项看。","html":"<h2>32题</h2>\n<blockquote><p>Microsoft’s critics believe that the big tech companies tend to ______.<br />\n微软的批评者认为大型科技公司倾向于怎样做？</p>\n</blockquote>\n<p>本题问critics的具体指控，不是作者全篇态度。完整读第3段，将chew up、closed them down与未来competitors连起来。</p>\n<blockquote><p>原文参考：</p>\n<p>To Microsoft’s critics, the fates of Wunderlist and Sunrise are examples of a <strong>[xxx]</strong> drive by Big Tech to chew up any innovative companies that lie in their path. “They bought the <strong>[xxx]</strong> and closed them down,” complained Paul Arnold, a partner at San Francisco-based Switch Ventures, putting an end to businesses that might one day turn into competitors. Microsoft declined to comment.</p>\n<p>开始精读：</p>\n<p>To Microsoft’s critics, / the fates of Wunderlist and Sunrise are examples / of a <strong>[xxx]</strong> drive by Big Tech / to chew up any innovative companies that lie in their path. / “They bought the <strong>[xxx]</strong> and closed them down,” / complained Paul Arnold, a partner at San Francisco-based Switch Ventures, / putting an end to businesses / that might one day turn into competitors. / Microsoft declined to comment.</p>\n<p>对微软的批评者而言 / Wunderlist和Sunrise的命运就是例子 / 科技巨头一股<strong>[xxx]</strong>动力的例子 / 要吞掉所有挡在它们路上的创新公司。 / “它们买下这些<strong>[xxx]</strong>并将其关闭” / 位于旧金山的Switch Ventures合伙人Paul Arnold如此抱怨 / 使企业走向终结 / 那些有一天可能成为竞争对手的企业。 / 微软拒绝置评。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14]],"questionRects":[[153,382,638,22],[189,424,378,22],[189,467,334,21],[189,509,308,22],[189,551,244,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"32","paragraphPids":[2]}},{"section":"32题","raw":"### A. eliminate their potential competitors\n\n> 消除其潜在竞争对手\n\n把A接回题干，它说的是：批评者认为科技巨头倾向于消除未来可能成为对手的企业。\n\nA说消除潜在竞争者，回第3段把closed them down与might one day turn into competitors连起来。\n\n> putting an end to businesses that might one day turn into competitors\n\n批评者说巨头买下企业再关闭，而被关闭的企业可能有一天成为对手。关闭动作使这种未来竞争不再有机会发生。\n\nA中的potential保留“可能成为”，eliminate对应买下后关闭，并未把已经存在的直接竞争当作前提。\n\n**把可能成长为对手的企业买下关闭，能否概括为消除潜在竞争者？**\n\n能。A保留了批评者这段话的具体意思。\n\n**第一轮判断：A保留。**","html":"<h3>A. eliminate their potential competitors</h3>\n<blockquote><p>消除其潜在竞争对手</p>\n</blockquote>\n<p>把A接回题干，它说的是：批评者认为科技巨头倾向于消除未来可能成为对手的企业。</p>\n<p>A说消除潜在竞争者，回第3段把closed them down与might one day turn into competitors连起来。</p>\n<blockquote><p>putting an end to businesses that might one day turn into competitors</p>\n</blockquote>\n<p>批评者说巨头买下企业再关闭，而被关闭的企业可能有一天成为对手。关闭动作使这种未来竞争不再有机会发生。</p>\n<p>A中的potential保留“可能成为”，eliminate对应买下后关闭，并未把已经存在的直接竞争当作前提。</p>\n<p><strong>把可能成长为对手的企业买下关闭，能否概括为消除潜在竞争者？</strong></p>\n<p>能。A保留了批评者这段话的具体意思。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14]],"questionRects":[[189,424,378,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"32","option":"A","paragraphPids":[2]}},{"section":"32题","raw":"### B. **[xxx]** their product quality\n\n> **[xxx]**其产品质量\n\n把B接回题干，它说的是：批评者认为大科技公司对自身产品质量作出某种**[xxx]**。\n\nB谈产品质量，回第3段看批评者的抱怨落在哪里。\n\n> to chew up any innovative companies that lie in their path\n\n他们抱怨有创新能力的小企业被吞并、关闭，未来竞争者因此消失。第2段微软采用优秀功能，是另一方对收购后安排的说明。\n\nB动作词未知，也不能把微软关于功能的说法当成批评者关于产品质量的判断。\n\n**批评者这段发言是在评价巨头怎样改变产品质量吗？**\n\n不是。他们在说小企业被关闭与潜在竞争受影响。\n\n**第一轮判断：B排除。**","html":"<h3>B. <strong>[xxx]</strong> their product quality</h3>\n<blockquote><p><strong>[xxx]</strong>其产品质量</p>\n</blockquote>\n<p>把B接回题干，它说的是：批评者认为大科技公司对自身产品质量作出某种<strong>[xxx]</strong>。</p>\n<p>B谈产品质量，回第3段看批评者的抱怨落在哪里。</p>\n<blockquote><p>to chew up any innovative companies that lie in their path</p>\n</blockquote>\n<p>他们抱怨有创新能力的小企业被吞并、关闭，未来竞争者因此消失。第2段微软采用优秀功能，是另一方对收购后安排的说明。</p>\n<p>B动作词未知，也不能把微软关于功能的说法当成批评者关于产品质量的判断。</p>\n<p><strong>批评者这段发言是在评价巨头怎样改变产品质量吗？</strong></p>\n<p>不是。他们在说小企业被关闭与潜在竞争受影响。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14]],"questionRects":[[189,467,334,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"B","paragraphPids":[2]}},{"section":"32题","raw":"### C. treat new tech talent unfairly\n\n> 不公平地对待新技术人才\n\n把C接回题干，它说的是：批评者认为科技巨头对新技术人才待遇不公。\n\nC说人才待遇不公，回第2、3段分开工程师和企业的命运。\n\n> They bought the **[xxx]** and closed them down\n\n> putting an end to businesses\n\n工程师团队留下了，但原来的独立应用和业务被关闭。批评者指责的是后者及其竞争后果。\n\n留用不自动证明待遇公平，关闭业务也不自动证明工程师遭到不公平待遇；本段没有薪酬或工作条件的评价。\n\n**批评企业被关闭，就等于明确批评人才受到不公平待遇吗？**\n\n不等于。C换成了文中没有讨论的劳动待遇。\n\n**第一轮判断：C排除。**","html":"<h3>C. treat new tech talent unfairly</h3>\n<blockquote><p>不公平地对待新技术人才</p>\n</blockquote>\n<p>把C接回题干，它说的是：批评者认为科技巨头对新技术人才待遇不公。</p>\n<p>C说人才待遇不公，回第2、3段分开工程师和企业的命运。</p>\n<blockquote><p>They bought the <strong>[xxx]</strong> and closed them down</p>\n</blockquote>\n<blockquote><p>putting an end to businesses</p>\n</blockquote>\n<p>工程师团队留下了，但原来的独立应用和业务被关闭。批评者指责的是后者及其竞争后果。</p>\n<p>留用不自动证明待遇公平，关闭业务也不自动证明工程师遭到不公平待遇；本段没有薪酬或工作条件的评价。</p>\n<p><strong>批评企业被关闭，就等于明确批评人才受到不公平待遇吗？</strong></p>\n<p>不等于。C换成了文中没有讨论的劳动待遇。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14]],"questionRects":[[189,509,308,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"C","paragraphPids":[2]}},{"section":"32题","raw":"### D. ignore public opinions\n\n> 无视公众意见\n\n把D接回题干，它说的是：批评者认为大型科技公司倾向于不理会公众的看法。\n\nD说无视公众，回第3段看declined to comment说明什么。\n\n> Microsoft declined to comment.\n\n微软拒绝评论，是记者在呈现批评后补充的回应情况。批评者的实际内容是买下并关闭潜在对手。\n\n一次拒绝评论，不能代替他们对巨头行为的具体指责，更不能直接扩成普遍无视公众意见。\n\n**这处拒绝评论，就是批评者所说的主要行为吗？**\n\n不是。D没有接住批评者原话。\n\n**第一轮判断：D排除。**","html":"<h3>D. ignore public opinions</h3>\n<blockquote><p>无视公众意见</p>\n</blockquote>\n<p>把D接回题干，它说的是：批评者认为大型科技公司倾向于不理会公众的看法。</p>\n<p>D说无视公众，回第3段看declined to comment说明什么。</p>\n<blockquote><p>Microsoft declined to comment.</p>\n</blockquote>\n<p>微软拒绝评论，是记者在呈现批评后补充的回应情况。批评者的实际内容是买下并关闭潜在对手。</p>\n<p>一次拒绝评论，不能代替他们对巨头行为的具体指责，更不能直接扩成普遍无视公众意见。</p>\n<p><strong>这处拒绝评论，就是批评者所说的主要行为吗？</strong></p>\n<p>不是。D没有接住批评者原话。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14]],"questionRects":[[189,551,244,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"D","paragraphPids":[2]}},{"section":"32题","raw":"### 32题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。","html":"<h3>32题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n","articleRects":[],"questionRects":[[153,382,638,22],[189,424,378,22],[189,467,334,21],[189,509,308,22],[189,551,244,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> Paul Arnold is concerned that small acquisitions might ______.  \n> Paul Arnold担心小型收购可能产生什么影响？\n\n完整读Arnold承认mixed feelings的段落。先区分对自己的好处与对American economy的疑问，再审查B、C的范围。\n\n> 原文参考：\n> \n> Like other start-up investors, Mr Arnold’s own business often depends on selling start-ups to larger tech companies, though he admits to mixed feelings about the result: “I think these things are good for me, if I put my **[xxx]** hat on. But are they good for the American economy? I don’t know.”\n> \n> 开始精读：\n> \n> Like other start-up investors, / Mr Arnold’s own business often depends on selling start-ups to larger tech companies, / though he admits to mixed feelings about the result: / “I think these things are good for me, / if I put my **[xxx]** hat on. / But are they good for the American economy? / I don’t know.”\n> \n> 像其他初创企业投资者一样 / Arnold自己的生意往往依赖将初创企业卖给更大的科技公司 / 但他承认自己对这个结果心情复杂： / “我觉得这些事情对我有好处 / 如果我戴上我的**[xxx]**帽子。 / 但它们对美国经济有好处吗？ / 我不知道。”\n\n接下来按A—D逐项看。","html":"<h2>33题</h2>\n<blockquote><p>Paul Arnold is concerned that small acquisitions might ______.<br />\nPaul Arnold担心小型收购可能产生什么影响？</p>\n</blockquote>\n<p>完整读Arnold承认mixed feelings的段落。先区分对自己的好处与对American economy的疑问，再审查B、C的范围。</p>\n<blockquote><p>原文参考：</p>\n<p>Like other start-up investors, Mr Arnold’s own business often depends on selling start-ups to larger tech companies, though he admits to mixed feelings about the result: “I think these things are good for me, if I put my <strong>[xxx]</strong> hat on. But are they good for the American economy? I don’t know.”</p>\n<p>开始精读：</p>\n<p>Like other start-up investors, / Mr Arnold’s own business often depends on selling start-ups to larger tech companies, / though he admits to mixed feelings about the result: / “I think these things are good for me, / if I put my <strong>[xxx]</strong> hat on. / But are they good for the American economy? / I don’t know.”</p>\n<p>像其他初创企业投资者一样 / Arnold自己的生意往往依赖将初创企业卖给更大的科技公司 / 但他承认自己对这个结果心情复杂： / “我觉得这些事情对我有好处 / 如果我戴上我的<strong>[xxx]</strong>帽子。 / 但它们对美国经济有好处吗？ / 我不知道。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,672,746,21],[137,703,792,22],[137,734,786,22],[137,766,594,22]],"questionRects":[[153,636,567,21],[189,678,295,22],[189,720,291,22],[189,763,289,21],[189,805,303,21]],"scrollTarget":"article","meta":{"kind":"question","qid":"33","paragraphPids":[3]}},{"section":"33题","raw":"### A. weaken big tech companies\n\n> 削弱大型科技公司\n\n把A接回题干，它说的是：Arnold担心小型收购会削弱收购方科技巨头。\n\nA说削弱巨头，回第4段看Arnold在担心哪一方的利益。\n\n> I think these things are good for me\n\n> But are they good for the American economy?\n\n他先承认出售初创公司对自己生意有利，再追问对美国经济是否有利。收购方巨头被削弱，不是这两句之间的对照。\n\n前面还说巨头借收购吸收人才、关闭潜在对手，不能据此补出它们受损这一担忧。\n\n**Arnold转折后关心的是巨头变弱，还是整个经济受到什么影响？**\n\n是整个经济。A换了担忧的对象。\n\n**第一轮判断：A排除。**","html":"<h3>A. weaken big tech companies</h3>\n<blockquote><p>削弱大型科技公司</p>\n</blockquote>\n<p>把A接回题干，它说的是：Arnold担心小型收购会削弱收购方科技巨头。</p>\n<p>A说削弱巨头，回第4段看Arnold在担心哪一方的利益。</p>\n<blockquote><p>I think these things are good for me</p>\n</blockquote>\n<blockquote><p>But are they good for the American economy?</p>\n</blockquote>\n<p>他先承认出售初创公司对自己生意有利，再追问对美国经济是否有利。收购方巨头被削弱，不是这两句之间的对照。</p>\n<p>前面还说巨头借收购吸收人才、关闭潜在对手，不能据此补出它们受损这一担忧。</p>\n<p><strong>Arnold转折后关心的是巨头变弱，还是整个经济受到什么影响？</strong></p>\n<p>是整个经济。A换了担忧的对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,672,746,21],[137,703,792,22],[137,734,786,22],[137,766,594,22]],"questionRects":[[189,678,295,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"33","option":"A","paragraphPids":[3]}},{"section":"33题","raw":"### B. harm the national economy\n\n> 损害国家经济\n\n把B接回题干，它说的是：Arnold担心这些收购可能对国家经济造成损害。\n\nB说可能损害国家经济，回第4段看But are they good for the American economy？\n\n> But are they good for the American economy? I don’t know.\n\nArnold知道交易对自己有利，却不能确认对美国经济也有利。放在前面潜在对手被关闭的抱怨后，这份不确定带着对经济后果的担心。\n\n题干用might，B接上后也只是可能损害，并没有说已经证明整个经济遭到损失。\n\n**他不确定这些交易是否有利于美国经济，是否支持对经济受损的担忧？**\n\n支持。B直接对应转折后的American economy，先保留。\n\n**第一轮判断：B保留。**","html":"<h3>B. harm the national economy</h3>\n<blockquote><p>损害国家经济</p>\n</blockquote>\n<p>把B接回题干，它说的是：Arnold担心这些收购可能对国家经济造成损害。</p>\n<p>B说可能损害国家经济，回第4段看But are they good for the American economy？</p>\n<blockquote><p>But are they good for the American economy? I don’t know.</p>\n</blockquote>\n<p>Arnold知道交易对自己有利，却不能确认对美国经济也有利。放在前面潜在对手被关闭的抱怨后，这份不确定带着对经济后果的担心。</p>\n<p>题干用might，B接上后也只是可能损害，并没有说已经证明整个经济遭到损失。</p>\n<p><strong>他不确定这些交易是否有利于美国经济，是否支持对经济受损的担忧？</strong></p>\n<p>支持。B直接对应转折后的American economy，先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,672,746,21],[137,703,792,22],[137,73 ,794,22],[137,955,107,16]],"questionRects":[[153,889,506,17],[189,932,291,21],[189,974,286,22],[189,1016,343,22],[189,1058,320,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"34","paragraphPids":[4]}},{"section":"34题","raw":"### A. limit Big Tech’s expansion\n\n> 限制科技巨头扩张\n\n把A接回题干，它说的是：联邦贸易委员会打算限制大型科技公司的扩张。\n\nA说限制扩张，回第5段看only a research project at this stage。\n\n> it asked the five most valuable U.S. tech companies for information about their many small acquisitions\n\n> Although only a research project at this stage\n\n委员会向五家公司索取小型收购的信息，目前是一项研究。可能带来后续监管关注，并不等于已经决定限制扩张。\n\nA把调查之后可能考虑的措施，提前写成了目前已经明确的意图。\n\n**开始研究交易，就表示已经决定限制巨头扩张吗？**\n\n不表示。A超前了一步。\n\n**第一轮判断：A排除。**","html":"<h3>A. limit Big Tech’s expansion</h3>\n<blockquote><p>限制科技巨头扩张</p>\n</blockquote>\n<p>把A接回题干，它说的是：联邦贸易委员会打算限制大型科技公司的扩张。</p>\n<p>A说限制扩张，回第5段看only a research project at this stage。</p>\n<blockquote><p>it asked the five most valuable U.S. tech companies for information about their many small acquisitions</p>\n</blockquote>\n<blockquote><p>Although only a research project at this stage</p>\n</blockquote>\n<p>委员会向五家公司索取小型收购的信息，目前是一项研究。可能带来后续监管关注，并不等于已经决定限制扩张。</p>\n<p>A把调查之后可能考虑的措施，提前写成了目前已经明确的意图。</p>\n<p><strong>开始研究交易，就表示已经决定限制巨头扩张吗？</strong></p>\n<p>不表示。A超前了一步。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,797,746,22],[137,829,793,22],[137,860,793,22],[137,892,794,21],[136,923,794,22],[137,955,107,16]],"questionRects":[[189,932,291,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"A","paragraphPids":[4]}},{"section":"34题","raw":"### B. examine small acquisitions\n\n> 审查研究小型收购\n\n把B接回题干，它说的是：联邦贸易委员会打算考察小型收购的情况及影响。\n\nB说考察小型收购，回第5段找asked…for information about their many small acquisitions。\n\n> for information about their many small acquisitions over the past decade\n\n> only a research project at this stage\n\n索取的是过去十年多笔小型收购的资料，目的是回答这些交易对经济是否有利。研究对象与题干都很明确。\n\nB的examine保留调查研究这个阶段，没有直接预设处罚、禁止或限制的结论。\n\n**搜集小型收购资料以回答影响问题，是否就是考察这些收购？**\n\n是。B与已宣布的行动一致。\n\n**第一轮判断：B保留。**","html":"<h3>B. examine small acquisitions</h3>\n<blockquote><p>审查研究小型收购</p>\n</blockquote>\n<p>把B接回题干，它说的是：联邦贸易委员会打算考察小型收购的情况及影响。</p>\n<p>B说考察小型收购，回第5段找asked…for information about their many small acquisitions。</p>\n<blockquote><p>for information about their many small acquisitions over the past decade</p>\n</blockquote>\n<blockquote><p>only a research project at this stage</p>\n</blockquote>\n<p>索取的是过去十年多笔小型收购的资料，目的是回答这些交易对经济是否有利。研究对象与题干都很明确。</p>\n<p>B的examine保留调查研究这个阶段，没有直接预设处罚、禁止或限制的结论。</p>\n<p><strong>搜集小型收购资料以回答影响问题，是否就是考察这些收购？</strong></p>\n<p>是。B与已宣布的行动一致。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,797,746,22],[137,829,793,22],[137,860,793,22],[137,892,794,21],[136,923,794,22],[137,955,107,16]],"questionRects":[[189,974,286,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"34","option":"B","paragraphPids":[4]}},{"section":"34题","raw":"### C. **[xxx]** research collaboration\n\n> **[xxx]**研究合作\n\n把C接回题干，它说的是：联邦贸易委员会打算对研究合作采取某种**[xxx]**。\n\nC说研究合作，回第5段看research project研究的宾语。\n\n> it asked the five most valuable U.S. tech companies for information\n\n项目研究的是收购交易，不是科研机构之间如何合作。委员会向公司要资料，也不等于它在制定一种研究合作安排。\n\nC动词未知，但collaboration已经另换主题；不能看到research就把两个不同对象接在一起。\n\n**本文出现研究项目，就证明委员会要处理研究合作吗？**\n\n不能。C把研究这项行动与研究合作这个对象混在了一起。\n\n**第一轮判断：C排除。**","html":"<h3>C. <strong>[xxx]</strong> research collaboration</h3>\n<blockquote><p><strong>[xxx]</strong>研究合作</p>\n</blockquote>\n<p>把C接回题干，它说的是：联邦贸易委员会打算对研究合作采取某种<strong>[xxx]</strong>。</p>\n<p>C说研究合作，回第5段看research project研究的宾语。</p>\n<blockquote><p>it asked the five most valuable U.S. tech companies for information</p>\n</blockquote>\n<p>项目研究的是收购交易，不是科研机构之间如何合作。委员会向公司要资料，也不等于它在制定一种研究合作安排。</p>\n<p>C动词未知，但collaboration已经另换主题；不能看到research就把两个不同对象接在一起。</p>\n<p><strong>本文出现研究项目，就证明委员会要处理研究合作吗？</strong></p>\n<p>不能。C把研究这项行动与研究合作这个对象混在了一起。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,797,746,22],[137,829,793,22],[137,860,793,22],[137,892,794,21],[136,923,794,22],[137,955,107,16]],"questionRects":[[189,1016,343,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"C","paragraphPids":[4]}},{"section":"34题","raw":"### D. supervise start-ups’ operations\n\n> 监督初创企业的运营\n\n把D接回题干，它说的是：联邦贸易委员会打算监督初创公司的日常运营。\n\nD说监督初创公司经营，回第5段看索取资料的对象。\n\n> the five most valuable U.S. tech companies\n\n> information about their many small acquisitions over the past decade\n\n资料向五大科技公司索取，内容是它们做过的小型收购。虽然交易涉及初创企业，但研究的是交易及其影响。\n\nD改成对初创企业日常运营进行监督，既换了被调查方，也把研究收购换成了经营监管。\n\n**涉及初创企业的收购调查，是否等于监督它们日常经营？**\n\n不是。D没有保留本次行动的范围。\n\n**第一轮判断：D排除。**","html":"<h3>D. supervise start-ups’ operations</h3>\n<blockquote><p>监督初创企业的运营</p>\n</blockquote>\n<p>把D接回题干，它说的是：联邦贸易委员会打算监督初创公司的日常运营。</p>\n<p>D说监督初创公司经营，回第5段看索取资料的对象。</p>\n<blockquote><p>the five most valuable U.S. tech companies</p>\n</blockquote>\n<blockquote><p>information about their many small acquisitions over the past decade</p>\n</blockquote>\n<p>资料向五大科技公司索取，内容是它们做过的小型收购。虽然交易涉及初创企业，但研究的是交易及其影响。</p>\n<p>D改成对初创企业日常运营进行监督，既换了被调查方，也把研究收购换成了经营监管。</p>\n<p><strong>涉及初创企业的收购调查，是否等于监督它们日常经营？</strong></p>\n<p>不是。D没有保留本次行动的范围。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,797,746,22],[137,829,793,22],[137,860,793,22],[137,892,794,21],[136,923,794,22],[137,955,107,16]],"questionRects":[[189,1058,320,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"D","paragraphPids":[4]}},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。","html":"<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n","articleRects":[],"questionRects":[[153,889,506,17],[189,932,291,21],[189,974,286,22],[189,1016,343,22],[189,1058,320,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n> For the five biggest tech companies, their small acquisitions have ______.  \n> 对于五家最大的科技公司而言，小型收购带来了什么？\n\n完整读第6段，先认清数字分别是合计市值、每年收购支出和投入资本，再用a drop in the ocean理解相对规模。\n\n> 原文参考：\n> \n> Given their combined market value of more than $5.5 trillion, **[xxx]** through such small deals —many of them much less **[xxx]** than Wunderlist and Sunrise— might seem beside the point. Between them, the five biggest tech companies have spent an average of only $3.4 billion a year on sub-$1 billion acquisitions over the past five years —a drop in the ocean compared with their **[xxx]** financial reserves, and the more than $130 billion of **[xxx]** capital that was invested in the U.S. last year.\n> \n> 开始精读：\n> \n> Given their combined market value of more than $5.5 trillion, / **[xxx]** through such small deals / —many of them much less **[xxx]** than Wunderlist and Sunrise— / might seem beside the point. / Between them, the five biggest tech companies / have spent an average of only $3.4 billion a year / on sub-$1 billion acquisitions over the past five years / —a drop in the ocean compared with their **[xxx]** financial reserves, / and the more than $130 billion of **[xxx]** capital / that was invested in the U.S. last year.\n> \n> 考虑到它们合计超过五点五万亿美元的市值 / **[xxx]**这些小交易 / ——其中很多远不如Wunderlist和Sunrise那样**[xxx]**—— / 似乎偏离重点。 / 合计来看这五家最大的科技公司 / 平均每年仅花三十四亿美元 / 用于过去五年中单笔不到十亿美元的收购 / ——与其**[xxx]**的资金储备相比是沧海一粟 / 也与超过一千三百亿美元的**[xxx]**资本相比 / 去年投入美国的这些资本。\n\n接下来按A—D逐项看。","html":"<h2>35题</h2>\n<blockquote><p>For the five biggest tech companies, their small acquisitions have ______.<br />\n对于五家最大的科技公司而言，小型收购带来了什么？</p>\n</blockquote>\n<p>完整读第6段，先认清数字分别是合计市值、每年收购支出和投入资本，再用a drop in the ocean理解相对规模。</p>\n<blockquote><p>原文参考：</p>\n<p>Given their combined market value of more than $5.5 trillion, <strong>[xxx]</strong> through such small deals —many of them much less <strong>[xxx]</strong> than Wunderlist and Sunrise— might seem beside the point. Between them, the five biggest tech companies have spent an average of only $3.4 billion a year on sub-$1 billion acquisitions over the past five years —a drop in the ocean compared with their <strong>[xxx]</strong> financial reserves, and the more than $130 billion of <strong>[xxx]</strong> capital that was invested in the U.S. last year.</p>\n<p>开始精读：</p>\n<p>Given their combined market value of more than $5.5 trillion, / <strong>[xxx]</strong> through such small deals / —many of them much less <strong>[xxx]</strong> than Wunderlist and Sunrise— / might seem beside the point. / Between them, the five biggest tech companies / have spent an average of only $3.4 billion a year / on sub-$1 billion acquisitions over the past five years / —a drop in the ocean compared with their <strong>[xxx]</strong> financial reserves, / and the more than $130 billion of <strong>[xxx]</strong> capital / that was invested in the U.S. last year.</p>\n<p>考虑到它们合计超过五点五万亿美元的市值 / <strong>[xxx]</strong>这些小交易 / ——其中很多远不如Wunderlist和Sunrise那样<strong>[xxx]</strong>—— / 似乎偏离重点。 / 合计来看这五家最大的科技公司 / 平均每年仅花三十四亿美元 / 用于过去五年中单笔不到十亿美元的收购 / ——与其<strong>[xxx]</strong>的资金储备相比是沧海一粟 / 也与超过一千三百亿美元的<strong>[xxx]</strong>资本相比 / 去年投入美国的这些资本。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,985,745,23],[136,1017,794,22],[137,1049,792,22],[137,1079,793,23],[137,1112,793,22],[137,1143,793,22],[137,1175,344,22]],"questionRects":[[153,1143,678,22],[189,1185,316,22],[189,1228,362,21],[189,1270,329,21],[189,1312,330,22],[394,1397,149,19],[612,1397,91,19]],"scrollTarget":"article","meta":{"kind":"question","qid":"35","paragraphPids":[5]}},{"section":"35题","raw":"### A. generated **[xxx]** profits\n\n> 产生了**[xxx]**的利润\n\n把A接回题干，它说的是：小型收购为五家科技巨头带来了某种程度的利润。\n\nA说产生利润，回第6段看34亿美元是spent还是赚到的钱。\n\n> have spent an average of only $3.4 billion a year\n\n这笔平均年度金额是收购支出，拿来与巨头资金储备和市场投资规模比较。没有提供收购后带来的收入或净利润。\n\nA形容利润的词未知，但profits已经不是这些数字衡量的项目。花得少也不能单独证明赚得多。\n\n**收购花费占储备很少，就能推出利润达到某种水平吗？**\n\n不能。A把支出比较变成了收益报告。\n\n**第一轮判断：A排除。**","html":"<h3>A. generated <strong>[xxx]</strong> profits</h3>\n<blockquote><p>产生了<strong>[xxx]</strong>的利润</p>\n</blockquote>\n<p>把A接回题干，它说的是：小型收购为五家科技巨头带来了某种程度的利润。</p>\n<p>A说产生利润，回第6段看34亿美元是spent还是赚到的钱。</p>\n<blockquote><p>have spent an average of only $3.4 billion a year</p>\n</blockquote>\n<p>这笔平均年度金额是收购支出，拿来与巨头资金储备和市场投资规模比较。没有提供收购后带来的收入或净利润。</p>\n<p>A形容利润的词未知，但profits已经不是这些数字衡量的项目。花得少也不能单独证明赚得多。</p>\n<p><strong>收购花费占储备很少，就能推出利润达到某种水平吗？</strong></p>\n<p>不能。A把支出比较变成了收益报告。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,985,745,23],[136,1017,794,22],[137,1049,792,22],[137,1079,793,23],[137,1112,793,22],[137,1143,793,22],[137,1175,344,22]],"questionRects":[[189,1185,316,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"A","paragraphPids":[5]}},{"section":"35题","raw":"### B. raised few management challenges\n\n> 带来很少的管理难题\n\n把B接回题干，它说的是：这些小型收购给五家巨头造成的管理挑战不多。\n\nB说管理难题少，回第6段看a drop in the ocean比较什么。\n\n> a drop in the ocean compared with their **[xxx]** financial reserves\n\n沧海一粟形容交易金额相对巨头庞大的资金储备很小。这里衡量的是钱，不是整合团队、技术或制度的难度。\n\n小额收购也可能有管理困难，原文没有对此统计。不能把资金负担轻直接改成管理容易。\n\n**金额小这个比较，是否同时证明管理挑战少？**\n\n不证明。B换了衡量的方面。\n\n**第一轮判断：B排除。**","html":"<h3>B. raised few management challenges</h3>\n<blockquote><p>带来很少的管理难题</p>\n</blockquote>\n<p>把B接回题干，它说的是：这些小型收购给五家巨头造成的管理挑战不多。</p>\n<p>B说管理难题少，回第6段看a drop in the ocean比较什么。</p>\n<blockquote><p>a drop in the ocean compared with their <strong>[xxx]</strong> financial reserves</p>\n</blockquote>\n<p>沧海一粟形容交易金额相对巨头庞大的资金储备很小。这里衡量的是钱，不是整合团队、技术或制度的难度。</p>\n<p>小额收购也可能有管理困难，原文没有对此统计。不能把资金负担轻直接改成管理容易。</p>\n<p><strong>金额小这个比较，是否同时证明管理挑战少？</strong></p>\n<p>不证明。B换了衡量的方面。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,985,745,23],[136,1017,794,22],[137,1049,792,22],[137,1079,793,23],[137,1112,793,22],[137,1143,793,22],[137,1175,344,22]],"questionRects":[[189,1228,362,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"B","paragraphPids":[5]}},{"section":"35题","raw":"### C. set an example for future deals\n\n> 为未来交易树立范例\n\n把C接回题干，它说的是：这些小型收购为今后的收购交易建立了可借鉴范例。\n\nC说为后续交易示范，回第6段看作者在评价成功经验吗。\n\n> might seem o gain <strong>[xxx]</strong>, / in some cases as part of a “buy and kill” <strong>[xxx]</strong> / to simply close them down.</p>\n<p>然而批评者说大公司利用这类交易 / 买下最具威胁的潜在竞争对手 / 在这些企业有机会获得<strong>[xxx]</strong>之前 / 在某些情况下作为“买下并杀死”的<strong>[xxx]</strong>的一部分 / 就把它们关闭。</p>\n</blockquote>\n","articleRects":[[184,1206,746,22],[137,1242,793,21],[137,1276,793,23],[137,1313,56,16]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","paragraphPids":[6]}},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | Microsoft；start-ups；smartphone | 微软收购为智能手机设计的新应用，引入两个初创企业案例。 | 交代收购对象与技术背景。 |\n| 第2段 | however；best features；engineers stayed | 产品功能被纳入微软产品，工程师团队留下，体现收购吸纳技术与人才。 | 说明收购后的功能及人员去向。 |\n| 第3段 | critics；closed them down；competitors | 批评者认为买下并关闭创新企业，会使未来竞争对手消失。 | 从案例转入对竞争后果的指控。 |\n| 第4段 | good for me；But；American economy | 投资者承认交易对自己有利，但不确定它是否有益于美国经济。 | 将私人收益与整体经济后果区分开。 |\n| 第5段 | that question；information；research project | 委员会向巨头索取小型收购资料，当前仍处在研究阶段。 | 承接经济疑问，介绍调查行动。 |\n| 第6段 | only；drop in the ocean；financial reserves | 这些收购金额相对于巨头的资金储备很小，财务负担有限。 | 解释为什么小交易看似不显眼。 |\n| 第7段 | However；potential competitors；buy and kill | 批评者指出，小额交易仍可能提前终结最有威胁的潜在对手。 | 转折说明金额小不等于竞争影响小。 |\n\n**全文的主要意思：科技巨头的小型收购能吸收功能和人才，也使投资者获利；但批评者担心它们过早终结潜在对手，整体经济后果因此值得调查，不能因为金额相对很小就忽略。**","html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>Microsoft；start-ups；smartphone</td><td>微软收购为智能手机设计的新应用，引入两个初创企业案例。</td><td>交代收购对象与技术背景。</td></tr><tr><td>第2段</td><td>however；best features；engineers stayed</td><td>产品功能被纳入微软产品，工程师团队留下，体现收购吸纳技术与人才。</td><td>说明收购后的功能及人员去向。</td></tr><tr><td>第3段</td><td>critics；closed them down；competitors</td><td>批评者认为买下并关闭创新企业，会使未来竞争对手消失。</td><td>从案例转入对竞争后果的指控。</td></tr><tr><td>第4段</td><td>good for me；But；American economy</td><td>投资者承认交易对自己有利，但不确定它是否有益于美国经济。</td><td>将私人收益与整体经济后果区分开。</td></tr><tr><td>第5段</td><td>that question；information；research project</td><td>委员会向巨头索取小型收购资料，当前仍处在研究阶段。</td><td>承接经济疑问，介绍调查行动。</td></tr><tr><td>第6段</td><td>only；drop in the ocean；financial reserves</td><td>这些收购金额相对于巨头的资金储备很小，财务负担有限。</td><td>解释为什么小交易看似不显眼。</td></tr><tr><td>第7段</td><td>However；potential competitors；buy and kill</td><td>批评者指出，小额交易仍可能提前终结最有威胁的潜在对手。</td><td>转折说明金额小不等于竞争影响小。</td></tr></tbody></table>\n<p><strong>全文的主要意思：科技巨头的小型收购能吸收功能和人才，也使投资者获利；但批评者担心它们过早终结潜在对手，整体经济后果因此值得调查，不能因为金额相对很小就忽略。</strong></p>\n","articleRects":[[184,200,745,22],[137,231,792,22],[137,263,793,21],[136,293,795,23],[137,326,651,21],[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22],[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14],[184,672,746,21],[137,703,792,22],[137,734,786,22],[137,766,594,22],[184,797,746,22],[137,829,793,22],[137,860,793,22],[137,892,794,21],[136,923,794,22],[137,955,107,16],[184,985,745,23],[136,1017,794,22],[137,1049,792,22],[137,1079,793,23],[137,1112,793,22],[137,1143,793,22],[137,1175,344,22],[184,1206,746,22],[137,1242,793,21],[137,1276,793,23],[137,1313,56,16]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]}},{"section":"进阶回查","raw":"## 回查33题：B还是C？\n\nPaul Arnold is concerned that small acquisitions might ______.\n\nB. harm the national economy\n\nC. worsen market competition\n\n## 第33题二选一：B / C\n\nC能接上第3段：初创企业可能长成竞争者，却先被买下关闭，竞争当然可能因此受影响。这一项先不能说成没有出处。\n\n再看Arnold紧接着怎样谈自己的生意。他靠出售初创公司获利，所以先说这些交易对自己是好事；But之后却问对American economy是否也是好事，并回答不知道。疑虑从自己的收益转到整个经济的后果。\n\n第5段委员会想回答that question，接的也正是交易对经济是否有利的问题。竞争者被关闭可以帮助解释这种担心，但不等于把他直接说出的经济问题缩成竞争这一项。\n\n**比较这段实际追问，哪项直接接住American economy？**\n\nB直接对应，而且与题干might连起来只是可能损害的担心，不是断言损失已经发生。C说明了一种相关风险，B则更贴近Arnold在此处明确提出的问题。\n\n**最终选择：33. B。**","html":"<h2>回查33题：B还是C？</h2>\n<p>Paul Arnold is concerned that small acquisitions might ______.</p>\n<p>B. harm the national economy</p>\n<p>C. worsen market competition</p>\n<h2>第33题二选一：B / C</h2>\n<p>C能接上第3段：初创企业可能长成竞争者，却先被买下关闭，竞争当然可能因此受影响。这一项先不能说成没有出处。</p>\n<p>再看Arnold紧接着怎样谈自己的生意。他靠出售初创公司获利，所以先说这些交易对自己是好事；But之后却问对American economy是否也是好事，并回答不知道。疑虑从自己的收益转到整个经济的后果。</p>\n<p>第5段委员会想回答that question，接的也正是交易对经济是否有利的问题。竞争者被关闭可以帮助解释这种担心，但不等于把他直接说出的经济问题缩成竞争这一项。</p>\n<p><strong>比较这段实际追问，哪项直接接住American economy？</strong></p>\n<p>B直接对应，而且与题干might连起来只是可能损害的担心，不是断言损失已经发生。C说明了一种相关风险，B则更贴近Arnold在此处明确提出的问题。</p>\n<p><strong>最终选择：33. B。</strong></p>\n","articleRects":[[184,200,745,22],[137,231,792,22],[137,263,793,21],[136,293,795,23],[137,326,651,21],[184,357,746,22],[136,388,782,22],[137,419,793,23],[136,451,398,22],[184,483,746,22],[136,514,794,22],[137,545,792,22],[136,577,793,22],[136,609,793,21],[137,643,92,14],[184,672,746,21],[137,703,792,22],[137,734,786,22],[137,766,594,22],[184,797,746,22],[137,829,793,22],[137,860,793,22],[137,892,794,21],[136,923,794,22],[137,955,107,16],[184,985,745,23],[136,1017,794,22],[137,1049,792,22],[137,1079,793,23],[137,1112,793,22],[137,1143,793,22],[137,1175,344,22],[184,1206,746,22],[137,1242,793,21],[137,1276,793,23],[137,1313,56,16]],"questionRects":[[153,636,567,21],[189,678,295,22],[189,720,291,22],[189,763,289,21],[189,805,303,21]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","C"],"finalChoice":"B","qid":"33","paragraphPids":[0,1,2,3,4,5,6]}},{"section":"最终答案","raw":"## 最终答案\n\n**31. D**\n\n**32. A**\n\n**33. B**\n\n**34. B**\n\n**35. D**","html":"<h2>最终答案</h2>\n<p><strong>31. D</strong></p>\n<p><strong>32. A</strong></p>\n<p><strong>33. B</strong></p>\n<p><strong>34. B</strong></p>\n<p><strong>35. D</strong></p>\n","articleRects":[],"questionRects":[[153,128,684,22],[189,171,321,21],[189,213,314,17],[189,255,312,22],[188,298,322,22],[153,382,638,22],[189,424,378,22],[189,467,334,21],[189,509,308,22],[189,551,244,22],[153,636,567,21],[189,678,295,22],[189,720,291,22],[189,763,289,21],[189,805,303,21],[153,889,506,17],[189,932,291,21],[189,974,286
