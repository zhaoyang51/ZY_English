<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**Which of the following is true about Madrid’s clean air zone?**\n\n> 关于马德里的清洁空气区，哪项符合原文？\n\n题型：**具体细节题**。","html":"<h2>31题题干</h2>\n<p><strong>Which of the following is true about Madrid’s clean air zone?</strong></p>\n<blockquote><p>关于马德里的清洁空气区，哪项符合原文？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[153,128,642,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**What is considered a weakness of the city-level measures to tackle dirty air?**\n\n> 城市层面治理空气污染的措施被认为有什么弱点？\n\n题型：**具体原因题**。","html":"<h2>32题题干</h2>\n<p><strong>What is considered a weakness of the city-level measures to tackle dirty air?</strong></p>\n<blockquote><p>城市层面治理空气污染的措施被认为有什么弱点？</p>\n</blockquote>\n<p>题型：<strong>具体原因题</strong>。</p>\n","articleRects":[],"questionRects":[[153,382,785,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**The author believes that the extension of London’s Ulez will ______.**\n\n> 作者认为扩大伦敦Ulez将带来什么？\n\n题型：**具体预测题**。","html":"<h2>33题题干</h2>\n<p><strong>The author believes that the extension of London’s Ulez will ______.</strong></p>\n<blockquote><p>作者认为扩大伦敦Ulez将带来什么？</p>\n</blockquote>\n<p>题型：<strong>具体预测题</strong>。</p>\n","articleRects":[],"questionRects":[[153,636,628,17]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**Who does the author think should have addressed the problem?**\n\n> 作者认为本应由谁处理这个问题？\n\n题型：**具体责任归属题**。","html":"<h2>34题题干</h2>\n<p><strong>Who does the author think should have addressed the problem?</strong></p>\n<blockquote><p>作者认为本应由谁处理这个问题？</p>\n</blockquote>\n<p>题型：<strong>具体责任归属题</strong>。</p>\n","articleRects":[],"questionRects":[[153,890,653,21]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**It can be learned from the last paragraph that auto companies ______.**\n\n> 从末段可知，汽车公司应当或将会怎样？\n\n题型：**具体观点题**。","html":"<h2>35题题干</h2>\n<p><strong>It can be learned from the last paragraph that auto companies ______.</strong></p>\n<blockquote><p>从末段可知，汽车公司应当或将会怎样？</p>\n</blockquote>\n<p>题型：<strong>具体观点题</strong>。</p>\n","articleRects":[],"questionRects":[[153,1143,635,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | despite, But, rather than |\n| 态度词 / 评价词 | 先抓个大概好坏 | success, uncertain, useless |\n| 动作词 | 先看谁做了什么 | pay, require, enforce |\n| 结果词 | 看最后出了什么事 | costs, fines, regulations |\n| 重复主题词 | 大概知道老在说什么 | drivers, manufacturers, governments |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>despite, But, rather than</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>success, uncertain, useless</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>pay, require, enforce</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>costs, fines, regulations</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>drivers, manufacturers, governments</td></tr></tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Madrid was **[xxx]** as a public health guiding light last November when it rolled out **[xxx]** restrictions on the most polluting cars. Seven months and one election day later, a new **[xxx]** city council **[xxx]** **[xxx]** of the clean air zone, a first step toward its possible **[xxx]**. Mayor José Luis Martínez-Almeida made opposition to the zone a **[xxx]** of his election campaign, despite its success in improving air quality. A judge has now **[xxx]** the city’s decision to stop **[xxx]** fines, ordering them restored. But with legal battles ahead, the zone’s future looks uncertain at best.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Madrid was <strong>[xxx]</strong> as a public health guiding light last November when it rolled out <strong>[xxx]</strong> restrictions on the most polluting cars. Seven months and one election day later, a new <strong>[xxx]</strong> city council <strong>[xxx]</strong> <strong>[xxx]</strong> of the clean air zone, a first step toward its possible <strong>[xxx]</strong>. Mayor José Luis Martínez-Almeida made opposition to the zone a <strong>[xxx]</strong> of his election campaign, despite its success in improving air quality. A judge has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> fines, ordering them restored. But with legal battles ahead, the zone’s future looks uncertain at best.</p>\n</div></div>","articleRects":[[184,213,746,22],[136,247,793,22],[137,280,792,22],[137,313,792,22],[136,346,794,22],[137,380,792,22],[137,413,793,22],[137,446,643,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":""},{"section":"读文章","raw":"Madrid was **[xxx]** 然地说清楚：措施效果与未来命运怎样区分，成本由谁承担，作者究竟要求哪个层面补上行动。先记住这些信息大概在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：清洁空气区、汽车、司机、地方措施和政府。刚才还看到：马德里、公共健康指路明灯、去年十一月、限制、污染最重汽车、七个月、一个选举日、市议会、清洁空气区、反对、竞选活动、改善空气质量的成功、一名法官、罚款、法律争斗、未来不确定；马德里的反复、局限、逐城方式、欧洲；弱点、城市、脏空气、净化空气的成本、个体司机、付费、汽车制造商、伦敦、选举、Sadiq Khan、强烈反对、驾驶者；伦敦Ulez、没用、地方官员、居民健康、空气质量改善、健康收益；市长、一个城镇、国家政府；高污染汽车、某些区域、市中心、个别道路、缺位、恰当执行现有法规、要求汽车公司、威尔士、低速限制、污染、制造商清洁其汽车。</p>\n<p>到这里还不能自然地说清楚：措施效果与未来命运怎样区分，成本由谁承担，作者究竟要求哪个层面补上行动。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> Which of the following is true about Madrid’s clean air zone?  \n> 关于马德里的清洁空气区，哪项符合原文？\n\nMadrid与clean air zone定位首段。按先实施、选举后变化、法官介入和未来诉讼的顺序读，分清效果与存续前景。\n\n> 原文参考：\n> \n> Madrid was **[xxx]** as a public health guiding light last November when it rolled out **[xxx]** restrictions on the most polluting cars. Seven months and one election day later, a new **[xxx]** city council **[xxx]** **[xxx]** of the clean air zone, a first step toward its possible **[xxx]**. Mayor José Luis Martínez-Almeida made opposition to the zone a **[xxx]** of his election campaign, despite its success in improving air quality. A judge has now **[xxx]** the city’s decision to stop **[xxx]** fines, ordering them restored. But with legal battles ahead, the zone’s future looks uncertain at best.\n> \n> 开始精读：\n> \n> Madrid was **[xxx]** as a public health guiding light last November / when it rolled out **[xxx]** restrictions on the most polluting cars. / Seven months and one election day later, / a new **[xxx]** city council **[xxx]** **[xxx]** of the clean air zone, / a first step toward its possible **[xxx]**. / Mayor José Luis Martínez-Almeida made opposition to the zone / a **[xxx]** of his election campaign, / despite its success in improving air quality. / A judge has now **[xxx]** the city’s decision to stop **[xxx]** fines, / ordering them restored. / But with legal battles ahead, / the zone’s future looks uncertain at best.\n> \n> 去年十一月马德里被**[xxx]**为公共健康的指路明灯 / 当它对污染最重的汽车推出**[xxx]**限制时。 / 七个月和一个选举日之后 / 新的**[xxx]**市议会**[xxx]**了清洁空气区的**[xxx]** / 成为其可能**[xxx]**的第一步。 / 市长José Luis Martínez-Almeida将反对该区域 / 作为竞选活动的**[xxx]** / 尽管它在改善空气质量方面取得成功。 / 一名法官如今**[xxx]**了市政府停止**[xxx]**罚款的决定 / 下令恢复罚款。 / 但前方还有法律争斗 / 该区域的未来充其量仍显得不确定。\n\n接下来按A—D逐项看。","html":"<h2>31题</h2>\n<blockquote><p>Which of the following is true about Madrid’s clean air zone?<br />\n关于马德里的清洁空气区，哪项符合原文？</p>\n</blockquote>\n<p>Madrid与clean ai ckquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,213,746,22],[136,247,793,22],[137,280,792,22],[137,313,792,22],[136,346,794,22],[137,380,792,22],[137,413,793,22],[137,446,643,22]],"questionRects":[[153,128,642,22],[189,171,293,21],[189,213,338,22],[189,255,316,22],[189,298,302,21]],"scrollTarget":"article","meta":{"kind":"question","qid":"31","paragraphPids":[0]}},{"section":"31题","raw":"### A. Its effects are questionable.\n\n> 它的效果值得怀疑\n\n把A接回题干，它说的是：马德里清洁空气区的治理效果值得怀疑。\n\nA怀疑效果，回首段找despite its success in improving air quality。\n\n> despite its success in improving air quality.\n\n> the zone’s future looks uncertain at best.\n\n市长反对清洁空气区，但作者在despite后明确承认它成功改善空气质量。受到反对的是政策，不等于效果已经遭到事实否定。\n\n段末uncertain说的是该区能否继续存在，不是已有空气改善是否真实。\n\n**未来不确定，是否就是治理效果值得怀疑？**\n\n不是。A把政策去留与已经取得的效果混在了一起。\n\n**第一轮判断：A排除。**","html":"<h3>A. Its effects are questionable.</h3>\n<blockquote><p>它的效果值得怀疑</p>\n</blockquote>\n<p>把A接回题干，它说的是：马德里清洁空气区的治理效果值得怀疑。</p>\n<p>A怀疑效果，回首段找despite its success in improving air quality。</p>\n<blockquote><p>despite its success in improving air quality.</p>\n</blockquote>\n<blockquote><p>the zone’s future looks uncertain at best.</p>\n</blockquote>\n<p>市长反对清洁空气区，但作者在despite后明确承认它成功改善空气质量。受到反对的是政策，不等于效果已经遭到事实否定。</p>\n<p>段末uncertain说的是该区能否继续存在，不是已有空气改善是否真实。</p>\n<p><strong>未来不确定，是否就是治理效果值得怀疑？</strong></p>\n<p>不是。A把政策去留与已经取得的效果混在了一起。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,213,746,22],[136,247,793,22],[137,280,792,22],[137,313,792,22],[136,346,794,22],[137,380,792,22],[137,413,793,22],[137,446,643,22]],"questionRects":[[189,171,293,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"A","paragraphPids":[0]}},{"section":"31题","raw":"### B. It has been opposed by a judge.\n\n> 它受到一名法官反对\n\n把B接回题干，它说的是：清洁空气区遭到一名法官的反对。\n\nB说法官反对，回首段看ordering them restored恢复的是什么。\n\n> A judge has now **[xxx]** the city’s decision to stop **[xxx]** fines, ordering them restored.\n\n市政府决定停止罚款，法官却命令恢复罚款。恢复这项执行手段，并不是让清洁空气区停止运转。\n\n >恢复已经存在的措施，就等于要求把措施进一步加严吗？</strong></p>\n<p>不等于。C的tougher没有对应。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,213,746,22],[136,247,793,22],[137,280,792,22],[137,313,792,22],[136,346,794,22],[137,380,792,22],[137,413,793,22],[137,446,643,22]],"questionRects":[[189,255,316,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"C","paragraphPids":[0]}},{"section":"31题","raw":"### D. Its fate is yet to be decided.\n\n> 它的命运尚待决定\n\n把D接回题干，它说的是：马德里清洁空气区今后如何仍未确定。\n\nD说命运未定，回首段最后一句看future looks uncertain at best。\n\n> But with legal battles ahead, the zone’s future looks uncertain at best.\n\n新市政府反对并暂停部分执行，法官又要求恢复罚款，前面一停一恢复已经显示争执。段末还说未来仍有法律较量。\n\nD的yet to be decided概括的正是未来尚不确定，并没有否认该区此前改善空气的效果。\n\n**仍有法律争执、未来不确定，是否就是去留尚待决定？**\n\n是。D与末句直接对应。\n\n**第一轮判断：D保留。**","html":"<h3>D. Its fate is yet to be decided.</h3>\n<blockquote><p>它的命运尚待决定</p>\n</blockquote>\n<p>把D接回题干，它说的是：马德里清洁空气区今后如何仍未确定。</p>\n<p>D说命运未定，回首段最后一句看future looks uncertain at best。</p>\n<blockquote><p>But with legal battles ahead, the zone’s future looks uncertain at best.</p>\n</blockquote>\n<p>新市政府反对并暂停部分执行，法官又要求恢复罚款，前面一停一恢复已经显示争执。段末还说未来仍有法律较量。</p>\n<p>D的yet to be decided概括的正是未来尚不确定，并没有否认该区此前改善空气的效果。</p>\n<p><strong>仍有法律争执、未来不确定，是否就是去留尚待决定？</strong></p>\n<p>是。D与末句直接对应。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[184,213,746,22],[136,247,793,22],[137,280,792,22],[137,313,792,22],[136,346,794,22],[137,380,792,22],[137,413,793,22],[137,446,643,22]],"questionRects":[[189,298,302,21]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"31","option":"D","paragraphPids":[0]}},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","html":"<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n","articleRects":[],"questionRects":[[153,128,642,22],[189,171,293,21],[189,213,338,22],[189,255,316,22],[189,298,302,21]],"scrollTarget":"question","meta":{"kind":"first_result", 32题","raw":"### A. They put the burden on individual motorists.\n\n> 它们把负担放在个体驾驶者身上\n\n把A接回题干，它说的是：城市治理措施的弱点是让个体驾驶者承担负担。\n\nA说司机承担负担，回第3段看put the costs…on to individual drivers。\n\n> put the costs of cleaning the air on to individual drivers —who must pay fees or buy better vehicles— rather than on to the car manufacturers\n\n司机需要付费，或花钱换更好的车。这两个例子明确说明城市措施把治理成本交给个体承担。\n\n作者随后用rather than指出，成本没有落到他认为应负主要责任的汽车制造商身上。这正是被批评的安排。\n\n**缴费和换车都由司机出钱，是否对应A的个体负担？**\n\n对应。A有直接句子及两个例子支持。\n\n**第一轮判断：A保留。**","html":"<h3>A. They put the burden on individual motorists.</h3>\n<blockquote><p>它们把负担放在个体驾驶者身上</p>\n</blockquote>\n<p>把A接回题干，它说的是：城市治理措施的弱点是让个体驾驶者承担负担。</p>\n<p>A说司机承担负担，回第3段看put the costs…on to individual drivers。</p>\n<blockquote><p>put the costs of cleaning the air on to individual drivers —who must pay fees or buy better vehicles— rather than on to the car manufacturers</p>\n</blockquote>\n<p>司机需要付费，或花钱换更好的车。这两个例子明确说明城市措施把治理成本交给个体承担。</p>\n<p>作者随后用rather than指出，成本没有落到他认为应负主要责任的汽车制造商身上。这正是被批评的安排。</p>\n<p><strong>缴费和换车都由司机出钱，是否对应A的个体负担？</strong></p>\n<p>对应。A有直接句子及两个例子支持。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[184,580,745,21],[136,613,793,22],[137,646,792,22],[137,679,792,22],[137,713,792,21],[137,746,792,22],[137,778,786,23],[136,813,794,21],[135,846,795,22],[137,879,452,17]],"questionRects":[[189,424,463,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"32","option":"A","paragraphPids":[2]}},{"section":"32题","raw":"### B. They prove impractical for city councils.\n\n> 它们对市议会而言被证明不可实行\n\n把B接回题干，它说的是：城市治理措施的弱点是市议会无法实际采用这些措施。\n\nB说市议会无法实行，回首段和第4段看措施有没有真正落地。\n\n> the measures cities must employ when left to tackle dirty air on their own\n\n> put the costs of cleaning the air on to individual drivers\n\n马德里已经实施过限制，空气质量也有所改善。第4段还承认地方官员使用现有办法获得健康收益。\n\n政治上容易受反对，或后来被撤回，不等于措施根本无法实行。B把持续执行的不稳定改成了不可实行。\n\n**已经实施且有效果的措施，能按这段概括成无法实行吗？**\n\n不能。作者指出的是负担安排及由此带来的政治问题。\n\n**第一轮判断：B排除。**","html":"<h3>B. They prove impractical for city councils.</h3> 794,21],[135,846,795,22],[137,879,452,17]],"questionRects":[[189,509,429,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"C","paragraphPids":[2]}},{"section":"32题","raw":"### D. They are **[xxx]** against car manufacturers.\n\n> 它们对汽车制造商具有**[xxx]**的针对性\n\n把D接回题干，它说的是：城市治理措施的弱点是它们以某种**[xxx]**方式针对汽车制造商。\n\nD说以某种方式针对车企，回第3段看rather than后的car manufacturers。\n\n> put the costs of cleaning the air on to individual drivers\n\n> rather than on to the car manufacturers whose cheating is the real cause of our toxic pollution\n\n作者说成本落在individual drivers，而不是车企。这组明确对照已经指出措施主要让谁出钱。\n\nD中的性质词未知，但against car manufacturers把针对对象写成了制造商，不能直接接上当前成本安排。\n\n**原文批评措施让车企承担过多，还是没有把成本放到车企身上？**\n\n是后者。D已知的针对对象不合。\n\n**第一轮判断：D排除。**","html":"<h3>D. They are <strong>[xxx]</strong> against car manufacturers.</h3>\n<blockquote><p>它们对汽车制造商具有<strong>[xxx]</strong>的针对性</p>\n</blockquote>\n<p>把D接回题干，它说的是：城市治理措施的弱点是它们以某种<strong>[xxx]</strong>方式针对汽车制造商。</p>\n<p>D说以某种方式针对车企，回第3段看rather than后的car manufacturers。</p>\n<blockquote><p>put the costs of cleaning the air on to individual drivers</p>\n</blockquote>\n<blockquote><p>rather than on to the car manufacturers whose cheating is the real cause of our toxic pollution</p>\n</blockquote>\n<p>作者说成本落在individual drivers，而不是车企。这组明确对照已经指出措施主要让谁出钱。</p>\n<p>D中的性质词未知，但against car manufacturers把针对对象写成了制造商，不能直接接上当前成本安排。</p>\n<p><strong>原文批评措施让车企承担过多，还是没有把成本放到车企身上？</strong></p>\n<p>是后者。D已知的针对对象不合。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,580,745,21],[136,613,793,22],[137,646,792,22],[137,679,792,22],[137,713,792,21],[137,746,792,22],[137,778,786,23],[136,813,794,21],[135,846,795,22],[137,879,452,17]],"questionRects":[[189,551,442,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"D","paragraphPids":[2]}},{"section":"32题","raw":"### 32题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。","html":"<h3>32题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></u se national governments / —Britain’s and others across Europe—have failed to do so.</p>\n<p>但市长和<strong>[xxx]</strong>能做的有限 / 对于一个远大于单个城镇的问题。 / 他们之所以行动是因为国家政府 / ——英国政府和欧洲其他政府——没有采取相应行动。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,913,745,17],[137,946,790,22],[136,979,793,22],[137,1013,654,21],[184,1046,746,21],[136,1079,794,22],[137,1112,556,22]],"questionRects":[[153,890,653,21],[189,932,180,17],[189,974,244,22],[189,1016,143,17],[189,1059,106,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"34","paragraphPids":[3,4]}},{"section":"34题","raw":"### A. Local residents.\n\n> 当地居民\n\n把A接回题干，它说的是：作者认为本应由当地居民承担处理污染问题的责任。\n\nA说当地居民应负责，回第4段看residents’ health在句中是什么。\n\n> Local officials are using the **[xxx]** that are available to them to **[xxx]** residents’ health\n\n> They are acting because national governments —Britain’s and others across Europe—have failed to do so.\n\n地方官员采取措施，是为了保护居民健康。居民在这处是健康受到威胁、需要被保护的一方。\n\n随后作者又批评国家政府没有行动，并没有把本应采取行动的责任交给居民。\n\n**需要保护健康的人，就是作者说本应负责整体治理的人吗？**\n\n不是。A把被保护者换成了承担政策责任者。\n\n**第一轮判断：A排除。**","html":"<h3>A. Local residents.</h3>\n<blockquote><p>当地居民</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为本应由当地居民承担处理污染问题的责任。</p>\n<p>A说当地居民应负责，回第4段看residents’ health在句中是什么。</p>\n<blockquote><p>Local officials are using the <strong>[xxx]</strong> that are available to them to <strong>[xxx]</strong> residents’ health</p>\n</blockquote>\n<blockquote><p>They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n</blockquote>\n<p>地方官员采取措施，是为了保护居民健康。居民在这处是健康受到威胁、需要被保护的一方。</p>\n<p>随后作者又批评国家政府没有行动，并没有把本应采取行动的责任交给居民。</p>\n<p><strong>需要保护健康的人，就是作者说本应负责整体治理的人吗？</strong></p>\n<p>不是。A把被保护者换成了承担政策责任者。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,913,745,17],[137,946,790,22],[136,979,793,22],[137,1013,654,21],[184,1046,746,21],[136,1079,794,22],[137,1112,556,22]],"questionRects":[[189,932,180,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"A","paragraphPids":[3,4]}},{"section":"34题","raw":"### B. National governments.\n\n> 国家政府\n\n把B接回题干，它说的是：作者认为本应由国家政府在更大层面处理污染问题。\n\nB说国家政府，回第5段看because national governments…have failed to do so。\n\n> a problem that is far bigger than any one city or town.\n\n> They are acting because national governments —Britain’s and others across Europe—have failed to do so.\n\n地方采取行动，因为国家政府未能行动；前面又说问题比任何一个城镇都大，地方能力有限。\n\n这两句接起来，说明作者认为国家层面本该承担更大的治理责任，却留下空缺。B直接点出了这个主体。\n\n**国家政府没有做、地方才被迫补位，是否支持国家政府本应处理？**\n\n支持。B有明确责任句，可以保留。\n\n**第一轮判断：B保留。**","html":"<h3>B. National governments.</h3>\n<blockquote><p>国家政府</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为本应由国家政府在更大层面处理污染问题。</p>\n<p>B说国家政府，回第5段看because national governments…have failed to do so。</p>\n<blockquote><p>a problem that is far bigger than any one city or town.</p>\n</blockquote>\n<blockquote><p>They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n</blockquote>\n<p>地方采取行动，因为国家政府未能行动；前面又说问题比任何一个城镇都大，地方能力有限。</p>\n<p>这两句接起来，说明作者认为国家层面本该承担更大的治理责任，却留下空缺。B直接点出了这个主体。</p>\n<p><strong>国家政府没有做、地方才被迫补位，是否支持国家政府本应处理？</strong></p>\n<p>支持。B有明确责任句，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,1046,746,21],[136,1079,794,22],[137,1112,556,22]],"questionRects":[[189,974,244,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"34","option":"B","paragraphPids":[4]}},{"section":"34题","raw":"### C. **[xxx]**.\n\n> **[xxx]**\n\n把C接回题干，它说的是：作者认为应由某一类**[xxx]**主体来处理污染。\n\nC主体词未知，先用第5段确认作者在区分哪些行动者。\n\n> But mayors and **[xxx]** can only do so much\n\n> They are acting because national governments —Britain’s and others across Europe—have failed to do so.\n\n这段先说市长等地方人员能力有限，再点名国家政府没有行动。我们已经能确认国家层面的责任，也知道地方正在补位。\n\nC尚未读懂，不能擅自把它填成任何一种职务。先与B一起留下，回查时再比较可确认的支持。\n\n**现在是否已经知道C指谁，从而能断言它与责任句冲突？**\n\n还不知道。C暂留，但不要用猜出来的主体作分析。\n\n**第一轮判断：C保留。**","html":"<h3>C. <strong>[xxx]</strong>.</h3>\n<blockquote><p><strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为应由 第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂留B、C，等把全文连起来后再回来比较。</p>\n","articleRects":[],"questionRects":[[153,890,653,21],[189,932,180,17],[189,974,244,22],[189,1016,143,17],[189,1059,106,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n> It can be learned from the last paragraph that auto companies ______.  \n> 从末段可知，汽车公司应当或将会怎样？\n\n末段围绕larger effort缺位与最后一句everything but展开。读清作者要求做的事情，不把建议写成企业已经决定的行为。\n\n> 原文参考：\n> \n> Restrictions that keep highly polluting cars out of certain areas —city centres, “school streets”, even individual roads— are a response to the absence of a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into **[xxx]**. Wales has introduced special low speed limits to **[xxx]** pollution. We’re doing everything but insist that manufacturers clean up their cars.\n> \n> 开始精读：\n> \n> Restrictions that keep highly polluting cars out of certain areas / —city centres, “school streets”, even individual roads— / are a response to the absence of a larger effort / to properly enforce existing regulations / and require auto companies to bring their vehicles into **[xxx]**. / Wales has introduced special low speed limits to **[xxx]** pollution. / We’re doing everything but insist that manufacturers clean up their cars.\n> \n> 将高污染汽车挡在某些区域之外的限制 / ——市中心、“学校街道”乃至个别道路—— / 是在回应更大层面努力的缺位 / 去恰当地执行现有法规 / 并要求汽车公司使车辆达到**[xxx]**。 / 威尔士推出特别的低速限制以**[xxx]**污染。 / 我们什么都在做唯独没有坚持要求制造商使他们的汽车变清洁。\n\n接下来按A—D逐项看。","html":"<h2>35题</h2>\n<blockquote><p>It can be learned from the last paragraph that auto companies ______.<br />\n从末段可知，汽车公司应当或将会怎样？</p>\n</blockquote>\n<p>末段围绕larger effort缺位与最后一句everything but展开。读清作者要求做的事情，不把建议写成企业已经决定的行为。</p>\n<blockquote><p>原文参考：</p>\n<p>Restrictions that keep highly polluting cars out of certain areas —city centres, “school streets”, even individual roads— are a response to the absence of a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong>. Wales has introduced special low speed limits to <strong>[xxx]</strong> pollution. We’re doing everything but insist that manufacturers clean up their cars.</p>\n<p>开始精读：</p>\n<p>Restrictions that keep highly polluting cars out of certain areas / —city centres, “school streets”, even individual roads— / are a response to the absence of a larger effort / to properly enforce existing regulations / and require auto companies to bring their vehicles into <strong>[xxx]</strong>. / Wales has introduced special low speed limits to <strong>[xxx]</strong> pollution. / We’re doing everything but insist that manufacturers clean up their cars.</p>\n<p>将高污染汽车挡在某些区域之外的限制 / ——市中心、“学校街道”乃至个别道路—— / 是在回应更大层面努力的缺位 / 去恰当地执行现有法规 / 并要求汽车公司使车辆达到<strong>[xxx]</strong>。 / 威尔士推出特别的低速限制以<strong>[xxx]</strong>污染。 / 我们什么都在做唯独没有坚持要求制造商使他们的汽车变清洁。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[185,1146,741,21],[152,1178,778,23],[137,1212,792,22],[137,1245,792,22],[137,1279,792,22],[137,1312,94,17]],"questionRects":[[153,1143,635,22],[208,1185,382,22],[189,1228,420,22],[189,1270,398,22],[189,1312,406,22],[389,1397,319,19]],"scrollTarget":"article","meta":{"kind":"question","qid":"35","paragraphPids":[5]}},{"section":"35题","raw":"### A. will raise low-emission car production\n\n> 将增加低排放汽车产量\n\n把A接回题干，它说的是：汽车公司接下来会提高低排放汽车的生产数量。\n\nA预测增产，回末段看require与insist提出什么要求。\n\n> require auto companies to bring their vehicles into **[xxx]**.\n\n> insist that manufacturers clean up their cars\n\n作者要求执行既有规定，让制造商清理其车辆、减少污染。没有宣布车企未来的生产数量会增加。\n\n让产品符合排放规定，与多生产某类汽车不是同一个动作；前者也不能保证后者发生。\n\n**要求车辆达标，就能推出车企将提高低排放汽车产量吗？**\n\n不能。A把应当履行的要求改成了一项产量预测。\n\n**第一轮判断：A排除。**","html":"<h3>A. will raise low-emission car production</h3>\n<blockquote><p>将增加低排放汽车产量</p>\n</blockquote>\n<p>把A接回题干，它说的是：汽车公司接下来会提高低排放汽车的生产数量。</p>\n<p>A预测增产，回末段看require与insist提出什么要求。</p>\n<blockquote><p>require auto companies to bring their vehicles into <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>insist that manufacturers clean up their cars</p>\n</blockquote>\n<p>作者要求执行既有规定，让制造商清理其车辆、减少污染。没有宣布车企未来的生产数量会增加。</p>\n<p>让产品符合排放规定，与多生产某类汽车不是同一个动作；前者也不能保证后者发生。</p>\n<p><strong>要求车辆达标，就能推出车企将提高低排放汽车产量吗？</strong></p>\n<p>不能。A把应当履行的要求改成了一项产量预测。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[185,1146,741,21],[152,1178,778,23],[137,1212,792,22],[137,1245,792,22],[137,1279,792,22],[137,1312,94,17]],"questionRects":[[208,1185,382,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"A","paragraphPids":[5]}},{"section":"35题","raw":"### B. will upgrade the design of their vehicles\n\n> 将升级车辆设计\n\n把B接回题干，它说的是：汽车公司将改进旗下车辆的设计。\n\nB预测改设计，回末段看作者有没有说明企业已经决定怎样做。\n\n> a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into **[xxx]**\n\n文中要求汽车企业使车辆符合规定，但没有报告它们已承诺升级设计。改善排放也可能涉及不同办法，作者没有在此指定设计方案。\n\nB的will还把作者的要求写成了企业确定会做的事。\n\n**作者要求解决车辆污染，等于企业已经确定将升级设计吗？**\n\n不等于。B多了具体办法和确定实现的判断。\n\n**第一轮判断：B排除。**","html":"<h3>B. will upgrade the design of their vehicles</h3>\n<blockquote><p>将升级车辆设计</p>\n</blockquote>\n<p>把B接回题干，它说的是：汽车公司将改进旗下车辆的设计。</p>\n<p>B预测改设计，回末段看作者有没有说明企业已经决定怎样做。</p>\n<blockquote><p>a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong></p>\n</blockquote>\n<p>文中要求汽车企业使车辆符合规定，但没有报告它们已承诺升级设计。改善排放也可能涉及不同办法，作者没有在此指定设计方案。</p>\n<p>B的will还把作者的要求写成了企业确定会做的事。</p>\n<p><strong>作者要求解决车辆污染，等于企业已经确定将升级设计吗？</strong></p>\n<p>不等于。B多了具体办法和确定实现的判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[185,1146,741,21],[152,1178,778,23],[137,1212,792,22],[137,1245,792,22],[137,1279,792,22],[137,1312,94,17]],"questionRects":[[189,1228,420,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"35","option":"B","paragraphPids":[5]}},{"section":"35题","raw":"### C. should be forced to follow regulations\n\n> 应被要求遵守法规\n\n把C接回题干，它说的是：汽车公司应被强制要求遵守现有规定。\n\nC说强制守规，回末段找properly enforce existing regulations与require auto companies。\n\n> properly enforce existing regulations and require auto companies to bring their vehicles into **[xxx]**.\n\n> We’re doing everything but insist that manufacturers clean up their cars.\n\n作者认为现有法规没有在更大范围得到应有执行，车企也未被充分要求解决自身车辆污染。城市限行是在填这项空缺。\n\nC把执行法规、要求车企照办这两项接起来，正是作者认为还缺的行动。\n\n**末段反复强调执行现有法规与要求制造商行动，是否对应强制守规？**\n\n对应。C直接概括了作者的要求。\n\n**第一轮判断：C保留。**","html":"<h3>C. should be forced to follow regulations</h3>\n<blockquote><p>应被要求遵守法规</p>\n</blockquote>\n<p>把C接回题干，它说的是：汽车公司应被强制要求遵守现有规定。</p>\n<p>C说强制守规，回末段找properly enforce existing regulations与require auto companies。</p>\n<blockquote><p>properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>We’re doing everything but insist that manufacturers clean up their cars.</p>\n</blockquote>\n<p>作者认为现有法规没有在更大范围得到应有执行，车企也未被充分要求解决自身车辆污染。城市限行是在填这项空缺。</p>\n<p>C把执行法规、要求车企照办这两项接起来，正是作者认为还缺的行动。</p>\n<p><strong>末段反复强调执行现有法规与要求制造商行动，是否对应强制守规？</strong></p>\n<p>对应。C直接概括了作者的要求。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[185,1146,741,21],[152,1178,778,23],[137,1212,792,22],[137,1245,792,22],[137,1279,792,22],[137,1312,94,17]],"questionRects":[[189,1270,398,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"35","option":"C","paragraphPids":[5]}},{"section":"35题","raw":"### D. should be put under public **[xxx]**\n\n> 应被置于公众的**[xxx]**之下\n\n把D接回题干，它说的是：汽车公司应受到公众某种**[xxx]**安排。\n\nD说公众的某种安排，回末段看明确写出的执行办法。\n\n> properly enforce existing regulations and require auto companies\n\n> insist that manufacturers clean up their cars\n\n作者提出执行现有规定、要求车企清理车辆，是通过规则落实企业责任。没有在这里提出公众要以某种组织方式接管或处理车企。\n\nD关键名词未知，但public这一参与方也没有相应安排可核对，不能把所有约束企业的办法都当作原文建议。\n\n**一般认为公众可以发挥作用，就等于末段提出了D吗？**\n\n不等于。C与现有法规和强制要求的文字直接相合。\n\n**第一轮判断：D排除。**","html":"<h3>D. should be put under public <strong>[xxx]</strong></h3>\n<blockq 把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>success；legal battles；uncertain</td><td>马德里措施有效，却因政治和法律变化前景不定。</td><td>用具体反复引出问题。</td></tr><tr><td>第2段</td><td>limits；city-by-city</td><td>逐个城市治理的方式存在局限，英国也在其中。</td><td>把个案扩展为整体模式问题。</td></tr><tr><td>第3段</td><td>costs；individual drivers；opposition</td><td>成本压在司机而非制造商身上，扩区可能引发抵抗。</td><td>解释地方措施政治上不稳的原因。</td></tr><tr><td>第4段</td><td>not useless；health benefits</td><td>地方措施确实改善空气并带来健康收益。</td><td>保留其实际价值，避免全盘否定。</td></tr><tr><td>第5段</td><td>bigger than any one city；national governments</td><td>问题超出城市能力，国家政府未采取相应行动。</td><td>指出更大层面的责任缺位。</td></tr><tr><td>第6段</td><td>existing regulations；manufacturers</td><td>应执行法规并要求制造商清洁车辆，而不能只限制局部区域和速度。</td><td>落到应补上的治理要求。</td></tr></tbody></table>\n<p><strong>全文的主要意思：城市低排放措施确有健康收益，却容易因成本落在司机身上而遭遇政治阻力；污染治理需要国家层面执行法规、要求制造商承担责任，不能仅靠各城市零散限制。</strong></p>\n","articleRects":[[184,213,746,22],[136,247,793,22],[137,280,792,22],[137,313,792,22],[136,346,794,22],[137,380,792,22],[137,413,793,22],[137,446,643,22],[184,480,745,22],[136,513,793,22],[136,546,359,22],[184,580,745,21],[136,613,793,22],[137,646,792,22],[137,679,792,22],[137,713,792,21],[137,746,792,22],[137,778,786,23],[136,813,794,21],[135,846,795,22],[137,879,452,17],[184,913,745,17],[137,946,790,22],[136,979,793,22],[137,1013,654,21],[184,1046,746,21],[136,1079,794,22],[137,1112,556,22],[185,1146,741,21],[152,1178,778,23],[137,1212,792,22],[137,1245,792,22],[137,1279,792,22],[137,1312,94,17]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]}},{"section":"进阶回查","raw":"## 回查34题：B还是C？\n\nWho does the author think should have addressed the problem?\n\nB. National governments.\n\nC. **[xxx]**.\n\nB是国家政府，C还不知道指谁。题干问“本应处理”，要找的是作者指出没有尽到责任的一方。\n\n前面马德里和伦敦的例子都在说城市单独行动的困难：司机承担费用，受影响人数变多就容易反对，换届还可能使措施反复。第4段承认这些措施改善空气、保护健康，所以作者没有认为地方工作毫无作用。\n\n第5段接着说问题大于一座城市，市长等地方人员能做的有限。随后because 帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>31题题干</h2>\n<p><strong>Which of the following is true about Madrid’s clean air zone?</strong></p>\n<blockquote><p>关于马德里的清洁空气区，哪项符合原文？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>32题题干</h2>\n<p><strong>What is considered a weakness of the city-level measures to tackle dirty air?</strong></p>\n<blockquote><p>城市层面治理空气污染的措施被认为有什么弱点？</p>\n</blockquote>\n<p>题型：<strong>具体原因题</strong>。</p>\n\n<hr />\n<h2>33题题干</h2>\n<p><strong>The author believes that the extension of London’s Ulez will ______.</strong></p>\n<blockquote><p>作者认为扩大伦敦Ulez将带来什么？</p>\n</blockquote>\n<p>题型：<strong>具体预测题</strong>。</p>\n\n<hr />\n<h2>34题题干</h2>\n<p><strong>Who does the author think should have addressed the problem?</strong></p>\n<blockquote><p>作者认为本应由谁处理这个问题？</p>\n</blockquote>\n<p>题型：<strong>具体责任归属题</strong>。</p>\n\n<hr />\n<h2>35题题干</h2>\n<p><strong>It can be learned from the last paragraph that auto companies ______.</strong></p>\n<blockquote><p>从末段可知，汽车公司应当或将会怎样？</p>\n</blockquote>\n<p>题型：<strong>具体观点题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>despite, But, rather than</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>success, uncertain, useless</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>pay, require, enforce</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>costs, fines, regulations</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>drivers, manufacturers, governments</td></tr></tbody></table>\n\n<hr />\n<p>Madrid was <strong>[xxx]</strong> as a public health guiding light last November when it rolled out <strong>[xxx]</strong> restrictions on the most polluting cars. Seven months and one election day later, a new <strong>[xxx]</strong> city council <strong>[xxx]</strong> <strong>[xxx]</strong> of the clean air zone, a first step toward its possible <strong>[xxx]</strong>. Mayor José Luis Martínez-Almeida made opposition to the zone a <strong>[xxx]</strong> of his election campaign, despite its success in improving air quality. A judge has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> fines, ordering them restored. But with legal battles ahead, the zone’s future looks uncertain at best.</p>\n\n<hr />\n<p>Madrid was <strong>[xxx]</strong> as a public health guiding light last November / when it rolled out <strong>[xxx]</strong> restrictions on the most polluting cars. / Seven months and one election day later, / a new <strong>[xxx]</strong> city council <strong>[xxx]</strong> <strong>[xxx]</strong> of the clean air zone, / a first step toward its possible <strong>[xxx]</strong>. / Mayor José Luis Martínez-Almeida made opposition to the zone / a <strong>[xxx]</strong> of his election campaign, / despite its success in improving air quality. / A judge has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> fines, / ordering them restored. / But with legal battles ahead, / the zone’s future looks uncertain at best.</p>\n\n<hr />\n<p>马德里 was <strong>[xxx]</strong> as a 公共健康指路明灯 去年十一月 / when it rolled out <strong>[xxx]</strong> 限制 on the 污染最重汽车. / 七个月 and 一个选举日 later, / a new <strong>[xxx]</strong> 市议会 <strong>[xxx]</strong> <strong>[xxx]</strong> of the 清洁空气区, / a first step toward its possible <strong>[xxx]</strong>. / Mayor José Luis Martínez-Almeida made 反对 to the zone / a <strong>[xxx]</strong> of his 竞选活动, / despite its 改善空气质量的成功. / 一名法官 has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> 罚款, / ordering them restored. / But with 法律争斗 ahead, / the zone’s 未来不确定 at best.</p>\n\n<hr />\n<p>1、马德里、公共健康指路明灯、去年十一月、限制、污染最重汽车、七个月、一个选举日、市议会、清洁空气区、反对、竞选活动、改善空气质量的成功、一名法官、罚款、法律争斗、未来不确定。</p>\n\n<hr />\n<p>Madrid’s back and forth on clean air is a pointed reminder of the limits to the <strong>[xxx]</strong>, city-by-city approach that <strong>[xxx]</strong> efforts on air pollution across Europe, Britain very much included.</p>\n\n<hr />\n<p>Madrid’s back and forth on clean air / is a pointed reminder of the limits / to the <strong>[xxx]</strong>, city-by-city approach / that <strong>[xxx]</strong> efforts on air pollution across Europe, / Britain very much included.</p>\n\n<hr />\n<p>马德里的反复 on clean air / is a pointed reminder of the 局限 / to the <strong>[xxx]</strong>, 逐城方式 / that <strong>[xxx]</strong> efforts on air pollution across 欧洲, / Britain very much included.</p>\n\n<hr />\n<p>2、马德里的反复、局限、逐城方式、欧洲。</p>\n\n<hr />\n<p>Among other weaknesses, the measures cities must employ when left to tackle dirty air on their own are politically <strong>[xxx]</strong>, and therefore <strong>[xxx]</strong>. That’s because they <strong>[xxx]</strong> put the costs of cleaning the air on to individual drivers —who must pay fees or buy better vehicles— rather than on to the car manufacturers whose cheating is the real cause of our toxic pollution. It’s not hard to imagine a similar reversal happening in London. The new ultra-low emission zone (Ulez) is likely to be a big issue in next year’s <strong>[xxx]</strong> election. And if Sadiq Khan wins and extends it to the North and South Circular roads in 2021 as he intends, it is sure to spark intense opposition from the far larger number of motorists who will then be affected.</p>\n\n<hr />\n<p>Among other weaknesses, / the measures cities must employ / when left to tackle dirty air on their own / are politically <strong>[xxx]</strong>, and therefore <strong>[xxx]</strong>. / That’s because they <strong>[xxx]</strong> put the costs of cleaning the air on to individual drivers / —who must pay fees or buy better vehicles— / rather than on to the car manufacturers / whose cheating is the real cause of our toxic pollution. / It’s not hard to imagine a similar reversal happening in London. / The new ultra-low emission zone (Ulez) / is likely to be a big issue in next year’s <strong>[xxx]</strong> election. / And if Sadiq Khan wins and extends it to the North and South Circular roads in 2021 as he intends, / it is sure to spark intense opposition / from the far larger number of motorists who will then be affected.</p>\n\n<hr />\n<p>Among other 弱点, / the measures 城市 must employ / when left to tackle 脏空气 on their own / are politically <strong>[xxx]</strong>, and therefore <strong>[xxx]</strong>. / That’s because they <strong>[xxx]</strong> put the 净化空气的成本 on to 个体司机 / —who must 付费 or buy better vehicles— / rather than on to the 汽车制造商 / whose cheating is the real cause of our toxic pollution. / It’s not hard to imagine a similar reversal happening in 伦敦. / The new ultra-low emission zone (Ulez) / is likely to be a big issue in next year’s <strong>[xxx]</strong> 选举. / And if Sadiq Khan wins and extends it to the North and South Circular roads in 2021 as he intends, / it is sure to spark 强烈反对 / from the far larger number of 驾驶者 who will then be affected.</p>\n\n<hr />\n<p>3、弱点、城市、脏空气、净化空气的成本、个体司机、付费、汽车制造商、伦敦、选举、Sadiq Khan、强烈反对、驾驶者。</p>\n\n<hr />\n<p>It’s not that measures such as London’s Ulez are useless. Far from it. Local officials are using the <strong>[xxx]</strong> that are available to them to <strong>[xxx]</strong> residents’ health in the face of a serious threat. The zones do deliver some improvements to air quality, and the science tells us that means real health benefits.</p>\n\n<hr />\n<p>It’s not that measures such as London’s Ulez are useless. / Far from it. / Local officials are using the <strong>[xxx]</strong> that are available to them / to <strong>[xxx]</strong> residents’ health in the face of a serious threat. / The zones do deliver some improvements to air quality, / and the science tells us that means real health benefits.</p>\n\n<hr />\n<p>It’s not that measures such as 伦敦Ulez are 没用. / Far from it. / 地方官员 are using the <strong>[xxx]</strong> that are available to them / to <strong>[xxx]</strong> 居民健康 in the face of a serious threat. / The zones do deliver some 空气质量改善, / and the science tells us that means real 健康收益.</p>\n\n<hr />\n<p>4、伦敦Ulez、没用、地方官员、居民健康、空气质量改善、健康收益。</p>\n\n<hr />\n<p>But mayors and <strong>[xxx]</strong> can only do so much about a problem that is far bigger than any one city or town. They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n\n<hr />\n<p>But mayors and <strong>[xxx]</strong> can only do so much / about a problem that is far bigger than any one city or town. / They are acting because national governments / —Britain’s and others across Europe—have failed to do so.</p>\n\n<hr />\n<p>But 市长 and <strong>[xxx]</strong> can only do so much / about a problem that is far bigger than any 一个城镇. / They are acting because 国家政府 / —Britain’s and others across Europe—have failed to do so.</p>\n\n<hr />\n<p>5、市长、一个城镇、国家政府。</p>\n\n<hr />\n<p>Restrictions that keep highly polluting cars out of certain areas —city centres, “school streets”, even individual roads— are a response to the absence of a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong>. Wales has introduced special low speed limits to <strong>[xxx]</strong> pollution. We’re doing everything but insist that manufacturers clean up their cars.</p>\n\n<hr />\n<p>Restrictions that keep highly polluting cars out of certain areas / —city centres, “school streets”, even individual roads— / are a response to the absence of a larger effort / to properly enforce existing regulations / and require auto companies to bring their vehicles into <strong>[xxx]</strong>. / Wales has introduced special low speed limits to <strong>[xxx]</strong> pollution. / We’re doing everything but insist that manufacturers clean up their cars.</p>\n\n<hr />\n<p>Restrictions that keep 高污染汽车 out of 某些区域 / —市中心, “school streets”, even 个别道路— / are a response to the 缺位 of a larger effort / to 恰当执行现有法规 / and 要求汽车公司 to bring their vehicles into <strong>[xxx]</strong>. / 威尔士 has introduced special 低速限制 to <strong>[xxx]</strong> 污染. / We’re doing everything but insist that 制造商清洁其汽车.</p>\n\n<hr />\n<p>6、高污染汽车、某些区域、市中心、个别道路、缺位、恰当执行现有法规、要求汽车公司、威尔士、低速限制、污染、制造商清洁其汽车。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：清洁空气区、汽车、司机、地方措施和政府。刚才还看到：马德里、公共健康指路明灯、去年十一月、限制、污染最重汽车、七个月、一个选举日、市议会、清洁空气区、反对、竞选活动、改善空气质量的成功、一名法官、罚款、法律争斗、未来不确定；马德里的反复、局限、逐城方式、欧洲；弱点、城市、脏空气、净化空气的成本、个体司机、付费、汽车制造商、伦敦、选举、Sadiq Khan、强烈反对、驾驶者；伦敦Ulez、没用、地方官员、居民健康、空气质量改善、健康收益；市长、一个城镇、国家政府；高污染汽车、某些区域、市中心、个别道路、缺位、恰当执行现有法规、要求汽车公司、威尔士、低速限制、污染、制造商清洁其汽车。</p>\n<p>到这里还不能自然地说清楚：措施效果与未来命运怎样区分，成本由谁承担，作者究竟要求哪个层面补上行动。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n\n<hr />\n<h2>31题</h2>\n<blockquote><p>Which of the following is true about Madrid’s clean air zone?<br />\n关于马德里的清洁空气区，哪项符合原文？</p>\n</blockquote>\n<p>Madrid与clean air zone定位首段。按先实施、选举后变化、法官介入和未来诉讼的顺序读，分清效果与存续前景。</p>\n<blockquote><p>原文参考：</p>\n<p>Madrid was <strong>[xxx]</strong> as a public health guiding light last November when it rolled out <strong>[xxx]</strong> restrictions on the most polluting cars. Seven months and one election day later, a new <strong>[xxx]</strong> city council <strong>[xxx]</strong> <strong>[xxx]</strong> of the clean air zone, a first step toward its possible <strong>[xxx]</strong>. Mayor José Luis Martínez-Almeida made opposition to the zone a <strong>[xxx]</strong> of his election campaign, despite its success in improving air quality. A judge has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> fines, ordering them restored. But with legal battles ahead, the zone’s future looks uncertain at best.</p>\n<p>开始精读：</p>\n<p>Madrid was <strong>[xxx]</strong> as a public health guiding light last November / when it rolled out <strong>[xxx]</strong> restrictions on the most polluting cars. / Seven months and one election day later, / a new <strong>[xxx]</strong> city council <strong>[xxx]</strong> <strong>[xxx]</strong> of the clean air zone, / a first step toward its possible <strong>[xxx]</strong>. / Mayor José Luis Martínez-Almeida made opposition to the zone / a <strong>[xxx]</strong> of his election campaign, / despite its success in improving air quality. / A judge has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> fines, / ordering them restored. / But with legal battles ahead, / the zone’s future looks uncertain at best.</p>\n<p>去年十一月马德里被<strong>[xxx]</strong>为公共健康的指路明灯 / 当它对污染最重的汽车推出<strong>[xxx]</strong>限制时。 / 七个月和一个选举日之后 / 新的<strong>[xxx]</strong>市议会<strong>[xxx]</strong>了清洁空气区的<strong>[xxx]</strong> / 成为其可能<strong>[xxx]</strong>的第一步。 / 市长José Luis Martínez-Almeida将反对该区域 / 作为竞选活动的<strong>[xxx]</strong> / 尽管它在改善空气质量方面取得成功。 / 一名法官如今<strong>[xxx]</strong>了市政府停止<strong>[xxx]</strong>罚款的决定 / 下令恢复罚款。 / 但前方还有法律争斗 / 该区域的未来充其量仍显得不确定。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. Its effects are questionable.</h3>\n<blockquote><p>它的效果值得怀疑</p>\n</blockquote>\n<p>把A接回题干，它说的是：马德里清洁空气区的治理效果值得怀疑。</p>\n<p>A怀疑效果，回首段找despite its success in improving air quality。</p>\n<blockquote><p>despite its success in improving air quality.</p>\n</blockquote>\n<blockquote><p>the zone’s future looks uncertain at best.</p>\n</blockquote>\n<p>市长反对清洁空气区，但作者在despite后明确承认它成功改善空气质量。受到反对的是政策，不等于效果已经遭到事实否定。</p>\n<p>段末uncertain说的是该区能否继续存在，不是已有空气改善是否真实。</p>\n<p><strong>未来不确定，是否就是治理效果值得怀疑？</strong></p>\n<p>不是。A把政策去留与已经取得的效果混在了一起。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. It has been opposed by a judge.</h3>\n<blockquote><p>它受到一名法官反对</p>\n</blockquote>\n<p>把B接回题干，它说的是：清洁空气区遭到一名法官的反对。</p>\n<p>B说法官反对，回首段看ordering them restored恢复的是什么。</p>\n<blockquote><p>A judge has now <strong>[xxx]</strong> the city’s decision to stop <strong>[xxx]</strong> fines, ordering them restored.</p>\n</blockquote>\n<p>市政府决定停止罚款，法官却命令恢复罚款。恢复这项执行手段，并不是让清洁空气区停止运转。</p>\n<p>前面反对该区的是市长；不能看到法官与决定同时出现，就把同一个反对态度安给法官。</p>\n<p><strong>命令恢复罚款，是在支持停止执行清洁空气区吗？</strong></p>\n<p>不是。B把法官的行动方向读反了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. It needs tougher <strong>[xxx]</strong>.</h3>\n<blockquote><p>它需要更严格的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：马德里清洁空气区需要一种更严格的<strong>[xxx]</strong>。</p>\n<p>C说需要更严格的某种措施，回首段看恢复与加严的区别。</p>\n<blockquote><p>the city’s decision to stop <strong>[xxx]</strong> fines, ordering them restored.</p>\n</blockquote>\n<blockquote><p>But with legal battles ahead, the zone’s future looks uncertain at best.</p>\n</blockquote>\n<p>法官要求把被停止的罚款恢复，接下来的法律争议又使未来不确定。这里讨论现行措施是否继续。</p>\n<p>C后面的词不认识，但tougher已经多了一层比目前更严格的要求；恢复原有做法本身没有这层比较。</p>\n<p><strong>恢复已经存在的措施，就等于要求把措施进一步加严吗？</strong></p>\n<p>不等于。C的tougher没有对应。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. Its fate is yet to be decided.</h3>\n<blockquote><p>它的命运尚待决定</p>\n</blockquote>\n<p>把D接回题干，它说的是：马德里清洁空气区今后如何仍未确定。</p>\n<p>D说命运未定，回首段最后一句看future looks uncertain at best。</p>\n<blockquote><p>But with legal battles ahead, the zone’s future looks uncertain at best.</p>\n</blockquote>\n<p>新市政府反对并暂停部分执行，法官又要求恢复罚款，前面一停一恢复已经显示争执。段末还说未来仍有法律较量。</p>\n<p>D的yet to be decided概括的正是未来尚不确定，并没有否认该区此前改善空气的效果。</p>\n<p><strong>仍有法律争执、未来不确定，是否就是去留尚待决定？</strong></p>\n<p>是。D与末句直接对应。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n\n<hr />\n<h2>32题</h2>\n<blockquote><p>What is considered a weakness of the city-level measures to tackle dirty air?<br />\n城市层面治理空气污染的措施被认为有什么弱点？</p>\n</blockquote>\n<p>第2段先指出逐城治理的局限，第3段以weaknesses和That’s because给出具体解释，两个段落一起读。</p>\n<blockquote><p>原文参考：</p>\n<p>Madrid’s back and forth on clean air is a pointed reminder of the limits to the <strong>[xxx]</strong>, city-by-city approach that <strong>[xxx]</strong> efforts on air pollution across Europe, Britain very much included.</p>\n<p>开始精读：</p>\n<p>Madrid’s back and forth on clean air / is a pointed reminder of the limits / to the <strong>[xxx]</strong>, city-by-city approach / that <strong>[xxx]</strong> efforts on air pollution across Europe, / Britain very much included.</p>\n<p>马德里在清洁空气问题上的反复 / 鲜明提醒了局限 / 属于<strong>[xxx]</strong>、逐个城市采取的方式 / 这种方式<strong>[xxx]</strong>欧洲各地应对空气污染的行动 / 英国当然也包括在内。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Among other weaknesses, the measures cities must employ when left to tackle dirty air on their own are politically <strong>[xxx]</strong>, and therefore <strong>[xxx]</strong>. That’s because they <strong>[xxx]</strong> put the costs of cleaning the air on to individual drivers —who must pay fees or buy better vehicles— rather than on to the car manufacturers whose cheating is the real cause of our toxic pollution. It’s not hard to imagine a similar reversal happening in London. The new ultra-low emission zone (Ulez) is likely to be a big issue in next year’s <strong>[xxx]</strong> election. And if Sadiq Khan wins and extends it to the North and South Circular roads in 2021 as he intends, it is sure to spark intense opposition from the far larger number of motorists who will then be affected.</p>\n<p>开始精读：</p>\n<p>Among other weaknesses, / the measures cities must employ / when left t ther than on to the car manufacturers</p>\n</blockquote>\n<blockquote><p>from the far larger number of motorists who will then be affected</p>\n</blockquote>\n<p>作者明确点名更多motorists受到影响，他们可能付费或换车。这并没有写成车企减少产量或制造业收缩。</p>\n<p>换更好的车甚至不能简单等同于少造车。D把对驾驶者的限制另推成产业结果，原文没有这一步。</p>\n<p><strong>更多司机受限，能直接证明汽车制造会受抑制吗？</strong></p>\n<p>不能。D缺少这项产业后果的依据。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>33题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n\n<hr />\n<h2>34题</h2>\n<blockquote><p>Who does the author think should have addressed the problem?<br />\n作者认为本应由谁处理这个问题？</p>\n</blockquote>\n<p>责任归属在第5段的because后明确说明。第4段先承认地方措施有效，两段合读可分清已经行动者与本应更大层面行动者。</p>\n<blockquote><p>原文参考：</p>\n<p>It’s not that measures such as London’s Ulez are useless. Far from it. Local officials are using the <strong>[xxx]</strong> that are available to them to <strong>[xxx]</strong> residents’ health in the face of a serious threat. The zones do deliver some improvements to air quality, and the science tells us that means real health benefits.</p>\n<p>开始精读：</p>\n<p>It’s not that measures such as London’s Ulez are useless. / Far from it. / Local officials are using the <strong>[xxx]</strong> that are available to them / to <strong>[xxx]</strong> residents’ health in the face of a serious threat. / The zones do deliver some improvements to air quality, / and the science tells us that means real health benefits.</p>\n<p>并不是说伦敦Ulez这类措施没用。 / 远非如此。 / 地方官员正在使用他们能用的<strong>[xxx]</strong> / 在严重威胁面前<strong>[xxx]</strong>居民健康。 / 这些区域确实使空气质量有所改善 / 科学告诉我们这意味着真实的健康收益。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>But mayors and <strong>[xxx]</strong> can only do so much about a problem that is far bigger than any one city or town. They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n<p>开始精读：</p>\n<p>But mayors and <strong>[xxx]</strong> can only do so much / about a problem that is far bigger than any one city or town. / They are acting because national governments / —Britain’s and others across Europe—have failed to do so.</p>\n<p>但市长和<strong>[xxx]</strong>能做的有限 / 对于一个远大于单个城镇的问题。 / 他们之所以行动是因为国家政府 / ——英国政府和欧洲其他政府——没有采取相应行动。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. Local residents.</h3>\n<blockquote><p>当地居民</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为本应由当地居民承担处理污染问题的责任。</p>\n<p>A说当地居民应负责，回第4段看residents’ health在句中是什么。</p>\n<blockquote><p>Local officials are using the <strong>[xxx]</strong> that are available to them to <strong>[xxx]</strong> residents’ health</p>\n</blockquote>\n<blockquote><p>They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n</blockquote>\n<p>地方官员采取措施，是为了保护居民健康。居民在这处是健康受到威胁、需要被保护的一方。</p>\n<p>随后作者又批评国家政府没有行动，并没有把本应采取行动的责任交给居民。</p>\n<p><strong>需要保护健康的人，就是作者说本应负责整体治理的人吗？</strong></p>\n<p>不是。A把被保护者换成了承担政策责任者。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. National governments.</h3>\n<blockquote><p>国家政府</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为本应由国家政府在更大层面处理污染问题。</p>\n<p>B说国家政府，回第5段看because national governments…have failed to do so。</p>\n<blockquote><p>a problem that is far bigger than any one city or town.</p>\n</blockquote>\n<blockquote><p>They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n</blockquote>\n<p>地方采取行动，因为国家政府未能行动；前面又说问题比任何一个城镇都大，地方能力有限。</p>\n<p>这两句接起来，说明作者认为国家层面本该承担更大的治理责任，却留下空缺。B直接点出了这个主体。</p>\n<p><strong>国家政府没有做、地方才被迫补位，是否支持国家政府本应处理？</strong></p>\n<p>支持。B有明确责任句，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. <strong>[xxx]</strong>.</h3>\n<blockquote><p><strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为应由某一类<strong>[xxx]</strong>主体来处理污染。</p>\n<p>C主体词未知，先用第5段确认作者在区分哪些行动者。</p>\n<blockquote><p>But mayors and <strong>[xxx]</strong> can only do so much</p>\n</blockquote>\n<blockquote><p>They are acting because national governments —Britain’s and others across Europe—have failed to do so.</p>\n</blockquote>\n<p>这段先说市长等地方人员能力有限，再点名国家政府没有行动。我们已经能确认国家层面的责任，也知道地方正在补位。</p>\n<p>C尚未读懂，不能擅自把它填成任何一种职务。先与B一起留下，回查时再比较可确认的支持。</p>\n<p><strong>现在是否已经知道C指谁，从而能断言它与责任句冲突？</strong></p>\n<p>还不知道。C暂留，但不要用猜出来的主体作分析。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. Mayors.</h3>\n<blockquote><p>市长</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为本应由市长处理这个污染问题。</p>\n<p>D说市长，回第5段看can only do so much。</p>\n<blockquote><p>But mayors and <strong>[xxx]</strong> can only do so much about a problem that is far bigger than any one city or town.</p>\n</blockquote>\n<p>市长已经在做，作者承认地方措施有效；但他们所能做的有限，问题又大于单个城市。这是作者从地方转到国家政府的原因。</p>\n<p>D把已经承担有限工作的一方，当成了本应填补整体治理空缺的一方。</p>\n<p><strong>作者强调市长能力有限后，是继续把更大责任交给市长吗？</strong></p>\n<p>不是。下一句明确点名未行动的国家政府。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂留B、C，等把全文连起来后再回来比较。</p>\n\n<hr />\n<h2>35题</h2>\n<blockquote><p>It can be learned from the last paragraph that auto companies ______.<br />\n从末段可知，汽车公司应当或将会怎样？</p>\n</blockquote>\n<p>末段围绕larger effort缺位与最后一句everything but展开。读清作者要求做的事情，不把建议写成企业已经决定的行为。</p>\n<blockquote><p>原文参考：</p>\n<p>Restrictions that keep highly polluting cars out of certain areas —city centres, “school streets”, even individual roads— are a response to the absence of a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong>. Wales has introduced special low speed limits to <strong>[xxx]</strong> pollution. We’re doing everything but insist that manufacturers clean up their cars.</p>\n<p>开始精读：</p>\n<p>Restrictions that keep highly polluting cars out of certain areas / —city centres, “school streets”, even individual roads— / are a response to the absence of a larger effort / to properly enforce existing regulations / and require auto companies to bring their vehicles into <strong>[xxx]</strong>. / Wales has introduced special low speed limits to <strong>[xxx]</strong> pollution. / We’re doing everything but insist that manufacturers clean up their cars.</p>\n<p>将高污染汽车挡在某些区域之外的限制 / ——市中心、“学校街道”乃至个别道路—— / 是在回应更大层面努力的缺位 / 去恰当地执行现有法规 / 并要求汽车公司使车辆达到<strong>[xxx]</strong>。 / 威尔士推出特别的低速限制以<strong>[xxx]</strong>污染。 / 我们什么都在做唯独没有坚持要求制造商使他们的汽车变清洁。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. will raise low-emission car production</h3>\n<blockquote><p>将增加低排放汽车产量</p>\n</blockquote>\n<p>把A接回题干，它说的是：汽车公司接下来会提高低排放汽车的生产数量。</p>\n<p>A预测增产，回末段看require与insist提出什么要求。</p>\n<blockquote><p>require auto companies to bring their vehicles into <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>insist that manufacturers clean up their cars</p>\n</blockquote>\n<p>作者要求执行既有规定，让制造商清理其车辆、减少污染。没有宣布车企未来的生产数量会增加。</p>\n<p>让产品符合排放规定，与多生产某类汽车不是同一个动作；前者也不能保证后者发生。</p>\n<p><strong>要求车辆达标，就能推出车企将提高低排放汽车产量吗？</strong></p>\n<p>不能。A把应当履行的要求改成了一项产量预测。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. will upgrade the design of their vehicles</h3>\n<blockquote><p>将升级车辆设计</p>\n</blockquote>\n<p>把B接回题干，它说的是：汽车公司将改进旗下车辆的设计。</p>\n<p>B预测改设计，回末段看作者有没有说明企业已经决定怎样做。</p>\n<blockquote><p>a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong></p>\n</blockquote>\n<p>文中要求汽车企业使车辆符合规定，但没有报告它们已承诺升级设计。改善排放也可能涉及不同办法，作者没有在此指定设计方案。</p>\n<p>B的will还把作者的要求写成了企业确定会做的事。</p>\n<p><strong>作者要求解决车辆污染，等于企业已经确定将升级设计吗？</strong></p>\n<p>不等于。B多了具体办法和确定实现的判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. should be forced to follow regulations</h3>\n<blockquote><p>应被要求遵守法规</p>\n</blockquote>\n<p>把C接回题干，它说的是：汽车公司应被强制要求遵守现有规定。</p>\n<p>C说强制守规，回末段找properly enforce existing regulations与require auto companies。</p>\n<blockquote><p>properly enforce existing regulations and require auto companies to bring their vehicles into <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>We’re doing everything but insist that manufacturers clean up their cars.</p>\n</blockquote>\n<p>作者认为现有法规没有在更大范围得到应有执行，车企也未被充分要求解决自身车辆污染。城市限行是在填这项空缺。</p>\n<p>C把执行法规、要求车企照办这两项接起来，正是作者认为还缺的行动。</p>\n<p><strong>末段反复强调执行现有法规与要求制造商行动，是否对应强制守规？</strong></p>\n<p>对应。C直接概括了作者的要求。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. should be put under public <strong>[xxx]</strong></h3>\n<blockquote><p>应被置于公众的<strong>[xxx]</strong>之下</p>\n</blockquote>\n<p>把D接回题干，它说的是：汽车公司应受到公众某种<strong>[xxx]</strong>安排。</p>\n<p>D说公众的某种安排，回末段看明确写出的执行办法。</p>\n<blockquote><p>properly enforce existing regulations and require auto companies</p>\n</blockquote>\n<blockquote><p>insist that manufacturers clean up their cars</p>\n</blockquote>\n<p>作者提出执行现有规定、要求车企清理车辆，是通过规则落实企业责任。没有在这里提出公众要以某种组织方式接管或处理车企。</p>\n<p>D关键名词未知，但public这一参与方也没有相应安排可核对，不能把所有约束企业的办法都当作原文建议。</p>\n<p><strong>一般认为公众可以发挥作用，就等于末段提出了D吗？</strong></p>\n<p>不等于。C与现有法规和强制要求的文字直接相合。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>35题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>success；legal battles；uncertain</td><td>马德里措施有效，却因政治和法律变化前景不定。</td><td>用具体反复引出问题。</td></tr><tr><td>第2段</td><td>limits；city-by-city</td><td>逐个城市治理的方式存在局限，英国也在其中。</td><td>把个案扩展为整体模式问题。</td></tr><tr><td>第3段</td><td>costs；individual drivers；opposition</td><td>成本压在司机而非制造商身上，扩区可能引发抵抗。</td><td>解释地方措施政治上不稳的原因。</td></tr><tr><td>第4段</td><td>not useless；health benefits</td><td>地方措施确实改善空气并带来健康收益。</td><td>保留其实际价值，避免全盘否定。</td></tr><tr><td>第5段</td><td>bigger than any one city；national governments</td><td>问题超出城市能力，国家政府未采取相应行动。</td><td>指出更大层面的责任缺位。</td></tr><tr><td>第6段</td><td>existing regulations；manufacturers</td><td>应执行法规并要求制造商清洁车辆，而不能只限制局部区域和速度。</td><td>落到应补上的治理要求。</td></tr></tbody></table>\n<p><strong>全文的主要意思：城市低排放措施确有健康收益，却容易因成本落在司机身上而遭遇政治阻力；污染治理需要国家层面执行法规、要求制造商承担责任，不能仅靠各城市零散限制。</strong></p>\n\n<hr />\n<h2>回查34题：B还是C？</h2>\n<p>Who does the author think should have addressed the problem?</p>\n<p>B. National governments.</p>\n<p>C. <strong>[xxx]</strong>.</p>\n<p>B是国家政府，C还不知道指谁。题干问“本应处理”，要找的是作者指出没有尽到责任的一方。</p>\n<p>前面马德里和伦敦的例子都在说城市单独行动的困难：司机承担费用，受影响人数变多就容易反对，换届还可能使措施反复。第4段承认这些措施改善空气、保护健康，所以作者没有认为地方工作毫无作用。</p>\n<p>第5段接着说问题大于一座城市，市长等地方人员能做的有限。随后because national governments…have failed to do so，把地方为什么正在补位讲明白：国家政府没有行动。</p>\n<p>末段继续要求在更大范围执行既有法规，让汽车企业解决车辆污染。这也解释了为什么单个城市只能用限行、限速等手段补救。</p>\n<p><strong>题干的“本应处理”能否直接接到国家政府“没有采取行动”？</strong></p>\n<p>能。B既有这句直接依据，也能接上城市措施不足的具体原因。C仍未读懂，不能替它补一个职务；B已经有可以确认的完整支持。</p>\n<p><strong>最终选择：34. B。</strong></p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>31. D</strong></p>\n<p><strong>32. A</strong></p>\n<p><strong>33. B</strong></p>\n<p><strong>34. B</strong></p>\n<p><strong>35. C</strong></p>\n","analysisStartIndex":33,"maskInventory":{"token":"[xxx]","count":25},"questionFlowPlan":[{"qid":"31","initialParagraphPids":[1],"paragraphPids":[1],"entry":34,"options":{"A":35,"B":36,"C":37,"D":38},"initialReadingMode":"full_paragraph"},{"qid":"32","initialParagraphPids":[2,3],"paragraphPids":[2,3],"entry":40,"options":{"A":41,"B":42,"C":43,"D":44},"initialReadingMode":"full_paragraph"},{"qid":"33","initialParagraphPids":[],"paragraphPids":[3],"entry":46,"options":{"A":47,"B":48,"C":49,"D":50},"initialReadingMode":"reuse_previous"},{"qid":"34","initialParagraphPids":[4,5],"paragraphPids":[4,5],"entry":52,"options":{"A":53,"B":54,"C":55,"D":56},"initialReadingMode":"full_paragraph"},{"qid":"35","initialParagraphPids":[6],"paragraphPids":[6],"entry":58,"options":{"A":59,"B":60,"C":61,"D":62},"initialReadingMode":"full_paragraph"}],"jumpSections":["阅前须知","先读题干","读文章","开始做题","31题","32题","33题","34题","35题","进阶方法","进阶回查","最终答案"],"supplementaryFlow":{"id":"whole_text_argument_review_v1","mainQuestion":null,"ordinaryFirstRoundCandidates":{"31":["D"],"32":["A"],"33":["B"],"34":["B","C"],"35":["C"]},"reviews":[{"qid":34,"pair":["B","C"],"final":"B"}]}};
let idx=-1,fullMode=false,ready=false,savedInteractive={idx:-1,left:0,right:0};
const articleImg=document.getElementById('articleImg'),questionImg=document.getElementById('questionImg'),leftPane=document.getElementById('leftPane'),rightPane=document.getElementById('rightPane'),combined=document.getElementById('combined');
articleImg.src=DATA.articleImage;questionImg.src=DATA.questionImage;
function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}
function centerRight(){const el=document.getElementById('onlyCurrent');if(!el)return;combined.style.paddingTop='30px';combined.style.paddingBottom='60px';requestAnimationFrame(()=>{const h=el.getBoundingClientRect().height,ph=rightPane.clientHeight;if(h<ph-70){const pad=Math.max(30,Math.floor((ph-h)/2));combined.style.paddingTop=pad+'px';combined.style.paddingBottom=pad+'px'}rightPane.scrollTo({top:0,behavior:'smooth'})})}
function setControls(){document.getElementById('prev').disabled=fullMode||idx<0;document.getElementById('next').disabled=fullMode||idx>=DATA.steps.length-1||!ready;document.getElementById('reset').disabled=fullMode;document.getElementById('jump').disabled=fullMode;const t=document.getElementById('toggleAll');t.textContent=fullMode?'返回交互':'显示全部';t.classList.toggle('active',fullMode)}
function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;
let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function centerHorizontal(){
  requestAnimationFrame(()=>{
    if(!leftPane)return;
    if(zoomLevel>100&&leftPane.scrollWidth>leftPane.clientWidth){
      leftPane.scrollLeft=Math.max(0,Math.round((leftPane.scrollWidth-leftPane.clientWidth)/2));
    }else{
      leftPane.scrollLeft=0;
    }
    updateDragCursor();
  });
}
function updateDragCursor(){
  if(!leftPane)return;
  if(zoomLevel>100&&(leftPane.scrollWidth>leftPane.clientWidth||leftPane.scrollHeight>leftPane.clientHeight)){
    leftPane.style.cursor='grab';
  }else{
    leftPane.style.cursor='';
  }
}
function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
  centerHorizontal();
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+5);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-5);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
const pLeft=document.getElementById('panLeft');
if(pLeft)pLeft.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.max(0,leftPane.scrollLeft-120);};
const pRight=document.getElementById('panRight');
if(pRight)pRight.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.min(leftPane.scrollWidth-leftPane.clientWidth,leftPane.scrollLeft+120);};
const pCenter=document.getElementById('panCenter');
if(pCenter)pCenter.onclick=()=>centerHorizontal();
setupDragToPan(document.getElementById('leftPane'));
setTimeout(()=>applyZoom(zoomLevel),60);
window.addEventListener('keydown',e=>{
  if(fullMode||e.altKey||e.ctrlKey||e.metaKey)return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable))return;

});

const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
