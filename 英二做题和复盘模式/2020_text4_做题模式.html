<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 36题题干\n\n**Generation Zs graduating college this spring ______.**\n\n> 今年春天大学毕业的Z世代处于怎样的情况？\n\n题型：**具体细节题**。","html":"<h2>36题题干</h2>\n<p><strong>Generation Zs graduating college this spring ______.</strong></p>\n<blockquote><p>今年春天大学毕业的Z世代处于怎样的情况？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[153,128,465,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**Generation Zs are keenly aware ______.**\n\n> Z世代清楚认识到什么？\n\n题型：**具体认识题**。","html":"<h2>37题题干</h2>\n<p><strong>Generation Zs are keenly aware ______.</strong></p>\n<blockquote><p>Z世代清楚认识到什么？</p>\n</blockquote>\n<p>题型：<strong>具体认识题</strong>。</p>\n","articleRects":[],"questionRects":[[153,382,344,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**The word “assuage” (Para. 2) is closest in meaning to ______.**\n\n> 第2段assuage最接近哪个意思？\n\n题型：**猜词题**。","html":"<h2>38题题干</h2>\n<p><strong>The word “assuage” (Para. 2) is closest in meaning to ______.</strong></p>\n<blockquote><p>第2段assuage最接近哪个意思？</p>\n</blockquote>\n<p>题型：<strong>猜词题</strong>。</p>\n","articleRects":[],"questionRects":[[153,635,579,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**It can be learned from Paragraph 3 that Generation Zs ______.**\n\n> 从第3段可知，Z世代在职业选择上怎样？\n\n题型：**具体归纳题**。","html":"<h2>39题题干</h2>\n<p><strong>It can be learned from Paragraph 3 that Generation Zs ______.</strong></p>\n<blockquote><p>从第3段可知，Z世代在职业选择上怎样？</p>\n</blockquote>\n<p>题型：<strong>具体归纳题</strong>。</p>\n","articleRects":[],"questionRects":[[153,889,564,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**Michelsen thinks that compared with millennials, Generation Zs are ______.**\n\n> Michelsen认为，与千禧一代相比，Z世代怎样？\n\n题型：**人物比较观点题**。","html":"<h2>40题题干</h2>\n<p><strong>Michelsen thinks that compared with millennials, Generation Zs are ______.</strong></p>\n<blockquote><p>Michelsen认为，与千禧一代相比，Z世代怎样？</p>\n</blockquote>\n<p>题型：<strong>人物比较观点题</strong>。</p>\n","articleRects":[],"questionRects":[[152,1143,516,22],[680,1143,173,17]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Despite, especially, followed by |\n| 态度词 / 评价词 | 先抓个大概好坏 | practical, cautious, secure |\n| 动作词 | 先看谁做了什么 | hiring, chose, looking for |\n| 结果词 | 看最后出了什么事 | employment, stability, debt |\n| 重复主题词 | 大概知道老在说什么 | Generation Z, millennials, jobs |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>Despite, especially, followed by</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>practical, cautious, secure</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>hiring, chose, looking for</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>employment, stability, debt</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Generation Z, millennials, jobs</td></tr></tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Now that members of Generation Z are graduating college this spring —the most commonly-accepted definition says this generation was born after 1995, give or take a year— the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that’s tighter than it’s been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon **[xxx]** those empty office **[xxx]** will differ from those who came before them.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Now that members of Generation Z are graduating college this spring —the most commonly-accepted definition says this generation was born after 1995, give or take a year— the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that’s tighter than it’s been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> will differ from those who came before them.</p>\n</div></div>","articleRects":[[184,213,745,22],[137,246,792,22],[137,278,792,22],[137,311,792,21],[136,343,793,22],[137,375,792,22],[137,407,792,22],[137,440,792,21],[137,472,444,17]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":""},{"section":"读文章","raw":"Now that membe 能自然地说清楚：良好就业环境为什么没有消除谨慎，两套职业排序各排什么，末段比较的是哪种性格与选择。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> Generation Zs graduating college this spring ______.  \n> 今年春天大学毕业的Z世代处于怎样的情况？\n\n题干与首段开头对应。整段同时写公众关注、招聘环境与人们的好奇，需分清哪一方在作判断。\n\n> 原文参考：\n> \n> Now that members of Generation Z are graduating college this spring —the most commonly-accepted definition says this generation was born after 1995, give or take a year— the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that’s tighter than it’s been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon **[xxx]** those empty office **[xxx]** will differ from those who came before them.\n> \n> 开始精读：\n> \n> Now that members of Generation Z are graduating college this spring / —the most commonly-accepted definition says this generation was born after 1995, give or take a year— / the attention has been rising steadily in recent weeks. / Gen Zs are about to hit the streets looking for work / in a labor market that’s tighter than it’s been in decades. / And employers are planning on hiring about 17 percent more new graduates / for jobs in the U.S. this year than last, / according to a survey conducted by the National Association of Colleges and Employers. / Everybody wants to know / how the people who will soon **[xxx]** those empty office **[xxx]** / will differ from those who came before them.\n> \n> 如今Z世代成员正在这个春天大学毕业 / ——最普遍接受的定义说这一代人出生于1995年之后上下相差一年—— / 最近几周关注度一直稳定上升。 / Z世代即将走出去找工作 / 所处劳动力市场比几十年来更紧。 / 而雇主计划多雇用大约百分之十七的新毕业生 / 在今年美国的岗位上相较去年 / 根据美国大学与雇主协会进行的一项调查。 / 每个人都想知道 / 很快**[xxx]**那些空办公室**[xxx]**的人们 / 与此前的人会有怎样的不同。\n\n接下来按A—D逐项看。","html":"<h2>36题</h2>\n<blockquote><p>Generation Zs graduating college this spring ______.<br />\n今年春天大学毕业的Z世代处于怎样的情况？</p>\n</blockquote>\n<p>题干与首段开头对应。整段同时写公众关注、招聘环境与人们的好奇，需分清哪一方在作判断。</p>\n<blockquote><p>原文参考：</p>\n<p>Now that members of Generation Z are graduating college this spring —the most commonly-accepted definition says this generation was born after 1995, give or take a year— the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that’s tighter than it’s been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</st urpose)</p>\n</blockquote>\n<p>调查中，未来雇主能提供稳定就业被排在前面，培训等随后。followed by已经标出先后。</p>\n<p>A即使培训的修饰词未读懂，top priority仍与这项排序不合。不能把榜上出现过的项目都当作第一位。</p>\n<p><strong>培训被放在稳定就业之后，能称为最高优先项吗？</strong></p>\n<p>不能。A改了明确的顺序。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[185,860,744,22],[137,892,794,22],[137,924,793,22],[137,956,792,22],[136,988,793,23],[137,1020,792,23],[137,1053,793,22],[137,1086,300,22]],"questionRects":[[189,932,418,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"39","option":"A","paragraphPids":[2]}},{"section":"39题","raw":"### B. care little about their job performance\n\n> 不太在意自己的工作表现\n\n把B接回题干，它说的是：Z世代很少关心自己工作做得好不好。\n\nB说不在意工作表现，回第3段看调查到底问了什么。\n\n> Job security or stability was the second most important career goal (work-life balance was number one)\n\n调查讲选专业时是否考虑工作、希望雇主提供哪些条件、职业目标怎样排序。没有测量他们在岗位上是否用心或表现怎样。\n\n重视稳定与生活平衡，也不能自动推出做事不上心。两种想法可以同时存在。\n\n**重视稳定、平衡，就意味着不关心工作做得好不好吗？**\n\n不意味着。B增加了原文没有的负面判断。\n\n**第一轮判断：B排除。**","html":"<h3>B. care little about their job performance</h3>\n<blockquote><p>不太在意自己的工作表现</p>\n</blockquote>\n<p>把B接回题干，它说的是：Z世代很少关心自己工作做得好不好。</p>\n<p>B说不在意工作表现，回第3段看调查到底问了什么。</p>\n<blockquote><p>Job security or stability was the second most important career goal (work-life balance was number one)</p>\n</blockquote>\n<p>调查讲选专业时是否考虑工作、希望雇主提供哪些条件、职业目标怎样排序。没有测量他们在岗位上是否用心或表现怎样。</p>\n<p>重视稳定与生活平衡，也不能自动推出做事不上心。两种想法可以同时存在。</p>\n<p><strong>重视稳定、平衡，就意味着不关心工作做得好不好吗？</strong></p>\n<p>不意味着。B增加了原文没有的负面判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[185,860,744,22],[137,892,794,22],[137,924,793,22],[137,956,792,22],[136,988,793,23],[137,1020,792,23],[137,1053,793,22],[137,1086,300,22]],"questionRects":[[189,974,397,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"39","option":"B","paragraphPids":[2]}},{"section":"39题","raw":"### C. have a clear idea about their future jobs\n\n> 对未来工作有清楚想法\n\n把C接回题干，它说的是：Z世代对于未来工作和想要的职业条件有较清楚的考虑。\n\nC说对未来工作有清楚考虑，回第3段把三项调查接起来。\n\n> 88 percent of graduating seniors this year chose their major with a job in mind.\n\n> the ability to offer secure employment\n\n> work-life balance was number one\n\n88%选专业时已考虑工作；选择雇主时看重稳定就业、发展培训；谈职业目标时又有平衡与稳定的排序。\n\n他们并非什么工作都没想过，而是已有具体条件与优先次序。C概括的是这种明确考虑，不是说每个人已经拿到确定岗位。\n\n**选专业、选雇主和职业目标都有考虑，是否支持对未来工作有清楚想法？**\n\n支持。C能把整段调查结果连起来。\n\n**第一轮判断：C保留。**","html":"<h3>C. have a clear idea about their future jobs</h3>\n<blockquote><p>对未来工作有清楚想法</p>\n</blockquote>\n<p>把C接回题干，它说的是：Z世代对于未来工作和想要的职业条件有较清楚的考虑。</p>\n<p>C说对未来工作有清楚考虑，回第3段把三项调查接起来。</p>\n<blockquote><p>88 percent of graduating seniors this year chose their major with a job in mind.</p>\n</blockquote>\n<blockquote><p>the ability to offer secure employment</p>\n</blockquote>\n<blockquote><p>work-life balance was number one</p>\n</blockquote>\n<p>88%选专业时已考虑工作；选择雇主时看重稳定就业、发展培训；谈职业目标时又有平衡与稳定的排序。</p>\n<p>他们并非什么工作都没想过，而是已有具体条件与优先次序。C概括的是这种明确考虑，不是说每个人已经拿到确定岗位。</p>\n<p><strong>选专业、选雇主和职业目标都有考虑，是否支持对未来工作有清楚想法？</strong></p>\n<p>支持。C能把整段调查结果连起来。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[185,860,744,22],[137,892,794,22],[137,924,793,22],[137,956,792,22],[136,988,793,23],[137,1020,792,23],[137,1053,793,22],[137,1086,300,22]],"questionRects":[[189,1016,418,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"39","option":"C","paragraphPids":[2]}},{"section":"39题","raw":"### D. think it hard to achieve work-life balance\n\n> 认为工作生活平衡很难实现\n\n把D接回题干，它说的是：Z世代认为实现工作与生活平衡很困难。\n\nD说平衡难实现，回第3段看number one说明重要性还是难度。\n\n> work-life balance was number one\n\n工作生活平衡排在职业目标第一，说明受访者重视它。排名没有测量他们认为实现它有多困难。\n\n一个目标重要，可以因为可取、有价值，不必因为难以做到。D把重视程度换成了实现难度。\n\n**被列为首要目标，就等于被认为很难实现吗？**\n\n不等于。D超出了这项排序的信息。\n\n**第一轮判断：D排除。**","html":"<h3>D. think it hard to achieve work-life balance</h3>\n<blockquote><p>认为工作生活平衡很难实现</p>\n</blockquote>\n<p>把D接回题干，它说的是：Z世代认为实现工作与生活平衡很困难。</p>\n<p>D说平衡难实现，回第3段看number one说明重要性还是难度。</p>\n<blockquote><p>work-life balance was number one</p>\n</blockquote>\n<p>工作生活平衡排在职业目标第一，说明受访者重视它。排名没有测量他们认为实现它有多困难。</p>\n<p>一个目标重要，可以因为可取、有价值，不必因为难以做到。D把重视程度换成了实现难度。</p>\n<p><strong>被列为首要目标，就等于被认为很难实现吗？</strong></p>\n<p>不等于。D超出了这项排序的信息。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[185,860,744,22],[137,892,794,22],[137,924,793,22],[137,956,792,22],[136,988,793,23],[137,1020,792,23],[137,1053,793,22],[137,1086,300,22]],"questionRects":[[189,1058,433,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"39","option":"D","paragraphPids":[2]}},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。","html":"<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n","articleRects":[],"questionRects":[[189,932,418,21],[189,974,397,22],[189,1016,418,22],[189,1058,433,17],[153,889,564,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n> Michelsen thinks that compared with millennials, Generation Zs are ______.  \n> Michelsen认为，与千禧一代相比，Z世代怎样？\n\nMichelsen定位末段。题目问指定人物作出的代际比较，不是全文作者态度；读清较年轻一代追求什么以及原因。\n\n> 原文参考：\n> \n> That’s a big change from the previous generation. “Millennials wanted more **[xxx]** in their lives,” notes Tanya Michelsen, Associate Director of YouthSight, a UK-based brand manager that conducts regular 60-day surveys of British youth, in findings that might just as well apply to American youth. “Generation Zs are looking for more **[xxx]** and stability, because of the rise of the gig economy. They have trouble seeing a financial future and they are quite risk **[xxx]**.”\n> \n> 开始精读：\n> \n> That’s a big change from the previous generation. / “Millennials wanted more **[xxx]** in their lives,” / notes Tanya Michelsen, Associate Director of YouthSight, / a UK-based brand manager that conducts regular 60-day surveys of British youth, / in findings that might just as well apply to American youth. / “Generation Zs are looking for more **[xxx]** and stability, / because of the rise of the gig economy. / They have trouble seeing a fin 别人的程度。\n\n第3段虽出现服务公益的目标，也没有说他们比千禧一代更愿意付出。\n\n**末段是否作了谁更愿意慷慨付出的代际比较？**\n\n没有。B换了比较的内容。\n\n**第一轮判断：B排除。**","html":"<h3>B. more generous</h3>\n<blockquote><p>更加慷慨</p>\n</blockquote>\n<p>把B接回题干，它说的是：Michelsen认为Z世代比千禧一代更愿意慷慨付出。</p>\n<p>B说更慷慨，回末段看Michelsen比较的具体追求。</p>\n<blockquote><p>They have trouble seeing a financial future</p>\n</blockquote>\n<p>她讨论的是生活偏好、稳定与经济未来，说明Z世代对不确定工作的反应。没有提到捐钱、分享资源或帮助别人的程度。</p>\n<p>第3段虽出现服务公益的目标，也没有说他们比千禧一代更愿意付出。</p>\n<p><strong>末段是否作了谁更愿意慷慨付出的代际比较？</strong></p>\n<p>没有。B换了比较的内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,1117,745,23],[136,1150,251,22],[432,1150,499,22],[137,1183,794,22],[136,1215,787,22],[151,1247,780,22],[137,1280,792,22],[136,1312,109,17]],"questionRects":[[189,1228,169,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"40","option":"B","paragraphPids":[3]}},{"section":"40题","raw":"### C. less realistic\n\n> 更不现实\n\n把C接回题干，它说的是：Michelsen认为Z世代比千禧一代更缺乏现实感。\n\nC说更不现实，回第2段务实谨慎和末段稳定诉求。\n\n> Generation Zs are looking for more **[xxx]** and stability, because of the rise of the gig economy.\n\n> the **[xxx]** for Generation Z are practical and cautious.\n\n第2段明确用practical、cautious描述他们；末段又解释他们考虑零工经济带来的不确定性，因此看重稳定。\n\n难以看清经济未来，是他们觉得未来有风险，不是他们不理解现实。C把审慎担忧读成了缺乏现实感。\n\n**因现实中的风险而追求稳定，能够支持更不现实吗？**\n\n不能。C与已经给出的务实描述不合。\n\n**第一轮判断：C排除。**","html":"<h3>C. less realistic</h3>\n<blockquote><p>更不现实</p>\n</blockquote>\n<p>把C接回题干，它说的是：Michelsen认为Z世代比千禧一代更缺乏现实感。</p>\n<p>C说更不现实，回第2段务实谨慎和末段稳定诉求。</p>\n<blockquote><p>Generation Zs are looking for more <strong>[xxx]</strong> and stability, because of the rise of the gig economy.</p>\n</blockquote>\n<blockquote><p>the <strong>[xxx]</strong> for Generation Z are practical and cautious.</p>\n</blockquote>\n<p>第2段明确用practical、cautious描述他们；末段又解释他们考虑零工经济带来的不确定性，因此看重稳定。</p>\n<p>难以看清经济未来，是他们觉得未来有风险，不是他们不理解现实。C把审慎担忧读成了缺乏现实感。</p>\n<p><strong>因现实中的风险而追求稳定，能够支持更不现实吗？</strong></p>\n<p>不能。C与已经给出的务实描述不合。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,503,7 ACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACUi8QCAAAAQLlILAAAAACEYv1/jRW0ttataz4AAAAASUVORK5CYII=","articleSize":{"w":1083,"h":1508},"questionSize":{"w":1083,"h":1508},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>36题题干</h2>\n<p><strong>Generation Zs graduating college this spring ______.</strong></p>\n<blockquote><p>今年春天大学毕业的Z世代处于怎样的情况？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>37题题干</h2>\n<p><strong>Generation Zs are keenly aware ______.</strong></p>\n<blockquote><p>Z世代清楚认识到什么？</p>\n</blockquote>\n<p>题型：<strong>具体认识题</strong>。</p>\n\n<hr />\n<h2>38题题干</h2>\n<p><strong>The word “assuage” (Para. 2) is closest in meaning to ______.</strong></p>\n<blockquote><p>第2段assuage最接近哪个意思？</p>\n</blockquote>\n<p>题型：<strong>猜词题</strong>。</p>\n\n<hr />\n<h2>39题题干</h2>\n<p><strong>It can be learned from Paragraph 3 that Generation Zs ______.</strong></p>\n<blockquote><p>从第3段可知，Z世代在职业选择上怎样？</p>\n</blockquote>\n<p>题型：<strong>具体归纳题</strong>。</p>\n\n<hr />\n<h2>40题题干</h2>\n<p><strong>Michelsen thinks that compared with millennials, Generation Zs are ______.</strong></p>\n<blockquote><p>Michelsen认为，与千禧一代相比，Z世代怎样？</p>\n</blockquote>\n<p>题型：<strong>人物比较观点题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>Despite, especially, followed by</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>practical, cautious, secure</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>hiring, chose, looking for</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>employment, stability, debt</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Generation Z, millennials, jobs</td></tr></tbody></table>\n\n<hr />\n<p>Now that members of Generation Z are graduating college this spring —the most commonly-accepted definition says this generation was born after 1995, give or take a year— the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that’s tighter than it’s been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> will differ from those who came before them.</p>\n\n<hr />\n<p>Now that members of Generation Z are graduating college this spring / —the most commonly-accepted definition says this generation was born after 1995, give or take a year— / the attention has been rising steadily in recent weeks. / Gen Zs are about to hit the streets looking for work / in a labor market that’s tighter than it’s been in decades. / And employers are planning on hiring about 17 percent more new graduates / for jobs in the U.S. this year than last, / according to a survey conducted by the National Association of Colleges and Employers. / Everybody wants to know / how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> / will differ from those who came before them.</p>\n\n<hr />\n<p>Now that members of Z世代 are 今年春天大学毕业 / —the most commonly-accepted definition says this generation was 1995年后出生, give or take a year— / the 关注 has been 稳定上升 in 最近几周. / Gen Zs are about to hit the streets 找工作 / in a 劳动力市场 that’s tighter than it’s been in decades. / And 雇主 are planning on hiring about 多百分之十七的新毕业生 / for 美国岗位 今年相较去年, / according to a survey conducted by the National Association of Colleges and Employers. / 每个人想知道 / how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> / 将有不同 from those who came before them.</p>\n\n<hr />\n<p>1、Z世代、今年春天大学毕业、1995年后出生、关注、稳定上升、最近几周、找工作、劳动力市场、雇主、多百分之十七的新毕业生、美国岗位、今年相较去年、每个人想知道、将有不同。</p>\n\n<hr />\n<p>If “<strong>[xxx]</strong>” is the most common adjective, fairly or not, applied to millennials (those born between 1981 and 1995), the <strong>[xxx]</strong> for Generation Z are practical and cautious. According to the career <strong>[xxx]</strong> and experts who study them, Generation Zs are clear-eyed, economic <strong>[xxx]</strong>. Despite graduating into the best economy in the past 50 years, Gen Zs know what an economic train wreck looks like. They were <strong>[xxx]</strong> kids during the crash of 2008, when many of their parents lost their jobs or their life savings or both. They aren’t interested in taking any chances. The <strong>[xxx]</strong> economy seems to have done little to assuage this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong>, especially for those who have college debt. College loan <strong>[xxx]</strong> in the U.S. now stand at a record $1.5 trillion, according to the Federal Reserve.</p>\n\n<hr />\n<p>If “<strong>[xxx]</strong>” is the most common adjective, fairly or not, / applied to millennials (those born between 1981 and 1995), / the <strong>[xxx]</strong> for Generation Z are practical and cautious. / According to the career <strong>[xxx]</strong> and experts who study them, / Generation Zs are clear-eyed, economic <strong>[xxx]</strong>. / Despite graduating into the best economy in the past 50 years, / Gen Zs know what an economic train wreck looks like. / They were <strong>[xxx]</strong> kids during the crash of 2008, / when many of their parents lost their jobs or their life savings or both. / They aren’t interested in taking any chances. / The <strong>[xxx]</strong> economy seems to have done little to assuage / this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong>, / especially for those who have college debt. / College loan <strong>[xxx]</strong> in the U.S. now stand at a record $1.5 trillion, / according to the Federal Reserve.</p>\n\n<hr />\n<p>If “<strong>[xxx]</strong>” is the most common adjective, fairly or not, / applied to 千禧一代 (those born between 1981 and 1995), / the <strong>[xxx]</strong> for Generation Z are 务实与谨慎. / According to the career <strong>[xxx]</strong> and experts who study them, / Z世代 are 目光清醒, economic <strong>[xxx]</strong>. / Despite graduating into the 最好的经济 in the 过去五十年, / Gen Zs know what an economic train wreck looks like. / They were <strong>[xxx]</strong> kids during the 2008年崩盘, / when many of their 父母失去工作 or their 毕生积蓄 or both. / They aren’t interested in 冒任何风险. / The <strong>[xxx]</strong> economy seems to have done little to assuage / this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong>, / especially for those who have 大学债务. / College loan <strong>[xxx]</strong> in the U.S. now stand at a record $1.5 trillion, / according to the Federal Reserve.</p>\n\n<hr />\n<p>2、千禧一代、务实与谨慎、Z世代、目光清醒、最好的经济、过去五十年、2008年崩盘、父母失去工作、毕生积蓄、冒任何风险、大学债务。</p>\n\n<hr />\n<p>One survey from Accenture found that 88 percent of graduating seniors this year chose their major with a job in mind. In a 2019 survey of University of Georgia students, meanwhile, the career office found the most <strong>[xxx]</strong> <strong>[xxx]</strong> in a future employer was the ability to offer secure employment (followed by <strong>[xxx]</strong> development and training, and then inspiring purpose). Job security or stability was the second most important career goal (work-life balance was number one), followed by a sense of being <strong>[xxx]</strong> to a cause or to feel good about serving the greater good.</p>\n\n<hr />\n<p>One survey from Accenture found / that 88 percent of graduating seniors this year chose their major with a job in mind. / In a 2019 survey of University of Georgia students, meanwhile, / the career office found the most <strong>[xxx]</strong> <strong>[xxx]</strong> in a future employer / was the ability to offer secure employment / (followed by <strong>[xxx]</strong> development and training, and then inspiring purpose). / Job security or stability was the second most important career goal / (work-life balance was number one), / followed by a sense of being <strong>[xxx]</strong> to a cause / or to feel good about serving the greater good.</p>\n\n<hr />\n<p>One survey from Accenture found / that 百分之八十八 of graduating seniors this year 选择专业 with 考虑工作. / In a 2019 survey of University of Georgia students, meanwhile, / the career office found the most <strong>[xxx]</strong> <strong>[xxx]</strong> in a 未来雇主 / was the ability to offer 稳定就业 / (followed by <strong>[xxx]</strong> 发展培训, and then inspiring purpose). / 工作保障或稳定 was the second most important career goal / (工作生活平衡 was number one), / followed by a sense of being <strong>[xxx]</strong> to a cause / or to feel good about serving the greater good.</p>\n\n<hr />\n<p>3、百分之八十八、选择专业、考虑工作、未来雇主、稳定就业、发展培训、工作保障或稳定、工作生活平衡。</p>\n\n<hr />\n<p>That’s a big change from the previous generation. “Millennials wanted more <strong>[xxx]</strong> in their lives,” notes Tanya Michelsen, Associate Director of YouthSight, a UK-based brand manager that conducts regular 60-day surveys of British youth, in findings that might just as well apply to American youth. “Generation Zs are looking for more <strong>[xxx]</strong> and stability, because of the rise of the gig economy. They have trouble seeing a financial future and they are quite risk <strong>[xxx]</strong>.”</p>\n\n<hr />\n<p>That’s a big change from the previous generation. / “Millennials wanted more <strong>[xxx]</strong> in their lives,” / notes Tanya Michelsen, Associate Director of YouthSight, / a UK-based brand manager that conducts regular 60-day surveys of British youth, / in findings that might just as well apply to American youth. / “Generation Zs are looking for more <strong>[xxx]</strong> and stability, / because of the rise of the gig economy. / They have trouble seeing a financial future / and they are quite risk <strong>[xxx]</strong>.”</p>\n\n<hr />\n<p>That’s 很大变化 from the 上一代. / “千禧一代 wanted more <strong>[xxx]</strong> in 他们的生活,” / notes Tanya Michelsen, Associate Director of YouthSight, / a UK-based brand manager that conducts regular 60-day surveys of 英国年轻人, / in 发现 that might just as well 适用于美国年轻人. / “Z世代在寻求 more <strong>[xxx]</strong> and 稳定, / because of the 零工经济兴起. / They have 难以看到经济未来 / and they are quite 风险 <strong>[xxx]</strong>.”</p>\n\n<hr />\n<p>4、很大变化、上一代、千禧一代、他们的生活、英国年轻人、发现、适用于美国年轻人、Z世代在寻求、稳定、零工经济兴起、难以看到经济未来、风险。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：Z世代、毕业就业、经济经历、稳定与代际差异。刚才还看到：Z世代、今年春天大学毕业、1995年后出生、关注、稳定上升、最近几周、找工作、劳动力市场、雇主、多百分之十七的新毕业生、美国岗位、今年相较去年、每个人想知道、将有不同；千禧一代、务实与谨慎、Z世代、目光清醒、最好的经济、过去五十年、2008年崩盘、父母失去工作、毕生积蓄、冒任何风险、大学债务；百分之八十八、选择专业、考虑工作、未来雇主、稳定就业、发展培训、工作保障或稳定、工作生活平衡；很大变化、上一代、千禧一代、他们的生活、英国年轻人、发现、适用于美国年轻人、Z世代在寻求、稳定、零工经济兴起、难以看到经济未来、风险。</p>\n<p>到这里还不能自然地说清楚：良好就业环境为什么没有消除谨慎，两套职业排序各排什么，末段比较的是哪种性格与选择。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n\n<hr />\n<h2>36题</h2>\n<blockquote><p>Generation Zs graduating college this spring ______.<br />\n今年春天大学毕业的Z世代处于怎样的情况？</p>\n</blockquote>\n<p>题干与首段开头对应。整段同时写公众关注、招聘环境与人们的好奇，需分清哪一方在作判断。</p>\n<blockquote><p>原文参考：</p>\n<p>Now that members of Generation Z are graduating college this spring —the most commonly-accepted definition says this generation was born after 1995, give or take a year— the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that’s tighter than it’s been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> will differ from those who came before them.</p>\n<p>开始精读：</p>\n<p>Now that members of Generation Z are graduating college this spring / —the most commonly-accepted definition says this generation was born after 1995, give or take a year— / the attention has been rising steadily in recent weeks. / Gen Zs are about to hit the streets looking for work / in a labor market that’s tighter than it’s been in decades. / And employers are planning on hiring about 17 percent more new graduates / for jobs in the U.S. this year than last, / according to a survey conducted by the National Association of Colleges and Employers. / Everybody wants to know / how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> / will differ from those who came before them.</p>\n<p>如今Z世代成员正在这个春天大学毕业 / ——最普遍接受的定义说这一代人出生于1995年之后上下相差一年—— / 最近几周关注度一直稳定上升。 / Z世代即将走出去找工作 / 所处劳动力市场比几十年来更紧。 / 而雇主计划多雇用大约百分之十七的新毕业生 / 在今年美国的岗位上相较去年 / 根据美国大学与雇主协会进行的一项调查。 / 每个人都想知道 / 很快<strong>[xxx]</strong>那些空办公室<strong>[xxx]</strong>的人们 / 与此前的人会有怎样的不同。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. are <strong>[xxx]</strong> for their abilities</h3>\n<blockquote><p>因能力而被<strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：今年毕业的Z世代因为自身能力而受到某种<strong>[xxx]</strong>。</p>\n<p>A把关注归因于能力，回首段看引起注意的时间背景。</p>\n<blockquote><p>the attention has been rising steadily in recent weeks.</p>\n</blockquote>\n<blockquote><p>Everybody wants to know how the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> will differ from those who came before them.</p>\n</blockquote>\n<p>这一代人开始大学毕业、进入职场，人们想知道他们与前几代有何不同。这里讲的是一批新人的到来。</p>\n<p>作者没有列出他们的能力优势，也没有说某种评价是因为能力而产生。A的动作词未知，for their abilities这一原因仍无对应。</p>\n<p><strong>开始就业引起关注，就能改成因为能力而受到某种评价吗？</strong></p>\n<p>不能。A另加了能力这个原因。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. are optimistic about the labor market</h3>\n<blockquote><p>对劳动力市场持乐观态度</p>\n</blockquote>\n<p>把B接回题干，它说的是：今年毕业的Z世代对就业市场持乐观态度。</p>\n<p>B说毕业生乐观，回首段区分市场招聘计划与毕业生的感受。</p>\n<blockquote><p>employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last</p>\n</blockquote>\n<p>雇主计划多招约17%的新毕业生，是招聘需求的数据。该数据说明外部机会，没有直接说明学生对机会怎样想。</p>\n<p>第2段还特意说他们见过经济危机，不愿冒险。因此不能把好市场自动换成他们很乐观。</p>\n<p><strong>雇主想多招人，就证明这一代毕业生持乐观态度吗？</strong></p>\n<p>不能。B把市场状况当成了人物态度。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. are drawing growing public attention</h3>\n<blockquote><p>正在吸引越来越多的公众关注</p>\n</blockquote>\n<p>把C接回题干，它说的是：今年毕业的Z世代正受到日益增加的公众关注。</p>\n<p>C说关注增加，回首段找the attention has been rising steadily。</p>\n<blockquote><p>the attention has been rising steadily in recent weeks.</p>\n</blockquote>\n<blockquote><p>Everybody wants to know</p>\n</blockquote>\n<p>作者直接说近几周关注持续上升，末句又说每个人都想知道这些即将进入办公室的人与前辈有何不同。</p>\n<p>C的growing public attention与开头陈述相合，末句也解释了人们关注的具体问题。</p>\n<p><strong>持续增长的关注，是否正对应C？</strong></p>\n<p>是。C有首尾两处文字支持。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. are in favor of office job offers</h3>\n<blockquote><p>偏好办公室工作机会</p>\n</blockquote>\n<p>把D接回题干，它说的是：今年毕业的Z世代更赞成接受办公室岗位。</p>\n<p>D说偏好办公室岗位，回首段看empty office…所在的问句。</p>\n<blockquote><p>the people who will soon <strong>[xxx]</strong> those empty office <strong>[xxx]</strong> will differ from those who came before them</p>\n</blockquote>\n<p>作者用即将填入办公室空位的人指这些新毕业生，再问他们与前辈怎样不同。没有拿办公室工作与其他工作作偏好比较。</p>\n<p>将要进入某类岗位，不表示他们调查后表态更喜欢这一类。</p>\n<p><strong>提到办公室空位，就证明毕业生更偏好办公室工作吗？</strong></p>\n<p>没有。D增加了未出现的职业偏好。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>36题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h2>37题</h2>\n<blockquote><p>Generation Zs are keenly aware ______.<br />\nZ世代清楚认识到什么？</p>\n</blockquote>\n<p>第2段know what an economic train wreck looks like与aware对应。读完2008年父母经历及当前谨慎态度，确认这种认识的内容和来源。</p>\n<blockquote><p>原文参考：</p>\n<p>If “<strong>[xxx]</strong>” is the most common adjective, fairly or not, applied to millennials (those born between 1981 and 1995), the <strong>[xxx]</strong> for Generation Z are practical and cautious. According to the career <strong>[xxx]</strong> and experts who study them, Generation Zs are clear-eyed, economic <strong>[xxx]</strong>. Despite graduating into the best economy in the past 50 years, Gen Zs know what an economic train wreck looks like. They were <strong>[xxx]</strong> kids during the crash of 2008, when many of their parents lost their jobs or their life savings or both. They aren’t interested in taking any chances. The <strong>[xxx]</strong> economy seems to have done little to assuage this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong>, especially for those who have college debt. College loan <strong>[xxx]</strong> in the U.S. now stand at a record $1.5 trillion, according to the Federal Reserve.</p>\n<p>开始精读：</p>\n<p>If “<strong>[xxx]</strong>” is the most common adjective, fairly or not, / applied to millennials (those born between 1981 and 1995), / the <strong>[xxx]</strong> for Generation Z are practical and cautious. / According to the career <strong>[xxx]</strong> and experts who study them, / Generation Zs are clear-eyed, economic <strong>[xxx]</strong>. / Despite graduating into the best economy in the past 50 years, / Gen Zs know what an economic train wreck looks like. / They were <strong>[xxx]</strong> kids during the crash of 2008, / when many of their parents lost their jobs or their life savings or both. / They aren’t interested in taking any chances. / The <strong>[xxx]</strong> economy seems to have done little to assuage / this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong>, / especially for those who have college debt. / College loan <strong>[xxx]</strong> in the U.S. now stand at a record $1.5 trillion, / according to the Federal Reserve.</p>\n<p>如果不管公正与否“<strong>[xxx]</strong>”是最常见的形容词 / 用来描述千禧一代即1981至1995年出生者 / 那么Z世代的<strong>[xxx]</strong>是务实和谨慎。 / 根据职业<strong>[xxx]</strong>及研究他们的专家 / Z世代是目光清醒的经济<strong>[xxx]</strong>。 / 尽管毕业时处于过去五十年最好的经济状况 / Z世代知道经济列车出轨是什么样。 / 2008年崩盘时他们还是<strong>[xxx]</strong>的孩子 / 那时他们很多父母失去工作或毕生积蓄或者两者都失去。 / 他们对冒任何风险都不感兴趣。 / <strong>[xxx]</strong>的经济似乎几乎没有起到assuage的作用 / 对于这一代人<strong>[xxx]</strong>的焦虑<strong>[xxx]</strong> / 尤其是有大学债务的人。 / 美国大学贷款<strong>[xxx]</strong>如今达到创纪录的一点五万亿美元 / 据美联储所说。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. what their parents expect of them</h3>\n<blockquote><p>父母对他们有什么期待</p>\n</blockquote>\n<p>把A接回题干，它说的是：Z世代十分清楚父母对他们的期待。</p>\n<p>A说了解父母期待，回第2段看父母被提到时发生什么。</p>\n<blockquote><p>many of their parents lost their jobs or their life savings or both</p>\n</blockquote>\n<p>2008年危机中，许多人的父母失去工作或一生积蓄。孩子从这段经历看到经济崩溃的后果。</p>\n<p>段落没有父母向孩子提出的期望，也没有孩子理解期望的叙述。</p>\n<p><strong>父母在这里提供的是期待，还是经济危机的生活经历？</strong></p>\n<p>是后者。A把经历换成了期待。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. how valuable a <strong>[xxx]</strong>’s advice is</h3>\n<blockquote><p>某位<strong>[xxx]</strong>的建议多么有价值</p>\n</blockquote>\n<p>把B接回题干，它说的是：Z世代清楚某类<strong>[xxx]</strong>提供的建议有多大价值。</p>\n<p>B说认识到建议的价值，回第2段看职业专家在句中承担什么作用。</p>\n<blockquote><p>According to the career <strong>[xxx]</strong> and experts who study them, Generation Zs are clear-eyed, economic <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>专家是作者引用的观察来源，他们评价Z世代务实、谨慎。原文没有接着说这些青年接受了某位人士的建议。</p>\n<p>被专家研究，与自己懂得专家建议有多珍贵，主语和动作都不一样。B的人物词未知也不能补出这层关系。</p>\n<p><strong>专家评价青年，就等于青年知道某类建议的价值吗？</strong></p>\n<p>不等于。B没有相应的青年认识内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. how they differ from past generations</h3>\n<blockquote><p>他们与前几代人有怎样的不同</p>\n</blockquote>\n<p>把C接回题干，它说的是：Z世代清楚自己与过去几代人的差异。</p>\n<p>C说知道代际差异，回首段看Everybody wants to know与第2段Gen Zs know。</p>\n<blockquote><p>Gen Zs know what an economic train wreck looks like.</p>\n</blockquote>\n<p>首段是公众想知道代际差别；第2段则明确说Z世代知道经济崩溃是什么样。两个know的主语与对象不同。</p>\n<p>C把公众想了解的事情，换成了Z世代已经充分了解的事情。</p>\n<p><strong>大家想知道他们与前辈的差异，是否等于他们自己清楚这种差异？</strong></p>\n<p>不是。C把不同人物的认识接错了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. what a tough economic situation is like</h3>\n<blockquote><p>艰难经济状况是什么样</p>\n</blockquote>\n<p>把D接回题干，它说的是：Z世代清楚经济陷入艰难处境会是什么样。</p>\n<p>D说清楚经济困境，回第2段看economic train wreck与父母损失的例子。</p>\n<blockquote><p>Gen Zs know what an economic train wreck looks like.</p>\n</blockquote>\n<blockquote><p>many of their parents lost their jobs or their life savings or both</p>\n</blockquote>\n<p>经济像列车撞毁一样出了严重问题，是这个比喻给出的基本方向。后句用父母失业、积蓄受损解释他们为何熟悉这种后果。</p>\n<p>D把这类严重经济困境概括出来，并未要求懂得段中每个评价词。</p>\n<p><strong>亲眼见过家庭因经济危机失去工作和积蓄，是否支持清楚经济困境？</strong></p>\n<p>支持。D与know之后的内容及随后的解释一致。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>37题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n\n<hr />\n<h2>38题</h2>\n<blockquote><p>The word “assuage” (Para. 2) is closest in meaning to ______.<br />\n第2段assuage最接近哪个意思？</p>\n</blockquote>\n<p>本段已完整读过。把done little to与anxious放在一起，再看经济环境较好却仍谨慎的反差，先判断这个动词应表示什么作用。</p>\n<p>这一段前面已经完整读过，下面直接回到各项所涉及的句子。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. relieve</h3>\n<blockquote><p>缓解</p>\n</blockquote>\n<p>把A接回题干，它说的是：经济增长几乎没有缓解这一代人的焦虑。</p>\n<p>A说缓解，回第2段把好经济与仍不愿冒险连起来。</p>\n<blockquote><p>Despite graduating into the best economy in the past 50 years</p>\n</blockquote>\n<blockquote><p>They aren’t interested in taking any chances.</p>\n</blockquote>\n<blockquote><p>seems to have done little to assuage this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong></p>\n</blockquote>\n<p>他们毕业时经济很好，但小时候见过危机，所以仍谨慎，不愿冒险。即使当下机会增加，焦虑没有明显减轻。</p>\n<p>把relieve放入done little to之后，得到“几乎没能缓解焦虑”，正好把这组反差说清楚。</p>\n<p><strong>好形势没有让担忧明显减轻，是否符合done little to relieve？</strong></p>\n<p>符合。A能顺接全段的经济好、心仍不安。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. define</h3>\n<blockquote><p>界定</p>\n</blockquote>\n<p>把B接回题干，它说的是：经济增长几乎没有界定这一代人的焦虑。</p>\n<p>B说界定，回第2段看前后有没有讨论焦虑的定义。</p>\n<blockquote><p>They aren’t interested in taking any chances.</p>\n</blockquote>\n<blockquote><p>especially for those who have college debt</p>\n</blockquote>\n<p>作者描述的是担忧仍在，尤其背着大学债务的人更难安心；没有争论这种焦虑应该怎样命名或划界。</p>\n<p>define放进去变成经济没有界定焦虑，接不上好经济本应让人稍安心却未奏效的意思。</p>\n<p><strong>这段在讲情绪是否减轻，还是在给情绪下定义？</strong></p>\n<p>在讲是否减轻。B不合上下文。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. maintain</h3>\n<blockquote><p>维持</p>\n</blockquote>\n<p>把C接回题干，它说的是：经济增长几乎没有维持这一代人的焦虑。</p>\n<p>C说维持，回第2段看作者为什么提最佳经济形势。</p>\n<blockquote><p>Despite graduating into the best economy in the past 50 years</p>\n</blockquote>\n<blockquote><p>The <strong>[xxx]</strong> economy seems to have done little to assuage this <strong>[xxx]</strong> generational sense of anxious <strong>[xxx]</strong></p>\n</blockquote>\n<p>最佳形势通常会让人觉得机会更稳，但这批青年仍有危机记忆。作者强调的是好环境没能使忧虑退去。</p>\n<p>maintain放入后成了经济几乎没维持焦虑，不能解释作者接着写负债者仍担忧的反差。</p>\n<p><strong>这里想说好经济没能维持担忧，还是没能减轻担忧？</strong></p>\n<p>是没能减轻。C没有接住前后关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. deepen</h3>\n<blockquote><p>加深</p>\n</blockquote>\n<p>把D接回题干，它说的是：经济增长几乎没有加深这一代人的焦虑。</p>\n<p>D说加深，回第2段连着done little to读。</p>\n<blockquote><p>They aren’t interested in taking any chances.</p>\n</blockquote>\n<blockquote><p>especially for those who have college debt</p>\n</blockquote>\n<p>将deepen放入，句子就说好经济没怎么加重焦虑。但前文并没有设想好形势会增加焦虑，后文也不是验证它有没有加重。</p>\n<p>前后的问题是明明经济很好，他们为什么仍不安心；“没有缓解”才能回答这层反差。</p>\n<p><strong>好形势没加重担忧，能准确表达作者强调的担忧依然难消吗？</strong></p>\n<p>不能准确表达。D使句子的着重点偏了，A更贴近。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>38题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n\n<hr />\n<h2>39题</h2>\n<blockquote><p>It can be learned from Paragraph 3 that Generation Zs ______.<br />\n从第3段可知，Z世代在职业选择上怎样？</p>\n</blockquote>\n<p>第3段分别调查选专业时的考虑、未来雇主的特点与职业目标。读完整段后分开两套排序，不能把它们混成一个第一名。</p>\n<blockquote><p>原文参考：</p>\n<p>One survey from Accenture found that 88 percent of graduating seniors this year chose their major with a job in mind. In a 2019 survey of University of Georgia students, meanwhile, the career office found the most <strong>[xxx]</strong> <strong>[xxx]</strong> in a future employer was the ability to offer secure employment (followed by <strong>[xxx]</strong> development and training, and then inspiring purpose). Job security or stability was the second most important career goal (work-life balance was number one), followed by a sense of being <strong>[xxx]</strong> to a cause or to feel good about serving the greater good.</p>\n<p>开始精读：</p>\n<p>One survey from Accenture found / that 88 percent of graduating seniors this year chose their major with a job in mind. / In a 2019 survey of University of Georgia students, meanwhile, / the career office found the most <strong>[xxx]</strong> <strong>[xxx]</strong> in a future employer / was the ability to offer secure employment / (followed by <strong>[xxx]</strong> development and training, and then inspiring purpose). / Job security or stability was the second most important career goal / (work-life balance was number one), / followed by a sense of being <strong>[xxx]</strong> to a cause / or to feel good about serving the greater good.</p>\n<p>埃森哲一项调查发现 / 今年百分之八十八的应届毕业生选专业时考虑了工作。 / 同时在2019年一项针对佐治亚大学学生的调查中 / 就业办公室发现未来雇主最<strong>[xxx]</strong>的<strong>[xxx]</strong> / 是能够提供稳定就业 / 接下来是<strong>[xxx]</strong>发展和培训然后是激励人心的目标。 / 工作保障或稳定是第二重要的职业目标 / 工作生活平衡排第一 / 随后是<strong>[xxx]</strong>于某项事业的感受 / 或者为更大共同利益服务的良好感受。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. give top priority to <strong>[xxx]</strong> training</h3>\n<blockquote><p>把<strong>[xxx]</strong>培训列为最高优先项</p>\n</blockquote>\n<p>把A接回题干，它说的是：Z世代把某种<strong>[xxx]</strong>培训放在职业选择的第一位。</p>\n<p>A说培训排第一，回第3段看followed by前面是什么。</p>\n<blockquote><p>the ability to offer secure employment (followed by <strong>[xxx]</strong> development and training, and then inspiring purpose)</p>\n</blockquote>\n<p>调查中，未来雇主能提供稳定就业被排在前面，培训等随后。followed by已经标出先后。</p>\n<p>A即使培训的修饰词未读懂，top priority仍与这项排序不合。不能把榜上出现过的项目都当作第一位。</p>\n<p><strong>培训被放在稳定就业之后，能称为最高优先项吗？</strong></p>\n<p>不能。A改了明确的顺序。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. care little about their job performance</h3>\n<blockquote><p>不太在意自己的工作表现</p>\n</blockquote>\n<p>把B接回题干，它说的是：Z世代很少关心自己工作做得好不好。</p>\n<p>B说不在意工作表现，回第3段看调查到底问了什么。</p>\n<blockquote><p>Job security or stability was the second most important career goal (work-life balance was number one)</p>\n</blockquote>\n<p>调查讲选专业时是否考虑工作、希望雇主提供哪些条件、职业目标怎样排序。没有测量他们在岗位上是否用心或表现怎样。</p>\n<p>重视稳定与生活平衡，也不能自动推出做事不上心。两种想法可以同时存在。</p>\n<p><strong>重视稳定、平衡，就意味着不关心工作做得好不好吗？</strong></p>\n<p>不意味着。B增加了原文没有的负面判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. have a clear idea about their future jobs</h3>\n<blockquote><p>对未来工作有清楚想法</p>\n</blockquote>\n<p>把C接回题干，它说的是：Z世代对于未来工作和想要的职业条件有较清楚的考虑。</p>\n<p>C说对未来工作有清楚考虑，回第3段把三项调查接起来。</p>\n<blockquote><p>88 percent of graduating seniors this year chose their major with a job in mind.</p>\n</blockquote>\n<blockquote><p>the ability to offer secure employment</p>\n</blockquote>\n<blockquote><p>work-life balance was number one</p>\n</blockquote>\n<p>88%选专业时已考虑工作；选择雇主时看重稳定就业、发展培训；谈职业目标时又有平衡与稳定的排序。</p>\n<p>他们并非什么工作都没想过，而是已有具体条件与优先次序。C概括的是这种明确考虑，不是说每个人已经拿到确定岗位。</p>\n<p><strong>选专业、选雇主和职业目标都有考虑，是否支持对未来工作有清楚想法？</strong></p>\n<p>支持。C能把整段调查结果连起来。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. think it hard to achieve work-life balance</h3>\n<blockquote><p>认为工作生活平衡很难实现</p>\n</blockquote>\n<p>把D接回题干，它说的是：Z世代认为实现工作与生活平衡很困难。</p>\n<p>D说平衡难实现，回第3段看number one说明重要性还是难度。</p>\n<blockquote><p>work-life balance was number one</p>\n</blockquote>\n<p>工作生活平衡排在职业目标第一，说明受访者重视它。排名没有测量他们认为实现它有多困难。</p>\n<p>一个目标重要，可以因为可取、有价值，不必因为难以做到。D把重视程度换成了实现难度。</p>\n<p><strong>被列为首要目标，就等于被认为很难实现吗？</strong></p>\n<p>不等于。D超出了这项排序的信息。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h2>40题</h2>\n<blockquote><p>Michelsen thinks that compared with millennials, Generation Zs are ______.<br />\nMichelsen认为，与千禧一代相比，Z世代怎样？</p>\n</blockquote>\n<p>Michelsen定位末段。题目问指定人物作出的代际比较，不是全文作者态度；读清较年轻一代追求什么以及原因。</p>\n<blockquote><p>原文参考：</p>\n<p>That’s a big change from the previous generation. “Millennials wanted more <strong>[xxx]</strong> in their lives,” notes Tanya Michelsen, Associate Director of YouthSight, a UK-based brand manager that conducts regular 60-day surveys of British youth, in findings that might just as well apply to American youth. “Generation Zs are looking for more <strong>[xxx]</strong> and stability, because of the rise of the gig economy. They have trouble seeing a financial future and they are quite risk <strong>[xxx]</strong>.”</p>\n<p>开始精读：</p>\n<p>That’s a big change from the previous generation. / “Millennials wanted more <strong>[xxx]</strong> in their lives,” / notes Tanya Michelsen, Associate Director of YouthSight, / a UK-based brand manager that conducts regular 60-day surveys of British youth, / in findings that might just as well apply to American youth. / “Generation Zs are looking for more <strong>[xxx]</strong> and stability, / because of the rise of the gig economy. / They have trouble seeing a financial future / and they are quite risk <strong>[xxx]</strong>.”</p>\n<p>这与上一代相比是很大变化。 / “千禧一代想在生活中获得更多<strong>[xxx]</strong>” / YouthSight副总监Tanya Michelsen指出 / 这是一家英国品牌管理机构定期以六十天为周期调查英国年轻人 / 这些发现也可能同样适用于美国年轻人。 / “Z世代在寻求更多<strong>[xxx]</strong>和稳定 / 因为零工经济兴起。 / 他们难以看到经济上的未来 / 并且对于风险相当<strong>[xxx]</strong>。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. more <strong>[xxx]</strong></h3>\n<blockquote><p>更<strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：Michelsen认为Z世代比千禧一代更具某种<strong>[xxx]</strong>特点。</p>\n<p>A的比较属性未知，回末段先确定已知的比较方向。</p>\n<blockquote><p>Generation Zs are looking for more <strong>[xxx]</strong> and stability</p>\n</blockquote>\n<blockquote><p>They have trouble seeing a financial future and they are quite risk <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>Michelsen说Z世代寻求更多稳定，因为零工经济兴起、经济未来难看清。我们知道她在谈职业经济上的稳妥取向。</p>\n<p>A只有more能读懂，尚不能确认所比较的性质。先与能够接到稳定诉求的D一起留下。</p>\n<p><strong>目前是否知道A的性质词，从而能断定它与稳定诉求冲突？</strong></p>\n<p>还不知道。A暂留，回查时不借答案给它补词。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. more generous</h3>\n<blockquote><p>更加慷慨</p>\n</blockquote>\n<p>把B接回题干，它说的是：Michelsen认为Z世代比千禧一代更愿意慷慨付出。</p>\n<p>B说更慷慨，回末段看Michelsen比较的具体追求。</p>\n<blockquote><p>They have trouble seeing a financial future</p>\n</blockquote>\n<p>她讨论的是生活偏好、稳定与经济未来，说明Z世代对不确定工作的反应。没有提到捐钱、分享资源或帮助别人的程度。</p>\n<p>第3段虽出现服务公益的目标，也没有说他们比千禧一代更愿意付出。</p>\n<p><strong>末段是否作了谁更愿意慷慨付出的代际比较？</strong></p>\n<p>没有。B换了比较的内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. less realistic</h3>\n<blockquote><p>更不现实</p>\n</blockquote>\n<p>把C接回题干，它说的是：Michelsen认为Z世代比千禧一代更缺乏现实感。</p>\n<p>C说更不现实，回第2段务实谨慎和末段稳定诉求。</p>\n<blockquote><p>Generation Zs are looking for more <strong>[xxx]</strong> and stability, because of the rise of the gig economy.</p>\n</blockquote>\n<blockquote><p>the <strong>[xxx]</strong> for Generation Z are practical and cautious.</p>\n</blockquote>\n<p>第2段明确用practical、cautious描述他们；末段又解释他们考虑零工经济带来的不确定性，因此看重稳定。</p>\n<p>难以看清经济未来，是他们觉得未来有风险，不是他们不理解现实。C把审慎担忧读成了缺乏现实感。</p>\n<p><strong>因现实中的风险而追求稳定，能够支持更不现实吗？</strong></p>\n<p>不能。C与已经给出的务实描述不合。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. less adventurous</h3>\n<blockquote><p>更不愿冒险</p>\n</blockquote>\n<p>把D接回题干，它说的是：Michelsen认为Z世代比千禧一代更不愿尝试有风险的选择。</p>\n<p>D说更不愿冒险，回末段看稳定要求，再接第2段taking any chances。</p>\n<blockquote><p>Generation Zs are looking for more <strong>[xxx]</strong> and stability</p>\n</blockquote>\n<blockquote><p>They aren’t interested in taking any chances.</p>\n</blockquote>\n<p>Michelsen把Z世代的稳定诉求放在代际比较中，并说明零工经济使他们难以看清经济未来。第2段已经直说他们不愿冒风险。</p>\n<p>两处接起来，D的less adventurous符合这项职业取向；不需要把它扩大到生活每个方面。</p>\n<p><strong>重视稳定并不愿冒经济风险，是否支持D的比较？</strong></p>\n<p>支持。D有两处可确认的对应，先与A一起保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>40题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂留A、D，等把全文连起来后再回来比较。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>attention；17 percent；differ</td><td>毕业进入职场的Z世代引发关注，企业招聘也较旺。</td><td>提出了解这代新人特点的问题。</td></tr><tr><td>第2段</td><td>practical；2008；taking chances</td><td>成长时见过经济危机，良好毕业环境未明显消除风险顾虑。</td><td>解释务实谨慎的形成背景。</td></tr><tr><td>第3段</td><td>major；secure employment；balance</td><td>选专业会考虑工作，对雇主与职业目标有明确排序。</td><td>用调查说明具体就业取向。</td></tr><tr><td>第4段</td><td>previous generation；stability；gig economy</td><td>与前一代相比，他们更寻求稳定，担忧经济未来。</td><td>总结代际差异及其现实原因。</td></tr></tbody></table>\n<p><strong>全文的主要意思：Z世代虽然在较好的就业环境中毕业，却因成长中的经济危机记忆、债务与零工经济的不确定而更务实谨慎；他们对未来工作有明确考虑，并比前一代更寻求稳定。</strong></p>\n\n<hr />\n<h2>回查40题：A还是D？</h2>\n<p>Michelsen thinks that compared with millennials, Generation Zs are ______.</p>\n<p>A. more <strong>[xxx]</strong></p>\n<p>D. less adventurous</p>\n<p>回到Michelsen的具体比较。她说零工经济兴起，Z世代难看清经济未来，因此希望更多稳定。D说更不愿冒险，正好能接到这个理由。</p>\n<p>再往前核对，第2段的They aren’t interested in taking any chances说得更直接。他们小时候见过父母失业、损失积蓄，因此即使毕业时经济好，也没有轻易放下担忧。第3段又显示他们选专业会考虑工作，选雇主重视稳定就业。</p>\n<p>见过家庭收入突然中断，又面对不稳定的就业形式，这解释了他们为什么格外希望工作收入可预期，也解释了D所说的不愿冒险。</p>\n<p><strong>末段的稳定要求，能否与前文不愿taking any chances相互印证？</strong></p>\n<p>能，D因此有清楚的文字和行为支持。A的性质词仍未读懂，不给它补译；它目前不能比D提供更确定的对应。</p>\n<p><strong>最终选择：40. D。</strong></p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>36. C</strong></p>\n<p><strong>37. D</strong></p>\n<p><strong>38. A</strong></p>\n<p><strong>39. C</strong></p>\n<p><strong>40. D</strong></p>\n","analysisStartIndex":25,"maskInventory":{"token":"[xxx]","count":22},"questionFlowPlan":[{"qid":"36","initialParagraphPids":[1],"paragraphPids":[1],"entry":26,"options":{"A":27,"B":28,"C":29,"D":30},"initialReadingMode":"full_paragraph"},{"qid":"37","initialParagraphPids":[2],"paragraphPids":[2],"entry":32,"options":{"A":33,"B":34,"C":35,"D":36},"initialReadingMode":"full_paragraph"},{"qid":"38","initialParagraphPids":[],"paragraphPids":[2],"entry":38,"options":{"A":39,"B":40,"C":41,"D":42},"initialReadingMode":"reuse_previous"},{"qid":"39","initialParagraphPids":[3],"paragraphPids":[3],"entry":44,"options":{"A":45,"B":46,"C":47,"D":48},"initialReadingMode":"full_paragraph"},{"qid":"40","initialParagraphPids":[4],"paragraphPids":[4],"entry":50,"options":{"A":51,"B":52,"C":53,"D":54},"initialReadingMode":"full_paragraph"}],"jumpSections":["阅前须知","先读题干","读文章","开始做题","36题","37题","38题","39题","40题","进阶方法","进阶回查","最终答案"],"supplementaryFlow":{"id":"whole_text_argument_review_v1","mainQuestion":null,"ordinaryFirstRoundCandidates":{"36":["C"],"37":["D"],"38":["A"],"39":["C"],"40":["A","D"]},"reviews":[{"qid":40,"pair":["A","D"],"final":"D"}]}};
let idx=-1,fullMode=false,ready=false,savedInteractive={idx:-1,left:0,right:0};

function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}
function centerRight(){const el=document.getElementById('onlyCurrent');if(!el)return;combined.style.paddingTop='30px';combined.style.paddingBottom='60px';requestAnimationFrame(()=>{const h=el.getBoundingClientRect().height,ph=rightPane.clientHeight;if(h<ph-70){const pad=Math.max(30,Math.floor((ph-h)/2));combined.style.paddingTop=pad+'px';combined.style.paddingBottom=pad+'px'}rightPane.scrollTo({top:0,behavior:'smooth'})})}

function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}

let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);

function centerHorizontal(){
  requestAnimationFrame(()=>{
    if(!leftPane)return;
    if(zoomLevel>100&&leftPane.scrollWidth>leftPane.clientWidth){
      leftPane.scrollLeft=Math.max(0,Math.round((leftPane.scrollWidth-leftPane.clientWidth)/2));
    }else{
      leftPane.scrollLeft=0;
    }
    updateDragCursor();
  });
}
function updateDragCursor(){
  if(!leftPane)return;
  if(zoomLevel>100&&(leftPane.scrollWidth>leftPane.clientWidth||leftPane.scrollHeight>leftPane.clientHeight)){
    leftPane.style.cursor='grab';
  }else{
    leftPane.style.cursor='';
  }
}
function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');

  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
  centerHorizontal();
}
