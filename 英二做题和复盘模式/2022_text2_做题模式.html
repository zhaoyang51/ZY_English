<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**The survey conducted by Harris Poll indicates that ______.**\n\n> Harris Poll的调查表明什么？\n\n题型：**调查结果题**。","html":"<h2>26题题干</h2>\n<p><strong>The survey conducted by Harris Poll indicates that ______.</strong></p>\n<blockquote><p>Harris Poll的调查表明什么？</p>\n</blockquote>\n<p>题型：<strong>调查结果题</strong>。</p>\n","articleRects":[],"questionRects":[[152,278,537,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**It can be inferred from Paragraph 3 that Americans tend to think that ______.**\n\n> 从第3段可推知，美国人倾向于怎样看待退休？\n\n题型：**段落推断题**。","html":"<h2>27题题干</h2>\n<p><strong>It can be inferred from Paragraph 3 that Americans tend to think that ______.</strong></p>\n<blockquote><p>从第3段可推知，美国人倾向于怎样看待退休？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n","articleRects":[],"questionRects":[[152,500,708,21]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**Retirement patterns are changing partly due to ______.**\n\n> 退休模式发生变化的部分原因是什么？\n\n题型：**原因题**。","html":"<h2>28题题干</h2>\n<p><strong>Retirement patterns are changing partly due to ______.</strong></p>\n<blockquote><p>退休模式发生变化的部分原因是什么？</p>\n</blockquote>\n<p>题型：<strong>原因题</strong>。</p>\n","articleRects":[],"questionRects":[[152,721,495,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**Many “unretirees” are increasing their savings by ______.**\n\n> 许多退而不休者通过什么方式增加储蓄？\n\n题型：**具体做法题**。","html":"<h2>29题题干</h2>\n<p><strong>Many “unretirees” are increasing their savings by ______.</strong></p>\n<blockquote><p>许多退而不休者通过什么方式增加储蓄？</p>\n</blockquote>\n<p>题型：<strong>具体做法题</strong>。</p>\n","articleRects":[],"questionRects":[[152,942,532,23]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**With regard to retirement, Brent Weiss thinks that many people are ______.**\n\n> 关于退休，Brent Weiss认为许多人处于什么状态？\n\n题型：**特定人物判断题**。","html":"<h2>30题题干</h2>\n<p><strong>With regard to retirement, Brent Weiss thinks that many people are ______.</strong></p>\n<blockquote><p>关于退休，Brent Weiss认为许多人处于什么状态？</p>\n</blockquote>\n<p>题型：<strong>特定人物判断题</strong>。</p>\n","articleRects":[],"questionRects":[[153,1164,706,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | even if, not just, because |\n| 态度词 / 评价词 | 先抓个大概好坏 | longer, enough, worried |\n| 动作词 | 先看谁做了什么 | work, prepare, reducing |\n| 结果词 | 看最后出了什么事 | retirement, savings, expenses |\n| 重复主题词 | 大概知道老在说什么 | Americans, unretirees, Weiss |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>even if, not just, because</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>longer, enough, worried</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>work, prepare, reducing</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>retirement, savings, expenses</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Americans, unretirees, Weiss</td></tr></tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"More Americans are opting to work well into retirement, a growing trend that threatens to **[xxx]** the old workforce model.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>More Americans are opting to work well into retirement, a growing trend that threatens to <strong>[xxx]</strong> the old workforce model.</p>\n</div></div>","articleRects":[[184,202,746,22],[136,239,474,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":""},{"section":"读文章","raw":"More Americans are opting to work well into retirement, / a growing trend that threatens to **[xxx]** the old workforce model.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>More Americans are opting to work well into retirement, / a growing trend that threatens to <strong>[xxx]</strong> the old workforce model.</p>\n</div></div>","articleRects":[[184,202,746,22],[136,239,474,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":""},{"section":"读文章","raw":"更多美国人 are opting to 工作 well into 退休, / a 增长趋势 that threatens to **[xxx]** the 旧有劳动力 model.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>更多美国人 are opting to 工作 well into 退休, / a 增长趋势 that threatens to <strong>[xxx]</strong> the 旧有劳动力 model.</p>\n</div></div>","articleRects":[[184,202,746,22],[136,239,474,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":2,"coarse":true,"literalReplacements":[{"group":0,"source":"More Americans","zh":"更多美国人"},{"group":0,"source":"work","zh":"工作"},{"group":0,"source":"retirement","zh":"退休"},{"group":1,"sou 十、百分之十；更长寿命、储蓄、两千成年人、十人中六人、减少整体支出、人寿保险、退休账户；退休后工作、收支相抵、Brent Weiss、财务顾问、长期财务目标；结婚、建立家庭、财务决定、情感决定、许多人、没法退休。</p>\n<p>到这里还不能自然地说清楚：为什么退休后还工作，哪些理由不只是钱，怎样增加储蓄，以及人物怎样评价退休准备。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> The survey conducted by Harris Poll indicates that ______.  \n> Harris Poll的调查表明什么？\n\n调查名定位第2段，并连读第1段交代的趋势。分清三分之一是哪类人的比例，超过一半又是哪个群体及什么意愿。\n\n> 原文参考：\n> \n> More Americans are opting to work well into retirement, a growing trend that threatens to **[xxx]** the old workforce model.\n> \n> 开始精读：\n> \n> More Americans are opting to work well into retirement, / a growing trend that threatens to **[xxx]** the old workforce model.\n> \n> 更多美国人选择一直工作到退休年龄以后 / 这种增长趋势可能**[xxx]**旧有劳动力模式。\n\n> 原文参考：\n> \n> One in three Americans who are at least 40 have, or plan to have, a job in retirement to prepare for a longer life, according to a survey conducted by Harris Poll for TD Ameritrade. Even more **[xxx]** is that more than half of “unretirees” —those who plan to work in retirement or went back to work after retiring— said they would be employed in their later years even if they had enough money to settle down, the survey showed.\n> \n> 开始精读：\n> \n> One in three Americans who are at least 40 / have, or plan to have, a job in retirement / to prepare for a longer life, / according to a survey conducted by Harris Poll for TD Ameritrade. / Even more **[xxx]** is that more than half of “unretirees” / —those who plan to work in retirement or went back to work after retiring— / said they would be employed in their later years / even if they had enough money to settle down, / the survey showed.\n> \n> 至少四十岁的美国人中有三分之一 / 已经拥有或计划拥有一份退休后的工作 / 为更长的人生作准备 / 根据Harris Poll为TD Ameritrade进行的一项调查。 / 更**[xxx]**的是超过一半的“退而不休者” / ——计划退休后工作或退休后重返工作的人—— / 说他们晚年仍会工作 / 即使他们有足够的钱安顿下来 / 这项调查显示。\n\n接下来按A—D逐项看。","html":"<h2>26题</h2>\n<blockquote><p>The survey conducted by Harris Poll indicates that ______.<br />\nHarris Poll的调查表明什么？</p>\n</blockquote>\n<p>调查名定位第2段，并连读第1段交代的趋势。分清三分之一是哪类人的比例，超过一半又是哪个群体及什么意愿。</p>\n<blockquote><p>原文参考：</p>\n<p>More Americans are opting to work well into retirement, a growing trend that threatens to <strong>[xxx]</strong> the old workforce model.</p>\n<p>开始精读：</p>\n<p>More Americans are opting to work well into retirement, / a growing trend that threatens to <strong>[xxx]</strong> the old workforce model.</p>\n<p>更多美国人选择一直工作到退休年龄以后 / 这种增长趋势可能<strong>[xxx]</strong>旧有劳动力模式。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>One in three Americans who are at least 40 have, or plan to have, a job in retirement to prepare for a longer life, according to a survey conducted by Harris Poll for TD Ameritrade. Even more <strong>[xxx]</strong> is that more than half of “unretirees” —those who plan to work in retirement or went back to work after retiring— said they would be employed in their later years even if they had enough money to settle down, the survey showed.</p>\n<p>开始精读：</p>\n<p>One in three Americans who are at least 40 / have, or plan to have, a job in retirement / to prepare for a longer life, / according to a survey conducted by Harris Poll for TD Ameritrade. / Even more <strong>[xxx]</strong> is that more than half of “unretirees” / —those who plan to work in retirement or went back to work after retiring— / said they would be employed in their later years / even if they had enough money to settle down, / the survey showed.</p>\n<p>至少四十岁的美国人中有三分之一 / 已经拥有或计划拥有一份退休后的工作 / 为更长的人生作准备 / 根据Harris Poll为TD Ameritrade进行的一项调查。 / 更<strong>[xxx]</strong>的是超过一半的“退而不休者” / ——计划退休后工作或退休后重返工作的人—— / 说他们晚年仍会工作 / 即使他们有足够的钱安顿下来 / 这项调查显示。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,202,746,22],[136,239,474,22],[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22]],"questionRects":[[152,278,537,22],[197,315,530,22],[197,352,516,22],[197,389,496,22],[197,426,522,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"26","paragraphPids":[0,1]}},{"section":"26题","raw":"### A. over half of the retirees are **[xxx]** fit for work\n\n> 超过一半退休者在**[xxx]**方面适合工作\n\n把A接回题干，它说的是：调查认为超过一半退休人员在某个**[xxx]**方面适合工作。\n\nA说一半退休者适合工作，回第2段看more than half所统计的群体与回答。\n\n> more than half of “unretirees”\n\n> said they would be employed in their later years even if they had enough money to settle down\n\n超过一半说即使钱够也会继续就业的人，属于unretirees，即准备退休后工作或已经回去工作的人。不是全部退休者。\n\n他们回答的是愿不愿继续工作，不是接受了适合工作程度的测评。A中未知修饰词不影响这两处区别。\n\n**愿意工作的人超过一半，等于全部退休者中超过一半被证实适合工作吗？**\n\n不等于。A换了统计人群与统计内容。\n\n**第一轮判断：A排除。**","html":"<h3>A. over half of the retirees are <strong>[xxx]</strong> fit for work</h3>\n<blockquote><p>超过一半退休者在<strong>[xxx]</strong>方面适合工作</p>\n</blockquote>\n<p>把A接回题干，它说的是：调查认为超过一半退休人员在某个<strong>[xxx]</strong>方面适合工作。</p>\n<p>A说一半退休者适合工作，回第2段看more than half所统计的群体与回答。</p>\n<blockquote><p>more than half of “unretirees”</p>\n</blockquote>\n<blockquote><p>said they would be employed in their later years even if they had enough money to settle down</p>\n</blockquote>\n<p>超过一半说即使钱够也会继续就业的人，属于unretirees，即准备退休后工作或已经回去工作的人。不是全部退休者。</p>\n<p>他们回答的是愿不愿继续工作，不是接受了适合工作程度的测评。A中未知修饰词不影响这两处区别。</p>\n<p><strong>愿意工作的人超过一半，等于全部退休者中超过一半被证实适合工作吗？</strong></p>\n<p>不等于。A换了统计人群与统计内容。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22]],"questionRects":[[197,315,530,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"26","option":"A","paragraphPids":[1]}},{"section":"26题","raw":"### B. the old workforce is as active as the younger one\n\n> 年长劳动力与年轻劳动力同样活跃\n\n把B接回题干，它说的是：调查显示年长和年轻劳动群体具有相同的活跃程度。\n\nB说老少同样活跃，回第2段看有没有年轻劳动力的比较数据。\n\n> One in three Americans who are at least 40 have, or plan to have, a job in retirement\n\n调查说40岁以上者中，有三分之一已经或计划退休后工作。后面又讨论退而不休者是否为钱工作。\n\n两组都没有给年轻劳动力同一指标，无法比较他们与年长者是否一样活跃。\n\n**只有年长群体的工作意愿数据，能得出与年轻人相同吗？**\n\n不能。B缺少比较的另一边。\n\n**第一轮判断：B排除。**","html":"<h3>B. the old workforce is as active as the younger one</h3>\n<blockquote><p>年长劳动力与年轻劳动力同样活跃</p>\n</blockquote>\n<p>把B接回题干，它说的是：调查显示年长和年轻劳动群体具有相同的活跃程度。</p>\n<p>B说老少同样活跃，回第2段看有没有年轻劳动力的比较数据。</p>\n<blockquote><p>One in three Americans who are at least 40 have, or plan to have, a job in retirement</p>\n</blockquote>\n<p>调查说40岁以上者中，有三分之一已经或计划退休后工作。后面又讨论退而不休者是否为钱工作。</p>\n<p>两组都没有给年轻劳动力同一指标，无法比较他们与年长者是否一样活跃。</p>\n<p><strong>只有年长群体的工作意愿数据，能得出与年轻人相同吗？</strong></p>\n<p>不能。B缺少比较的另一边。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22]],"questionRects":[[197,352,516,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"26","option":"B","paragraphPids":[1]}},{"section":"26题","raw":"### C. one in three Americans enjoy earlier retirement\n\n> 三分之一美国人享受更早退休\n\n把C接回题干，它说的是：调查显示三分之一美国人会享受提前退休。\n\nC说更早退休，回第2段看one in three后面的have a job in retirement。\n\n> have, or plan to have, a job in retirement to prepare for a longer life\n\n三分之一这个比例对应退休后有工作或计划有工作，还限定40岁以上。它不是提前停止工作的人数。\n\nC沿用了数字，却把继续工作换成了更早退休，还扩大了统计对象。\n\n**同一个三分之一，说的是早退休，还是退休后仍就业？**\n\n说的是后者。C读反了数字所对应的行为。\n\n**第一轮判断：C排除。**","html":"<h3>C. one in three Americans enjoy earlier retirement</h3>\n<blockquote><p>三分之一美国人享受更早退休</p>\n</blockquote>\n<p>把C接回题干，它说的是：调查显示三分之一美国人会享受提前退休。</p>\n<p>C说更早退休，回第2段看one in three后面的have a job in retirement。</p>\n<blockquote><p>have, or plan to have, a job in retirement to prepare for a longer life</p>\n</blockquote>\n<p>三分之一这个比例对应退休后有工作或计划有工作，还限定40岁以上。它不是提前停止工作的人数。</p>\n<p>C沿用了数字，却把继续工作换成了更早退休，还扩大了统计对象。</p>\n<p><strong>同一个三分之一，说的是早退休，还是退休后仍就业？</strong></p>\n<p>说的是后者。C读反了数字所对应的行为。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22]],"questionRects":[[197,389,496,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"26","option":"C","paragraphPids":[1]}},{"section":"26题","raw":"### D. more Americans are willing to work in retirement\n\n> 更多美国人愿意在退休后工作\n\n把D接回题干，它说的是：越来越多美国人愿意退休后继续就业。\n\nD说更多人愿继续工作，回首段趋势与第2段调查。\n\n> More Americans are opting to work well into retirement\n\n> they would be employed in their later years even if they had enough money to settle down\n\n首段直接说更多美国人选择工作到退休之后。调查再说明一些人已经这样做或有此计划，而且许多退而不休者即使钱够也愿继续工作。\n\nD把这些信息概括为继续就业意愿增加，既有趋势陈述，也有调查解释。\n\n**已有选择与计划、且钱够也愿工作，是否支持更多人愿意退休后工作？**\n\n支持。D与文章的调查用途相合。\n\n**第一轮判断：D保留。**","html":"<h3>D. more Americans are willing to work in retirement</h3>\n<blockquote><p>更多美国人愿意在退休后工作</p>\n</blockquote>\n<p>把D接回题干，它说的是：越来越多美国人愿意退休后继续就业。</p>\n<p>D说更多人愿继续工作，回首段趋势与第2段调查。</p>\n<blockquote><p>More Americans are opting to work well into retirement</p>\n</blockquote>\n<blockquote><p>they would be employed in their later years even if they had enough money to settle down</p>\n</blockquote>\n<p>首段直接说更多美国人选择工作到退休之后。调查再说明一些人已经这样做或有此计划，而且许多退而不休者即使钱够也愿继续工作。</p>\n<p>D把这些信息概括为继续就业意愿增加，既有趋势陈述，也有调查解释。</p>\n<p><strong>已有选择与计划、且钱够也愿工作，是否支持更多人愿意退休后工作？</strong></p>\n<p>支持。D与文章的调查用途相合。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[184,202,746,22],[136,239,474,22],[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22]],"questionRects":[[197,426,522,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"26","option":"D","paragraphPids":[0,1]}},{"section":"26题","raw":"### 26题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","html":"<h3>26题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n","articleRects":[],"questionRects":[[152,278,537,22],[197,315,530,22],[197,352,516,22],[197,389,496,22],[197,426,522,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> It can be inferred from Paragraph 3 that Americans tend to think that ______.  \n> 从第3段可推知，美国人倾向于怎样看待退休？\n\n题干直接给第3段。读清Other reasons中的精神健康和防止无聊，是人们继续工作的理由，再反推他们对不工作的顾虑。\n\n> 原文参考：\n> \n> Financial needs aren’t the only **[xxx]** for the “unretirement” trend. Other reasons, according to the study, include personal **[xxx]** such as staying mentally fit, preventing boredom or avoiding **[xxx]**.\n> \n> 开始精读：\n> \n> Financial needs aren’t the only **[xxx]** for the “unretirement” trend. / Other reasons, according to the study, include personal **[xxx]** / such as staying mentally fit, preventing boredom or avoiding **[xxx]**.\n> \n> 经济需要不是“退而不休”趋势的唯一**[xxx]**。 / 根据研究其他理由包括个人**[xxx]** / 例如保持精神健康、防止无聊或避免**[xxx]**。\n\n接下来按A—D逐项看。","html":"<h2>27题</h2>\n<blockquote><p>It can be inferred from Paragraph 3 that Americans tend to think that ______.<br />\n从第3段可推知，美国人倾向于怎样看待退休？</p>\n</blockquote>\n<p>题干直接给第3段。读清Other reasons中的精神健康和防止无聊，是人们继续工作的理由，再反推他们对不工作的顾虑。</p>\n<blockquote><p>原文参考：</p>\n<p>Financial needs aren’t the only <strong>[xxx]</strong> for the “unretirement” trend. Other reasons, according to the study, include personal <strong>[xxx]</strong> such as staying mentally fit, preventing boredom or avoiding <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>Financial needs aren’t the only <strong>[xxx]</strong> for the “unretirement” trend. / Other reasons, according to the study, include personal <strong>[xxx]</strong> / such as staying mentally fit, preventing boredom or avoiding <strong>[xxx]</strong>.</p>\n<p>经济需要不是“退而不休”趋势的唯一<strong>[xxx]</strong>。 / 根据研究其他理由包括个人<strong>[xxx]</strong> / 例如保持精神健康、防止无聊或避免<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,497,746,23],[136,535,793,22],[137,572,555,22]],"questionRects":[[152,500,708,21],[233,537,393,22],[196,574,432,17],[196,611,447,17],[196,647,456,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"27","paragraphPids":[2]}},{"section":"27题","raw":"### A. retirement may cause problems for them\n\n> 退休可能给他们带来问题\n\n把A接回题干，它说的是：一些美国人认为退休可能带来某些困难。\n\nA说退休可能带来问题，回第3段看staying mentally fit与preventing boredom。\n\n> Other reasons, according to the study, include personal **[xxx]** such as staying mentally fit, preventing boredom or avoiding **[xxx]**\n\n有人继续工作，是为了保持精神状态、防止无聊。这说明他们担心停止工作后会失去相应帮助，出现无聊等困扰。\n\nA只说may cause problems，没有说退休必然有害，能容纳这些具体顾虑。\n\n**选择继续工作来防无聊，是否表明他们考虑到退休可能产生的问题？**\n\n是。A可以保留。\n\n**第一轮判断：A保留。**","html":"<h3>A. retirement may cause problems for them</h3>\n<blockquote><p>退休可能给他们带来问题</p>\n</blockquote>\n<p>把A接回题干，它说的是：一些美国人认为退休可能带来某些困难。</p>\n<p>A说退休可能带来问题，回第3段看staying mentally fit与preventing boredom。</p>\n<blockquote><p>Other reasons, according to the study, include personal <strong>[xxx]</strong> such as staying mentally fit, preventing boredom or avoiding <strong>[xxx]</strong></p>\n</blockquote>\n<p>有人继续工作，是为了保持精神状态、防止无聊。这说明他们担心停止工作后会失去相应帮助，出现无聊等困扰。</p>\n<p>A只说may cause problems，没有说退休必然有害，能容纳这些具体顾虑。</p>\n<p><strong>选择继续工作来防无聊，是否表明他们考虑到退休可能产生的问题？</strong></p>\n<p>是。A可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[184,497,746,23],[136,535,793,22],[137,572,555,22]],"questionRects":[[233,537,393,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"27","option":"A","paragraphPids":[2]}},{"section":"27题","raw":"### B. boredom can be **[xxx]** after retirement\n\n> 退休之后无聊可以被**[xxx]**\n\n把B接回题干，它说的是：美国人认为退休后无聊状态可能发生某种**[xxx]**。\n\nB有boredom，回第3段先确定已知动作preventing。\n\n> preventing boredom\n\n原文把防止无聊列为继续工作的理由。B的关键动作词未读懂，只知道它也谈退休与无聊。\n\n两个名词相同还不足以判断关系是否相同，当前也不能把未知词擅自补成减轻或加重。先和A留下比较。\n\n**只看到boredom相同，能立刻确认B与防止无聊的关系一致吗？**\n\n还不能。但也不能凭生词直接判错，B暂留回查。\n\n**第一轮判断：B保留。**","html":"<h3>B. boredom can be <strong>[xxx]</strong> after retirement</h3>\n<blockquote><p>退休之后无聊可以被<strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：美国人认为退休后无聊状态可能发生某种<strong>[xxx]</strong>。</p>\n<p>B有boredom，回第3段先确定已知动作preventing。</p>\n<blockquote><p>preventing boredom</p>\n</blockquote>\n<p>原文把防止无聊列为继续工作的理由。B的关键动作词未读懂，只知道它也谈退休与无聊。</p>\n<p>两个名词相同还不足以判断关系是否相同，当前也不能把未知词擅自补成减轻或加重。先和A留下比较。</p>\n<p><strong>只看到boredom相同，能立刻确认B与防止无聊的关系一致吗？</strong></p>\n<p>还不能。但也不能凭生词直接判错，B暂留回查。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,497,746,23],[136,535,793,22],[137,572,555,22]],"questionRects":[[196,574,432,17]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"27","option":"B","paragraphPids":[2]}},{"section":"27题","raw":"### C. the mental health of retirees is overlooked\n\n> 退休者的心理健康被忽视\n\n把C接回题干，它说的是：美国人认为退休群体的心理健康没有得到重视。\n\nC说心理健康被忽略，回第3段看保持精神状态被列为什么。\n\n> staying mentally fit, preventing boredom\n\n保持精神状态正是人们继续工作的一个理由，说明这些人关注自己的状态。段落没有评价政府、社会或他人是否忽略退休者。\n\n某件事重要，需要主动照顾，不等于它已遭忽视。C增添了别人没有关注的判断。\n\n**人们通过工作维护精神状态，能推出退休者心理健康被忽视吗？**\n\n不能。C没有相应的忽视主体和证据。\n\n**第一轮判断：C排除。**","html":"<h3>C. the mental health of retirees is overlooked</h3>\n<blockquote><p>退休者的心理健康被忽视</p>\n</blockquote>\n<p>把C接回题干，它说的是：美国人认为退休群体的心理健康没有得到重视。</p>\n<p>C说心理健康被忽略，回第3段看保持精神状态被列为什么。</p>\n<blockquote><p>staying mentally fit, preventing boredom</p>\n</blockquote>\n<p>保持精神状态正是人们继续工作的一个理由，说明这些人关注自己的状态。段落没有评价政府、社会或他人是否忽略退休者。</p>\n<p>某件事重要，需要主动照顾，不等于它已遭忽视。C增添了别人没有关注的判断。</p>\n<p><strong>人们通过工作维护精神状态，能推出退休者心理健康被忽视吗？</strong></p>\n<p>不能。C没有相应的忽视主体和证据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,497,746,23],[136,535,793,22],[137,572,555,22]],"questionRects":[[196,611,447,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"27","option":"C","paragraphPids":[2]}},{"section":"27题","raw":"### D. “unretirement” contributes to the economy\n\n> 退而不休有助于经济\n\n把D接回题干，它说的是：美国人认为退休后继续工作能促进整体经济。\n\nD说促进经济，回第3段看理由落在个人还是国家。\n\n> Financial needs aren’t the only **[xxx]** for the “unretirement” trend.\n\n> Other reasons, according to the study, include personal **[xxx]**\n\n精神状态与无聊都属于个人生活感受。作者用它们解释钱之外的继续工作动机。\n\n劳动力增加可能与经济有关，但第3段没有把促进经济写成这些人的认识或目的。\n\n**个人为了保持精神状态而工作，等于这一段说他们在考虑整体经济吗？**\n\n不等于。D换了理由的范围。\n\n**第一轮判断：D排除。**","html":"<h3>D. “unretirement” contributes to the economy</h3>\n<blockquote><p>退而不休有助于经济</p>\n</blockquote>\n<p>把D接回题干，它说的是：美国人认为退休后继续工作能促进整体经济。</p>\n<p>D说促进经济，回第3段看理由落在个人还是国家。</p>\n<blockquote><p>Financial needs aren’t the only <strong>[xxx]</strong> for the “unretirement” trend.</p>\n</blockquote>\n<blockquote><p>Other reasons, according to the study, include personal <strong>[xxx]</strong></p>\n</blockquote>\n<p>精神状态与无聊都属于个人生活感受。作者用它们解释钱之外的继续工作动机。</p>\n<p>劳动力增加可能与经济有关，但第3段没有把促进经济写成这些人的认识或目的。</p>\n<p><strong>个人为了保持精神状态而工作，等于这一段说他们在考虑整体经济吗？</strong></p>\n<p>不等于。D换了理由的范围。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,497,746,23],[136,535,793,22],[137,572,555,22]],"questionRects":[[196,647,456,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"27","option":"D","paragraphPids":[2]}},{"section":"27题","raw":"### 27题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n暂留A、B，等把全文连起来后再回来比较。","html":"<h3>27题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂留A、B，等把全文连起来后再回来比较。</p>\n","articleRects":[],"question 仍在劳动力队伍里的比例 / 在过去三十年翻了一番。 / 2019年二月六十五岁及以上人群中约百分之二十在工作 / 高于1985年一月历史最低的百分之十 / 据资产管理公司United Income所述。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[198,609,732,22],[137,645,792,23],[137,683,636,22],[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22]],"questionRects":[[152,721,495,22],[197,758,181,22],[197,795,210,22],[197,832,249,22],[197,869,208,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"28","paragraphPids":[3,4]}},{"section":"28题","raw":"### A. labor shortages\n\n> 劳动力短缺\n\n把A接回题干，它说的是：退休模式改变部分是因为缺少劳动力。\n\nA说缺劳动力，回第5段看One reason后面直接写了什么。\n\n> One reason for the change in retirement patterns: Americans are living longer.\n\n作者点明Americans are living longer，随后介绍老年劳动力占比上升。这些是在解释寿命和工作年限的变化。\n\n没有企业招不到人的数据，不能把老年就业者增加直接当成劳动力短缺的反应。\n\n**更多老年人工作，就一定是因为市场缺人吗？**\n\n不能这样推。A不是本段明确给出的原因。\n\n**第一轮判断：A排除。**","html":"<h3>A. labor shortages</h3>\n<blockquote><p>劳动力短缺</p>\n</blockquote>\n<p>把A接回题干，它说的是：退休模式改变部分是因为缺少劳动力。</p>\n<p>A说缺劳动力，回第5段看One reason后面直接写了什么。</p>\n<blockquote><p>One reason for the change in retirement patterns: Americans are living longer.</p>\n</blockquote>\n<p>作者点明Americans are living longer，随后介绍老年劳动力占比上升。这些是在解释寿命和工作年限的变化。</p>\n<p>没有企业招不到人的数据，不能把老年就业者增加直接当成劳动力短缺的反应。</p>\n<p><strong>更多老年人工作，就一定是因为市场缺人吗？</strong></p>\n<p>不能这样推。A不是本段明确给出的原因。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22]],"questionRects":[[197,758,181,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"28","option":"A","paragraphPids":[4]}},{"section":"28题","raw":"### B. population growth\n\n> 人口增长\n\n把B接回题干，它说的是：退休模式改变部分源自人口总量增加。\n\nB说总人口增加，回第5段区分living longer与人口规模。\n\n> Americans are living longer.\n\n> About 20% of people 65 and older were in the workforce in February 2019\n\n人活得更久，指个体寿命延长；人口总量增长，指人数变多。两者可能有关，却不是同一个指标。\n\n后面的20%是老年人口中参加劳动者的比例，也不是美国总人口增长率。\n\n**寿命延长和老年劳动参与率上升，能直接改成总人口增长吗？**\n\n不能。B换了被描述的变化。\n\n**第一轮判断：B排除。**","html":"<h3>B. population growth</h3>\n<blockquote><p>人口增长</p>\n</blockquote>\n<p>把B接回题干，它说的是：退休模式改变部分源自人口总量增加。</p>\n<p>B说总人口增加，回第5段区分living longer与人口规模。</p>\n<blockquote><p>Americans are living longer.</p>\n</blockquote>\n<blockquote><p>About 20% of people 65 and older were in the workforce in February 2019</p>\n</blockquote>\n<p>人活得更久，指个体寿命延长；人口总量增长，指人数变多。两者可能有关，却不是同一个指标。</p>\n<p>后面的20%是老年人口中参加劳动者的比例，也不是美国总人口增长率。</p>\n<p><strong>寿命延长和老年劳动参与率上升，能直接改成总人口增长吗？</strong></p>\n<p>不能。B换了被描述的变化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22]],"questionRects":[[197,795,210,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"28","option":"B","paragraphPids":[4]}},{"section":"28题","raw":"### C. longer life **[xxx]**\n\n> 更长的生命**[xxx]**\n\n把C接回题干，它说的是：退休模式改变部分由于与生命长短有关的某种**[xxx]**延长。\n\nC说更长的生命某项，回第5段找Americans are living longer。\n\n> One reason for the change in retirement patterns: Americans are living longer.\n\n原因句直接写美国人活得更久。第6段开头又用longer life spans接着谈储蓄准备，说明这种延长会影响退休安排。\n\nC尾词暂时未知，但longer life已与这条明确原因对应；不必从答案反补词义。\n\n**C已知的生命更长，是否就是原因句明写的变化？**\n\n是。C可以保留。\n\n**第一轮判断：C保留。**","html":"<h3>C. longer life <strong>[xxx]</strong></h3>\n<blockquote><p>更长的生命<strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：退休模式改变部分由于与生命长短有关的某种<strong>[xxx]</strong>延长。</p>\n<p>C说更长的生命某项，回第5段找Americans are living longer。</p>\n<blockquote><p>One reason for the change in retirement patterns: Americans are living longer.</p>\n</blockquote>\n<p>原因句直接写美国人活得更久。第6段开头又用longer life spans接着谈储蓄准备，说明这种延长会影响退休安排。</p>\n<p>C尾词暂时未知，但longer life已与这条明确原因对应；不必从答案反补词义。</p>\n<p><strong>C已知的生命更长，是否就是原因句明写的变化？</strong></p>\n<p>是。C可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22]],"questionRects":[[197,832,249,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"28","option":"C","paragraphPids":[4]}},{"section":"28题","raw":"### D. rising living costs\n\n> 生活成本上涨\n\n把D接回题干，它说的是：退休模式改变部分由于日常生活开支价格上涨。\n\nD说生活成本涨，回第5段及前文找价格变化。\n\n> It’s not just about finances.\n\n> Americans are living longer.\n\n文章提到经济需要和寿命延长，但没有比较日常商品、房租或其他生活费用的价格涨幅。活得更久可能要准备更多年的钱。\n\n更多年需要开销，与每年的生活价格上涨不一样。D不能用一般经济担忧代替具体涨价证据。\n\n**为更长寿命备钱，就证明单位生活成本已经上涨吗？**\n\n不能。D没有这个价格变化依据。\n\n**第一轮判断：D排除。**","html":"<h3>D. rising living costs</h3>\n<blockquote><p>生活成本上涨</p>\n</blockquote>\n<p>把D接回题干，它说的是：退休模式改变部分由于日常生活开支价格上涨。</p>\n<p>D说生活成本涨，回第5段及前文找价格变化。</p>\n<blockquote><p>It’s not just about finances.</p>\n</blockquote>\n<blockquote><p>Americans are living longer.</p>\n</blockquote>\n<p>文章提到经济需要和寿命延长，但没有比较日常商品、房租或其他生活费用的价格涨幅。活得更久可能要准备更多年的钱。</p>\n<p>更多年需要开销，与每年的生活价格上涨不一样。D不能用一般经济担忧代替具体涨价证据。</p>\n<p><strong>为更长寿命备钱，就证明单位生活成本已经上涨吗？</strong></p>\n<p>不能。D没有这个价格变化依据。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[198,609,732,22],[137,645,792,23],[137,683,636,22],[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22]],"questionRects":[[197,869,208,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"28","option":"D","paragraphPids":[3,4]}},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。","html":"<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n","articleRects":[],"questionRects":[[152,721,495,22],[197,758,181,22],[197,795,210,22],[197,832,249,22],[197,869,208,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> Many “unretirees” are increasing their savings by ______.  \n> 许多退而不休者通过什么方式增加储蓄？\n\nsavings定位第6段，完整读调查看了哪些人以及Among the most popular ways后列出的动作。题干问办法，不是再问为何工作。\n\n> 原文参考：\n> \n> Because of longer life spans, Americans are also **[xxx]** their savings to preserve their nest eggs, the TD Ame ults between 40 to 79. / Six in 10 “unretirees” are increasing their savings / in <strong>[xxx]</strong> of a longer life. / Among the most popular ways they are doing this, the company said, / is by reducing their overall expenses, / <strong>[xxx]</strong> life insurance / or <strong>[xxx]</strong> their <strong>[xxx]</strong> to retirement accounts.</p>\n<p>因为寿命更长 / 美国人也在<strong>[xxx]</strong>储蓄以保全养老积蓄 / TD Ameritrade的研究显示 / 该研究调查了两千名四十到七十九岁的成年人。 / 每十名退而不休者中有六人在增加储蓄 / 出于对更长人生的<strong>[xxx]</strong>。 / 公司说他们采用的最常见方式中 / 包括减少整体支出 / <strong>[xxx]</strong>人寿保险 / 或<strong>[xxx]</strong>他们对退休账户的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22]],"questionRects":[[152,942,532,23],[197,980,272,21],[197,1017,216,21],[197,1054,255,21],[197,1091,164,21]],"scrollTarget":"article","meta":{"kind":"question","qid":"29","paragraphPids":[5]}},{"section":"29题","raw":"### A. investing more in stocks\n\n> 增加股票投资\n\n把A接回题干，它说的是：许多人通过投入更多股票资金来增加储蓄。\n\nA说多买股票，回第6段看被列举的储蓄办法。\n\n> reducing their overall expenses, **[xxx]** life insurance or **[xxx]** their **[xxx]** to retirement accounts\n\n明确列出的是减少总体支出，以及保险、退休账户方面的安排。没有把股票交易单列为这批人采取的做法。\n\n退休账户可能涉及投资，但不能把账户安排直接简化成增持股票。\n\n**提到退休账户，就等于报告人们增加股票投资吗？**\n\n不等于。A补了具体投资品种。\n\n**第一轮判断：A排除。**","html":"<h3>A. investing more in stocks</h3>\n<blockquote><p>增加股票投资</p>\n</blockquote>\n<p>把A接回题干，它说的是：许多人通过投入更多股票资金来增加储蓄。</p>\n<p>A说多买股票，回第6段看被列举的储蓄办法。</p>\n<blockquote><p>reducing their overall expenses, <strong>[xxx]</strong> life insurance or <strong>[xxx]</strong> their <strong>[xxx]</strong> to retirement accounts</p>\n</blockquote>\n<p>明确列出的是减少总体支出，以及保险、退休账户方面的安排。没有把股票交易单列为这批人采取的做法。</p>\n<p>退休账户可能涉及投资，但不能把账户安排直接简化成增持股票。</p>\n<p><strong>提到退休账户，就等于报告人们增加股票投资吗？</strong></p>\n<p>不等于。A补了具体投资品种。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22]],"questionRects":[[197,980,272,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"29","option":"A","paragraphPids":[5]}},{"section":"29题","raw":"### B. taking up **[xxx]** jobs\n\n> 从事**[xxx]**工作\n\n把B接回题干，它说的是：这些人通过接某类**[xxx]**工作来增加储蓄。\n\nB说某类工作，回第6段看Among the most popular ways后面的清单。\n\n> Among the most popular ways they are doing this\n\n> reducing their overall expenses\n\n这段在已经退而不休的人中，继续问他们怎样增加储蓄，随后列的是支出和财务安排。不是再将继续工作这一总体现象分类。\n\nB修饰工作的词未知，也不能把全文有工作这个话题当作清单中某项的证据。\n\n**本段所列增加储蓄的方法，是否明确包括B中某类工作？**\n\n没有可确认的对应。D与减少支出直接相合。\n\n**第一轮判断：B排除。**","html":"<h3>B. taking up <strong>[xxx]</strong> jobs</h3>\n<blockquote><p>从事<strong>[xxx]</strong>工作</p>\n</blockquote>\n<p>把B接回题干，它说的是：这些人通过接某类<strong>[xxx]</strong>工作来增加储蓄。</p>\n<p>B说某类工作，回第6段看Among the most popular ways后面的清单。</p>\n<blockquote><p>Among the most popular ways they are doing this</p>\n</blockquote>\n<blockquote><p>reducing their overall expenses</p>\n</blockquote>\n<p>这段在已经退而不休的人中，继续问他们怎样增加储蓄，随后列的是支出和财务安排。不是再将继续工作这一总体现象分类。</p>\n<p>B修饰工作的词未知，也不能把全文有工作这个话题当作清单中某项的证据。</p>\n<p><strong>本段所列增加储蓄的方法，是否明确包括B中某类工作？</strong></p>\n<p>没有可确认的对应。D与减少支出直接相合。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22]],"questionRects":[[197,1017,216,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"29","option":"B","paragraphPids":[5]}},{"section":"29题","raw":"### C. getting well-paid work\n\n> 取得高薪工作\n\n把C接回题干，它说的是：许多人靠获得薪酬更高的工作来增加储蓄。\n\nC说得到高薪工作，回第6段看是否比较工资。\n\n> Six in 10 “unretirees” are increasing their savings\n\n> reducing their overall expenses\n\n文中报告部分退而不休者增加储蓄，并举少花钱等办法。没有说他们换了薪酬更高的岗位。\n\n收入更多可以增加储蓄，但同样收入下减少开支也可以做到。不能由储蓄增长反推工资增长。\n\n**存下更多钱，就一定是取得高薪工作了吗？**\n\n不是。C没有工资或岗位变化的依据。\n\n**第一轮判断：C排除。**","html":"<h3>C. getting well-paid work</h3>\n<blockquote><p>取得高薪工作</p>\n</blockquote>\n<p>把C接回题干，它说的是：许多人靠获得薪酬更高的工作来增加储蓄。</p>\n<p>C说得到高薪工作，回第6段看是否比较工资。</p>\n<blockquote><p>Six in 10 “unretirees” are increasing their savings</p>\n</blockquote>\n<blockquote><p>reducing their overall expenses</p>\n</blockquote>\n<p>文中报告部分退而不休者增加储蓄，并举少花钱等办法。没有说他们换了薪酬更高的岗位。</p>\n<p>收入更多可以增加储蓄，但同样收入下减少开支也可以做到。不能由储蓄增长反推工资增长。</p>\n<p><strong>存下更多钱，就一定是取得高薪工作了吗？</strong></p>\n<p>不是。C没有工资或岗位变化的依据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22]],"questionRects":[[197,1054,255,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"29","option":"C","paragraphPids":[5]}},{"section":"29题","raw":"### D. spending less\n\n> 减少花费\n\n把D接回题干，它说的是：这些人通过少花钱来增加储蓄。\n\nD说少花钱，回第6段找reducing their overall expenses。\n\n> reducing their overall expenses\n\noverall expenses是总体支出，reducing就是减少。支出降下来，可以把更多钱留在储蓄中。\n\nD保留这项已明确写出的办法，不需要猜后面保险与账户安排的未知词。\n\n**减少总体支出，与spending less是不是同一做法？**\n\n是。D直接对应。\n\n**第一轮判断：D保留。**","html":"<h3>D. spending less</h3>\n<blockquote><p>减少花费</p>\n</blockquote>\n<p>把D接回题干，它说的是：这些人通过少花钱来增加储蓄。</p>\n<p>D说少花钱，回第6段找reducing their overall expenses。</p>\n<blockquote><p>reducing their overall expenses</p>\n</blockquote>\n<p>overall expenses是总体支出，reducing就是减少。支出降下来，可以把更多钱留在储蓄中。</p>\n<p>D保留这项已明确写出的办法，不需要猜后面保险与账户安排的未知词。</p>\n<p><strong>减少总体支出，与spending less是不是同一做法？</strong></p>\n<p>是。D直接对应。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22]],"questionRects":[[197,1091,164,21]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"29","option":"D","paragraphPids":[5]}},{"section":"29题","raw":"### 29题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","html":"<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n","articleRects":[],"questionRects":[[152,942,532,23],[197,980,272,21],[197,1017,216,21],[197,1054,255,21],[197,1091,164,21]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n> With regard to retirement, Brent Weiss thinks that many people are ______.  \n> 关于退休，Brent Weiss认为许多人处于什么状态？\n\n人名定位末两段。把担心晚年收支、建议设长期目标，以及末段关于财务和情感决定的说明完整连读，分清准备继续工作与准备好退休。\n\n> 原文参考：\n> \n> Unfortunately, many people who are opting to work in retirement are preparing to do so because they are worried about making ends meet in their later years, said Brent Weiss, a co-founder at Baltimore-based financial-planning firm Facet Wealth. He suggested that **[xxx]** should speak with a financial advisor to set long-term financial goals.\n> \n> 开始精读：\n> \n> Unfortunately, many people who are opting to work in retirement / are preparing to do so because they are worried about making ends meet in their later years, / said Brent Weiss, a co-founder at Baltimore-based financial-planning firm Facet Wealth. / He suggested that **[xxx]** should speak with a financial advisor / to set long-term financial goals.\n> \n> 不幸的是许多选择退休后工作的人 / 正为这样做准备因为他们担忧晚年能否收支相抵 / 位于巴尔的摩的财务规划公司Facet Wealth联合创办人Brent Weiss说。 / 他建议**[xxx]**应与财务顾问交谈 / 以制定长期财务目标。\n\n> 原文参考：\n> \n> “The most **[xxx]** moments in life are getting married, starting a family and **[xxx]** retiring,” Weiss said. “It’s not just a financial decision, but an emotional one. Many people believe they can’t retire.”\n> \n> 开始精读：\n> \n> “The most **[xxx]** moments in life are getting married, starting a family and **[xxx]** retiring,” / Weiss said. / “It’s not just a financial decision, / but an emotional one. / Many people believe they can’t retire.”\n> \n> “人生中最**[xxx]**的时刻包括结婚、建立家庭以及**[xxx]**退休” / Weiss说。 / “这不只是财务决定 / 也是情感决定。 / 许多人认为自己没法退休。”\n\n接下来按A—D逐项看。","html":"<h2>30题</h2>\n<blockquote><p>With regard to retirement, Brent Weiss thinks that many people are ______.<br />\n关于退休，Brent Weiss认为许多人处于什么状态？</p>\n</blockquote>\n<p>人名定位末两段。把担心晚年收支、建议设长期目标，以及末段关于财务和情感决定的说明完整连读，分清准备继续工作与准备好退休。</p>\n<blockquote><p>原文参考：</p>\n<p>Unfortunately, many people who are opting to work in retirement are preparing to do so because they are worried about making ends meet in their later years, said Brent Weiss, a co-founder at Baltimore-based financial-planning firm Facet Wealth. He suggested that <strong>[xxx]</strong> should speak with a financial advisor to set long-term financial goals.</p>\n<p>开始精读：</p>\n<p>Unfortunately, many people who are opting to work in retirement / are preparing to do so because they are worried about making ends meet in their later years, / said Brent Weiss, a co-founder at Baltimore-based financial-planning firm Facet Wealth. / He suggested that <strong>[xxx]</strong> should speak with a financial advisor / to set long-term financial goals.</p>\n<p>不幸的是许多选择退休后工作的人 / 正为这样做准备因为他们担忧晚年能否收支相抵 / 位于巴尔的摩的财务规划公司Facet Wealth联合创办人Brent Weiss说。 / 他建议<strong>[xxx]</strong>应与财务顾问交谈 / 以制定长期财务目标。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>“The most <strong>[xxx]</strong> moments in life are getting married, starting a family and <strong>[xxx]</strong> retiring,” Weiss said. “It’s not just a financial decision, but an emotional one. Many people believe they can’t retire.”</p>\n<p>开始精读：</p>\n<p>“The most <strong>[xxx]</strong> moments in life are getting married, starting a family and <strong>[xxx]</strong> retiring,” / Weiss said. / “It’s not just a financial decision, / but an emotional one. / Many people believe they can’t retire.”</p>\n<p>“人生中最<strong>[xxx]</strong>的时刻包括结婚、建立家庭以及<strong>[xxx]</strong>退休” / Weiss说。 / “这不只是财务决定 / 也是情感决定。 / 许多人认为自己没法退休。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,1312,308,22],[198,1365,731,22],[137,1402,792,23],[137,1440,526,22]],"questionRects":[[153,1164,706,22],[196,1201,143,22],[197,1238,113,17],[197,1275,155,22],[197,1312,146,17]],"scrollTarget":"article","meta":{"kind":"question","qid":"30","paragraphPids":[6,7]}},{"section":"30题","raw":"### A. unprepared\n\n> 没有准备好\n\n把A接回题干，它说的是：Weiss认为许多人尚未充分准备好退休。\n\nA说没准备好，回Weiss的话看making ends meet与长期目标建议。\n\n> they are worried about making ends meet in their later years\n\n> He suggested that **[xxx]** should speak with a financial advisor to set long-term financial goals.\n\n> Many people believe they can’t retire.\n\n许多人担心晚年收支不够，因此准备继续工作。Weiss建议向顾问咨询、制定长期财务目标，说明退休安排还有需要补足之处。\n\n最后又说很多人相信自己不能退休，涉及心理与财务两方面。A概括准备不足，不是说他们完全没有做任何安排。\n\n**担忧晚年开支、需要补长期规划，是否支持还未准备好退休？**\n\n支持。A先保留。\n\n**第一轮判断：A保留。**","html":"<h3>A. unprepared</h3>\n<blockquote><p>没有准备好</p>\n</blockquote>\n<p>把A接回题干，它说的是：Weiss认为许多人尚未充分准备好退休。</p>\n<p>A说没准备好，回Weiss的话看making ends meet与长期目标建议。</p>\n<blockquote><p>they are worried about making ends meet in their later years</p>\n</blockquote>\n<blockquote><p>He suggested that <strong>[xxx]</strong> should speak with a financial advisor to set long-term financial goals.</p>\n</blockquote>\n<blockquote><p>Many people believe they can’t retire.</p>\n</blockquote>\n<p>许多人担心晚年收支不够，因此准备继续工作。Weiss建议向顾问咨询、制定长期财务目标，说明退休安排还有需要补足之处。</p>\n<p>最后又说很多人相信自己不能退休，涉及心理与财务两方面。A概括准备不足，不是说他们完全没有做任何安排。</p>\n<p><strong>担忧晚年开支、需要补长期规划，是否支持还未准备好退休？</strong></p>\n<p>支持。A先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,1312,308,22],[198,1365,731,22],[137,1402,792,23],[137,1440,526,22]],"questionRects":[[196,1201,143,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"30","option":"A","paragraphPids":[6,7]}},{"section":"30题","raw":"### B. unafraid\n\n> 没有畏惧\n\n把B接回题干，它说的是：Weiss认为许多人面对退休并不担忧。\n\nB说无所担忧，回第7段看worried about making ends meet。\n\n> because they are worried about making ends meet in their later years\n\nWeiss明确点出担心晚年收支平衡的人，这是他们选择继续工作的原因。后面很多人觉得不能退休，也延续顾虑。\n\nunafraid却说没有害怕，与worried呈相反方向。\n\n**原文已经说worried，还能概括为面对退休不担忧吗？**\n\n不能。B与人物直接判断相反。\n\n**第一轮判断：B排除。**","html":"<h3>B. unafraid</h3>\n<blockquote><p>没有畏惧</p>\n</blockquote>\n<p>把B接回题干，它说的是：Weiss认为许多人面对退休并不担忧。</p>\n<p>B说无所担忧，回第7段看worried about making ends meet。</p>\n<blockquote><p>because they are worried about making ends meet in their later years</p>\n</blockquote>\n<p>Weiss明确点出担心晚年收支平衡的人，这是他们选择继续工作的原因。后面很多人觉得不能退休，也延续顾虑。</p>\n<p>unafraid却说没有害怕，与worried呈相反方向。</p>\n<p><strong>原文已经说worried，还能概括为面对退休不担忧吗？</strong></p>\n<p>不能。B与人物直接判断相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,1312,308,22]],"questionRects":[[197,1238,113,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"30","option":"B","paragraphPids":[6]}},{"section":"30题","raw":"### C. disappointed\n\n> 感到失望\n\n把C接回题干，它说的是：Weiss认为许多人对退休已经感到失望。\n\nC说失望，回末两段区分担心未来与对结果失望。\n\n> worried about making ends meet in their later years\n\n> Many people believe they can’t retire.\n\n他们担忧退休后钱够不够，甚至觉得尚不能退休。文中没有先写他们经历退休，再因实际结果不合期待而失望。\n\n担忧可以在事情发生前产生，失望通常需要某项期望落空的依据，本文没有把这一步写出。\n\n**担忧将来无法维持生活，就等于已经对退休结果失望吗？**\n\n不等于。C没有对应的失望经历。\n\n**第一轮判断：C排除。**","html":"<h3>C. disappointed</h3>\n<blockquote><p>感到失望</p>\n</blockquote>\n<p>把C接回题干，它说的是：Weiss认为许多人对退休已经感到失望。</p>\n<p>C说失望，回末两段区分担心未来与对结果失望。</p>\n<blockquote><p>worried about making ends meet in their later years</p>\n</blockquote>\n<blockquote><p>Many people believe they can’t retire.</p>\n</blockquote>\n<p>他们担忧退休后钱够不够，甚至觉得尚不能退休。文中没有先写他们经历退休，再因实际结果不合期待而失望。</p>\n<p>担忧可以在事情发生前产生，失望通常需要某项期望落空的依据，本文没有把这一步写出。</p>\n<p><strong>担忧将来无法维持生活，就等于已经对退休结果失望吗？</strong></p>\n<p>不等于。C没有对应的失望经历。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,1312,308,22],[198,1365,731,22],[137,1402,792,23],[137,1440,526,22]],"questionRects":[[197,1275,155,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"30","option":"C","paragraphPids":[6,7]}},{"section":"30题","raw":"### D. **[xxx]**\n\n> **[xxx]**\n\n把D接回题干，它说的是：Weiss认为许多人对退休具有某种**[xxx]**态度。\n\nD整个状态词未知，先回末两段确认Weiss的已知评价。\n\n> It’s not just a financial decision, but an emotional one.\n\n> Many people believe they can’t retire.\n\n他说很多人担心晚年收支，建议长期规划，又说退休既是财务决定也是情感决定。这些能够支持A的准备不足。\n\nD还看不懂，不能把它假定成担忧或乐观后再判。先与A留下，回查时以完整可读的对应为准。\n\n**目前能不能判断D这个状态是否与Weiss的话相合？**\n\n还不能。D暂留，不替未知词补定义。\n\n**第一轮判断：D保留。**","html":"<h3>D. <strong>[xxx]</strong></h3>\n<blockquote><p><strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：Weiss认为许多人对退休具有某种<strong>[xxx]</strong>态度。</p>\n<p>D整个状态词未知，先回末两段确认Weiss的已知评价。</p>\n<blockquote><p>It’s not just a financial decision, but an emotional one.</p>\n</blockquote>\n<blockquote><p>Many people believe they can’t retire.</p>\n</blockquote>\n<p>他说很多人担心晚年收支，建议长期规划，又说退休既是财务决定也是情感决定。这些能够支持A的准备不足。</p>\n<p>D还看不懂，不能把它假定成担忧或乐观后再判。先与A留下，回查时以完整可读的对应为准。</p>\n<p><strong>目前能不能判断D这个状态是否与Weiss的话相合？</strong></p>\n<p>还不能。D暂留，不替未知词补定义。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[198,1365,731,22],[137,1402,792,23],[137,1440,526,22]],"questionRects":[[197,1312,146,17]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"30","option":"D","paragraphPids":[7]}},{"section":"30题","raw":"### 30题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n暂留A、D，等把全文连起来后再回来比较。","html":"<h3>30题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂留A、D，等把全文连起来后再回来比较。</p>\n","articleRects":[],"questionRects":[[153,1164,706,22],[196,1201,143,22],[197,1238,113,17],[197,1275,155,22],[197,1312,146,17]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | More Americans；work into retirement | 越来越多人在退休年龄后仍工作，旧有劳动力模式因此面临变化。 | 提出新的退休就业趋势。 |\n| 第2段 | one in three；even if enough money | 调查显示不少人已计划继续就业，其中一些即使钱够也会工作。 | 以调查说明现象及非纯财务动机。 |\n| 第3段 | Other reasons；mentally fit；boredom | 继续工作还可满足精神健康、防止无聊等个人需要。 | 补充经济之外的原因。 |\n| 第4段 | not just finances；value of work | 退休观念与工作的价值需要一并考虑。 | 以人物观点概括多重动机。 |\n| 第5段 | living longer；percentage doubled | 寿命延长是模式变化的原因，年长者参与劳动的比例也在上升。 | 补充寿命与劳动力变化。 |\n| 第6段 | longer life spans；savings；expenses | 面对更长人生，许多人增加储蓄，其中明确方式是减少支出。 | 转入资金准备及具体办法。 |\n| 第7段 | worried；financial goals | Weiss指出许多人担心晚年收支，并建议建立长期财务目标。 | 聚焦退休准备中的现实顾虑。 |\n| 第8段 | financial；emotional；can’t retire | 退休也涉及情感决定，很多人觉得自己尚不能退休。 | 补充准备问题的心理层面。 |\n\n**全文的主要意思：更多美国人在退休后继续工作，原因既有寿命与经济安排，也有工作的精神价值；面对更长人生，一些人仍在财务和情感上缺少充分的退休准备，需要提前规划。**","html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>More Americans；work into retirement</td><td>越来越多人在退休年龄后仍工作，旧有劳动力模式因此面临变化。</td><td>提出新的退休就业趋势。</td></tr><tr><td>第2段</td><td>one in three；even if enough money</td><td>调查显示不少人已计划继续就业，其中一些即使钱够也会工作。</td><td>以调查说明现象及非纯财务动机。</td></tr><tr><td>第3段</td><td>Other reasons；mentally fit；boredom</td><td>继续工作还可满足精神健康、防止无聊等个人需要。</td><td>补充经济之外的原因。</td></tr><tr><td>第4段</td><td>not just finances；value of work</td><td>退休观念与工作的价值需要一并考虑。</td><td>以人物观点概括多重动机。</td></tr><tr><td>第5段</td><td>living longer；percentage doubled</td><td>寿命延长是模式变化的原因，年长者参与劳动的比例也在上升。</td><td>补充寿命与劳动力变化。</td></tr><tr><td>第6段</td><td>longer life spans；savings；expenses</td><td>面对更长人生，许多人增加储蓄，其中明确方式是减少支出。</td><td>转入资金准备及具体办法。</td></tr><tr><td>第7段</td><td>worried；financial goals</td><td>Weiss指出许多人担心晚年收支，并建议建立长期财务目标。</td><td>聚焦退休准备中的现实顾虑。</td></tr><tr><td>第8段</td><td>financial；emotional；can’t retire</td><td>退休也涉及情感决定，很多人觉得自己尚不能退休。</td><td>补充准备问题的心理层面。</td></tr></tbody></table>\n<p><strong>全文的主要意思：更多美国人在退休后继续工作，原因既有寿命与经济安排，也有工作的精神价值；面对更长人生，一些人仍在财务和情感上缺少充分的退休准备，需要提前规划。</strong></p>\n","articleRects":[[184,202,746,22],[136,239,474,22],[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22],[184,497,746,23],[136,535,793,22],[137,572,555,22],[198,609,732,22],[137,645,792,23],[137,683,636,22],[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22],[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22],[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,1312,308,22],[198,1365,731,22],[137,1402,792,23],[137,1440,526,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6,7]}},{"section":"进阶回查","raw":"## 回查27题：A还是B？\n\nIt can be inferred from Paragraph 3 that Americans tend to think that ______.\n\nA. retirement may cause problems for them\n\nB. boredom can be **[xxx]** after retirement\n\n## 第27题二选一：A / B\n\n题干指定第3段，先看这段给出的继续工作理由：保持精神状态、防止无聊。工作对这些人还有生活和精神上的作用，离开工作就可能失去这些帮助。\n\n前一段说有人即使钱够也会继续工作，正好让第3段来解释为什么；后一段又说工作的价值也在推动他们继续就业。因此A所说退休可能带来问题，可以具体落到怕无聊、担心精神状态等顾虑上。\n\n**为了防止无聊而保留工作，是否说明人们考虑到了停止工作可能产生的困扰？**\n\n说明了。A用may保留可能性，没有断言退休人人都会出现问题。\n\nB虽然也有boredom，但关键动作不认识，无法确认它与“继续工作以防无聊”是否同一关系。A已经能用整句话核对，最终选A。\n\n**最终选择：27. A。**","html":"<h2>回查27题：A还是B？</h2>\n<p>It can be inferred from Paragraph 3 that Americans tend to think that ______.</p>\n<p>A. retirement may cause problems for them</p>\n<p>B. boredom can be <strong>[xxx]</strong> after retirement</p>\n<h2>第27题二选一：A / B</h2>\n<p>题干指定第3段，先看这段给出的继续工作理由：保持精神状态、防止无聊。工作对这些人还有生活和精神上的作用，离开工作就可能失去这些帮助。</p>\n<p>前一段说有人即使钱够也会继续工作，正好让第3段来解释为什么；后一段又说工作的价值也在推动他们继续就业。因此A所说退休可能带来问题，可以具体落到怕无聊、担心精神状态等顾虑上。</p>\n<p><strong>为了防止无聊而保留工作，是否说明人们考虑到了停止工作可能产生的困扰？</strong></p>\n<p>说明了。A用may保留可能性，没有断言退休人人都会出现问题。</p>\n<p>B虽然也有boredom，但关键动作不认识，无法确认它与“继续工作以防无聊”是否同一关系。A已经能用整句话核对，最终选A。</p>\n<p><strong>最终选择：27. A。</strong></p>\n","articleRects":[[184,202,746,22],[136,239,474,22],[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22],[184,497,746,23],[136,535,793,22],[137,572,555,22],[198,609,732,22],[137,645,792,23],[137,683,636,22],[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22],[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22],[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,1312,308,22],[198,1365,731,22],[137,1402,792,23],[137,1440,526,22]],"questionRects":[[152,500,708,21],[233,537,393,22],[196,574,432,17],[196,611,447,17],[196,647,456,22]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","B"],"finalChoice":"A","qid":"27","paragraphPids":[0,1,2,3,4,5,6,7]}},{"section":"进阶回查","raw":"## 回查30题：A还是D？\n\nWith regard to retirement, Brent Weiss thinks that many people are ______.\n\nA. unprepared\n\nD. **[xxx]**\n\n## 第30题二选一：A / D\n\n题干问Weiss的判断，重点回到他直接谈的那批人：他们担忧晚年能否收支平衡，所以准备继续工作。他建议咨询顾问、制定长期目标，随后又说许多人觉得自己不能退休。\n\n这里的preparing to do so，是为继续工作作准备，不是说已经充分准备好停止工作。钱能否支撑晚年还没有把握，心理上也觉得不能退，A的unprepared就能接上。\n\n前面也有人钱够仍愿工作，因为他们享受工作的精神价值。不能把这些人都改成没钱退休；A对应的是题干指定的Weiss所说的many people。\n\n**财务规划仍需补足、本人也觉得不能退休，能否概括为退休准备不足？**\n\n能。D的状态词仍未读懂，不作猜测；A已经有这两方面的具体依据。\n\n**最终选择：30. A。","html":"<h2>回查30题：A还是D？</h2>\n<p>With regard to retirement, Brent Weiss thinks that many people are ______.</p>\n<p>A. unprepared</p>\n<p>D. <strong>[xxx]</strong></p>\n<h2>第30题二选一：A / D</h2>\n<p>题干问Weiss的判断，重点回到他直接谈的那批人：他们担忧晚年能否收支平衡，所以准备继续工作。他建议咨询顾问、制定长期目标，随后又说许多人觉得自己不能退休。</p>\n<p>这里的preparing to do so，是为继续工作作准备，不是说已经充分准备好停止工作。钱能否支撑晚年还没有把握，心理上也觉得不能退，A的unprepared就能接上。</p>\n<p>前面也有人钱够仍愿工作，因为他们享受工作的精神价值。不能把这些人都改成没钱退休；A对应的是题干指定的Weiss所说的many people。</p>\n<p><strong>财务规划仍需补足、本人也觉得不能退休，能否概括为退休准备不足？</strong></p>\n<p>能。D的状态词仍未读懂，不作猜测；A已经有这两方面的具体依据。</p>\n<p><strong>最终选择：30. </strong></p>\n","articleRects":[[184,202,746,22],[136,239,474,22],[184,276,746,22],[136,313,793,22],[136,350,795,22],[151,386,779,23],[136,424,794,22],[137,461,413,22],[184,497,746,23],[136,535,793,22],[137,572,555,22],[198,609,732,22],[137,645,792,23],[137,683,636,22],[185,720,744,22],[137,757,786,22],[137,794,792,22],[137,831,765,22],[137,868,792,22],[138,905,502,22],[184,942,745,22],[136,979,793,22],[137,1015,764,23],[137,1053,789,22],[137,1090,792,22],[137,1127,551,22],[184,1164,745,22],[136,1201,794,22],[137,1238,793,22],[136,1275,794,22],[137,13
