<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**It can be learned from Paragraph 1 that the UK needs to ______.**\n\n> 从首段可以得知英国需要做什么？\n\n题型：**段落推断题**。","html":"<h2>26题题干</h2>\n<p><strong>It can be learned from Paragraph 1 that the UK needs to ______.</strong></p>\n<blockquote><p>从首段可以得知英国需要做什么？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n","articleRects":[],"questionRects":[[152,128,29,17],[197,128,552,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**According to Confor, the UK government’s fresh incentives ______.**\n\n> 根据Confor的看法，英国政府新推出的激励措施怎么样？\n\n题型：**人物评价题**。","html":"<h2>27题题干</h2>\n<p><strong>According to Confor, the UK government’s fresh incentives ______.</strong></p>\n<blockquote><p>根据Confor的看法，英国政府新推出的激励措施怎么样？</p>\n</blockquote>\n<p>题型：<strong>人物评价题</strong>。</p>\n","articleRects":[],"questionRects":[[152,382,29,17],[197,382,586,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**The UK’s exposure to fluctuating wood prices is a result of ______.**\n\n> 英国易受木材价格波动影响，是由什么造成的？\n\n题型：**原因题**。","html":"<h2>28题题干</h2>\n<p><strong>The UK’s exposure to fluctuating wood prices is a result of ______.</strong></p>\n<blockquote><p>英国易受木材价格波动影响，是由什么造成的？</p>\n</blockquote>\n<p>题型：<strong>原因题</strong>。</p>\n","articleRects":[],"questionRects":[[152,636,29,17],[196,636,583,21]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**Which of the following causes the shortage of wood supply in the UK?**\n\n> 下列哪一项造成英国木材供应短缺？\n\n题型：**原因细节题**。","html":"<h2>29题题干</h2>\n<p><strong>Which of the following causes the shortage of wood supply in the UK?</strong></p>\n<blockquote><p>下列哪一项造成英国木材供应短缺？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n","articleRects":[],"questionRects":[[152,889,731,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**What does Goodall think the UK government should do?**\n\n> Goodall认为英国政府应该做什么？\n\n题型：**人物建议题**。","html":"<h2>30题题干</h2>\n<p><strong>What does Goodall think the UK government should do?</strong></p>\n<blockquote><p>Goodall认为英国政府应该做什么？</p>\n</blockquote>\n<p>题型：<strong>人物建议题</strong>。</p>\n","articleRects":[],"questionRects":[[153,1143,28,17],[197,1143,555,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | because, while, but |\n| 态度词 / 评价词 | 先抓个大概好坏 | failure, crisis, hesitation |\n| 动作词 | 先看谁做了什么 | plant, reduce, provide |\n| 结果词 | 看最后出了什么事 | wood, supply, investment |\n| 重复主题词 | 大概知道老在说什么 | UK, Confor, Goodall |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>because, while, but</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>failure, crisis, hesitation</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>plant, reduce, provide</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>wood, supply, investment</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>UK, Confor, Goodall</td></tr></tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a **[xxx]** supply of wood for future **[xxx]**. Currently only 20 per cent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. Currently only 20 per cent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.</p>\n</div></div>","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":""},{"section":"读文章","raw":"The UK is facing a future construction crisis / because of a failure to plant trees to produce wood, Confor has warned. / The forestry and wood trade body has called for urgent action / to reduce the country’s reliance on timber imports / and provide a **[xxx]** supply of wood for future **[xxx]**. / Currently only 20 per cent of the UK’s wood requirement is home-grown / while it remains the second-largest net importer of timber in the world.","html":"<div class=\"coarseStack\"><div class=\"currentF 按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：英国、木材供应、植树、进口与政府支持。刚才还看到：英国、未来建筑危机、未能种树、生产木材、行业组织、降低、对木材进口的依赖、木材供应、百分之二十、木材需求、本土生产、第二大、净进口国；新激励、英国政府、土地所有者、多种树、还不够、木材供应、碳危机、建筑危机、国内木材供给、价格波动、全球需求上升、自身供应下降；理想条件、低碳住宅、苏格兰住宅、英格兰、百分之二十五、原因、复杂、陈旧认识、灰松鼠、农民、长期植树项目；生产性植树、经济收益、净零排放战略、政府支持、粮食生产、生物多样性、极为重要、可靠木材供应、建筑；英国政府、更多植树、行动很少、Confor、现在呼吁、确保、足够木材、满足增长需求。</p>\n<p>到这里还不能自然地说清楚：国内供给为何不足，新措施受到什么评价，原因清单具体包括什么，政府被建议增加哪方面支持。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> It can be learned from Paragraph 1 that the UK needs to ______.  \n> 从首段可以得知英国需要做什么？\n\n题干限定首段。完整读未来建筑危机的原因、行业组织的行动呼吁，以及本土供给与进口的比例关系。\n\n> 原文参考：\n> \n> The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a **[xxx]** supply of wood for future **[xxx]**. Currently only 20 per cent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.\n> \n> 开始精读：\n> \n> The UK is facing a future construction crisis / because of a failure to plant trees to produce wood, Confor has warned. / The forestry and wood trade body has called for urgent action / to reduce the country’s reliance on timber imports / and provide a **[xxx]** supply of wood for future **[xxx]**. / Currently only 20 per cent of the UK’s wood requirement is home-grown / while it remains the second-largest net importer of timber in the world.\n> \n> 英国正面临未来的建筑危机 / 因为未能种树生产木材Confor已提出警告。 / 这一林业和木材行业组织呼吁采取紧急行动 / 以降低该国对木材进口的依赖 / 并为未来**[xxx]**提供**[xxx]**的木材供应。 / 目前英国木材需求只有百分之二十由本土生产满足 / 而它仍是世界第二大木材净进口国。\n\n接下来按A—D逐项看。","html":"<h2>26题</h2>\n<blockquote><p>It can be learned from Paragraph 1 that the UK needs to ______.<br />\n从首段可以得知英国需要做什么？</p>\n</blockquote>\n<p>题干限定首段。完整读未来建筑危机的原因、行业组织的行动呼吁，以及本土供给与进口的比例关系。</p>\n<blockquote><p>原文参考：</p>\n<p>The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. Currently only 20 per cent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.</p>\n<p>开始精读：</p>\n<p>The UK is facing a future construction crisis / because of a failure to plant trees to produce wood, Confor has warned. / The forestry and wood trade body has called for urgent action / to reduce the country’s reliance on timber imports / and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. / Currently only 20 per cent of the UK’s wood requirement is home-grown / while it remains the second-largest net importer of timber in the world.</p>\n<p>英国正面临未来的建筑危机 / 因为未能种树生产木材Confor已提出警告。 / 这一林业和木材行业组织呼吁采取紧急行动 / 以降低该国对木材进口的依赖 / 并为未来<strong>[xxx]</strong>提供<strong>[xxx]</strong>的木材供应。 / 目前英国木材需求只有百分之二十由本土生产满足 / 而它仍是世界第二大木材净进口国。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22]],"questionRects":[[152,128,29,17],[197,128,552,22],[197,170,368,22],[197,213,317,17],[197,255,344,22],[197,297,351,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"26","paragraphPids":[0]}},{"section":"26题","raw":"### A. increase its domestic wood supply\n\n> 增加国内木材供应\n\n把A接回题干，它说的是：英国需要增加自身生产的木材供应。\n\nA说增加本地供应，回首段看failure to plant trees与only 20 per cent home-grown。\n\n> because of a failure to plant trees to produce wood\n\n> reduce the country’s reliance on timber imports\n\n> only 20 per cent of the UK’s wood requirement is home-grown\n\n英国没有充分种树产材，所需木材只有20%本地生产，因此很依赖进口。Confor要求降低这种依赖并保障未来供给。\n\n增加国内木材供应，正好针对本地生产不足，也能使需求不必那么依靠进口满足。\n\n**问题是本地产材不足、进口依赖高，增加国内供应是否直接回应？**\n\n是。A与原因和提出的方向都相合。\n\n**第一轮判断：A保留。**","html":"<h3>A. increase its domestic wood supply</h3>\n<blockquote><p>增加国内木材供应</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国需要增加自身生产的木材供应。</p>\n<p>A说增加本地供应，回首段看failure to plant trees与only 20 per cent home-grown。</p>\n<blockquote><p>because of a failure to plant trees to produce wood</p>\n</blockquote>\n<blockquote><p>reduce the country’s reliance on timber imports</p>\n</blockquote>\n<blockquote><p>only 20 per cent of the UK’s wood requirement is home-grown</p>\n</blockquote>\n<p>英国没有充分种树产材，所需木材只有20%本地生产，因此很依赖进口。Confor要求降低这种依赖并保障未来供给。</p>\n<p>增加国内木材供应，正好针对本地生产不足，也能使需求不必那么依靠进口满足。</p>\n<p><strong>问题是本地产材不足、进口依赖高，增加国内供应是否直接回应？</strong></p>\n<p>是。A与原因和提出的方向都相合。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22]],"questionRects":[[197,170,368,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"26","option":"A","paragraphPids":[0]}},{"section":"26题","raw":"### B. reduce its demand for timber\n\n> 降低其木材需求\n\n把B接回题干，它说的是：英国需要减少自己对木材的需求。\n\nB说减少需求，回首段看reduce后面直接接什么。\n\n> reduce the country’s reliance on timber imports and provide a **[xxx]** supply of wood for future **[xxx]**\n\n原文要减少的是reliance on timber imports，即对木材进口的依赖。它接着要求为未来提供木材供给。\n\n减少依赖可通过本地产材实现，不等于要求建筑等行业少需要木材。B把依赖进口换成了木材需求本身。\n\n**reduce reliance on imports等于reduce demand for timber吗？**\n\n不等于。B换了reduce的对象。\n\n**第一轮判断：B排除。**","html":"<h3>B. reduce its demand for timber</h3>\n<blockquote><p>降低其木材需求</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国需要减少自己对木材的需求。</p>\n<p>B说减少需求，回首段看reduce后面直接接什么。</p>\n<blockquote><p>reduce the country’s reliance on timber imports and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong></p>\n</blockquote>\n<p>原文要减少的是reliance on timber imports，即对木材进口的依赖。它接着要求为未来提供木材供给。</p>\n<p>减少依赖可通过本地产材实现，不等于要求建筑等行业少需要木材。B把依赖进口换成了木材需求本身。</p>\n<p><strong>reduce reliance on imports等于reduce demand for timber吗？</strong></p>\n<p>不等于。B换了reduce的对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22]],"questionRects":[[197,213,317,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"26","option":"B","paragraphPids":[0]}},{"section":"26题","raw":"### C. lower its wood **[xxx]** costs\n\n> 降低木材**[xxx]**成本\n\n把C接回题干，它说的是：英国需要降低某类木材成本。\n\nC说降低成本，回首段看作者有没有提出费用目标。\n\n> because of a failure to plant trees to produce wood\n\n> only 20 per cent of the UK’s wood requirement is home-grown\n\n首段列本地产量份额与进口地位，解释未来供给风险。没有成本数据，也没有要求降低某类木材费用。\n\nC中成本类别未知，但costs已换成价格层面；供给有保障与某项成本下降不能直接画等号。\n\n**保障供应这项要求，是否就是降低C所说的成本？**\n\n不是。C没有首段的直接支持。\n\n**第一轮判断：C排除。**","html":"<h3>C. lower its wood <strong>[xxx]</strong> costs</h3>\n<blockquote><p>降低木材<strong>[xxx]</strong>成本</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国需要降低某类木材成本。</p>\n<p>C说降低成本，回首段看作者有没有提出费用目标。</p>\n<blockquote><p>because of a failure to plant trees to produce wood</p>\n</blockquote>\n<blockquote><p>only 20 per cent of the UK’s wood requirement is home-grown</p>\n</blockquote>\n<p>首段列本地产量份额与进口地位，解释未来供给风险。没有成本数据，也没有要求降低某类木材费用。</p>\n<p>C中成本类别未知，但costs已换成价格层面；供给有保障与某项成本下降不能直接画等号。</p>\n<p><strong>保障供应这项要求，是否就是降低C所说的成本？</strong></p>\n<p>不是。C没有首段的直接支持。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22]],"questionRects":[[197,255,344,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"26","option":"C","paragraphPids":[0]}},{"section":"26题","raw":"### D. lift its control on timber imports\n\n> 解除对木材进口的管制\n\n把D接回题干，它说的是：英国需要取消木材进口方面的管制。\n\nD说取消进口管制，回首段看进口问题如何描述。\n\n> reduce the country’s reliance on timber imports\n\n> it remains the second-largest net importer of timber in the world\n\n作者担心依赖进口过高，并指出英国是大型净进口国。没有说管制妨碍进口，或取消管制是解决办法。\n\n本段提出的方向是增强自身供应，而不是解除某项未被提到的进口限制。\n\n**首段有没有把进口管制当成供应不足的原因？**\n\n没有。D增加了管制及解除管制的建议。\n\n**第一轮判断：D排除。**","html":"<h3>D. lift its control on timber imports</h3>\n<blockquote><p>解除对木材进口的管制</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国需要取消木材进口方面的管制。</p>\n<p>D说取消进口管制，回首段看进口问题如何描述。</p>\n<blockquote><p>reduce the country’s reliance on timber imports</p>\n</blockquote>\n<blockquote><p>it remains the second-largest net importer of timber in the world</p>\n</blockquote>\n<p>作者担心依赖进口过高，并指出英国是大型净进口国。没有说管制妨碍进口，或取消管制是解决办法。</p>\n<p>本段提出的方向是增强自身供应，而不是解除某项未被提到的进口限制。</p>\n<p><strong>首段有没有把进口管制当成供应不足的原因？</strong></p>\n<p>没有。D增加了管制及解除管制的建议。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22]],"questionRects":[[197,2  wood / as global demand rises and our own supplies fall.”\n> \n> 值此英国政府新近鼓励土地所有者多种树之际 / 该行业组织说这些措施还不够 / 也未能宣传种树增加木材供应的益处。 / “我们现在不仅面临碳危机 / 而且将面临未来的建筑危机 / 因为没有种树生产木材”Confor首席执行官Stuart Goodall说。 / “**[xxx]**以来我们未对投资国内木材供给承担**[xxx]** / 使我们暴露于价格波动之下 / 并争夺未来的木材供应 / 因为全球需求上升而我们自身供给下降。”\n\n接下来按A—D逐项看。","html":"<h2>27题</h2>\n<blockquote><p>According to Confor, the UK government’s fresh incentives ______.<br />\n根据Confor的看法，英国政府新推出的激励措施怎么样？</p>\n</blockquote>\n<p>fresh incentives定位第2段。完整读行业组织认为措施哪里不够，再接未来建筑危机的具体原因；区分力度、推出时机与实施成本。</p>\n<blockquote><p>原文参考：</p>\n<p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough and fail to promote the benefits of planting them to boost timber supplies. “Not only are we facing a carbon crisis now, but we will also be facing a future construction crisis because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices and fighting for future supplies of wood as global demand rises and our own supplies fall.”</p>\n<p>开始精读：</p>\n<p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, / the trade body says these don’t go far enough / and fail to promote the benefits of planting them to boost timber supplies. / “Not only are we facing a carbon crisis now, / but we will also be facing a future construction crisis / because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. / “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, / leaving us exposed to fluctuating prices / and fighting for future supplies of wood / as global demand rises and our own supplies fall.”</p>\n<p>值此英国政府新近鼓励土地所有者多种树之际 / 该行业组织说这些措施还不够 / 也未能宣传种树增加木材供应的益处。 / “ 121,21]],"questionRects":[[197,424,417,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"27","option":"A","paragraphPids":[1]}},{"section":"27题","raw":"### B. are believed to come at a wrong time\n\n> 被认为推出时机不对\n\n把B接回题干，它说的是：Confor认为这些激励措施推出的时机不恰当。\n\nB说时机不对，回第2段看coming at a time交代什么。\n\n> Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough\n\n这句话只是说明Confor发出批评时，政府刚好有新激励。实际批评落在don’t go far enough和没有充分促进产材上。\n\n没有说应该更早、晚些推出，或当前时机使政策不适合。\n\n**提到政策刚推出，就等于批评推出时间错误吗？**\n\n不等于。B把时间背景改成了批评内容。\n\n**第一轮判断：B排除。**","html":"<h3>B. are believed to come at a wrong time</h3>\n<blockquote><p>被认为推出时机不对</p>\n</blockquote>\n<p>把B接回题干，它说的是：Confor认为这些激励措施推出的时机不恰当。</p>\n<p>B说时机不对，回第2段看coming at a time交代什么。</p>\n<blockquote><p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough</p>\n</blockquote>\n<p>这句话只是说明Confor发出批评时，政府刚好有新激励。实际批评落在don’t go far enough和没有充分促进产材上。</p>\n<p>没有说应该更早、晚些推出，或当前时机使政策不适合。</p>\n<p><strong>提到政策刚推出，就等于批评推出时间错误吗？</strong></p>\n<p>不等于。B把时间背景改成了批评内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21]],"questionRects":[[197,467,401,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"27","option":"B","paragraphPids":[1]}},{"section":"27题","raw":"### C. seem to be **[xxx]** for landowners\n\n> 对土地所有者似乎是**[xxx]**的\n\n把C接回题干，它说的是：Confor认为这些措施对土地所有者具有某种**[xxx]**性质。\n\nC谈土地所有者的某种评价，回第2段先核对可见对象。\n\n> fresh incentives from the UK government for landowners to grow more trees\n\n> these don’t go far enough\n\n激励确实面向土地所有者，因此landowners与原文有关。但未知性质词决定C究竟怎样评价措施，当前还不能确认。\n\n先与已经读清的A保留，不能仅看受众相同就把具体评价一并认定。\n\n**面向土地所有者，就足以确认C中未知评价正确吗？**\n\n不足。C暂留，回查再以可确认的完整说法比较。\n\n**第一轮判断：C保留。**","html":"<h3>C. seem to be vernment’s inaction on timber imports</h3>\n<blockquote><p>政府在木材进口方面不作为</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国易受价格波动影响，是政府未在木材进口上采取行动造成的。</p>\n<p>A说进口方面不作为，回第2段看没有承担责任的是哪项投资。</p>\n<blockquote><p>we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices</p>\n</blockquote>\n<p>原句说对domestic wood supply的投入长期不够，结果使英国暴露在价格波动和争夺供应的风险下。缺口在国内产材。</p>\n<p>进口依赖是这种缺口的背景和后果，不能把未投资国内供应换成政府没有管理进口。</p>\n<p><strong>原句点出的不作为对象，是进口还是国内木材投资？</strong></p>\n<p>是国内投资。A换了政策对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21]],"questionRects":[[197,678,468,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"28","option":"A","paragraphPids":[1]}},{"section":"28题","raw":"### B. inadequate investment in growing wood\n\n> 种植木材方面投资不足\n\n把B接回题干，它说的是：英国对种树产材投入不足，导致其易受价格波动影响。\n\nB说种树投资不足，回第2段把investing in our domestic wood supply与leaving us exposed相接。\n\n> a failure to plant trees to produce wood\n\n> we have not taken **[xxx]** for investing in our domestic wood supply, leaving us exposed to fluctuating prices\n\n没有充分投入本地供给，所以自身供应下降、对外依赖更高；全球需求上涨时，英国更容易受价格与抢购竞争影响。\n\nB保留这个原因，后面的leaving结构也直接把投资缺口连到风险。\n\n**国内供应投资不足，是否是原句给出的价格波动风险原因？**\n\n是。B与原因及结果的衔接一致。\n\n**第一轮判断：B保留。**","html":"<h3>B. inadequate investment in growing wood</h3>\n<blockquote><p>种植木材方面投资不足</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国对种树产材投入不足，导致其易受价格波动影响。</p>\n<p>B说种树投资不足，回第2段把investing in our domestic wood supply与leaving us exposed相接。</p>\n<blockquote><p>a failure to plant trees to produce wood</p>\n</blockquote>\n<blockquote><p>we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices</p>\n</blockquote>\n<p>没有充分投入本地供给，所以自身供应下降、对外依赖更高；全球需求上涨时，英国更容易受价格与抢购竞争影响。</p>\n<p>B保留这个原因，后面的leaving结构也直接把投资缺口连到风险。</p>\n<p><strong>国内供应投资不足，是否是原句给出的价格波动风险原因？</strong></p>\n<p>是。B与原因及结果的衔接一致。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21]],"questionRects":[[197,720,422,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"28","option":"B","paragraphPids":[1]}},{"section":"28题","raw":"### C. the competition among timber traders at home\n\n> 国内木材贸易商之间的竞争\n\n把C接回题干，它说的是：英国易受价格波动影响，是国内贸易商彼此竞争造成的。\n\nC说国内贸易商竞争，回第2段看fighting for future supplies的范围。\n\n> fighting for future supplies of wood as global demand rises and our own supplies fall\n\n作者说全球需求增加、自身供应减少，英国要争取未来木材来源。比较的是英国供应处境与全球需求。\n\n没有写国内贸易商互相压价或争夺市场。C把全球供需压力缩成国内商家竞争。\n\n**这里争夺未来供应，说的是英国国内贸易商之间竞争吗？**\n\n不是。C换了竞争的参与范围。\n\n**第一轮判断：C排除。**","html":"<h3>C. the competition among timber traders at home</h3>\n<blockquote><p>国内木材贸易商之间的竞争</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国易受价格波动影响，是国内贸易商彼此竞争造成的。</p>\n<p>C说国内贸易商竞争，回第2段看fighting for future supplies的范围。</p>\n<blockquote><p>fighting for future supplies of wood as global demand rises and our own supplies fall</p>\n</blockquote>\n<p>作者说全球需求增加、自身供应减少，英国要争取未来木材来源。比较的是英国供应处境与全球需求。</p>\n<p>没有写国内贸易商互相压价或争夺市场。C把全球供需压力缩成国内商家竞争。</p>\n<p><strong>这里争夺未来供应，说的是英国国内贸易商之间竞争吗？</strong></p>\n<p>不是。C换了竞争的参与范围。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21]],"questionRects":[[197,762,485,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"28","option":"C","paragraphPids":[1]}},{"section":"28题","raw":"### D. wood producers’ **[xxx]** to maximise profits\n\n> 木材生产者为利润最大化的**[xxx]**\n\n把D接回题干，它说的是：英国的价格波动风险源自生产者围绕利润最大化的某种**[xxx]**。\n\nD说生产者追求利润，回第2段找有没有这种动机叙述。\n\n> we have not taken **[xxx]** for investing in our domestic wood supply\n\n> as global demand rises and our own supplies fall\n\n给出的原因是国内供给投资不足，随后解释全球需求上升与自身供给下降。文中没有说生产者故意操纵供应以提高利润。\n\nD动作词未知，但to maximise profits已加了逐利动机，不能从价格波动自动推出来。\n\n**价格波动和供应紧张，本身能证明生产者在做某种利润最大化行动吗？**\n\n不能。D缺少这种动机和行动的依据。\n\n**第一轮判断：D排除。**","html":"<h3>D. wood producers’ <strong>[xxx]</strong> to maximise profits</h3>\n<blockquote><p>木材生产者为利润最大化的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：英国的价格波动风险源自生产者围绕利润最大化的某种<strong>[xxx]</strong>。</p>\n<p>D说生产者追求利润，回第2段找有没有这种动机叙述。</p>\n<blockquote><p>we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply</p>\n</blockquote>\n<blockquote><p>as global demand rises and our own supplies fall</p>\n</blockquote>\n<p>给出的原因是国内供给投资不足，随后解释全球需求上升与自身供给下降。文中没有说生产者故意操纵供应以提高利润。</p>\n<p>D动作词未知，但to maximise profits已加了逐利动机，不能从价格波动自动推出来。</p>\n<p><strong>价格波动和供应紧张，本身能证明生产者在做某种利润最大化行动吗？</strong></p>\n<p>不能。D缺少这种动机和行动的依据。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21]],"questionRects":[[197,805,466,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"28","option":"D","paragraphPids":[1]}},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。","html":"<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n","articleRects":[],"questionRects":[[152,636,29,17],[196,636,583,21],[197,678,468,22],[197,720,422,22],[197,762,485,22],[197,805,466,21]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> Which of the following causes the shortage of wood supply in the UK?  \n> 下列哪一项造成英国木材供应短缺？\n\n第3段causes引出原因清单。先读理想种植条件与地区比例，再逐个分清陈旧认识、树木受影响及长期种植投资的犹豫。\n\n> 原文参考：\n> \n> The UK has ideal conditions for growing wood to build low-carbon homes and is a global leader in **[xxx]** that its forests are **[xxx]** managed, Confor says. While around three quarters ttle action on the ground</p>\n</blockquote>\n<p>政府支持仍着重粮食和生物多样性林地，Goodall要求土地也要供应建筑等所需木材。末段又说植树表态很多，实际行动很少。</p>\n<p>C把缺少的生产性植树支持补出来，既对应供给目标，也对应从表态到行动的要求。</p>\n<p><strong>增加产材植树支持，是否正回应他指出的支持偏向与行动不足？</strong></p>\n<p>是。C能接住这两段的具体建议。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[184,974,745,22],[137,1008,793,22],[137,1042,794,22],[137,1075,793,22],[137,1109,792,22],[136,1143,793,22],[137,1180,82,14],[198,1211,728,22],[137,1245,793,21],[137,1278,793,22],[137,1312,183,22]],"questionRects":[[197,1270,522,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"30","option":"C","paragraphPids":[3,4]}},{"section":"30题","raw":"### D. Give priority to pursuing its net-zero strategy.\n\n> 优先推进净零排放战略。\n\n把D接回题干，它说的是：Goodall要求政府把净零排放战略放在优先位置。\n\nD说优先净零，回第4段看contribute to net zero与also provide wood。\n\n> productive tree planting can deliver real financial benefits to rural economies and contribute to the UK’s net-zero strategy\n\n> food production and biodiversity health are clearly of critical importance\n\n净零是生产性植树可以贡献的目标，Goodall同时承认粮食与生物多样性重要，并要求土地也生产木材。\n\n他没有把净零排到其他目标之前，而是要求把木材供应纳入并行考虑。D加了priority的先后顺序。\n\n**同时贡献净零和木材供应，等于要求净零优先吗？**\n\n不等于。D改变了各目标之间的关系。\n\n**第一轮判断：D排除。**","html":"<h3>D. Give priority to pursuing its net-zero strategy.</h3>\n<blockquote><p>优先推进净零排放战略。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Goodall要求政府把净零排放战略放在优先位置。</p>\n<p>D说优先净零，回第4段看contribute to net zero与also provide wood。</p>\n<blockquote><p>productive tree planting can deliver real financial benefits to rural economies and contribute to the UK’s net-zero strategy</p>\n</blockquote>\n<blockquote><p>food production and biodiversity health are clearly of critical importance</p>\n</blockquote>\n<p>净零是生产性植树可以贡献的目标，Goodall同时承认粮食与生物多样性重要，并要求土地也生产木材。</p>\n<p>他没有把净零排到其他目标之前，而是要求把木材供应纳入并行考虑。D加了priority的先后顺序。</p>\n<p><strong>同时贡献净零和木材供应，等于要求净零优先吗？</strong></p>\n<p>不等于。D改变了各目标之间的关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,974,745,22],[137,1008,793,22],[137,1042,7 调整支持方向的理由和建议。</td></tr><tr><td>第5段</td><td>little action；enough wood；increasing demand</td><td>政府植树表态需转成更多实际行动，以满足增长的木材需求。</td><td>将支持建议落实到行动要求。</td></tr></tbody></table>\n<p><strong>全文的主要意思：英国应加强对生产性植树的实际支持，补足长期国内木材供给投资，以降低进口依赖、应对未来建筑需求并兼顾其他土地目标。</strong></p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22],[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21],[184,703,745,22],[137,737,789,22],[137,771,793,22],[137,805,793,22],[137,839,793,22],[137,873,792,22],[137,906,793,22],[137,940,518,22],[184,974,745,22],[137,1008,793,22],[137,1042,794,22],[137,1075,793,22],[137,1109,792,22],[136,1143,793,22],[137,1180,82,14],[198,1211,728,22],[137,1245,793,21],[137,1278,793,22],[137,1312,183,22]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4]}},{"section":"进阶回查","raw":"## 回查27题：A还是C？\n\nAccording to Confor, the UK government’s fresh incentives ______.\n\nA. can hardly address a construction crisis\n\nC. seem to be **[xxx]** for landowners\n\n## 第27题二选一：A / C\n\n第2段明确评价新激励don’t go far enough，接着说没有充分促进种树来增加木材。随后Goodall又把未来建筑危机归因于没有种树产材。\n\n把这两处接起来：若现有措施仍未充分推动国内产材，未来建筑所需木材的缺口就没有得到充分应对。A说难以处理这项危机，正对应这条理由。\n\n后文农民对长期投资犹豫，政府支持仍偏向其他土地用途，末段又说实际行动太少，都继续说明需要更充分的产材支持。\n\n**A能否同时接到措施不够与未来建筑缺木材这两点？**\n\n能。C只有landowners可读，虽与激励对象相同，却还不能确认具体评价。A的判断和原因已经完整对应，最终选A。\n\n**最终选择：27. A。**","html":"<h2>回查27题：A还是C？</h2>\n<p>According to Confor, the UK government’s fresh incentives ______.</p>\n<p>A. can hardly address a construction crisis</p>\n<p>C. seem to be <strong>[xxx]</strong> for landowners</p>\n<h2>第27题二选一：A / C</h2>\n<p>第2段明确评价新激励don’t go far enough，接着说没有充分促进种树来增加木材。随后Goodall又把未来建筑危机归因于没有种树产材。</p>\n<p>把这两处接起来：若现有措施仍未充分推动国内产材，未来建筑所需木材的缺口就没有得到充分应对。A说难以处理这项危机，正对应这条理由。</p>\n<p>后文农民对长期投资犹豫，政府支持仍偏向其他土地用途，末段又说实际行动太少，都继续说明需要更充分的产材支持。</p>\n<p><strong>A能否同时接到措施不够与未来建筑缺木材这两点？</strong></p>\n<p>能。C只有landowners可读，虽与激励对象相同，却还不能确认具体评价。A的判断和原因已经完整对应，最终选A。</p>\n<p><strong>最终选择：27. A。</strong></p>\n","articleRects":[[184,196,746,22],[136,230,793,22],[137,264,792,22],[136,298,794,21],[137,332,793,21],[137,365,347,22],[184,399,746,22],[137,433,793,22],[137,466,792,23],[137,501,793,21],[137,533,780,23],[137,567,793,23],[137,602,792,22],[137,636,792,22],[137,670,121,21],[184,703,745,22],[137,737,789,22],[137,771,793,22],[137,805,793,22],[137,839,793,22],[137,873,792,22],[137,906,793,22],[137,940,518,22],[184,974,745,22],[137,1008,793,22],[137,1042,794,22],[137,1075,793,22],[137,1109,792,22],[136,1143,793,22],[137,1180,82,14],[198,1211,728,22],[137,1245,793,21],[137,1278,793,22],[137,1312,183,22]],"questionRects":[[152,382,29,17],[197,382,586,22],[197,424,417,22],[197,467,401,21],[197,509,404,22],[197,551,400,22]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","C"],"finalChoice":"A","qid":"27","paragraphPids":[0,1,2,3,4]}},{"section":"最终答案","raw":"## 最终答案\n\n**26. A**\n\n**27. A**\n\n**28. B**\n\n**29. D**\n\n**30. C**","html":"<h2>最终答案</h2>\n<p><strong>26. A</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. B</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. C</strong></p>\n","articleRects":[],"questionRects":[[152,128,29,17],[197,128,552,22],[197,170,368,22],[197,213,317,17],[197,255,344,22],[197,297,351,22],[152,382,29,17],[197,382,586,22],[197,424,417,22],[197,467,401,21],[197,509,404,22],[197,551,400,22],[152,636,29,17],[196,636,583,21],[197,678,468,22],[197,720,422,22],[197,762,485,22],[197,805,466,21],[152,889,731,22],[234,932,448,21],[197,974,457,21],[197,1016,464,22],[197,1058,399,22],[153,1143,28,17],[197,1143,555,22],[197,1185,468,22],[197,1227,517,22],[197,1270,522,22],[197,1312,482,22],[394,1397,309,19]],"scrollTarget":"questionTop","meta":{"kind":"final"}}],"articleImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDsAAAXkCAIAAABLzpc7AAEAAElEQVR4nOzddVwV6fs//jk 5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAJILEQsAAAAAAEguRCwAAAAAACC5ELEAAAAAAIDkQsQCAAAAAACSCxELAAAAAABILkQsAAAAAAAguRCxAAAAAACA5ELEAgAAAAAAkgsRCwAAAAAASC5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAExi/f8ABqMsGCHwPVcAAAAASUVORK5CYII=","articleSize":{"w":1083,"h":1508},"questionSize":{"w":1083,"h":1508},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>26题题干</h2>\n<p><strong>It can be learned from Paragraph 1 that the UK needs to ______.</strong></p>\n<blockquote><p>从首段可以得知英国需要做什么？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n\n<hr />\n<h2>27题题干</h2>\n<p><strong>According to Confor, the UK government’s fresh incentives ______.</strong></p>\n<blockquote><p>根据Confor的看法，英国政府新推出的激励措施怎么样？</p>\n</blockquote>\n<p>题型：<strong>人物评价题</strong>。</p>\n\n<hr />\n<h2>28题题干</h2>\n<p><strong>The UK’s exposure to fluctuating wood prices is a result of ______.</strong></p>\n<blockquote><p>英国易受木材价格波动影响，是由什么造成的？</p>\n</blockquote>\n<p>题型：<strong>原因题</strong>。</p>\n\n<hr />\n<h2>29题题干</h2>\n<p><strong>Which of the following causes the shortage of wood supply in the UK?</strong></p>\n<blockquote><p>下列哪一项造成英国木材供应短缺？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n\n<hr />\n<h2>30题题干</h2>\n<p><strong>What does Goodall think the UK government should do?</strong></p>\n<blockquote><p>Goodall认为英国政府应该做什么？</p>\n</blockquote>\n<p>题型：<strong>人物建议题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>because, while, but</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>failure, crisis, hesitation</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>plant, reduce, provide</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>wood, supply, investment</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>UK, Confor, Goodall</td></tr></tbody></table>\n\n<hr />\n<p>The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. Currently only 20 per cent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.</p>\n\n<hr />\n<p>The UK is facing a future construction crisis / because of a failure to plant trees to produce wood, Confor has warned. / The forestry and wood trade body has called for urgent action / to reduce the country’s reliance on timber imports / and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. / Currently only 20 per cent of the UK’s wood requirement is home-grown / while it remains the second-largest net importer of timber in the world.</p>\n\n<hr />\n<p>The 英国 is facing a 未来建筑危机 / because of a 未能种树 to 生产木材, Confor has warned. / The forestry and wood 行业组织 has called for urgent action / to 降低 the country’s 对木材进口的依赖 / and provide a <strong>[xxx]</strong> 木材供应 for future <strong>[xxx]</strong>. / Currently only 百分之二十 of the UK’s 木材需求 is 本土生产 / while it remains the 第二大 净进口国 of timber in the world.</p>\n\n<hr />\n<p>1、英国、未来建筑危机、未能种树、生产木材、行业组织、降低、对木材进口的依赖、木材供应、百分之二十、木材需求、本土生产、第二大、净进口国。</p>\n\n<hr />\n<p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough and fail to promote the benefits of planting them to boost timber supplies. “Not only are we facing a carbon crisis now, but we will also be facing a future construction crisis because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices and fighting for future supplies of wood as global demand rises and our own supplies fall.”</p>\n\n<hr />\n<p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, / the trade body says these don’t go far enough / and fail to promote the benefits of planting them to boost timber supplies. / “Not only are we facing a carbon crisis now, / but we will also be facing a future construction crisis / because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. / “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, / leaving us exposed to fluctuating prices / and fighting for future supplies of wood / as global demand rises and our own supplies fall.”</p>\n\n<hr />\n<p>Coming at a time of 新激励 from the 英国政府 for 土地所有者 to 多种树, / the trade body says these 还不够 / and fail to promote the benefits of planting them to boost 木材供应. / “Not only are we facing a 碳危机 now, / but we will also be facing a future 建筑危机 / because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. / “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our 国内木材供给, / leaving us exposed to 价格波动 / and fighting for future supplies of wood / as 全球需求上升 and our 自身供应下降.”</p>\n\n<hr />\n<p>2、新激励、英国政府、土地所有者、多种树、还不够、木材供应、碳危机、建筑危机、国内木材供给、价格波动、全球需求上升、自身供应下降。</p>\n\n<hr />\n<p>The UK has ideal conditions for growing wood to build low-carbon homes and is a global leader in <strong>[xxx]</strong> that its forests are <strong>[xxx]</strong> managed, Confor says. While around three quarters of Scottish homes are built from Scottish timber, the use of home-grown wood in England is only around 25 per cent. The causes of the UK’s current position are complex and range from outdated perceptions of productive forestry to the <strong>[xxx]</strong> of trees by grey squirrels. It also <strong>[xxx]</strong> significant hesitation on behalf of farmers and other landowners to invest in longer-term planting projects.</p>\n\n<hr />\n<p>The UK has ideal conditions for growing wood to build low-carbon homes / and is a global leader in <strong>[xxx]</strong> that its forests are <strong>[xxx]</strong> managed, Confor says. / While around three quarters of Scottish homes are built from Scottish timber, / the use of home-grown wood in England is only around 25 per cent. / The causes of the UK’s current position are complex / and range from outdated perceptions of productive forestry / to the <strong>[xxx]</strong> of trees by grey squirrels. / It also <strong>[xxx]</strong> significant hesitation on behalf of farmers and other landowners / to invest in longer-term planting projects.</p>\n\n<hr />\n<p>The UK has 理想条件 for growing wood to build 低碳住宅 / and is a global leader in <strong>[xxx]</strong> that its forests are <strong>[xxx]</strong> managed, Confor says. / While around three quarters of 苏格兰住宅 are built from Scottish timber, / the use of home-grown wood in 英格兰 is only around 百分之二十五. / The 原因 of the UK’s current position are 复杂 / and range from 陈旧认识 of productive forestry / to the <strong>[xxx]</strong> of trees by 灰松鼠. / It also <strong>[xxx]</strong> significant hesitation on behalf of 农民 and other landowners / to invest in 长期植树项目.</p>\n\n<hr />\n<p>3、理想条件、低碳住宅、苏格兰住宅、英格兰、百分之二十五、原因、复杂、陈旧认识、灰松鼠、农民、长期植树项目。</p>\n\n<hr />\n<p>While productive tree planting can deliver real financial benefits to rural economies and contribute to the UK’s net-zero strategy, the focus of government support continues to be on food production and the <strong>[xxx]</strong> and planting of <strong>[xxx]</strong> woodland <strong>[xxx]</strong> for biodiversity. Goodall added: “While food production and biodiversity health are clearly of critical importance, we need our land to also provide secure supplies of wood for construction, <strong>[xxx]</strong> and contribute to net zero.”</p>\n\n<hr />\n<p>While productive tree planting can deliver real financial benefits to rural economies / and contribute to the UK’s net-zero strategy, / the focus of government support continues to be on food production / and the <strong>[xxx]</strong> and planting of <strong>[xxx]</strong> woodland <strong>[xxx]</strong> for biodiversity. / Goodall added: “While food production and biodiversity health are clearly of critical importance, / we need our land to also provide secure supplies of wood / for construction, <strong>[xxx]</strong> and contribute to net zero.”</p>\n\n<hr />\n<p>While 生产性植树 can deliver real 经济收益 to rural economies / and contribute to the UK’s 净零排放战略, / the focus of 政府支持 continues to be on 粮食生产 / and the <strong>[xxx]</strong> and planting of <strong>[xxx]</strong> woodland <strong>[xxx]</strong> for 生物多样性. / Goodall added: “While food production and biodiversity health are clearly of 极为重要, / we need our land to also provide 可靠木材供应 / for 建筑, <strong>[xxx]</strong> and contribute to net zero.”</p>\n\n<hr />\n<p>4、生产性植树、经济收益、净零排放战略、政府支持、粮食生产、生物多样性、极为重要、可靠木材供应、建筑。</p>\n\n<hr />\n<p>“While the UK government has stated its <strong>[xxx]</strong> for more tree planting, there has been little action on the ground. Confor is now calling for much greater <strong>[xxx]</strong> behind those <strong>[xxx]</strong> to ensure we have enough wood to meet increasing demand.”</p>\n\n<hr />\n<p>“While the UK government has stated its <strong>[xxx]</strong> for more tree planting, / there has been little action on the ground. / Confor is now calling for much greater <strong>[xxx]</strong> behind those <strong>[xxx]</strong> / to ensure we have enough wood to meet increasing demand.”</p>\n\n<hr />\n<p>“While the 英国政府 has stated its <strong>[xxx]</strong> for 更多植树, / there has been 行动很少 on the ground. / Confor is 现在呼吁 for much greater <strong>[xxx]</strong> behind those <strong>[xxx]</strong> / to 确保 we have 足够木材 to 满足增长需求.”</p>\n\n<hr />\n<p>5、英国政府、更多植树、行动很少、Confor、现在呼吁、确保、足够木材、满足增长需求。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：英国、木材供应、植树、进口与政府支持。刚才还看到：英国、未来建筑危机、未能种树、生产木材、行业组织、降低、对木材进口的依赖、木材供应、百分之二十、木材需求、本土生产、第二大、净进口国；新激励、英国政府、土地所有者、多种树、还不够、木材供应、碳危机、建筑危机、国内木材供给、价格波动、全球需求上升、自身供应下降；理想条件、低碳住宅、苏格兰住宅、英格兰、百分之二十五、原因、复杂、陈旧认识、灰松鼠、农民、长期植树项目；生产性植树、经济收益、净零排放战略、政府支持、粮食生产、生物多样性、极为重要、可靠木材供应、建筑；英国政府、更多植树、行动很少、Confor、现在呼吁、确保、足够木材、满足增长需求。</p>\n<p>到这里还不能自然地说清楚：国内供给为何不足，新措施受到什么评价，原因清单具体包括什么，政府被建议增加哪方面支持。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n\n<hr />\n<h2>26题</h2>\n<blockquote><p>It can be learned from Paragraph 1 that the UK needs to ______.<br />\n从首段可以得知英国需要做什么？</p>\n</blockquote>\n<p>题干限定首段。完整读未来建筑危机的原因、行业组织的行动呼吁，以及本土供给与进口的比例关系。</p>\n<blockquote><p>原文参考：</p>\n<p>The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. Currently only 20 per cent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.</p>\n<p>开始精读：</p>\n<p>The UK is facing a future construction crisis / because of a failure to plant trees to produce wood, Confor has warned. / The forestry and wood trade body has called for urgent action / to reduce the country’s reliance on timber imports / and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong>. / Currently only 20 per cent of the UK’s wood requirement is home-grown / while it remains the second-largest net importer of timber in the world.</p>\n<p>英国正面临未来的建筑危机 / 因为未能种树生产木材Confor已提出警告。 / 这一林业和木材行业组织呼吁采取紧急行动 / 以降低该国对木材进口的依赖 / 并为未来<strong>[xxx]</strong>提供<strong>[xxx]</strong>的木材供应。 / 目前英国木材需求只有百分之二十由本土生产满足 / 而它仍是世界第二大木材净进口国。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. increase its domestic wood supply</h3>\n<blockquote><p>增加国内木材供应</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国需要增加自身生产的木材供应。</p>\n<p>A说增加本地供应，回首段看failure to plant trees与only 20 per cent home-grown。</p>\n<blockquote><p>because of a failure to plant trees to produce wood</p>\n</blockquote>\n<blockquote><p>reduce the country’s reliance on timber imports</p>\n</blockquote>\n<blockquote><p>only 20 per cent of the UK’s wood requirement is home-grown</p>\n</blockquote>\n<p>英国没有充分种树产材，所需木材只有20%本地生产，因此很依赖进口。Confor要求降低这种依赖并保障未来供给。</p>\n<p>增加国内木材供应，正好针对本地生产不足，也能使需求不必那么依靠进口满足。</p>\n<p><strong>问题是本地产材不足、进口依赖高，增加国内供应是否直接回应？</strong></p>\n<p>是。A与原因和提出的方向都相合。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. reduce its demand for timber</h3>\n<blockquote><p>降低其木材需求</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国需要减少自己对木材的需求。</p>\n<p>B说减少需求，回首段看reduce后面直接接什么。</p>\n<blockquote><p>reduce the country’s reliance on timber imports and provide a <strong>[xxx]</strong> supply of wood for future <strong>[xxx]</strong></p>\n</blockquote>\n<p>原文要减少的是reliance on timber imports，即对木材进口的依赖。它接着要求为未来提供木材供给。</p>\n<p>减少依赖可通过本地产材实现，不等于要求建筑等行业少需要木材。B把依赖进口换成了木材需求本身。</p>\n<p><strong>reduce reliance on imports等于reduce demand for timber吗？</strong></p>\n<p>不等于。B换了reduce的对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. lower its wood <strong>[xxx]</strong> costs</h3>\n<blockquote><p>降低木材<strong>[xxx]</strong>成本</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国需要降低某类木材成本。</p>\n<p>C说降低成本，回首段看作者有没有提出费用目标。</p>\n<blockquote><p>because of a failure to plant trees to produce wood</p>\n</blockquote>\n<blockquote><p>only 20 per cent of the UK’s wood requirement is home-grown</p>\n</blockquote>\n<p>首段列本地产量份额与进口地位，解释未来供给风险。没有成本数据，也没有要求降低某类木材费用。</p>\n<p>C中成本类别未知，但costs已换成价格层面；供给有保障与某项成本下降不能直接画等号。</p>\n<p><strong>保障供应这项要求，是否就是降低C所说的成本？</strong></p>\n<p>不是。C没有首段的直接支持。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. lift its control on timber imports</h3>\n<blockquote><p>解除对木材进口的管制</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国需要取消木材进口方面的管制。</p>\n<p>D说取消进口管制，回首段看进口问题如何描述。</p>\n<blockquote><p>reduce the country’s reliance on timber imports</p>\n</blockquote>\n<blockquote><p>it remains the second-largest net importer of timber in the world</p>\n</blockquote>\n<p>作者担心依赖进口过高，并指出英国是大型净进口国。没有说管制妨碍进口，或取消管制是解决办法。</p>\n<p>本段提出的方向是增强自身供应，而不是解除某项未被提到的进口限制。</p>\n<p><strong>首段有没有把进口管制当成供应不足的原因？</strong></p>\n<p>没有。D增加了管制及解除管制的建议。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>26题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n\n<hr />\n<h2>27题</h2>\n<blockquote><p>According to Confor, the UK government’s fresh incentives ______.<br />\n根据Confor的看法，英国政府新推出的激励措施怎么样？</p>\n</blockquote>\n<p>fresh incentives定位第2段。完整读行业组织认为措施哪里不够，再接未来建筑危机的具体原因；区分力度、推出时机与实施成本。</p>\n<blockquote><p>原文参考：</p>\n<p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough and fail to promote the benefits of planting them to boost timber supplies. “Not only are we facing a carbon crisis now, but we will also be facing a future construction crisis because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices and fighting for future supplies of wood as global demand rises and our own supplies fall.”</p>\n<p>开始精读：</p>\n<p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, / the trade body says these don’t go far enough / and fail to promote the benefits of planting them to boost timber supplies. / “Not only are we facing a carbon crisis now, / but we will also be facing a future construction crisis / because of a failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. / “For <strong>[xxx]</strong> we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, / leaving us exposed to fluctuating prices / and fighting for future supplies of wood / as global demand rises and our own supplies fall.”</p>\n<p>值此英国政府新近鼓励土地所有者多种树之际 / 该行业组织说这些措施还不够 / 也未能宣传种树增加木材供应的益处。 / “我们现在不仅面临碳危机 / 而且将面临未来的建筑危机 / 因为没有种树生产木材”Confor首席执行官Stuart Goodall说。 / “<strong>[xxx]</strong>以来我们未对投资国内木材供给承担<strong>[xxx]</strong> / 使我们暴露于价格波动之下 / 并争夺未来的木材供应 / 因为全球需求上升而我们自身供给下降。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. can hardly address a construction crisis</h3>\n<blockquote><p>难以应对建筑危机</p>\n</blockquote>\n<p>把A接回题干，它说的是：Confor认为这些新激励措施难以解决建筑危机。</p>\n<p>A说难应对危机，回第2段把don’t go far enough与后面的危机连读。</p>\n<blockquote><p>these don’t go far enough and fail to promote the benefits of planting them to boost timber supplies</p>\n</blockquote>\n<blockquote><p>we will also be facing a future construction crisis because of a failure to plant trees to produce wood</p>\n</blockquote>\n<p>Confor认为现有激励力度不够，未充分推动种树产材。随后再次警告，没有种树生产木材会使未来建筑业面对危机。</p>\n<p>两句话接起来，现有措施没有充分解决导致危机的供给问题，A因此有依据。</p>\n<p><strong>措施仍未充分推动产材，是否说明它们难以应对所警告的危机？</strong></p>\n<p>说明了。A先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. are believed to come at a wrong time</h3>\n<blockquote><p>被认为推出时机不对</p>\n</blockquote>\n<p>把B接回题干，它说的是：Confor认为这些激励措施推出的时机不恰当。</p>\n<p>B说时机不对，回第2段看coming at a time交代什么。</p>\n<blockquote><p>Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough</p>\n</blockquote>\n<p>这句话只是说明Confor发出批评时，政府刚好有新激励。实际批评落在don’t go far enough和没有充分促进产材上。</p>\n<p>没有说应该更早、晚些推出，或当前时机使政策不适合。</p>\n<p><strong>提到政策刚推出，就等于批评推出时间错误吗？</strong></p>\n<p>不等于。B把时间背景改成了批评内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. seem to be <strong>[xxx]</strong> for landowners</h3>\n<blockquote><p>对土地所有者似乎是<strong>[xxx]</strong>的</p>\n</blockquote>\n<p>把C接回题干，它说的是：Confor认为这些措施对土地所有者具有某种<strong>[xxx]</strong>性质。</p>\n<p>C谈土地所有者的某种评价，回第2段先核对可见对象。</p>\n<blockquote><p>fresh incentives from the UK government for landowners to grow more trees</p>\n</blockquote>\n<blockquote><p>these don’t go far enough</p>\n</blockquote>\n<p>激励确实面向土地所有者，因此landowners与原文有关。但未知性质词决定C究竟怎样评价措施，当前还不能确认。</p>\n<p>先与已经读清的A保留，不能仅看受众相同就把具体评价一并认定。</p>\n<p><strong>面向土地所有者，就足以确认C中未知评价正确吗？</strong></p>\n<p>不足。C暂留，回查再以可确认的完整说法比较。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. will be too costly to put into practice</h3>\n<blockquote><p>实施起来费用太高</p>\n</blockquote>\n<p>把D接回题干，它说的是：Confor认为新措施实施费用过高。</p>\n<p>D说实施太贵，回第2段看有没有预算或支出负担。</p>\n<blockquote><p>these don’t go far enough and fail to promote the benefits of planting them to boost timber supplies</p>\n</blockquote>\n<p>Confor要求政府对国内木材供给投资得更多，批评支持还不够。没有说新激励因花费过高而无法实行。</p>\n<p>投入不足与实施费用过高不一样，不能看见investing就把两种判断混在一起。</p>\n<p><strong>作者抱怨投资不足，就是在说政策成本高得难以承担吗？</strong></p>\n<p>不是。D没有相应的成本判断。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>27题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂留A、C，等把全文连起来后再回来比较。</p>\n\n<hr />\n<h2>28题</h2>\n<blockquote><p>The UK’s exposure to fluctuating wood prices is a result of ______.<br />\n英国易受木材价格波动影响，是由什么造成的？</p>\n</blockquote>\n<p>fluctuating prices直接定位第2段引语。读完整的投资陈述与leaving结构，区分导致脆弱性的原因和全球需求上升这一背景。</p>\n<p>这一段前面已经完整读过，下面直接回到各项所涉及的句子。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. the government’s inaction on timber imports</h3>\n<blockquote><p>政府在木材进口方面不作为</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国易受价格波动影响，是政府未在木材进口上采取行动造成的。</p>\n<p>A说进口方面不作为，回第2段看没有承担责任的是哪项投资。</p>\n<blockquote><p>we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices</p>\n</blockquote>\n<p>原句说对domestic wood supply的投入长期不够，结果使英国暴露在价格波动和争夺供应的风险下。缺口在国内产材。</p>\n<p>进口依赖是这种缺口的背景和后果，不能把未投资国内供应换成政府没有管理进口。</p>\n<p><strong>原句点出的不作为对象，是进口还是国内木材投资？</strong></p>\n<p>是国内投资。A换了政策对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. inadequate investment in growing wood</h3>\n<blockquote><p>种植木材方面投资不足</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国对种树产材投入不足，导致其易受价格波动影响。</p>\n<p>B说种树投资不足，回第2段把investing in our domestic wood supply与leaving us exposed相接。</p>\n<blockquote><p>a failure to plant trees to produce wood</p>\n</blockquote>\n<blockquote><p>we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply, leaving us exposed to fluctuating prices</p>\n</blockquote>\n<p>没有充分投入本地供给，所以自身供应下降、对外依赖更高；全球需求上涨时，英国更容易受价格与抢购竞争影响。</p>\n<p>B保留这个原因，后面的leaving结构也直接把投资缺口连到风险。</p>\n<p><strong>国内供应投资不足，是否是原句给出的价格波动风险原因？</strong></p>\n<p>是。B与原因及结果的衔接一致。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. the competition among timber traders at home</h3>\n<blockquote><p>国内木材贸易商之间的竞争</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国易受价格波动影响，是国内贸易商彼此竞争造成的。</p>\n<p>C说国内贸易商竞争，回第2段看fighting for future supplies的范围。</p>\n<blockquote><p>fighting for future supplies of wood as global demand rises and our own supplies fall</p>\n</blockquote>\n<p>作者说全球需求增加、自身供应减少，英国要争取未来木材来源。比较的是英国供应处境与全球需求。</p>\n<p>没有写国内贸易商互相压价或争夺市场。C把全球供需压力缩成国内商家竞争。</p>\n<p><strong>这里争夺未来供应，说的是英国国内贸易商之间竞争吗？</strong></p>\n<p>不是。C换了竞争的参与范围。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. wood producers’ <strong>[xxx]</strong> to maximise profits</h3>\n<blockquote><p>木材生产者为利润最大化的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：英国的价格波动风险源自生产者围绕利润最大化的某种<strong>[xxx]</strong>。</p>\n<p>D说生产者追求利润，回第2段找有没有这种动机叙述。</p>\n<blockquote><p>we have not taken <strong>[xxx]</strong> for investing in our domestic wood supply</p>\n</blockquote>\n<blockquote><p>as global demand rises and our own supplies fall</p>\n</blockquote>\n<p>给出的原因是国内供给投资不足，随后解释全球需求上升与自身供给下降。文中没有说生产者故意操纵供应以提高利润。</p>\n<p>D动作词未知，但to maximise profits已加了逐利动机，不能从价格波动自动推出来。</p>\n<p><strong>价格波动和供应紧张，本身能证明生产者在做某种利润最大化行动吗？</strong></p>\n<p>不能。D缺少这种动机和行动的依据。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n\n<hr />\n<h2>29题</h2>\n<blockquote><p>Which of the following causes the shortage of wood supply in the UK?<br />\n下列哪一项造成英国木材供应短缺？</p>\n</blockquote>\n<p>第3段causes引出原因清单。先读理想种植条件与地区比例，再逐个分清陈旧认识、树木受影响及长期种植投资的犹豫。</p>\n<blockquote><p>原文参考：</p>\n<p>The UK has ideal conditions for growing wood to build low-carbon homes and is a global leader in <strong>[xxx]</strong> that its forests are <strong>[xxx]</strong> managed, Confor says. While around three quarters of Scottish homes are built from Scottish timber, the use of home-grown wood in England is only around 25 per cent. The causes of the UK’s current position are complex and range from outdated perceptions of productive forestry to the <strong>[xxx]</strong> of trees by grey squirrels. It also <strong>[xxx]</strong> significant hesitation on behalf of farmers and other landowners to invest in longer-term planting projects.</p>\n<p>开始精读：</p>\n<p>The UK has ideal conditions for growing wood to build low-carbon homes / and is a global leader in <strong>[xxx]</strong> that its forests are <strong>[xxx]</strong> managed, Confor says. / While around three quarters of Scottish homes are built from Scottish timber, / the use of home-grown wood in England is only around 25 per cent. / The causes of the UK’s current position are complex / and range from outdated perceptions of productive forestry / to the <strong>[xxx]</strong> of trees by grey squirrels. / It also <strong>[xxx]</strong> significant hesitation on behalf of farmers and other landowners / to invest in longer-term planting projects.</p>\n<p>英国具备用种植木材建造低碳住宅的理想条件 / 而且在<strong>[xxx]</strong>其森林得到<strong>[xxx]</strong>管理方面全球领先Confor说。 / 苏格兰约四分之三住宅由苏格兰木材建成 / 而英格兰使用本土木材的比例只有约百分之二十五。 / 英国当前局面的成因复杂 / 从对生产性林业的陈旧认识 / 到灰松鼠对树木的<strong>[xxx]</strong>。 / 还<strong>[xxx]</strong>农民及其他土地所有者的明显犹豫 / 在投资长期植树项目方面。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. <strong>[xxx]</strong> timber consumption in construction.</h3>\n<blockquote><p>建筑中<strong>[xxx]</strong>的木材消耗。</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国木材供应短缺，是建筑业某种<strong>[xxx]</strong>木材消耗造成的。</p>\n<p>A谈建筑耗材，回第3段看苏格兰与英格兰的比例说明什么。</p>\n<blockquote><p>around three quarters of Scottish homes are built from Scottish timber</p>\n</blockquote>\n<blockquote><p>the use of home-grown wood in England is only around 25 per cent</p>\n</blockquote>\n<p>两地比例介绍建筑使用本地木材的情况，不是说施工浪费或消耗了某个异常数量。随后列供给问题的原因，包括观念、树木受损和投资犹豫。</p>\n<p>A修饰消耗的词未知，不能把本地木材使用比例当成这种消耗特征的证据。</p>\n<p><strong>本地木材使用比例不同，就能确定建筑存在A所说的消耗问题吗？</strong></p>\n<p>不能。A没有对应这处原因说明。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. Unfavourable conditions for growing wood.</h3>\n<blockquote><p>木材种植条件不利。</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国因不具备有利的木材种植条件而供给不足。</p>\n<p>B说生长条件差，回第3段找ideal conditions。</p>\n<blockquote><p>The UK has ideal conditions for growing wood to build low-carbon homes</p>\n</blockquote>\n<p>作者明确说英国有理想条件种木材，用来建低碳住宅。因此供给不足不能按此段归因于自然种植条件不利。</p>\n<p>后面列的其他障碍，是在有利条件之下仍然没有充分生产的原因。</p>\n<p><strong>原文已说条件理想，还能把不足解释成条件不利吗？</strong></p>\n<p>不能。B与明文相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. Outdated technologies of the wood industry.</h3>\n<blockquote><p>木材行业技术落后。</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国木材供应不足是行业所用技术过时造成的。</p>\n<p>C说技术落后，回第3段看outdated直接修饰什么。</p>\n<blockquote><p>outdated perceptions of productive forestry</p>\n</blockquote>\n<p>outdated修饰perceptions，即对生产性林业的看法或观念，而非机器、技术或生产工艺。</p>\n<p>观念可能阻碍行动，但不能把“认识过时”直接改成“所用技术过时”。C借同一个形容词换了名词。</p>\n<p><strong>原文说过时的是技术吗？</strong></p>\n<p>不是，是对生产性林业的观念。C改了被评价的对象。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. Farmers’ unwillingness to plant trees.</h3>\n<blockquote><p>农民不愿种树。</p>\n</blockquote>\n<p>把D接回题干，它说的是：农民对投入植树缺乏意愿，是供给不足的原因之一。</p>\n<p>D说农民不愿种，回第3段末看significant hesitation与longer-term planting projects。</p>\n<blockquote><p>significant hesitation on behalf of farmers and other landowners to invest in longer-term planting projects</p>\n</blockquote>\n<p>农民和土地所有者对投资长期种植明显犹豫，会减少为未来木材供应进行的投入。它被直接列在解释英国现状的内容中。</p>\n<p>D概括这种意愿不足，不需要把它夸成农民永远拒绝所有植树。</p>\n<p><strong>对长期植树投资明显犹豫，是否能解释生产性植树不足？</strong></p>\n<p>能。D是文章明确列出的原因之一。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n\n<hr />\n<h2>30题</h2>\n<blockquote><p>What does Goodall think the UK government should do?<br />\nGoodall认为英国政府应该做什么？</p>\n</blockquote>\n<p>Goodall added定位第4段，继续完整读末段行动要求。分清他承认的重要目标，与他认为政府还应补充支持的生产性植树。</p>\n<blockquote><p>原文参考：</p>\n<p>While productive tree planting can deliver real financial benefits to rural economies and contribute to the UK’s net-zero strategy, the focus of government support continues to be on food production and the <strong>[xxx]</strong> and planting of <strong>[xxx]</strong> woodland <strong>[xxx]</strong> for biodiversity. Goodall added: “While food production and biodiversity health are clearly of critical importance, we need our land to also provide secure supplies of wood for construction, <strong>[xxx]</strong> and contribute to net zero.”</p>\n<p>开始精读：</p>\n<p>While productive tree planting can deliver real financial benefits to rural economies / and contribute to the UK’s net-zero strategy, / the focus of government support continues to be on food production / and the <strong>[xxx]</strong> and planting of <strong>[xxx]</strong> woodland <strong>[xxx]</strong> for biodiversity. / Goodall added: “While food production and biodiversity health are clearly of critical importance, / we need our land to also provide secure supplies of wood / for construction, <strong>[xxx]</strong> and contribute to net zero.”</p>\n<p>尽管生产性植树能给农村经济带来实际经济收益 / 并助力英国的净零排放战略 / 政府支持的重点仍是粮食生产 / 以及<strong>[xxx]</strong>和<strong>[xxx]</strong>林地种植<strong>[xxx]</strong>为了生物多样性。 / Goodall补充“粮食生产和生物多样性健康显然极为重要 / 但我们还需要土地提供可靠的木材供应 / 供建筑和<strong>[xxx]</strong>使用并助力净零排放。”</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>“While the UK government has stated its <strong>[xxx]</strong> for more tree planting, there has been little action on the ground. Confor is now calling for much greater <strong>[xxx]</strong> behind those <strong>[xxx]</strong> to ensure we have enough wood to meet increasing demand.”</p>\n<p>开始精读：</p>\n<p>“While the UK government has stated its <strong>[xxx]</strong> for more tree planting, / there has been little action on the ground. / Confor is now calling for much greater <strong>[xxx]</strong> behind those <strong>[xxx]</strong> / to ensure we have enough wood to meet increasing demand.”</p>\n<p>“尽管英国政府已表明多植树的<strong>[xxx]</strong> / 但实际行动很少。 / Confor现在呼吁这些<strong>[xxx]</strong>背后有更大的<strong>[xxx]</strong> / 以确保有足够木材满足增长的需求。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. <strong>[xxx]</strong> the building of low-carbon homes.</h3>\n<blockquote><p>对低碳住宅建设进行<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Goodall建议政府对低碳住宅建设采取某种<strong>[xxx]</strong>措施。</p>\n<p>A谈建设低碳住宅，回第3段和Goodall建议分清用途与当前行动。</p>\n<blockquote><p>we need our land to also provide secure supplies of wood for construction</p>\n</blockquote>\n<blockquote><p>to ensure we have enough wood to meet increasing demand</p>\n</blockquote>\n<p>低碳住宅是本地木材可以支持的用途之一。Goodall随后强调土地也要提供稳定木材，并要求政府对种树产材采取实际行动。</p>\n<p>A的动词未知，不能把木材最终用于建房当成他直接要求政府实施某项建房措施。</p>\n<p><strong>文中说木材能建低碳房，就等于Goodall提出A中未知的建房行动吗？</strong></p>\n<p>不等于。C与他明确要求增加产材支持相接。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. Pay greater attention to boosting rural economies.</h3>\n<blockquote><p>更加关注促进农村经济。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Goodall要求政府更重视农村经济发展。</p>\n<p>B说更重视农村经济，回第4段看financial benefits to rural economies是哪种行动的好处。</p>\n<blockquote><p>productive tree planting can deliver real financial benefits to rural economies</p>\n</blockquote>\n<blockquote><p>the focus of government support continues to be on food production</p>\n</blockquote>\n<p>给农村带来经济收益的是生产性植树，作者用这点说明支持植树有价值。Goodall的具体诉求是土地除了粮食和生物多样性，还应保障木材。</p>\n<p>B只留下一个广泛收益目标，没有说怎样补上全文强调的产材缺口。</p>\n<p><strong>促进农村经济是支持植树的一项好处，能替代具体植树建议吗？</strong></p>\n<p>不能完整替代。C更准确地保留要采取的行动。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. Provide more support for productive tree planting.</h3>\n<blockquote><p>对生产性植树提供更多支持。</p>\n</blockquote>\n<p>把C接回题干，它说的是：Goodall认为政府应增加对用于产材的植树活动的支持。</p>\n<p>C说多支持生产性植树，回第4、5段看support目前集中哪里、还缺什么。</p>\n<blockquote><p>the focus of government support continues to be on food production</p>\n</blockquote>\n<blockquote><p>we need our land to also provide secure supplies of wood</p>\n</blockquote>\n<blockquote><p>there has been little action on the ground</p>\n</blockquote>\n<p>政府支持仍着重粮食和生物多样性林地，Goodall要求土地也要供应建筑等所需木材。末段又说植树表态很多，实际行动很少。</p>\n<p>C把缺少的生产性植树支持补出来，既对应供给目标，也对应从表态到行动的要求。</p>\n<p><strong>增加产材植树支持，是否正回应他指出的支持偏向与行动不足？</strong></p>\n<p>是。C能接住这两段的具体建议。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. Give priority to pursuing its net-zero strategy.</h3>\n<blockquote><p>优先推进净零排放战略。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Goodall要求政府把净零排放战略放在优先位置。</p>\n<p>D说优先净零，回第4段看contribute to net zero与also provide wood。</p>\n<blockquote><p>productive tree planting can deliver real financial benefits to rural economies and contribute to the UK’s net-zero strategy</p>\n</blockquote>\n<blockquote><p>food production and biodiversity health are clearly of critical importance</p>\n</blockquote>\n<p>净零是生产性植树可以贡献的目标，Goodall同时承认粮食与生物多样性重要，并要求土地也生产木材。</p>\n<p>他没有把净零排到其他目标之前，而是要求把木材供应纳入并行考虑。D加了priority的先后顺序。</p>\n<p><strong>同时贡献净零和木材供应，等于要求净零优先吗？</strong></p>\n<p>不等于。D改变了各目标之间的关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>30题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>failure to plant；imports；20 per cent</td><td>英国本土木材供给不足且依赖进口，行业组织警告未来建筑风险。</td><td>提出风险及国内供给缺口。</td></tr><tr><td>第2段</td><td>don’t go far enough；investing；leaving</td><td>新植树激励仍不足，长期国内投资缺口使英国易受价格波动和供给竞争影响。</td><td>评价现有措施，并解释供给脆弱性的原因。</td></tr><tr><td>第3段</td><td>ideal conditions；complex causes；hesitation</td><td>虽有理想种植条件，但陈旧认识、树木问题和长期投资犹豫妨碍供给。</td><td>细化国内供给不足的成因。</td></tr><tr><td>第4段</td><td>productive planting；support focus；also</td><td>生产性植树有多重价值，但现有政府支持侧重其他用途，还需保障木材。</td><td>提出调整支持方向的理由和建议。</td></tr><tr><td>第5段</td><td>little action；enough wood；increasing demand</td><td>政府植树表态需转成更多实际行动，以满足增长的木材需求。</td><td>将支持建议落实到行动要求。</td></tr></tbody></table>\n<p><strong>全文的主要意思：英国应加强对生产性植树的实际支持，补足长期国内木材供给投资，以降低进口依赖、应对未来建筑需求并兼顾其他土地目标。</strong></p>\n\n<hr />\n<h2>回查27题：A还是C？</h2>\n<p>According to Confor, the UK government’s fresh incentives ______.</p>\n<p>A. can hardly address a construction crisis</p>\n<p>C. seem to be <strong>[xxx]</strong> for landowners</p>\n<h2>第27题二选一：A / C</h2>\n<p>第2段明确评价新激励don’t go far enough，接着说没有充分促进种树来增加木材。随后Goodall又把未来建筑危机归因于没有种树产材。</p>\n<p>把这两处接起来：若现有措施仍未充分推动国内产材，未来建筑所需木材的缺口就没有得到充分应对。A说难以处理这项危机，正对应这条理由。</p>\n<p>后文农民对长期投资犹豫，政府支持仍偏向其他土地用途，末段又说实际行动太少，都继续说明需要更充分的产材支持。</p>\n<p><strong>A能否同时接到措施不够与未来建筑缺木材这两点？</strong></p>\n<p>能。C只有landowners可读，虽与激励对象相同，却还不能确认具体评价。A的判断和原因已经完整对应，最终选A。</p>\n<p><strong>最终选择：27. A。</strong></p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>26. A</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. B</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. C</strong></p>\n","analysisStartInd function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}

      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
  centerHorizontal();
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+5);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-5);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
const pLeft=document.getElementById('panLeft');
if(pLeft)pLeft.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.max(0,leftPane.scrollLeft-120);};
const pRight=document.getElementById('panRight');
if(pRight)pRight.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.min(leftPane.scrollWidth-leftPane.clientWidth,leftPane.scrollLeft+120);};
const pCenter=document.getElementById('panCenter');
if(pCenter)pCenter.onclick=()=>centerHorizontal();
setupDragToPan(document.getElementById('leftPane'));
setTimeout(()=>applyZoom(zoomLevel),60);
window.addEventListener('keydown',e=>{
  if(fullMode||e.altKey||e.ctrlKey||e.metaKey)return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
});

const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
</script></body></html>
