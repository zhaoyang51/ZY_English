积、资金以及最后的vital。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>California plans to treat 35,000 acres of forest a year by 2020, and 60,000 by 2030—financed from the [xxx] of the state’s emissions-permit [xxx]. That’s only a small share of the total [xxx] that could benefit, about half a million acres in all, so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n<p>开始精读：</p>\n<p>California plans to treat 35,000 acres of forest a year / by 2020, / and 60,000 by 2030— / financed from the [xxx] / of the state’s emissions-permit [xxx]. / That’s only a small share / of the total [xxx] that could benefit, / about half a million acres in all, / so it will be vital to [xxx] areas / at greatest risk of fire or drought.</p>\n<p>加州计划每年处理三万五千英亩森林 / 到2020年时， / 到2030年则为六万英亩—— / 资金来自[xxx] / 该州排放许可[xxx]的。 / 那只是很小的一份 / 在可能受益的全部[xxx]中， / 总共约五十万英亩， / 所以至关重要的是去[xxx]那些地区 / 火灾或干旱风险最大的。</p>\n</blockquote>\n<p>前面列出每年能处理的面积，随后说相对全部可能受益面积，这只是小份额。so引出的vital因此接在高风险地区上，要看四项中哪项保留了资源有限时的处理次序。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[182,856,748,30],[135,891,789,29],[134,926,797,29],[135,960,796,30],[135,995,81,30]],"questionRects":[[187,885,625,30]],"scrollTarget":"auto","meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. To obtain enough financial support.\n\n> 得到足够资金支持\n\n把A接回题干，它说的是：计划的关键是先获得足够的资金支持。\n\nA的obtain enough financial support与第5段资金说明对应，所以回看financed from所在的句子，再接最后的so。\n\n> financed from the [xxx] of the state’s emissions-permit [xxx].\n\n> That’s only a small share of the total [xxx] that could benefit, about half a million acres in all, so it will be vital to [xxx] areas at greatest risk of fire or drought.\n\nfinanced from已经交代钱从哪里来，obtain enough financial support却把尚待取得足够资金当成这里的关键。so前直接比较的是处理面积与全部受益面积，so后再指定风险最大的地区。A把背景中的资金说明，换成面积限制所引出的行动重点。\n\n**vital这一判断是接在筹钱困难后面，还是接在能处理的面积只占小份额后面？**\n\n后者。钱的来路已经说明，最后重点落在有限覆盖面积之下先处理哪些地方。\n\n**第一轮判断：A排除。**","html":"<h3>A. To obtain enough financial support.</h3>\n<blockquote>\n<p>得到足够资金支持</p>\n</blockquote>\n<p>把A接回题干，它说的是：计划的关键是先获得足够的资金支持。</p>\n<p>A的obtain enough financial support与第5段资金说明对应，所以回看financed from所在的句子，再接最后的so。</p>\n<blockquote>\n<p>financed from the [xxx] of the state’s emissions-permit [xxx].</p>\n</blockquote>\n<blockquote>\n<p>That’s only a small share of the total [xxx] that could benefit, about half a million acres in all, so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n</blockquote>\n<p>financed from已经交代钱从哪里来，obtain enough financial support却把尚待取得足够资金当成这里的关键。so前直接比较的是处理面积与全部受益面积，so后再指定风险最大的地区。A把背景中的资金说明，换成面积限制所引出的行动重点。</p>\n<p><strong>vital这一判断是接在筹钱困难后面，还是接在能处理的面积只占小份额后面？</strong></p>\n<p>后者。钱的来路已经说明，最后重点落在有限覆盖面积之下先处理哪些地方。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,891,789,29],[134,926,797,29],[135,960,796,30],[135,995,81,30]],"questionRects":[[187,885,625,30],[216,928,348,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的obtain enough financial support与第5段资金说明对应，所以回看financed from所在的句子，再接最后的so。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["visible_link"],"visibleSourceAnchor":"financed from","visibleOptionAnchor":"obtain enough financial support"}}}},{"section":"29题","raw":"### B. To carry it out before the year of 2020.\n\n> 在2020年以前把它实施完\n\n把B接回题干，它说的是：计划关键是必须在2020年前完成实施。\n\nB的before the year of 2020涉及期限，所以回到第5段60,000 by 2030，把两个年份对应起来。\n\n> California plans to treat 35,000 acres of forest a year by 2020, and 60,000 by 2030\n\n60,000 by 2030说明2030年还要提高每年处理规模，before the year of 2020却把2020当成整个计划必须完成的截止点。原文a year说的是年度处理能力，而不是在那个年份之前把全部森林处理完。\n\n**2030年仍有年度处理目标，能说整个计划必须在2020年前做完吗？**\n\n不能。B把分阶段的规模目标改成了整体截止时间。\n\n**第一轮判断：B排除。**","html":"<h3>B. To carry it out before the year of 2020.</h3>\n<blockquote>\n<p>在2020年以前把它实施完</p>\n</blockquote>\n<p>把B接回题干，它说的是：计划关键是必须在2020年前完成实施。</p>\n<p>B的before the year of 2020涉及期限，所以回到第5段60,000 by 2030，把两个年份对应起来。</p>\n<blockquote>\n<p>California plans to treat 35,000 acres of forest a year by 2020, and 60,000 by 2030</p>\n</blockquote>\n<p>60,000 by 2030说明2030年还要提高每年处理规模，before the year of 2020却把2020当成整个计划必须完成的截止点。原文a year说的是年度处理能力，而不是在那个年份之前把全部森林处理完。</p>\n<p><strong>2030年仍有年度处理目标，能说整个计划必须在2020年前做完吗？</strong></p>\n<p>不能。B把分阶段的规模目标改成了整体截止时间。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[182,856,748,30],[135,891,789,29]],"questionRects":[[187,885,625,30],[215,970,388,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的before the year of 2020涉及期限，所以回到第5段60,000 by 2030，把两个年份对应起来。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time"],"visibleSourceAnchor":"60,000 by 2030","visibleOptionAnchor":"before the year of 2020"}}}},{"section":"29题","raw":"### C. To handle the areas in serious danger first.\n\n> 先处理处于严重危险中的地区\n\n把C接回题干，它说的是：计划关键是优先处理风险严重的地区。\n\nC的in serious danger first与第5段at greatest risk意思对应，所以回到vital后面，看哪些地区被特别点出来。\n\n> so it will be vital to [xxx] areas at greatest risk of fire or drought.\n\nat greatest risk明确指风险最高的地区，in serious danger first保留同一对象，其中first进一步回答了面积有限时怎样安排：前面只有small share能得到处理，因此把有限处理量先给最危险的区域，能接住so的因果。这里不是说所有地方同时处理，也不是只要求钱到位。\n\n**面积只够覆盖一小部分时，C的先处理高危地区能否接住句末的重点？**\n\n能。它同时保留了被特别点名的高危地区与资源有限所需要的先后选择。\n\n**第一轮判断：C保留。**","html":"<h3>C. To handle the areas in serious danger first.</h3>\n<blockquote>\n<p>先处理处于严重危险中的地区</p>\n</blockquote>\n<p>把C接回题干，它说的是：计划关键是优先处理风险严重的地区。</p>\n<p>C的in serious danger first与第5段at greatest risk意思对应，所以回到vital后面，看哪些地区被特别点出来。</p>\n<blockquote>\n<p>so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n</blockquote>\n<p>at greatest risk明确指风险最高的地区，in serious danger first保留同一对象，其中first进一步回答了面积有限时怎样安排：前面只有small share能得到处理，因此把有限处理量先给最危险的区域，能接住so的因果。这里不是说所有地方同时处理，也不是只要求钱到位。</p>\n<p><strong>面积只够覆盖一小部分时，C的先处理高危地区能否接住句末的重点？</strong></p>\n<p>能。它同时保留了被特别点名的高危地区与资源有限所需要的先后选择。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[135,960,796,30],[135,995,81,30]],"questionRects":[[187,885,625,30],[215,1012,419,30]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的in serious danger first与第5段at greatest risk意思对应，所以回到vital后面，看哪些地区被特别点出来。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"at greatest risk","visibleOptionAnchor":"in serious danger first"}}}},{"section":"29题","raw":"### D. To [xxx] the emissions-permit auctions.\n\n> 去[xxx]排放许可拍卖\n\n把D接回题干，它说的是：计划关键是对排放许可拍卖做某种[xxx]处理。\n\nD的emissions-permit auctions指向本段的资金来源，但题目问essential，所以回到第5段areas at greatest risk这句，看最后被强调的对象。\n\n> so it will be vital to [xxx] areas at greatest risk of fire or drought.\n\nareas at greatest risk是森林区域，emissions-permit auctions则是筹资活动。最后[xxx]后面的对象仍然是风险最大的地区；D也有一个[xxx]，但它支配的是拍卖。即使两处都不认识动词，也不能把作用对象从森林地区换成拍卖机制。\n\n**vital后面的动作指向高风险地区，能把动作对象改成排放许可拍卖吗？**\n\n不能。两个对象明确不同，D停在资金来源，没接到段末的实施重点。\n\n**第一轮判断：D排除。**","html":"<h3>D. To [xxx] the emissions-permit auctions.</h3>\n<blockquote>\n<p>去[xxx]排放许可拍卖</p>\n</blockquote>\n<p>把D接回题干，它说的是：计划关键是对排放许可拍卖做某种[xxx]处理。</p>\n<p>D的emissions-permit auctions指向本段的资金来源，但题目问essential，所以回到第5段areas at greatest risk这句，看最后被强调的对象。</p>\n<blockquote>\n<p>so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n</blockquote>\n<p>areas at greatest risk是森林区域，emissions-permit auctions则是筹资活动。最后[xxx]后面的对象仍然是风险最大的地区；D也有一个[xxx]，但它支配的是拍卖。即使两处都不认识动词，也不能把作用对象从森林地区换成拍卖机制。</p>\n<p><strong>vital后面的动作指向高风险地区，能把动作对象改成排放许可拍卖吗？</strong></p>\n<p>不能。两个对象明确不同，D停在资金来源，没接到段末的实施重点。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,960,796,30],[135,995,81,30]],"questionRects":[[187,885,625,30],[216,1055,402,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的emissions-permit auctions指向本段的资金来源，但题目问essential，所以回到第5段areas at greatest risk这句，看最后被强调的对象。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"areas at greatest risk","visibleOptionAnchor":"emissions-permit auctions"}}}},{"section":"29题","raw":"### 29题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除。\n\nC保留。有限的覆盖面积引出对高危地区的优先处理；A、D停在资金背景，B误读了年度目标和年份。","html":"<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。有限的覆盖面积引出对高危地区的优先处理；A、D停在资金背景，B误读了年度目标和年份。</p>\n","articleRects":[],"questionRects":[[187,885,625,30],[216,928,348,29],[215,970,388,29],[215,1012,419,30],[216,1055,402,29]],"scrollTarget":"auto","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**The author’s attitude to California’s plan can best be described as ______.**\n\n作者对加州计划的态度可以怎样描述？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **supportive**\n\n支持的\n\nB. **ambiguous**\n\n含糊不明的\n\nC. **tolerant**\n\n容忍的\n\nD. **cautious**\n\n谨慎的","html":"<h2>30题</h2>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<p>作者对加州计划的态度可以怎样描述？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>supportive</strong></p>\n<p>支持的</p>\n<p>B. <strong>ambiguous</strong></p>\n<p>含糊不明的</p>\n<p>C. <strong>tolerant</strong></p>\n<p>容忍的</p>\n<p>D. <strong>cautious</strong></p>\n<p>谨慎的</p>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27],[499,1393,43,25],[564,1394,31,22],[611,1393,60,26],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。\n\n> 原文参考：\n>\n> The need for such planning is increasingly urgent. Already, since 2010, drought and insects have killed over 100 million trees in California, most of them in 2016 alone, and wildfires have burned hundreds of thousands of acres.\n>\n> 开始精读：\n>\n> The need for such planning / is increasingly urgent. / Already, since 2010, / drought and insects have killed over 100 million trees in California, / most of them in 2016 alone, / and wildfires have burned hundreds of thousands of acres.\n>\n> 对这种规划的需要 / 越来越紧迫。 / 从2010年以来已经， / 干旱和昆虫杀死了加州超过一亿棵树， / 大部分仅在2016年， / 而山火烧过了数十万英亩。\n\n> 原文参考：\n>\n> The strategy also aims to ensure that carbon in woody material removed from the forests is locked away in the form of solid [xxx] or burned as [xxx] in vehicles that would otherwise run on [xxx] fuels. New research on transportation biofuels is already under way.\n>\n> 开始精读：\n>\n> The strategy also aims to ensure / that carbon in woody material / removed from the forests / is locked away in the form of solid [xxx] / or burned as [xxx] in vehicles / that would otherwise run on [xxx] fuels. / New research on transportation biofuels / is already under way.\n>\n> 这个策略还力图确保 / 木质材料中的碳 / 从森林移出的那些材料里的 / 以固态[xxx]的形式被锁存 / 或者作为[xxx]在车辆中燃烧 / 这些车辆否则会靠[xxx]燃料运转。 / 关于交通生物燃料的新研究 / 已经在进行。\n\n> 原文参考：\n>\n> State governments are well [xxx] to managing forests, but traditionally they’ve focused on wildlife, [xxx] and opportunities for [xxx]. Only recently have they come to see the vital part forests will have to play in storing carbon. California’s plan, which is expected to be finalized by the governor next year, should serve as a model.\n>\n> 开始精读：\n>\n> State governments are well [xxx] to managing forests, / but traditionally they’ve focused / on wildlife, [xxx] and opportunities for [xxx]. / Only recently have they come to see / the vital part forests will have to play / in storing carbon. / California’s plan, / which is expected to be finalized by the governor next year, / should serve as a model.\n>\n> 州政府对于管理森林很[xxx]， / 但传统上它们集中注意 / 在野生动物、[xxx]和[xxx]机会。 / 直到最近它们才开始看到 / 森林必须发挥的重要作用 / 在储存碳方面。 / 加州的计划， / 预计明年由州长最终确定的， / 应该起到榜样作用。\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写森林有好处又有挑战：吸碳能力受损，甚至可能排得多于吸得多 | 先说原来帮忙的也可能添乱 |\n| 第2段 | 用Thankfully引出出路：为长远碳汇调整眼下吸碳能力，并介绍加州带头 | 再说有条路可以走出去 |\n| 第3段 | 详细解释疏除与清理怎样让剩余树得到更多水，恢复吸碳能力并减少灾害损失 | 接着解释这条路为什么能走 |\n| 第4段 | 用加州旱情、虫害与山火的损失说明规划紧迫 | 补一个背景说明不能再拖 |\n| 第5段 | 交代处理面积、资金安排与高危地区的选择 | 再把怎么做和先做哪块说清 |\n| 第6段 | 补上移出森林的木材如何存碳或利用，避免只谈林内的树 | 接着补上剩下的一块怎么做 |\n| 第7段 | 把传统森林管理与储碳功能相接，明确说加州计划应成为榜样 | 最后说这套做法值得照着做 |\n\n---\n\n**The author’s attitude to California’s plan can best be described as ______.**","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<p>前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The need for such planning is increasingly urgent. Already, since 2010, drought and insects have killed over 100 million trees in California, most of them in 2016 alone, and wildfires have burned hundreds of thousands of acres.</p>\n<p>开始精读：</p>\n<p>The need for such planning / is increasingly urgent. / Already, since 2010, / drought and insects have killed over 100 million trees in California, / most of them in 2016 alone, / and wildfires have burned hundreds of thousands of acres.</p>\n<p>对这种规划的需要 / 越来越紧迫。 / 从2010年以来已经， / 干旱和昆虫杀死了加州超过一亿棵树， / 大部分仅在2016年， / 而山火烧过了数十万英亩。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The strategy also aims to ensure that carbon in woody material removed from the forests is locked away in the form of solid [xxx] or burned as [xxx] in vehicles that would otherwise run on [xxx] fuels. New research on transportation biofuels is already under way.</p>\n<p>开始精读：</p>\n<p>The strategy also aims to ensure / that carbon in woody material / removed from the forests / is locked away in the form of solid [xxx] / or burned as [xxx] in vehicles / that would otherwise run on [xxx] fuels. / New research on transportation biofuels / is already under way.</p>\n<p>这个策略还力图确保 / 木质材料中的碳 / 从森林移出的那些材料里的 / 以固态[xxx]的形式被锁存 / 或者作为[xxx]在车辆中燃烧 / 这些车辆否则会靠[xxx]燃料运转。 / 关于交通生物燃料的新研究 / 已经在进行。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>State governments are well [xxx] to managing forests, but traditionally they’ve focused on wildlife, [xxx] and opportunities for [xxx]. Only recently have they come to see the vital part forests will have to play in storing carbon. California’s plan, which is expected to be finalized by the governor next year, should serve as a model.</p>\n<p>开始精读：</p>\n<p>State governments are well [xxx] to managing forests, / but traditionally they’ve focused / on wildlife, [xxx] and opportunities for [xxx]. / Only recently have they come to see / the vital part forests will have to play / in storing carbon. / California’s plan, / which is expected to be finalized by the governor next year, / should serve as a model.</p>\n<p>州政府对于管理森林很[xxx]， / 但传统上它们集中注意 / 在野生动物、[xxx]和[xxx]机会。 / 直到最近它们才开始看到 / 森林必须发挥的重要作用 / 在储存碳方面。 / 加州的计划， / 预计明年由州长最终确定的， / 应该起到榜样作用。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先写森林有好处又有挑战：吸碳能力受损，甚至可能排得多于吸得多</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>用Thankfully引出出路：为长远碳汇调整眼下吸碳能力，并介绍加州带头</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>详细解释疏除与清理怎样让剩余树得到更多水，恢复吸碳能力并减少灾害损失</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用加州旱情、虫害与山火的损失说明规划紧迫</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>交代处理面积、资金安排与高危地区的选择</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补上移出森林的木材如何存碳或利用，避免只谈林内的树</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>把传统森林管理与储碳功能相接，明确说加州计划应成为榜样</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n","articleRects":[[182,752,746,29],[135,787,796,29],[135,821,720,28],[182,1030,748,29],[135,1065,795,29],[135,1100,795,29],[135,1134,294,30],[183,1169,747,29],[135,1204,795,29],[135,1239,795,29],[135,1274,796,29],[135,1308,303,29]],"questionRects":[[187,1139,728,29],[442,1393,44,27],[499,1393,43,25],[564,1394,31,22],[611,1393,60,26],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. supportive\n\n支持的\n\n#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果A是主旨，文章中心就应该是“作者支持加州的森林碳计划”。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 提出值得积极解决的森林问题 | 先说原来帮忙的也可能添乱 |\n| 第2段 | 肯定有可行出路并把加州引入 | 再说有条路可以走出去 |\n| 第3段 | 说明加州做法怎样带来多种好处 | 接着解释这条路为什么能走 |\n| 第4段 | 用严重损失说明推动计划必要 | 补一个背景说明不能再拖 |\n| 第5段 | 把实际安排作为落实方案来说明 | 再把怎么做和先做哪块说清 |\n| 第6段 | 继续补充方案处理木质材料的办法 | 接着补上剩下的一块怎么做 |\n| 第7段 | 明确表示计划能供其他地方参考 | 最后说这套做法值得照着做 |\n\nThankfully先把方案介绍为出路，随后用很大篇幅解释疏除的长期好处，并把灾害损失作为行动紧迫的理由。最后should serve as a model不只是允许实施，而是认为它可供参考。中间短期吸碳下降，是计划权衡的一部分，并未变成作者反对计划的理由。\n\n**支持的态度能否解释“出路”、多种好处与最后的榜样评价？**\n\n能。文章在解释怎样做成这件事，细节和困难都服务于说明方案，不改变最终肯定。\n\n**判断：A保留。**\n\n---\n\n**The author’s attitude to California’s plan can best be described as ______.**","html":"<h3>A. supportive</h3>\n<p>支持的</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“作者支持加州的森林碳计划”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出值得积极解决的森林问题</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>肯定有可行出路并把加州引入</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明加州做法怎样带来多种好处</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用严重损失说明推动计划必要</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>把实际安排作为落实方案来说明</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续补充方案处理木质材料的办法</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>明确表示计划能供其他地方参考</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>Thankfully先把方案介绍为出路，随后用很大篇幅解释疏除的长期好处，并把灾害损失作为行动紧迫的理由。最后should serve as a model不只是允许实施，而是认为它可供参考。中间短期吸碳下降，是计划权衡的一部分，并未变成作者反对计划的理由。</p>\n<p><strong>支持的态度能否解释“出路”、多种好处与最后的榜样评价？</strong></p>\n<p>能。文章在解释怎样做成这件事，细节和困难都服务于说明方案，不改变最终肯定。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27],[499,1393,43,25]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"### B. ambiguous\n\n含糊不明的\n\n#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果B是主旨，文章中心就应该是“作者对计划态度含糊”。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 对森林问题的方向也不确定 | 先说原来帮忙的也可能添乱 |\n| 第2段 | 对计划是否有用不作明确表态 | 再说有条路可以走出去 |\n| 第3段 | 把好处与坏处同样铺开而不给倾向 | 接着解释这条路为什么能走 |\n| 第4段 | 用灾害材料进一步表达态度不明 | 补一个背景说明不能再拖 |\n| 第5段 | 对计划安排既不认可也不否定 | 再把怎么做和先做哪块说清 |\n| 第6段 | 补充材料仍无法看出赞否 | 接着补上剩下的一块怎么做 |\n| 第7段 | 最后继续保持难以判断的态度 | 最后说这套做法值得照着做 |\n\nambiguous要求赞否难以判定，但第2段的Thankfully、leading the way与结尾model都提供同方向评价。文章承认短期代价，接着却解释长期恢复机制，不能把呈现代价误当成没有立场。\n\n**一再给出积极理由并说应成为榜样，还能说作者态度含糊吗？**\n\n不能。条件和代价可以讨论，作者对计划的总体评价仍然明确。\n\n**判断：B排除。**\n\n---\n\n**The author’s attitude to California’s plan can best be described as ______.**","html":"<h3>B. ambiguous</h3>\n<p>含糊不明的</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“作者对计划态度含糊”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>对森林问题的方向也不确定</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>对计划是否有用不作明确表态</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把好处与坏处同样铺开而不给倾向</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用灾害材料进一步表达态度不明</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>对计划安排既不认可也不否定</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补充材料仍无法看出赞否</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后继续保持难以判断的态度</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>ambiguous要求赞否难以判定，但第2段的Thankfully、leading the way与结尾model都提供同方向评价。文章承认短期代价，接着却解释长期恢复机制，不能把呈现代价误当成没有立场。</p>\n<p><strong>一再给出积极理由并说应成为榜样，还能说作者态度含糊吗？</strong></p>\n<p>不能。条件和代价可以讨论，作者对计划的总体评价仍然明确。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27],[564,1394,31,22]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. tolerant\n\n容忍的\n\n#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果C是主旨，文章中心就应该是“作者只是容忍计划”。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 把加州计划作为不太理想但可接受的事情 | 先说原来帮忙的也可能添乱 |\n| 第2段 | 表示虽不欣赏也应给它一点空间 | 再说有条路可以走出去 |\n| 第3段 | 重点说明为什么可以勉强容忍它 | 接着解释这条路为什么能走 |\n| 第4段 | 借灾害背景解释容忍的理由 | 补一个背景说明不能再拖 |\n| 第5段 | 把执行安排看作不得已的折中 | 再把怎么做和先做哪块说清 |\n| 第6段 | 承认附带做法至少没有大害 | 接着补上剩下的一块怎么做 |\n| 第7段 | 最后仅表示允许它存在而不倡导 | 最后说这套做法值得照着做 |\n\ntolerant意味着可以接受，但未必认可或主张效仿。这里作者主动说明其机制、紧迫性和后续木材处理，还让它serve as a model。结尾已经超过“让它存在”的程度，C弱化了正面评价。\n\n**仅仅容忍，能解释为什么作者愿意把它作为别人的榜样吗？**\n\n不能。榜样意味着积极参考，全文也提供了支持它的具体理由。\n\n**判断：C排除。**\n\n---\n\n**The author’s attitude to California’s plan can best be described as ______.**","html":"<h3>C. tolerant</h3>\n<p>容忍的</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“作者只是容忍计划”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>把加州计划作为不太理想但可接受的事情</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>表示虽不欣赏也应给它一点空间</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>重点说明为什么可以勉强容忍它</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借灾害背景解释容忍的理由</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>把执行安排看作不得已的折中</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>承认附带做法至少没有大害</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后仅表示允许它存在而不倡导</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>tolerant意味着可以接受，但未必认可或主张效仿。这里作者主动说明其机制、紧迫性和后续木材处理，还让它serve as a model。结尾已经超过“让它存在”的程度，C弱化了正面评价。</p>\n<p><strong>仅仅容忍，能解释为什么作者愿意把它作为别人的榜样吗？</strong></p>\n<p>不能。榜样意味着积极参考，全文也提供了支持它的具体理由。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27],[611,1393,60,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. cautious\n\n谨慎的\n\n#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果D是主旨，文章中心就应该是“作者总体上谨慎观望”。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 提出计划可能存在的隐患 | 先说原来帮忙的也可能添乱 |\n| 第2段 | 对所谓出路先作明显保留 | 再说有条路可以走出去 |\n| 第3段 | 详细列出短期代价并质疑未来收益 | 接着解释这条路为什么能走 |\n| 第4段 | 借灾害提醒实施计划风险很大 | 补一个背景说明不能再拖 |\n| 第5段 | 强调规模与资金使成功难以判断 | 再把怎么做和先做哪块说清 |\n| 第6段 | 补充木材处理的不确定性 | 接着补上剩下的一块怎么做 |\n| 第7段 | 最后建议在证据不足时暂且观望 | 最后说这套做法值得照着做 |\n\ncautious容易与subtle balance、small share这些限制相联，但限制后面都接着具体处理办法。真正的谨慎结论应当保留对计划是否值得推行的疑问；结尾却直接建议作为榜样，没有收回前面的积极判断。\n\n**中间讲实施限制，就足以把结尾的明确肯定改成谨慎观望吗？**\n\n不能。限制被放在怎样推进计划的讨论里，最终态度仍是支持。\n\n**判断：D排除。**\n\n---\n\n**The author’s attitude to California’s plan can best be described as ______.**","html":"<h3>D. cautious</h3>\n<p>谨慎的</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“作者总体上谨慎观望”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出计划可能存在的隐患</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>对所谓出路先作明显保留</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>详细列出短期代价并质疑未来收益</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借灾害提醒实施计划风险很大</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>强调规模与资金使成功难以判断</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补充木材处理的不确定性</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后建议在证据不足时暂且观望</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>cautious容易与subtle balance、small share这些限制相联，但限制后面都接着具体处理办法。真正的谨慎结论应当保留对计划是否值得推行的疑问；结尾却直接建议作为榜样，没有收回前面的积极判断。</p>\n<p><strong>中间讲实施限制，就足以把结尾的明确肯定改成谨慎观望吗？</strong></p>\n<p>不能。限制被放在怎样推进计划的讨论里，最终态度仍是支持。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题结论\n\n**30. A. supportive**\n\n这句话就是本文后续做题的主旨底牌：\n\n**supportive / 支持的**\n\n---","html":"<h3>30题结论</h3>\n<p><strong>30. A. supportive</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>supportive / 支持的</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27],[499,1393,43,25],[564,1394,31,22],[611,1393,60,26],[679,1393,30,27]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查26题：A还是B？\n\n第一遍留下：\n\n- A. global climate change may get out of control\n- B. forests may become a [xxx] threat\n\n主旨底牌是：\n\n> **supportive**\n\n也就是：\n\n> 作者支持加州计划，认为它为森林吸碳问题提供了值得参考的应对办法。\n\n我们先把题干和两个选项接起来。\n\nA接回题干，是说全球气候变化可能失控；B接回题干，是说森林可能成为一种[xxx]威胁。第一遍末句出现森林排碳多于吸碳，既像是在说森林本身的风险，也让人想到更广的气候危机。因此留下A、B，没有仅凭B贴近原句就把A直接删掉。\n\n现在拿主旨来检查。\n\n先看B。全文既然把加州计划当成值得参考的做法，开头要引出的就是这种计划准备处理的具体麻烦：森林原本帮助吸碳，其功能却可能反转。B保留了forests这个主体，也保留may become的变化语气，能解释为什么后面马上转到怎样让森林继续当碳汇。\n\n再看A。全球气候变化失控是更大的判断，它没有说明为什么偏偏用森林来介绍“更难的挑战”。后文用相当篇幅论证一种管理方法能够改善森林状态，作者还明确支持该计划；把开头压成“全球失控”，就漏掉了这个可以针对森林采取行动的中心。\n\n回到第1段，emit more carbon than they absorb的主语始终是forests。B既能接住这一局部变化，也能接住全文赞成管理计划的原因。A可以是读者想到的更远担忧，却不是这组词在本篇里具体暗示的森林问题，因此最后选B。\n\n> **26题选B。**\n\n---","html":"<h2>回查26题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. global climate change may get out of control</li>\n<li>B. forests may become a [xxx] threat</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>supportive</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>作者支持加州计划，认为它为森林吸碳问题提供了值得参考的应对办法。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A接回题干，是说全球气候变化可能失控；B接回题干，是说森林可能成为一种[xxx]威胁。第一遍末句出现森林排碳多于吸碳，既像是在说森林本身的风险，也让人想到更广的气候危机。因此留下A、B，没有仅凭B贴近原句就把A直接删掉。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。全文既然把加州计划当成值得参考的做法，开头要引出的就是这种计划准备处理的具体麻烦：森林原本帮助吸碳，其功能却可能反转。B保留了forests这个主体，也保留may become的变化语气，能解释为什么后面马上转到怎样让森林继续当碳汇。</p>\n<p>再看A。全球气候变化失控是更大的判断，它没有说明为什么偏偏用森林来介绍“更难的挑战”。后文用相当篇幅论证一种管理方法能够改善森林状态，作者还明确支持该计划；把开头压成“全球失控”，就漏掉了这个可以针对森林采取行动的中心。</p>\n<p>回到第1段，emit more carbon than they absorb的主语始终是forests。B既能接住这一局部变化，也能接住全文赞成管理计划的原因。A可以是读者想到的更远担忧，却不是这组词在本篇里具体暗示的森林问题，因此最后选B。</p>\n<blockquote>\n<p><strong>26题选B。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[[183,196,747,29],[135,230,796,30],[135,265,789,30],[135,300,795,29],[135,335,297,29],[183,1169,747,29],[135,1204,795,29],[135,1239,795,29],[135,1274,796,29],[135,1308,303,29]],"questionRects":[[187,124,735,30],[187,167,25,24],[216,167,441,29],[187,124,735,30],[187,167,25,24],[215,205,367,37]],"scrollTarget":"auto","meta":{"kind":"review","qid":"26"}},{"section":"最终答案","raw":"## 最终答案：\n\n**26. B**\n\n**27. B**\n\n**28. D**\n\n**29. C**\n\n**30. A**","html":"<h2>最终答案：</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. B</strong></p>\n<p><strong>28. D</strong></p>\n<p><strong>29. C</strong></p>\n<p><strong>30. A</strong></p>\n","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"final"}}],"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>By saying “one of the harder challenges,” the author implies that ______.</strong></p>\n<p>作者说“更难的挑战之一”，暗示了什么？</p>\n<p>题型：局部推断题</p>\n<h2>27题题干</h2>\n<p><strong>To maintain forests as valuable “carbon sinks,” we may need to ______.</strong></p>\n<p>要让森林持续作为有价值的“碳汇”，我们可能需要怎样做？</p>\n<p>题型：细节题</p>\n<h2>28题题干</h2>\n<p><strong>California’s Forest Carbon Plan endeavors to ______.</strong></p>\n<p>加州森林碳计划努力做什么？</p>\n<p>题型：细节题</p>\n<h2>29题题干</h2>\n<p><strong>What is essential to California’s plan according to Paragraph 5?</strong></p>\n<p>根据第5段，加州计划中什么至关重要？</p>\n<p>题型：细节题</p>\n<h2>30题题干</h2>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<p>作者对加州计划的态度可以怎样描述？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Even as；But；so</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>Thankfully；urgent；vital</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>reducing；thin out；treat</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>capacity；risk；model</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>forests；carbon；plan</td>\n</tr>\n</tbody></table>\n<p>Forests give us shade, quiet and one of the harder challenges in the fight against climate change. Even as we humans count on forests to [xxx] up a good share of the carbon dioxide we produce, we are threatening their ability to do so. The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.</p>\n<p>Thankfully, there is a way out of this trap—but it involves striking a [xxx] balance. Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now. California is leading the way, as it does on so many climate efforts, in figuring out the details.</p>\n<p>The state’s proposed Forest Carbon Plan aims to double efforts to thin out young trees and clear [xxx] in parts of the forest. This temporarily lowers carbon-carrying capacity. But the remaining trees draw a greater share of the available moisture, so they grow and [xxx], restoring the forest’s capacity to pull carbon from the air. Healthy trees are also better able to [xxx] off insects. The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].</p>\n<p>The need for such planning is increasingly urgent. Already, since 2010, drought and insects have killed over 100 million trees in California, most of them in 2016 alone, and wildfires have burned hundreds of thousands of acres.</p>\n<p>California plans to treat 35,000 acres of forest a year by 2020, and 60,000 by 2030—financed from the [xxx] of the state’s emissions-permit [xxx]. That’s only a small share of the total [xxx] that could benefit, about half a million acres in all, so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n<p>The strategy also aims to ensure that carbon in woody material removed from the forests is locked away in the form of solid [xxx] or burned as [xxx] in vehicles that would otherwise run on [xxx] fuels. New research on transportation biofuels is already under way.</p>\n<p>State governments are well [xxx] to managing forests, but traditionally they’ve focused on wildlife, [xxx] and opportunities for [xxx]. Only recently have they come to see the vital part forests will have to play in storing carbon. California’s plan, which is expected to be finalized by the governor next year, should serve as a model.</p>\n<p>Forests give us shade, quiet / and one of the harder challenges / in the fight against climate change. / Even as we humans count on forests / to [xxx] up a good share of the carbon dioxide we produce, / we are threatening their ability to do so. / The climate change we are [xxx] / could one day leave us with forests / that emit more carbon than they absorb.</p>\n<p>Thankfully, there is a way out of this trap— / but it involves striking a [xxx] balance. / Helping forests [xxx] / as valuable “carbon sinks” long into the future / may require reducing their capacity to absorb carbon now. / California is leading the way, / as it does on so many climate efforts, / in figuring out the details.</p>\n<p>The state’s proposed Forest Carbon Plan / aims to double efforts / to thin out young trees and clear [xxx] / in parts of the forest. / This temporarily lowers carbon-carrying capacity. / But the remaining trees draw a greater share / of the available moisture, / so they grow and [xxx], / restoring the forest’s capacity / to pull carbon from the air. / Healthy trees are also better able to [xxx] off insects. / The landscape is [xxx] less easily burnable. / Even in the event of a fire, / fewer trees are [xxx].</p>\n<p>The need for such planning / is increasingly urgent. / Already, since 2010, / drought and insects have killed over 100 million trees in California, / most of them in 2016 alone, / and wildfires have burned hundreds of thousands of acres.</p>\n<p>California plans to treat 35,000 acres of forest a year / by 2020, / and 60,000 by 2030— / financed from the [xxx] / of the state’s emissions-permit [xxx]. / That’s only a small share / of the total [xxx] that could benefit, / about half a million acres in all, / so it will be vital to [xxx] areas / at greatest risk of fire or drought.</p>\n<p>The strategy also aims to ensure / that carbon in woody material / removed from the forests / is locked away in the form of solid [xxx] / or burned as [xxx] in vehicles / that would otherwise run on [xxx] fuels. / New research on transportation biofuels / is already under way.</p>\n<p>State governments are well [xxx] to managing forests, / but traditionally they’ve focused / on wildlife, [xxx] and opportunities for [xxx]. / Only recently have they come to see / the vital part forests will have to play / in storing carbon. / California’s plan, / which is expected to be finalized by the governor next year, / should serve as a model.</p>\n<p>森林给我们 shade, quiet / and one of the harder challenges / 在对抗气候变化的斗争中. / Even as we humans 依靠森林 / to [xxx] up a good share of the 二氧化碳 我们产生, / 我们正在威胁 它们的能力 to do so. / The climate change we are [xxx] / could 有一天 leave us with forests / that emit 更多碳 than 它们吸收.</p>\n<p>Thankfully, there is 一条出路 of this trap— / but it involves striking a [xxx] balance. / Helping forests [xxx] / as 有价值的 “carbon sinks” long into 未来 / may require reducing their capacity to 现在吸收碳. / California is 带头, / as it does on so many climate efforts, / in figuring out the details.</p>\n<p>The state’s proposed Forest Carbon Plan / aims to double efforts / to thin out 幼树 and clear [xxx] / in 森林的一些部分. / This 暂时降低 carbon-carrying capacity. / But 剩下的树 draw a greater share / of the available moisture, / so they grow and [xxx], / restoring the forest’s capacity / to pull carbon 从空气中. / 健康的树 are also better able to [xxx] off insects. / The landscape is [xxx] less easily burnable. / Even in the event of a fire, / 更少树木 are [xxx].</p>\n<p>The need for such planning / is 越来越紧迫. / Already, since 2010, / 干旱和昆虫 have killed over 100 million 加州的树, / most of them in 2016 alone, / and wildfires have burned hundreds of thousands of acres.</p>\n<p>加州计划 to treat 35,000 acres of forest 每年 / by 2020, / and 60,000 by 2030— / financed from the [xxx] / of the state’s emissions-permit [xxx]. / That’s 仅仅很小一份 / of the total [xxx] that 可能受益, / about half a million acres in all, / so it will be vital to [xxx] areas / at greatest risk of 火灾或干旱.</p>\n<p>这个策略 also aims to ensure / that 碳 in woody material / removed 从森林中 / is locked away in the form of solid [xxx] / or burned as [xxx] in 车辆 / that would otherwise run on [xxx] fuels. / 新研究 on transportation biofuels / is 已经 under way.</p>\n<p>州政府 are well [xxx] to 管理森林, / 但传统上 它们集中注意 / on 野生动物, [xxx] and opportunities for [xxx]. / 直到最近 have they come to see / 重要作用 forests will have to play / in 储存碳. / 加州的计划, / which is expected to be finalized by the governor next year, / 应该作为一个榜样.</p>\n<p>1、森林、气候变化、二氧化碳、它们的能力、有一天、更多碳、它们吸收。</p>\n<p>2、一条出路、有价值的、未来、现在吸收碳、带头。</p>\n<p>3、幼树、森林的一些部分、暂时降低、剩下的树、空气中、健康的树、更少树木。</p>\n<p>4、越来越紧迫、干旱和昆虫、加州的树。</p>\n<p>5、加州计划、每年、仅仅很小一份、可能受益、火灾或干旱。</p>\n<p>6、这个策略、碳、森林中、车辆、新研究。</p>\n<p>7、州政府、管理森林、野生动物、重要作用、储存碳、加州的计划、榜样。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与森林、气候变化有关；开头似乎看到二氧化碳、更多碳、它们吸收；中间又出现幼树、剩下的树、干旱和昆虫、火灾或干旱；结尾还看到州政府、储存碳、加州的计划、榜样。</p>\n<p>到这里还不能自然地说清楚：这些树、碳、面积和计划之间具体怎样相接。粗读时只要能判断“这篇大概围绕森林和碳”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先记住森林、碳和加州计划这些对象及大致位置。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<h2>26题</h2>\n<blockquote>\n<p>By saying “one of the harder challenges,” the author implies that ______.\n作者说“更难的挑战之一”，暗示了什么？</p>\n</blockquote>\n<p>题干直接引用one of the harder challenges，这组词在第1段。回到开头，把完整一段读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Forests give us shade, quiet and one of the harder challenges in the fight against climate change. Even as we humans count on forests to [xxx] up a good share of the carbon dioxide we produce, we are threatening their ability to do so. The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.</p>\n<p>开始精读：</p>\n<p>Forests give us shade, quiet / and one of the harder challenges / in the fight against climate change. / Even as we humans count on forests / to [xxx] up a good share of the carbon dioxide we produce, / we are threatening their ability to do so. / The climate change we are [xxx] / could one day leave us with forests / that emit more carbon than they absorb.</p>\n<p>森林给我们阴凉、安静 / 以及更难的挑战之一 / 在对抗气候变化的斗争中。 / 即使我们人类依靠森林 / 来[xxx]掉我们产生的二氧化碳中的很大一部分， / 我们却在威胁它们这样做的能力。 / 我们正在[xxx]的气候变化 / 有一天可能留给我们这样的森林 / 它们排出的碳多于吸收的碳。</p>\n</blockquote>\n<p>这里并列了森林带来的好处和挑战，后面解释人类依赖森林吸碳，却在威胁这种能力，最终可能出现排碳多于吸碳的森林。要看选项怎样表达这个风险。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. global climate change may get out of control</h3>\n<blockquote>\n<p>全球气候变化可能失去控制</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者是在暗示全球气候变化可能失控。</p>\n<p>A的get out of control说气候变化越来越难控制，和第1段emit more carbon than they absorb所呈现的风险有联系，所以回看段末。</p>\n<blockquote>\n<p>The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.</p>\n</blockquote>\n<p>emit more carbon than they absorb说明森林的碳收支可能反过来，get out of control则把风险推到整个气候变化。这个范围确实更大；但只看开头，人类破坏森林吸碳能力与气候风险增加也能联系，[xxx]所说的人类作用尚未读明白，目前还不能把失控的可能完全判掉。</p>\n<p><strong>仅凭这一段的森林风险，就能断定全球气候变化的失控可能绝对不存在吗？</strong></p>\n<p>还不能。A把风险推得更远，不过开头暂时没有把这个更远的可能说清，先保留A。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. forests may become a [xxx] threat</h3>\n<blockquote>\n<p>森林可能成为一种[xxx]威胁</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者是在暗示森林可能从帮助者变成一种[xxx]威胁。</p>\n<p>B的threat指向第1段emit more carbon，这里正好把森林的吸碳与排碳相比，所以回到末句看变化的主体。</p>\n<blockquote>\n<p>forests that emit more carbon than they absorb.</p>\n</blockquote>\n<p>emit more carbon的主体还是forests，而且后面接than they absorb，说明它们排出去的比吸进去的多。threat也把威胁放在森林身上，而不是把森林从句子里删掉。B中的[xxx]修饰威胁，但may become已经保留未来可能发生的语气。</p>\n<p><strong>B能否保留原文中发生吸碳、排碳变化的对象？</strong></p>\n<p>能。可以把B保留：原文说森林可能排得多于吸得多，B也把潜在的坏作用落在森林身上。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. people may misunderstand global warming</h3>\n<blockquote>\n<p>人们可能误解全球变暖</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者暗示挑战来自人们对全球变暖的误解。</p>\n<p>C的misunderstand讲认识出了问题，所以回到第1段we are threatening这句，对应着看人类对森林做的是怎样的事。</p>\n<blockquote>\n<p>we are threatening their ability to do so.</p>\n</blockquote>\n<p>we are threatening说人类正在威胁森林执行吸碳作用的能力，misunderstand却改成对全球变暖理解错了。一个在说影响森林的行为，一个在说人的认识。段末排碳超过吸碳也是现实功能变化，并没有把它解释为观念误会。</p>\n<p><strong>威胁森林吸碳能力，是否等于误解全球变暖？</strong></p>\n<p>不等于。C把现实行为与森林功能的关系换成了理解能力的问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. extreme weather conditions may arise</h3>\n<blockquote>\n<p>极端天气状况可能出现</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者暗示将出现极端天气。</p>\n<p>D的extreme weather conditions是在问天气结果，因此回看第1段forests that emit more carbon，比较段末留下的具体情形。</p>\n<blockquote>\n<p>could one day leave us with forests that emit more carbon than they absorb.</p>\n</blockquote>\n<p>forests that emit more carbon描写的是森林本身的碳收支，extreme weather conditions却变成某种极端天气。即使气候变化在一般常识中可能关联极端天气，这句话也没有把森林的吸排碳变化接到某种天气事件。题干引用的是森林为什么构成挑战，D换了直接被解释的对象。</p>\n<p><strong>段末具体描写的是极端天气，还是森林排出的碳多于吸收的碳？</strong></p>\n<p>后者。D跳到了另一个结果，没保留这段用森林解释挑战的具体内容。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A、B保留。B直接指森林可能变成威胁；A则把风险进一步放到了全球气候是否失控上，开头这一段还没有把两者彻底分开。</p>\n<h2>27题</h2>\n<blockquote>\n<p>To maintain forests as valuable “carbon sinks,” we may need to ______.\n要让森林持续作为有价值的“碳汇”，我们可能需要怎样做？</p>\n</blockquote>\n<p>题干中的carbon sinks在第2段直接出现。回到这一段，从出路读到加州的做法。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Thankfully, there is a way out of this trap—but it involves striking a [xxx] balance. Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now. California is leading the way, as it does on so many climate efforts, in figuring out the details.</p>\n<p>开始精读：</p>\n<p>Thankfully, there is a way out of this trap— / but it involves striking a [xxx] balance. / Helping forests [xxx] / as valuable “carbon sinks” long into the future / may require reducing their capacity to absorb carbon now. / California is leading the way, / as it does on so many climate efforts, / in figuring out the details.</p>\n<p>谢天谢地，有一条路走出这个陷阱—— / 但它涉及取得一种[xxx]的平衡。 / 帮助森林[xxx] / 作为有价值的“碳汇”一直延续到未来 / 可能需要现在减少它们吸收碳的能力。 / 加州正在带头， / 就像它在许多气候行动上做的那样， / 弄清其中细节。</p>\n</blockquote>\n<p>这句把long into the future与now放在两端：为了未来保持碳汇价值，may require后面写reducing吸收碳的能力。空格要补的是现在可能需要做什么。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. preserve the [xxx] of species in them</h3>\n<blockquote>\n<p>保留其中物种的[xxx]</p>\n</blockquote>\n<p>把A接回题干，它说的是：维持碳汇需要保留森林中物种的[xxx]。</p>\n<p>A的species谈物种，因此回到第2段capacity to absorb carbon，对应着看句子要调整的是哪一种东西。</p>\n<blockquote>\n<p>Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now.</p>\n</blockquote>\n<p>capacity to absorb carbon是吸收碳的能力，species指物种。A虽然也谈森林，但把调整对象从碳吸收能力换成物种的某种[xxx]。原句没有列物种种类，也没有通过保留不同物种解释未来碳汇的维持。</p>\n<p><strong>保持碳吸收功能的今昔安排，等于保留物种的某种特征吗？</strong></p>\n<p>不等于。两者讨论的对象不同；原句明确把require接在减少当前吸碳能力上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. lower their present carbon-absorbing capacity</h3>\n<blockquote>\n<p>降低它们目前的吸碳能力</p>\n</blockquote>\n<p>把B接回题干，它说的是：维持未来的碳汇，可能需要降低森林目前吸碳的能力。</p>\n<p>B的present carbon-absorbing capacity与第2段capacity to absorb carbon now意思一样，所以回到may require后面的动作。</p>\n<blockquote>\n<p>may require reducing their capacity to absorb carbon now.</p>\n</blockquote>\n<p>capacity to absorb carbon now被reducing支配，present carbon-absorbing capacity也被lower支配。now与present限定相同的时间，都指当前，而题干的maintain放在更长期目标下。B保留了“现在少一些、服务以后”的安排，没有误写成永远降低森林的功能。</p>\n<p><strong>B能不能保留原文中现在与未来的安排？</strong></p>\n<p>能。可以保留B：它降低的是当前吸碳能力，题干问的仍是维持长期碳汇。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. accelerate the growth of young trees</h3>\n<blockquote>\n<p>加速幼树生长</p>\n</blockquote>\n<p>把C接回题干，它说的是：维持碳汇需要加快幼树的生长。</p>\n<p>C的accelerate the growth特别指向young trees，第3段开头就有这种树。接着把这一段读全，看看计划对幼树采取什么动作。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The state’s proposed Forest Carbon Plan aims to double efforts to thin out young trees and clear [xxx] in parts of the forest. This temporarily lowers carbon-carrying capacity. But the remaining trees draw a greater share of the available moisture, so they grow and [xxx], restoring the forest’s capacity to pull carbon from the air. Healthy trees are also better able to [xxx] off insects. The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].</p>\n<p>开始精读：</p>\n<p>The state’s proposed Forest Carbon Plan / aims to double efforts / to thin out young trees and clear [xxx] / in parts of the forest. / This temporarily lowers carbon-carrying capacity. / But the remaining trees draw a greater share / of the available moisture, / so they grow and [xxx], / restoring the forest’s capacity / to pull carbon from the air. / Healthy trees are also better able to [xxx] off insects. / The landscape is [xxx] less easily burnable. / Even in the event of a fire, / fewer trees are [xxx].</p>\n<p>该州提出的森林碳计划 / 力图加倍努力 / 去疏除幼树、清理[xxx] / 在森林的一些部分。 / 这暂时降低承载碳的能力。 / 但剩下的树获得更大份额 / 可利用水分的， / 所以它们生长并[xxx]， / 恢复森林的能力 / 从空气中吸走碳。 / 健康的树也更能[xxx]掉昆虫。 / 这片地带被[xxx]得不那么容易燃烧。 / 即便发生火灾， / 也有更少树木被[xxx]。</p>\n</blockquote>\n<p>读完这一段，再把accelerate the growth和young trees放在一起：</p>\n<blockquote>\n<p>aims to double efforts to thin out young trees and clear [xxx] in parts of the forest.</p>\n</blockquote>\n<blockquote>\n<p>But the remaining trees draw a greater share of the available moisture, so they grow and [xxx]</p>\n</blockquote>\n<p>young trees在thin out之后，指计划要疏除的一部分幼树；accelerate the growth却要求加速它们生长。后面grow的主体是remaining trees，即疏除后留下的树。C把对剩余树木的有利结果转给计划正在减少的幼树，换了对象与动作。</p>\n<p><strong>文中增长得更好的是全部幼树，还是疏除后留下的树？</strong></p>\n<p>后者。对young trees的直接动作是thin out，C却改成加速它们的生长。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. strike a balance among different plants</h3>\n<blockquote>\n<p>在不同植物之间取得平衡</p>\n</blockquote>\n<p>把D接回题干，它说的是：维持碳汇需要在各种植物之间取得平衡。</p>\n<p>D的different plants看起来也能接balance，所以回到第2段long into the future与now，把这个平衡的两端对应起来。</p>\n<blockquote>\n<p>as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now.</p>\n</blockquote>\n<p>long into the future对应长期碳汇，now对应当前吸碳能力；这是不同时间上的取舍。different plants却把两端改成不同植物。第3段的疏树说明怎样实现这种安排，也没有把第2段的balance改为物种之间的均衡。</p>\n<p><strong>原文的平衡主要放在不同时间的吸碳功能，还是不同植物之间？</strong></p>\n<p>前者。D只拿住balance，却换掉了原文解释的两端。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。原文把未来碳汇价值与当前吸碳能力放在一起；C把剩余树木的结果转给幼树，A、D则换成了物种或植物之间的关系。</p>\n<h2>28题</h2>\n<blockquote>\n<p>California’s Forest Carbon Plan endeavors to ______.\n加州森林碳计划努力做什么？</p>\n</blockquote>\n<p>题干问Forest Carbon Plan，第3段就是这项计划的具体做法。上一题已经把整段读完，这里回看该段开头的aims to。</p>\n<p>计划的直接动作是thin out young trees、clear [xxx]，范围是parts of the forest。后面生长、抗虫和不易燃烧，是留下的树和环境因此获得的效果。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. restore its forests quickly after wildfires</h3>\n<blockquote>\n<p>山火后迅速恢复森林</p>\n</blockquote>\n<p>把A接回题干，它说的是：计划是在山火之后快速重建森林。</p>\n<p>A的after wildfires说灾后行动，所以回到第3段Even in the event of a fire，把火灾与计划实施的先后对应起来。</p>\n<blockquote>\n<p>The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].</p>\n</blockquote>\n<p>Even in the event of a fire说即便后来发生火灾，受影响的树也更少；after wildfires却把计划放在火灾发生之后。less easily burnable也说明是在提高发生大火前的抵抗能力。A把预先管理减少损失，改成了灾后快速恢复。</p>\n<p><strong>“即便发生火灾，损失较少”与“火灾后迅速恢复”，时间顺序相同吗？</strong></p>\n<p>不是。前者说明事前管理带来的抵抗能力，后者是灾后修复，A改变了行动时间。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. [xxx] more drought-resistant trees</h3>\n<blockquote>\n<p>[xxx]更多耐旱树木</p>\n</blockquote>\n<p>把B接回题干，它说的是：计划要[xxx]更多能抗旱的树木。</p>\n<p>B的more drought-resistant trees强调更多耐旱树，对应着回看第3段the remaining trees，辨认计划是在增加树，还是让留下的树获得更多水分。</p>\n<blockquote>\n<p>But the remaining trees draw a greater share of the available moisture, so they grow and [xxx]</p>\n</blockquote>\n<p>the remaining trees是疏除之后留下来的树，more drought-resistant trees则转成更多耐旱树。原文的方法是减少竞争，让现有树分享更多水分，并没有把对象换成一种新培育的耐旱树。B里的[xxx]再怎样修饰行动，more仍与原文先疏除再让剩下的树受益不同。</p>\n<p><strong>计划是在增加耐旱树的数量，还是改善留下的树得到水分的条件？</strong></p>\n<p>后者。B把留树、减竞争的做法，改成了增加某种耐旱树木。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. find more effective ways to kill insects</h3>\n<blockquote>\n<p>寻找更有效的杀虫办法</p>\n</blockquote>\n<p>把C接回题干，它说的是：计划以寻找新的高效杀虫方法为目标。</p>\n<p>C的ways to kill insects与第3段昆虫那句有关，所以回到Healthy trees，看应对昆虫的是谁。</p>\n<blockquote>\n<p>Healthy trees are also better able to [xxx] off insects.</p>\n</blockquote>\n<p>Healthy trees是这句的主体，表示树更健康之后更能应对昆虫；ways to kill insects却把计划写成专门寻找杀虫技术。also把抗虫放在前面疏树、生长之后，是附带收益之一。C将树的能力变成了计划研究新方法的目标。</p>\n<p><strong>树更健康、更能应对昆虫，就是在研究更有效的杀虫方法吗？</strong></p>\n<p>不等于。C改变了动作主体，也把一项效果当成计划本身的措施。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. reduce the density of some of its forests</h3>\n<blockquote>\n<p>降低部分森林的密度</p>\n</blockquote>\n<p>把D接回题干，它说的是：计划要让一部分森林中的树木不那么密。</p>\n<p>D的reduce the density对应第3段thin out young trees，所以回到计划首句，再确认是否把范围扩大到全部森林。</p>\n<blockquote>\n<p>aims to double efforts to thin out young trees and clear [xxx] in parts of the forest.</p>\n</blockquote>\n<p>thin out young trees说把一些幼树疏除，reduce the density也说降低密度。parts of the forest与some of its forests都保留部分范围。D概括的是计划首先采取的措施，后面留下的树得到更多水、抗虫和较少燃烧，才是措施之后的结果。</p>\n<p><strong>D是否保留了疏除这一动作和部分森林这一范围？</strong></p>\n<p>能。它没有换成培育树种、杀虫技术或灾后重建，直接接住计划首句。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>D保留。计划先疏除、清理；其他选项分别把它改成灾后恢复、增加耐旱树或研究杀虫办法。</p>\n<h2>29题</h2>\n<blockquote>\n<p>What is essential to California’s plan according to Paragraph 5?\n根据第5段，加州计划中什么至关重要？</p>\n</blockquote>\n<p>题干已经指定Paragraph 5。直接回到第5段，连着读面积、资金以及最后的vital。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>California plans to treat 35,000 acres of forest a year by 2020, and 60,000 by 2030—financed from the [xxx] of the state’s emissions-permit [xxx]. That’s only a small share of the total [xxx] that could benefit, about half a million acres in all, so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n<p>开始精读：</p>\n<p>California plans to treat 35,000 acres of forest a year / by 2020, / and 60,000 by 2030— / financed from the [xxx] / of the state’s emissions-permit [xxx]. / That’s only a small share / of the total [xxx] that could benefit, / about half a million acres in all, / so it will be vital to [xxx] areas / at greatest risk of fire or drought.</p>\n<p>加州计划每年处理三万五千英亩森林 / 到2020年时， / 到2030年则为六万英亩—— / 资金来自[xxx] / 该州排放许可[xxx]的。 / 那只是很小的一份 / 在可能受益的全部[xxx]中， / 总共约五十万英亩， / 所以至关重要的是去[xxx]那些地区 / 火灾或干旱风险最大的。</p>\n</blockquote>\n<p>前面列出每年能处理的面积，随后说相对全部可能受益面积，这只是小份额。so引出的vital因此接在高风险地区上，要看四项中哪项保留了资源有限时的处理次序。</p>\n<p>接下来按A—D逐项看。</p>\n<h3>A. To obtain enough financial support.</h3>\n<blockquote>\n<p>得到足够资金支持</p>\n</blockquote>\n<p>把A接回题干，它说的是：计划的关键是先获得足够的资金支持。</p>\n<p>A的obtain enough financial support与第5段资金说明对应，所以回看financed from所在的句子，再接最后的so。</p>\n<blockquote>\n<p>financed from the [xxx] of the state’s emissions-permit [xxx].</p>\n</blockquote>\n<blockquote>\n<p>That’s only a small share of the total [xxx] that could benefit, about half a million acres in all, so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n</blockquote>\n<p>financed from已经交代钱从哪里来，obtain enough financial support却把尚待取得足够资金当成这里的关键。so前直接比较的是处理面积与全部受益面积，so后再指定风险最大的地区。A把背景中的资金说明，换成面积限制所引出的行动重点。</p>\n<p><strong>vital这一判断是接在筹钱困难后面，还是接在能处理的面积只占小份额后面？</strong></p>\n<p>后者。钱的来路已经说明，最后重点落在有限覆盖面积之下先处理哪些地方。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. To carry it out before the year of 2020.</h3>\n<blockquote>\n<p>在2020年以前把它实施完</p>\n</blockquote>\n<p>把B接回题干，它说的是：计划关键是必须在2020年前完成实施。</p>\n<p>B的before the year of 2020涉及期限，所以回到第5段60,000 by 2030，把两个年份对应起来。</p>\n<blockquote>\n<p>California plans to treat 35,000 acres of forest a year by 2020, and 60,000 by 2030</p>\n</blockquote>\n<p>60,000 by 2030说明2030年还要提高每年处理规模，before the year of 2020却把2020当成整个计划必须完成的截止点。原文a year说的是年度处理能力，而不是在那个年份之前把全部森林处理完。</p>\n<p><strong>2030年仍有年度处理目标，能说整个计划必须在2020年前做完吗？</strong></p>\n<p>不能。B把分阶段的规模目标改成了整体截止时间。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. To handle the areas in serious danger first.</h3>\n<blockquote>\n<p>先处理处于严重危险中的地区</p>\n</blockquote>\n<p>把C接回题干，它说的是：计划关键是优先处理风险严重的地区。</p>\n<p>C的in serious danger first与第5段at greatest risk意思对应，所以回到vital后面，看哪些地区被特别点出来。</p>\n<blockquote>\n<p>so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n</blockquote>\n<p>at greatest risk明确指风险最高的地区，in serious danger first保留同一对象，其中first进一步回答了面积有限时怎样安排：前面只有small share能得到处理，因此把有限处理量先给最危险的区域，能接住so的因果。这里不是说所有地方同时处理，也不是只要求钱到位。</p>\n<p><strong>面积只够覆盖一小部分时，C的先处理高危地区能否接住句末的重点？</strong></p>\n<p>能。它同时保留了被特别点名的高危地区与资源有限所需要的先后选择。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. To [xxx] the emissions-permit auctions.</h3>\n<blockquote>\n<p>去[xxx]排放许可拍卖</p>\n</blockquote>\n<p>把D接回题干，它说的是：计划关键是对排放许可拍卖做某种[xxx]处理。</p>\n<p>D的emissions-permit auctions指向本段的资金来源，但题目问essential，所以回到第5段areas at greatest risk这句，看最后被强调的对象。</p>\n<blockquote>\n<p>so it will be vital to [xxx] areas at greatest risk of fire or drought.</p>\n</blockquote>\n<p>areas at greatest risk是森林区域，emissions-permit auctions则是筹资活动。最后[xxx]后面的对象仍然是风险最大的地区；D也有一个[xxx]，但它支配的是拍卖。即使两处都不认识动词，也不能把作用对象从森林地区换成拍卖机制。</p>\n<p><strong>vital后面的动作指向高风险地区，能把动作对象改成排放许可拍卖吗？</strong></p>\n<p>不能。两个对象明确不同，D停在资金来源，没接到段末的实施重点。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C保留。有限的覆盖面积引出对高危地区的优先处理；A、D停在资金背景，B误读了年度目标和年份。</p>\n<h2>30题</h2>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<p>作者对加州计划的态度可以怎样描述？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>supportive</strong></p>\n<p>支持的</p>\n<p>B. <strong>ambiguous</strong></p>\n<p>含糊不明的</p>\n<p>C. <strong>tolerant</strong></p>\n<p>容忍的</p>\n<p>D. <strong>cautious</strong></p>\n<p>谨慎的</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<p>前面还有几段只粗读过。现在把它们从头读完，再看整篇怎么连起来。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The need for such planning is increasingly urgent. Already, since 2010, drought and insects have killed over 100 million trees in California, most of them in 2016 alone, and wildfires have burned hundreds of thousands of acres.</p>\n<p>开始精读：</p>\n<p>The need for such planning / is increasingly urgent. / Already, since 2010, / drought and insects have killed over 100 million trees in California, / most of them in 2016 alone, / and wildfires have burned hundreds of thousands of acres.</p>\n<p>对这种规划的需要 / 越来越紧迫。 / 从2010年以来已经， / 干旱和昆虫杀死了加州超过一亿棵树， / 大部分仅在2016年， / 而山火烧过了数十万英亩。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The strategy also aims to ensure that carbon in woody material removed from the forests is locked away in the form of solid [xxx] or burned as [xxx] in vehicles that would otherwise run on [xxx] fuels. New research on transportation biofuels is already under way.</p>\n<p>开始精读：</p>\n<p>The strategy also aims to ensure / that carbon in woody material / removed from the forests / is locked away in the form of solid [xxx] / or burned as [xxx] in vehicles / that would otherwise run on [xxx] fuels. / New research on transportation biofuels / is already under way.</p>\n<p>这个策略还力图确保 / 木质材料中的碳 / 从森林移出的那些材料里的 / 以固态[xxx]的形式被锁存 / 或者作为[xxx]在车辆中燃烧 / 这些车辆否则会靠[xxx]燃料运转。 / 关于交通生物燃料的新研究 / 已经在进行。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>State governments are well [xxx] to managing forests, but traditionally they’ve focused on wildlife, [xxx] and opportunities for [xxx]. Only recently have they come to see the vital part forests will have to play in storing carbon. California’s plan, which is expected to be finalized by the governor next year, should serve as a model.</p>\n<p>开始精读：</p>\n<p>State governments are well [xxx] to managing forests, / but traditionally they’ve focused / on wildlife, [xxx] and opportunities for [xxx]. / Only recently have they come to see / the vital part forests will have to play / in storing carbon. / California’s plan, / which is expected to be finalized by the governor next year, / should serve as a model.</p>\n<p>州政府对于管理森林很[xxx]， / 但传统上它们集中注意 / 在野生动物、[xxx]和[xxx]机会。 / 直到最近它们才开始看到 / 森林必须发挥的重要作用 / 在储存碳方面。 / 加州的计划， / 预计明年由州长最终确定的， / 应该起到榜样作用。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先写森林有好处又有挑战：吸碳能力受损，甚至可能排得多于吸得多</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>用Thankfully引出出路：为长远碳汇调整眼下吸碳能力，并介绍加州带头</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>详细解释疏除与清理怎样让剩余树得到更多水，恢复吸碳能力并减少灾害损失</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用加州旱情、虫害与山火的损失说明规划紧迫</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>交代处理面积、资金安排与高危地区的选择</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补上移出森林的木材如何存碳或利用，避免只谈林内的树</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>把传统森林管理与储碳功能相接，明确说加州计划应成为榜样</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<h3>A. supportive</h3>\n<p>支持的</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“作者支持加州的森林碳计划”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出值得积极解决的森林问题</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>肯定有可行出路并把加州引入</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明加州做法怎样带来多种好处</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用严重损失说明推动计划必要</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>把实际安排作为落实方案来说明</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续补充方案处理木质材料的办法</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>明确表示计划能供其他地方参考</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>Thankfully先把方案介绍为出路，随后用很大篇幅解释疏除的长期好处，并把灾害损失作为行动紧迫的理由。最后should serve as a model不只是允许实施，而是认为它可供参考。中间短期吸碳下降，是计划权衡的一部分，并未变成作者反对计划的理由。</p>\n<p><strong>支持的态度能否解释“出路”、多种好处与最后的榜样评价？</strong></p>\n<p>能。文章在解释怎样做成这件事，细节和困难都服务于说明方案，不改变最终肯定。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<h3>B. ambiguous</h3>\n<p>含糊不明的</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“作者对计划态度含糊”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>对森林问题的方向也不确定</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>对计划是否有用不作明确表态</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把好处与坏处同样铺开而不给倾向</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用灾害材料进一步表达态度不明</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>对计划安排既不认可也不否定</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补充材料仍无法看出赞否</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后继续保持难以判断的态度</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>ambiguous要求赞否难以判定，但第2段的Thankfully、leading the way与结尾model都提供同方向评价。文章承认短期代价，接着却解释长期恢复机制，不能把呈现代价误当成没有立场。</p>\n<p><strong>一再给出积极理由并说应成为榜样，还能说作者态度含糊吗？</strong></p>\n<p>不能。条件和代价可以讨论，作者对计划的总体评价仍然明确。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<h3>C. tolerant</h3>\n<p>容忍的</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“作者只是容忍计划”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>把加州计划作为不太理想但可接受的事情</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>表示虽不欣赏也应给它一点空间</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>重点说明为什么可以勉强容忍它</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借灾害背景解释容忍的理由</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>把执行安排看作不得已的折中</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>承认附带做法至少没有大害</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后仅表示允许它存在而不倡导</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>tolerant意味着可以接受，但未必认可或主张效仿。这里作者主动说明其机制、紧迫性和后续木材处理，还让它serve as a model。结尾已经超过“让它存在”的程度，C弱化了正面评价。</p>\n<p><strong>仅仅容忍，能解释为什么作者愿意把它作为别人的榜样吗？</strong></p>\n<p>不能。榜样意味着积极参考，全文也提供了支持它的具体理由。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<h3>D. cautious</h3>\n<p>谨慎的</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“作者总体上谨慎观望”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>提出计划可能存在的隐患</td>\n<td>先说原来帮忙的也可能添乱</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>对所谓出路先作明显保留</td>\n<td>再说有条路可以走出去</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>详细列出短期代价并质疑未来收益</td>\n<td>接着解释这条路为什么能走</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借灾害提醒实施计划风险很大</td>\n<td>补一个背景说明不能再拖</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>强调规模与资金使成功难以判断</td>\n<td>再把怎么做和先做哪块说清</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补充木材处理的不确定性</td>\n<td>接着补上剩下的一块怎么做</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后建议在证据不足时暂且观望</td>\n<td>最后说这套做法值得照着做</td>\n</tr>\n</tbody></table>\n<p>cautious容易与subtle balance、small share这些限制相联，但限制后面都接着具体处理办法。真正的谨慎结论应当保留对计划是否值得推行的疑问；结尾却直接建议作为榜样，没有收回前面的积极判断。</p>\n<p><strong>中间讲实施限制，就足以把结尾的明确肯定改成谨慎观望吗？</strong></p>\n<p>不能。限制被放在怎样推进计划的讨论里，最终态度仍是支持。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<h3>30题结论</h3>\n<p><strong>30. A. supportive</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>supportive / 支持的</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查26题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. global climate change may get out of control</li>\n<li>B. forests may become a [xxx] threat</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>supportive</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>作者支持加州计划，认为它为森林吸碳问题提供了值得参考的应对办法。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A接回题干，是说全球气候变化可能失控；B接回题干，是说森林可能成为一种[xxx]威胁。第一遍末句出现森林排碳多于吸碳，既像是在说森林本身的风险，也让人想到更广的气候危机。因此留下A、B，没有仅凭B贴近原句就把A直接删掉。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。全文既然把加州计划当成值得参考的做法，开头要引出的就是这种计划准备处理的具体麻烦：森林原本帮助吸碳，其功能却可能反转。B保留了forests这个主体，也保留may become的变化语气，能解释为什么后面马上转到怎样让森林继续当碳汇。</p>\n<p>再看A。全球气候变化失控是更大的判断，它没有说明为什么偏偏用森林来介绍“更难的挑战”。后文用相当篇幅论证一种管理方法能够改善森林状态，作者还明确支持该计划；把开头压成“全球失控”，就漏掉了这个可以针对森林采取行动的中心。</p>\n<p>回到第1段，emit more carbon than they absorb的主语始终是forests。B既能接住这一局部变化，也能接住全文赞成管理计划的原因。A可以是读者想到的更远担忧，却不是这组词在本篇里具体暗示的森林问题，因此最后选B。</p>\n<blockquote>\n<p><strong>26题选B。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. B</strong></p>\n<p><strong>28. D</strong></p>\n<p><strong>29. C</strong></p>\n<p><strong>30. A</strong></p>\n","analysisStartIndex":38,"articleImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDsAAAXkCAIAAABLzpc7AAEAAElEQVR4nOzddVwU+f848PcWS0sqgoCAgUgICGIgdmFhYnd3nHFnnGfXnXGKdXaArVgYWCgGKoIgICAl3bFszvz+eH1ufvNdFFbFc897Pf/gwc7Ozryn3jOvdw2HpmmCEEIIIYQQQmqJ+70TgBBCCCGEEEKfhBELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGLEghBBCCCGE1BdGLAghhBBCCCH1hRELQgghhBBCSH1hxIIQQgghhBBSXxixIIQQQgghhNQXRiwIIYQQQggh9YURC0IIIYQQQkh9YcSCEEIIIYQQUl8YsSCEEEIIIYTUF0YsCCGEEEIIIfWFEQtCCCGEEEJIfWHEghBCCCGEEFJfGL function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}
function centerRight(){const el=document.getElementById('onlyCurrent');if(!el)return;combined.style.paddingTop='30px';combined.style.paddingBottom='60px';requestAnimationFrame(()=>{const h=el.getBoundingClientRect().height,ph=rightPane.clientHeight;if(h<ph-70){const pad=Math.max(30,Math.floor((ph-h)/2));combined.style.paddingTop=pad+'px';combined.style.paddingBottom=pad+'px'}rightPane.scrollTo({top:0,behavior:'smooth'})})}
function setControls(){document.getElementById('prev').disabled=fullMode||idx<0;document.getElementById('next').disabled=fullMode||idx>=DATA.steps.length-1||!ready;document.getElementById('reset').disabled=fullMode;document.getElementById('jump').disabled=fullMode;const t=document.getElementById('toggleAll');t.textContent=fullMode?'返回交互':'显示全部';t.classList.toggle('active',fullMode)}
function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;
let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+15);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-15);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
setTimeout(()=>applyZoom(zoomLevel),60);
const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
</script></body></html>
