<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"questionTop","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**By saying “one of the harder challenges,” the author implies that ______.**\n\n作者说“更难的挑战之一”，暗示了什么？\n\n题型：局部推断题","html":"<h2>26题题干</h2>\n<p><strong>By saying “one of the harder challenges,” the author implies that ______.</strong></p>\n<p>作者说“更难的挑战之一”，暗示了什么？</p>\n<p>题型：局部推断题</p>\n","articleRects":[],"questionRects":[[187,124,735,30],[187,167,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**To maintain forests as valuable “carbon sinks,” we may need to ______.**\n\n要让森林持续作为有价值的“碳汇”，我们可能需要怎样做？\n\n题型：细节题","html":"<h2>27题题干</h2>\n<p><strong>To maintain forests as valuable “carbon sinks,” we may need to ______.</strong></p>\n<p>要让森林持续作为有价值的“碳汇”，我们可能需要怎样做？</p>\n<p>题型：细节题</p>\n","articleRects":[],"questionRects":[[187,377,724,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**California’s Forest Carbon Plan endeavors to ______.**\n\n加州森林碳计划努力做什么？\n\n题型：细节题","html":"<h2>28题题干</h2>\n<p><strong>California’s Forest Carbon Plan endeavors to ______.</strong></p>\n<p>加州森林碳计划努力做什么？</p>\n<p>题型：细节题</p>\n","articleRects":[],"questionRects":[[187,632,523,28],[187,675,25,24]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**What is essential to California’s plan according to Paragraph 5?**\n\n根据第5段，加州计划中什么至关重要？\n\n题型：细节题","html":"<h2>29题题干</h2>\n<p><strong>What is essential to California’s plan according to Paragraph 5?</strong></p>\n<p>根据第5段，加州计划中什么至关重要？</p>\n<p>题型：细节题</p>\n","articleRects":[],"questionRects":[[187,885,625,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**The author’s attitude to California’s plan can best be described as ______.**\n\n作者对加州计划的态度可以怎样描述？\n\n题型：全文作者观点 / 全文主旨题","html":"<h2>30题题干</h2>\n<p><strong>The author’s attitude to California’s plan can best be described as ______.</strong></p>\n<p>作者对加州计划的态度可以怎样描述？</p>\n<p>题型：全文作者观点 / 全文主旨题</p>\n","articleRects":[],"questionRects":[[187,1139,728,29],[442,1393,44,27]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Even as；But；so |\n| 态度词 / 评价词 | 先抓个大概好坏 | Thankfully；urgent；vital |\n| 动作词 | 先看谁做了什么 | reducing；thin out；treat |\n| 结果词 | 看最后出了什么事 | capacity；risk；model |\n| 重复主题词 | 大概知道老在说什么 | forests；carbon；plan |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，只保留在前面的英文原文与意群层，不写进粗读结果。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Even as；But；so</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>Thankfully；urgent；vital</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>reducing；thin out；treat</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>capacity；risk；model</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>forests；carbon；plan</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"} 相接。粗读时只要能判断“这篇大概围绕森林和碳”，并知道这些信息大约出现在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先记住森林、碳和加州计划这些对象及大致位置。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与森林、气候变化有关；开头似乎看到二氧化碳、更多碳、它们吸收；中间又出现幼树、剩下的树、干旱和昆虫、火灾或干旱；结尾还看到州政府、储存碳、加州的计划、榜样。</p>\n<p>到这里还不能自然地说清楚：这些树、碳、面积和计划之间具体怎样相接。粗读时只要能判断“这篇大概围绕森林和碳”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先记住森林、碳和加州计划这些对象及大致位置。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> By saying “one of the harder challenges,” the author implies that ______.\n> 作者说“更难的挑战之一”，暗示了什么？\n\n题干直接引用one of the harder challenges，这组词在第1段。回到开头，把完整一段读完。\n\n> 原文参考：\n>\n> Forests give us shade, quiet and one of the harder challenges in the fight against climate change. Even as we humans count on forests to [xxx] up a good share of the carbon dioxide we produce, we are threatening their ability to do so. The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.\n>\n> 开始精读：\n>\n> Forests give us shade, quiet / and one of the harder challenges / in the fight against climate change. / Even as we humans count on forests / to [xxx] up a good share of the carbon dioxide we produce, / we are threatening their ability to do so. / The climate change we are [xxx] / could one day leave us with forests / that emit more carbon than they absorb.\n>\n> 森林给我们阴凉、安静 / 以及更难的挑战之一 / 在对抗气候变化的斗争中。 / 即使我们人类依靠森林 / 来[xxx]掉我们产生的二氧化碳中的很大一部分， / 我们却在威胁它们这样做的能力。 / 我们正在[xxx]的气候变化 / 有一天可能留给我们这样的森林 / 它们排出的碳多于吸收的碳。\n\n这里并列了森林带来的好处和挑战，后面解释人类依赖森林吸碳，却在威胁这种能力，最终可能出现排碳多于吸碳的森林。要看选项怎样表达这个风险。\n\n接下来按A—D逐项看。","html":"<h2>26题</h2>\n<blockquote>\n<p>By saying “one of the harder challenges,” the author implies that ______.\n作者说“更难的挑战之一”，暗示了什么？</p>\n</blockquote>\n<p>题干直接引用one of the harder challenges，这组词在第1段。回到开头，把完整一段读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Forests give us shade, quiet and one of the harder challenges in the fight against climate change. Even as we humans count on forests to [xxx] up a good share of the carbon dioxide we produce, we are threatening their ability to do so. The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.</p>\n<p>开始精读：</p>\n<p>Forests give us shade, quiet / and one of the harder challenges / in the fight against climate change. / Even as we humans count on forests / to [xxx] up a good share of the carbon dioxide we produce, / we are threatening their ability to do so. / The climate change we are [xxx] / could one day leave us with forests / that emit more carbon than they absorb.</p>\n<p>森林给我们阴凉、安静 / 以及更难的挑战之一 / 在对抗气候变化的斗争中。 / 即使我们人类依靠森林 / 来[xxx]掉我们产生的二氧化碳中的很大一部分， / 我们却在威胁它们这样做的能力。 / 我们正在[xxx]的气候变化 / 有一天可能留给我们这样的森林 / 它们排出的碳多于吸收的碳。</p>\n</blockquote>\n<p>这里并列了森林带来的好处和挑战，后面解释人类依赖森林吸碳，却在威胁这种能力，最终可能出现排碳多于吸碳的森林。要看选项怎样表达这个风险。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[183,196,747,29],[135,230,796,30],[135,265,789,30],[135,300,795,29],[135,335,297,29]],"questionRects":[[187,124,735,30],[187,167,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. global climate change may get out of control\n\n> 全球气候变化可能失去控制\n\n把A接回题干，它说的是：作者是在暗示全球气候变化可能失控。\n\nA的get out of control说气候变化越来越难控制，和第1段emit more carbon than they absorb所呈现的风险有联系，所以回看段末。\n\n> The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.\n\nemit more carbon than they absorb说明森林的碳收支可能反过来，get out of control则把风险推到整个气候变化。这个范围确实更大；但只看开头，人类破坏森林吸碳能力与气候风险增加也能联系，[xxx]所说的人类作用尚未读明白，目前还不能把失控的可能完全判掉。\n\n**仅凭这一段的森林风险，就能断定全球气候变化的失控可能绝对不存在吗？**\n\n还不能。A把风险推得更远，不过开头暂时没有把这个更远的可能说清，先保留A。\n\n**第一轮判断：A保留。**","html":"<h3>A. global climate change may get out of control</h3>\n<blockquote>\n<p>全球气候变化可能失去控制</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者是在暗示全球气候变化可能失控。</p>\n<p>A的get out of control说气候变化越来越难控制，和第1段emit more carbon than they absorb所呈现的风险有联系，所以回看段末。</p>\n<blockquote>\n<p>The climate change we are [xxx] could one day leave us with forests that emit more carbon than they absorb.</p>\n</blockquote>\n<p>emit more carbon than they absorb说明森林的碳收支可能反过来，get out of control则把风险推到整个气候变化。这个范围确实更大；但只看开头，人类破坏森林吸碳能力与气候风险增加也能联系，[xxx]所说的人类作用尚未读明白，目前还不能把失控的可能完全判掉。</p>\n<p><strong>仅凭这一段的森林风险，就能断定全球气候变化的失控可能绝对不存在吗？</strong></p>\n<p>还不能。A把风险推得更远，不过开头暂时没有把这个更远的可能说清，先保留A。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[135,300,795,29],[135,335,297,29]],"questionRects":[[187,124,735,30],[187,167,25,24],[216,167,441,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"A","optionFlow":{"schema":"ordinary- 被解释的对象。</p>\n<p><strong>段末具体描写的是极端天气，还是森林排出的碳多于吸收的碳？</strong></p>\n<p>后者。D跳到了另一个结果，没保留这段用森林解释挑战的具体内容。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,300,795,29],[135,335,297,29]],"questionRects":[[187,124,735,30],[187,167,25,24],[216,294,369,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的extreme weather conditions是在问天气结果，因此回看第1段forests that emit more carbon，比较段末留下的具体情形。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"forests that emit more carbon","visibleOptionAnchor":"extreme weather conditions"}}}},{"section":"26题","raw":"### 26题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B保留；\n- C排除；\n- D排除。\n\nA、B保留。B直接指森林可能变成威胁；A则把风险进一步放到了全球气候是否失控上，开头这一段还没有把两者彻底分开。","html":"<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A、B保留。B直接指森林可能变成威胁；A则把风险进一步放到了全球气候是否失控上，开头这一段还没有把两者彻底分开。</p>\n","articleRects":[],"questionRects":[[187,124,735,30],[187,167,25,24],[216,167,441,29],[215,205,367,37],[215,252,417,29],[216,294,369,29]],"scrollTarget":"auto","meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> To maintain forests as valuable “carbon sinks,” we may need to ______.\n> 要让森林持续作为有价值的“碳汇”，我们可能需要怎样做？\n\n题干中的carbon sinks在第2段直接出现。回到这一段，从出路读到加州的做法。\n\n> 原文参考：\n>\n> Thankfully, there is a way out of this trap—but it involves striking a [xxx] balance. Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now. California is leading the way, as it does on so many climate efforts, in figuring out the details.\n>\n> 开始精读：\n>\n> Thankfully, there is a way out of this trap— / but it involves striking a [xxx] balance. / Helping forests [xxx] / as valuable “carbon sinks” long into the future / may require reducing their capacity to absorb carbon now. / California is leading the way, / as it does on so many climate efforts, / in figuring out the details.\n>\n> 谢天谢地，有一条路走出这个陷阱—— / 但它涉及取得一种[xxx]的平衡。 / 帮助森林[xxx] / 作为有价值的“碳汇”一直延续到未来 / 可能需要现在减少它们吸收碳的能力。 / 加州正在带头， / 就像它在许多气候行动上做的那样， / 弄清其中细节。\n\n这句把long into the future与now放在两端：为了未来保持碳汇价值，may require后面写reducing吸收碳的能力。空格要补的是现在可能需要做什么。\n\n接下来按A—D逐项看。","html":"<h2>27题</h2>\n<blockquote>\n<p>To maintain forests as valuable “carbon sinks,” we may need to ______.\n要让森林持续作为有价值的“碳汇”，我们可能需要怎样做？</p>\n</blockquote>\n<p>题干中的carbon sinks在第2段直接出现。回到这一段，从出路读到加州的做法。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Thankfully, there is a way out of this trap—but it involves striking a [xxx] balance. Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now. California is leading the way, as it does on so many climate efforts, in figuring out the details.</p>\n<p>开始精读：</p>\n<p>Thankfully, there is a way out of this trap— / but it involves striking a [xxx] balance. / Helping forests [xxx] / as valuable “carbon sinks” long into the future / may require reducing their capacity to absorb carbon now. / California is leading the way, / as it does on so many climate efforts, / in figuring out the details.</p>\n<p>谢天谢地，有一条路走出这个陷阱—— / 但它涉及取得一种[xxx]的平衡。 / 帮助森林[xxx] / 作为有价值的“碳汇”一直延续到未来 / 可能需要现在减少它们吸收碳的能力。 / 加州正在带头， / 就像它在许多气候行动上做的那样， / 弄清其中细节。</p>\n</blockquote>\n<p>这句把long into the future与now放在两端：为了未来保持碳汇价值，may require后面写reducing吸收碳的能力。空格要补的是现在可能需要做什么。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[182,369,748,30],[135,403,795,30],[135,439,796,29],[135,474,734,29]],"questionRects":[[187,377,724,30]],"scrollTarget":"auto","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. preserve the [xxx] of species in them\n\n> 保留其中物种的[xxx]\n\n把A接回题干，它说的是：维持碳汇需要保留森林中物种的[xxx]。\n\nA的species谈物种，因此回到第2段capacity to absorb carbon，对应着看句子要调整的是哪一种东西。\n\n> Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now.\n\ncapacity to absorb carbon是吸收碳的能力，species指物种。A虽然也谈森林，但把调整对象从碳吸收能力换成物种的某种[xxx]。原句没有列物种种类，也没有通过保留不同物种解释未来碳汇的维持。\n\n**保持碳吸收功能的今昔安排，等于保留物种的某种特征吗？**\n\n不等于。两者讨论的对象不同；原句明确把require接在减少当前吸碳能力上。\n\n**第一轮判断：A排除。**","html":"<h3>A. preserve the [xxx] of species in them</h3>\n<blockquote>\n<p>保留其中物种的[xxx]</p>\n</blockquote>\n<p>把A接回题干，它说的是：维持碳汇需要保留森林中物种的[xxx]。</p>\n<p>A的species谈物种，因此回到第2段capacity to absorb carbon，对应着看句子要调整的是哪一种东西。</p>\n<blockquote>\n<p>Helping forests [xxx] as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now.</p>\n</blockquote>\n<p>capacity to absorb carbon是吸收碳的能力，species指物种。A虽然也谈森林，但把调整对象从碳吸收能力换成物种的某种[xxx]。原句没有列物种种类，也没有通过保留不同物种解释未来碳汇的维持。</p>\n<p><strong>保持碳吸收功能的今昔安排，等于保留物种的某种特征吗？</strong></p>\n<p>不等于。两者讨论的对象不同；原句明确把require接在减少当前吸碳能力上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,403,795,30],[135,439,796,29]],"questionRects":[[187,377,724,30],[216,421,396,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的species谈物种，因此回到第2段capacity to absorb carbon，对应着看句子要调整的是哪一种东西。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"capacity to absorb carbon","visibleOptionAnchor":"species"}}}},{"section":"27题","raw":"### B. lower their present carbon-absorbing capacity\n\n> 降低它们目前的吸碳能力\n\n把B接回题干，它说的是：维持未来的碳汇，可能需要降低森林目前吸碳的能力。\n\nB的present carbon-absorbing capacity与第2段capacity to absorb carbon now意思一样，所以回到may require后面的动作。\n\n> may require reducing their capacity to absorb carbon now.\n\ncapacity to absorb carbon now被reducing支配，present carbon-absorbing capacity也被lower支配。now与present限定相同的时间，都指当前，而题干的maintain放在更长期目标下。B保留了“现在少一些、服务以后”的安排，没有误写成永远降低森林的功能。\n\n**B能不能保留原文中现在与未来的安排？**\n\n能。可以保留B：它降低的是当前吸碳能力，题干问的仍是维持长期碳汇。\n\n**第一轮判断：B保留。**","html":"<h3>B. lower their present carbon-absorbing capacity</h3>\n<blockquote>\n<p>降低它们目前的吸碳能力</p>\n</blockquote>\n<p>把B接回题干，它说的是：维持未来的碳汇，可能需要降低森林目前吸碳的能力。</p>\n<p>B的present carbon-absorbing capacity与第2段capacity to absorb carbon now意思一样，所以回到may require后面的动作。</p>\n<blockquote>\n<p>may require reducing their capacity to absorb carbon now.</p>\n</blockquote>\n<p>capacity to absorb carbon now被reducing支配，present carbon-absorbing capacity也被lower支配。now与present限定相同的时间，都指当前，而题干的maintain放在更长期目标下。B保留了“现在少一些、服务以后”的安排，没有误写成永远降低森林的功能。</p>\n<p><strong>B能不能保留原文中现在与未来的安排？</strong></p>\n<p>能。可以保留B：它降低的是当前吸碳能力，题干问的仍是维持长期碳汇。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[135,439,796,29]],"questionRects":[[187,377,724,30],[215,463,443,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的present carbon-absorbing capacity与第2段capacity to absorb carbon now意思一样，所以回到may require后面的动作。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"capacity to absorb carbon now","visibleOptionAnchor":"present carbon-absorbing capacity"}}}},{"section":"27题","raw":"### C. accelerate the growth of young trees\n\n> 加速幼树生长\n\n把C接回题干，它说的是：维持碳汇需要加快幼树的生长。\n\nC的accelerate the growth特别指向young trees，第3段开头就有这种树。接着把这一段读全，看看计划对幼树采取什么动作。\n\n> 原文参考：\n>\n> The state’s proposed Forest Carbon Plan aims to double efforts to thin out young trees and clear [xxx] in parts of the forest. This temporarily lowers carbon-carrying capacity. But the remaining trees draw a greater share of the available moisture, so they grow and [xxx], restoring the forest’s capacity to pull carbon from the air. Healthy trees are also better able to [xxx] off insects. The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].\n>\n> 开始精读：\n>\n> The state’s proposed Forest Carbon Plan / aims to double efforts / to thin out young trees and clear [xxx] / in parts of the forest. / This temporarily lowers carbon-carrying capacity. / But the remaining trees draw a greater share / of the available moisture, / so they grow and [xxx], / restoring the forest’s capacity / to pull carbon from the air. / Healthy trees are also better able to [xxx] off insects. / The landscape is [xxx] less easily burnable. / Even in the event of a fire, / fewer trees are [xxx].\n>\n> 该州提出的森林碳计划 / 力图加倍努力 / 去疏除幼树、清理[xxx] / 在森林的一些部分。 / 这暂时降低承载碳的能力。 / 但剩下的树获得更大份额 / 可利用水分的， / 所以它们生长并[xxx]， / 恢复森林的能力 / 从空气中吸走碳。 / 健康的树也更能[xxx]掉昆虫。 / 这片地带被[xxx]得不那么容易燃烧。 / 即便发生火灾， / 也有更少树木被[xxx]。\n\n读完这一段，再把accelerate the growth和young trees放在一起：\n\n> aims to double efforts to thin out young trees and clear [xxx] in parts of the forest.\n\n> But the remaining trees draw a greater share of the available moisture, so they grow and [xxx]\n\nyoung trees在thin out之后，指计划要疏除的一部分幼树；accelerate the growth却要求加速它们生长。后面grow的主体是remaining trees，即疏除后留下的树。C把对剩余树木的有利结果转给计划正在减少的幼树，换了对象与动作。\n\n**文中增长得更好的是全部幼树，还是疏除后留下的树？**\n\n后者。对young trees的直接动作是thin out，C却改成加速它们的生长。\n\n**第一轮判断：C排除。**","html":"<h3>C. accelerate the growth of young trees</h3>\n<blockquote>\n<p>加速幼树生长</p>\n</blockquote>\n<p>把C接回题干，它说的是：维持碳汇需要加快幼树的生长。</p>\n<p>C的accelerate the growth特别指向young trees，第3段开头就有这种树。接着把这一段读全，看看计划对幼树采取什么动作。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The state’s proposed Forest Carbon Plan aims to double efforts to thin out young trees and clear [xxx] in parts of the forest. This temporarily lowers carbon-carrying capacity. But the remaining trees draw a greater share of the available moisture, so they grow and [xxx], restoring the forest’s capacity to pull carbon from the air. Healthy trees are also better able to [xxx] off insects. The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].</p>\n<p>开始精读：</p>\n<p>The state’s proposed Forest Carbon Plan / aims to double efforts / to thin out young trees and clear [xxx] / in parts of the forest. / This temporarily lowers carbon-carrying capacity. / But the remaining trees draw a greater share / of the available moisture, / so they grow and [xxx], / restoring the forest’s capacity / to pull carbon from the air. / Healthy trees are also better able to [xxx] off insects. / The landscape is [xxx] less easily burnable. / Even in the event of a fire, / fewer trees are [xxx].</p>\n<p>该州提出的森林碳计划 / 力图加倍努力 / 去疏除幼树、清理[xxx] / 在森林的一些部分。 / 这暂时降低承载碳的能力。 / 但剩下的树获得更大份额 / 可利用水分的， / 所以它们生长并[xxx]， / 恢复森林的能力 / 从空气中吸走碳。 / 健康的树也更能[xxx]掉昆虫。 / 这片地带被[xxx]得不那么容易燃烧。 / 即便发生火灾， / 也有更少树木被[xxx]。</p>\n</blockquote>\n<p>读完这一段，再把accelerate the growth和young trees放在一起：</p>\n<blockquote>\n<p>aims to double efforts to thin out young trees and clear [xxx] in parts of the forest.</p>\n</blockquote>\n<blockquote>\n<p>But the remaining trees draw a greater share of the available moisture, so they grow and [xxx]</p>\n</blockquote>\n<p>young trees在thin out之后，指计划要疏除的一部分幼树；accelerate the growth却要求加速它们生长。后面grow的主体是remaining trees，即疏除后留下的树。C把对剩余树木的有利结果转给计划正在减少的幼树，换了对象与动作。</p>\n<p><strong>文中增长得更好的是全部幼树，还是疏除后留下的树？</strong></p>\n<p>后者。对young trees的直接动作是thin out，C却改成加速它们的生长。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[182,369,748,30],[135,403,795,30],[135,439,796,29],[135,474,734,29],[182,509,749,29],[135,543,716,30],[221,578,709,29],[135,613,795,29],[135,648,795,29],[135,682,795,30],[135,717,103,25]],"questionRects":[[187,377,724,30],[215,505,356,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的accelerate the growth特别指向young trees，第3段开头就有这种树。接着把这一段读全，看看计划对幼树采取什么动作。"],"evidenceParagraphPids":[1,2],"extraPrecisionParagraphPids":[2],"sourceMode":"new_precision_reading","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"young trees","visibleOptionAnchor":"accelerate the growth"}}}},{"section":"27题","raw":"### D. strike a balance among different plants\n\n> 在不同植物之间取得平衡\n\n把D接回题干，它说的是：维持碳汇需要在各种植物之间取得平衡。\n\nD的different plants看起来也能接balance，所以回到第2段long into the future与now，把这个平衡的两端对应起来。\n\n> as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now.\n\nlong into the future对应长期碳汇，now对应当前吸碳能力；这是不同时间上的取舍。different plants却把两端改成不同植物。第3段的疏树说明怎样实现这种安排，也没有把第2段的balance改为物种之间的均衡。\n\n**原文的平衡主要放在不同时间的吸碳功能，还是不同植物之间？**\n\n前者。D只拿住balance，却换掉了原文解释的两端。\n\n**第一轮判断：D排除。**","html":"<h3>D. strike a balance among different plants</h3>\n<blockquote>\n<p>在不同植物之间取得平衡</p>\n</blockquote>\n<p>把D接回题干，它说的是：维持碳汇需要在各种植物之间取得平衡。</p>\n<p>D的different plants看起来也能接balance，所以回到第2段long into the future与now，把这个平衡的两端对应起来。</p>\n<blockquote>\n<p>as valuable “carbon sinks” long into the future may require reducing their capacity to absorb carbon now.</p>\n</blockquote>\n<p>long into the future对应长期碳汇，now对应当前吸碳能力；这是不同时间上的取舍。different plants却把两端改成不同植物。第3段的疏树说明怎样实现这种安排，也没有把第2段的balance改为物种之间的均衡。</p>\n<p><strong>原文的平衡主要放在不同时间的吸碳功能，还是不同植物之间？</strong></p>\n<p>前者。D只拿住balance，却换掉了原文解释的两端。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[135,403,795,30],[135,439,796,29]],"questionRects":[[187,377,724,30],[217,547,379,30]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的different plants看起来也能接balance，所以回到第2段long into the future与now，把这个平衡的两端对应起来。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time"],"visibleSourceAnchor":"long into the future","visibleOptionAnchor":"different plants"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除。\n\nB保留。原文把未来碳汇价值与当前吸碳能力放在一起；C把剩余树木的结果转给幼树，A、D则换成了物种或植物之间的关系。","html":"<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。原文把未来碳汇价值与当前吸碳能力放在一起；C把剩余树木的结果转给幼树，A、D则换成了物种或植物之间的关系。</p>\n","articleRects":[],"questionRects":[[187,377,724,30],[216,421,396,29],[215,463,443,29],[215,505,356,29],[217,547,379,30]],"scrollTarget":"auto","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> California’s Forest Carbon Plan endeavors to ______.\n> 加州森林碳计划努力做什么？\n\n题干问Forest Carbon Plan，第3段就是这项计划的具体做法。上一题已经把整段读完，这里回看该段开头的aims to。\n\n计划的直接动作是thin out young trees、clear [xxx]，范围是parts of the forest。后面生长、抗虫和不易燃烧，是留下的树和环境因此获得的效果。\n\n接下来按A—D逐项看。","html":"<h2>28题</h2>\n<blockquote>\n<p>California’s Forest Carbon Plan endeavors to ______.\n加州森林碳计划努力做什么？</p>\n</blockquote>\n<p>题干问Forest Carbon Plan，第3段就是这项计划的具体做法。上一题已经把整段读完，这里回看该段开头的aims to。</p>\n<p>计划的直接动作是thin out young trees、clear [xxx]，范围是parts of the forest。后面生长、抗虫和不易燃烧，是留下的树和环境因此获得的效果。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[182,509,749,29],[135,543,716,30],[221,578,709,29],[135,613,795,29],[135,648,795,29],[135,682,795,30],[135,717,103,25]],"questionRects":[[187,632,523,28],[187,675,25,24]],"scrollTarget":"auto","meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. restore its forests quickly after wildfires\n\n> 山火后迅速恢复森林\n\n把A接回题干，它说的是：计划是在山火之后快速重建森林。\n\nA的after wildfires说灾后行动，所以回到第3段Even in the event of a fire，把火灾与计划实施的先后对应起来。\n\n> The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].\n\nEven in the event of a fire说即便后来发生火灾，受影响的树也更少；after wildfires却把计划放在火灾发生之后。less easily burnable也说明是在提高发生大火前的抵抗能力。A把预先管理减少损失，改成了灾后快速恢复。\n\n**“即便发生火灾，损失较少”与“火灾后迅速恢复”，时间顺序相同吗？**\n\n不是。前者说明事前管理带来的抵抗能力，后者是灾后修复，A改变了行动时间。\n\n**第一轮判断：A排除。**","html":"<h3>A. restore its forests quickly after wildfires</h3>\n<blockquote>\n<p>山火后迅速恢复森林</p>\n</blockquote>\n<p>把A接回题干，它说的是：计划是在山火之后快速重建森林。</p>\n<p>A的after wildfires说灾后行动，所以回到第3段Even in the event of a fire，把火灾与计划实施的先后对应起来。</p>\n<blockquote>\n<p>The landscape is [xxx] less easily burnable. Even in the event of a fire, fewer trees are [xxx].</p>\n</blockquote>\n<p>Even in the event of a fire说即便后来发生火灾，受影响的树也更少；after wildfires却把计划放在火灾发生之后。less easily burnable也说明是在提高发生大火前的抵抗能力。A把预先管理减少损失，改成了灾后快速恢复。</p>\n<p><strong>“即便发生火灾，损失较少”与“火灾后迅速恢复”，时间顺序相同吗？</strong></p>\n<p>不是。前者说明事前管理带来的抵抗能力，后者是灾后修复，A改变了行动时间。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[135,648,795,29],[135,682,795,30],[135,717,103,25]],"questionRects":[[187,632,523,28],[187,675,25,24],[216,674,390,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的after wildfires说灾后行动，所以回到第3段Even in the event of a fire，把火灾与计划实施的先后对应起来。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time"],"visibleSourceAnchor":"Even in the event of a fire","visibleOptionAnchor":"after wildfires"}}}},{"section":"28题","raw":"### B. [xxx] more drought-resistant trees\n\n> [xxx]更多耐旱树木\n\n把B接回题干，它说的是：计划要[xxx]更多能抗旱的树木。\n\nB的more drought-resistant trees强调更多耐旱树，对应着回看第3段the remaining trees，辨认计划是在增加树，还是让留下的树获得更多水分。\n\n> But the remaining trees draw a greater share of the available moisture, so they grow and [xxx]\n\nthe remaining trees是疏除之后留下来的树，more drought-resistant trees则转成更多耐旱树。原文的方法是减少竞争，让现有树分享更多水分，并没有把对象换成一种新培育的耐旱树。B里的[xxx]再怎样修饰行动，more仍与原文先疏除再让剩下的树受益不同。\n\n**计划是在增加耐旱树的数量，还是改善留下的树得到水分的条件？**\n\n后者。B把留树、减竞争的做法，改成了增加某种耐旱树木。\n\n**第一轮判断：B排除。**","html":"<h3>B. [xxx] more drought-resistant trees</h3>\n<blockquote>\n<p>[xxx]更多耐旱树木</p>\n</blockquote>\n<p>把B接回题干，它说的是：计划要[xxx]更多能抗旱的树木。</p>\n<p>B的more drought-resistant trees强调更多耐旱树，对应着回看第3段the remaining trees，辨认计划是在增加树，还是让留下的树获得更多水分。</p>\n<blockquote>\n<p>But the remaining trees draw a greater share of the available moisture, so they grow and [xxx]</p>\n</blockquote>\n<p>the remaining trees是疏除之后留下来的树，more drought-resistant trees则转成更多耐旱树。原文的方法是减少竞争，让现有树分享更多水分，并没有把对象换成一种新培育的耐旱树。B里的[xxx]再怎样修饰行动，more仍与原文先疏除再让剩下的树受益不同。</p>\n<p><strong>计划是在增加耐旱树的数量，还是改善留下的树得到水分的条件？</strong></p>\n<p>后者。B把留树、减竞争的做法，改成了增加某种耐旱树木。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221,578,709,29],[135,613,795,29]],"questionRects":[[187,632,523,28],[187,675,25,24],[215,717,361,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的more drought-resistant trees强调更多耐旱树，对应着回看第3段the remaining trees，辨认计划是在增加树，还是让留下的树获得更多水分。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object"],"visibleSourceAnchor":"the remaining trees","visibleOptionAnchor":"more drought-resistant trees"}}}},{"section":"28题","raw":"### C. find more effective ways to kill insects\n\n> 寻找更有效的杀虫办法\n\n把C接回题干，它说的是：计划以寻找新的高效杀虫方法为目标。\n\nC的ways to kill insects与第3段昆虫那句有关，所以回到Healthy trees，看应对昆虫的是谁。\n\n> Healthy trees are also better able to [xxx] off insects.\n\nHealthy trees是这句的主体，表示树更健康之后更能应对昆虫；ways to kill insects却把计划写成专门寻找杀虫技术。also把抗虫放在前面疏树、生长之后，是附带收益之一。C将树的能力变成了计划研究新方法的目标。\n\n**树更健康、更能应对昆虫，就是在研究更有效的杀虫方法吗？**\n\n不等于。C改变了动作主体，也把一项效果当成计划本身的措施。\n\n**第一轮判断：C排除。**","html":"<h3>C. find more effective ways to kill insects</h3>\n<blockquote>\n<p>寻找更有效的杀虫办法</p>\n</blockquote>\n<p>把C接回题干，它说的是：计划以寻找新的高效杀虫方法为目标。</p>\n<p>C的ways to kill insects与第3段昆虫那句有关，所以回到Healthy trees，看应对昆虫的是谁。</p>\n<blockquote>\n<p>Healthy trees are also better able to [xxx] off insects.</p>\n</blockquote>\n<p>Healthy trees是这句的主体，表示树更健康之后更能应对昆虫；ways to kill insects却把计划写成专门寻找杀虫技术。also把抗虫放在前面疏树、生长之后，是附带收益之一。C将树的能力变成了计划研究新方法的目标。</p>\n<p><strong>树更健康、更能应对昆虫，就是在研究更有效的杀虫方法吗？</strong></p>\n<p>不等于。C改变了动作主体，也把一项效果当成计划本身的措施。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[135,648,795,29]],"questionRects":[[187,632,523,28],[187,675,25,24],[215,759,383,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的ways to kill insects与第3段昆虫那句有关，所以回到Healthy trees，看应对昆虫的是谁。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject"],"visibleSourceAnchor":"Healthy trees","visibleOptionAnchor":"ways to kill insects"}}}},{"section":"28题","raw":"### D. reduce the density of some of its forests\n\n> 降低部分森林的密度\n\n把D接回题干，它说的是：计划要让一部分森林中的树木不那么密。\n\nD的reduce the density对应第3段thin out young trees，所以回到计划首句，再确认是否把范围扩大到全部森林。\n\n> aims to double efforts to thin out young trees and clear [xxx] in parts of the forest.\n\nthin out young trees说把一些幼树疏除，reduce the density也说降低密度。parts of the forest与some of its forests都保留部分范围。D概括的是计划首先采取的措施，后面留下的树得到更多水、抗虫和较少燃烧，才是措施之后的结果。\n\n**D是否保留了疏除这一动作和部分森林这一范围？**\n\n能。它没有换成培育树种、杀虫技术或灾后重建，直接接住计划首句。\n\n**第一轮判断：D保留。**","html":"<h3>D. reduce the density of some of its forests</h3>\n<blockquote>\n<p>降低部分森林的密度</p>\n</blockquote>\n<p>把D接回题干，它说的是：计划要让一部分森林中的树木不那么密。</p>\n<p>D的reduce the density对应第3段thin out young trees，所以回到计划首句，再确认是否把范围扩大到全部森林。</p>\n<blockquote>\n<p>aims to double efforts to thin out young trees and clear [xxx] in parts of the forest.</p>\n</blockquote>\n<p>thin out young trees说把一些幼树疏除，reduce the density也说降低密度。parts of the forest与some of its forests都保留部分范围。D概括的是计划首先采取的措施，后面留下的树得到更多水、抗虫和较少燃烧，才是措施之后的结果。</p>\n<p><strong>D是否保留了疏除这一动作和部分森林这一范围？</strong></p>\n<p>能。它没有换成培育树种、杀虫技术或灾后重建，直接接住计划首句。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[182,509,749,29],[135,543,716,30]],"questionRects":[[187,632,523,28],[187,675,25,24],[216,801,394,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的reduce the density对应第3段thin out young trees，所以回到计划首句，再确认是否把范围扩大到全部森林。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_dispro
