njUro9frBgwd/8MEHFbWqnrqCgoJ+/fr98MMPHh4ewjNx+PDh+fPnx8TEmF+XLCEhYdu2bYWFha6urs8//7y3t/czrhj2p9i3b9+iRYu2bdv2qDdKp9OFh4e3bt06JCTkUW1MJpPBYHiKP5NVsn//flEU/fz8HlUuLyMjY82aNXPmzHnUGYKDgwMDA4ODg2tymADw/5FYAKA6ysrKPvroo3fffbdFixZP/R0sLy+fOXPmxIkTa+LkeHKxsbEnTpwIDQ39e76Zy5Ytq1+//uDBg//sgQD4uyCxAED1abXap1ugVnLr1i0bGxs25vsbfvR/CQUFBTW0TScAPBSJBQAAAIB8Ud8DAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAADIF4kFAAAAgHyRWAAAAAAIsvX/AGLADwwycdAIAAAAAElFTkSuQmCC","articleSize":{"w":1083,"h":1508},"questionSize":{"w":1083,"h":1508},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>31题题干</h2>\n<p><strong>Sparrow’s study shows that with the Internet, the human brain will ______.</strong></p>\n<blockquote><p>Sparrow的研究显示，在互联网条件下人脑会怎样？</p>\n</blockquote>\n<p>题型：<strong>研究结论题</strong>。</p>\n\n<hr />\n<h2>32题题干</h2>\n<p><strong>The process of “cognitive offloading” ______.</strong></p>\n<blockquote><p>“认知卸载”这一过程有什么作用？</p>\n</blockquote>\n<p>题型：<strong>概念作用题</strong>。</p>\n\n<hr />\n<h2>33题题干</h2>\n<p><strong>Which of the following would Sparrow support about the Internet?</strong></p>\n<blockquote><p>关于互联网，Sparrow会支持下列哪种说法？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n\n<hr />\n<h2>34题题干</h2>\n<p><strong>It is indicated in Paragraph 3 that how the Internet affects our brains ______.</strong></p>\n<blockquote><p>第3段表明，互联网如何影响大脑这一问题处于什么状态？</p>\n</blockquote>\n<p>题型：<strong>段落判断题</strong>。</p>\n\n<hr />\n<h2>35题题干</h2>\n<p><strong>Neither Sparrow nor Storm would agree that ______.</strong></p>\n<blockquote><p>Sparrow和Storm都不会赞同下列哪一说法？</p>\n</blockquote>\n<p>题型：<strong>两位人物观点比较题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>not, while, but</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>changing, saved, recall</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>information, memory, costs</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>participants, experts, benefits</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Internet, Sparrow, Storm</td></tr></tbody></table>\n\n<hr />\n<p>The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 <strong>[xxx]</strong> in a computer (“an <strong>[xxx]</strong>’s eye is bigger than its brain,” for example). Half of the participants were told the information would be <strong>[xxx]</strong>, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when <strong>[xxx]</strong> on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn’t remember the information, but they remembered how to find the folders. In other words, human memory is not <strong>[xxx]</strong> but “adapting to new communications technology,” Sparrow says.</p>\n\n<hr />\n<p>The Internet may be changing merely what we remember, not our capacity to do so, / suggests Columbia University psychology professor Betsy Sparrow. / In 2011, Sparrow led a study / in which participants were asked to record 40 <strong>[xxx]</strong> in a computer / (“an <strong>[xxx]</strong>’s eye is bigger than its brain,” for example). / Half of the participants were told the information would be <strong>[xxx]</strong>, / while the other half were told it would be saved. / Guess what? / The latter group made no effort to recall the information when <strong>[xxx]</strong> on it later, / because they knew they could find it on their computers. / In the same study, a group was asked to remember both the information and the folders it was stored in. / They didn’t remember the information, / but they remembered how to find the folders. / In other words, human memory is not <strong>[xxx]</strong> / but “adapting to new communications technology,” Sparrow says.</p>\n\n<hr />\n<p>The 互联网 may be changing merely 我们记什么, not our 能力 to do so, / suggests Columbia University 心理学教授 Betsy Sparrow. / In 2011年, Sparrow led a 研究 / in which 参与者 were asked to 记录四十 <strong>[xxx]</strong> 在电脑里 / (“an <strong>[xxx]</strong>’s eye is bigger than its brain,” for example). / 一半参与者 were told the 信息 would be <strong>[xxx]</strong>, / while the other half were told it would be 保存. / Guess what? / The 后一组 made no effort to 回忆信息 when <strong>[xxx]</strong> on it later, / because they knew they could 在电脑找到它. / In the 同一研究, a group was asked to remember 信息和文件夹两者 it was stored in. / 他们没记住信息, / but they remembered how to 找到文件夹. / In other words, 人类记忆 is not <strong>[xxx]</strong> / but “适应新的通信技术,” Sparrow says.</p>\n\n<hr />\n<p>1、互联网、我们记什么、能力、心理学教授、Betsy Sparrow、2011年、研究、参与者、记录四十、在电脑里、一半参与者、信息、保存、后一组、回忆信息、在电脑找到它、同一研究、信息和文件夹两者、他们没记住信息、找到文件夹、人类记忆、适应新的通信技术。</p>\n\n<hr />\n<p>In a very practical way, the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories, a process known as “cognitive offloading.” Traditionally, this role was <strong>[xxx]</strong> by data banks, libraries, and other humans. Your father may never remember birthdays because your mother does, for instance. Some worry that this is having a <strong>[xxx]</strong> effect on society, but Sparrow sees an <strong>[xxx]</strong>. Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an <strong>[xxx]</strong> on more conceptual thinking —something that is not available on the Internet. “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, adding that we haven’t lost our ability to do it.</p>\n\n<hr />\n<p>In a very practical way, the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories, / a process known as “cognitive offloading.” / Traditionally, this role was <strong>[xxx]</strong> by data banks, libraries, and other humans. / Your father may never remember birthdays because your mother does, for instance. / Some worry that this is having a <strong>[xxx]</strong> effect on society, / but Sparrow sees an <strong>[xxx]</strong>. / Perhaps, she suggests, the trend will change our approach to learning / from a focus on individual facts and memorization / to an <strong>[xxx]</strong> on more conceptual thinking / —something that is not available on the Internet. / “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, / adding that we haven’t lost our ability to do it.</p>\n\n<hr />\n<p>In a very practical way, the 互联网 is becoming an <strong>[xxx]</strong> 硬盘 for our memories, / a process known as “认知卸载.” / Traditionally, this role was <strong>[xxx]</strong> by 数据库图书馆, and 其他人. / Your father may never remember 生日 because your mother does, for instance. / Some worry that this is having a <strong>[xxx]</strong> effect on 社会, / but Sparrow sees an <strong>[xxx]</strong>. / Perhaps, she suggests, the trend will change our 学习方式 / from a focus on 个别事实 and memorization / to an <strong>[xxx]</strong> on more 概念性思考 / —something that is not available on the Internet. / “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, / adding that we haven’t lost our 能力 to do it.</p>\n\n<hr />\n<p>2、互联网、硬盘、认知卸载、数据库图书馆、其他人、生日、社会、学习方式、个别事实、概念性思考、能力。</p>\n\n<hr />\n<p>Still other experts say it’s too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among <strong>[xxx]</strong> older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n\n<hr />\n<p>Still other experts say it’s too soon to understand how the Internet affects our brains. / There is no experimental evidence showing that it interferes with our ability to focus, / for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. / And surfing the web exercised the brain more than reading did / among <strong>[xxx]</strong> older adults / in a 2008 study involving 24 participants / at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n\n<hr />\n<p>Still 其他专家 say it’s 太早 to understand how the Internet affects our 大脑. / There is no 实验证据 showing that it interferes with our 专注能力, / for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. / And 浏览网络 exercised the brain more than 阅读 did / among <strong>[xxx]</strong> 老年人 / in a 2008 study involving 二十四名参与者 / at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n\n<hr />\n<p>3、其他专家、太早、大脑、实验证据、专注能力、浏览网络、阅读、老年人、二十四名参与者。</p>\n\n<hr />\n<p>“There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet, but I’d have to imagine that overall the benefits are going to outweigh those costs,” <strong>[xxx]</strong> psychology professor Benjamin Storm. “It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.”</p>\n\n<hr />\n<p>“There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet, / but I’d have to imagine that overall the benefits are going to outweigh those costs,” / <strong>[xxx]</strong> psychology professor Benjamin Storm. / “It seems pretty clear that memory is changing, / but is it changing for the better? / At this point, we don’t know.”</p>\n\n<hr />\n<p>“There may be 代价 <strong>[xxx]</strong> with our 依赖增加 on the 互联网, / but I’d have to imagine that 总体上 the 收益 are going to 超过那些代价,” / <strong>[xxx]</strong> psychology professor Benjamin Storm. / “It seems pretty clear that 记忆正在改变, / but is it changing 向更好方向? / At this point, 我们不知道.”</p>\n\n<hr />\n<p>4、代价、依赖增加、互联网、总体上、收益、超过那些代价、Benjamin Storm、记忆正在改变、向更好方向、我们不知道。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：互联网、信息存储、记忆变化、学习方式与大脑研究。刚才还看到：互联网、我们记什么、能力、心理学教授、Betsy Sparrow、2011年、研究、参与者、记录四十、在电脑里、一半参与者、信息、保存、后一组、回忆信息、在电脑找到它、同一研究、信息和文件夹两者、他们没记住信息、找到文件夹、人类记忆、适应新的通信技术；互联网、硬盘、认知卸载、数据库图书馆、其他人、生日、社会、学习方式、个别事实、概念性思考、能力；其他专家、太早、大脑、实验证据、专注能力、浏览网络、阅读、老年人、二十四名参与者；代价、依赖增加、互联网、总体上、收益、超过那些代价、Benjamin Storm、记忆正在改变、向更好方向、我们不知道。</p>\n<p>到这里还不能自然地说清楚：实验中人们记住了什么，外部存储如何分担任务，不同研究者对记忆变化各自怎样判断。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n\n<hr />\n<h2>31题</h2>\n<blockquote><p>Sparrow’s study shows that with the Internet, the human brain will ______.<br />\nSparrow的研究显示，在互联网条件下人脑会怎样？</p>\n</blockquote>\n<p>人名与study定位首段。完整读两种记录安排，尤其比较没记住信息内容却记住查找位置的反差，区分记忆对象与能力。</p>\n<blockquote><p>原文参考：</p>\n<p>The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 <strong>[xxx]</strong> in a computer (“an <strong>[xxx]</strong>’s eye is bigger than its brain,” for example). Half of the participants were told the information would be <strong>[xxx]</strong>, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when <strong>[xxx]</strong> on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn’t remember the information, but they remembered how to find the folders. In other words, human memory is not <strong>[xxx]</strong> but “adapting to new communications technology,” Sparrow says.</p>\n<p>开始精读：</p>\n<p>The Internet may be changing merely what we remember, not our capacity to do so, / suggests Columbia University psychology professor Betsy Sparrow. / In 2011, Sparrow led a study / in which participants were asked to record 40 <strong>[xxx]</strong> in a computer / (“an <strong>[xxx]</strong>’s eye is bigger than its brain,” for example). / Half of the participants were told the information would be <strong>[xxx]</strong>, / while the other half were told it would be saved. / Guess what? / The latter group made no effort to recall the information when <strong>[xxx]</strong> on it later, / because they knew they could find it on their computers. / In the same study, a group was asked to remember both the information and the folders it was stored in. / They didn’t remember the information, / but they remembered how to find the folders. / In other words, human memory is not <strong>[xxx]</strong> / but “adapting to new communications technology,” Sparrow says.</p>\n<p>互联网可能只在改变我们记什么而不是记忆能力 / 哥伦比亚大学心理学教授Betsy Sparrow如此提出。 / 2011年Sparrow主持了一项研究 / 参与者被要求在电脑里记录四十条<strong>[xxx]</strong> / （例如“一只<strong>[xxx]</strong>的眼睛比脑子还大”）。 / 一半参与者被告知这些信息会被<strong>[xxx]</strong> / 另一半则被告知信息会被保存。 / 猜猜怎样？ / 后一组在后来就信息被<strong>[xxx]</strong>时没有努力回忆 / 因为他们知道能在电脑里找到它。 / 在同一研究中一组人被要求记住信息及存放信息的文件夹。 / 他们没记住信息 / 但记住了怎样找到文件夹。 / 换言之人类记忆并非在<strong>[xxx]</strong> / 而是“适应新的通信技术”Sparrow说。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. analyze information in detail</h3>\n<blockquote><p>细致分析信息</p>\n</blockquote>\n<p>把A接回题干，它说的是：互联网会使人脑对信息作更详细的分析。</p>\n<p>A说细致分析，回首段看实验要求与最终记住的内容。</p>\n<blockquote><p>They didn’t remember the information, but they remembered how to find the folders.</p>\n</blockquote>\n<p>受试者记录信息，之后被测能否记住事实或保存位置。实验没有让他们比较资料、解释原因或评估分析有多深入。</p>\n<p>记住哪里能找到信息，与对信息作详细分析不同。A换了大脑在实验中表现的能力。</p>\n<p><strong>实验测的是分析细节，还是记住内容与查找路径？</strong></p>\n<p>测的是后者。A没有对应研究结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. collect information <strong>[xxx]</strong></h3>\n<blockquote><p>以<strong>[xxx]</strong>的方式收集信息</p>\n</blockquote>\n<p>把B接回题干，它说的是：互联网会使人脑以某种<strong>[xxx]</strong>方式收集信息。</p>\n<p>B说收集方式变化，回首段看受试者是不是自己寻找资料。</p>\n<blockquote><p>participants were asked to record 40 <strong>[xxx]</strong> in a computer</p>\n</blockquote>\n<blockquote><p>they knew they could find it on their computers</p>\n</blockquote>\n<p>实验将信息给受试者，让他们记录，再观察记忆。结果讨论的是已记录的信息留在脑中的哪些部分。</p>\n<p>B的方式词未知，但collect已换成搜集信息的动作，不能用记忆结果直接证明搜集方式。</p>\n<p><strong>记录后记住什么，能直接说明人脑如何收集信息吗？</strong></p>\n<p>不能。B换了研究环节。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. switch its focus of memory</h3>\n<blockquote><p>改变记忆的侧重点</p>\n</blockquote>\n<p>把C接回题干，它说的是：互联网使人脑把记忆重点转向不同内容。</p>\n<p>C说记忆重点转移，回首段对照information与folders。</p>\n<blockquote><p>The Internet may be changing merely what we remember, not our capacity to do so</p>\n</blockquote>\n<blockquote><p>They didn’t remember the information, but they remembered how to find the folders.</p>\n</blockquote>\n<p>知道资料会保存时，人们不费力记内容；同时被要求记内容和文件夹时，更记得如何找到文件夹。记住的对象从事实转向位置。</p>\n<p>首句what we remember也直接提示这种区别：发生变化的是记什么，不是先断言能记住多少。</p>\n<p><strong>记查找位置而不记具体事实，是否就是记忆侧重点改变？</strong></p>\n<p>是。C把实验结果与首句概括接起来了。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. extend its memory duration</h3>\n<blockquote><p>延长记忆持续时间</p>\n</blockquote>\n<p>把D接回题干，它说的是：互联网会让人脑把信息保持得更久。</p>\n<p>D说记得更久，回首段看有没有长期保持的比较。</p>\n<blockquote><p>the other half were told it would be saved</p>\n</blockquote>\n<blockquote><p>They didn’t remember the information</p>\n</blockquote>\n<p>研究比较不同提示下人们是否记住内容或文件夹，未报告某组比另一组多记住多少天。later只是测试在记录之后进行。</p>\n<p>知道以后可找资料，不等于人脑把资料保存得更长久；恰恰可能不主动记内容。</p>\n<p><strong>以后能从电脑找到资料，等于大脑记忆持续更久吗？</strong></p>\n<p>不等于。D把外部可获取性改成了脑内保持时长。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h2>32题</h2>\n<blockquote><p>The process of “cognitive offloading” ______.<br />\n“认知卸载”这一过程有什么作用？</p>\n</blockquote>\n<p>术语直接定位第2段。先完整读硬盘比喻及父母记生日的例子，再理解把记忆任务交给外部资源的作用。</p>\n<blockquote><p>原文参考：</p>\n<p>In a very practical way, the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories, a process known as “cognitive offloading.” Traditionally, this role was <strong>[xxx]</strong> by data banks, libraries, and other humans. Your father may never remember birthdays because your mother does, for instance. Some worry that this is having a <strong>[xxx]</strong> effect on society, but Sparrow sees an <strong>[xxx]</strong>. Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an <strong>[xxx]</strong> on more conceptual thinking —something that is not available on the Internet. “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, adding that we haven’t lost our ability to do it.</p>\n<p>开始精读：</p>\n<p>In a very practical way, the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories, / a process known as “cognitive offloading.” / Traditionally, this role was <strong>[xxx]</strong> by data banks, libraries, and other humans. / Your father may never remember birthdays because your mother does, for instance. / Some worry that this is having a <strong>[xxx]</strong> effect on society, / but Sparrow sees an <strong>[xxx]</strong>. / Perhaps, she suggests, the trend will change our approach to learning / from a focus on individual facts and memorization / to an <strong>[xxx]</strong> on more conceptual thinking / —something that is not available on the Internet. / “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, / adding that we haven’t lost our ability to do it.</p>\n<p>在很实际的意义上互联网正成为我们记忆的<strong>[xxx]</strong>硬盘 / 这一过程被称为“认知卸载”。 / 以往这一角色由数据库、图书馆和其他人<strong>[xxx]</strong>。 / 例如父亲可能从不记生日因为母亲记得。 / 有人担心这对社会产生<strong>[xxx]</strong>影响 / 但Sparrow看到一种<strong>[xxx]</strong>。 / 她提出这一趋势也许会改变学习方式 / 从关注个别事实与记忆 / 转到对更多概念性思考的<strong>[xxx]</strong> / ——这是一种互联网上无法直接取得的东西。 / Sparrow说“就我个人而言我从没在记住东西中看到那么大的<strong>[xxx]</strong>价值” / 并补充我们并未失去这样做的能力。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. helps us identify false information</h3>\n<blockquote><p>帮助我们辨别虚假信息</p>\n</blockquote>\n<p>把A接回题干，它说的是：认知卸载使我们能识别资料是真是假。</p>\n<p>A说辨别真假，回第2段看外部储存与生日例子。</p>\n<blockquote><p>the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories</p>\n</blockquote>\n<blockquote><p>Your father may never remember birthdays because your mother does</p>\n</blockquote>\n<p>资料库、图书馆或别人替我们保存信息，父亲也可能依靠母亲记生日。这里改变的是谁负责记。</p>\n<p>这些安排并未自动核查内容真伪。即使资料放在外部，仍可能需要另外判断可靠性。</p>\n<p><strong>把信息交给外部保存，就自带了判断真假的功能吗？</strong></p>\n<p>没有。A增加了概念没有说明的作用。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. keeps our memory from failing</h3>\n<blockquote><p>防止我们的记忆失灵</p>\n</blockquote>\n<p>把B接回题干，它说的是：认知卸载能够防止人脑记忆失灵。</p>\n<p>B说防止记忆失灵，回第2段区分不用记与不能记。</p>\n<blockquote><p>Your father may never remember birthdays because your mother does</p>\n</blockquote>\n<blockquote><p>we haven’t lost our ability to do it</p>\n</blockquote>\n<p>父亲不用记生日，因为母亲记得；这是一种分工，不是用它治疗或防止父亲的记忆能力下降。Sparrow还说我们没有丧失记忆能力。</p>\n<p>减轻需要亲自记的量，与防止大脑失灵是不同作用。</p>\n<p><strong>可以依靠别人或电脑记信息，就证明人脑记忆不会失灵吗？</strong></p>\n<p>不证明。B把分担任务改成了保护能力的保证。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. enables us to classify <strong>[xxx]</strong> facts</h3>\n<blockquote><p>使我们能对<strong>[xxx]</strong>事实分类</p>\n</blockquote>\n<p>把C接回题干，它说的是：认知卸载帮助我们将某类事实分门别类。</p>\n<p>C说事实分类，回第2段看cognitive offloading强调什么。</p>\n<blockquote><p>this role was <strong>[xxx]</strong> by data banks, libraries, and other humans</p>\n</blockquote>\n<p>概念是把记忆任务交给互联网或其他外部来源，传统上也能依靠图书馆与别人。没有要求把事实分成若干类别。</p>\n<p>首段出现文件夹，只是存放位置的例子，不意味着认知卸载的功能就是分类。C的修饰词未知也不改变这一差别。</p>\n<p><strong>使用文件夹保存信息，就足以把认知卸载定义成分类事实吗？</strong></p>\n<p>不足。C把一个储存形式当成了主要作用。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. lessens our memory burdens</h3>\n<blockquote><p>减轻我们的记忆负担</p>\n</blockquote>\n<p>把D接回题干，它说的是：认知卸载使我们不必亲自记住所有信息。</p>\n<p>D说减轻记忆负担，回第2段看父亲与母亲的生日分工。</p>\n<blockquote><p>the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories</p>\n</blockquote>\n<blockquote><p>Your father may never remember birthdays because your mother does</p>\n</blockquote>\n<p>母亲记得生日，父亲就不必同时记；网络和资料库也可以保存我们需要的信息。要使用时找回来，不必把每项内容放在自己脑中。</p>\n<p>D概括的是个人承担的记忆任务减少，而不是人的记忆能力变差。</p>\n<p><strong>一部分信息由别人或外部工具保存，是否减轻自己记忆的负担？</strong></p>\n<p>是。D与概念及例子都相合。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n\n<hr />\n<h2>33题</h2>\n<blockquote><p>Which of the following would Sparrow support about the Internet?<br />\n关于互联网，Sparrow会支持下列哪种说法？</p>\n</blockquote>\n<p>先读Sparrow提出学习方式变化的完整语句，再回接首段记忆对象与能力的区分。这里问特定学者的观点，不能把Some worry所引的别人意见归给她。</p>\n<p>这一段前面已经完整读过，下面直接回到各项所涉及的句子。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. It may reform our learning approach.</h3>\n<blockquote><p>它可能改变我们的学习方式。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Sparrow会支持互联网可能使学习方式发生改变。</p>\n<p>A说学习方式可能改变，回第2段找change our approach to learning。</p>\n<blockquote><p>Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an <strong>[xxx]</strong> on more conceptual thinking</p>\n</blockquote>\n<p>Sparrow提出，学习可能从记个别事实转向更多概念性思考。她用Perhaps说明这是一种可能方向。</p>\n<p>A的may与Perhaps相接，reform learning approach与改变学习方式相接，既保留对象也保留语气。</p>\n<p><strong>A是不是把她提出的学习方向用另一种说法表达了出来？</strong></p>\n<p>是。A有直接原话支持，先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. It may impact our society negatively.</h3>\n<blockquote><p>它可能对社会产生负面影响。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Sparrow会支持互联网可能给社会带来负面影响。</p>\n<p>B说负面影响，回第2段看Some worry与but Sparrow。</p>\n<blockquote><p>Some worry that this is having a <strong>[xxx]</strong> effect on society, but Sparrow sees an <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>Perhaps, she suggests, the trend will change our approach to learning</p>\n</blockquote>\n<p>一些人担心这种变化对社会不好，but后转到Sparrow的另一种看法。她随后谈的是将注意力腾给概念思考的可能。</p>\n<p>B借用了前半句的担忧，却把持这种担忧的人换成Sparrow。不能因为同段出现就归给她。</p>\n<p><strong>负面担忧在文中明确由Sparrow提出吗？</strong></p>\n<p>不是。转折把她与那些担忧者区分开了，A才直接对应她的看法。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. It may enhance our <strong>[xxx]</strong> to technology.</h3>\n<blockquote><p>它可能增强我们对技术的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：Sparrow认为互联网可能增强我们对技术的某种<strong>[xxx]</strong>。</p>\n<p>C说增强对技术的某种性质，回首段看adapting to new communications technology。</p>\n<blockquote><p>human memory is not <strong>[xxx]</strong> but “adapting to new communications technology,”</p>\n</blockquote>\n<blockquote><p>The Internet may be changing merely what we remember, not our capacity to do so</p>\n</blockquote>\n<p>Sparrow说记忆在适应新技术，具体表现是记住查找途径。C也提technology，因而值得先与原句对照。</p>\n<p>但增强的核心属性词未知，目前不能把适应过程自动读成这种属性已增强。先和A留下回查。</p>\n<p><strong>知道记忆正在适应技术，足以确认C中哪一种属性增强了吗？</strong></p>\n<p>还不足。C暂留，不能先补出未知词再判断。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. It may interfere with our conceptual thinking.</h3>\n<blockquote><p>它可能妨碍我们的概念性思考。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Sparrow认为互联网可能阻碍我们进行概念性思考。</p>\n<p>D说妨碍概念思考，回第2段看from…to…的终点。</p>\n<blockquote><p>change our approach to learning from a focus on individual facts and memorization to an <strong>[xxx]</strong> on more conceptual thinking</p>\n</blockquote>\n<blockquote><p>something that is not available on the Internet</p>\n</blockquote>\n<p>Sparrow希望学习从个别事实与记忆，转向更多概念性思考。互联网能储存事实，使人有可能重新分配学习注意。</p>\n<p>D却说互联网阻碍这种思考，方向与她提出的潜在转变相反。</p>\n<p><strong>她把概念思考写成可能更加重视的方向，能概括成受到妨碍吗？</strong></p>\n<p>不能。D读反了她的观点。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>33题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂留A、C，等把全文连起来后再回来比较。</p>\n\n<hr />\n<h2>34题</h2>\n<blockquote><p>It is indicated in Paragraph 3 that how the Internet affects our brains ______.<br />\n第3段表明，互联网如何影响大脑这一问题处于什么状态？</p>\n</blockquote>\n<p>定位第3段并完整读首句和两个例子，区分研究尚未充分与已有个别发现；不能用一个研究的参与者代表整个领域。</p>\n<blockquote><p>原文参考：</p>\n<p>Still other experts say it’s too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among <strong>[xxx]</strong> older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n<p>开始精读：</p>\n<p>Still other experts say it’s too soon to understand how the Internet affects our brains. / There is no experimental evidence showing that it interferes with our ability to focus, / for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. / And surfing the web exercised the brain more than reading did / among <strong>[xxx]</strong> older adults / in a 2008 study involving 24 participants / at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n<p>还有专家表示要理解互联网如何影响大脑仍为时过早。 / 没有实验证据显示它妨碍我们的专注能力 / 例如心理学家Christopher Chabris和Daniel J. Simons如此写道。 / 而浏览网络比阅读更多锻炼大脑 / 在<strong>[xxx]</strong>的老年人中 / 在一项2008年涉及二十四名参与者的研究中 / 研究来自加州大学洛杉矶分校Semel神经科学与人类行为研究所。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. requires further academic research</h3>\n<blockquote><p>需要进一步学术研究</p>\n</blockquote>\n<p>把A接回题干，它说的是：互联网怎样影响大脑，还需要进一步研究。</p>\n<p>A说还需研究，回第3段看too soon to understand与no experimental evidence。</p>\n<blockquote><p>Still other experts say it’s too soon to understand how the Internet affects our brains.</p>\n</blockquote>\n<blockquote><p>There is no experimental evidence showing that it interferes with our ability to focus</p>\n</blockquote>\n<p>专家说现在还太早，不能理解互联网怎样影响大脑；例如并没有实验证据说明它干扰专注能力。</p>\n<p>后面虽有一项老年人的研究，但单项结果没有使所有影响都明确。A保留了仍需继续查明的状态。</p>\n<p><strong>还太早、关键判断缺证据，是否意味着需要进一步研究？</strong></p>\n<p>是。A与这段的总判断相合。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. is most studied in older adults</h3>\n<blockquote><p>主要在老年人中得到研究</p>\n</blockquote>\n<p>把B接回题干，它说的是：关于互联网影响大脑的研究，主要集中于老年人。</p>\n<p>B说主要研究老人，回第3段看24名老年人的研究是例子还是总体统计。</p>\n<blockquote><p>among <strong>[xxx]</strong> older adults in a 2008 study involving 24 participants</p>\n</blockquote>\n<p>作者介绍一项特定研究，发现上网在这批人中比阅读更锻炼大脑。没有统计整个研究领域里老年样本占多少。</p>\n<p>出现一个老年样本，不足以说明关于互联网与大脑的研究大多集中于老人。</p>\n<p><strong>举了一项老人研究，就能判断整个领域主要研究老人吗？</strong></p>\n<p>不能。B把一个例子扩大成研究总体分布。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. is <strong>[xxx]</strong> in our reading speed</h3>\n<blockquote><p>在我们的阅读速度中被<strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：互联网对大脑的影响与阅读速度形成某种<strong>[xxx]</strong>关系。</p>\n<p>C谈阅读速度，回第3段看surfing与reading比较的指标。</p>\n<blockquote><p>surfing the web exercised the brain more than reading did</p>\n</blockquote>\n<p>比较的是锻炼大脑的程度，不是每分钟读多少字或完成阅读所需时间。reading作为活动出现，后面没有速度数据。</p>\n<p>C的关系词未知，但reading speed已经换了指标。</p>\n<p><strong>上网与阅读对大脑的作用比较，是阅读速度的比较吗？</strong></p>\n<p>不是。C没有相应的速度依据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. depends on our web-surfing habits</h3>\n<blockquote><p>取决于我们的上网习惯</p>\n</blockquote>\n<p>把D接回题干，它说的是：互联网对大脑的影响由我们的上网习惯决定。</p>\n<p>D说取决于上网习惯，回第3段看是否比较不同习惯。</p>\n<blockquote><p>surfing the web exercised the brain more than reading did</p>\n</blockquote>\n<p>段落说整体影响尚未查清，再举上网与阅读两种活动的研究。没有区分上网时长、浏览类型或其他使用习惯如何决定效果。</p>\n<p>不能因为“上网”出现，就补出“取决于上网习惯”的因果关系。</p>\n<p><strong>该段已经查明不同上网习惯决定脑影响了吗？</strong></p>\n<p>没有。D把尚待研究的问题写成了确定原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>34题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n\n<hr />\n<h2>35题</h2>\n<blockquote><p>Neither Sparrow nor Storm would agree that ______.<br />\nSparrow和Storm都不会赞同下列哪一说法？</p>\n</blockquote>\n<p>Neither...nor要求同时对照两人的判断。先完整读Storm的代价、收益与未知，再接Sparrow对记忆对象和能力的区分；未谈某观点不等于明确反对它。</p>\n<blockquote><p>原文参考：</p>\n<p>“There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet, but I’d have to imagine that overall the benefits are going to outweigh those costs,” <strong>[xxx]</strong> psychology professor Benjamin Storm. “It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.”</p>\n<p>开始精读：</p>\n<p>“There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet, / but I’d have to imagine that overall the benefits are going to outweigh those costs,” / <strong>[xxx]</strong> psychology professor Benjamin Storm. / “It seems pretty clear that memory is changing, / but is it changing for the better? / At this point, we don’t know.”</p>\n<p>“随着更依赖互联网可能会有<strong>[xxx]</strong>的代价 / 但我想总体上收益会超过这些代价” / 心理学教授Benjamin Storm<strong>[xxx]</strong>。 / “记忆正在改变似乎很清楚 / 但是否向更好方向改变呢？ / 目前我们不知道。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. our reliance on the Internet will be costly</h3>\n<blockquote><p>我们依赖互联网会付出代价</p>\n</blockquote>\n<p>把A接回题干，它说的是：两人都不会赞同依赖互联网会有代价这一说法。</p>\n<p>这是找两人都不赞同的说法，先回末段看Storm是否否认代价。</p>\n<blockquote><p>There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet</p>\n</blockquote>\n<blockquote><p>overall the benefits are going to outweigh those costs</p>\n</blockquote>\n<p>Storm明确承认依赖互联网可能有代价，只是预计整体好处会超过代价。因此他并未否认存在代价。</p>\n<p>即使他说得比A的will更审慎，也不能把他概括成不接受任何代价这一点；这一项不符合两人共同反对的目标。</p>\n<p><strong>Storm已经承认可能有代价，A能作为两人都不赞同的最佳概括吗？</strong></p>\n<p>不能。A不是应选的共同分歧。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. the Internet is weakening our memory</h3>\n<blockquote><p>互联网正在削弱我们的记忆</p>\n</blockquote>\n<p>把B接回题干，它说的是：两人都不会接受把互联网造成的记忆变化直接定为记忆削弱。</p>\n<p>B说削弱记忆，分别回首段Sparrow与末段Storm核对。</p>\n<blockquote><p>The Internet may be changing merely what we remember, not our capacity to do so</p>\n</blockquote>\n<blockquote><p>we haven’t lost our ability to do it</p>\n</blockquote>\n<blockquote><p>It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.</p>\n</blockquote>\n<p>Sparrow将记什么与记忆能力区分，并说记忆在适应技术、我们没有失去记忆能力。她不接受由查找方式改变直接推出能力削弱。</p>\n<p>Storm也只确认记忆在变，变化是否更好尚不清楚，整体上还期待利大于弊。他没有把这种变化判定为记忆减弱。</p>\n<p><strong>把记忆变化直接定为互联网正在削弱记忆，是两位学者都认可的结论吗？</strong></p>\n<p>不是。Sparrow否认这种能力推论，Storm也未作这种负面定论，B符合题干的否定要求。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. memory exercise is a must for our brains</h3>\n<blockquote><p>记忆训练对大脑是必需的</p>\n</blockquote>\n<p>把C接回题干，它说的是：两人都不赞同大脑需要进行记忆训练。</p>\n<p>C说记忆训练必需，回第2段看Sparrow说的memorizing things。</p>\n<blockquote><p>I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things</p>\n</blockquote>\n<blockquote><p>overall the benefits are going to outweigh those costs</p>\n</blockquote>\n<p>她不认为机械记住东西有很高的教育价值，但这不等于全面否认任何记忆训练的必要性。Storm末段更没有评价是否必须训练。</p>\n<p>要选两人都不同意，需要两边的观点；C无法从一人的记忆价值评论推出两人的共同立场。</p>\n<p><strong>两位学者都明确否定了大脑需要记忆训练吗？</strong></p>\n<p>没有。C缺少双方依据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. our ability to focus <strong>[xxx]</strong> with age</h3>\n<blockquote><p>我们的专注能力随年龄<strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：两人都不赞同专注能力随年龄发生某种<strong>[xxx]</strong>变化。</p>\n<p>D说专注随年龄变化，回第3段分清这是谁的研究与观点。</p>\n<blockquote><p>There is no experimental evidence showing that it interferes with our ability to focus</p>\n</blockquote>\n<blockquote><p>in a 2008 study involving 24 participants</p>\n</blockquote>\n<p>专注证据不足以及老年研究，来自另外的专家和研究介绍，不是Sparrow、Storm共同提出的年龄判断。</p>\n<p>D的变化词未知，也不能把某次老年样本研究改成专注随年龄的规律，再安到这两人身上。</p>\n<p><strong>文中有没有这两位学者对年龄与专注关系的共同否定？</strong></p>\n<p>没有。D缺少题干指定人物的对应。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>35题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>what we remember；not capacity；information / folders</td><td>实验显示人们可能少记内容而记住查找路径，Sparrow区分记忆对象与记忆能力。</td><td>先提出问题，并用实验解释记忆重点的变化。</td></tr><tr><td>第2段</td><td>hard drive；other humans；learning from...to...</td><td>外部资源可以分担记忆任务，Sparrow据此设想学习从记事实转向更多概念性思考。</td><td>从实验中的存取策略推进到认知分工和学习方式。</td></tr><tr><td>第3段</td><td>too soon；no experimental evidence；24 participants</td><td>其他专家认为理解影响还太早，已有关于专注力和大脑锻炼的证据仍有限。</td><td>加入不同研究信息，限制对总体影响的仓促判断。</td></tr><tr><td>第4段</td><td>costs；benefits outweigh；changing；don’t know</td><td>Storm承认可能有代价并预期总体收益较大，但没有确定记忆变化究竟是否更好。</td><td>收束到改变已发生、好坏仍需辨别的谨慎判断。</td></tr></tbody></table>\n<p><strong>全文的主要意思：互联网可能改变记忆重点及学习分工，但这种改变不应直接等同于记忆能力削弱；它对大脑的具体影响及变化的好坏仍需进一步认识。</strong></p>\n\n<hr />\n<h2>回查33题：A还是C？</h2>\n<p>Which of the following would Sparrow support about the Internet?</p>\n<p>A. It may reform our learning approach.</p>\n<p>C. It may enhance our <strong>[xxx]</strong> to technology.</p>\n<h2>第33题二选一：A / C</h2>\n<p>首段实验说明人们可能不再记具体资料，而记到哪里查找。Sparrow把这说成记忆在适应技术，区分了记忆内容变化与记忆能力变化。</p>\n<p>第2段她接着提出一种学习方向：网络等外部来源可以保存事实，人们便有可能少把学习注意放在死记事实上，更多进行概念思考。原句直接说change our approach to learning，又有Perhaps表示可能。</p>\n<p><strong>A的may reform是否同时保留了学习方式这个对象和可能性？</strong></p>\n<p>都保留了，能完整接回她自己的话。C虽然有technology，却要另判断一种未知属性是否增强，不能仅凭技术一词相同就认定相符。</p>\n<p>因此不必猜C。A已获得她明确提出的变化内容、方向和语气支持。</p>\n<p><strong>最终选择：33. A。</strong></p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>31. C</strong></p>\n<p><strong>32. D</strong></p>\n<p><strong>33. A</strong></p>\n<p><strong>34. A</strong></p>\n<p><strong>35. B</strong></p>\n","analysisStartIndex":25,"maskInventory":{"token":"[xxx]","count":19},"questionFlowPlan":[{"qid":"31","initialParagraphPids":[1],"paragraphPids":[1],"entry":26,"options":{"A":27,"B":28,"C":29,"D":30},"initialReadingMode":"full_paragraph"},{"qid":"32","initialParagraphPids":[2],"paragraphPids":[2],"entry":32,"options":{"A":33,"B":34,"C":35,"D":36},"initialReadingMode":"full_paragraph"},{"qid":"33","initialParagraphPids":[],"paragraphPids":[1,2],"entry":38,"options":{"A":39,"B":40,"C":41,"D":42},"initialReadingMode":"reuse_previous"},{"qid":"34","initialParagraphPids":[3],"paragraphPids":[3],"entry":44,"options":{"A":45,"B":46,"C":47,"D":48},"initialReadingMode":"full_paragraph"},{"qid":"35","initialParagraphPids":[4],"paragraphPids":[1,2,4],"entry":50,"options":{"A":51,"B":52,"C":53,"D":54},"initialReadingMode":"full_paragraph"}],"jumpSections":["阅前须知","先读题干","读文章","开始做题","31题","32题","33题","34题","35题","进阶方法","进阶回查","最终答案"],"supplementaryFlow":{"id":"whole_text_argument_review_v1","mainQuestion":null,"ordinaryFirstRoundCandidates":{"31":["C"],"32":["D"],"33":["A","C"],"34":["A"],"35":["B"]},"reviews":[{"qid":33,"pair":["A","C"],"final":"A"}]}};
let idx=-1,fullMode=false,ready=false,savedInteractive={idx:-1,left:0,right:0};
const articleImg=document.getElementById('articleImg'),questionImg=document.getElementById('questionImg'),leftPane=document.getElementById('leftPane'),rightPane=document.getElementById('rightPane'),combined=document.getElementById('combined');
articleImg.src=DATA.articleImage;questionImg.src=DATA.questionImage;
function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}
function centerRight(){const el=document.getElementById('onlyCurrent');if(!el)return;combined.style.paddingTop='30px';combined.style.paddingBottom='60px';requestAnimationFrame(()=>{const h=el.getBoundingClientRect().height,ph=rightPane.clientHeight;if(h<ph-70){const pad=Math.max(30,Math.floor((ph-h)/2));combined.style.paddingTop=pad+'px';combined.style.paddingBottom=pad+'px'}rightPane.scrollTo({top:0,behavior:'smooth'})})}
function setControls(){document.getElementById('prev').disabled=fullMode||idx<0;document.getElementById('next').disabled=fullMode||idx>=DATA.steps.length-1||!ready;document.getElementById('reset').disabled=fullMode;document.getElementById('jump').disabled=fullMode;const t=document.getElementById('toggleAll');t.textContent=fullMode?'返回交互':'显示全部';t.classList.toggle('active',fullMode)}
function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;
let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function centerHorizontal(){
  requestAnimationFrame(()=>{
    if(!leftPane)return;
    if(zoomLevel>100&&leftPane.scrollWidth>leftPane.clientWidth){
      leftPane.scrollLeft=Math.max(0,Math.round((leftPane.scrollWidth-leftPane.clientWidth)/2));
    }else{
      leftPane.scrollLeft=0;
    }
    updateDragCursor();
  });
}
function updateDragCursor(){
  if(!leftPane)return;
  if(zoomLevel>100&&(leftPane.scrollWidth>leftPane.clientWidth||leftPane.scrollHeight>leftPane.clientHeight)){
    leftPane.style.cursor='grab';
  }else{
    leftPane.style.cursor='';
  }
}
function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
  centerHorizontal();
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+5);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-5);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
const pLeft=document.getElementById('panLeft');
if(pLeft)pLeft.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.max(0,leftPane.scrollLeft-120);};
const pRight=document.getElementById('panRight');
if(pRight)pRight.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.min(leftPane.scrollWidth-leftPane.clientWidth,leftPane.scrollLeft+120);};
const pCenter=document.getElementById('panCenter');
if(pCenter)pCenter.onclick=()=>centerHorizontal();
setupDragToPan(document.getElementById('leftPane'));
setTimeout(()=>applyZoom(zoomLevel),60);
window.addEventListener('keydown',e=>{
  if(fullMode||e.altKey||e.ctrlKey||e.metaKey)return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable))return;

const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
