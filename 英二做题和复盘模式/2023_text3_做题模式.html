<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**Sparrow’s study shows that with the Internet, the human brain will ______.**\n\n> Sparrow的研究显示，在互联网条件下人脑会怎样？\n\n题型：**研究结论题**。","html":"<h2>31题题干</h2>\n<p><strong>Sparrow’s study shows that with the Internet, the human brain will ______.</strong></p>\n<blockquote><p>Sparrow的研究显示，在互联网条件下人脑会怎样？</p>\n</blockquote>\n<p>题型：<strong>研究结论题</strong>。</p>\n","articleRects":[],"questionRects":[[153,128,28,17],[197,128,656,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**The process of “cognitive offloading” ______.**\n\n> “认知卸载”这一过程有什么作用？\n\n题型：**概念作用题**。","html":"<h2>32题题干</h2>\n<p><strong>The process of “cognitive offloading” ______.</strong></p>\n<blockquote><p>“认知卸载”这一过程有什么作用？</p>\n</blockquote>\n<p>题型：<strong>概念作用题</strong>。</p>\n","articleRects":[],"questionRects":[[153,381,403,23]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**Which of the following would Sparrow support about the Internet?**\n\n> 关于互联网，Sparrow会支持下列哪种说法？\n\n题型：**人物观点题**。","html":"<h2>33题题干</h2>\n<p><strong>Which of the following would Sparrow support about the Internet?</strong></p>\n<blockquote><p>关于互联网，Sparrow会支持下列哪种说法？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n","articleRects":[],"questionRects":[[153,636,28,17],[196,636,650,21]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**It is indicated in Paragraph 3 that how the Internet affects our brains ______.**\n\n> 第3段表明，互联网如何影响大脑这一问题处于什么状态？\n\n题型：**段落判断题**。","html":"<h2>34题题干</h2>\n<p><strong>It is indicated in Paragraph 3 that how the Internet affects our brains ______.</strong></p>\n<blockquote><p>第3段表明，互联网如何影响大脑这一问题处于什么状态？</p>\n</blockquote>\n<p>题型：<strong>段落判断题</strong>。</p>\n","articleRects":[],"questionRects":[[153,889,28,17],[196,889,663,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**Neither Sparrow nor Storm would agree that ______.**\n\n> Sparrow和Storm都不会赞同下列哪一说法？\n\n题型：**两位人物观点比较题**。","html":"<h2>35题题干</h2>\n<p><strong>Neither Sparrow nor Storm would agree that ______.</strong></p>\n<blockquote><p>Sparrow和Storm都不会赞同下列哪一说法？</p>\n</blockquote>\n<p>题型：<strong>两位人物观点比较题</strong>。</p>\n","articleRects":[],"questionRects":[[153,1143,28,17],[197,1143,432,22]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | not, while, but |\n| 态度词 / 评价词 | 先抓个大概好坏 | changing, saved, recall |\n| 动作词 | 先看谁做了什么 | information, memory, costs |\n| 结果词 | 看最后出了什么事 | participants, experts, benefits |\n| 重复主题词 | 大概知道老在说什么 | Internet, Sparrow, Storm |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>not, while, but</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>changing, saved, recall</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>information, memory, costs</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>participants, experts, benefits</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Internet, Sparrow, Storm</td></tr></tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 **[xxx]** in a computer (“an **[xxx]**’s eye is bigger than its brain,” for example). Half of the participants were told the information would be **[xxx]**, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when **[xxx]** on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn’t remember the information, but they remembered how to find the folders. In other words, human memory is not **[xxx]** but “adapting to new communications technology,” Sparrow says.","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 <strong>[xxx]</strong> in a computer (“an <strong>[xxx]</strong>’s eye is bigger than its brain,” for example). Half of the participants were told the information would be <strong>[xxx]</strong>, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when <strong>[xxx]</strong> on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn’t remember the information, but they remembered how to find 者对记忆变化各自怎样判断。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"none","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完 xx]** on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn’t remember the information, but they remembered how to find the folders. In other words, human memory is not **[xxx]** but “adapting to new communications technology,” Sparrow says.\n> \n> 开始精读：\n> \n> The Internet may be changing merely what we remember, not our capacity to do so, / suggests Columbia University psychology professor Betsy Sparrow. / In 2011, Sparrow led a study / in which participants were asked to record 40 **[xxx]** in a computer / (“an **[xxx]**’s eye is bigger than its brain,” for example). / Half of the participants were told the information would be **[xxx]**, / while the other half were told it would be saved. / Guess what? / The latter group made no effort to recall the information when **[xxx]** on it later, / because they knew they could find it on their computers. / In the same study, a group was asked to remember both the information and the folders it was stored in. / They didn’t remember the information, / but they remembered how to find the folders. / In other words, human memory is not **[xxx]** / but “adapting to new communications technology,” Sparrow says.\n> \n> 互联网可能只在改变我们记什么而不是记忆能力 / 哥伦比亚大学心理学教授Betsy Sparrow如此提出。 / 2011年Sparrow主持了一项研究 / 参与者被要求在电脑里记录四十条**[xxx]** / （例如“一只**[xxx]**的眼睛比脑子还大”）。 / 一半参与者被告知这些信息会被**[xxx]** / 另一半则被告知信息会被保存。 / 猜猜怎样？ / 后一组在后来就信息被**[xxx]**时没有努力回忆 / 因为他们知道能在电脑里找到它。 / 在同一研究中一组人被要求记住信息及存放信息的文件夹。 / 他们没记住信息 / 但记住了怎样找到文件夹。 / 换言之人类记忆并非在**[xxx]** / 而是“适应新的通信技术”Sparrow说。\n\n接下来按A—D逐项看。","html":"<h2>31题</h2>\n<blockquote><p>Sparrow’s study shows that with the Internet, the human brain will ______.<br />\nSparrow的研究显示，在互联网条件下人脑会怎样？</p>\n</blockquote>\n<p>人名与study定位首段。完整读两种记录安排，尤其比较没记住信息内容却记住查找位置的反差，区分记忆对象与能力。</p>\n<blockquote><p>原文参考：</p>\n<p>The Internet may be changing merely what we remember, not our capacity to do so, suggests collect information **[xxx]**\n\n> 以**[xxx]**的方式收集信息\n\n把B接回题干，它说的是：互联网会使人脑以某种**[xxx]**方式收集信息。\n\nB说收集方式变化，回首段看受试者是不是自己寻找资料。\n\n> participants were asked to record 40 **[xxx]** in a computer\n\n> they knew they could find it on their computers\n\n实验将信息给受试者，让他们记录，再观察记忆。结果讨论的是已记录的信息留在脑中的哪些部分。\n\nB的方式词未知，但collect已换成搜集信息的动作，不能用记忆结果直接证明搜集方式。\n\n**记录后记住什么，能直接说明人脑如何收集信息吗？**\n\n不能。B换了研究环节。\n\n**第一轮判断：B排除。**","html":"<h3>B. collect information <strong>[xxx]</strong></h3>\n<blockquote><p>以<strong>[xxx]</strong>的方式收集信息</p>\n</blockquote>\n<p>把B接回题干，它说的是：互联网会使人脑以某种<strong>[xxx]</strong>方式收集信息。</p>\n<p>B说收集方式变化，回首段看受试者是不是自己寻找资料。</p>\n<blockquote><p>participants were asked to record 40 <strong>[xxx]</strong> in a computer</p>\n</blockquote>\n<blockquote><p>they knew they could find it on their computers</p>\n</blockquote>\n<p>实验将信息给受试者，让他们记录，再观察记忆。结果讨论的是已记录的信息留在脑中的哪些部分。</p>\n<p>B的方式词未知，但collect已换成搜集信息的动作，不能用记忆结果直接证明搜集方式。</p>\n<p><strong>记录后记住什么，能直接说明人脑如何收集信息吗？</strong></p>\n<p>不能。B换了研究环节。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,195,745,22],[136,228,794,22],[135,261,794,22],[137,293,794,23],[136,327,795,22],[137,360,792,22],[136,393,794,22],[137,427,793,21],[136,460,793,22],[137,493,789,22],[136,525,793,23],[136,558,271,23]],"questionRects":[[197,213,314,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"31","option":"B","paragraphPids":[0]}},{"section":"31题","raw":"### C. switch its focus of memory\n\n> 改变记忆的侧重点\n\n把C接回题干，它说的是：互联网使人脑把记忆重点转向不同内容。\n\nC说记忆重点转移，回首段对照information与folders。\n\n> The Internet may be changing merely what we remember, not our capacity to do so\n\n> They didn’t remember the information, but they remembered how to find the folders.\n\n知道资料会保存时，人们不费力记内容；同时被要求记内容和文件夹时，更记得如何找到文件夹。记住的对象从事实转向位置。\n\n首句what we remember也直接提示这种区别：发生变化的是记什么，不是先断言能记住多少。\n\n**记查找位置而不记具体事实，是否就是记忆侧重点改变？**\n\n是。C把实验结果与首句概括接起来了。\n\n**第一轮判断：C保留。**","html":"<h3>C. switch its focus of memory</h3>\n<blockquote><p>改变记忆的侧重点</p>\n</blockquote>\n<p>把C接 ur approach to learning / from a focus on individual facts and memorization / to an **[xxx]** on more conceptual thinking / —something that is not available on the Internet. / “I personally have never seen all that much **[xxx]** value in memorizing things,” Sparrow says, / adding that we haven’t lost our ability to do it.\n> \n> 在很实际的意义上互联网正成为我们记忆的**[xxx]**硬盘 / 这一过程被称为“认知卸载”。 / 以往这一角色由数据库、图书馆和其他人**[xxx]**。 / 例如父亲可能从不记生日因为母亲记得。 / 有人担心这对社会产生**[xxx]**影响 / 但Sparrow看到一种**[xxx]**。 / 她提出这一趋势也许会改变学习方式 / 从关注个别事实与记忆 / 转到对更多概念性思考的**[xxx]** / ——这是一种互联网上无法直接取得的东西。 / Sparrow说“就我个人而言我从没在记住东西中看到那么大的**[xxx]**价值” / 并补充我们并未失去这样做的能力。\n\n接下来按A—D逐项看。","html":"<h2>32题</h2>\n<blockquote><p>The process of “cognitive offloading” ______.<br />\n“认知卸载”这一过程有什么作用？</p>\n</blockquote>\n<p>术语直接定位第2段。先完整读硬盘比喻及父母记生日的例子，再理解把记忆任务交给外部资源的作用。</p>\n<blockquote><p>原文参考：</p>\n<p>In a very practical way, the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories, a process known as “cognitive offloading.” Traditionally, this role was <strong>[xxx]</strong> by data banks, libraries, and other humans. Your father may never remember birthdays because your mother does, for instance. Some worry that this is having a <strong>[xxx]</strong> effect on society, but Sparrow sees an <strong>[xxx]</strong>. Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an <strong>[xxx]</strong> on more conceptual thinking —something that is not available on the Internet. “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, adding that we haven’t lost our ability to do it.</p>\n<p>开始精读：</p>\n<p>In a very practical way, the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories, / a process known as “cognitive offloading.” / Traditionally, this role was <strong>[xxx]</strong> by data banks, libraries, and other humans. / Your father may never remember birthdays because your mother does, for instance. / Some worry that this is having a <strong>[xxx]</strong> effect on society, / but Sparrow sees an <strong>[xxx]</strong>. / Perhaps, she suggests, the trend will change our approach to learning / from a focus on individual facts and memorization / to an <strong>[xxx]</strong> on more conceptual thinking / —something that is not available on the Internet. / “I personally have never seen all that much <strong>[xxx]</strong> value in memorizing things,” Sparrow says, / adding that we haven’t lost our ability to do it.</p>\n<p>在很实际的意义上互联网正成为我们记忆的<strong>[xxx]</strong>硬盘 / 这一过程被称为“认知卸载”。 / 以往这一角色由数据库、图书馆和其他人<strong>[xxx]</strong>。 / 例如父亲可能从不记生日因为母亲记得。 / 有人担心这对社会产生<strong>[xxx]</strong>影响 / 但Sparrow看到一种<strong>[xxx]</strong>。 / 她提出这一趋势也许会改变学习方式 / 从关注个别事实与记忆 / 转到对更多概念性思考的<strong>[xxx]</strong> / ——这是一种互联网上无法直接取得的东西。 / Sparrow说“就我个人而言我从没在记住东西中看到那么大的<strong>[xxx]</strong>价值” / 并补充我们并未失去这样做的能力。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[153,381,403,23],[197,424,360,22],[197,466,330,22],[197,509,351,22],[197,551,303,22]],"scrollTarget":"article","meta":{"kind":"question","qid":"32","paragraphPids":[1]}},{"section":"32题","raw":"### A. helps us identify false information\n\n> 帮助我们辨别虚假信息\n\n把A接回题干，它说的是：认知卸载使我们能识别资料是真是假。\n\nA说辨别真假，回第2段看外部储存与生日例子。\n\n> the Internet is becoming an **[xxx]** hard drive for our memories\n\n> Your father may never remember birthdays because your mother does\n\n资料库、图书馆或别人替我们保存信息，父亲也可能依靠母亲记生日。这里改变的是谁负责记。\n\n这些安排并未自动核查内容真伪。即使资料放在外部，仍可能需要另外判断可靠性。\n\n**把信息交给外部保存，就自带了判断真假的功能吗？**\n\n没有。A增加了概念没有说明的作用。\n\n**第一轮判断：A排除。**","html":"<h3>A. helps us identify false information</h3>\n<blockquote><p>帮助我们辨别虚假信息</p>\n</blockquote>\n<p>把A接回题干，它说的是：认知卸载使我们能识别资料是真是假。</p>\n<p>A说辨别真假，回第2段看外部储存与生日例子。</p>\n<blockquote><p>the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories</p>\n</blockquote>\n<blockquote><p>Your father may never remember birthdays because your mother does</p>\n</blockquote>\n<p>资料库、图书馆或别人替我们保存信息，父亲也可能依靠母亲记生日。这里改变的是谁负责记。</p>\n<p>这些安排并未自动核查内容真伪。即使资料放在外部，仍可能需要另外判断可靠性。</p>\n<p><strong>把信息交给外部保存，就自带了判断真假的功能吗？</strong></p>\n<p>没有。A增加了概念没有说明的作用。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[197,424,360,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"A","paragraphPids":[1]}},{"section":"32题","raw":"### B. keeps our memory from failing\n\n> 防止我们的记忆失灵\n\n把B接回题干，它说的是：认知卸载能够防止人脑记忆失灵。\n\nB说防止记忆失灵，回第2段区分不用记与不能记。\n\n> Your father may never remember birthdays because your mother does\n\n> we haven’t lost our ability to do it\n\n父亲不用记生日，因为母亲记得；这是一种分工，不是用它治疗或防止父亲的记忆能力下降。Sparrow还说我们没有丧失记忆能力。\n\n减轻需要亲自记的量，与防止大脑失灵是不同作用。\n\n**可以依靠别人或电脑记信息，就证明人脑记忆不会失灵吗？**\n\n不证明。B把分担任务改成了保护能力的保证。\n\n**第一轮判断：B排除。**","html":"<h3>B. keeps our memory from failing</h3>\n<blockquote><p>防止我们的记忆失灵</p>\n</blockquote>\n<p>把B接回题干，它说的是：认知卸载能够防止人脑记忆失灵。</p>\n<p>B说防止记忆失灵，回第2段区分不用记与不能记。</p>\n<blockquote><p>Your father may never remember birthdays because your mother does</p>\n</blockquote>\n<blockquote><p>we haven’t lost our ability to do it</p>\n</blockquote>\n<p>父亲不用记生日，因为母亲记得；这是一种分工，不是用它治疗或防止父亲的记忆能力下降。Sparrow还说我们没有丧失记忆能力。</p>\n<p>减轻需要亲自记的量，与防止大脑失灵是不同作用。</p>\n<p><strong>可以依靠别人或电脑记信息，就证明人脑记忆不会失灵吗？</strong></p>\n<p>不证明。B把分担任务改成了保护能力的保证。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[197,466,330,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"B","paragraphPids":[1]}},{"section":"32题","raw":"### C. enables us to classify **[xxx]** facts\n\n> 使我们能对**[xxx]**事实分类\n\n把C接回题干，它说的是：认知卸载帮助我们将某类事实分门别类。\n\nC说事实分类，回第2段看cognitive offloading强调什么。\n\n> this role was **[xxx]** by data banks, libraries, and other humans\n\n概念是把记忆任务交给互联网或其他外部来源，传统上也能依靠图书馆与别人。没有要求把事实分成若干类别。\n\n首段出现文件夹，只是存放位置的例子，不意味着认知卸载的功能就是分类。C的修饰词未知也不改变这一差别。\n\n**使用文件夹保存信息，就足以把认知卸载定义成分类事实吗？**\n\n不足。C把一个储存形式当成了主要作用。\n\n**第一轮判断：C排除。**","html":"<h3>C. enables us to classify <strong>[xxx]</strong> facts</h3>\n<blockquote><p>使我们能对<strong>[xxx]</strong>事实分类</p>\n</blockquote>\n<p>把C接回题干，它说的是：认知卸载帮助我们将某类事实分门别类。</p>\n<p>C说事实分类，回第2段看cognitive offloading强调什么。</p>\n<blockquote><p>this role was <strong>[xxx]</strong> by data banks, libraries, and other humans</p>\n</blockquote>\n<p>概念是把记忆任务交给互联网或其他外部来源，传统上也能依靠图书馆与别人。没有要求把事实分成若干类别。</p>\n<p>首段出现文件夹，只是存放位置的例子，不意味着认知卸载的功能就是分类。C的修饰词未知也不改变这一差别。</p>\n<p><strong>使用文件夹保存信息，就足以把认知卸载定义成分类事实吗？</strong></p>\n<p>不足。C把一个储存形式当成了主要作用。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[197,509,351,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"32","option":"C","paragraphPids":[1]}},{"section":"32题","raw":"### D. lessens our memory burdens\n\n> 减轻我们的记忆负担\n\n把D接回题干，它说的是：认知卸载使我们不必亲自记住所有信息。\n\nD说减轻记忆负担，回第2段看父亲与母亲的生日分工。\n\n> the Internet is becoming an **[xxx]** hard drive for our memories\n\n> Your father may never remember birthdays because your mother does\n\n母亲记得生日，父亲就不必同时记；网络和资料库也可以保存我们需要的信息。要使用时找回来，不必把每项内容放在自己脑中。\n\nD概括的是个人承担的记忆任务减少，而不是人的记忆能力变差。\n\n**一部分信息由别人或外部工具保存，是否减轻自己记忆的负担？**\n\n是。D与概念及例子都相合。\n\n**第一轮判断：D保留。**","html":"<h3>D. lessens our memory burdens</h3>\n<blockquote><p>减轻我们的记忆负担</p>\n</blockquote>\n<p>把D接回题干，它说的是：认知卸载使我们不必亲自记住所有信息。</p>\n<p>D说减轻记忆负担，回第2段看父亲与母亲的生日分工。</p>\n<blockquote><p>the Internet is becoming an <strong>[xxx]</strong> hard drive for our memories</p>\n</blockquote>\n<blockquote><p>Your father may never remember birthdays because your mother does</p>\n</blockquote>\n<p>母亲记得生日，父亲就不必同时记；网络和资料库也可以保存我们需要的信息。要使用时找回来，不必把每项内容放在自己脑中。</p>\n<p>D概括的是个人承担的记忆任务减少，而不是人的记忆能力变差。</p>\n<p><strong>一部分信息由别人或外部工具保存，是否减轻自己记忆的负担？</strong></p>\n<p>是。D与概念及例子都相合。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[197,551,303,22]],"scrollTarget":"article","meta":{"kind":"option","status":"保留","qid":"32","option":"D","paragraphPids":[1]}},{"section":"32题","raw":"### 32题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","html":"<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n","articleRects":[],"questionRects":[[153,381,403,23],[197,424,360,22],[197,466,330,22],[197,509,351,22],[197,551,303,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> Which of the following would Sparrow support about the Internet?  \n> 关于互联网，Sparrow会支持下列哪种说法？\n\n先读Sparrow提出学习方式变化的完整语句，再回接首段记忆对象与能力的区分。这里问特定学者的观点，不能把Some worry所引的别人意见归给她。\n\n这一段前面已经完整读过，下面直接回到各项所涉及的句子。\n\n接下来按A—D逐项看。","html":"<h2>33题</h2>\n<blockquote><p>Which of the following would Sparrow support about the Internet?<br />\n关于互联网，Sparrow会支持下列哪种说法？</p>\n</blockquote>\n<p>先读Sparrow提出学习方式变化的完整语句，再回接首段记忆对象与能力的区分。这里问特定学者的观点，不能把Some worry所引的别人意见归给她。</p>\n<p>这一段前面已经完整读过，下面直接回到各项所涉及的句子。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,195,745,22],[136,228,794,22],[135,261,794,22],[137,293,794,23],[136,327,795,22],[137,360,792,22],[136,393,794,22],[137,427,793,21],[136,460,793,22],[137,493,789,22],[136,525,793,23],[136,558,271,23],[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22] [xxx]** effect on society, but Sparrow sees an **[xxx]**.\n\n> Perhaps, she suggests, the trend will change our approach to learning\n\n一些人担心这种变化对社会不好，but后转到Sparrow的另一种看法。她随后谈的是将注意力腾给概念思考的可能。\n\nB借用了前半句的担忧，却把持这种担忧的人换成Sparrow。不能因为同段出现就归给她。\n\n**负面担忧在文中明确由Sparrow提出吗？**\n\n不是。转折把她与那些担忧者区分开了，A才直接对应她的看法。\n\n**第一轮判断：B排除。**","html":"<h3>B. It may impact our society negatively.</h3>\n<blockquote><p>它可能对社会产生负面影响。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Sparrow会支持互联网可能给社会带来负面影响。</p>\n<p>B说负面影响，回第2段看Some worry与but Sparrow。</p>\n<blockquote><p>Some worry that this is having a <strong>[xxx]</strong> effect on society, but Sparrow sees an <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>Perhaps, she suggests, the trend will change our approach to learning</p>\n</blockquote>\n<p>一些人担心这种变化对社会不好，but后转到Sparrow的另一种看法。她随后谈的是将注意力腾给概念思考的可能。</p>\n<p>B借用了前半句的担忧，却把持这种担忧的人换成Sparrow。不能因为同段出现就归给她。</p>\n<p><strong>负面担忧在文中明确由Sparrow提出吗？</strong></p>\n<p>不是。转折把她与那些担忧者区分开了，A才直接对应她的看法。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[197,720,389,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"33","option":"B","paragraphPids":[1]}},{"section":"33题","raw":"### C. It may enhance our **[xxx]** to technology.\n\n> 它可能增强我们对技术的**[xxx]**。\n\n把C接回题干，它说的是：Sparrow认为互联网可能增强我们对技术的某种**[xxx]**。\n\nC说增强对技术的某种性质，回首段看adapting to new communications technology。\n\n> human memory is not **[xxx]** but “adapting to new communications technology,”\n\n> The Internet may be changing merely what we remember, not our capacity to do so\n\nSparrow说记忆在适应新技术，具体表现是记住查找途径。C也提technology，因而值得先与原句对照。\n\n但增强的核心属性词未知，目前不能把适应过程自动读成这种属性已增强。先和A留下回查。\n\n**知道记忆正在适应技术，足以确认C中哪一种属性增强了吗？**\n\n还不足。C暂留，不能先补出未知词再判断。\n\n**第一轮判断：C保留。**","html":"<h3>C. It may enhance our <strong>[xxx]</strong> to technology.</h3>\n<blockquot ote>\n<p>Sparrow希望学习从个别事实与记忆，转向更多概念性思考。互联网能储存事实，使人有可能重新分配学习注意。</p>\n<p>D却说互联网阻碍这种思考，方向与她提出的潜在转变相反。</p>\n<p><strong>她把概念思考写成可能更加重视的方向，能概括成受到妨碍吗？</strong></p>\n<p>不能。D读反了她的观点。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22]],"questionRects":[[197,805,472,21]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"33","option":"D","paragraphPids":[1]}},{"section":"33题","raw":"### 33题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\n暂留A、C，等把全文连起来后再回来比较。","html":"<h3>33题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂留A、C，等把全文连起来后再回来比较。</p>\n","articleRects":[],"questionRects":[[153,636,28,17],[196,636,650,21],[197,678,389,22],[197,720,389,22],[197,763,480,21],[197,805,472,21]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> It is indicated in Paragraph 3 that how the Internet affects our brains ______.  \n> 第3段表明，互联网如何影响大脑这一问题处于什么状态？\n\n定位第3段并完整读首句和两个例子，区分研究尚未充分与已有个别发现；不能用一个研究的参与者代表整个领域。\n\n> 原文参考：\n> \n> Still other experts say it’s too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among **[xxx]** older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.\n> \n> 开始精读：\n> \n> Still other experts say it’s too soon to understand how the Internet affects our brains. / There is no experimental evidence showing that it interferes with our ability to focus, / for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. / And surfing the web exercised the brain more than reading did / among **[xxx]** older adults / in a 2008 study involving 24 participants / at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.\n> \n> 还有专家表示要理解互联网如何影响大脑仍为时过早。 / 没有实验证据显示它妨碍我们的专注能力 / 例如心理学家Christopher Chabris和Daniel J. Simons如此写道。 / 而浏览网络比阅读更多锻炼大脑 / 在**[xxx]**的老年人中 / 在一项2008年涉及二十四名参与者的研究中 / 研究来自加州大学洛杉矶分校Semel神经科学与人类行为研究所。\n\n接下来按A—D逐项看。","html":"<h2>34题</h2>\n<blockquote><p>It is indicated in Paragraph 3 that how the Internet affects our brains ______.<br />\n第3段表明，互联网如何影响大脑这一问题处于什么状态？</p>\n</blockquote>\n<p>定位第3段并完整读首句和两个例子，区分研究尚未充分与已有个别发现；不能用一个研究的参与者代表整个领域。</p>\n<blockquote><p>原文参考：</p>\n<p>Still other experts say it’s too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among <strong>[xxx]</strong> older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n<p>开始精读：</p>\n<p>Still other experts say it’s too soon to understand how the Internet affects our brains. / There is no experimental evidence showing that it interferes with our ability to focus, / for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. / And surfing the web exercised the brain more than reading did / among <strong>[xxx]</strong> older adults / in a 2008 study involving 24 participants / at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.</p>\n<p>还有专家表示要理解互联网如何影响大脑仍为时过早。 / 没有实验证据显示它妨碍我们的专注能力 / 例如心理学家Christopher Chabris和Daniel J. Simons如此写道。 / 而浏览网络比阅读更多锻炼大脑 / 在<strong>[xxx]</strong>的老年人中 / 在一项2008年涉及二十四名参与者的研究中 / 研究来自加州大学洛杉矶分校Semel神经科学与人类行为研究所。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[185,923,745 udy involving 24 participants\n\n作者介绍一项特定研究，发现上网在这批人中比阅读更锻炼大脑。没有统计整个研究领域里老年样本占多少。\n\n出现一个老年样本，不足以说明关于互联网与大脑的研究大多集中于老人。\n\n**举了一项老人研究，就能判断整个领域主要研究老人吗？**\n\n不能。B把一个例子扩大成研究总体分布。\n\n**第一轮判断：B排除。**","html":"<h3>B. is most studied in older adults</h3>\n<blockquote><p>主要在老年人中得到研究</p>\n</blockquote>\n<p>把B接回题干，它说的是：关于互联网影响大脑的研究，主要集中于老年人。</p>\n<p>B说主要研究老人，回第3段看24名老年人的研究是例子还是总体统计。</p>\n<blockquote><p>among <strong>[xxx]</strong> older adults in a 2008 study involving 24 participants</p>\n</blockquote>\n<p>作者介绍一项特定研究，发现上网在这批人中比阅读更锻炼大脑。没有统计整个研究领域里老年样本占多少。</p>\n<p>出现一个老年样本，不足以说明关于互联网与大脑的研究大多集中于老人。</p>\n<p><strong>举了一项老人研究，就能判断整个领域主要研究老人吗？</strong></p>\n<p>不能。B把一个例子扩大成研究总体分布。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[185,923,745,22],[136,959,794,21],[137,994,792,22],[136,1029,793,22],[136,1065,793,21],[136,1100,790,22],[136,1136,125,21]],"questionRects":[[197,974,320,17]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"B","paragraphPids":[2]}},{"section":"34题","raw":"### C. is **[xxx]** in our reading speed\n\n> 在我们的阅读速度中被**[xxx]**\n\n把C接回题干，它说的是：互联网对大脑的影响与阅读速度形成某种**[xxx]**关系。\n\nC谈阅读速度，回第3段看surfing与reading比较的指标。\n\n> surfing the web exercised the brain more than reading did\n\n比较的是锻炼大脑的程度，不是每分钟读多少字或完成阅读所需时间。reading作为活动出现，后面没有速度数据。\n\nC的关系词未知，但reading speed已经换了指标。\n\n**上网与阅读对大脑的作用比较，是阅读速度的比较吗？**\n\n不是。C没有相应的速度依据。\n\n**第一轮判断：C排除。**","html":"<h3>C. is <strong>[xxx]</strong> in our reading speed</h3>\n<blockquote><p>在我们的阅读速度中被<strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：互联网对大脑的影响与阅读速度形成某种<strong>[xxx]</strong>关系。</p>\n<p>C谈阅读速度，回第3段看surfing与reading比较的指标。</p>\n<blockquote><p>surfing the web exercised the brain more than reading did</p>\n</blockquote>\n<p>比较的是锻炼大脑的程度，不是每分钟读多少字或完成阅读所需时间。reading作为活动出现，后面没有速度数据。</p>\n<p>C的关系词未知，但reading speed已经换了指标。</p>\n<p><strong>上网与阅读对大脑的作用比较，是阅读速度的比较吗？</strong></p>\n<p>不是。C没有相应的速度依据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[185,923,745,22],[136,959,794,21],[137,994,792,22],[136,1029,793,22],[136,1065,793,21],[136,1100,790,22],[136,1136,125,21]],"questionRects":[[196,1016,342,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"C","paragraphPids":[2]}},{"section":"34题","raw":"### D. depends on our web-surfing habits\n\n> 取决于我们的上网习惯\n\n把D接回题干，它说的是：互联网对大脑的影响由我们的上网习惯决定。\n\nD说取决于上网习惯，回第3段看是否比较不同习惯。\n\n> surfing the web exercised the brain more than reading did\n\n段落说整体影响尚未查清，再举上网与阅读两种活动的研究。没有区分上网时长、浏览类型或其他使用习惯如何决定效果。\n\n不能因为“上网”出现，就补出“取决于上网习惯”的因果关系。\n\n**该段已经查明不同上网习惯决定脑影响了吗？**\n\n没有。D把尚待研究的问题写成了确定原因。\n\n**第一轮判断：D排除。**","html":"<h3>D. depends on our web-surfing habits</h3>\n<blockquote><p>取决于我们的上网习惯</p>\n</blockquote>\n<p>把D接回题干，它说的是：互联网对大脑的影响由我们的上网习惯决定。</p>\n<p>D说取决于上网习惯，回第3段看是否比较不同习惯。</p>\n<blockquote><p>surfing the web exercised the brain more than reading did</p>\n</blockquote>\n<p>段落说整体影响尚未查清，再举上网与阅读两种活动的研究。没有区分上网时长、浏览类型或其他使用习惯如何决定效果。</p>\n<p>不能因为“上网”出现，就补出“取决于上网习惯”的因果关系。</p>\n<p><strong>该段已经查明不同上网习惯决定脑影响了吗？</strong></p>\n<p>没有。D把尚待研究的问题写成了确定原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[185,923,745,22],[136,959,794,21],[137,994,792,22],[136,1029,793,22],[136,1065,793,21],[136,1100,790,22],[136,1136,125,21]],"questionRects":[[196,1058,363,22]],"scrollTarget":"article","meta":{"kind":"option","status":"排除","qid":"34","option":"D","paragraphPids":[2]}},{"section":"34题","raw":"### 34题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。","html":"<h3>34题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n","articleRects":[],"questionRects":[[153,889,28,17],[196,889,663,22],[196,932,361,21],[197,974,320,17],[196,1016,342,22],[196,1058,363,22]],"scrollTarget":"question","meta":{"kind":"first_result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n> Neither Sparrow nor Storm would agree that ______.  \n> Sparrow和Storm都不会赞同下列哪一说法？\n\nNeither...nor要求同时对照两人的判断。先完整读Storm的代价、收益与未知，再接Sparrow对记忆对象和能力的区分；未谈某观点不等于明确反对它。\n\n> 原文参考：\n> \n> “There may be costs **[xxx]** with our increased reliance on the Internet, but I’d have to imagine that overall the benefits are going to outweigh those costs,” **[xxx]** psychology professor Benjamin Storm. “It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.”\n> \n> 开始精读：\n> \n> “There may be costs **[xxx]** with our increased reliance on the Internet, / but I’d have to imagine that overall the benefits are going to outweigh those costs,” / **[xxx]** psychology professor Benjamin Storm. / “It seems pretty clear that memory is changing, / but is it changing for the better? / At this point, we don’t know.”\n> \n> “随着更依赖互联网可能会有**[xxx]**的代价 / 但我想总体上收益会超过这些代价” / 心理学教授Benjamin Storm**[xxx]**。 / “记忆正在改变似乎很清楚 / 但是否向更好方向改变呢？ / 目前我们不知道。”\n\n接下来按A—D逐项看。","html":"<h2>35题</h2>\n<blockquote><p>Neither Sparrow nor Storm would agree that ______.<br />\nSparrow和Storm都不会赞同下列哪一说法？</p>\n</blockquote>\n<p>Neither...nor要求同时对照两人的判断。先完整读Storm的代价、收益与未知，再接Sparrow对记忆对象和能力的区分；未谈某观点不等于明确反对它。</p>\n<blockquote><p>原文参考：</p>\n<p>“There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet, but I’d have to imagine that overall the benefits are going to outweigh those costs,” <strong>[xxx]</strong> psychology professor Benjamin Storm. “It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.”</p>\n<p>开始精读：</p>\n<p>“There may be costs <strong>[xxx]</strong> with our increased reliance on the Internet, / but I’d have to imagine that overall the benefits are going to outweigh those costs,” / <strong>[xxx]</strong> psychology professor Benjamin Storm. / “It seems pretty clear that memory is changing, / but is it changing for the better? / At this point, we don’t know.”</p>\n<p>“随着更依赖互联网可能会有<strong>[xxx]</strong>的代价 / 但我想总体上收益会超过这些代价” / 心理学教授Benjamin Storm<strong>[xxx]</strong>。 / “记忆正在改变似乎很清楚 / 但是否向更好方向改变呢？ / 目前我们不知道。”</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[184,1 eta":{"kind":"option","status":"排除","qid":"35","option":"A","paragraphPids":[3]}},{"section":"35题","raw":"### B. the Internet is weakening our memory\n\n> 互联网正在削弱我们的记忆\n\n把B接回题干，它说的是：两人都不会接受把互联网造成的记忆变化直接定为记忆削弱。\n\nB说削弱记忆，分别回首段Sparrow与末段Storm核对。\n\n> The Internet may be changing merely what we remember, not our capacity to do so\n\n> we haven’t lost our ability to do it\n\n> It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.\n\nSparrow将记什么与记忆能力区分，并说记忆在适应技术、我们没有失去记忆能力。她不接受由查找方式改变直接推出能力削弱。\n\nStorm也只确认记忆在变，变化是否更好尚不清楚，整体上还期待利大于弊。他没有把这种变化判定为记忆减弱。\n\n**把记忆变化直接定为互联网正在削弱记忆，是两位学者都认可的结论吗？**\n\n不是。Sparrow否认这种能力推论，Storm也未作这种负面定论，B符合题干的否定要求。\n\n**第一轮判断：B保留。**","html":"<h3>B. the Internet is weakening our memory</h3>\n<blockquote><p>互联网正在削弱我们的记忆</p>\n</blockquote>\n<p>把B接回题干，它说的是：两人都不会接受把互联网造成的记忆变化直接定为记忆削弱。</p>\n<p>B说削弱记忆，分别回首段Sparrow与末段Storm核对。</p>\n<blockquote><p>The Internet may be changing merely what we remember, not our capacity to do so</p>\n</blockquote>\n<blockquote><p>we haven’t lost our ability to do it</p>\n</blockquote>\n<blockquote><p>It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.</p>\n</blockquote>\n<p>Sparrow将记什么与记忆能力区分，并说记忆在适应技术、我们没有失去记忆能力。她不接受由查找方式改变直接推出能力削弱。</p>\n<p>Storm也只确认记忆在变，变化是否更好尚不清楚，整体上还期待利大于弊。他没有把这种变化判定为记忆减弱。</p>\n<p><strong>把记忆变化直接定为互联网正在削弱记忆，是两位学者都认可的结论吗？</strong></p>\n<p>不是。Sparrow否认这种能力推论，Storm也未作这种负面定论，B符合题干的否定要求。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[184,195,745,22],[136,228,794,22],[135,261,794,22],[137,293,794,23],[136,327,795,22],[137,360,792,22],[136,393,794,22],[137,427,793,21],[136,460,793,22],[137,493,789,22],[136,525,793,23],[136,558,271,23],[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22],[186,1170,740,23],[136,1206,793,22],[136,1240,794,23],[136,1277,793,22],[137,1312,114, proach.\n\nC. It may enhance our **[xxx]** to technology.\n\n## 第33题二选一：A / C\n\n首段实验说明人们可能不再记具体资料，而记到哪里查找。Sparrow把这说成记忆在适应技术，区分了记忆内容变化与记忆能力变化。\n\n第2段她接着提出一种学习方向：网络等外部来源可以保存事实，人们便有可能少把学习注意放在死记事实上，更多进行概念思考。原句直接说change our approach to learning，又有Perhaps表示可能。\n\n**A的may reform是否同时保留了学习方式这个对象和可能性？**\n\n都保留了，能完整接回她自己的话。C虽然有technology，却要另判断一种未知属性是否增强，不能仅凭技术一词相同就认定相符。\n\n因此不必猜C。A已获得她明确提出的变化内容、方向和语气支持。\n\n**最终选择：33. A。**","html":"<h2>回查33题：A还是C？</h2>\n<p>Which of the following would Sparrow support about the Internet?</p>\n<p>A. It may reform our learning approach.</p>\n<p>C. It may enhance our <strong>[xxx]</strong> to technology.</p>\n<h2>第33题二选一：A / C</h2>\n<p>首段实验说明人们可能不再记具体资料，而记到哪里查找。Sparrow把这说成记忆在适应技术，区分了记忆内容变化与记忆能力变化。</p>\n<p>第2段她接着提出一种学习方向：网络等外部来源可以保存事实，人们便有可能少把学习注意放在死记事实上，更多进行概念思考。原句直接说change our approach to learning，又有Perhaps表示可能。</p>\n<p><strong>A的may reform是否同时保留了学习方式这个对象和可能性？</strong></p>\n<p>都保留了，能完整接回她自己的话。C虽然有technology，却要另判断一种未知属性是否增强，不能仅凭技术一词相同就认定相符。</p>\n<p>因此不必猜C。A已获得她明确提出的变化内容、方向和语气支持。</p>\n<p><strong>最终选择：33. A。</strong></p>\n","articleRects":[[184,195,745,22],[136,228,794,22],[135,261,794,22],[137,293,794,23],[136,327,795,22],[137,360,792,22],[136,393,794,22],[137,427,793,21],[136,460,793,22],[137,493,789,22],[136,525,793,23],[136,558,271,23],[184,592,746,22],[137,624,792,23],[136,658,793,22],[136,692,793,21],[137,725,786,21],[136,758,794,22],[137,791,792,22],[136,823,793,23],[136,856,790,23],[137,890,458,22],[185,923,745,22],[136,959,794,21],[137,994,792,22],[136,1029,793,22],[136,1065,793,21],[136,1100,790,22],[136,1136,125,21],[186,1170,740,23],[136,1206,793,22],[136,1240,794,23],[136,1277,793,22],[137,1312,114,17]],"questionRects":[[153,636,28,17],[196,636,650,21],[197,678,389,22],[197,720,389,22],[197,763,480,21],[197,805,472,21]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","C"],"finalChoice":"A","qid":"33","paragraphPids":[0,1,2,3]}},{"section":"最终答案","raw":"## 最终答案\n\n**31. C**\n\n**32. D**\n\n**33. A**\n\n**34. A**
