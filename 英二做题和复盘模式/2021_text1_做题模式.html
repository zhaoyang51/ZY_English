识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>21题题干</h2>\n<p><strong>Research by the World Economic Forum suggests ______.</strong></p>\n<blockquote><p>世界经济论坛的研究表明什么？</p>\n</blockquote>\n<p>题型：<strong>研究含义题</strong>。</p>\n\n<hr />\n<h2>22题题干</h2>\n<p><strong>AT&amp;T is cited to show ______.</strong></p>\n<blockquote><p>作者引用AT&amp;T是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例证作用题</strong>。</p>\n\n<hr />\n<h2>23题题干</h2>\n<p><strong>Efforts to resolve the skills mismatch in Canada ______.</strong></p>\n<blockquote><p>加拿大为解决技能错配所作的努力怎样？</p>\n</blockquote>\n<p>题型：<strong>具体评价题</strong>。</p>\n\n<hr />\n<h2>24题题干</h2>\n<p><strong>We can learn from Paragraph 3 that there was ______.</strong></p>\n<blockquote><p>从第3段可知，当时存在什么情况？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>25题题干</h2>\n<p><strong>Scandinavian Airlines decided to ______.</strong></p>\n<blockquote><p>斯堪的纳维亚航空公司决定怎样做？</p>\n</blockquote>\n<p>题型：<strong>具体行动题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, rather than, although</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>rapidly, high, shortages</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>reskill, replace, support</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>skills, unemployment, program</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>workers, companies, government</td></tr></tbody></table>\n\n<hr />\n<p>“Reskilling” is something that sounds like a <strong>[xxx]</strong> but is actually a requirement if we plan to have a future in which a lot of would-be workers do not get left behind. We know we are moving into a period where the jobs in demand will change rapidly, as will the requirements of the jobs that remain. Research by the World Economic Forum finds that on average 42 per cent of the “core skills” within job roles will change by 2022. That is a very short timeline.</p>\n\n<hr />\n<p>“Reskilling” is something that sounds like a <strong>[xxx]</strong> / but is actually a requirement / if we plan to have a future in which a lot of would-be workers do not get left behind. / We know we are moving into a period / where the jobs in demand will change rapidly, / as will the requirements of the jobs that remain. / Research by the World Economic Forum finds / that on average 42 per cent of the “core skills” within job roles will change by 2022. / That is a very short timeline.</p>\n\n<hr />\n<p>“重新学习技能” is something that sounds like a <strong>[xxx]</strong> / but is actually 一项要求 / if we plan to have a future in which a lot of 潜在劳动者 不被落下. / We know we are moving into a period / where the 有需求的工作 will 快速改变, / as will the 要求 of the jobs that remain. / Research by the 世界经济论坛 finds / that on average 百分之四十二 of the “核心技能” within job roles 到2022年会改变. / That is a 很短时间跨度.</p>\n\n<hr />\n<p>1、重新学习技能、一项要求、潜在劳动者、不被落下、有需求的工作、快速改变、要求、世界经济论坛、百分之四十二、核心技能、到2022年会改变、很短时间跨度。</p>\n\n<hr />\n<p>The question of who should pay for reskilling is a <strong>[xxx]</strong> one. For individual companies, the <strong>[xxx]</strong> is always to let go of workers whose skills are no longer in demand and replace them with those whose skills are. That does not always happen. AT&amp;T is often given as the gold standard of a company that decided to do a <strong>[xxx]</strong> reskilling program rather than go with a fire-and-hire strategy. Other companies had also <strong>[xxx]</strong> to create their own plans. When the skills mismatch is in the broader economy, though, the focus usually turns to government to handle. Efforts in Canada and elsewhere have been <strong>[xxx]</strong> <strong>[xxx]</strong> at best, and have given us a situation where we <strong>[xxx]</strong> hear of employers begging for workers, even at times and in regions where unemployment is high.</p>\n\n<hr />\n<p>The question of who should pay for reskilling is a <strong>[xxx]</strong> one. / For individual companies, the <strong>[xxx]</strong> is always / to let go of workers whose skills are no longer in demand / and replace them with those whose skills are. / That does not always happen. / AT&amp;T is often given as the gold standard of a company / that decided to do a <strong>[xxx]</strong> reskilling program / rather than go with a fire-and-hire strategy. / Other companies had also <strong>[xxx]</strong> to create their own plans. / When the skills mismatch is in the broader economy, though, / the focus usually turns to government to handle. / Efforts in Canada and elsewhere have been <strong>[xxx]</strong> <strong>[xxx]</strong> at best, / and have given us a situation / where we <strong>[xxx]</strong> hear of employers begging for workers, / even at times and in regions where unemployment is high.</p>\n\n<hr />\n<p>The question of 谁应付费 for 重新学习技能 is a <strong>[xxx]</strong> one. / For 个别公司, the <strong>[xxx]</strong> is always / to let go of 员工 whose skills are no longer in demand / and 替换他们 with those whose skills are. / That does not always happen. / AT&amp;T is often given as the gold standard of a company / that decided to do a <strong>[xxx]</strong> reskilling program / rather than go with a 解雇再雇策略. / Other companies had also <strong>[xxx]</strong> to create their own plans. / When the 技能错配 is in the 更广经济, though, / the focus usually turns to 政府 to handle. / Efforts in 加拿大 and elsewhere have been <strong>[xxx]</strong> <strong>[xxx]</strong> at best, / and have given us a situation / where we <strong>[xxx]</strong> hear of 雇主急求员工, / even at times and in regions where 失业率高.</p>\n\n<hr />\n<p>2、谁应付费、重新学习技能、个别公司、员工、替换他们、AT&amp;T、解雇再雇策略、技能错配、更广经济、政府、加拿大、雇主急求员工、失业率高。</p>\n\n<hr />\n<p>With the pandemic, unemployment is very high indeed. In February, at 3.5 per cent and 5.5 per cent <strong>[xxx]</strong>, unemployment rates in Canada and the United States were at <strong>[xxx]</strong> lows and worker shortages were everywhere. As of May, those rates had <strong>[xxx]</strong> up to 13.3 per cent and 13.7 per cent, and although many worker shortages had disappeared, not all had done so. In the medical field, to take an obvious example, the pandemic meant that there were still clear shortages of doctors, nurses and other medical <strong>[xxx]</strong>.</p>\n\n<hr />\n<p>With the pandemic, unemployment is very high indeed. / In February, at 3.5 per cent and 5.5 per cent <strong>[xxx]</strong>, / unemployment rates in Canada and the United States were at <strong>[xxx]</strong> lows / and worker shortages were everywhere. / As of May, those rates had <strong>[xxx]</strong> up to 13.3 per cent and 13.7 per cent, / and although many worker shortages had disappeared, / not all had done so. / In the medical field, to take an obvious example, / the pandemic meant that there were still clear shortages / of doctors, nurses and other medical <strong>[xxx]</strong>.</p>\n\n<hr />\n<p>With the 疫情, 失业 is very high indeed. / In 二月, at 3.5 per cent and 5.5 per cent <strong>[xxx]</strong>, / unemployment rates in Canada and the United States were at <strong>[xxx]</strong> lows / and 员工短缺 were everywhere. / As of 五月, those rates had <strong>[xxx]</strong> up to 百分之十三点三 and 百分之十三点七, / and although many worker shortages had disappeared, / not all had done so. / In the 医疗领域, to take an obvious example, / the pandemic meant that there were still clear shortages / of 医生护士 and other medical <strong>[xxx]</strong>.</p>\n\n<hr />\n<p>3、疫情、失业、二月、员工短缺、五月、百分之十三点三、百分之十三点七、医疗领域、医生护士。</p>\n\n<hr />\n<p>Of course, it is not like you can take an unemployed waiter and train him to be a doctor in a few weeks. But even if you cannot close that gap, maybe you can close others, and doing so would be to the benefit of all concerned. That seems to be the case in Sweden: When forced to <strong>[xxx]</strong> 90 per cent of their cabin staff, Scandinavian Airlines decided to start up a short retraining program that reskilled the laid-off workers to support hospital staff. The effort was a <strong>[xxx]</strong> one and involved other companies as well as a Swedish university.</p>\n\n<hr />\n<p>Of course, it is not like you can take an unemployed waiter / and train him to be a doctor in a few weeks. / But even if you cannot close that gap, / maybe you can close others, / and doing so would be to the benefit of all concerned. / That seems to be the case in Sweden: / When forced to <strong>[xxx]</strong> 90 per cent of their cabin staff, / Scandinavian Airlines decided to start up a short retraining program / that reskilled the laid-off workers to support hospital staff. / The effort was a <strong>[xxx]</strong> one / and involved other companies as well as a Swedish university.</p>\n\n<hr />\n<p>Of course, it is not like you can take 失业服务员 / and 训练他成为医生 几周内. / But even if you cannot 补上那个缺口, / maybe you can 补上其他缺口, / and doing so would be to the benefit of all concerned. / That seems to be the case in 瑞典: / When forced to <strong>[xxx]</strong> 百分之九十 of their 客舱员工, / 斯堪的纳维亚航空公司 decided to start up a 短期再培训计划 / that reskilled the 离岗员工 to 支持医院人员. / The effort was a <strong>[xxx]</strong> one / and involved 其他公司 as well as 一所瑞典大学.</p>\n\n<hr />\n<p>4、失业服务员、训练他成为医生、几周内、补上那个缺口、补上其他缺口、瑞典、百分之九十、客舱员工、斯堪的纳维亚航空公司、短期再培训计划、离岗员工、支持医院人员、其他公司、一所瑞典大学。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：重新学习技能、岗位变化、失业、缺人和短期培训。刚才还看到：重新学习技能、一项要求、潜在劳动者、不被落下、有需求的工作、快速改变、要求、世界经济论坛、百分之四十二、核心技能、到2022年会改变、很短时间跨度；谁应付费、重新学习技能、个别公司、员工、替换他们、AT&amp;T、解雇再雇策略、技能错配、更广经济、政府、加拿大、雇主急求员工、失业率高；疫情、失业、二月、员工短缺、五月、百分之十三点三、百分之十三点七、医疗领域、医生护士；失业服务员、训练他成为医生、几周内、补上那个缺口、补上其他缺口、瑞典、百分之九十、客舱员工、斯堪的纳维亚航空公司、短期再培训计划、离岗员工、支持医院人员、其他公司、一所瑞典大学。</p>\n<p>到这里还不能自然地说清楚：为什么失业高仍然缺人，企业与政府各承担什么，末段案例能补上哪类缺口而不能补上哪类。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n\n<hr />\n<h2>21题</h2>\n<blockquote><p>Research by the World Economic Forum suggests ______.<br />\n世界经济论坛的研究表明什么？</p>\n</blockquote>\n<p>研究名称定位首段。读清变化的是岗位技能要求，以及very short timeline强调的时间紧迫性，不将比例当作就业人数。</p>\n<blockquote><p>原文参考：</p>\n<p>“Reskilling” is something that sounds like a <strong>[xxx]</strong> but is actually a requirement if we plan to have a future in which a lot of would-be workers do not get left behind. We know we are moving into a period where the jobs in demand will change rapidly, as will the requirements of the jobs that remain. Research by the World Economic Forum finds that on average 42 per cent of the “core skills” within job roles will change by 2022. That is a very short timeline.</p>\n<p>开始精读：</p>\n<p>“Reskilling” is something that sounds like a <strong>[xxx]</strong> / but is actually a requirement / if we plan to have a future in which a lot of would-be workers do not get left behind. / We know we are moving into a period / where the jobs in demand will change rapidly, / as will the requirements of the jobs that remain. / Research by the World Economic Forum finds / that on average 42 per cent of the “core skills” within job roles will change by 2022. / That is a very short timeline.</p>\n<p>“重新学习技能”听起来像一个<strong>[xxx]</strong> / 但实际上是一项要求 / 如果我们希望未来很多潜在劳动者不被落下。 / 我们知道正进入这样一个时期 / 有需求的工作将快速改变 / 保留下来的工作要求也会如此。 / 世界经济论坛的研究发现 / 到2022年岗位中平均百分之四十二的“核心技能”将改变。 / 那是很短的时间跨度。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. a controversy about the “core skills”</h3>\n<blockquote><p>关于核心技能的争议</p>\n</blockquote>\n<p>把A接回题干，它说的是：世界经济论坛的研究显示人们对核心技能存在争议。</p>\n<p>A说核心技能有争议，回首段看42 per cent后面接的动作。</p>\n<blockquote><p>on average 42 per cent of the “core skills” within job roles will change by 2022</p>\n</blockquote>\n<p>研究说工作中的核心技能将有约42%发生变化，并强调时间很短。这里给的是变化预测。</p>\n<p>core skills加引号是对一个概念的引用，不能只凭引号就推定有人争论它。原文没有摆出两种相反观点。</p>\n<p><strong>报告技能将变动，是否等于报告人们对技能存在争议？</strong></p>\n<p>不等于。A换了研究内容。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. an increase in full-time <strong>[xxx]</strong></h3>\n<blockquote><p>全职<strong>[xxx]</strong>的增加</p>\n</blockquote>\n<p>把B接回题干，它说的是：研究显示某种全职<strong>[xxx]</strong>数量增加。</p>\n<p>B说全职某项增加，回首段看研究究竟统计什么。</p>\n<blockquote><p>42 per cent of the “core skills” within job roles will change</p>\n</blockquote>\n<p>42%统计的是岗位核心技能中将改变的部分，不是全职雇员、职位或其他全职项目的数量。fully或full-time的分类也没有出现在这项数据中。</p>\n<p>B的名词未读懂，但full-time与increase已经另加了研究没有报告的分类和增长方向。</p>\n<p><strong>技能中有42%将变化，能否推出某种全职数量增加？</strong></p>\n<p>不能。B没有这项数据依据。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. an urgent demand for new job skills</h3>\n<blockquote><p>对新工作技能的迫切需求</p>\n</blockquote>\n<p>把C接回题干，它说的是：研究显示人们迫切需要掌握新的工作技能。</p>\n<p>C说急需新技能，回首段把42%与very short timeline接起来。</p>\n<blockquote><p>the jobs in demand will change rapidly, as will the requirements of the jobs that remain.</p>\n</blockquote>\n<blockquote><p>That is a very short timeline.</p>\n</blockquote>\n<p>不少核心技能将发生变化，意味着现有技能不能一直满足岗位要求。变化又在很短时间内到来，留给人们学习的时间有限。</p>\n<p>C中的new job skills对应需要更新的能力，urgent则由短时间说明，不是凭空加上的紧迫感。</p>\n<p><strong>大量技能很快改变，是否意味着掌握新技能不能拖延？</strong></p>\n<p>是。C由比例和时间两点一起推出。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. a steady growth of job opportunities</h3>\n<blockquote><p>就业机会稳定增长</p>\n</blockquote>\n<p>把D接回题干，它说的是：研究显示工作机会正在稳定增加。</p>\n<p>D说就业机会稳定增长，回首段区分岗位要求变动与岗位数量增加。</p>\n<blockquote><p>the jobs in demand will change rapidly, as will the requirements of the jobs that remain</p>\n</blockquote>\n<p>作者说需求中的工作会变，仍存在的岗位要求也会变。研究随后量化的是技能变化比例。</p>\n<p>岗位内容变化可能伴随增减，但这段没有给净增数量，更没有描述steady这种稳定增长趋势。</p>\n<p><strong>岗位所需技能发生变化，就证明工作机会稳定增多吗？</strong></p>\n<p>不能。D把技能变化改成了职位数量趋势。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>21题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h2>22题</h2>\n<blockquote><p>AT&amp;T is cited to show ______.<br />\n作者引用AT&amp;T是为了说明什么？</p>\n</blockquote>\n<p>AT&amp;T定位第2段。先读企业通常可能采取的解雇再雇方案，再看That does not always happen与rather than怎样引入这个例子。</p>\n<blockquote><p>原文参考：</p>\n<p>The question of who should pay for reskilling is a <strong>[xxx]</strong> one. For individual companies, the <strong>[xxx]</strong> is always to let go of workers whose skills are no longer in demand and replace them with those whose skills are. That does not always happen. AT&amp;T is often given as the gold standard of a company that decided to do a <strong>[xxx]</strong> reskilling program rather than go with a fire-and-hire strategy. Other companies had also <strong>[xxx]</strong> to create their own plans. When the skills mismatch is in the broader economy, though, the focus usually turns to government to handle. Efforts in Canada and elsewhere have been <strong>[xxx]</strong> <strong>[xxx]</strong> at best, and have given us a situation where we <strong>[xxx]</strong> hear of employers begging for workers, even at times and in regions where unemployment is high.</p>\n<p>开始精读：</p>\n<p>The question of who should pay for reskilling is a <strong>[xxx]</strong> one. / For individual companies, the <strong>[xxx]</strong> is always / to let go of workers whose skills are no longer in demand / and replace them with those whose skills are. / That does not always happen. / AT&amp;T is often given as the gold standard of a company / that decided to do a <strong>[xxx]</strong> reskilling program / rather than go with a fire-and-hire strategy. / Other companies had also <strong>[xxx]</strong> to create their own plans. / When the skills mismatch is in the broader economy, though, / the focus usually turns to government to handle. / Efforts in Canada and elsewhere have been <strong>[xxx]</strong> <strong>[xxx]</strong> at best, / and have given us a situation / where we <strong>[xxx]</strong> hear of employers begging for workers, / even at times and in regions where unemployment is high.</p>\n<p>谁应为重新学习技能付费是个<strong>[xxx]</strong>问题。 / 对个别公司而言<strong>[xxx]</strong>总是 / 让技能不再被需要的员工离开 / 并用技能被需要的人替换他们。 / 但不总是这样。 / AT&amp;T常被作为公司的金标准 / 它决定实行<strong>[xxx]</strong>的再培训计划 / 而非采用解雇再雇用的策略。 / 其他公司也<strong>[xxx]</strong>制定自己的计划。 / 但当技能错配出现在更广经济层面时 / 关注点通常转向由政府处理。 / 加拿大等地的努力充其量可<strong>[xxx]</strong>说是<strong>[xxx]</strong> / 并导致这样一种局面 / 我们<strong>[xxx]</strong>听说雇主急求员工 / 甚至在失业率很高的时段和地区。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. an immediate need for government support</h3>\n<blockquote><p>急需政府支持</p>\n</blockquote>\n<p>把A接回题干，它说的是：AT&amp;T的例子说明企业当下迫切需要政府帮助。</p>\n<p>A说急需政府帮助，回第2段看AT&amp;T之后什么时候才转到government。</p>\n<blockquote><p>AT&amp;T is often given as the gold standard of a company that decided to do a <strong>[xxx]</strong> reskilling program</p>\n</blockquote>\n<blockquote><p>When the skills mismatch is in the broader economy, though, the focus usually turns to government to handle.</p>\n</blockquote>\n<p>AT&amp;T自己决定开展再培训，紧接着还提其他公司制定计划。随后用When…broader economy转入整个经济层面的技能错配与政府责任。</p>\n<p>A把后面讨论的更大问题移到AT&amp;T身上，原文没有说这家公司需要政府救助才能培训。</p>\n<p><strong>AT&amp;T例子本身有没有展示对政府支持的迫切需要？</strong></p>\n<p>没有。它先展示公司面对员工技能过时时的一种选择。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. an <strong>[xxx]</strong> to the fire-and-hire strategy</h3>\n<blockquote><p>相对于解雇再雇策略的一种<strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：AT&amp;T的例子展示了一种与解雇再雇策略相对的<strong>[xxx]</strong>。</p>\n<p>B提到fire-and-hire，回第2段找rather than两边。</p>\n<blockquote><p>decided to do a <strong>[xxx]</strong> reskilling program rather than go with a fire-and-hire strategy</p>\n</blockquote>\n<p>一边是让技能过时的员工离开，再雇用技能合适的人；另一边是AT&amp;T开展再培训。rather than直接把两种做法相对照。</p>\n<p>B的核心名词暂时未知，但相对解雇再雇这一已知关系与例子紧密相接。其他项都没有保留这组选择。</p>\n<p><strong>AT&amp;T是用再培训代替解雇再雇吗？</strong></p>\n<p>是。B可以依据rather than与已知的策略关系保留，不必猜出未知词。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. the characteristics of reskilling programs</h3>\n<blockquote><p>再培训计划的特点</p>\n</blockquote>\n<p>把C接回题干，它说的是：AT&amp;T的例子是为了介绍再培训项目通常具有什么特点。</p>\n<p>C说介绍培训特点，回第2段看例子有没有展开课程怎样办。</p>\n<blockquote><p>decided to do a <strong>[xxx]</strong> reskilling program rather than go with a fire-and-hire strategy</p>\n</blockquote>\n<p>原文只告诉我们AT&amp;T决定培训，而不采用解雇再雇；没有列课程、时长、考核办法等项目特点。</p>\n<p>gold standard评价这家公司作出的选择，并不等于文章开始讲所有再培训项目通常有什么特征。</p>\n<p><strong>这个例子实际展开的是培训项目的特点，还是公司选择培训这件事？</strong></p>\n<p>是后者。C把例子的说明任务改了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. the importance of staff appraisal standards</h3>\n<blockquote><p>员工考核标准的重要性</p>\n</blockquote>\n<p>把D接回题干，它说的是：AT&amp;T的例子说明员工评估标准很重要。</p>\n<p>D说考核标准重要，回第2段看gold standard修饰谁。</p>\n<blockquote><p>AT&amp;T is often given as the gold standard of a company that decided to do a <strong>[xxx]</strong> reskilling program</p>\n</blockquote>\n<p>gold standard把AT&amp;T称为值得借鉴的公司例子，因它选择培训员工。不是说公司建立了某项员工评价标准。</p>\n<p>D借用了standard相似的词意，却把示范公司变成员工考核制度。文中没有讨论如何评价员工成绩。</p>\n<p><strong>公司被当成典范，等于文中论证员工考核标准重要吗？</strong></p>\n<p>不等于。D没有对应原句。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n\n<hr />\n<h2>23题</h2>\n<blockquote><p>Efforts to resolve the skills mismatch in Canada ______.<br />\n加拿大为解决技能错配所作的努力怎样？</p>\n</blockquote>\n<p>第2段已读过，回到Canada及后面的and have given us a situation。评价词未知时，可用它引出的实际结果判断。</p>\n<p>这一段前面已经完整读过，下面直接回到各项所涉及的句子。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. have appeared to be insufficient</h3>\n<blockquote><p>显得不足</p>\n</blockquote>\n<p>把A接回题干，它说的是：加拿大解决技能错配的努力看来仍不充分。</p>\n<p>A说努力不足，回第2段末看高失业与雇主缺人同时出现。</p>\n<blockquote><p>employers begging for workers, even at times and in regions where unemployment is high</p>\n</blockquote>\n<p>即使在失业率高的时候和地区，仍听到雇主急需工人。有人没有工作，企业却找不到所需技能，错配仍没有解决。</p>\n<p>即便前面的评价生词未读懂，这个残留结果也能帮助判断努力尚不充分。A正是对解决效果的概括。</p>\n<p><strong>解决后仍大量出现有人失业、岗位缺人的错配，是否说明努力还不够？</strong></p>\n<p>说明还不足。A与作者紧接着给出的现状相符。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. have driven up labour costs</h3>\n<blockquote><p>推高了用工成本</p>\n</blockquote>\n<p>把B接回题干，它说的是：加拿大解决技能错配的努力导致劳动力成本上涨。</p>\n<p>B说推高用工成本，回第2段末看有没有费用变化数据。</p>\n<blockquote><p>we <strong>[xxx]</strong> hear of employers begging for workers, even at times and in regions where unemployment is high</p>\n</blockquote>\n<p>雇主急着找人说明招聘需求没得到满足，原文没有写工资涨了多少或企业培训支出增加。</p>\n<p>缺人可能让人想到加薪，但这只是可能的应对，不能当作这段已给出的加拿大努力造成的结果。</p>\n<p><strong>雇主缺人，就足以证明解决技能错配的努力推高了成本吗？</strong></p>\n<p>不足。B既没有成本数据，也没有这种因果说明。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. have proved to be inconsistent</h3>\n<blockquote><p>被证明前后不一致</p>\n</blockquote>\n<p>把C接回题干，它说的是：加拿大解决技能错配的努力被证明缺乏一致性。</p>\n<p>C说前后不一致，回第2段看作者比较了哪些政策。</p>\n<blockquote><p>Efforts in Canada and elsewhere have been <strong>[xxx]</strong> <strong>[xxx]</strong> at best, and have given us a situation</p>\n</blockquote>\n<p>作者展示解决效果仍不充分，没有比较两期政策是否互相矛盾，也没有列出不同地区做法彼此冲突。</p>\n<p>高失业与招工难的并存，是技能供求不匹配，不是政策努力本身前后不一致。</p>\n<p><strong>结果仍有错配，就能断定采取的努力前后矛盾吗？</strong></p>\n<p>不能。C把效果不足改成了一致性问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. have met with <strong>[xxx]</strong> opposition</h3>\n<blockquote><p>遭遇了<strong>[xxx]</strong>的反对</p>\n</blockquote>\n<p>把D接回题干，它说的是：加拿大解决技能错配的努力遇到某种程度的反对。</p>\n<p>D说遇到反对，回第2段末看有没有反对者和反对行动。</p>\n<blockquote><p>employers begging for workers</p>\n</blockquote>\n<blockquote><p>unemployment is high</p>\n</blockquote>\n<p>段落报告的是雇主仍缺人、部分地区失业率高，没有谁反对培训、拒绝计划或阻止实施的叙述。</p>\n<p>D修饰反对的词未知，仍不能仅凭问题未解决就认定一定遭到反对。</p>\n<p><strong>努力未奏效，就证明有人对这些努力表示反对吗？</strong></p>\n<p>没有。D给现状补了原文未写的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>23题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n\n<hr />\n<h2>24题</h2>\n<blockquote><p>We can learn from Paragraph 3 that there was ______.<br />\n从第3段可知，当时存在什么情况？</p>\n</blockquote>\n<p>完整读第3段，尤其留意although many...not all的范围限制。整体失业上升不代表每个行业的人手都已充足。</p>\n<blockquote><p>原文参考：</p>\n<p>With the pandemic, unemployment is very high indeed. In February, at 3.5 per cent and 5.5 per cent <strong>[xxx]</strong>, unemployment rates in Canada and the United States were at <strong>[xxx]</strong> lows and worker shortages were everywhere. As of May, those rates had <strong>[xxx]</strong> up to 13.3 per cent and 13.7 per cent, and although many worker shortages had disappeared, not all had done so. In the medical field, to take an obvious example, the pandemic meant that there were still clear shortages of doctors, nurses and other medical <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>With the pandemic, unemployment is very high indeed. / In February, at 3.5 per cent and 5.5 per cent <strong>[xxx]</strong>, / unemployment rates in Canada and the United States were at <strong>[xxx]</strong> lows / and worker shortages were everywhere. / As of May, those rates had <strong>[xxx]</strong> up to 13.3 per cent and 13.7 per cent, / and although many worker shortages had disappeared, / not all had done so. / In the medical field, to take an obvious example, / the pandemic meant that there were still clear shortages / of doctors, nurses and other medical <strong>[xxx]</strong>.</p>\n<p>疫情之下失业率的确很高。 / 二月份以百分之三点五和百分之五点五<strong>[xxx]</strong>而言 / 加拿大与美国的失业率处于<strong>[xxx]</strong>低点 / 而员工短缺到处存在。 / 到五月那些比率已经<strong>[xxx]</strong>到百分之十三点三与百分之十三点七 / 尽管许多员工短缺已经消失 / 却不是所有都消失。 / 以医疗领域为一个明显例子 / 疫情意味着仍有明显短缺 / 医生、护士及其他医疗<strong>[xxx]</strong>的短缺。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. a sign of economic recovery</h3>\n<blockquote><p>经济复苏的迹象</p>\n</blockquote>\n<p>把A接回题干，它说的是：第3段显示当时出现经济复苏迹象。</p>\n<p>A说复苏迹象，回第3段比较2月与5月失业率。</p>\n<blockquote><p>With the pandemic, unemployment is very high indeed.</p>\n</blockquote>\n<blockquote><p>those rates had <strong>[xxx]</strong> up to 13.3 per cent and 13.7 per cent</p>\n</blockquote>\n<p>早些时候失业率较低，之后在疫情中升到13%以上。作者强调的是失业严重，但某些专业仍缺人。</p>\n<p>没有随后出现回落数据或恢复招聘的趋势。把少数行业缺人当作整个经济复苏，也跨过了专业差异。</p>\n<p><strong>高失业中医疗岗位仍缺人，就能代表经济已出现复苏吗？</strong></p>\n<p>不能。A没有接住本段展示的就业困境。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. a call for policy <strong>[xxx]</strong></h3>\n<blockquote><p>对政策<strong>[xxx]</strong>的呼吁</p>\n</blockquote>\n<p>把B接回题干，它说的是：第3段出现了要求对政策采取某种<strong>[xxx]</strong>的呼吁。</p>\n<p>B说呼吁政策变化，回第3段看叙述中有没有行动要求。</p>\n<blockquote><p>unemployment is very high indeed</p>\n</blockquote>\n<blockquote><p>there were still clear shortages of doctors, nurses and other medical <strong>[xxx]</strong></p>\n</blockquote>\n<p>这段从失业率讲到医疗人员短缺，给出就业供求的事实。没有提出政府应该如何修改某项政策。</p>\n<p>B关键名词未知，但a call已经把事实介绍改成了一项呼吁，正文在这里没有这一步。</p>\n<p><strong>报告失业和缺人，等于本段发出了某种政策呼吁吗？</strong></p>\n<p>不等于。B改变了这段实际说的内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. a change in hiring practices</h3>\n<blockquote><p>招聘做法的变化</p>\n</blockquote>\n<p>把C接回题干，它说的是：第3段显示雇主改变了招聘方式。</p>\n<p>C说招聘做法改变，回第3段看变化的是数字还是招聘方法。</p>\n<blockquote><p>although many worker shortages had disappeared, not all had done so</p>\n</blockquote>\n<p>失业率上升，许多行业缺人问题消失，但医疗领域仍短缺。变化的是就业供求状况。</p>\n<p>原文没有比较雇主改用什么渠道招人、放宽哪些要求或怎样筛选候选人，因此不能把供求变化写成方法变化。</p>\n<p><strong>岗位和求职者数量变化，是否就是招聘方式变化？</strong></p>\n<p>不是。C换了比较对象。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. a lack of medical workers</h3>\n<blockquote><p>医疗工作人员短缺</p>\n</blockquote>\n<p>把D接回题干，它说的是：第3段显示医疗领域仍然缺少工作人员。</p>\n<p>D说医疗人员短缺，回第3段末找clear shortages of doctors, nurses。</p>\n<blockquote><p>there were still clear shortages of doctors, nurses and other medical <strong>[xxx]</strong></p>\n</blockquote>\n<p>医生、护士以及其他医疗人员被明确列为仍不足的岗位。它们用来说明失业率虽高，也并非所有缺人问题都消失。</p>\n<p>D概括了这组人员，不额外推定他们缺少的具体人数或原因。</p>\n<p><strong>本段明确列出仍然短缺的医疗人员，是否直接支持D？</strong></p>\n<p>是。D有直接对应。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>24题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n\n<hr />\n<h2>25题</h2>\n<blockquote><p>Scandinavian Airlines decided to ______.<br />\n斯堪的纳维亚航空公司决定怎样做？</p>\n</blockquote>\n<p>公司名定位末段。把“不可能几周成为医生”的让步与后面的支持医院人员分开，读清培训对象、目的及合作方。</p>\n<blockquote><p>原文参考：</p>\n<p>Of course, it is not like you can take an unemployed waiter and train him to be a doctor in a few weeks. But even if you cannot close that gap, maybe you can close others, and doing so would be to the benefit of all concerned. That seems to be the case in Sweden: When forced to <strong>[xxx]</strong> 90 per cent of their cabin staff, Scandinavian Airlines decided to start up a short retraining program that reskilled the laid-off workers to support hospital staff. The effort was a <strong>[xxx]</strong> one and involved other companies as well as a Swedish university.</p>\n<p>开始精读：</p>\n<p>Of course, it is not like you can take an unemployed waiter / and train him to be a doctor in a few weeks. / But even if you cannot close that gap, / maybe you can close others, / and doing so would be to the benefit of all concerned. / That seems to be the case in Sweden: / When forced to <strong>[xxx]</strong> 90 per cent of their cabin staff, / Scandinavian Airlines decided to start up a short retraining program / that reskilled the laid-off workers to support hospital staff. / The effort was a <strong>[xxx]</strong> one / and involved other companies as well as a Swedish university.</p>\n<p>当然并不是说可以让一个失业服务员 / 在几周内受训成为医生。 / 但即使不能补上那个缺口 / 也许可以补上别的缺口 / 这样做将使所有相关者受益。 / 瑞典似乎就是这样： / 当被迫<strong>[xxx]</strong>百分之九十客舱员工时 / 斯堪的纳维亚航空公司决定启动短期再培训计划 / 让离岗员工重新学习技能以支持医院人员。 / 这是一项<strong>[xxx]</strong>的努力 / 其他公司以及一所瑞典大学也参与其中。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. create job <strong>[xxx]</strong> for the unemployed</h3>\n<blockquote><p>为失业者创造工作<strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：航空公司决定为失业人群创造某种工作<strong>[xxx]</strong>。</p>\n<p>A说创造工作某种项目，回末段看航空公司真正启动的是什么。</p>\n<blockquote><p>Scandinavian Airlines decided to start up a short retraining program that reskilled the laid-off workers to support hospital staff</p>\n</blockquote>\n<p>航空公司启动短期再培训，使离岗员工能去支持医院人员。它在改变员工能做的工作，而不是明说建立新岗位。</p>\n<p>A名词未知，create job…也不能自动等同于reskilled。培训已有员工与创造某种工作项目需要分别确认。</p>\n<p><strong>让离岗员工学会另一种工作，就能把行动概括成A中未知的创造项目吗？</strong></p>\n<p>不能确认。C明确写为其他工作作准备，与再培训直接相合。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. retrain their cabin staff for better services</h3>\n<blockquote><p>再培训客舱员工以提供更好的服务</p>\n</blockquote>\n<p>把B接回题干，它说的是：航空公司决定培训客舱员工，以使服务更好。</p>\n<p>B说为了更好服务而培训，回末段看support hospital staff限定了哪种新工作。</p>\n<blockquote><p>reskilled the laid-off workers to support hospital staff</p>\n</blockquote>\n<p>这些员工离开客舱岗位后，被培训去支持医院人员。目的与去向被明确写出，是跨到另一类工作。</p>\n<p>B只保留培训客舱员工、服务更好，容易接成改善原有服务；原文没有比较服务质量，而是解释他们如何转做医院支持工作。</p>\n<p><strong>作者在这里强调服务质量提升，还是为离岗员工转岗？</strong></p>\n<p>强调转岗。C比B更准确地保留了原文目的。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. prepare their laid-off workers for other jobs</h3>\n<blockquote><p>使离岗员工为其他工作作准备</p>\n</blockquote>\n<p>把C接回题干，它说的是：航空公司决定帮助离岗员工获得从事其他工作的准备。</p>\n<p>C说为其他工作准备，回末段看reskilled the laid-off workers to support hospital staff。</p>\n<blockquote><p>a short retraining program that reskilled the laid-off workers to support hospital staff</p>\n</blockquote>\n<p>离岗的是航空客舱人员，培训后支持的是医院工作人员。前后工作不同，短期培训正是帮助他们适应新任务。</p>\n<p>C的other jobs概括新去向，prepare概括培训的作用，没有把他们说成几周内就成为医生。</p>\n<p><strong>从客舱工作转到医院支持任务前接受培训，是否就是为其他工作作准备？</strong></p>\n<p>是。C与行动、对象、目的都一致。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. finance their staff’s college education</h3>\n<blockquote><p>资助员工接受大学教育</p>\n</blockquote>\n<p>把D接回题干，它说的是：航空公司决定替员工支付大学教育费用。</p>\n<p>D说支付大学教育，回末段看university在项目中怎样出现。</p>\n<blockquote><p>The effort was a <strong>[xxx]</strong> one and involved other companies as well as a Swedish university.</p>\n</blockquote>\n<p>大学和其他公司一起参与这项培训，但原文没有说员工进入大学读学位，也没有说航空公司支付他们的大学学费。</p>\n<p>参加培训项目的大学，是合作方；不能把合作方的身份直接改成员工接受大学教育的证明。</p>\n<p><strong>有大学参与短期培训，就说明公司资助员工读大学吗？</strong></p>\n<p>不能。D把合作培训变成了大学教育资助。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>25题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>change rapidly；42 per cent；short timeline</td><td>岗位技能很快改变，再培训是避免劳动者掉队的现实需要。</td><td>提出紧迫性。</td></tr><tr><td>第2段</td><td>rather than；skills mismatch；unemployment</td><td>企业可选择培训而非解雇再雇，更广错配仍需要公共层面的努力。</td><td>讨论应对选择与尚未解决的匹配难题。</td></tr><tr><td>第3段</td><td>high unemployment；medical shortages</td><td>疫情下失业高，但医疗等领域仍缺人。</td><td>用现状说明数量失业与特定技能短缺可以共存。</td></tr><tr><td>第4段</td><td>close others；retraining；hospital staff</td><td>虽不能迅速弥补全部专业缺口，合作培训仍可使部分离岗员工转向医院支持工作。</td><td>以可行案例说明有限但实际的再培训作用。</td></tr></tbody></table>\n<p><strong>全文的主要意思：岗位技能快速变化使再培训具有紧迫性；即使总体失业很高，特定行业仍可能缺人，企业和其他机构合作培训能帮助部分员工转向新工作，但不能瞬间补齐所有专业差距。</strong></p>\n\n<hr />\n<h2>把“缺人”与“失业”同时保留下来</h2>\n<p>第21题说的是技能要求变化快，所以需要新的技能；它不是预测工作机会总量一定增长。第22题以AT&amp;T说明企业面对错配可以选择再培训，而非只会解雇再雇；第23题则看到更大层面匹配仍不充分，雇主缺人和很多人失业能够同时发生。</p>\n<p>第24题把这件事放到疫情期间具体化：失业率很高，也不代表医生护士等专业岗位已经有人可用。因此最后的案例不能被解释成“任何失业者几周都能当医生”。作者明确承认这种差距难以短期填上，再转向可以补的其他缺口。</p>\n<p>第25题的航空员工培训正是这种有限做法：使离岗员工准备支持医院工作人员，既不是凭空新增航空岗位，也不是资助所有人读大学。大学只是合作参与者，原文未提供学位或费用安排。</p>\n<p>这样连读，文章的主张既有实际用处，也有边界。再培训能改变技能与任务之间的匹配，却不等于短期内消除一切失业或职业资格差距。每题的判断都应保留它实际讨论的技能、人员、培训动作及时间尺度。</p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>21. C</strong></p>\n<p><strong>22. B</strong></p>\n<p><strong>23. A</strong></p>\n<p><strong>24. D</strong></p>\n<p><strong>25. C</strong></p>\n","analysisStartIndex":25,"maskInventory":{"token":"[xxx]","count":19},"questionFlowPlan":[{"qid":"21","initialParagraphPids":[1],"paragraphPids":[1],"entry":26,"options":{"A":27,"B":28,"C":29,"D":30},"initialReadingMode":"full_paragraph"},{"qid":"22","initialParagraphPids":[2],"paragraphPids":[2],"entry":32,"options":{"A":33,"B":34,"C":35,"D":36},"initialReadingMode":"full_paragraph"},{"qid":"23","initialParagraphPids":[],"paragraphPids":[2],"entry":38,"options":{"A":39,"B":40,"C":41,"D":42},"initialReadingMode":"reuse_previous"},{"qid":"24","initialParagraphPids":[3],"paragraphPids":[3],"entry":44,"options":{"A":45,"B":46,"C":47,"D":48},"initialReadingMode":"full_paragraph"},{"qid":"25","initialParagraphPids":[4],"paragraphPids":[4],"entry":50,"options":{"A":51,"B":52,"C":53,"D":54},"initialReadingMode":"full_paragraph"}],"jumpSections":["阅前须知","先读题干","读文章","开始做题","21题","22题","23题","24题","25题","进阶方法","进阶回查","最终答案"],"supplementaryFlow":{"id":"whole_text_argument_review_v1","mainQuestion":null,"ordinaryFirstRoundCandidates":{"21":["C"],"22":["B"],"23":["A"],"24":["D"],"25":["C"]},"reviews":[]}};

function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}

function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}

function centerHorizontal(){

    if(!leftPane)return;
    if(zoomLevel>100&&leftPane.scrollWidth>leftPane.clientWidth){
      leftPane.scrollLeft=Math.max(0,Math.round((leftPane.scrollWidth-leftPane.clientWidth)/2));

      leftPane.scrollLeft=0;

function updateDragCursor(){
  if(!leftPane)return;
  if(zoomLevel>100&&(leftPane.scrollWidth>leftPane.clientWidth||leftPane.scrollHeight>leftPane.clientHeight)){
    leftPane.style.cursor='grab';
  }else{

function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}
function applyZoom(val){

}
