AAAAAAkgsRCwAAAAAASC5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAJILEQsAAAAAAEguRCwAAAAAACC5ELEAAAAAAIDkQsQCAAAAAACSCxELAAAAAABILkQsAAAAAAAguRCxAAAAAACA5ELEAgAAAAAAkgsRCwAAAAAASC5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAJILEQsAAAAAAEguRCwAAAAAACC5ELEAAAAAAIDkQsQCAAAAAACSCxELAAAAAABILkQsAAAAAAAguRCxAAAAAACA5ELEAgAAAAAAkgsRCwAAAAAASC5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAJILEQsAAAAAAEguRCwAAAAAACC5ELEAAAAAAIDkQsQCAAAAAACSCxELAAAAAABILkQsAAAAAAAguRCxAAAAAACA5ELEAgAAAAAAkgsRCwAAAAAASC5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAJILEQsAAAAAAEguRCwAAAAAACC5ELEAAAAAAIDkQsQCAAAAAACSCxELAAAAAABILkQsAAAAAAAguRCxAAAAAACA5ELEAgAAAAAAkgsRCwAAAAAASC5ELAAAAAAAILkQsQAAAAAAgORCxAIAAAAAAJILEQsAAAAAAEguRCwAAAAAACC5ELEAAAAAAIDkQsQCAAAAAACSCxELAAAAAABILkQsAAAAAAAguRCxAAAAAAAAI7H+P956IzWcMKf4AAAAAElFTkSuQmCC","articleSize":{"w":1083,"h":1508},"questionSize":{"w":1083,"h":1508},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>26题题干</h2>\n<p><strong>What is most wives’ main expectation of their husbands?</strong></p>\n<blockquote><p>多数妻子对丈夫的主要期待是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>27题题干</h2>\n<p><strong>Judging from the context, the phrase “wreaking havoc” (Line 3, Para. 2) most probably means ______.</strong></p>\n<blockquote><p>根据上下文，第2段wreaking havoc最可能是什么意思？</p>\n</blockquote>\n<p>题型：<strong>猜词题</strong>。</p>\n\n<hr />\n<h2>28题题干</h2>\n<p><strong>All of the following are true EXCEPT ______.</strong></p>\n<blockquote><p>下面各项中，哪一项不符合文章？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>29题题干</h2>\n<p><strong>Which of the following can best summarize the main idea of this text?</strong></p>\n<blockquote><p>哪一项最能概括这篇文章的主旨？</p>\n</blockquote>\n<p>题型：<strong>全文主旨题</strong>。</p>\n\n<hr />\n<h2>30题题干</h2>\n<p><strong>In the following part immediately after this text, the author will most probably focus on ______.</strong></p>\n<blockquote><p>紧接这篇节选后，作者最可能继续写什么？</p>\n</blockquote>\n<p>题型：<strong>篇章衔接推断题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>although, while, Instead, In short</td></tr><tr><td>态度词 / 评价词</td><td>先抓个大概好坏</td><td>hurt, failed</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>talk, complain, listen</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>divorces, silence</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>men, women, talk, communication</td></tr></tbody></table>\n\n<hr />\n<p>I was <strong>[xxx]</strong> a small gathering in a <strong>[xxx]</strong> Virginia living room— a women’s group that had invited men to join them. Throughout the evening, one man had been particularly talkative, frequently offering ideas and <strong>[xxx]</strong>, while his wife sat silently beside him on the <strong>[xxx]</strong>. Toward the end of the evening, I commented that women frequently complain that their husbands don’t talk to them. This man quickly nodded in agreement. He <strong>[xxx]</strong> toward his wife and said, “She’s the talker in our family.” The room burst into laughter; the man looked <strong>[xxx]</strong> and hurt. “It’s true,” he explained. “When I come home from work I have nothing to say. If she didn’t keep the conversation going, we’d spend the whole evening in silence.”</p>\n\n<hr />\n<p>I was <strong>[xxx]</strong> a small gathering in a <strong>[xxx]</strong> Virginia living room— / a women’s group that had invited men to join them. / Throughout the evening, one man had been particularly talkative, / frequently offering ideas and <strong>[xxx]</strong>, / while his wife sat silently beside him on the <strong>[xxx]</strong>. / Toward the end of the evening, I commented / that women frequently complain that their husbands don’t talk to them. / This man quickly nodded in agreement. / He <strong>[xxx]</strong> toward his wife and said, “She’s the talker in our family.” / The room burst into laughter; the man looked <strong>[xxx]</strong> and hurt. / “It’s true,” he explained. / “When I come home from work I have nothing to say. / If she didn’t keep the conversation going, / we’d spend the whole evening in silence.”</p>\n\n<hr />\n<p>I was <strong>[xxx]</strong> 一个小聚会 in a <strong>[xxx]</strong> Virginia living room— / 一个女性团体 that had invited men to join them. / 整个晚上, 一个男人 had been 特别健谈, / frequently offering ideas and <strong>[xxx]</strong>, / while 他的妻子安静地坐着 beside him on the <strong>[xxx]</strong>. / Toward the end of the evening, I commented / that 女人经常抱怨 that 丈夫不和她们讲话. / This man quickly 点头赞同. / He <strong>[xxx]</strong> toward his wife and said, “She’s the talker in 我们家.” / The room burst into laughter; the man looked <strong>[xxx]</strong> and hurt. / “It’s true,” he explained. / “When I 下班回家 我没有话说. / If she didn’t keep the conversation going, / we’d spend 整个晚上沉默.”</p>\n\n<hr />\n<p>1、一个小聚会、一个女性团体、整个晚上、一个男人、特别健谈、他的妻子安静地坐着、女人经常抱怨、丈夫不和她们讲话、点头赞同、我们家、下班回家、我没有话说、整个晚上沉默。</p>\n\n<hr />\n<p>This episode <strong>[xxx]</strong> the <strong>[xxx]</strong> that although American men tend to talk more than women in public situations, they often talk less at home. And this pattern is wreaking havoc with marriage.</p>\n\n<hr />\n<p>This episode <strong>[xxx]</strong> the <strong>[xxx]</strong> / that although American men tend to talk more than women in public situations, / they often talk less at home. / And this pattern is wreaking havoc with marriage.</p>\n\n<hr />\n<p>This episode <strong>[xxx]</strong> the <strong>[xxx]</strong> / that although 美国男人 tend to talk more than women 在公众场合, / they often talk less 在家里. / And this pattern is wreaking havoc with 婚姻.</p>\n\n<hr />\n<p>2、美国男人、在公众场合、在家里、婚姻。</p>\n\n<hr />\n<p>The pattern was observed by political scientist Andrew Hacker in the late 1970s. Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk that most of the women she interviewed—but only a few of the men— gave lack of communication as the reason for their divorces. Given the current divorce rate of nearly 50 percent, that amounts to millions of cases in the United States every year— a virtual <strong>[xxx]</strong> of failed conversation.</p>\n\n<hr />\n<p>The pattern was observed by political scientist Andrew Hacker in the late 1970s. / Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk / that most of the women she interviewed—but only a few of the men— / gave lack of communication as the reason for their divorces. / Given the current divorce rate of nearly 50 percent, / that amounts to millions of cases in the United States every year— / a virtual <strong>[xxx]</strong> of failed conversation.</p>\n\n<hr />\n<p>这种模式 was observed by political scientist Andrew Hacker 在20世纪70年代末. / Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk / that most of the women she interviewed—but only a few of the men— / gave 缺少交流 as 离婚的原因. / Given the current divorce rate of 接近50%, / that amounts to millions of cases in the United States every year— / a virtual <strong>[xxx]</strong> of failed conversation.</p>\n\n<hr />\n<p>3、这种模式、在20世纪70年代末、缺少交流、离婚的原因、接近50%。</p>\n\n<hr />\n<p>In my own research, complaints from women about their husbands most often focused not on <strong>[xxx]</strong> inequities such as having given up the chance for a career to <strong>[xxx]</strong> a husband to his, or doing far more than their share of daily <strong>[xxx]</strong> work like cleaning, cooking and social <strong>[xxx]</strong>. Instead, they focused on communication: “He doesn’t listen to me.” “He doesn’t talk to me.” I found, as Hacker observed years before, that most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners, but few husbands share this expectation of their wives.</p>\n\n<hr />\n<p>In my own research, complaints from women about their husbands / most often focused not on <strong>[xxx]</strong> inequities / such as having given up the chance for a career to <strong>[xxx]</strong> a husband to his, / or doing far more than their share of daily <strong>[xxx]</strong> work / like cleaning, cooking and social <strong>[xxx]</strong>. / Instead, they focused on communication: / “He doesn’t listen to me.” “He doesn’t talk to me.” / I found, as Hacker observed years before, / that most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners, / but few husbands share this expectation of their wives.</p>\n\n<hr />\n<p>在我的研究里, 女人的抱怨 about 她们的丈夫 / most often focused not on <strong>[xxx]</strong> inequities / such as having given up the chance for a career to <strong>[xxx]</strong> a husband to his, / or doing far more than their share of daily <strong>[xxx]</strong> work / like cleaning, cooking and social <strong>[xxx]</strong>. / 相反, they focused on 交流: / “他不听我说.” “He doesn’t talk to me.” / I found, as Hacker observed years before, / that most wives want their husbands to be, first and <strong>[xxx]</strong>, 谈话伙伴, / but few husbands share this expectation of their wives.</p>\n\n<hr />\n<p>4、在我的研究里、女人的抱怨、她们的丈夫、相反、交流、他不听我说、谈话伙伴。</p>\n\n<hr />\n<p>In short, the image that best represents the current crisis is the <strong>[xxx]</strong> cartoon scene of a man sitting at the breakfast table with a newspaper held up in front of his face, while a woman <strong>[xxx]</strong> at the back of it, wanting to talk.</p>\n\n<hr />\n<p>In short, the image that best represents the current crisis / is the <strong>[xxx]</strong> cartoon scene / of a man sitting at the breakfast table with a newspaper held up in front of his face, / while a woman <strong>[xxx]</strong> at the back of it, wanting to talk.</p>\n\n<hr />\n<p>简言之, the image that best represents 当前危机 / is the <strong>[xxx]</strong> 漫画场景 / of 一个男人坐在早餐桌前 with 一份报纸 held up in front of his face, / while a woman <strong>[xxx]</strong> at the back of it, 想要说话.</p>\n\n<hr />\n<p>5、简言之、当前危机、漫画场景、一个男人坐在早餐桌前、一份报纸、想要说话。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：夫妻、在外与在家说话、交流和一幅漫画。刚才还看到：一个小聚会、一个女性团体、整个晚上、一个男人、特别健谈、他的妻子安静地坐着、女人经常抱怨、丈夫不和她们讲话、点头赞同、我们家、下班回家、我没有话说、整个晚上沉默；美国男人、在公众场合、在家里、婚姻；这种模式、在20世纪70年代末、缺少交流、离婚的原因、接近50%；在我的研究里、女人的抱怨、她们的丈夫、相反、交流、他不听我说、谈话伙伴；简言之、当前危机、漫画场景、一个男人坐在早餐桌前、一份报纸、想要说话。</p>\n<p>到这里还不能自然地说清楚：聚会上的表现为什么与家里相反，离婚数据在这里说明什么，末尾的漫画怎样接上前文。先记住这些信息大概在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n\n<hr />\n<h2>26题</h2>\n<blockquote><p>What is most wives’ main expectation of their husbands?<br />\n多数妻子对丈夫的主要期待是什么？</p>\n</blockquote>\n<p>题干里的wives、expectation让人想起粗读后面出现的谈话伙伴。回到第4段，先完整读清not...Instead...的转向，再看期待落在哪里。</p>\n<blockquote><p>原文参考：</p>\n<p>In my own research, complaints from women about their husbands most often focused not on <strong>[xxx]</strong> inequities such as having given up the chance for a career to <strong>[xxx]</strong> a husband to his, or doing far more than their share of daily <strong>[xxx]</strong> work like cleaning, cooking and social <strong>[xxx]</strong>. Instead, they focused on communication: “He doesn’t listen to me.” “He doesn’t talk to me.” I found, as Hacker observed years before, that most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners, but few husbands share this expectation of their wives.</p>\n<p>开始精读：</p>\n<p>In my own research, complaints from women about their husbands / most often focused not on <strong>[xxx]</strong> inequities / such as having given up the chance for a career to <strong>[xxx]</strong> a husband to his, / or doing far more than their share of daily <strong>[xxx]</strong> work / like cleaning, cooking and social <strong>[xxx]</strong>. / Instead, they focused on communication: / “He doesn’t listen to me.” “He doesn’t talk to me.” / I found, as Hacker observed years before, / that most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners, / but few husbands share this expectation of their wives.</p>\n<p>在我自己的研究里，女人对丈夫的抱怨 / 通常不集中在<strong>[xxx]</strong>的不平等上，/ 例如为了<strong>[xxx]</strong>丈夫发展事业而放弃自己的事业机会，/ 或者做远超自己份额的日常<strong>[xxx]</strong>工作，/ 比如清洁、做饭和社交<strong>[xxx]</strong>。/ 相反，她们集中在交流上：/ “他不听我说。”“他不跟我说话。”/ 我发现，正如Hacker多年前观察到的，/ 多数妻子希望丈夫首先且<strong>[xxx]</strong>地成为谈话伙伴，/ 但很少丈夫对妻子抱有同样的期待。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. Talking to them.</h3>\n<blockquote><p>妻子主要希望丈夫和自己说话</p>\n</blockquote>\n<p>把A接回题干，它说的是：大多数妻子对丈夫的主要期待，是丈夫能和自己说话。</p>\n<p>A说希望丈夫说话，回第4段看Instead后的communication和conversational partners。</p>\n<blockquote><p>most often focused not on <strong>[xxx]</strong> inequities</p>\n</blockquote>\n<blockquote><p>Instead, they focused on communication: “He doesn’t listen to me.” “He doesn’t talk to me.”</p>\n</blockquote>\n<blockquote><p>most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners</p>\n</blockquote>\n<p>妻子的抱怨是他不听我说、他不跟我说。作者随后直接说，多数妻子首先希望丈夫成为交谈伙伴。</p>\n<p>伙伴意味着有来有回，不是只有妻子一个人维持话题。A的Talking to them正好对应这项期待。</p>\n<p><strong>愿丈夫成为交谈伙伴，是否就是希望丈夫与自己交流？</strong></p>\n<p>是。A与抱怨内容和研究总结都一致，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. Trusting them.</h3>\n<blockquote><p>妻子主要希望丈夫信任自己</p>\n</blockquote>\n<p>把B接回题干，它说的是：大多数妻子最希望丈夫给予自己的，是信任。</p>\n<p>B说希望被信任，回第4段看两句妻子的原话。</p>\n<blockquote><p>He doesn’t listen to me.</p>\n</blockquote>\n<blockquote><p>He doesn’t talk to me.</p>\n</blockquote>\n<blockquote><p>most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners</p>\n</blockquote>\n<p>不听我说、不与我说，指出的是交流少。句子并没有说丈夫不相信妻子的话、怀疑妻子的行为。</p>\n<p>信任可能对婚姻重要，但题目问这项研究中多数妻子的主要期待，要按研究实际归纳的交谈伙伴来判断。</p>\n<p><strong>不愿交谈是否必然等于不信任对方？</strong></p>\n<p>不是。B把交流要求换成了信任要求，原文没有这样归纳。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. <strong>[xxx]</strong> their careers.</h3>\n<blockquote><p>妻子主要希望丈夫对自己的事业采取某种<strong>[xxx]</strong>行动</p>\n</blockquote>\n<p>把C接回题干，它说的是：大多数妻子对丈夫的主要期待，是丈夫对妻子的事业采取某种<strong>[xxx]</strong>行动。</p>\n<p>C有careers，回第4段看career前面的not on。</p>\n<blockquote><p>most often focused not on <strong>[xxx]</strong> inequities such as having given up the chance for a career</p>\n</blockquote>\n<blockquote><p>Instead, they focused on communication</p>\n</blockquote>\n<p>作者确实提到妻子为丈夫放弃事业机会，但这些被放在most often focused not on后面。随后Instead把重点转到沟通。</p>\n<p>C的具体动作词虽然不认识，仍能看清它把主要期待放在事业上，而作者刚把这部分与主要抱怨区分开。</p>\n<p><strong>即使没读懂事业前的动作，careers是否属于原文重点转开的那一类？</strong></p>\n<p>是。C不符合主要期待落在交流上的总结，可以排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. <strong>[xxx]</strong> housework.</h3>\n<blockquote><p>妻子主要希望丈夫对家务采取某种<strong>[xxx]</strong>行动</p>\n</blockquote>\n<p>把D接回题干，它说的是：大多数妻子对丈夫的主要期待，是丈夫对家务采取某种<strong>[xxx]</strong>行动。</p>\n<p>D有housework，回第4段找cleaning、cooking，再看Instead。</p>\n<blockquote><p>most often focused not on <strong>[xxx]</strong> inequities</p>\n</blockquote>\n<blockquote><p>doing far more than their share of daily <strong>[xxx]</strong> work like cleaning, cooking and social <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>Instead, they focused on communication</p>\n</blockquote>\n<p>清洁、做饭等家务是作者列出的不公平负担，但原文说抱怨大多不集中于这些，反而集中于communication。</p>\n<p>不认识D对家务提出的动作，也不妨碍判断它仍在说家务。题干问主要期待，不能用被转开的家务问题来替代。</p>\n<p><strong>家务在本段被作为主要抱怨继续展开了吗？</strong></p>\n<p>没有。作者把重点转向说话和倾听，D不合。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>26题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n\n<hr />\n<h2>27题</h2>\n<blockquote><p>Judging from the context, the phrase “wreaking havoc” (Line 3, Para. 2) most probably means ______.<br />\n根据上下文，第2段wreaking havoc最可能是什么意思？</p>\n</blockquote>\n<p>题干指定第2段的短语。先读完整第2段，再连到解释这种模式后果的第3段，用发生了什么来判断方向。</p>\n<blockquote><p>原文参考：</p>\n<p>This episode <strong>[xxx]</strong> the <strong>[xxx]</strong> that although American men tend to talk more than women in public situations, they often talk less at home. And this pattern is wreaking havoc with marriage.</p>\n<p>开始精读：</p>\n<p>This episode <strong>[xxx]</strong> the <strong>[xxx]</strong> / that although American men tend to talk more than women in public situations, / they often talk less at home. / And this pattern is wreaking havoc with marriage.</p>\n<p>这个片段<strong>[xxx]</strong>了这种<strong>[xxx]</strong>：/ 尽管美国男人在公众场合往往比女人说得更多，/ 他们在家里却常常说得更少。/ 而这种模式正在对婚姻wreaking havoc。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The pattern was observed by political scientist Andrew Hacker in the late 1970s. Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk that most of the women she interviewed—but only a few of the men— gave lack of communication as the reason for their divorces. Given the current divorce rate of nearly 50 percent, that amounts to millions of cases in the United States every year— a virtual <strong>[xxx]</strong> of failed conversation.</p>\n<p>开始精读：</p>\n<p>The pattern was observed by political scientist Andrew Hacker in the late 1970s. / Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk / that most of the women she interviewed—but only a few of the men— / gave lack of communication as the reason for their divorces. / Given the current divorce rate of nearly 50 percent, / that amounts to millions of cases in the United States every year— / a virtual <strong>[xxx]</strong> of failed conversation.</p>\n<p>这种模式在20世纪70年代末被政治学家Andrew Hacker观察到。/ 社会学家Catherine Kohler Riessman在新书《Divorce Talk》中报告，/ 她采访的多数女人——但只有少数男人—— / 把缺少交流列为自己离婚的原因。/ 考虑到目前接近50%的离婚率，/ 那在美国每年意味着数百万个案例—— / 几乎一场谈话失败的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. generating motivation</h3>\n<blockquote><p>这种模式正在产生动力</p>\n</blockquote>\n<p>把A接回题干，它说的是：第2段所说的这种谈话模式，正在给婚姻产生动力。</p>\n<p>A说产生动力，把它放回第2段，再看第3段这种模式的结果。</p>\n<blockquote><p>they often talk less at home.</p>\n</blockquote>\n<blockquote><p>gave lack of communication as the reason for their divorces</p>\n</blockquote>\n<p>丈夫在外面话多、回家话少，后面的调查却说许多女性把缺乏沟通列为离婚原因。这里是婚姻关系出了问题。</p>\n<p>产生动力通常要说明推动了什么发展，原文接着给出的却是divorces和failed conversation。</p>\n<p><strong>由缺乏沟通走向离婚的例子，能解释成给婚姻产生动力吗？</strong></p>\n<p>不能。这些后果显示伤害，A没有对应它们。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. exerting influence</h3>\n<blockquote><p>这种模式正在施加影响</p>\n</blockquote>\n<p>把B接回题干，它说的是：第2段所说的这种谈话模式，正在对婚姻施加影响。</p>\n<p>B说施加影响，回第3段看影响是否被具体写成坏结果。</p>\n<blockquote><p>gave lack of communication as the reason for their divorces</p>\n</blockquote>\n<blockquote><p>a virtual <strong>[xxx]</strong> of failed conversation</p>\n</blockquote>\n<p>确实有影响，但原文不是停在好坏不明的作用，而是明确写到沟通失败与离婚。猜词时要把后面解释出的这层意思也带回去。</p>\n<p>exerting influence太宽，积极影响或轻微变化也能这样说，不能准确接住这些婚姻损害。</p>\n<p><strong>只说有影响，是否已经说出了文中离婚和沟通失败的负面结果？</strong></p>\n<p>没有。B没有表达这里明确的损害含义，不如causing damage准确。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. causing damage</h3>\n<blockquote><p>这种模式正在造成损害</p>\n</blockquote>\n<p>把C接回题干，它说的是：第2段所说的这种谈话模式，正在对婚姻造成损害。</p>\n<p>C说造成损害，回第3段把lack of communication与divorces连起来。</p>\n<blockquote><p>they often talk less at home.</p>\n</blockquote>\n<blockquote><p>gave lack of communication as the reason for their divorces</p>\n</blockquote>\n<blockquote><p>a virtual <strong>[xxx]</strong> of failed conversation</p>\n</blockquote>\n<p>许多受访女性把缺乏沟通说成离婚原因，作者还把大量案例称作失败的对话。这些都解释了第2段所说模式给婚姻带来什么。</p>\n<p>causing damage可以放回原句：这种谈话模式在损害婚姻。后面调查恰好接着证明这种损害。</p>\n<p><strong>缺乏沟通导致婚姻破裂，是否能解释成造成损害？</strong></p>\n<p>能。C既与with marriage相接，也符合后面的具体后果。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. creating pressure</h3>\n<blockquote><p>这种模式正在制造压力</p>\n</blockquote>\n<p>把D接回题干，它说的是：第2段所说的这种谈话模式，正在给婚姻制造压力。</p>\n<p>D说制造压力，回第3段看后果已经到哪一步。</p>\n<blockquote><p>gave lack of communication as the reason for their divorces</p>\n</blockquote>\n<blockquote><p>a virtual <strong>[xxx]</strong> of failed conversation</p>\n</blockquote>\n<p>夫妻交流不畅可能让人有压力，但作者在后面明确谈到离婚，把它叫作failed conversation造成的婚姻危机。</p>\n<p>压力可以尚未造成破坏，文中却拿实际婚姻失败来说明。这里需要一个能直接概括损害的表达。</p>\n<p><strong>后文只是说婚姻承受压力，还是真的出现了破裂后果？</strong></p>\n<p>已经出现破裂后果。D没有C的造成损害贴合这段解释。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>27题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n\n<hr />\n<h2>28题</h2>\n<blockquote><p>All of the following are true EXCEPT ______.<br />\n下面各项中，哪一项不符合文章？</p>\n</blockquote>\n<p>这是选不符合的一项。第2—4段已经读过，先把尚未精读的开头故事和末尾漫画读全，再逐项对照；核对百分比时尤其要保留它的统计对象。</p>\n<blockquote><p>原文参考：</p>\n<p>I was <strong>[xxx]</strong> a small gathering in a <strong>[xxx]</strong> Virginia living room— a women’s group that had invited men to join them. Throughout the evening, one man had been particularly talkative, frequently offering ideas and <strong>[xxx]</strong>, while his wife sat silently beside him on the <strong>[xxx]</strong>. Toward the end of the evening, I commented that women frequently complain that their husbands don’t talk to them. This man quickly nodded in agreement. He <strong>[xxx]</strong> toward his wife and said, “She’s the talker in our family.” The room burst into laughter; the man looked <strong>[xxx]</strong> and hurt. “It’s true,” he explained. “When I come home from work I have nothing to say. If she didn’t keep the conversation going, we’d spend the whole evening in silence.”</p>\n<p>开始精读：</p>\n<p>I was <strong>[xxx]</strong> a small gathering in a <strong>[xxx]</strong> Virginia living room— / a women’s group that had invited men to join them. / Throughout the evening, one man had been particularly talkative, / frequently offering ideas and <strong>[xxx]</strong>, / while his wife sat silently beside him on the <strong>[xxx]</strong>. / Toward the end of the evening, I commented / that women frequently complain that their husbands don’t talk to them. / This man quickly nodded in agreement. / He <strong>[xxx]</strong> toward his wife and said, “She’s the talker in our family.” / The room burst into laughter; the man looked <strong>[xxx]</strong> and hurt. / “It’s true,” he explained. / “When I come home from work I have nothing to say. / If she didn’t keep the conversation going, / we’d spend the whole evening in silence.”</p>\n<p>我正在<strong>[xxx]</strong>一场小聚会，在一间<strong>[xxx]</strong>的Virginia客厅里—— / 一个邀请了男性参加的女性团体。/ 整个晚上，一个男人特别健谈，/ 经常提出想法和<strong>[xxx]</strong>，/ 而他的妻子安静地坐在他旁边的<strong>[xxx]</strong>上。/ 临近晚上结束时，我说到 / 女人经常抱怨丈夫不和她们讲话。/ 这个男人很快点头赞同。/ 他朝妻子<strong>[xxx]</strong>，说：“她才是我们家爱说话的人。”/ 满屋人突然笑起来；男人显得<strong>[xxx]</strong>而且受伤。/ “是真的，”他解释道。/ “我下班回家时没有话说。/ 如果她不让谈话继续，/ 我们整个晚上都会在沉默中度过。”</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>In short, the image that best represents the current crisis is the <strong>[xxx]</strong> cartoon scene of a man sitting at the breakfast table with a newspaper held up in front of his face, while a woman <strong>[xxx]</strong> at the back of it, wanting to talk.</p>\n<p>开始精读：</p>\n<p>In short, the image that best represents the current crisis / is the <strong>[xxx]</strong> cartoon scene / of a man sitting at the breakfast table with a newspaper held up in front of his face, / while a woman <strong>[xxx]</strong> at the back of it, wanting to talk.</p>\n<p>简言之，最能表现当前危机的画面 / 是那个<strong>[xxx]</strong>的漫画场景，/ 一个男人坐在早餐桌前，把报纸举在脸前，/ 而一个女人对着报纸背面<strong>[xxx]</strong>，想要说话。</p>\n</blockquote>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. men tend to talk more in public than women</h3>\n<blockquote><p>男性在公众场合往往比女性说话更多</p>\n</blockquote>\n<p>把A接回题干，它说的是：男性在公众场合往往比女性说得更多；本题要判断这是不是那项不符合文章的说法。</p>\n<p>A说男性公众场合话更多，回第2段核对，注意本题找EXCEPT。</p>\n<blockquote><p>American men tend to talk more than women in public situations</p>\n</blockquote>\n<p>原句直接说American men tend to talk more than women in public situations。A保留了男性、公众场合和相比女性更多这三点。</p>\n<p>这一项是文章已经写出的情况，所以不能作为“不符合”的答案。</p>\n<p><strong>A与第2段的公众场合比较是否一致？</strong></p>\n<p>一致。它是符合原文的说法，本题因此排除A。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. nearly 50 percent of recent divorces are caused by <strong>[xxx]</strong> conversation</h3>\n<blockquote><p>最近近50%的离婚由某种<strong>[xxx]</strong>的谈话造成</p>\n</blockquote>\n<p>把B接回题干，它说的是：最近的离婚案例中，接近50%是由某种<strong>[xxx]</strong>的谈话造成的；本题问这是否属于不符合文章的说法。</p>\n<p>B说近50%的离婚由某类谈话造成，回第3段看50 percent到底是什么比例。</p>\n<blockquote><p>most of the women she interviewed—but only a few of the men— gave lack of communication as the reason for their divorces.</p>\n</blockquote>\n<blockquote><p>Given the current divorce rate of nearly 50 percent</p>\n</blockquote>\n<p>原文是current divorce rate of nearly 50 percent，说当前离婚率接近50%。B却说在最近离婚案例中，有近50%由某类谈话造成。</p>\n<p>前一句虽介绍缺乏沟通的抱怨，也没有给出“全部离婚中因沟通而离婚占50%”这个统计。生词是什么，都改变不了比例被换了对象。</p>\n<p><strong>总的离婚率，能直接当成离婚案例中特定原因所占比例吗？</strong></p>\n<p>不能。B把两个不同的比例混在一起，是不符合原文的一项，保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. women attach much importance to communication between couples</h3>\n<blockquote><p>女性很重视夫妻交流</p>\n</blockquote>\n<p>把C接回题干，它说的是：女性很重视夫妻间的交流；本题要找的却是不符合文章的一项。</p>\n<p>C说女性重视夫妻沟通，回第4段看抱怨重点与交谈伙伴。</p>\n<blockquote><p>Instead, they focused on communication: “He doesn’t listen to me.” “He doesn’t talk to me.”</p>\n</blockquote>\n<blockquote><p>most wives want their husbands to be, first and <strong>[xxx]</strong>, conversational partners</p>\n</blockquote>\n<p>作者研究发现妻子抱怨集中于沟通，还希望丈夫首先成为交谈伙伴。她们要求倾听和交谈，说明重视夫妻之间的交流。</p>\n<p>C没有另加其他主要需求，是这段内容可以支持的概括。</p>\n<p><strong>C是否属于与文章不符的例外？</strong></p>\n<p>不是。它符合研究所说的重点，所以本题排除C。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. a female tends to be more talkative at home than her spouse</h3>\n<blockquote><p>女性在家里往往比配偶更健谈</p>\n</blockquote>\n<p>把D接回题干，它说的是：在家中，妻子往往比丈夫更健谈；本题要检查它是否是不符合文章的例外项。</p>\n<p>D说妻子在家更健谈，回第1段看丈夫如何解释家庭中的对话。</p>\n<blockquote><p>She’s the talker in our family.</p>\n</blockquote>\n<blockquote><p>When I come home from work I have nothing to say. If she didn’t keep the conversation going, we’d spend the whole evening in silence.</p>\n</blockquote>\n<blockquote><p>they often talk less at home</p>\n</blockquote>\n<p>这个男人说下班回家没话说，如果不是妻子维持对话，整个晚上就会沉默。第2段又说男性常在家说得少。</p>\n<p>D用了tends to，描述倾向，与作者借例子说明的家庭谈话反差相合，没有说每对夫妻一概如此。</p>\n<p><strong>妻子维持对话、丈夫在家少说，能不能支持D？</strong></p>\n<p>能。因此D符合文章，不是本题要找的例外，排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n\n<hr />\n<h2>30题</h2>\n<blockquote><p>In the following part immediately after this text, the author will most probably focus on ______.<br />\n紧接这篇节选后，作者最可能继续写什么？</p>\n</blockquote>\n<p>题干问的是紧接下文的内容。末段已读过，重点看最后新引出的画面，同时先记住文章一直在讨论什么。</p>\n<p>这一段前面已经完整读过，下面直接回到各项所涉及的句子。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. a <strong>[xxx]</strong> account of the new book Divorce Talk</h3>\n<blockquote><p>对《Divorce Talk》作某种<strong>[xxx]</strong>的叙述</p>\n</blockquote>\n<p>把A接回题干，它说的是：紧接本文的下一部分，作者最可能转去对《Divorce Talk》作某种<strong>[xxx]</strong>的介绍。</p>\n<p>A说接着介绍Divorce Talk，回第3段看这本书出现之后文章有没有围着书展开。</p>\n<blockquote><p>Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk</p>\n</blockquote>\n<blockquote><p>In short, the image that best represents the current crisis is the <strong>[xxx]</strong> cartoon scene</p>\n</blockquote>\n<p>这本书提供受访者把缺乏沟通当离婚原因的研究。之后作者转到自己的调查，最后又用漫画概括危机。</p>\n<p>书的材料已经用来说明问题，末段也没有说还要介绍这本书的其他部分。仅凭它出现过，不能把后文定成书籍介绍。</p>\n<p><strong>结尾留下的接续点，是这本书还没介绍完吗？</strong></p>\n<p>不是。作者已经转到夫妻交谈场景，A没有接住最后的推进。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. a detailed description of the stereotypical cartoon</h3>\n<blockquote><p>详细展开那幅典型漫画的场景</p>\n</blockquote>\n<p>把B接回题干，它说的是：紧接本文的下一部分，作者最可能详细描写末段提出的那幅典型漫画。</p>\n<p>B说进一步描写漫画，回末段看这幅画怎样被提出。</p>\n<blockquote><p>In short, the image that best represents the current crisis is the <strong>[xxx]</strong> cartoon scene</p>\n</blockquote>\n<blockquote><p>of a man sitting at the breakfast table with a newspaper held up in front of his face, while a woman <strong>[xxx]</strong> at the back of it, wanting to talk.</p>\n</blockquote>\n<p>作者刚说最能代表当前危机的是这个场景：男人举着报纸挡住脸，女人想与他交谈。这个具体场景就在节选结尾刚出现。</p>\n<p>继续说明人物怎样表现、为什么形成这种局面，可以顺着末段往下讲。B既有最近的接点，也与夫妻交流有关。</p>\n<p><strong>紧接这幅刚引入的画面继续展开，是否能顺着当前话题走？</strong></p>\n<p>能。B先保留，之后还要结合主旨判断是不是最合适的方向。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. other possible reasons for a high divorce rate in the U.S.</h3>\n<blockquote><p>美国高离婚率的其他可能原因</p>\n</blockquote>\n<p>把C接回题干，它说的是：紧接本文的下一部分，作者最可能继续分析美国离婚率高的其他可能原因。</p>\n<p>C说其他离婚原因，回第3段的divorce rate，再看末段crisis。</p>\n<blockquote><p>the current divorce rate of nearly 50 percent</p>\n</blockquote>\n<blockquote><p>the current crisis</p>\n</blockquote>\n<p>文中确实说到离婚率很高，末段又称当前危机。只看这些词，我们容易想到作者是否还会补充导致危机的其他原因。</p>\n<p>但末段实际放下的是一幅谈话场景，没有明确说“交流只是一个原因，下面还有别的”。这条衔接暂时只能算可能。</p>\n<p><strong>已有离婚话题，是否让C在第一轮仍有继续考虑的余地？</strong></p>\n<p>有。先与B一起留下，等确定全文究竟围绕离婚原因还是谈话差异再判断。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. a brief introduction to the political scientist Andrew Hacker</h3>\n<blockquote><p>简要介绍政治学家Andrew Hacker</p>\n</blockquote>\n<p>把D接回题干，它说的是：紧接本文的下一部分，作者最可能简要介绍政治学家Andrew Hacker。</p>\n<p>D说介绍Hacker本人，回第3、4段看作者借用了他什么。</p>\n<blockquote><p>The pattern was observed by political scientist Andrew Hacker in the late 1970s.</p>\n</blockquote>\n<blockquote><p>I found, as Hacker observed years before</p>\n</blockquote>\n<blockquote><p>In short, the image that best represents the current crisis</p>\n</blockquote>\n<p>Hacker被提到是因为他早已观察过这种谈话模式；第4段又说自己的发现与他相似。这是引用研究发现来说明夫妻交流。</p>\n<p>段落没有提出他的经历、身份需要补充，结尾也没有回到他本人。人物名字出现并不意味着文章要转成人物介绍。</p>\n<p><strong>全文留下了关于Hacker生平的待解问题吗？</strong></p>\n<p>没有。D把提供研究依据的人改成了后文中心，接不上最后的漫画场景。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>30题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂留B、C，等把全文连起来后再回来比较。</p>\n\n<hr />\n<h2>29题</h2>\n<p><strong>Which of the following can best summarize the main idea of this text?</strong></p>\n<p>哪一项最能概括这篇文章的主旨？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>The moral decaying deserves more research by sociologists.</strong></p>\n<p>道德衰落值得社会学家进一步研究。</p>\n<p>B. <strong>Marriage break-up stems from sex inequalities.</strong></p>\n<p>婚姻破裂源于性别不平等。</p>\n<p>C. <strong>Husband and wife have different expectations from their marriage.</strong></p>\n<p>夫妻对婚姻抱有不同期待。</p>\n<p>D. <strong>Conversational patterns between man and wife are different.</strong></p>\n<p>夫妻之间的谈话模式不同。</p>\n\n<hr />\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table><thead><tr><th>段落</th><th>作者这一段在做什么</th><th>逻辑</th></tr></thead><tbody><tr><td>第1段</td><td>聚会上男人多说、妻子沉默，回家却由妻子维持对话。</td><td>先用一个反差引出问题</td></tr><tr><td>第2段</td><td>点明男女在公众与家中的谈话反差，并说它影响婚姻。</td><td>直接说清这个问题是什么</td></tr><tr><td>第3段</td><td>用研究与离婚者的抱怨说明交流问题的后果。</td><td>用已有研究说明问题的后果</td></tr><tr><td>第4段</td><td>作者的研究把妻子的重点落在交流，而非事业或家务分担。</td><td>再用自己的发现补充解释</td></tr><tr><td>第5段</td><td>用一方看报、一方想说话的漫画凝结当前危机。</td><td>最后用一个画面收住问题</td></tr></tbody></table>\n<hr />\n\n<hr />\n<p><strong>Which of the following can best summarize the main idea of this text?</strong></p>\n<h3>A. The moral decaying deserves more research by sociologists.</h3>\n<p>道德衰落值得社会学家进一步研究。</p>\n<h4>如果A成立，文章应该怎么写？</h4>\n<table><thead><tr><th>段落</th><th>如果A对，这段应该写什么</th><th>逻辑</th></tr></thead><tbody><tr><td>第1段</td><td>用行为例子表现道德衰落。</td><td>先用一个反差引出问题</td></tr><tr><td>第2段</td><td>指出这些行为违反何种道德。</td><td>直接说清这个问题是什么</td></tr><tr><td>第3段</td><td>介绍社会学研究对道德问题的解释。</td><td>用已有研究说明问题的后果</td></tr><tr><td>第4段</td><td>说明现有研究哪里不足、还应研究什么。</td><td>再用自己的发现补充解释</td></tr><tr><td>第5段</td><td>回到需要更多道德研究的倡议。</td><td>最后用一个画面收住问题</td></tr></tbody></table>\n<p>开头的男人在聚会上说得很多，妻子却沉默；回家后情况反过来。这能说明场合和夫妻谈话表现不同，还没有说任何一方道德败坏。</p>\n<p>第3段引用离婚者的抱怨，第4段写妻子想要交谈伙伴，研究都用于说明交流出了什么问题。作者没有接着指出社会学研究哪里不够，也没有要求继续研究道德。</p>\n<p><strong>如果把“道德衰落值得更多研究”当成中心，能在文中找到对道德衰落的认定和增加研究的要求吗？</strong></p>\n<p>找不到。A里的道德评价与研究倡议都没有在这些段落中展开，不能概括全文。</p>\n<p><strong>判断：A排除。</strong></p>\n\n<hr />\n<p><strong>Which of the following can best summarize the main idea of this text?</strong></p>\n<h3>B. Marriage break-up stems from sex inequalities.</h3>\n<p>婚姻破裂源于性别不平等。</p>\n<h4>如果B成立，文章应该怎么写？</h4>\n<table><thead><tr><th>段落</th><th>如果B对，这段应该写什么</th><th>逻辑</th></tr></thead><tbody><tr><td>第1段</td><td>举出婚姻中一方受到不公平对待的例子。</td><td>先用一个反差引出问题</td></tr><tr><td>第2段</td><td>把不平等说成婚姻破裂的原因。</td><td>直接说清这个问题是什么</td></tr><tr><td>第3段</td><td>用离婚研究验证这种因果。</td><td>用已有研究说明问题的后果</td></tr><tr><td>第4段</td><td>继续分析事业、家务等不公平负担。</td><td>再用自己的发现补充解释</td></tr><tr><td>第5段</td><td>用画面强调不平等造成破裂。</td><td>最后用一个画面收住问题</td></tr></tbody></table>\n<p>事业牺牲、家务承担不均在第4段确实出现，离婚也在第3段出现。但第4段的连接是not on这些负担，Instead集中于communication。作者没有把前一段离婚的原因接到性别不平等上。</p>\n<p>首段同一个男人在公众和家中说话不同，末段女人想说话而男人躲在报纸后，也都在展示交流不一致。若要证明B，事业与家务不均应当被接着解释为破裂的原因，而不是被转开。</p>\n<p><strong>“离婚”和“不平等”都出现过，原文就把它们连成B的因果了吗？</strong></p>\n<p>没有。文中明确连到离婚的是缺乏沟通，重点转离的恰好是那些不公平负担。</p>\n<p><strong>判断：B排除。</strong></p>\n\n<hr />\n<p><strong>Which of the following can best summarize the main idea of this text?</strong></p>\n<h3>C. Husband and wife have different expectations from their marriage.</h3>\n<p>夫妻对婚姻抱有不同期待。</p>\n<h4>如果C成立，文章应该怎么写？</h4>\n<table><thead><tr><th>段落</th><th>如果C对，这段应该写什么</th><th>逻辑</th></tr></thead><tbody><tr><td>第1段</td><td>先让读者看到丈夫与妻子各自期待对方怎样做。</td><td>先用一个反差引出问题</td></tr><tr><td>第2段</td><td>点明双方的期待为什么没有一致。</td><td>直接说清这个问题是什么</td></tr><tr><td>第3段</td><td>研究说明期待差异造成什么后果。</td><td>用已有研究说明问题的后果</td></tr><tr><td>第4段</td><td>进一步说明双方希望从婚姻中得到什么。</td><td>再用自己的发现补充解释</td></tr><tr><td>第5段</td><td>用一个画面总结不同期待。</td><td>最后用一个画面收住问题</td></tr></tbody></table>\n<p>第4段说多数妻子希望丈夫成为交谈伙伴，丈夫却很少对妻子有同样期待。C并不是完全没有依据，末段一方想交谈、一方不交谈，也能让人想到期待不同。</p>\n<p>但开头花了一整段写同一个男人在公众场合话多、回家话少，第2段随即明确概括这种场合变化中的男女反差。作者之后的研究和期待差异，都是继续解释这种谈话模式为什么会让夫妻交流出问题。</p>\n<p><strong>把全文只概括成“对婚姻期待不同”，能和D一样明确说出首段到末段反复观察的是什么吗？</strong></p>\n<p>不能。C说出了第四段中的一项发现，却没有点明全文一直比较的谈话行为。D把谈话模式写出来，能更直接连起聚会、家庭、抱怨和漫画。</p>\n<p><strong>判断：C排除。</strong></p>\n\n<hr />\n<p><strong>Which of the following can best summarize the main idea of this text?</strong></p>\n<h3>D. Conversational patterns between man and wife are different.</h3>\n<p>夫妻之间的谈话模式不同。</p>\n<h4>如果D成立，文章应该怎么写？</h4>\n<table><thead><tr><th>段落</th><th>如果D对，这段应该写什么</th><th>逻辑</th></tr></thead><tbody><tr><td>第1段</td><td>举出同一对夫妻在不同场合谈话的反差。</td><td>先用一个反差引出问题</td></tr><tr><td>第2段</td><td>明确指出公众与家中的谈话模式差异。</td><td>直接说清这个问题是什么</td></tr><tr><td>第3段</td><td>用研究说明交流差异会影响婚姻。</td><td>用已有研究说明问题的后果</td></tr><tr><td>第4段</td><td>说明妻子想交流而丈夫少有同样期待。</td><td>再用自己的发现补充解释</td></tr><tr><td>第5段</td><td>用一方想说、一方沉默的画面收束。</td><td>最后用一个画面收住问题</td></tr></tbody></table>\n<p>把D放回开头，聚会中男人多说、妻子沉默，家中则妻子维持对话，是谈话模式的反差。第2段直接总结男女在公众与家中的表现不同。</p>\n<p>第3段接着写缺乏交流会伤害婚姻，第4段说明妻子需要交谈伙伴而丈夫未有同样期待，是对这个问题的补充。末段再把它画成一方沉默、一方想谈话的画面。</p>\n<p><strong>D能不能同时说明作者为什么以聚会反差开头，又以家庭谈话画面收尾？</strong></p>\n<p>能。首尾都围绕夫妻怎样说话，中间调查则解释这类差异及后果，不需要另外加进道德判断或其他离婚原因。</p>\n<p><strong>判断：D保留。</strong></p>\n\n<hr />\n<h3>29题结论</h3>\n<p><strong>29. D. Conversational patterns between man and wife are different.</strong></p>\n<p>夫妻之间的谈话模式存在差异，尤其是男性在公众场合与家庭中的表现不同，这种交流错位会影响婚姻。</p>\n<p>这句话就是后面回查时使用的主旨底牌。</p>\n\n<hr />\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保29题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<p>主旨底牌：<strong>Conversational patterns between man and wife are different.</strong></p>\n<p>也就是：夫妻之间的谈话模式不同。</p>\n\n<hr />\n<h2>回查30题：B还是C？</h2>\n<p>In the following part immediately after this text, the author will most probably focus on ______.</p>\n<p>B. a detailed description of the stereotypical cartoon</p>\n<p>C. other possible reasons for a high divorce rate in the U.S.</p>\n<p>主旨底牌：<strong>Conversational patterns between man and wife are different.</strong></p>\n<p>也就是：夫妻之间的谈话模式不同。</p>\n<p>第一轮C能让我们接到中段的离婚率，但现在回看文章，开头不是先提出“美国为什么离婚率高”，而是先写男人在聚会与家中的反差。第2段明确点出谈话模式，第3段才用离婚抱怨说明它带来的损害，第4段又回到妻子的交流需要。</p>\n<p>末段用In short收住这些内容，提出最能代表当前危机的漫画：丈夫把报纸举在面前，妻子想与他交谈。继续展开这个场景，仍是在解释夫妻谈话不同，B因此能沿着全文方向继续。</p>\n<p><strong>如果下面准备改讲别的离婚原因，结尾是否已经为这个转向作了安排？</strong></p>\n<p>没有。作者没有说“除了缺乏交流，还有其他原因”，反而刚把交流问题浓缩成一个具体场景。C能接上出现过的离婚一词，却要离开当前正在展开的谈话问题；B可以继续把刚提出的场景说清楚。</p>\n<p><strong>30题选B。</strong></p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>26. A</strong></p>\n<p><strong>27. C</strong></p>\n<p><strong>28. B</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. B</strong></p>\n","analysisStartIndex":29,"maskInventory":{"token":"[xxx]","count":20},"questionFlowPlan":[{"qid":"26","initialParagraphPids":[4],"paragraphPids":[4],"entry":30,"options":{"A":31,"B":32,"C":33,"D":34},"initialReadingMode":"full_paragraph"},{"qid":"27","initialParagraphPids":[2,3],"paragraphPids":[2,3],"entry":36,"options":{"A":37,"B":38,"C":39,"D":40},"initialReadingMode":"full_paragraph"},{"qid":"28","initialParagraphPids":[1,5],"paragraphPids":[1,5],"entry":42,"options":{"A":43,"B":44,"C":45,"D":46},"initialReadingMode":"full_paragraph"},{"qid":"30","initialParagraphPids":[],"paragraphPids":[5],"entry":48,"options":{"A":49,"B":50,"C":51,"D":52},"initialReadingMode":"reuse_previous"}],"jumpSections":["阅前须知","先读题干","读文章","开始做题","26题","27题","28题","29题","30题","进阶方法","进阶回查","最终答案"],"supplementaryFlow":{"id":"nonfinal_main_question_v1","mainQuestion":29,"ordinaryFirstRoundCandidates":{"26":["A"],"27":["C"],"28":["B"],"30":["B","C"]},"reviews":[{"qid":30,"pair":["B","C"],"final":"B"}]}};

function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,left:leftPane.scrollLeft,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}

function setControls(){document.getElementById('prev').disabled=fullMode||idx<0;document.getElementById('next').disabled=fullMode||idx>=DATA.steps.length-1||!ready;document.getElementById('reset').disabled=fullMode;document.getElementById('jump').disabled=fullMode;const t=document.getElementById('toggleAll');t.textContent=fullMode?'返回交互':'显示全部';t.classList.toggle('active',fullMode)}
function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;
let zoomLevel=Number(localStorage.getItem('reading_article_zoom')||100);
if(isNaN(zoomLevel)||zoomLevel<70||zoomLevel>240)zoomLevel=100;
function centerHorizontal(){
  requestAnimationFrame(()=>{
    if(!leftPane)return;
    if(zoomLevel>100&&leftPane.scrollWidth>leftPane.clientWidth){
      leftPane.scrollLeft=Math.max(0,Math.round((leftPane.scrollWidth-leftPane.clientWidth)/2));
    }else{
      leftPane.scrollLeft=0;
    }
    updateDragCursor();
  });
}
function updateDragCursor(){
  if(!leftPane)return;
  if(zoomLevel>100&&(leftPane.scrollWidth>leftPane.clientWidth||leftPane.scrollHeight>leftPane.clientHeight)){
    leftPane.style.cursor='grab';
  }else{
    leftPane.style.cursor='';
  }
}
function setupDragToPan(scrollEl){
  if(!scrollEl)return;
  let isDown=false,startX=0,startY=0,sl=0,st=0;
  scrollEl.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT'||tag==='A')return;
    if(zoomLevel<=100&&scrollEl.scrollWidth<=scrollEl.clientWidth&&scrollEl.scrollHeight<=scrollEl.clientHeight)return;
    isDown=true;
    startX=e.clientX;
    startY=e.clientY;
    sl=scrollEl.scrollLeft;
    st=scrollEl.scrollTop;
    scrollEl.style.cursor='grabbing';
    scrollEl.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isDown)return;
    scrollEl.scrollLeft=sl-(e.clientX-startX);
    scrollEl.scrollTop=st-(e.clientY-startY);
  });
  const up=()=>{
    if(!isDown)return;
    isDown=false;
    scrollEl.style.userSelect='';
    updateDragCursor();
  };
  window.addEventListener('mouseup',up);
  window.addEventListener('mouseleave',up);
  scrollEl.querySelectorAll('img').forEach(img=>{img.setAttribute('draggable','false');img.style.userSelect='none';});
}
function applyZoom(val){
  zoomLevel=Math.max(70,Math.min(240,val));
  try{localStorage.setItem('reading_article_zoom',String(zoomLevel));}catch(e){}
  const zVal=document.getElementById('zoomVal');
  if(zVal)zVal.textContent=zoomLevel+'%';
  const baseW=Math.max(500,(leftPane.clientWidth||800)-24);
  const targetW=Math.round(baseW*(zoomLevel/100));
  const wraps=document.querySelectorAll('.pageWrap');
  wraps.forEach(w=>{
    if(zoomLevel===100){
      w.style.width='100%';
      w.style.maxWidth='1150px';
    }else{
      w.style.setProperty('width',targetW+'px','important');
      w.style.setProperty('max-width','none','important');
    }
  });
  if(typeof ready==='undefined'||ready){
    if(!fullMode){
      const st=DATA.steps[idx];
      highlight('articleWrap',st?st.articleRects:[]);
      highlight('questionWrap',st?st.questionRects:[]);
    }
  }
  centerHorizontal();
}
document.getElementById('zoomIn').onclick=()=>applyZoom(zoomLevel+5);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoomLevel-5);
document.getElementById('zoomReset').onclick=()=>applyZoom(100);
const pLeft=document.getElementById('panLeft');
if(pLeft)pLeft.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.max(0,leftPane.scrollLeft-120);};
const pRight=document.getElementById('panRight');
if(pRight)pRight.onclick=()=>{if(leftPane)leftPane.scrollLeft=Math.min(leftPane.scrollWidth-leftPane.clientWidth,leftPane.scrollLeft+120);};
const pCenter=document.getElementById('panCenter');
if(pCenter)pCenter.onclick=()=>centerHorizontal();
setupDragToPan(document.getElementById('leftPane'));
setTimeout(()=>applyZoom(zoomLevel),60);
window.addEventListener('keydown',e=>{
  if(fullMode||e.altKey||e.ctrlKey||e.metaKey)return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
});

const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if((typeof ready==='undefined'||ready)&&!fullMode){if(zoomLevel!==100)applyZoom(zoomLevel);render()}});
Promise.all([waitImage(articleImg,DATA.articleSize),waitImage(questionImg,DATA.questionSize)]).then(()=>{ready=true;if(zoomLevel!==100)applyZoom(zoomLevel);setControls();render()}).catch(err=>{combined.innerHTML='<div style="color:#b91c1c">页面图载入失败：'+String(err.message||err)+'</div>';console.error(err)});render();
</script></body></html>
