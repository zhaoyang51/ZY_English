<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>考研英语二 (2010-2023) 真题精读、模考与长难句复盘系统</title>
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="mode-practice">

  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <span>📖 考研英语二真题系统</span>
      <span class="badge">2010-2023 全量</span>
    </div>
    
    <div class="topbar-controls">
      <!-- Year Select -->
      <select id="yearSelect" class="select-control" title="选择年份"></select>
      
      <!-- Text Select -->
      <select id="textSelect" class="select-control" title="选择篇章"></select>
      
      <!-- Mode Toggle -->
      <div class="btn-group">
        <button id="practiceModeBtn" class="btn active">做题模式</button>
        <button id="reviewModeBtn" class="btn">复盘模式 (一石五鸟)</button>
      </div>

      <!-- Practice Submode Switcher -->
      <div class="btn-group" id="submodeContainer">
        <button id="submodeStepBtn" class="btn active" title="逐题推演随读随测">🔍 逐题精读</button>
        <button id="submodeMockBtn" class="btn" title="隐藏答案全卷模考">📝 盲做模考</button>
      </div>
      
      <!-- Chapter Jump Select -->
      <select id="jumpSelect" class="select-control" title="章节跳转">
        <option value="">📑 章节跳转</option>
      </select>
      
      <!-- Step Navigation -->
      <div class="btn-group">
        <button id="prevBtn" class="btn" title="快捷键: ←">上一步</button>
        <button id="nextBtn" class="btn" title="快捷键: → / 空格">下一步</button>
        <button id="resetBtn" class="btn" title="回到开头">重置</button>
      </div>
      
      <span id="progressText" style="font-size:13px;font-weight:700;color:var(--muted);user-select:none">1 / 1</span>
      
      <button id="toggleAllBtn" class="btn" style="border:1px solid var(--border);border-radius:var(--radius-sm)">显示全部</button>
      
      <!-- Theme Switcher -->
      <select id="themeSelect" class="select-control" title="界面主题">
        <option value="light">☀️ 浅色明亮</option>
        <option value="parchment">📜 护眼羊皮纸</option>
        <option value="dark">🌙 深色夜间</option>
      </select>
    </div>
  </header>

  <!-- Mobile View Switcher Tabs -->
  <nav class="mobile-tabs-bar" id="mobileTabsBar">
    <button class="mobile-tab-btn active" id="tabLeftBtn">📖 试卷原文</button>
    <button class="mobile-tab-btn" id="tabRightBtn">🧠 思维工作台</button>
  </nav>

  <!-- Main Dual-Panel Interactive Workspace -->
  <main class="layout show-left" id="mainLayout">
    <!-- Left Column: Authentic Exam Paper -->
    <section class="panel left-panel">
      <div class="scroll-container" id="leftScroll">
        <article class="exam-paper" id="examPaper">
          <!-- Dynamically populated by ReaderModule with sentence-level hooks -->
        </article>
      </div>
    </section>

    <!-- Right Column: Interactive Reasoning, Mock Exam & Review Workspace -->
    <section class="panel right-panel">
      <div class="scroll-container" id="rightScroll">
        <article class="workspace" id="workspaceContent">
          <!-- Dynamically populated by QuizModule -->
        </article>
      </div>
    </section>
  </main>

  <!-- Floating Navigation Controls -->
  <aside class="floating-nav-bar" id="floatingNavBar">
    <button class="float-btn" id="floatPrevBtn" title="快捷键: ←">◀ 上一步</button>
    <span class="float-progress" id="floatProgressText">1 / 1</span>
    <button class="float-btn" id="floatNextBtn" title="快捷键: → / 空格">下一步 ▶</button>
  </aside>

  <!-- Floating Vocabulary Dictionary Card -->
  <div class="vocab-popup" id="vocabPopup"></div>

  <!-- Sentence Syntax Breakdown Drawer / Modal -->
  <div class="syntax-modal" id="syntaxModal">
    <div class="syntax-modal-header">
      <span style="font-weight:800;color:var(--mode-color)">🔍 长难句结构化拆解与考点剖析</span>
      <button class="toolbar-btn" id="closeSyntaxBtn" style="padding:4px 10px">✕ 关闭</button>
    </div>
    <div class="syntax-modal-body" id="syntaxModalContent"></div>
  </div>

  <!-- Pure Structured JSON Database Bridge & In-Browser Dictionary -->
  <script src="data/all_data.js"></script>
  <script src="data/vocab_dict.js"></script>
  
  <!-- Modular JS Application Components -->
  <script src="js/storage.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
