<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>考研英语二 (2010-2023) 历年真题精读与复盘交互系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand-section">
        <div class="brand-title">
          <span class="brand-icon">📚</span>
          <span>考研英语二</span>
          <span class="brand-badge">2010-2023</span>
        </div>
        
        <div class="selector-group">
          <select id="yearSelect" class="custom-select" title="选择年份"></select>
          <select id="textSelect" class="custom-select" title="选择篇章"></select>
        </div>
      </div>
      
      <!-- Mode Toggle Switch -->
      <div class="mode-switch-group">
        <button id="practiceModeBtn" class="mode-btn active practice-mode" title="切换至做题模式（意群粗读+选项推演+交叉验证）">🔵 做题模式</button>
        <button id="reviewModeBtn" class="mode-btn review-mode" title="切换至复盘模式（一石五鸟：词汇+精读长难句+命题复盘+新题型+写作）">🟣 复盘模式</button>
      </div>

      <!-- Action Controls for Desktop -->
      <div class="controls-group">
        <select id="jumpSelect" class="custom-select" style="max-width:160px;"></select>
        <button id="toggleAllBtn" class="btn" title="切换显示全部或分步交互 (快捷键: F)">显示全部</button>
        <button id="prevBtn" class="btn desktop-only" title="上一步 (快捷键: ←)">上一步</button>
        <button id="nextBtn" class="btn primary desktop-only" title="下一步 (快捷键: → / 空格)">下一步</button>
        <button id="resetBtn" class="btn desktop-only" title="重置本篇进度 (快捷键: R)">重置</button>
        <div id="progressText" class="progress-tag desktop-only">1 / 75</div>
        
        <select id="themeSelect" class="custom-select theme-select">
          <option value="light">☀️ 浅色</option>
          <option value="parchment">📜 羊皮纸</option>
          <option value="dark">🌙 夜间</option>
        </select>
      </div>
    </div>

    <!-- Mobile Panel Switch Tabs (Visible on screens <= 900px) -->
    <div class="mobile-tabs-bar" id="mobileTabsBar">
      <button class="mobile-tab-btn" id="tabLeftBtn" data-panel="left">📖 试卷原文</button>
      <button class="mobile-tab-btn active" id="tabRightBtn" data-panel="right">🧠 思维工作台</button>
    </div>
  </header>

  <!-- Main Layout Container -->
  <main class="layout show-right" id="mainLayout">
    
    <!-- Left Panel: Exam Paper (Article & Questions) -->
    <section class="panel left-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>📖 考场标准试卷视图</span>
        </div>
        <span class="panel-hint">同步联动高亮与定位</span>
      </div>
      <div class="scroll-container" id="leftScroll">
        <div class="exam-paper" id="examPaper">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </section>

    <!-- Right Panel: Thinking & Review Workspace -->
    <section class="panel right-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>🧠 思维推演与多维复盘工作台</span>
        </div>
        <span class="panel-hint desktop-only">快捷键：← 上一步 ｜ → / 空格 下一步 ｜ M 切换模式</span>
      </div>
      <div class="scroll-container" id="rightScroll">
        <div class="workspace" id="workspaceContent">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </section>

  </main>

  <!-- Floating Bottom-Right Action Controls (Optimized for Mobile/Tablet) -->
  <div class="floating-nav-bar" id="floatingNavBar">
    <button id="floatPrevBtn" class="float-btn" title="上一步 (快捷键: ←)">
      <span class="float-arrow">‹</span>
      <span class="float-label">上一步</span>
    </button>
    <div id="floatProgressText" class="float-progress">1 / 66</div>
    <button id="floatNextBtn" class="float-btn primary" title="下一步 (快捷键: → / 空格)">
      <span class="float-label">下一步</span>
      <span class="float-arrow">›</span>
    </button>
  </div>

  <!-- Database & Module Scripts -->
  <script src="data/manifest.js"></script>
  <script src="data/year_2010.js"></script>
  <script src="data/year_2011.js"></script>
  <script src="data/year_2012.js"></script>
  <script src="data/year_2013.js"></script>
  <script src="data/year_2014.js"></script>
  <script src="data/year_2015.js"></script>
  <script src="data/year_2016.js"></script>
  <script src="data/year_2017.js"></script>
  <script src="data/year_2018.js"></script>
  <script src="data/year_2019.js"></script>
  <script src="data/year_2020.js"></script>
  <script src="data/year_2021.js"></script>
  <script src="data/year_2022.js"></script>
  <script src="data/year_2023.js"></script>
  <script src="data/db.js"></script>
  <script src="js/render_practice.js"></script>
  <script src="js/render_review.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
